name: Load stage-scoped secrets
description: >-
    Load the Clerk/auth keys for a given stage (sandbox|prod) from AWS Secrets Manager into $GITHUB_ENV, with the
    credentials `awsAuth` set earlier in the job. Single source of truth for CI secret loading so PR pipelines use
    sandbox secrets and main pipelines use prod secrets.

# ⛔ IT DOES NOT SIGN IN. A job runs `./.github/actions/awsAuth` first, once, and gates this step on its
# `authenticated` output; `awsCredentialsFederated.test.ts` refuses a job that uses this action without signing in
# first. Signing in here too would hide the tier from the job, which is where the guard judges it.
#
# @pattern Facade — composed after awsAuth: one step that turns a stage into the environment every consumer reads

inputs:
    stage:
        description: Deployment stage — 'sandbox' (PR pipelines) or 'prod' (main pipeline)
        required: true

runs:
    using: composite
    steps:
        - name: Refuse to run before awsAuth
          shell: bash
          run: |
              set -euo pipefail
              if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_REGION:-}" ]; then
                  echo "::error::no AWS credentials in this job — run ./.github/actions/awsAuth before load-secrets"
                  exit 1
              fi

        - name: Load auth keys for stage
          shell: bash
          env:
              STAGE: ${{ inputs.stage }}
          run: |
              set -euo pipefail
              if [ "$STAGE" != "sandbox" ] && [ "$STAGE" != "prod" ]; then
                  echo "::error::Invalid stage '$STAGE' — expected 'sandbox' or 'prod'"
                  exit 1
              fi

              SECRET=$(aws secretsmanager get-secret-value \
                  --secret-id "kitchensink/${STAGE}/identity/keys" \
                  --query SecretString --output text)

              PUBLISHABLE_KEY=$(echo "$SECRET" | jq -r '.PUBLISHABLE_KEY')
              SECRET_KEY=$(echo "$SECRET" | jq -r '.SECRET_KEY')
              WEBHOOK_SECRET=$(echo "$SECRET" | jq -r '.WEBHOOK_SIGNING_SECRET')

              if [ -z "$PUBLISHABLE_KEY" ] || [ "$PUBLISHABLE_KEY" = "null" ]; then
                  echo "::error::PUBLISHABLE_KEY missing from kitchensink/${STAGE}/identity/keys"
                  exit 1
              fi

              # Mask the non-public values before they touch the environment/logs.
              echo "::add-mask::$SECRET_KEY"
              echo "::add-mask::$WEBHOOK_SECRET"

              # Publishable key is public (shipped to clients); the rest are masked above.
              # Export every alias the apps + tests read so one secret serves all consumers.
              {
                  # ⚠️ The UNPREFIXED alias was missing, and its absence was invisible: the only
                  # consumer (`mintLinkageCredentials.ts`, which decodes the FAPI host from it) sat
                  # behind a repository-variable gate, so the job that would have failed never ran.
                  echo "CLERK_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
                  echo "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
                  echo "EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
                  echo "EXPO_PUBLIC_IDP_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
                  echo "IDP_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
                  echo "CLERK_SECRET_KEY=$SECRET_KEY"
                  echo "IDP_SECRET_KEY=$SECRET_KEY"
                  echo "CLERK_WEBHOOK_SECRET=$WEBHOOK_SECRET"
                  echo "IDP_WEBHOOK_SECRET=$WEBHOOK_SECRET"
              } >> "$GITHUB_ENV"

              echo "Loaded auth keys for stage '$STAGE'."
