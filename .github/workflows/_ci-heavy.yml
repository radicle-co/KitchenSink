name: CI — heavy tiers (reusable)

# The HEAVY test tiers: mobile Maestro (Android emulator + Gradle APK build) and the recipe + food +
# identity k6 load tests. Parameterized by `stage`, and called ONLY by heavy-e2e.yml /
# recipe-loadtest.yml / ci-full.yml — never by ci-pr.yml or ci-main.yml.
#
# ## Why these three jobs live in their OWN reusable workflow
#
# They used to sit in `_ci.yml` behind `run_mobile_maestro` / `run_load_test` inputs that defaulted to
# false, with a `run_base_jobs` input to stop a heavy-only caller re-running the base tier. That worked,
# but GitHub renders EVERY job of a called workflow in EVERY caller's run graph regardless of its `if:` —
# so each ordinary PR run displayed three permanently-`skipped` entries. A reader clicking one sees a job
# that never runs and no explanation, which reads as a broken pipeline rather than a deliberate tier. The
# `if:`-gate cannot hide them; only moving the jobs to a workflow those callers don't call can.
#
# Splitting the file also deletes the `run_*` plumbing outright: tier membership is now a property of
# WHICH reusable workflow a caller invokes, not of three booleans threaded through ~16 `if:` expressions.
#
# ## Why they are opt-in at all (cost + duration)
#
# Maestro boots an Android emulator and Gradle-builds a release APK (~50 min measured); the three k6 jobs
# build and boot three service images and drive minutes of sustained load. Together that is tens of
# runner-minutes per push, which contradicts the repo's cost posture (ADR-0007/ADR-0008). So they run
# nightly, on demand, or on a PR carrying the `heavy-e2e` label — and they are BLOCKING when they do run:
# a red load threshold or a broken on-device flow is a real defect.
#
# The k6 half has ONE further way in, which the emulator deliberately does not share: `heavy-e2e.yml` also
# switches `run_load_test` on automatically for a PR that touched food's measured query paths (T-198 — a pure
# latency regression such as a dropped index is invisible to every deterministic tier). The caller owns that
# decision and its rationale; nothing in this file needs to know which clause let the run through.
#
# ## Why `install` is duplicated from `_ci.yml`
#
# The heavy jobs restore the dependency cache `install` saves. A reusable workflow cannot `needs:` a job
# in a different workflow, so this file owns its own copy. On a labelled PR both workflows run `install`
# concurrently against the same `actions/cache` key — that is a benign no-op for the loser, and it is why
# the duplication is preferable to making heavy-e2e.yml call `_ci.yml` just to seed a cache (which is what
# re-introduced the double `e2e-web` collision this split removes for good).

on:
    workflow_call:
        inputs:
            stage:
                description: Deployment stage — 'sandbox' (PRs) or 'prod' (main)
                required: true
                type: string
            run_load_test:
                description: >-
                    Run the recipe + food + identity k6 load-test jobs. A caller opts each tier in
                    independently so `recipe-loadtest.yml` can run k6 without paying for the 50-minute
                    emulator job.
                required: false
                type: boolean
                default: true
            run_mobile_maestro:
                description: Run the mobile Maestro job (Android emulator + release APK).
                required: false
                type: boolean
                default: true
            maestro_flow_selector:
                description: >-
                    WHICH Maestro flows to run, as `<name>=true|false` pairs (`full`, plus one per flow
                    vertical — see `maestro_select_flows` in
                    packages/apps/commise/mobile/tests/e2e/run-maestro-flows.sh). Composed by
                    `heavy-e2e.yml` from what the PR changed.

                    The DEFAULT IS THE FAIL-SAFE and must stay that way: empty means "run every flow".
                    `ci-full.yml` and `recipe-loadtest.yml` call this workflow WITHOUT this input, and a
                    caller that says nothing must get the whole suite, never an empty run reporting green.
                    The script treats an absent, malformed or unattributed selector identically — it widens.
                required: false
                type: string
                default: ''

        # Declared EXPLICITLY rather than relying on the caller's `secrets: inherit`. `inherit` hands this
        # workflow every secret the repository holds, including ones it has no business seeing, and zizmor
        # flags it for that reason. These two are the only secrets any job here consumes (grepped), and both
        # are `required: false` so a fork or Dependabot PR still runs — the jobs degrade via their own
        # secret-presence check rather than failing on a missing input.
        secrets:
            AWS_ACCESS_KEY_ID:
                description: AWS access key id, used only to read stage-scoped secrets from Secrets Manager
                required: false
            AWS_SECRET_ACCESS_KEY:
                description: AWS secret access key paired with AWS_ACCESS_KEY_ID
                required: false

permissions:
    contents: read

env:
    DEFAULT_AWS_REGION: ${{ vars.DEFAULT_AWS_REGION }}

jobs:
    install:
        name: Install dependencies
        runs-on: ubuntu-latest
        # Owns its own copy because a reusable workflow cannot `needs:` a job in another workflow; every
        # heavy job below restores the cache this saves. See the file header.
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  # No job here performs a git push/fetch/remote operation (verified), so the
                  # checkout token is pure attack surface left in the workspace (zizmor: artipacked).
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - name: Cache dependencies
              uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                      packages/*/*/node_modules
                      packages/*/*/*/node_modules
                      packages/*/*/*/*/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

    e2e-mobile-maestro:
        name: E2E (mobile — Maestro) · heavy tier
        runs-on: ubuntu-latest
        needs: [install]
        # Cross-platform mandate: the Vitest mobile e2e (above) covers logic; Maestro drives the real UI
        # flows in packages/apps/commise/mobile/.maestro on an Android emulator. SELF-CONTAINED: it boots
        # the real recipe-service (the proven Docker image, dev-auth bypass) against a Postgres service on
        # the runner, provisions the shared Clerk sign-in test user, builds the Expo debug APK pointed at
        # the runner service via the emulator host alias (10.0.2.2), boots the emulator, installs the APK,
        # and runs the flows. The app still does REAL Clerk sign-in (sandbox dev instance); the service
        # ignores its token under the dev bypass, so no native-token verification is needed here.
        # Opt-out gate, not an opt-in one: this file's callers want the heavy tiers by default, and a
        # caller that wants ONLY k6 (recipe-loadtest.yml) passes `run_mobile_maestro: false`.
        if: ${{ inputs.run_mobile_maestro }}
        services:
            postgres:
                image: postgres:16 # zizmor: ignore[unpinned-images] — see the note in this file’s header
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: recipe_maestro
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  # No job here performs a git push/fetch/remote operation (verified), so the
                  # checkout token is pure attack surface left in the workspace (zizmor: artipacked).
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24
                  cache: npm
            - name: Restore dependencies
              uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                      packages/*/*/node_modules
                      packages/*/*/*/node_modules
                      packages/*/*/*/*/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
            # Clerk dev-instance keys (publishable for the APK, secret for provisioning the test user).
            - name: Load ${{ inputs.stage }} Clerk secrets
              id: secrets
              continue-on-error: true
              uses: ./.github/actions/load-secrets
              with:
                  stage: ${{ inputs.stage }}
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ env.DEFAULT_AWS_REGION }}
            # Idempotently ensure the shared sign-in test user exists in the Clerk dev instance (the flow
            # signs in with it; `+clerk_test` verifies with the fixed code 424242 — no real mailbox).
            - name: Provision Clerk sign-in test user
              if: steps.secrets.outcome == 'success'
              run: node packages/apps/commise/mobile/tests/e2e/ensure-signin-user.mjs
            # ── Maestro CLI: VERSION-PINNED and CHECKSUM-VERIFIED ──────────────────────────────────────
            # This step used to be `curl -Ls https://get.maestro.mobile.dev | bash`, which is wrong twice
            # over (code-quality backlog #139 — NOT a github.com issue number in this repo):
            #
            #   1. CORRECTNESS. It installs whatever is LATEST. The committed pixel baselines under
            #      `packages/apps/commise/mobile/.maestro/visual/baselines` are coupled to the screenshot
            #      pipeline and image-comparison engine of the CLI that recorded them, so an upstream
            #      release reds the visual tier with no change on our side — a red nobody can attribute to
            #      a diff, on the tier least able to explain itself. Pinning is the documented PREREQUISITE
            #      for activating those (currently inert) `.maestro/visual/` flows.
            #   2. SUPPLY CHAIN. This is a PUBLIC repo. Piping a mutable script from a third-party host
            #      into `bash` runs whatever that host serves at the moment CI runs — unreviewed,
            #      unrecorded, and with this job's environment (Clerk dev keys, AWS credentials) in reach.
            #
            # The upstream installer DOES honour `MAESTRO_VERSION` — verified by reading it: with the var
            # set it fetches `releases/download/cli-$MAESTRO_VERSION/maestro.zip`. But honouring it still
            # means executing the unpinned script, so problem 2 would stand. We therefore fetch the tagged
            # release asset directly; that also drops the installer's `java`/profile-editing prerequisites,
            # which this job does not need (JDK 17 is set up in the next step, after this one).
            #
            # INTEGRITY, stated precisely so nobody reads more into it than is there. Upstream publishes
            # `checksums_sha256.txt` beside `maestro.zip` in each release, and GitHub's own independently
            # computed asset digest for `cli-2.6.1` agrees with it (both
            # sha256:3440825f514f537c6a96bcf5de995780c2a4a7f83a43208fdc95d4f1fecfad3b, cross-checked
            # 2026-08-07). `MAESTRO_SHA256` below is that value. Upstream publishes NO signature and no
            # provenance attestation for this asset, so this is not authenticity: it proves the bytes are
            # the ones we pinned and reviewed, not that upstream was never compromised. A re-uploaded or
            # substituted asset fails the build instead of running — which is the guarantee that matters
            # here. (The installer's own "archive integrity" check is `unzip -t`: corruption, not identity.)
            #
            # 2.6.1 is the version this repo develops against locally, i.e. the one the baselines will be
            # recorded with. BUMPING IT IS A DELIBERATE ACT: change both values together (the new digest
            # comes from that release's `checksums_sha256.txt`) and re-record the baselines in the SAME PR.
            # `packages/infra/global/__tests__/workflowProvenance.test.ts` fails if the version stops being
            # a literal, if the URL stops using the pinned tag, or if the digest check disappears.
            #
            # The install LAYOUT deliberately matches the official installer's ($HOME/.maestro/{bin,lib}):
            # the report artifact below reads `~/.maestro/tests`, and `bin/maestro` is a Gradle start script
            # that resolves `lib/` relative to itself. Staging under $HOME and `mv`-ing is a same-filesystem
            # rename rather than a copy, and the archive is deleted immediately — this job's disk budget is
            # nearly spent by the emulator system image (see the note further down).
            - name: Install Maestro CLI (pinned)
              if: steps.secrets.outcome == 'success'
              env:
                  MAESTRO_VERSION: '2.6.1'
                  MAESTRO_SHA256: '3440825f514f537c6a96bcf5de995780c2a4a7f83a43208fdc95d4f1fecfad3b'
              run: |
                  set -euo pipefail
                  archive="$RUNNER_TEMP/maestro.zip"
                  curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
                      -o "$archive" \
                      "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
                  echo "${MAESTRO_SHA256}  ${archive}" | sha256sum --check --strict -
                  rm -rf "$HOME/.maestro" "$HOME/.maestro-stage"
                  unzip -q "$archive" -d "$HOME/.maestro-stage"
                  rm -f "$archive"
                  mv "$HOME/.maestro-stage/maestro" "$HOME/.maestro"
                  rmdir "$HOME/.maestro-stage"
                  # The archive must actually contain the version we pinned. Asserted by the versioned CLI
                  # jar rather than `maestro --version`, because that needs a JVM this step does not have
                  # yet and an output format upstream is free to change.
                  test -f "$HOME/.maestro/lib/maestro-cli-${MAESTRO_VERSION}.jar"
                  echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
            - name: Set up JDK 17
              if: steps.secrets.outcome == 'success'
              uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
              with:
                  distribution: temurin
                  java-version: '17'
            # Build the recipe service (+ shared deps) and the PROVEN Docker image — the reliable boot (a
            # plain `node` boot can't resolve the workspace bare specifiers outside the image).
            # Build the recipe-service image AND the mobile app's dependency closure: the release JS bundle
            # (built at APK-build time) imports `@commise/ui/tokens/*`, which resolves to that package's
            # built `dist` — so its dist (and any other dist-exporting workspace dep) must exist first.
            - name: Build recipe-service image + mobile deps
              if: steps.secrets.outcome == 'success'
              run: |
                  npx turbo run build --filter=@kitchensink/recipe-service --filter=@commise/mobile^...
                  docker build -f packages/services/recipe-service/Dockerfile -t recipe-maestro:ci .
            # Migrations + seed the catalog ingredients the create flows attach by id (T043b).
            # Migrations + catalog ingredients (prepare-db), THEN the recipe seed (the 5 fixture recipes +
            # a collection the flows reference, e.g. "Mediterranean Grilled Lamb"). The flows expect the
            # signer to be the seed's FREE owner, so the dev-bypass user below is that owner's ULID.
            - name: Prepare recipe database (migrate + seed)
              if: steps.secrets.outcome == 'success'
              env:
                  DATABASE_URL: postgres://postgres:postgres@localhost:5432/recipe_maestro
              run: |
                  node packages/services/recipe-service/tests/load/prepare-db.mjs
                  npm run seed --workspace=@kitchensink/recipe-service
            # Boot the service with the dev-auth bypass + raised rate limits (the flows all run as one dev
            # user = the seed's FREE owner, so they see the seeded recipes). Bound to the runner's
            # localhost:3000; the emulator reaches it at http://10.0.2.2:3000.
            - name: Boot recipe-service (Docker, dev-bypass)
              if: steps.secrets.outcome == 'success'
              run: |
                  docker run -d --name recipe-maestro --network host \
                      -e NODE_ENV=development \
                      -e DATABASE_URL=postgres://postgres:postgres@localhost:5432/recipe_maestro \
                      -e PORT=3000 \
                      -e CLERK_JWT_KEY=maestro-placeholder-key \
                      -e CLERK_AUTHORIZED_PARTIES=http://localhost:3000 \
                      -e S3_ENDPOINT=http://localhost:4566 -e S3_FORCE_PATH_STYLE=true \
                      -e S3_BUCKET_PHOTOS=commise-photos -e S3_BUCKET_VERSIONS=commise-versions \
                      -e CLOUDFRONT_URL=http://localhost:4566/commise-photos \
                      -e SQS_ENDPOINT=http://localhost:4566 \
                      -e ACCOUNT_ERASURE_QUEUE_URL=http://localhost:4566/000000000000/erasure \
                      -e FOOD_SERVICE_URL=http://localhost:3002 \
                      -e RECIPE_DEV_AUTH_USER_ID=01J0K6000000000000000000K6 \
                      -e RATE_LIMIT_READ=1000000 -e RATE_LIMIT_WRITE=1000000 \
                      -e RATE_LIMIT_SEARCH=1000000 -e RATE_LIMIT_PHOTO_UPLOAD=1000000 \
                      recipe-maestro:ci
                  for i in $(seq 1 40); do
                      if curl -sf http://localhost:3000/health > /dev/null; then echo "service up"; break; fi
                      sleep 2
                  done
                  curl -sf http://localhost:3000/health || { echo "service did not boot"; docker logs recipe-maestro; exit 1; }
            # Build a standalone RELEASE APK (JS bundle EMBEDDED). A debug APK loads its JS from a Metro
            # bundler at runtime — absent in CI, so the app renders nothing. The release build bundles the
            # JS in-APK (with EXPO_PUBLIC_* inlined at build time → the emulator host alias for the
            # runner-local service), so it runs Metro-free. Expo prebuild signs `release` with the debug
            # keystore by default, so the APK installs without any keystore setup. Minification is disabled
            # to avoid proguard stripping something the E2E needs.
            - name: Build Android release APK
              if: steps.secrets.outcome == 'success'
              working-directory: packages/apps/commise/mobile
              env:
                  # 10.0.2.2 is the Android emulator's host loopback. Both endpoints are REQUIRED —
                  # `mobile/src/config/env.ts` declares them with no default, so the APK build fails
                  # outright if either is absent (that is the point: `localhost` on a phone is the phone).
                  EXPO_PUBLIC_RECIPE_API_URL: http://10.0.2.2:3000
                  # The app fetches the viewer PROFILE (viewerId → client-side ownership, tier) from the
                  # identity service; this job runs a stub for it on :4000 (see the stub step below).
                  EXPO_PUBLIC_IDENTITY_API_URL: http://10.0.2.2:4000
                  EXPO_PUBLIC_IDP_PUBLISHABLE_KEY: ${{ env.EXPO_PUBLIC_IDP_PUBLISHABLE_KEY }}
                  # The release build runs the @sentry/react-native gradle hook, which uploads source maps
                  # via sentry-cli; there is no Sentry auth token in E2E, so disable the upload.
                  SENTRY_DISABLE_AUTO_UPLOAD: 'true'
              run: |
                  npx expo prebuild --platform android --no-install
                  # Allow cleartext HTTP so the release APK can reach the runner-local recipe service at
                  # http://10.0.2.2:3000 (release blocks cleartext by default; debug allows it). This patch
                  # lives only in the CI working copy — it is NOT committed, so prod builds from app.json
                  # stay cleartext-free. (Clerk sign-in itself is HTTPS and unaffected.)
                  sed -i 's/<application /<application android:usesCleartextTraffic="true" /' \
                      android/app/src/main/AndroidManifest.xml
                  cd android && ./gradlew :app:assembleRelease --no-daemon \
                      -PenableProguardInReleaseBuilds=false -PenableShrinkResourcesInReleaseBuilds=false
            # The app's client-side ownership (Edit/Delete/clone) + tier come from the identity service's
            # profile endpoint, which this recipe-only job does not run — serve a fixed FREE profile whose
            # user.id equals the seed owner + dev-bypass user (01J0K6…) so ownership/tier resolve. Runs in
            # the background; the emulator reaches it at http://10.0.2.2:4000.
            - name: Start profile stub
              if: steps.secrets.outcome == 'success'
              run: |
                  PORT=4000 node packages/apps/commise/mobile/tests/e2e/profile-stub-server.mjs > /tmp/profile-stub.log 2>&1 &
                  for i in $(seq 1 15); do
                      if curl -sf http://localhost:4000/api/v1/users/me > /dev/null; then echo "stub up"; break; fi
                      sleep 1
                  done
                  curl -sf http://localhost:4000/api/v1/users/me || { echo "stub failed to start"; cat /tmp/profile-stub.log; exit 1; }
            # Hardware-accelerate the emulator (KVM). Without this the emulator falls back to slow software
            # rendering (a ~7min boot + ~4min APK install), which starves the Maestro Android driver and
            # times it out ("driver did not start up in time"). GitHub's Linux runners expose /dev/kvm but
            # need the group/permissions opened for the emulator process.
            - name: Enable KVM
              if: steps.secrets.outcome == 'success'
              run: |
                  echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
                      | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                  sudo udevadm control --reload-rules
                  sudo udevadm trigger --name-match=kvm
            # The emulator-runner installs a ~3 GB x86_64 system image; once the recipe-service Docker image,
            # mobile deps, and release APK are on disk the runner's ~14 GB budget is nearly spent, and the
            # install can abort with "No space left on device" (the emulator then never boots). The APK is
            # already built by this point, so reclaim the large toolchains this job never uses — but NOT
            # Docker (the recipe-service container is live) nor the Android platform-tools/emulator/system
            # images. This makes the emulator boot robust to runner-to-runner free-space variance.
            - name: Free disk space for the emulator system image
              if: steps.secrets.outcome == 'success'
              run: |
                  df -h /
                  sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift \
                      /usr/local/share/powershell /opt/hostedtoolcache/CodeQL \
                      /usr/local/lib/android/sdk/ndk || true
                  df -h /
            # Boot the emulator, install the APK, and run the flows. Install + test run INSIDE the
            # emulator-runner `script` (the emulator is only up there). `adb reverse` also maps the
            # emulator's own localhost:3000 to the runner, a belt-and-suspenders alongside 10.0.2.2.
            # A generous MAESTRO_DRIVER_STARTUP_TIMEOUT absorbs first-run driver-install latency.
            - name: Run Maestro flows on emulator
              if: steps.secrets.outcome == 'success'
              uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
              env:
                  MAESTRO_DRIVER_STARTUP_TIMEOUT: '300000'
                  # Per-vertical FLOW SELECTION, passed as an ENVIRONMENT VARIABLE and never expanded into
                  # the `script:` body below. That is not style: a `${{ … }}` interpolated into a shell body
                  # is the zizmor `template-injection` class, and `script:` is a shell body. The script reads
                  # `MAESTRO_FLOW_SELECTOR`, validates every pair, and widens to the FULL suite on anything it
                  # cannot read — so even a nonsense value costs runner-minutes, never coverage.
                  MAESTRO_FLOW_SELECTOR: ${{ inputs.maestro_flow_selector }}
              with:
                  api-level: 34
                  arch: x86_64
                  profile: pixel_6
                  cores: 3
                  ram-size: 4096M
                  emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none
                  disable-animations: true
                  # Use a hardware keyboard so text fields never raise the SOFT keyboard. Maestro's
                  # `hideKeyboard` sends a BACK keypress, which — when no soft keyboard is actually open —
                  # pops the navigation stack (and eventually exits the app to the launcher). With the soft
                  # keyboard suppressed there is nothing to hide, so the flows drop `hideKeyboard` entirely
                  # and BACK is never spuriously fired. (run-maestro-flows.sh also sets
                  # show_ime_with_hard_keyboard=0 as belt-and-suspenders.)
                  enable-hardware-keyboard: true
                  # The emulator-runner executes each `script` LINE as its own `sh -c`, so the per-flow loop
                  # (reseed → run one flow, in isolation) lives in a committed script invoked in one line.
                  script: bash packages/apps/commise/mobile/tests/e2e/run-maestro-flows.sh
            - name: Upload Maestro artifacts
              if: failure() && steps.secrets.outcome == 'success'
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: maestro-report-${{ inputs.stage }}
                  path: ~/.maestro/tests
                  retention-days: 7
                  if-no-files-found: ignore
            - name: Recipe-service error logs on failure
              if: failure()
              run: |
                  echo "--- recipe-service: NestJS error/exception lines ---"
                  docker logs recipe-maestro 2>&1 | grep -iE "error|exception|warn|400|422|500|Bad Request|Unprocessable|validation|ingredient|POST /api/v1/recipes" | tail -80 || true
            - name: Recipe-service logs on failure
              if: failure() && steps.secrets.outcome == 'success'
              run: docker logs recipe-maestro 2>&1 | tail -100 || true

    load-test:
        name: Load test (recipe — k6) · heavy tier
        runs-on: ubuntu-latest
        needs: [install]
        # T081/SC-009 performance gate. Gated behind `run_load_test` so the heavy k6 run never fires on an
        # ordinary PR / push pipeline — no such pipeline calls this file at all, and a caller that wants only
        # the emulator switches the input off. Reached via `heavy-e2e.yml` (nightly schedule, manual dispatch,
        # the `heavy-e2e` PR label, or a PR touching food's measured query paths) and `recipe-loadtest.yml`.
        # Boots the recipe-service against a Postgres + LocalStack service pair and runs ALL SEVEN tests/load
        # k6 scripts; a threshold breach exits k6 non-zero and fails the job.
        #
        # ⚠️ `run_load_test` covers ALL THREE k6 jobs, so the food-path auto-trigger runs this recipe job too.
        # That is accepted (bounded extra runner-minutes) rather than plumbed around with a per-service input.
        if: ${{ inputs.run_load_test }}
        services:
            postgres:
                image: postgres:16 # zizmor: ignore[unpinned-images] — see the note in this file’s header
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: recipe_load
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
            # Three of the seven scripts need REAL AWS-side state that a placeholder endpoint cannot provide:
            # `service-erasure` enqueues to SQS on its accept path (a dead endpoint would 500 the 202),
            # `version-archive-read` reads a snapshot the fixture PUTs to S3, and `save-under-archive`
            # measures save latency *while the archive is queued*. LocalStack Community covers S3 + SQS.
            localstack:
                image: localstack/localstack:4.4.0 # zizmor: ignore[unpinned-images] — see the note in this file’s header
                env:
                    SERVICES: s3,sqs
                    # Path-style SQS URLs (http://localhost:4566/000000000000/<name>) so the queue the
                    # bootstrap step creates is addressable at the exact ACCOUNT_ERASURE_QUEUE_URL the
                    # service is booted with. The default `standard` strategy would hand back a
                    # sqs.<region>.localhost.localstack.cloud host instead.
                    SQS_ENDPOINT_STRATEGY: path
                ports:
                    - 4566:4566
                options: >-
                    --health-cmd "curl -sf http://localhost:4566/_localstack/health | grep -q available"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 20
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  # No job here performs a git push/fetch/remote operation (verified), so the
                  # checkout token is pure attack surface left in the workspace (zizmor: artipacked).
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24
                  cache: npm
            - name: Restore dependencies
              uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                      packages/*/*/node_modules
                      packages/*/*/*/node_modules
                      packages/*/*/*/*/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
            - name: Install k6
              run: |
                  sudo gpg -k
                  sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
                      --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
                  echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
                      | sudo tee /etc/apt/sources.list.d/k6.list
                  sudo apt-get update
                  sudo apt-get install -y k6
            # Build the service AND its shared deps (turbo `^build`), so the Dockerfile can COPY their
            # dist + prod.package.json. A plain `node dist/src/main.js` boot cannot resolve the workspace
            # `@kitchensink/*` bare specifiers outside the image (the src-exports/.js tangle), so we boot the
            # PROVEN Docker image instead — the same artifact prod runs.
            - name: Build recipe-service (+ shared deps)
              run: npx turbo run build --filter=@kitchensink/recipe-service
            - name: Build recipe-service image
              run: docker build -f packages/services/recipe-service/Dockerfile -t recipe-load:ci .
            # Apply migrations + seed the catalog ingredients the load payloads attach by id. MANDATORY:
            # since T043b every create validates each line's ingredientId, so without these every write 400s
            # and trips the k6 failure-rate threshold.
            - name: Prepare load database
              env:
                  DATABASE_URL: postgres://postgres:postgres@localhost:5432/recipe_load
              run: node packages/services/recipe-service/tests/load/prepare-db.mjs
            # The S3 buckets + the account-erasure SQS queue the booted service and the fixture step address.
            # LocalStack starts with an EMPTY account, so without this the erasure accept path's SendMessage
            # fails (NonExistentQueue → 500, not the asserted 202) and the archive PUT fails (NoSuchBucket).
            - name: Bootstrap LocalStack (S3 buckets + account-erasure queue)
              env:
                  AWS_ACCESS_KEY_ID: test
                  AWS_SECRET_ACCESS_KEY: test
                  AWS_DEFAULT_REGION: us-east-1
              run: |
                  aws --endpoint-url=http://localhost:4566 s3 mb s3://commise-photos
                  aws --endpoint-url=http://localhost:4566 s3 mb s3://commise-versions
                  aws --endpoint-url=http://localhost:4566 sqs create-queue --queue-name erasure
                  # Fail loudly HERE (with the actual URL in the log) rather than as an opaque k6 threshold
                  # breach if the queue is not addressable where the service is pointed. Asserted on the PATH
                  # only, deliberately: the SQS client overrides the host via SQS_ENDPOINT and uses just the
                  # queue URL's account/name path, so the host LocalStack echoes back is immaterial.
                  QUEUE_URL=$(aws --endpoint-url=http://localhost:4566 sqs get-queue-url \
                      --queue-name erasure --query QueueUrl --output text)
                  echo "erasure queue: ${QUEUE_URL}"
                  case "${QUEUE_URL}" in
                      */000000000000/erasure) ;;
                      *) echo "queue path does not match ACCOUNT_ERASURE_QUEUE_URL's /000000000000/erasure"; exit 1 ;;
                  esac
            # W8-a.7 fixture for `versionArchiveRead.load.js`: a public recipe whose version 1 exists ONLY
            # in the S3 archive (its recipe_versions row is deliberately absent), so every GET is forced down
            # the transparent S3-fallback branch the script measures. k6 cannot seed Postgres or S3 itself.
            # Idempotent (fixed ids, ON CONFLICT DO NOTHING); needs the migrated DB + the versions bucket.
            - name: Seed the version-archive fixture
              env:
                  DATABASE_URL: postgres://postgres:postgres@localhost:5432/recipe_load
                  S3_ENDPOINT: http://localhost:4566
                  S3_FORCE_PATH_STYLE: 'true'
                  S3_BUCKET_VERSIONS: commise-versions
              run: npx tsx packages/services/recipe-service/tests/load/prepareVersionArchiveFixture.ts
            # CR-002 / U4a: mint the EdDSA service-erasure token pool + a THROWAWAY keypair. k6's goja runtime
            # cannot sign Ed25519, so the tokens are minted here and loaded by the script via `open()`.
            #
            # ORDERING IS LOAD-BEARING: this step generates a fresh keypair and writes the SPKI public key the
            # service must be booted trusting, so it MUST precede the boot step. The minted tokens are
            # single-target and short-lived (120s — the verifier's contract max, deliberately not extendable),
            # which is why the erasure script runs FIRST among the k6 scripts, on a shortened shape (see the
            # k6 step). Owners are synthetic, ULID-shaped and non-existent, so every erase is a harmless
            # no-op that touches no real data.
            - name: Mint the service-erasure token pool
              run: npx tsx packages/services/recipe-service/tests/load/prepareErasureTokens.ts
            # Boot the image with the dev-auth bypass (RECIPE_DEV_AUTH_USER_ID) so the load needs no live
            # Clerk token, and with the per-user rate limits raised — the whole load is ONE dev user, so the
            # default RATE_LIMIT_* (120/30/60) would 429 under concurrency and fail the status checks. S3/SQS
            # now point at the LocalStack service container (real buckets + a real queue), and
            # RECIPE_SERVICE_PRINCIPAL_JWT_KEY carries the public half of the keypair minted above so the
            # ServiceErasureGuard trusts the load's tokens (and still fails closed on the expired one).
            - name: Boot recipe-service (Docker, dev-bypass)
              run: |
                  docker run -d --name recipe-load --network host \
                      -e NODE_ENV=development \
                      -e DATABASE_URL=postgres://postgres:postgres@localhost:5432/recipe_load \
                      -e PORT=3000 \
                      -e CLERK_JWT_KEY=load-test-placeholder-key \
                      -e CLERK_AUTHORIZED_PARTIES=http://localhost:3000 \
                      -e AWS_REGION=us-east-1 \
                      -e S3_ENDPOINT=http://localhost:4566 -e S3_FORCE_PATH_STYLE=true \
                      -e S3_BUCKET_PHOTOS=commise-photos -e S3_BUCKET_VERSIONS=commise-versions \
                      -e CLOUDFRONT_URL=http://localhost:4566/commise-photos \
                      -e SQS_ENDPOINT=http://localhost:4566 \
                      -e ACCOUNT_ERASURE_QUEUE_URL=http://localhost:4566/000000000000/erasure \
                      -e FOOD_SERVICE_URL=http://localhost:3002 \
                      -e RECIPE_SERVICE_PRINCIPAL_JWT_KEY="$(cat packages/services/recipe-service/tests/load/erasure-public-key.pem)" \
                      -e RECIPE_DEV_AUTH_USER_ID=01JLOAD000000000000000000A \
                      -e RATE_LIMIT_READ=1000000 -e RATE_LIMIT_WRITE=1000000 \
                      -e RATE_LIMIT_SEARCH=1000000 -e RATE_LIMIT_PHOTO_UPLOAD=1000000 \
                      recipe-load:ci
                  for i in $(seq 1 40); do
                      if curl -sf http://localhost:3000/health > /dev/null; then echo "service up"; break; fi
                      sleep 2
                  done
                  curl -sf http://localhost:3000/health || { echo "service did not boot"; docker logs recipe-load; exit 1; }
            # The erasure scenario runs FIRST and on a SHORTENED shape (15s ramp + 25s hold + 10s down = 50s
            # against the tokens' 120s TTL, ~25s of which the boot above already consumed). The thresholds are
            # unchanged by the shape — per tests/load/README.md the peak/duration are env-driven precisely so
            # a CI smoke shape and a distributed full-scale run share one pass/fail bar — so this trades only
            # sample count, never strictness, and it removes the token-expiry flake class entirely. Running it
            # last on the default 105s shape would expire the pool mid-run and fail on 401s.
            - name: Run k6 service-erasure load script (CR-002 / U4a)
              working-directory: packages/services/recipe-service
              env:
                  RECIPE_API_BASE_URL: http://localhost:3000
                  RECIPE_LOAD_RAMP_UP: 15s
                  RECIPE_LOAD_HOLD: 25s
                  RECIPE_LOAD_RAMP_DOWN: 10s
              run: k6 run --summary-export=k6-erasure-summary.json tests/load/serviceErasure.load.js
            # `ingredient-suggest-latency` (search Stage 2 / F2) needs NO prepare step of its own: the catalog
            # ingredients `prepare-db.mjs` already seeded are the local half of the blend, and the food-catalog
            # half is deliberately left UNREACHABLE here — `FOOD_SERVICE_URL` is set to http://localhost:3002
            # above with nothing listening on it. (It is set EXPLICITLY, not defaulted: since issue #120 the
            # variable is required with no in-code fallback, because that fallback is what silently pointed the
            # deployed service at itself.) An unreachable food service is the exact worst case the script exists
            # to defend: the blend must bound the failing catalog read and degrade to local-only
            # (`catalogAvailability: 'unavailable'`) while still answering 200, so its strict `http_req_failed`
            # threshold is what proves the F2 fallback never leaks the dependency's failure to the caller.
            #
            # NOTE the load container runs with the dev-auth bypass, so requests carry NO bearer — and recipe now
            # calls food AS THE CALLER. With no credential to forward the gateway degrades WITHOUT issuing a
            # request, so this scenario measures the short-circuit path rather than the transport timeout; the
            # timeout itself is proven in `__tests__/integration/ingredients/blendedSuggest.integration.test.ts`
            # and `foodTokenForwarding.integration.test.ts`. Do NOT set FOOD_CATALOG_BLEND_ENABLED=false here —
            # that reports 'disabled' and skips the cross-service call entirely, silently retiring the behavior
            # under test.
            - name: Run k6 load scripts
              working-directory: packages/services/recipe-service
              env:
                  RECIPE_API_BASE_URL: http://localhost:3000
              run: |
                  k6 run --summary-export=k6-sc009-summary.json tests/load/sc009ReadWrite.load.js
                  k6 run --summary-export=k6-search-summary.json tests/load/searchLatency.load.js
                  k6 run --summary-export=k6-suggest-summary.json tests/load/ingredientSuggestLatency.load.js
                  k6 run --summary-export=k6-save-summary.json tests/load/saveUnderArchive.load.js
                  k6 run --summary-export=k6-pull-summary.json tests/load/pullFromSource.load.js
                  k6 run --summary-export=k6-version-archive-summary.json tests/load/versionArchiveRead.load.js
            - name: Upload k6 summaries
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: recipe-k6-summaries-${{ inputs.stage }}
                  path: packages/services/recipe-service/k6-*-summary.json
                  retention-days: 7
                  if-no-files-found: warn
            # A k6 threshold breach reports only latency/status aggregates; the service-side exception that
            # caused a 500 (a missing queue, an S3 error, a rejected token) is only in the container log.
            - name: Recipe-service logs on failure
              if: failure()
              run: docker logs recipe-load 2>&1 | tail -150 || true

    load-test-food:
        name: Load test (food — k6) · heavy tier
        runs-on: ubuntu-latest
        needs: [install]
        # CR-002 / U4b performance gate for food's internal service-principal erasure route, PLUS the T-195
        # SC-001/003/004/005/007 tier — the food mirror of the recipe `load-test` job, gated behind the SAME
        # `run_load_test` input so both heavy k6 runs fire together (nightly / manual / `heavy-e2e` PR label /
        # a PR touching food's measured query paths) and never on an ordinary PR push. This is the job the
        # automatic path exists FOR: the SC-007 search script here is what catches a latency regression that
        # every deterministic tier passes straight through.
        #
        # SIMPLER than the recipe job by design: food's erase is a SYNCHRONOUS indexed DELETE on
        # `fetch_requesters` with no SQS hand-off and no S3, so this needs only a migrated Postgres — no
        # LocalStack (see packages/services/food-service/tests/load/README.md).
        if: ${{ inputs.run_load_test }}
        services:
            postgres:
                image: postgres:16 # zizmor: ignore[unpinned-images] — see the note in this file’s header
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: food_load
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  # No job here performs a git push/fetch/remote operation (verified), so the
                  # checkout token is pure attack surface left in the workspace (zizmor: artipacked).
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24
                  cache: npm
            - name: Restore dependencies
              uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                      packages/*/*/node_modules
                      packages/*/*/*/node_modules
                      packages/*/*/*/*/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
            - name: Install k6
              run: |
                  sudo gpg -k
                  sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
                      --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
                  echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
                      | sudo tee /etc/apt/sources.list.d/k6.list
                  sudo apt-get update
                  sudo apt-get install -y k6
            # Build the service AND its shared deps (turbo `^build`) so the Dockerfile can COPY their dist +
            # prod.package.json, then build the PROVEN image — a plain `node dist/src/main.js` boot cannot
            # resolve the workspace `@kitchensink/*` bare specifiers outside the image. Mirrors the recipe job.
            - name: Build food-service (+ shared deps)
              run: npx turbo run build --filter=@kitchensink/food-service
            # Rewrite the food package.json exports/main to ./dist — the image COPYs prod.package.json over
            # the committed package.json (which exports ./src). Mirrors sandbox-deploy.yml's food image build.
            - name: Prepare food-service prod manifest
              run: npm run docker:prepare --workspace=packages/services/food-service
            - name: Build food-service image
              run: docker build -f packages/services/food-service/Dockerfile -t food-load:ci .
            # Apply the hand-authored, ordered food schema DDL (src/db/migrations/*.sql — the same source of
            # truth tests/support/db.ts applies) to the throwaway DB. The erasure route DELETEs from
            # `fetch_requesters`, so without the schema every request 500s instead of returning 200.
            - name: Apply food schema migrations
              env:
                  PGHOST: localhost
                  PGPORT: '5432'
                  PGUSER: postgres
                  PGPASSWORD: postgres
                  PGDATABASE: food_load
              run: |
                  psql -v ON_ERROR_STOP=1 -c 'DROP SCHEMA IF EXISTS public CASCADE; CREATE SCHEMA public;'
                  for f in packages/services/food-service/src/db/migrations/*.sql; do
                      echo "applying $f"
                      psql -v ON_ERROR_STOP=1 -f "$f"
                  done
            # Mint the EdDSA token pool + a throwaway keypair BEFORE the boot, which must trust the public
            # half. Same ordering constraint (and same 120s contract-max TTL) as the recipe job.
            - name: Mint the food service-erasure token pool
              run: npx tsx packages/services/food-service/tests/load/prepareErasureTokens.ts
            # Mint the Clerk RS256 pool the T-195 SC scripts present. Also BEFORE the boot: the container is
            # given the public half as CLERK_JWT_KEY, so a pool minted afterwards would verify against a key
            # the service does not hold and every read would be a 401. Neither pool is in the repo (both are
            # gitignored live credentials), so this job MUST mint them and can never assume they exist.
            - name: Mint the food Clerk session-token pool (T-195)
              run: npx tsx packages/services/food-service/tests/load/prepareClerkTokens.ts
            # PORT=3000 (not food's 3002 default) so the script's FOOD_API_BASE_URL default host:port applies.
            # USDA_API_KEY is schema-required but never called on any measured path (search is local-only by
            # FR-009, reads never reach an adapter), so a dummy satisfies boot without any source traffic.
            # BOTH auth keys are supplied: the internal erasure route is guarded by FoodServiceErasureGuard
            # (EdDSA) while every /api/v1/foods/* route is guarded by FoodAuthGuard (Clerk RS256), and the
            # T-195 scripts measure the latter. CLERK_AUTHORIZED_PARTIES is the exact-match list mode the
            # minted `azp` claims — the production posture (ADR-0001), not the preview pattern.
            - name: Boot food-service (Docker)
              run: |
                  docker run -d --name food-load --network host \
                      -e NODE_ENV=development \
                      -e DATABASE_URL=postgres://postgres:postgres@localhost:5432/food_load \
                      -e PORT=3000 \
                      -e STAGE=load \
                      -e USDA_API_KEY=load-test-dummy-key \
                      -e FOOD_SERVICE_PRINCIPAL_JWT_KEY="$(cat packages/services/food-service/tests/load/erasure-public-key.pem)" \
                      -e CLERK_JWT_KEY="$(cat packages/services/food-service/tests/load/clerk-public-key.pem)" \
                      -e CLERK_AUTHORIZED_PARTIES=https://food-load.test \
                      food-load:ci
                  for i in $(seq 1 40); do
                      if curl -sf http://localhost:3000/health > /dev/null; then echo "service up"; break; fi
                      sleep 2
                  done
                  curl -sf http://localhost:3000/health || { echo "service did not boot"; docker logs food-load; exit 1; }
            # Shortened shape for the same reason as the recipe erasure run: the minted tokens live 120s (the
            # verifier's contract max), so a 50s run started right after boot never races the TTL. Thresholds
            # are shape-independent (see tests/load/README.md), so strictness is unchanged.
            #
            # ⚠️ THIS RUNS FIRST, and the ordering is load-bearing. The T-195 fixture seed below writes ~180,000
            # rows and takes ~15s+, which on a slower runner is enough to eat into the erasure pool's 120s TTL.
            # Erasure first means the short-TTL run happens while the pool is freshest.
            - name: Run k6 food service-erasure load script (CR-002 / U4b)
              working-directory: packages/services/food-service
              env:
                  FOOD_API_BASE_URL: http://localhost:3000
                  FOOD_LOAD_RAMP_UP: 15s
                  FOOD_LOAD_HOLD: 25s
                  FOOD_LOAD_RAMP_DOWN: 10s
              run: k6 run --summary-export=k6-erasure-summary.json tests/load/serviceErasure.load.js
            # ── T-195: SC-001 / SC-004 / SC-005 / SC-007 ────────────────────────────────────────────────
            # Seed the local store the SC scripts read. Deliberately AFTER the boot: the seeder is additive
            # and never drops the schema, precisely so the already-running container's pool is not left
            # holding sessions against dropped tables (see the script's docblock).
            - name: Seed the food performance fixture (50,000 RESOLVED foods)
              working-directory: packages/services/food-service
              env:
                  DATABASE_URL: postgres://postgres:postgres@localhost:5432/food_load
              run: npx tsx tests/load/preparePerfFixture.ts
            - name: Run k6 local-store read load script (SC-001 read p95, SC-004 serve rate)
              working-directory: packages/services/food-service
              env:
                  FOOD_API_BASE_URL: http://localhost:3000
              run: k6 run --summary-export=k6-local-store-read-summary.json tests/load/localStoreRead.load.js
            - name: Run k6 local-store throughput load script (SC-005 served reads/sec)
              working-directory: packages/services/food-service
              env:
                  FOOD_API_BASE_URL: http://localhost:3000
              run: |
                  k6 run --summary-export=k6-local-store-throughput-summary.json \
                      tests/load/localStoreThroughput.load.js
            - name: Run k6 search load script (SC-007 search p95 at 50,000 foods)
              working-directory: packages/services/food-service
              env:
                  FOOD_API_BASE_URL: http://localhost:3000
              run: k6 run --summary-export=k6-search-summary.json tests/load/search.load.js
            # The drain claim needs no HTTP service — it calls FetchQueueDao.leaseNext() against Postgres
            # directly (k6 cannot speak SQL). Split into TWO steps because they answer two different questions
            # and must be attributable separately in the run log.
            #
            # ⚠️ BOTH CARRY `if: !cancelled()`, and that is NOT a softening — each still fails the job on a
            # breach (no `continue-on-error`, no `|| true`). It exists because the default implicit `success()`
            # made these steps hostage to the k6 steps ABOVE them, which measure a completely different thing.
            # Observed on run 31451273786: the SC-007 `narrow` search shape crossed its budget (258.74ms vs
            # 200ms) and BOTH drain steps were `skipped` — so the FR-046 ceiling probe, the one measurement
            # this branch exists to confirm, produced no number at all and the run reported only the search
            # failure. A pipeline that silently stops measuring the thing under investigation because
            # something unrelated failed first is the same "absence of work behind a status" class this repo
            # keeps paying for. `!cancelled()` (not `always()`) so a cancelled run still stops promptly.
            #
            # (1) The CONTRACT gate. SC-003 promises 202 -> RESOLVED within 60s p95 "when the fetch_queue
            #     pending-row depth is under 100 rows", so depth 100 is where the promise actually binds. This
            #     step is the regression bar for SC-003 and passes today (measured ~7ms p95 vs a 60ms budget).
            - name: Drain-claim SC-003 contract gate (depth 100, DSN-11)
              if: ${{ !cancelled() }}
              working-directory: packages/services/food-service
              env:
                  DATABASE_URL: postgres://postgres:postgres@localhost:5432/food_load
                  FOOD_DRAIN_DEPTHS: '100'
              run: npx tsx tests/load/drainDemotion.perf.ts
            # (2) The FR-046 CEILING probe — the measurement T-195's acceptance explicitly requires ("at the
            #     FR-046 10,000-row ceiling"). There is deliberately NO `continue-on-error` and no `|| true`: a
            #     step that reported success for an over-budget drain claim is exactly the class of silent-green
            #     failure this repo has already paid for.
            #
            #     HISTORY — this step has been red twice, for two different reasons, and both are recorded
            #     because the second was hidden by a stale note about the first.
            #
            #     (a) Pre-T-197: FR-043's demotion was a correlated `COUNT(*)` in the LEADING position of the
            #         ORDER BY, so `LIMIT 1` could not avoid it and `idx_fetch_queue_priority` was unusable.
            #         ~0.5s per claim at depth 1,000, ~7.5-11s at the ceiling. T-197's rewrite
            #         (`over_demand AS MATERIALIZED`, fairness moved into a WHERE filter) fixed that and took
            #         the ceiling to tens of milliseconds — but this comment was not updated, so it kept
            #         describing a query that no longer existed and was wrong by ~100x.
            #
            #     (b) T-197 left ONE case still linear in depth, and CI caught it (run 31323016643, budget
            #         p95 <= 60ms):
            #           depth  1,000 mixed        3.98ms  PASS      depth  1,000 adversarial  10.76ms  PASS
            #           depth 10,000 mixed       16.73ms  PASS      depth 10,000 adversarial  85.52ms  BREACH
            #         One series, breaching by 1.43x. In `adversarial` every row is demoted, so the promoted
            #         branch had to examine all 10,000 eligible rows before it could conclude the tier was
            #         empty — a QUERY-SHAPE cost, not a missing index. T-197 had recorded the probe as PASSING
            #         on a LOCAL 28.66ms and explicitly declined to materialize a per-requester count; CI
            #         hardware is ~2.4-3x slower, which is the whole gap between 28.66ms and 85.52ms. The
            #         depth-100 contract gate above kept ~12x headroom throughout, so SC-003 itself was never
            #         breached — this was FR-046 ceiling headroom.
            #
            #     T-201 RESOLVED (b) BY THE QUERY CHANGE, not by widening anything. `leaseNext` now derives
            #     `over_demand` from a `demand` CTE (so the threshold is still stated exactly once) and gates
            #     the promoted branch on a `promoted_ready` probe that answers "is any requester under the
            #     threshold AND holding eligible work" from the AGGREGATE — bounded by the distinct-requester
            #     count, not by queue depth — so an empty promoted tier leaves the branch `never executed`.
            #     Locally, through the real DAO: adversarial @10,000 41.70ms -> 7.20ms, @1,000 6.97ms ->
            #     4.03ms, mixed unchanged. Equivalence is proven by
            #     `drainClaimRankingDifferential.integration.test.ts` (drain order vs FR-043's literal
            #     ranking over 12 randomised queues) and the plan shape is asserted by
            #     `drainClaimScaling.integration.test.ts`.
            #
            #     CONFIRMED HERE (run 31451860784), before -> after, budget p95 <= 60ms:
            #       depth    100 mixed  4.78 ->  4.87ms      depth    100 adversarial   2.64 ->  2.65ms
            #       depth  1,000 mixed  3.98 ->  5.46ms      depth  1,000 adversarial  10.76 ->  3.91ms
            #       depth 10,000 mixed 16.73 -> 16.59ms      depth 10,000 adversarial  85.52 -> 10.81ms
            #     The breaching series is 7.9x faster and now sits 5.6x inside the budget. Worth noting the
            #     local prediction was 7.20ms against this 10.81ms: the ~3x hardware factor applies to the
            #     remaining per-claim aggregate as well, which is exactly why THIS STEP, not a dev machine,
            #     is the arbiter of the absolute numbers.
            #
            #     (c) 2026-08-12 (run 31608073724): `mixed` @10,000 reported 90.23ms p95 — and the query was
            #         NOT the cause. Its MEDIAN was 12.23ms, the second-fastest ever measured for that series
            #         and 22% faster than the 15.69ms of the confirming run above; the plan, its `never
            #         executed` branch and its buffer counts were all unchanged. Cause: the probe sampled
            #         n=30, where its nearest-rank "p95" IS the second-largest sample (and "p99" IS the max —
            #         hence `p99 == max` in every row it ever printed), combined with 30-170ms host stalls on
            #         the runner. Same run: `adversarial` @1,000 p50 3.55ms / p95 29.37ms. Run 31537195430:
            #         `mixed` @100 p50 2.31ms / p95 56.51ms, i.e. 94% of the budget at the depth where SC-003
            #         binds and where the statement does ~2ms of work. T-203 raised the sample default to 300
            #         (p95 is now the 16th-largest observation) and corrected the reporting, changing NO SQL,
            #         NO budget and NO fixture. The stall SOURCE on GitHub's runners is not diagnosed.
            #         The owner then granted a ±15% variance allowance on perf metrics (ruling 2026-08-12), so
            #         the ENFORCED ceiling is 60ms + 15% = 69ms, printed on every series. ⛔ That allowance is
            #         NOT what fixed this case and must not be read as the safety net: 90.23ms is 50% over the
            #         budget, not 15%. The n=300 estimator is the fix; the allowance is a margin on top of it.
            #
            #     WHEN IT BREACHES, DIAGNOSE BEFORE CHANGING ANYTHING — the step's own failure output leads
            #     with the host-stall signature for this reason. Compare MEDIANS against the table in
            #     tests/load/README.md "Finding 2" FIRST: a median in family with earlier runs means the
            #     query is fine and the tail is the runner. If the median moved, the fix is the query — NOT
            #     raising FOOD_DRAIN_CLAIM_P95_MS, NOT adding `continue-on-error`, and NOT deleting this step.
            #     Owner decisions in tasks.md T-197 (gate stays at every depth) and T-203.
            - name: Drain-claim FR-046 ceiling probe (depths 1000+10000, DSN-11)
              if: ${{ !cancelled() }}
              working-directory: packages/services/food-service
              env:
                  DATABASE_URL: postgres://postgres:postgres@localhost:5432/food_load
                  FOOD_DRAIN_DEPTHS: '1000,10000'
              run: npx tsx tests/load/drainDemotion.perf.ts
            - name: Upload k6 summaries
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: food-k6-summaries-${{ inputs.stage }}
                  path: packages/services/food-service/k6-*-summary.json
                  retention-days: 7
                  if-no-files-found: warn
            - name: Food-service logs on failure
              if: failure()
              run: docker logs food-load 2>&1 | tail -150 || true

    load-test-identity:
        name: Load test (identity — k6) · heavy tier
        runs-on: ubuntu-latest
        needs: [install]
        # The NFR-011a / SC-005 / SC-006 / SC-007 performance gate for `@kitchensink/identity-service` — the
        # third k6 job, gated behind the SAME `run_load_test` input as recipe and food so the whole tier moves
        # together (nightly / manual / `heavy-e2e` PR label / a PR touching food's measured query paths) and
        # never fires on an ordinary PR push.
        #
        # WHY THIS EXISTS AT ALL. The four scripts under `packages/services/identity/tests/load/` were written,
        # reviewed and merged — and no job ran them, so identity was the one deployable HTTP service in this
        # repo whose §7.1-mandated k6 tier had never executed. That is not a cosmetic gap: identity has the
        # widest blast radius here (it is the ONE identity provider every preview and both stages sign in
        # against), and its budgets were previously "asserted" only by `tests/perf/latencyPerf.test.ts`, a
        # unit-tier vitest file that compares constants to themselves under no load. Proof the gap was real and
        # not theoretical: `tests/load/lib/common.js` documents an `open()` path bug found by READING rather
        # than running, explicitly "latent … because no CI job runs the identity tier yet".
        # `packages/infra/global/__tests__/k6LoadTierWiring.test.ts` now fails if any committed `.load.js`
        # is invoked by no workflow step, so this cannot silently recur for the next service.
        #
        # ⚠️ IT CONTACTS NO CLERK INSTANCE, AND THAT IS DELIBERATE — it is also why this job cannot collide
        # with `e2e-web`. Identity verifies Clerk session tokens NETWORKLESSLY against a pinned PEM
        # (`CLERK_JWT_KEY`) with `azp` enforcement, so `prepareClerkTokens.ts` mints the pools against a
        # THROWAWAY keypair and the container is booted trusting its public half. The real verifier, the real
        # `azp` boundary and the real read-through provisioning all run, with zero requests to Clerk. The
        # shared sandbox Clerk dev instance is a single per-IP rate limit — two concurrent suites against it
        # have already turned CI red for reasons unrelated to the code under test (measured on one commit:
        # 84 failures versus 89 green) — so this job takes no Clerk secret, needs no AWS credentials, and has
        # no `load-secrets` step. Do NOT "improve" it by provisioning real Clerk users.
        #
        # SIMPLER than the recipe job by design, like food's: none of these four scenarios touches S3 or SQS,
        # and the rename path's handle-sync publisher no-ops when `HANDLE_SYNC_TOPIC_ARN` is unset
        # (`users.module.ts`), so this needs only a migrated Postgres — no LocalStack.
        if: ${{ inputs.run_load_test }}
        services:
            postgres:
                image: postgres:16 # zizmor: ignore[unpinned-images] — see the note in this file’s header
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: identity_load
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  # No job here performs a git push/fetch/remote operation (verified), so the
                  # checkout token is pure attack surface left in the workspace (zizmor: artipacked).
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24
                  cache: npm
            - name: Restore dependencies
              uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                      packages/*/*/node_modules
                      packages/*/*/*/node_modules
                      packages/*/*/*/*/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
            - name: Install k6
              run: |
                  sudo gpg -k
                  sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
                      --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
                  echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
                      | sudo tee /etc/apt/sources.list.d/k6.list
                  sudo apt-get update
                  sudo apt-get install -y k6
            # Build the service AND its shared deps (turbo `^build`) so the Dockerfile can COPY their dist +
            # prod.package.json, then build the PROVEN image — a plain `node dist/src/main.js` boot cannot
            # resolve the workspace `@kitchensink/*` bare specifiers (identity's Dockerfile copies FOUR shared
            # dists: identity-utils, clerk-verify, identity-db, identity-core). Mirrors the recipe/food jobs
            # AND the identity image build in `prod-deploy.yml` / `sandbox-identity-deploy.yml`, which is the
            # authoritative recipe for this image.
            - name: Build identity-service (+ shared deps)
              run: npx turbo run build --filter=@kitchensink/identity-service
            # Rewrite the identity package.json exports/main to ./dist — the image COPYs prod.package.json
            # over the committed package.json (which exports ./src). Same step both identity deploy workflows
            # run before their `docker buildx build`.
            - name: Prepare identity-service prod manifest
              run: npm run docker:prepare --workspace=packages/services/identity
            - name: Build identity-service image
              run: docker build -f packages/services/identity/Dockerfile -t identity-load:ci .
            # Mint the RS256 Clerk pools + a THROWAWAY keypair. FIRST, and for two independent reasons:
            #   • the boot below is given the public half as CLERK_JWT_KEY, so a pool minted afterwards would
            #     verify against a key the service does not hold and every request would be a 401; and
            #   • `prepare-db` REFUSES to run without a readable pool whose warm size matches what it seeds
            #     (a surplus token names an unseeded `sub`, which the hot-path scenario would silently
            #     read-through-PROVISION and then report first-sight write latency as the steady-state read).
            # `clerk-tokens.json` and `clerk-public-key.pem` are gitignored live credential material, so this
            # job MUST mint them and can never assume a checkout provides them. Neither file is ever uploaded:
            # the artifact step below is scoped to `k6-*-summary.json` at the PACKAGE root, and
            # `k6LoadTierWiring.test.ts` fails if any upload path could capture the pool.
            - name: Mint the identity Clerk session-token pool
              working-directory: packages/services/identity
              run: npm run test:load:tokens
            # Apply the ordered `src/database/migrations/*.sql` and seed the three fixture sets the scenarios
            # need: the warm principals (so the hot path measures a steady-state read, not provisioning), the
            # admin principal, and 20,000 filler `users` rows — the `ilike '%needle%'` admin scan has no index
            # to use, so that population is what makes `adminUserSearch.load.js` able to FAIL. It also
            # ANALYZEs, so the measured plan is the one a real table would get. DROPs the `public` schema of
            # this runner-local throwaway database by design.
            - name: Prepare identity load database (migrate + seed)
              working-directory: packages/services/identity
              env:
                  DATABASE_URL: postgres://postgres:postgres@localhost:5432/identity_load
              run: npm run test:load:db
            # PORT=3001 — identity's OWN default (src/config/env.schema.ts) and the host:port the k6 scripts
            # default to, unlike the recipe/food jobs' 3000.
            #
            # STAGE=loadtest is a DEPLOYED stage as far as the env schema is concerned, which is the point: it
            # makes CLERK_JWT_KEY + exactly one `azp` mode REQUIRED, so the container fails to boot rather than
            # quietly skipping verification. CLERK_AUTHORIZED_PARTIES is the exact-match list mode the minted
            # `azp` claims — the production posture (ADR-0001), not the preview pattern.
            #
            # DELETION_QUEUE_URL is schema-required but never reached: `DELETE /api/v1/users/me` is
            # deliberately excluded from this tier (once per user lifetime, destructive, and it tombstones the
            # very principal presenting the token), so a syntactically valid URL satisfies boot with no SQS
            # traffic. HANDLE_SYNC_TOPIC_ARN is left UNSET so the rename path's publisher is the no-op.
            #
            # ⚠️ IDENTITY_DEV_AUTH_USER_ID is deliberately NOT set. That non-production bypass short-circuits
            # `AuthMiddleware` entirely — no token verification and no read-through provisioning — i.e. it
            # removes the two things this tier exists to measure. (The recipe jobs legitimately use their
            # equivalent, because recipe's load is about recipe routes, not about auth.) The mistake would not
            # be silent: under the bypass `authRejection.load.js`'s invalid credentials answer 200 and its
            # SC-006 check collapses.
            - name: Boot identity-service (Docker)
              run: |
                  docker run -d --name identity-load --network host \
                      -e NODE_ENV=development \
                      -e STAGE=loadtest \
                      -e PORT=3001 \
                      -e DATABASE_URL=postgres://postgres:postgres@localhost:5432/identity_load \
                      -e DELETION_QUEUE_URL=https://sqs.us-east-1.amazonaws.com/000000000000/identity-load-deletion \
                      -e CLERK_JWT_KEY="$(cat packages/services/identity/tests/load/clerk-public-key.pem)" \
                      -e CLERK_AUTHORIZED_PARTIES=https://identity-load.test \
                      identity-load:ci
                  for i in $(seq 1 40); do
                      if curl -sf http://localhost:3001/health > /dev/null; then echo "service up"; break; fi
                      sleep 2
                  done
                  curl -sf http://localhost:3001/health || { echo "service did not boot"; docker logs identity-load; exit 1; }
            # ── The four scenarios, in the ONE order that is valid ───────────────────────────────────────
            # ⚠️ SCRIPT ORDER IS LOAD-BEARING and is not a stylistic choice. It mirrors the package's own
            # `test:load` script (the authoritative ordering), and
            # `packages/infra/global/__tests__/k6LoadTierWiring.test.ts` fails if the two ever disagree:
            #
            #   1. `provisioning-and-rename` is the only WRITE-heavy script (it inserts thousands of users).
            #      Run earlier, it leaves Postgres autovacuuming and checkpointing DURING the read-sensitive
            #      scripts. Measured (tests/load/README.md): with the rejection script running immediately
            #      after it, `validUnderStorm` p95 was 722ms against a 500ms budget and rejection p95 263ms;
            #      on a settled database the same script measured 5.4ms and 1.5ms. That ~130x artefact is a
            #      red run that looks like a service defect and is not one.
            #   2. Its cold tokens are SINGLE-USE — only "cold" against a database that has never seen their
            #      `sub` — so running it last means the single `prepare-db` above covers the whole suite.
            #
            # Each script is its own step so the run graph attributes a failure to a scenario rather than to
            # one opaque "run k6" block, and each exports a summary: the p99 the plan's NFR-011a target is
            # stated in is enforced as a threshold, and a threshold whose VALUE you cannot read turns a
            # failure into a guess. A breach exits k6 non-zero and fails the step — no `continue-on-error`,
            # no `|| true`.
            - name: Run k6 session hot-path load script (NFR-011a profile p95/p99, readiness under load)
              working-directory: packages/services/identity
              env:
                  IDENTITY_API_BASE_URL: http://localhost:3001
              run: k6 run --summary-export=k6-hotpath-summary.json tests/load/sessionHotPath.load.js
            - name: Run k6 auth-rejection load script (SC-006, and the no-starvation guard)
              working-directory: packages/services/identity
              env:
                  IDENTITY_API_BASE_URL: http://localhost:3001
              run: k6 run --summary-export=k6-rejection-summary.json tests/load/authRejection.load.js
            - name: Run k6 admin-user-search load script (ilike scan vs the indexed probe)
              working-directory: packages/services/identity
              env:
                  IDENTITY_API_BASE_URL: http://localhost:3001
              run: k6 run --summary-export=k6-admin-search-summary.json tests/load/adminUserSearch.load.js
            # LAST, for the two reasons in the block above. Not reorderable.
            - name: Run k6 provisioning + rename load script (first-sight write path — runs LAST)
              working-directory: packages/services/identity
              env:
                  IDENTITY_API_BASE_URL: http://localhost:3001
              run: k6 run --summary-export=k6-provisioning-summary.json tests/load/provisioningAndRename.load.js
            # PACKAGE ROOT only. `--summary-export` writes here (k6 runs with this working directory), which is
            # deliberately NOT `tests/load/` — that directory holds `clerk-tokens.json`, thousands of live
            # bearer JWTs, and this repo is PUBLIC. Widening this path, or pointing it at a directory, is the
            # exfiltration this tier's guard test exists to prevent.
            - name: Upload k6 summaries
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: identity-k6-summaries-${{ inputs.stage }}
                  path: packages/services/identity/k6-*-summary.json
                  retention-days: 7
                  if-no-files-found: warn
            # A k6 threshold breach reports only latency/status aggregates; the service-side exception behind a
            # 500 (a pool exhaustion, a failed transaction, a rejected token) is only in the container log.
            # No `|| true`: GitHub runs `run:` under `bash -e` without `pipefail`, so the pipeline's status is
            # `tail`'s and a missing container cannot mask the real failure that triggered this step.
            - name: Identity-service logs on failure
              if: failure()
              run: docker logs identity-load 2>&1 | tail -150
