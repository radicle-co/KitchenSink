            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24
            - name: Restore dependencies
              uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                      packages/*/*/node_modules
                      packages/*/*/*/node_modules
                      packages/*/*/*/*/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
            # ⛔ A CACHE MISS MUST BE SLOW, NOT FATAL. These jobs restore `node_modules` and never install,
            # so before this step a miss did not degrade them — it killed them: no `node_modules` means no
            # `tsc`, and the build step died with `sh: 1: tsc: not found` / `npm error code 127`. Across the
            # 8 Playwright shards plus the merged report that turned ONE evicted cache entry into 9 red jobs,
            # and a re-run usually went green because `install` had re-saved the entry meanwhile — which is
            # exactly what made it look like flake instead of a missing fallback.
            #
            # The miss is real and expected: the repo's Actions cache sits under a 10 GB cap with LRU
            # eviction, and every lockfile change mints a fresh entry, so an in-flight run CAN have its entry
            # evicted underneath it. The `::warning::` keeps that visible — a silent reinstall would hide the
            # eviction rate, which is the number worth watching.
            - name: Install dependencies if the cache missed
              run: |
                  if [ -d node_modules ] && [ -n "$(ls -A node_modules 2>/dev/null)" ]; then
                      exit 0
                  fi
                  echo "::warning::node_modules cache miss (entry evicted or never saved) — running npm ci"
                  npm ci
            # Apply the recipe schema to the throwaway DB FIRST — the workers integration specs have no
            # globalSetup and assume the schema is present. This is the SAME set of ordered migration SQL
            # files recipe-service's tests/globalSetup.ts applies (drop `public`, then each file in
            # filename order), so the schema under test is byte-identical to the recipe-service run.
            - name: Apply recipe schema migrations to the throwaway DB
              env:
                  PGHOST: localhost
                  PGPORT: '5432'
                  PGUSER: postgres
                  PGPASSWORD: postgres
                  PGDATABASE: recipe_workers_test
              run: |
                  psql -v ON_ERROR_STOP=1 -c 'DROP SCHEMA IF EXISTS public CASCADE; CREATE SCHEMA public;'
                  for f in packages/services/recipe-service/src/database/migrations/*.sql; do
                      echo "applying $f"
                      psql -v ON_ERROR_STOP=1 -f "$f"
                  done
            # Drives the erasure/archive integration specs against the real, migrated Postgres + LocalStack
            # S3. The S3 clients hardcode `test`/`test` creds and force path-style addressing, so only the
            # endpoint + bucket names come from env; both are set for parity with `integration-recipe`.
            # The lambda BUNDLE must exist before the integration tier. `workersAppSynth.integration.test.ts`
            # spawns the real CDK app, and `RecipeWorkersStack` refuses to synth without `dist/` — it asserts
            # the bundle is present rather than deploying a phantom `lambda.Code.fromAsset`. That check is
            # correct; what was missing is that this job never built it, so the spec passed locally (where a
            # previous build had left `dist/` lying around) and failed in CI's clean checkout. Same class as
