                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
            localstack:
                image: localstack/localstack:4.4.0 # zizmor: ignore[unpinned-images] — see the note in this file’s header
                env:
                    # Community tier — no auth token. The workers' AWS surface is S3 only (SQS is driven
                    # via the exported seams, not a live queue), but the S3 family is free/Community.
                    SERVICES: s3,sqs
