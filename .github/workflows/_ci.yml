name: CI (reusable)

# Reusable CI pipeline, parameterized by `stage`. Called by ci-pr.yml (stage=sandbox) and
# ci-main.yml (stage=prod). All AWS/Clerk secret loading goes through the load-secrets composite
# action, which reads kitchensink/<stage>/identity/keys — so PR pipelines use sandbox secrets and the
# main pipeline uses prod secrets, with no duplicated secret-fetch logic.
#
# TIERS. This file is the BASE tier in full: install, then lint/format/typecheck/test/integration/
# build/e2e. The HEAVY tier (mobile Maestro + the recipe/food k6 load tests) lives in its own reusable
# workflow, `_ci-heavy.yml`, called only by heavy-e2e.yml / recipe-loadtest.yml / ci-full.yml.
#
# Those jobs used to live HERE behind `run_mobile_maestro` / `run_load_test` inputs, with a
# `run_base_jobs` input so a heavy-only caller could switch this tier off. Two reasons that is gone:
# GitHub renders every job of a called workflow in every caller's run graph regardless of `if:`, so each
# PR run showed three permanently-`skipped` jobs that read as a broken pipeline; and tier membership is
# better expressed by WHICH workflow a caller invokes than by booleans threaded through ~16 `if:` gates.
# The collision that `run_base_jobs` originally fixed — heavy-e2e.yml starting a SECOND concurrent
# `e2e-web` on the same commit, two Playwright suites tearing down each other's shared sandbox Clerk
# sign-in fixture — is now structurally impossible: heavy-e2e.yml no longer calls this file at all.
#
# Hardening path (requires repo/IAM setup, see docs/CI_ARCHITECTURE.md): move AWS auth to OIDC with
# two stage-scoped roles and adopt GitHub Environments so prod secrets are unreachable from PR runs.
#
# ⛔ JOB NAMING AND TIERS — `Integration (…)` / `Hermetic (…)` boot locally; `E2E (…)` drives the DEPLOYED
# per-PR sandbox and SKIPS when there is not one.
#
# An `Integration (…)` or `Hermetic (…)` job BOOTS ITS OWN TARGET on the runner: Postgres and LocalStack
# service containers, one or two Nest apps started beside the suite, an in-process Nest app over mocked
# `pg`/SQS. That tier proves the code honours its contracts against real backing stores, on every PR, as a
# hard merge gate (docs/CODING_STANDARDS.md §7.1). It is NOT an end-to-end test of the deployed system.
#
# `E2E (…)` is RESERVED for a job whose target is a REAL DEPLOYED environment — this pull request's
# `pr-{N}` sandbox. Owner ruling, 2026-09-04, verbatim:
#
#   > "all end to end tests (playwright, e2e, maestro, etc) - which should be hitting remote services -
#      should be skipped if the sandbox for the PR is not running. There should also be a manual job that I
#      can trigger that will run the end to end tests. … Right now the pipeline should be green because no
#      end to end tests were run"
#
# So every `E2E (…)` job below has NO service containers, NO local boot, NO migrations and NO seeding. Each
# resolves its target from `publicServiceOriginForStage` (never a host typed into YAML) and carries a
# job-level `if: needs.resolve-sandbox.outputs.live == 'true'`, so GitHub renders it **skipped** when this PR
# has no deployed sandbox: visually distinct from green, zero runner minutes, and never a red check for
# "there was nothing to talk to". ⛔ Do NOT make those gates skip-tolerant (`always()` / `!cancelled()`) —
# that runs the suite against thin air and turns "nothing to do" back into red.
#
# The MANUAL door of the ruling is `deployed-e2e.yml`, which owns the on-demand and production runs; nothing
# here may ever point a suite at production, which is why `resolve-sandbox` resolves an EMPTY stage (and so
# `live=false`) on any run without a pull request.
#
# The naming rule is asserted — a job whose displayed name says E2E while provisioning service containers,
# naming a `localhost` target, or naming no remote target at all fails
# `packages/infra/global/__tests__/workflowInvariants.test.ts` (invariant 7).
#
# ⚠️ The JOB KEYS still read `e2e-*` and must stay that way: `GITHUB_JOB` is folded into the run-scoped
# Clerk fixture identity by `deriveRunKey` (web `tests/e2e/utils/runFixtureIdentity.ts`), so renaming a key
# silently re-keys every fixture user. Keys are internal; the `name:` is what a reader and branch
# protection see.

on:
    workflow_call:
        inputs:
            stage:
                description: Deployment stage — 'sandbox' (PRs) or 'prod' (main)
                required: true
                type: string
        # Declared EXPLICITLY so callers can drop `secrets: inherit` (zizmor `secrets-inherit`), which
        # hands a called workflow every secret in the repository rather than the two it uses. These two are
        # the complete set this file consumes — they are the only `secrets.*` references in it, and they go
        # nowhere except the `load-secrets` composite action's inputs.
        #
        # `required: false` is deliberate, not laziness: GitHub WITHHOLDS secrets from fork PRs and
        # Dependabot runs, and this pipeline is built to degrade gracefully there — `load-secrets` carries
        # `continue-on-error` and the dependent steps gate on `steps.secrets.outcome` (see the inventory in
        # `workflowInvariants.test.ts`). Marking them required would turn that designed skip into an
        # unfixable red check on exactly the PRs that cannot supply them.
        secrets:
            AWS_ACCESS_KEY_ID:
                description: AWS access key id, used only to read stage-scoped secrets from Secrets Manager
                required: false
            AWS_SECRET_ACCESS_KEY:
                description: AWS secret access key paired with AWS_ACCESS_KEY_ID
                required: false

permissions:
    contents: read

env:
    DEFAULT_AWS_REGION: ${{ vars.DEFAULT_AWS_REGION }}
    # The apex, so no `E2E (…)` job below ever types a host into YAML. `food-loadtest.yml` shipped
    # `https://food-pr-59.commise.app` as a dispatch DEFAULT for months after PR 59 closed, and a stale
    # literal answers `000` — which reads as an outage rather than as a stale default.
    DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}

jobs:
    install:
        name: Install dependencies
        timeout-minutes: 15
        runs-on: ubuntu-latest
        # Seeds the `actions/cache` entry every job below restores. `_ci-heavy.yml` keeps its own copy of
        # this job: a reusable workflow cannot `needs:` a job in another workflow.
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24
                  cache: npm
            # `cache: npm` is KEPT here and removed from every restore-only job below, which is the split
            # that matters: this job runs `npm ci` and can actually use the tarball cache, while those jobs
            # restore the extracted `node_modules` entry and could never read it — they were each downloading
            # ~0.53 GB per run for nothing (~10.6 GB of pointless transfer across one CI run).
            #
            # It is kept rather than dropped because dropping it here reclaims NO quota: the same key is
            # written by `sandbox-deploy`, `sandbox-identity-deploy` and `sandbox-web-preview`, all of which
            # run on `pull_request`, so the entry exists for every lockfile hash regardless. Removing it would
            # only buy this critical-path job a cold `npm ci`. Accumulation is bounded by `cache-prune.yml`
            # instead, which is the mechanism that actually holds the repo under GitHub's 10 GB cap.
            - run: npm ci
            - name: Cache dependencies
              uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                      packages/*/*/node_modules
                      packages/*/*/*/node_modules
                      packages/*/*/*/*/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

    # ── Is there a deployed per-PR sandbox for the `E2E (…)` tier to drive? ───────────────────────────────
    #
    # ⛔ ONE definition of "is anything deployed", computed ONCE and consumed by every `E2E (…)` job below
    # through a job-level `if:`. The shape is `deployed-e2e.yml`'s own `resolve` job, deliberately: that
    # workflow already answers this question against both CloudFormation and the live origin, and a second
    # mechanism here would be a second, drifting definition of it.
    #
    # ⚠️ `live` ALONE is not the condition, and the difference matters. `deploy-gate.sh` reports `live=true`
    # for an environment it is ABOUT TO CREATE (an absent stack under intent) — true for the deploy job that
    # follows it, false for a tier that deploys nothing. The state this tier can run in is the gate's own
    # `deploy=false` arm ("unchanged and already deployed and serving"), so the condition is `live && !deploy`,
    # per service. `intent=true` is passed unconditionally BECAUSE of that pairing: passing `false` collapses
    # every answer to `live=false` and makes the tier permanently silent, while passing `true` cannot cause a
    # deploy — there is no deploy step anywhere in this workflow.
    #
    # ⛔ Absence SKIPS, it never fails — `deployGateStepGuards.test.ts` records why: "red-over-nothing is the
    # mirror of green-over-nothing", and `Sandbox Deploy` was permanently red on PR #91 for exactly this. So
    # this job itself must stay GREEN when there is nothing deployed; it publishes `live=false` and the tier
    # skips.
    #
    # ⚠️ NO `aws-actions/configure-aws-credentials` and NO `load-secrets` here, on purpose. Both FAIL when the
    # credentials are withheld — which GitHub does by design for fork PRs and Dependabot — and a red
    # `resolve-sandbox` would red the whole pipeline for a PR nobody can fix. Handing the keys to the AWS CLI
    # through `env:` degrades correctly instead: `describe-stacks` fails, `deploy_gate_stack_status` answers
    # ABSENT, the gate answers `deploy=true`, and the tier SKIPS.
    resolve-sandbox:
        name: Resolve the PR sandbox
        timeout-minutes: 15
        runs-on: ubuntu-latest
        # ⛔ THE STAGE IS DECIDED HERE, AT JOB LEVEL, and the step below only validates it. Computed in a step
        # and read back as a step output it is invisible to static analysis: `stackProbeCoverage.test.ts` reads
        # `env:` at file and job level only, so every stack the liveness step probes would come back "whose
        # stage this guard cannot resolve, so nothing here can say whether the set is complete".
        #
        # EMPTY on any run without a pull request — i.e. `ci-main.yml`, the prod caller — which resolves to
        # `live=false` and skips the whole tier. Nothing automatic in this repository may point a suite at
        # production; that is `deployed-e2e.yml`'s manual door, and only by hand.
        env:
            STAGE: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || '' }}
            # The BASE stage ('sandbox' | 'prod'), which is a different question from the per-PR stage above:
            # the identity service is GLOBAL infra (ADR-0005) with one deploy per base stage, so a `pr-{N}`
            # preview signs in against the SHARED identity service, not one of its own.
            BASE_STAGE: ${{ inputs.stage }}
        outputs:
            stage: ${{ steps.target.outputs.stage }}
            live: ${{ steps.live.outputs.live }}
            identity_origin: ${{ steps.target.outputs.identity_origin }}
            recipe_origin: ${{ steps.target.outputs.recipe_origin }}
            food_origin: ${{ steps.target.outputs.food_origin }}
            web_origin: ${{ steps.target.outputs.web_origin }}
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24
                  cache: npm
            # This job has no `needs:`, so it cannot restore the cache `install` saves — it is deliberately
            # off the critical path of every other job, since eight Playwright shards wait on its answer.
            - run: npm ci
            # `printPublicOrigin.mjs` imports `@kitchensink/infra-alb`, which exports `./dist` (the compiled
            # CDK apps run under plain `node`, whose type-stripping resolves a `.js` specifier inside a `.ts`
            # file literally rather than through `extensionAlias`). `^...` asks turbo for the dependency
            # CLOSURE rather than naming packages, so the next dist-exporting dependency needs no edit here —
            # the lesson `sandbox-deploy.yml` paid for twice with `infra-security` and then `infra-alb`.
            - name: Build the workspace packages the origin resolver imports
              run: npx turbo run build --filter='@kitchensink/loadtest^...'
            # ⛔ NO HOST LITERAL. Every service origin comes from `publicServiceOriginForStage` (ADR-0003 /
            # ADR-0006: prod is the bare label `recipe.{apex}`, every other stage the DASH form
            # `recipe-{stage}.{apex}`, because a 3-label `recipe.pr-7.{apex}` matches no wildcard on the shared
            # ALB certificate and fails the TLS handshake before any listener rule is consulted).
            #
            # ⚠️ Identity and the web preview are NOT that shape and must not be forced into it. The identity
            # service is global infra whose record is `identity.{stage}.{apex}` (`IdentityServiceStack`), and a
            # preview's browser origin is the per-PR SUBDOMAIN `pr-{N}.sandbox.{apex}` (ADR-0001, cutover
            # executed 2026-07-13 — the older `sandbox.{apex}/pr-{N}` path form 404s BY DESIGN). Both are
            # composed from the `DOMAIN_NAME` repository variable, so no host is typed into this file.
            - name: Resolve this PR's sandbox stage and service origins
              id: target
              run: |
                  set -euo pipefail
                  stage="${STAGE:-}"

                  if [ -z "${stage}" ] || [ -z "${DOMAIN_NAME:-}" ]; then
                      echo "::notice::no per-PR sandbox target for this run (stage='${stage}') — the E2E tier will be SKIPPED, which is not a failure"
                      {
                          echo 'stage='
                          echo 'identity_origin='
                          echo 'recipe_origin='
                          echo 'food_origin='
                          echo 'web_origin='
                      } >>"$GITHUB_OUTPUT"
                      exit 0
                  fi

                  case "${stage}" in
                      pr-[0-9]*) ;;
                      *)
                          echo "::error::refusing an unrecognised stage '${stage}' — expected 'pr-{N}'"
                          exit 1
                          ;;
                  esac

                  recipe=$(node packages/tools/loadtest/printPublicOrigin.mjs recipe "${stage}" "${DOMAIN_NAME}")
                  food=$(node packages/tools/loadtest/printPublicOrigin.mjs food "${stage}" "${DOMAIN_NAME}")
                  # ⛔ THE BROWSER ORIGIN BRANCHES ON THE STAGE, exactly as the identity origin below does.
                  # It used to be the unconditional preview form, which resolves `prod` to
                  # `https://prod.sandbox.{apex}` — a host that is neither prod nor a preview and answers
                  # nothing. The service origins were already correct, so a prod flow would have driven a
                  # browser at a dead host while every API call went to the real one.
                  #
                  # Prod is the APEX; every other stage is the per-PR preview subdomain (ADR-0001, cutover
                  # executed 2026-07-13 — the older `sandbox.{apex}/pr-{N}` path form 404s BY DESIGN and
                  # must not be reintroduced here).
                  if [ "${BASE_STAGE}" = 'prod' ]; then
                      web="https://${DOMAIN_NAME}"
                      identity="https://identity.${DOMAIN_NAME}"
                  else
                      web="https://${stage}.sandbox.${DOMAIN_NAME}"
                      identity="https://identity.${BASE_STAGE}.${DOMAIN_NAME}"
                  fi

                  {
                      echo "stage=${stage}"
                      echo "identity_origin=${identity}"
                      echo "recipe_origin=${recipe}"
                      echo "food_origin=${food}"
                      echo "web_origin=${web}"
                  } >>"$GITHUB_OUTPUT"
                  echo "stage=${stage} identity=${identity} recipe=${recipe} food=${food} web=${web}"
            # ⛔ THE SKIP, and it consumes the answer the repository ALREADY publishes rather than re-deriving
            # it. Re-implementing "is anything deployed" as a `curl` loop here would be a SECOND definition of
            # a question `deploy-gate.sh` already answers against both CloudFormation and the origin.
            #
            # `GITHUB_OUTPUT=` is cleared per call so the two evaluations cannot overwrite each other's
            # `deploy=`/`live=` keys; ONE combined `live=` is written at the end. `changed`/`forced` are
            # `false`: this run has no diff to react to and is not a deploy button.
            - name: Is anything deployed at this stage? (deploy-gate liveness)
              id: live
              env:
                  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  AWS_REGION: ${{ vars.DEFAULT_AWS_REGION }}
                  RECIPE_ORIGIN: ${{ steps.target.outputs.recipe_origin }}
                  FOOD_ORIGIN: ${{ steps.target.outputs.food_origin }}
              run: |
                  set -euo pipefail

                  if [ -z "${STAGE:-}" ] || [ -z "${RECIPE_ORIGIN}" ] || [ -z "${FOOD_ORIGIN}" ]; then
                      echo 'live=false' >>"$GITHUB_OUTPUT"
                      echo '::notice::no sandbox target resolved — SKIPPING the E2E tier'
                      exit 0
                  fi

                  # Run the gate with its GITHUB_OUTPUT suppressed and capture the verdict, so both services
                  # can be asked without the second answer clobbering the first.
                  ask() {
                      local service="$1" health="$2"
                      shift 2
                      GITHUB_OUTPUT='' bash .github/scripts/deploy-gate.sh evaluate \
                          true "${service}" false false "${health}" "${DEFAULT_AWS_REGION}" "$@"
                  }

                  field() {
                      printf '%s\n' "$1" | sed -n "s/^${2}=//p" | tail -1
                  }

                  recipe_verdict=$(ask recipe "${RECIPE_ORIGIN}/health" \
                      "kitchensink-ingredient-parser-${STAGE}" \
                      "kitchensink-recipe-workers-${STAGE}" \
                      "kitchensink-recipe-service-${STAGE}")
                  echo "${recipe_verdict}"

                  food_verdict=$(ask food "${FOOD_ORIGIN}/health" "kitchensink-food-service-${STAGE}")
                  echo "${food_verdict}"

                  live='false'
                  if [ "$(field "${recipe_verdict}" live)" = 'true' ] &&
                      [ "$(field "${recipe_verdict}" deploy)" = 'false' ] &&
                      [ "$(field "${food_verdict}" live)" = 'true' ] &&
                      [ "$(field "${food_verdict}" deploy)" = 'false' ]; then
                      live='true'
                  fi

                  echo "live=${live}" >>"$GITHUB_OUTPUT"
                  if [ "${live}" = 'true' ]; then
                      echo "::notice::${STAGE} is deployed and serving — running the E2E tier against it"
                  else
                      echo "::notice::nothing is deployed and serving at ${STAGE} — SKIPPING the E2E tier (this is not a failure; deploy the stage, or press Run workflow on Sandbox Deploy, and try again)"
                  fi

    build-ui:
        name: Build @commise/ui
        timeout-minutes: 15
        runs-on: ubuntu-latest
        needs: [install]
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24
            - name: Restore dependencies
              uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                      packages/*/*/node_modules
                      packages/*/*/*/node_modules
                      packages/*/*/*/*/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
            # ⛔ A CACHE MISS MUST BE SLOW, NOT FATAL. These jobs restore `node_modules` and never install,
            # so before this step a miss did not degrade them — it killed them: no `node_modules` means no
            # `tsc`, and the build step died with `sh: 1: tsc: not found` / `npm error code 127`. Across the
            # 8 Playwright shards plus the merged report that turned ONE evicted cache entry into 9 red jobs,
            # and a re-run usually went green because `install` had re-saved the entry meanwhile — which is
            # exactly what made it look like flake instead of a missing fallback.
            #
            # The miss is real and expected: the repo's Actions cache sits under a 10 GB cap with LRU
            # eviction, and every lockfile change mints a fresh entry, so an in-flight run CAN have its entry
            # evicted underneath it. The `::warning::` keeps that visible — a silent reinstall would hide the
            # eviction rate, which is the number worth watching.
            - name: Install dependencies if the cache missed
              run: |
                  if [ -d node_modules ] && [ -n "$(ls -A node_modules 2>/dev/null)" ]; then
                      exit 0
                  fi
                  echo "::warning::node_modules cache miss (entry evicted or never saved) — running npm ci"
                  npm ci
            - run: npm run build --workspace=@commise/ui
            - name: Cache UI build artifacts
              uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
              with:
                  path: packages/apps/commise/ui/dist
                  key: ${{ runner.os }}-ui-dist-${{ github.sha }}

    lint:
        name: Lint
        timeout-minutes: 20
        runs-on: ubuntu-latest
        needs: [install]
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24
            - name: Restore dependencies
              uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                      packages/*/*/node_modules
                      packages/*/*/*/node_modules
                      packages/*/*/*/*/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
            # ⛔ A CACHE MISS MUST BE SLOW, NOT FATAL. These jobs restore `node_modules` and never install,
            # so before this step a miss did not degrade them — it killed them: no `node_modules` means no
            # `tsc`, and the build step died with `sh: 1: tsc: not found` / `npm error code 127`. Across the
            # 8 Playwright shards plus the merged report that turned ONE evicted cache entry into 9 red jobs,
            # and a re-run usually went green because `install` had re-saved the entry meanwhile — which is
            # exactly what made it look like flake instead of a missing fallback.
            #
            # The miss is real and expected: the repo's Actions cache sits under a 10 GB cap with LRU
            # eviction, and every lockfile change mints a fresh entry, so an in-flight run CAN have its entry
            # evicted underneath it. The `::warning::` keeps that visible — a silent reinstall would hide the
            # eviction rate, which is the number worth watching.
            - name: Install dependencies if the cache missed
              run: |
                  if [ -d node_modules ] && [ -n "$(ls -A node_modules 2>/dev/null)" ]; then
                      exit 0
                  fi
                  echo "::warning::node_modules cache miss (entry evicted or never saved) — running npm ci"
                  npm ci
            - run: npx turbo run lint
            # Workflow files get NO coverage from `turbo run lint` — eslint does not read YAML. GitHub
            # validates them only at dispatch time, and an invalid one does not fail a check: it produces a
            # zero-job `startup_failure` attributed to the PUSH event, so the workflow that should have run
            # SILENTLY DOES NOT. That is how a broken `sandbox-deploy.yml` shipped and the per-PR deploy
            # simply never started (issue #124's first run) — every local gate was green, YAML parsed, and
            # even the official Actions JSON schema validated it.
            #
            # The defect was a literal `${{` `}}` written as PROSE inside a `run:` block comment. GitHub
            # interpolates expressions in `run:` bodies BEFORE the shell sees them, comments included, so an
            # empty interpolation is a syntax error. Only an expression-aware linter catches that class.
            #
            # actionlint is pinned: it is the validator, so an unpinned upgrade could change what passes.
            - name: Lint GitHub workflow files (actionlint — expression + context checks)
              run: |
                  set -euo pipefail
                  version=1.7.12
                  # Pinned AND checksum-verified. The version pin alone only fixes WHICH release is fetched;
                  # it says nothing about the bytes that arrive. Since actionlint is the validator, a swapped
                  # artifact would change what passes review while every check stayed green — so verify the
                  # digest from upstream's published `*_checksums.txt`. Integrity, not authenticity: upstream
                  # publishes no signature, so this proves the bytes are the ones reviewed, not who built them.
                  sha256=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
                  curl -sSfL -o /tmp/actionlint.tar.gz \
                    "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz"
                  echo "${sha256}  /tmp/actionlint.tar.gz" | sha256sum --check --strict
                  tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
                  # shellcheck/pyflakes are off: this gate is about workflow VALIDITY, and the runner has
                  # neither tool, which would otherwise be reported as errors on every embedded script.
                  /tmp/actionlint -shellcheck= -pyflakes= .github/workflows/*.yml

            # `turbo run lint` reads the AST but never the MANIFEST, so a package importing something it
            # does not declare passes every local gate and resolves only through npm workspace hoisting.
            # That is how `@commise/i18n` (36 files) and `@commise/features-core` (24 web + 15 mobile,
            # including value imports) sat undeclared in production source — the same class as the
            # prod.package.json/clean-state-build failure, invisible until an isolated install.
            #
            # This is a RATCHET, not a plain gate: 135 findings remain (mostly @testing-library
            # devDependency gaps, 8 k6 runtime imports, one real package cycle, one false positive), so
            # failing on any finding would block every PR. The 26 distinct (package, dependency, rule)
            # triples are recorded in scripts/boundaries-baseline.json and a NEW one fails the build.
            # Deliberately NOT `continue-on-error` — see scripts/boundariesRatchet.mjs for why a
            # green-because-ignored step is the defect class this repo is trying to eliminate.
            #
            # ⚠️ `npm run boundaries` SPAWNS turbo from inside the ratchet — it is deliberately NOT
            # `turbo boundaries | node …` any more. A pipeline exits with its LAST command's status, so
            # that form returned 0 whenever the ratchet was satisfied EVEN IF turbo crashed or the
            # subcommand did not exist, and this step was green having checked nothing (PR #91 review).
            # `set -o pipefail` does not fix it: npm has no `script-shell` set, so scripts run under
            # `/bin/sh` = dash on ubuntu-latest, which rejects `-o pipefail`. Do not reintroduce the pipe.
            - name: Workspace boundaries (undeclared-dependency ratchet)
              run: npm run boundaries

    format:
        name: Format check
        timeout-minutes: 10
        runs-on: ubuntu-latest
        needs: [install]
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24
            - name: Restore dependencies
              uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                      packages/*/*/node_modules
                      packages/*/*/*/node_modules
                      packages/*/*/*/*/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
            # ⛔ A CACHE MISS MUST BE SLOW, NOT FATAL. These jobs restore `node_modules` and never install,
            # so before this step a miss did not degrade them — it killed them: no `node_modules` means no
            # `tsc`, and the build step died with `sh: 1: tsc: not found` / `npm error code 127`. Across the
            # 8 Playwright shards plus the merged report that turned ONE evicted cache entry into 9 red jobs,
            # and a re-run usually went green because `install` had re-saved the entry meanwhile — which is
            # exactly what made it look like flake instead of a missing fallback.
