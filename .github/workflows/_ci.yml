        # detach, "no deleted_at filter", the dual-bucket owner-prefix S3 sweep, the archive-resurrection
        # guard) that a fake db/mocked S3 CANNOT prove — only real Postgres + real S3 can. Those specs live
        # in packages/services/recipe-workers/__tests__/integration and had NO CI job, so the guarantees
        # passed only on a developer's machine; this job puts them under CI. Mirrors `integration-recipe`:
        # Postgres backs the relational cascades, LocalStack provides the S3 the sweep/guard exercise.
        #
        # UNLIKE recipe-service, the workers integration suite has NO vitest globalSetup that migrates the
        # schema — it deliberately drives the exported `db`-taking seams over a caller-supplied pool and
        # ASSUMES the recipe schema already exists (see the spec headers). So this job applies the SAME
        # ordered, hand-authored recipe-service migrations (src/database/migrations/000*_*.sql — the single
        # source of truth for the schema, applied exactly as recipe-service's tests/globalSetup.ts does:
        # a clean `public`, then each file in filename order) to the throwaway DB BEFORE the run. Without
        # this step every spec errors with `relation "recipes" does not exist` (verified). The specs
        # self-provision their S3 buckets via CreateBucket, so no bucket-init step is needed here.
        services:
            postgres:
                image: postgres:18 # zizmor: ignore[unpinned-images] — see the note in this file’s header
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: recipe_workers_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
            localstack:
                image: localstack/localstack:4.4.0 # zizmor: ignore[unpinned-images] — see the note in this file’s header
                env:
                    # Community tier — no auth token. The workers' AWS surface is S3 only (SQS is driven
                    # via the exported seams, not a live queue), but the S3 family is free/Community.
                    SERVICES: s3,sqs
                ports:
                    - 4566:4566
                options: >-
                    --health-cmd "curl -sf http://localhost:4566/_localstack/health | grep -q available"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 20
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24
            - name: Restore dependencies
              uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                      packages/*/*/node_modules
                      packages/*/*/*/node_modules
                      packages/*/*/*/*/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
            # ⛔ A CACHE MISS MUST BE SLOW, NOT FATAL. These jobs restore `node_modules` and never install,
            # so before this step a miss did not degrade them — it killed them: no `node_modules` means no
            # `tsc`, and the build step died with `sh: 1: tsc: not found` / `npm error code 127`. Across the
            # 8 Playwright shards plus the merged report that turned ONE evicted cache entry into 9 red jobs,
            # and a re-run usually went green because `install` had re-saved the entry meanwhile — which is
            # exactly what made it look like flake instead of a missing fallback.
            #
            # The miss is real and expected: the repo's Actions cache sits under a 10 GB cap with LRU
            # eviction, and every lockfile change mints a fresh entry, so an in-flight run CAN have its entry
            # evicted underneath it. The `::warning::` keeps that visible — a silent reinstall would hide the
            # eviction rate, which is the number worth watching.
            - name: Install dependencies if the cache missed
              run: |
                  if [ -d node_modules ] && [ -n "$(ls -A node_modules 2>/dev/null)" ]; then
                      exit 0
                  fi
                  echo "::warning::node_modules cache miss (entry evicted or never saved) — running npm ci"
                  npm ci
            # Apply the recipe schema to the throwaway DB FIRST — the workers integration specs have no
            # globalSetup and assume the schema is present. This is the SAME set of ordered migration SQL
            # files recipe-service's tests/globalSetup.ts applies (drop `public`, then each file in
            # filename order), so the schema under test is byte-identical to the recipe-service run.
            - name: Apply recipe schema migrations to the throwaway DB
              env:
                  PGHOST: localhost
                  PGPORT: '5432'
                  PGUSER: postgres
                  PGPASSWORD: postgres
                  PGDATABASE: recipe_workers_test
              run: |
                  psql -v ON_ERROR_STOP=1 -c 'DROP SCHEMA IF EXISTS public CASCADE; CREATE SCHEMA public;'
                  for f in packages/services/recipe-service/src/database/migrations/*.sql; do
                      echo "applying $f"
                      psql -v ON_ERROR_STOP=1 -f "$f"
                  done
            # Drives the erasure/archive integration specs against the real, migrated Postgres + LocalStack
            # S3. The S3 clients hardcode `test`/`test` creds and force path-style addressing, so only the
            # endpoint + bucket names come from env; both are set for parity with `integration-recipe`.
            # The lambda BUNDLE must exist before the integration tier. `workersAppSynth.integration.test.ts`
            # spawns the real CDK app, and `RecipeWorkersStack` refuses to synth without `dist/` — it asserts
            # the bundle is present rather than deploying a phantom `lambda.Code.fromAsset`. That check is
            # correct; what was missing is that this job never built it, so the spec passed locally (where a
            # previous build had left `dist/` lying around) and failed in CI's clean checkout. Same class as
            # the `cdk.out` format:check and the incremental-tsc-skips-emit traps: a build artifact that
            # exists locally by accident is not a dependency that exists.
            #
            # Run through turbo, not the bare npm script, so `^build` drags in the shared packages the bundle
            # needs (`@kitchensink/recipe-core`) instead of assuming they are already built.
            - name: Build the recipe-workers lambda bundle (the synth spec needs it)
              run: npx turbo run build --filter=@kitchensink/recipe-workers

            # ⛔ THE LOCAL PARSE TIER RUNS THE DEPLOYED `handler.py`, SO THIS RUNNER NEEDS THE ENGINE.
            #
            # `localParsePath.integration.test.ts` drives the shipped local wiring, and `localCrfEngine.ts`
            # puts `packages/services/ingredient-parser/src/handler.py` behind the `LambdaClient` seam as a
            # subprocess. It landed with no install step here, so this job failed on EVERY run of its branch:
            #
            #     ModuleNotFoundError: No module named 'ingredient_parser'
            #
            # ⛔ The suite's header claimed that was survivable ("the CRF leg answers ABSENCE … and the line
            # still lands"). It is not, and the claim has been corrected: `handlers/parseLine.ts` treats
            # everything an ENGINE throws as TRANSIENT and re-throws BEFORE any landing, deliberately —
            # ADR-0026's 2026-08-31 update puts "a CRF invocation failure" in the transient set so an outage
            # cannot become a line's permanent answer. An absent engine is therefore no run at all.
            #
            # ⛔ NOT `bundle:lambda` / `infra/bin/buildAsset.ts`, even though that script already knows how to
            # install this engine. It installs `--platform manylinux2014_aarch64 --python-version 3.13
            # --only-binary=:all:` into a `--target` directory: arm64 / CPython 3.13 wheels for the Lambda,
            # which this x86-64 runner's interpreter cannot load. Reusing it here would stage an asset, not
            # make `import ingredient_parser` work. So this uses the SAME two steps the `services` unit group
            # and the self-contained job already use — the third instance of an established pattern, not a
            # second way to install the engine.
            #
            # ⛔ The pin is DERIVED from `requirements.txt`, never restated: ADR-0025 calls it load-bearing
            # three times over, and a literal version in YAML is a fourth copy kept in step by memory.
            #
            # ⚠️ NOT cached. Measured on this repo's own runs, the identical step costs 8-9s in the two jobs
            # that already carry it; a cache adds a key, a restore, a save and an eviction failure mode to
            # save that. `node_modules` is cached because it costs minutes, not seconds.
            - name: Install the CRF ingredient parser (the local parse tier runs the real handler.py)
              run: python3 -m pip install --user --requirement packages/services/ingredient-parser/requirements.txt

            # The tier guards on engine availability so a developer without Python is not blocked, which
            # means a failed install would read here as a SKIPPED tier and a green job. Observing the import
            # is what makes that impossible. `import ingredient_parser` rather than only the metadata
            # version, because that is the exact statement `handler.py` makes on line 38 — and it is the
            # statement that loads `python-crfsuite` and the CRF model, which metadata alone never touches.
            - name: Assert the CRF engine is importable — the local parse tier must not silently skip
              run: |
                  set -uo pipefail
                  if ! version=$(python3 -c "import ingredient_parser, importlib.metadata as m; print(m.version('ingredient-parser-nlp'))" 2>&1); then
                      echo "::error::the CRF engine is not importable on this runner (${version}). localParsePath.integration.test.ts guards on availability, so it would SKIP and this job would report green having never crossed the CRF leg at all. Fix the install step above; do not let this job pass without the engine." >&2
                      exit 1
                  fi
                  echo "CRF engine importable: ingredient-parser-nlp ${version}"

            - name: Run recipe-workers integration tests
              env:
                  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/recipe_workers_test
                  AWS_ENDPOINT_URL: http://localhost:4566
                  AWS_ACCESS_KEY_ID: test
                  AWS_SECRET_ACCESS_KEY: test
                  AWS_REGION: us-east-1
                  S3_ENDPOINT: http://localhost:4566
                  S3_FORCE_PATH_STYLE: 'true'
                  S3_BUCKET_PHOTOS: commise-photos
                  S3_BUCKET_VERSIONS: commise-versions
              run: npm run test:integration --workspace=@kitchensink/recipe-workers

