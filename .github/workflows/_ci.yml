            # error would hide every type error behind it and the next push would surface them one at a
            # time. Each check reports its own verdict in its own annotation.
            - name: Lint (ruff)
              run: npm run lint:python
            - name: Format check (ruff)
              run: npm run format:check:python
            - name: Typecheck (mypy)
              run: npm run typecheck:python

    typecheck:
        name: Typecheck
        timeout-minutes: 20
        runs-on: ubuntu-latest
        needs: [install]
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
