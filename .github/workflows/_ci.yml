name: CI (reusable)

# Reusable CI pipeline, parameterized by `stage`. Called by ci-pr.yml (stage=sandbox) and
# ci-main.yml (stage=prod). All AWS/Clerk secret loading goes through the load-secrets composite
# action, which reads kitchensink/<stage>/identity/keys — so PR pipelines use sandbox secrets and the
# main pipeline uses prod secrets, with no duplicated secret-fetch logic.
#
# Hardening path (requires repo/IAM setup, see docs/CI_ARCHITECTURE.md): move AWS auth to OIDC with
# two stage-scoped roles and adopt GitHub Environments so prod secrets are unreachable from PR runs.

on:
    workflow_call:
        inputs:
            stage:
                description: Deployment stage — 'sandbox' (PRs) or 'prod' (main)
                required: true
                type: string
            run_load_test:
                description: >-
                    Run the recipe-service k6 load-test job. Off by default so the heavy load run never
                    fires on ordinary PR / push pipelines; a caller opts in with `run_load_test: true`.
                required: false
                type: boolean
                default: false
            run_mobile_maestro:
                description: >-
                    Run the mobile Maestro e2e job (boots an Android emulator + installs the app). Off by
                    default until the Expo dev-build + emulator app-install wiring lands; opt in with
                    `run_mobile_maestro: true`.
                required: false
                type: boolean
                default: false

permissions:
    contents: read

env:
    DEFAULT_AWS_REGION: ${{ vars.DEFAULT_AWS_REGION }}

jobs:
    install:
        name: Install dependencies
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - name: Cache dependencies
              uses: actions/cache/save@v5
              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                      packages/*/*/node_modules
                      packages/*/*/*/node_modules
                      packages/*/*/*/*/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

    build-ui:
        name: Build @commise/ui
        runs-on: ubuntu-latest
        needs: [install]
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm
            - name: Restore dependencies
              uses: actions/cache/restore@v5
              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                      packages/*/*/node_modules
                      packages/*/*/*/node_modules
                      packages/*/*/*/*/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
            - run: npm run build --workspace=@commise/ui
            - name: Cache UI build artifacts
              uses: actions/cache/save@v5
              with:
                  path: packages/apps/commise/ui/dist
                  key: ${{ runner.os }}-ui-dist-${{ github.sha }}

    lint:
        name: Lint
        runs-on: ubuntu-latest
        needs: [install]
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm
            - name: Restore dependencies
              uses: actions/cache/restore@v5
              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                      packages/*/*/node_modules
                      packages/*/*/*/node_modules
                      packages/*/*/*/*/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
            - run: npx turbo run lint

    format:
        name: Format check
        runs-on: ubuntu-latest
        needs: [install]
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm
            - name: Restore dependencies
              uses: actions/cache/restore@v5
              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                      packages/*/*/node_modules
                      packages/*/*/*/node_modules
                      packages/*/*/*/*/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
            - run: npx turbo run format:check

    typecheck:
        name: Typecheck
        runs-on: ubuntu-latest
        needs: [install]
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm
            - name: Restore dependencies
              uses: actions/cache/restore@v5
              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                      packages/*/*/node_modules
                      packages/*/*/*/node_modules
                      packages/*/*/*/*/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
            - run: npx turbo run typecheck

    test:
        name: Test
        runs-on: ubuntu-latest
        needs: [install]
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm
            - name: Restore dependencies
              uses: actions/cache/restore@v5
              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                      packages/*/*/node_modules
                      packages/*/*/*/node_modules
                      packages/*/*/*/*/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
            - run: npx turbo run test

    integration-identity:
        name: Integration (identity — Postgres)
        runs-on: ubuntu-latest
        needs: [install]
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: identity_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm
            - name: Restore dependencies
              uses: actions/cache/restore@v5
              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                      packages/*/*/node_modules
                      packages/*/*/*/node_modules
                      packages/*/*/*/*/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
            # Self-contained: the integration suite bootstraps the schema from migrations against the
            # Postgres service and proves create-user idempotency. No AWS/Clerk secrets required.
            - name: Run identity integration tests
              env:
                  DATABASE_URL: postgres://postgres:postgres@localhost:5432/identity_test
              run: npm run test:integration --workspace=@kitchensink/identity-service

    integration-food:
        name: Integration (food — Postgres)
        runs-on: ubuntu-latest
        needs: [install]
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: food_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm
            - name: Restore dependencies
              uses: actions/cache/restore@v5
              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                      packages/*/*/node_modules
                      packages/*/*/*/node_modules
                      packages/*/*/*/*/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
            # Self-contained: the integration suite bootstraps the kitchensink_food schema from the
            # ordered migration SQL against the Postgres service and validates the FR-028 CHECK,
            # fetch_queue dedup, the singleton seed, indexes, and pg_trgm. No AWS/Clerk secrets.
            - name: Run food integration tests
              env:
                  DATABASE_URL: postgres://postgres:postgres@localhost:5432/food_test
              run: npm run test:integration --workspace=packages/services/food-service

    integration-recipe:
        name: Integration (recipe — Postgres + LocalStack)
        runs-on: ubuntu-latest
        needs: [install]
        # Feature 001 recipe-service. Postgres backs the relational data; LocalStack provides the AWS
        # services recipe-service uses (S3 photo/version archive, SQS archive queue) so the integration
        # suite can exercise them without real AWS. recipe-service is still a skeleton (only /health is
        # wired), so `--if-present` keeps this green until the `test:integration` script + suite land;
        # the job shape is ready so the suite plugs straight in. Mirrors `integration-food`.
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: recipe_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
            localstack:
                image: localstack/localstack:4.4.0
                env:
                    # Community tier — no auth token. recipe-service's AWS surface (S3 archive, SQS,
                    # EventBridge=`events`, Secrets Manager, SSM) is all free/Community.
                    SERVICES: s3,sqs,sns,events,secretsmanager,sts,iam,logs,cloudwatch,ssm
                ports:
                    - 4566:4566
                options: >-
                    --health-cmd "curl -sf http://localhost:4566/_localstack/health | grep -q available"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 20
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm
            - name: Restore dependencies
              uses: actions/cache/restore@v5
              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                      packages/*/*/node_modules
                      packages/*/*/*/node_modules
                      packages/*/*/*/*/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
            # The suite bootstraps the schema from src/database/migrations against the Postgres service
            # and seeds its own fixtures (same pattern as identity/food). No AWS/Clerk secrets required.
            - name: Run recipe integration tests
              env:
                  DATABASE_URL: postgres://postgres:postgres@localhost:5432/recipe_test
                  AWS_ENDPOINT_URL: http://localhost:4566
                  AWS_ACCESS_KEY_ID: test
                  AWS_SECRET_ACCESS_KEY: test
                  AWS_REGION: us-east-1
                  # recipe-service reads S3 config via its own env keys (config/config.types.ts), not the
                  # generic AWS_* ones — LocalStack needs path-style addressing, so both are required or
                  # the photos/versions S3 clients emit virtual-host URLs that don't resolve.
                  S3_ENDPOINT: http://localhost:4566
                  S3_FORCE_PATH_STYLE: 'true'
                  S3_BUCKET_PHOTOS: commise-photos
                  S3_BUCKET_VERSIONS: commise-versions
                  CLOUDFRONT_URL: http://localhost:4566/commise-photos
              run: npm run test:integration --workspace=@kitchensink/recipe-service --if-present

    integration-recipe-workers:
        name: Integration (recipe-workers — Postgres + LocalStack)
        runs-on: ubuntu-latest
        needs: [install]
        # Feature 001 recipe-workers. The GDPR account-erasure worker and the version-archive drain make
        # DESTRUCTIVE, compliance-critical guarantees (FK/cascade behaviour, the `cloned_from_id` NO-ACTION
        # detach, "no deleted_at filter", the dual-bucket owner-prefix S3 sweep, the archive-resurrection
        # guard) that a fake db/mocked S3 CANNOT prove — only real Postgres + real S3 can. Those specs live
        # in packages/services/recipe-workers/__tests__/integration and had NO CI job, so the guarantees
        # passed only on a developer's machine; this job puts them under CI. Mirrors `integration-recipe`:
        # Postgres backs the relational cascades, LocalStack provides the S3 the sweep/guard exercise.
        #
        # UNLIKE recipe-service, the workers integration suite has NO vitest globalSetup that migrates the
        # schema — it deliberately drives the exported `db`-taking seams over a caller-supplied pool and
        # ASSUMES the recipe schema already exists (see the spec headers). So this job applies the SAME
        # ordered, hand-authored recipe-service migrations (src/database/migrations/000*_*.sql — the single
        # source of truth for the schema, applied exactly as recipe-service's tests/global-setup.ts does:
        # a clean `public`, then each file in filename order) to the throwaway DB BEFORE the run. Without
        # this step every spec errors with `relation "recipes" does not exist` (verified). The specs
        # self-provision their S3 buckets via CreateBucket, so no bucket-init step is needed here.
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: recipe_workers_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
            localstack:
                image: localstack/localstack:4.4.0
                env:
                    # Community tier — no auth token. The workers' AWS surface is S3 only (SQS is driven
                    # via the exported seams, not a live queue), but the S3 family is free/Community.
                    SERVICES: s3,sqs
                ports:
                    - 4566:4566
                options: >-
                    --health-cmd "curl -sf http://localhost:4566/_localstack/health | grep -q available"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 20
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm
            - name: Restore dependencies
              uses: actions/cache/restore@v5
              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                      packages/*/*/node_modules
                      packages/*/*/*/node_modules
                      packages/*/*/*/*/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
            # Apply the recipe schema to the throwaway DB FIRST — the workers integration specs have no
            # globalSetup and assume the schema is present. This is the SAME set of ordered migration SQL
            # files recipe-service's tests/global-setup.ts applies (drop `public`, then each file in
            # filename order), so the schema under test is byte-identical to the recipe-service run.
            - name: Apply recipe schema migrations to the throwaway DB
              env:
                  PGHOST: localhost
                  PGPORT: '5432'
                  PGUSER: postgres
                  PGPASSWORD: postgres
                  PGDATABASE: recipe_workers_test
              run: |
                  psql -v ON_ERROR_STOP=1 -c 'DROP SCHEMA IF EXISTS public CASCADE; CREATE SCHEMA public;'
                  for f in packages/services/recipe-service/src/database/migrations/*.sql; do
                      echo "applying $f"
                      psql -v ON_ERROR_STOP=1 -f "$f"
                  done
            # Drives the erasure/archive integration specs against the real, migrated Postgres + LocalStack
            # S3. The S3 clients hardcode `test`/`test` creds and force path-style addressing, so only the
            # endpoint + bucket names come from env; both are set for parity with `integration-recipe`.
            - name: Run recipe-workers integration tests
              env:
                  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/recipe_workers_test
                  AWS_ENDPOINT_URL: http://localhost:4566
                  AWS_ACCESS_KEY_ID: test
                  AWS_SECRET_ACCESS_KEY: test
                  AWS_REGION: us-east-1
                  S3_ENDPOINT: http://localhost:4566
                  S3_FORCE_PATH_STYLE: 'true'
                  S3_BUCKET_PHOTOS: commise-photos
                  S3_BUCKET_VERSIONS: commise-versions
              run: npm run test:integration --workspace=@kitchensink/recipe-workers

    e2e-food:
        name: E2E (food — booted app + Postgres + LocalStack)
        runs-on: ubuntu-latest
        needs: [install]
        # Two service containers mirror infra/localstack/docker-compose.yml: a plain Postgres (the DB,
        # NOT LocalStack RDS) and a LocalStack container for the AWS services food-service will use from
        # Phase 3 (EventBridge=`events`, SQS, Secrets Manager). The CURRENT E2E only boots the Nest app
        # and exercises /health + the migrated Postgres, so it does NOT yet call LocalStack; the
        # container is provisioned now so the Phase 3 AWS-service flows plug straight in.
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: food_e2e
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
            localstack:
                image: localstack/localstack:4.4.0
                env:
                    # Community tier — no auth token. Every service food-service uses (EventBridge=`events`,
                    # SQS, SNS, Secrets Manager, SSM, IAM, STS, CloudWatch Logs) is free/Community; the
                    # Pro-only services (RDS, ECS) are deliberately avoided (Docker Postgres for the DB,
                    # the Nest app boots as a process). Add LOCALSTACK_AUTH_TOKEN only if a Pro feature is
                    # ever adopted.
                    SERVICES: secretsmanager,events,sqs,sns,sts,iam,logs,cloudwatch,ssm
                ports:
                    - 4566:4566
                options: >-
                    --health-cmd "curl -sf http://localhost:4566/_localstack/health | grep -q available"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 20
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm
            - name: Restore dependencies
              uses: actions/cache/restore@v5
              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                      packages/*/*/node_modules
                      packages/*/*/*/node_modules
                      packages/*/*/*/*/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
            # Boots the real food-service Nest app against the Postgres service, applies the
            # kitchensink_food migration, and asserts GET /health + DB reachability end to end.
            - name: Run food E2E tests
              env:
                  DATABASE_URL: postgres://postgres:postgres@localhost:5432/food_e2e
                  USDA_API_KEY: e2e-dummy-key
              run: npm run test:e2e --workspace=packages/services/food-service

    build:
        name: Build ${{ matrix.workspace }}
        runs-on: ubuntu-latest
        needs: [install, build-ui]
        strategy:
            fail-fast: false
            matrix:
                workspace:
                    - '@kitchensink/identity-service'
                    - '@kitchensink/identity-webhooks'
                    - '@commise/web'
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm
            - name: Restore dependencies
              uses: actions/cache/restore@v5
              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                      packages/*/*/node_modules
                      packages/*/*/*/node_modules
                      packages/*/*/*/*/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
            - name: Restore UI build artifacts
              uses: actions/cache/restore@v5
              with:
                  path: packages/apps/commise/ui/dist
                  key: ${{ runner.os }}-ui-dist-${{ github.sha }}
            - name: Ensure @commise/ui is built (fallback if the per-SHA cache restore missed)
              if: matrix.workspace == '@commise/web'
              run: '[ -n "$(ls -A packages/apps/commise/ui/dist 2>/dev/null)" ] || npm run build --workspace=@commise/ui'

            # The web build statically prerenders Clerk-wrapped pages and needs a real publishable
            # key. Load the stage-scoped key; if creds are unavailable (e.g. fork PRs) the build is
            # skipped rather than failing.
            - name: Load ${{ inputs.stage }} secrets
              if: matrix.workspace == '@commise/web'
              id: secrets
              continue-on-error: true
              uses: ./.github/actions/load-secrets
              with:
                  stage: ${{ inputs.stage }}
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ env.DEFAULT_AWS_REGION }}

            - name: Build
              if: matrix.workspace != '@commise/web' || steps.secrets.outcome == 'success'
              run: npm run build --workspace=${{ matrix.workspace }}

    e2e-backend:
        # Static name (not a matrix) so a skipped run still shows a clean title instead of a raw
        # `${{ matrix.* }}` template. Both backend workspaces run sequentially in one job.
        name: E2E (backend services)
        runs-on: ubuntu-latest
        needs: build
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm
            - name: Restore dependencies
              uses: actions/cache/restore@v5
              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                      packages/*/*/node_modules
                      packages/*/*/*/node_modules
                      packages/*/*/*/*/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
            - name: Load ${{ inputs.stage }} secrets
              id: secrets
              continue-on-error: true
              uses: ./.github/actions/load-secrets
              with:
                  stage: ${{ inputs.stage }}
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ env.DEFAULT_AWS_REGION }}
            - name: Run e2e tests
              if: steps.secrets.outcome == 'success'
              run: |
                  npm run test:e2e --workspace=@kitchensink/identity-service
                  npm run test:e2e --workspace=@kitchensink/identity-webhooks

    e2e-web:
        name: E2E (web — Playwright)
        runs-on: ubuntu-latest
        needs: build
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm
            - name: Restore dependencies
              uses: actions/cache/restore@v5
              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                      packages/*/*/node_modules
                      packages/*/*/*/node_modules
                      packages/*/*/*/*/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
            # The Playwright dev server imports @commise/ui/theme.css, so the built UI dist must
            # be present (mirrors the build job).
            - name: Restore UI build artifacts
              uses: actions/cache/restore@v5
              with:
                  path: packages/apps/commise/ui/dist
                  key: ${{ runner.os }}-ui-dist-${{ github.sha }}
            - name: Ensure @commise/ui is built (fallback if the per-SHA cache restore missed)
              run: '[ -n "$(ls -A packages/apps/commise/ui/dist 2>/dev/null)" ] || npm run build --workspace=@commise/ui'
            # The web E2E runs ClerkJS in a browser against the Playwright dev server on
            # http://localhost:3000. Clerk *production* instances (pk_live) are domain-locked and
            # refuse to initialize on any origin other than their production domain — ClerkJS aborts
            # with "Production Keys are only allowed for domain <domain>", so <SignIn> never mounts and
            # the sign-in page renders without the auth form (only the Next.js <title> survives). A
            # *development* instance (pk_test) permits localhost, so the web E2E must always use the
            # sandbox (dev) Clerk keys regardless of the pipeline stage. (Backend/mobile E2E don't run
            # ClerkJS in a localhost browser, so they keep using the stage's own secrets.)
            - name: Load sandbox (dev-instance) Clerk secrets for localhost web E2E
              id: secrets
              continue-on-error: true
              uses: ./.github/actions/load-secrets
              with:
                  stage: sandbox
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ env.DEFAULT_AWS_REGION }}
            # Cache the Playwright browser binaries (~/.cache/ms-playwright) keyed on the lockfile so
            # the Chromium download only happens when the Playwright version changes.
            - name: Cache Playwright browsers
              id: playwright-cache
              if: steps.secrets.outcome == 'success'
              uses: actions/cache@v5
              with:
                  path: ~/.cache/ms-playwright
                  key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
            # Cache miss: download the browser + OS deps. Cache hit: browsers are restored, so only the
            # OS-level system dependencies still need installing.
            - name: Install Playwright browsers (cache miss)
              if: steps.secrets.outcome == 'success' && steps.playwright-cache.outputs.cache-hit != 'true'
              run: npx playwright install --with-deps chromium
            - name: Install Playwright system deps (cache hit)
              if: steps.secrets.outcome == 'success' && steps.playwright-cache.outputs.cache-hit == 'true'
              run: npx playwright install-deps chromium
            - name: Run web e2e tests
              if: steps.secrets.outcome == 'success'
              run: npm run test:e2e --workspace=@commise/web
            # Failure-only: upload the Playwright HTML report + traces so a red run is debuggable.
            - name: Upload Playwright report + traces
              if: failure() && steps.secrets.outcome == 'success'
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report-${{ inputs.stage }}
                  path: |
                      packages/apps/commise/web/playwright-report
                      packages/apps/commise/web/test-results
                  retention-days: 7
                  if-no-files-found: ignore

    e2e-mobile:
        name: E2E (mobile — Vitest)
        runs-on: ubuntu-latest
        needs: build
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm
            - name: Restore dependencies
              uses: actions/cache/restore@v5
              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                      packages/*/*/node_modules
                      packages/*/*/*/node_modules
                      packages/*/*/*/*/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
            - name: Load ${{ inputs.stage }} secrets
              id: secrets
              continue-on-error: true
              uses: ./.github/actions/load-secrets
              with:
                  stage: ${{ inputs.stage }}
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ env.DEFAULT_AWS_REGION }}
            - name: Run mobile e2e tests
              if: steps.secrets.outcome == 'success'
              run: npm run test:e2e --workspace=@commise/mobile

    e2e-mobile-maestro:
        name: E2E (mobile — Maestro)
        runs-on: ubuntu-latest
        needs: [install]
        # Cross-platform mandate: the Vitest mobile e2e (above) covers logic; Maestro drives the real UI
        # flows in packages/apps/commise/mobile/.maestro on an Android emulator. SELF-CONTAINED: it boots
        # the real recipe-service (the proven Docker image, dev-auth bypass) against a Postgres service on
        # the runner, provisions the shared Clerk sign-in test user, builds the Expo debug APK pointed at
        # the runner service via the emulator host alias (10.0.2.2), boots the emulator, installs the APK,
        # and runs the flows. The app still does REAL Clerk sign-in (sandbox dev instance); the service
        # ignores its token under the dev bypass, so no native-token verification is needed here.
        # Behind `run_mobile_maestro` (default false) purely for COST/DURATION (emulator + Gradle build).
        if: ${{ inputs.run_mobile_maestro }}
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: recipe_maestro
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm
            - name: Restore dependencies
              uses: actions/cache/restore@v5
              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                      packages/*/*/node_modules
                      packages/*/*/*/node_modules
                      packages/*/*/*/*/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
            # Clerk dev-instance keys (publishable for the APK, secret for provisioning the test user).
            - name: Load ${{ inputs.stage }} Clerk secrets
              id: secrets
              continue-on-error: true
              uses: ./.github/actions/load-secrets
              with:
                  stage: ${{ inputs.stage }}
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ env.DEFAULT_AWS_REGION }}
            # Idempotently ensure the shared sign-in test user exists in the Clerk dev instance (the flow
            # signs in with it; `+clerk_test` verifies with the fixed code 424242 — no real mailbox).
            - name: Provision Clerk sign-in test user
              if: steps.secrets.outcome == 'success'
              run: node packages/apps/commise/mobile/tests/e2e/ensure-signin-user.mjs
            - name: Install Maestro CLI
              if: steps.secrets.outcome == 'success'
              run: |
                  curl -Ls https://get.maestro.mobile.dev | bash
                  echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
            - name: Set up JDK 17
              if: steps.secrets.outcome == 'success'
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '17'
            # Build the recipe service (+ shared deps) and the PROVEN Docker image — the reliable boot (a
            # plain `node` boot can't resolve the workspace bare specifiers outside the image).
            # Build the recipe-service image AND the mobile app's dependency closure: the release JS bundle
            # (built at APK-build time) imports `@commise/ui/tokens/*`, which resolves to that package's
            # built `dist` — so its dist (and any other dist-exporting workspace dep) must exist first.
            - name: Build recipe-service image + mobile deps
              if: steps.secrets.outcome == 'success'
              run: |
                  npx turbo run build --filter=@kitchensink/recipe-service --filter=@commise/mobile^...
                  docker build -f packages/services/recipe-service/Dockerfile -t recipe-maestro:ci .
            # Migrations + seed the catalog ingredients the create flows attach by id (T043b).
            # Migrations + catalog ingredients (prepare-db), THEN the recipe seed (the 5 fixture recipes +
            # a collection the flows reference, e.g. "Mediterranean Grilled Lamb"). The flows expect the
            # signer to be the seed's FREE owner, so the dev-bypass user below is that owner's ULID.
            - name: Prepare recipe database (migrate + seed)
              if: steps.secrets.outcome == 'success'
              env:
                  DATABASE_URL: postgres://postgres:postgres@localhost:5432/recipe_maestro
              run: |
                  node packages/services/recipe-service/tests/load/prepare-db.mjs
                  npm run seed --workspace=@kitchensink/recipe-service
            # Boot the service with the dev-auth bypass + raised rate limits (the flows all run as one dev
            # user = the seed's FREE owner, so they see the seeded recipes). Bound to the runner's
            # localhost:3000; the emulator reaches it at http://10.0.2.2:3000.
            - name: Boot recipe-service (Docker, dev-bypass)
              if: steps.secrets.outcome == 'success'
              run: |
                  docker run -d --name recipe-maestro --network host \
                      -e NODE_ENV=development \
                      -e DATABASE_URL=postgres://postgres:postgres@localhost:5432/recipe_maestro \
                      -e PORT=3000 \
                      -e CLERK_JWT_KEY=maestro-placeholder-key \
                      -e CLERK_AUTHORIZED_PARTIES=http://localhost:3000 \
                      -e S3_ENDPOINT=http://localhost:4566 -e S3_FORCE_PATH_STYLE=true \
                      -e S3_BUCKET_PHOTOS=commise-photos -e S3_BUCKET_VERSIONS=commise-versions \
                      -e CLOUDFRONT_URL=http://localhost:4566/commise-photos \
                      -e SQS_ENDPOINT=http://localhost:4566 \
                      -e ACCOUNT_ERASURE_QUEUE_URL=http://localhost:4566/000000000000/erasure \
                      -e RECIPE_DEV_AUTH_USER_ID=01J0K6000000000000000000K6 \
                      -e RATE_LIMIT_READ=1000000 -e RATE_LIMIT_WRITE=1000000 \
                      -e RATE_LIMIT_SEARCH=1000000 -e RATE_LIMIT_PHOTO_UPLOAD=1000000 \
                      recipe-maestro:ci
                  for i in $(seq 1 40); do
                      if curl -sf http://localhost:3000/health > /dev/null; then echo "service up"; break; fi
                      sleep 2
                  done
                  curl -sf http://localhost:3000/health || { echo "service did not boot"; docker logs recipe-maestro; exit 1; }
            # Build a standalone RELEASE APK (JS bundle EMBEDDED). A debug APK loads its JS from a Metro
            # bundler at runtime — absent in CI, so the app renders nothing. The release build bundles the
            # JS in-APK (with EXPO_PUBLIC_* inlined at build time → the emulator host alias for the
            # runner-local service), so it runs Metro-free. Expo prebuild signs `release` with the debug
            # keystore by default, so the APK installs without any keystore setup. Minification is disabled
            # to avoid proguard stripping something the E2E needs.
            - name: Build Android release APK
              if: steps.secrets.outcome == 'success'
              working-directory: packages/apps/commise/mobile
              env:
                  EXPO_PUBLIC_API_URL: http://10.0.2.2:3000
                  EXPO_PUBLIC_IDP_PUBLISHABLE_KEY: ${{ env.EXPO_PUBLIC_IDP_PUBLISHABLE_KEY }}
                  # The release build runs the @sentry/react-native gradle hook, which uploads source maps
                  # via sentry-cli; there is no Sentry auth token in E2E, so disable the upload.
                  SENTRY_DISABLE_AUTO_UPLOAD: 'true'
              run: |
                  npx expo prebuild --platform android --no-install
                  # Allow cleartext HTTP so the release APK can reach the runner-local recipe service at
                  # http://10.0.2.2:3000 (release blocks cleartext by default; debug allows it). This patch
                  # lives only in the CI working copy — it is NOT committed, so prod builds from app.json
                  # stay cleartext-free. (Clerk sign-in itself is HTTPS and unaffected.)
                  sed -i 's/<application /<application android:usesCleartextTraffic="true" /' \
                      android/app/src/main/AndroidManifest.xml
                  cd android && ./gradlew :app:assembleRelease --no-daemon \
                      -PenableProguardInReleaseBuilds=false -PenableShrinkResourcesInReleaseBuilds=false
            # Hardware-accelerate the emulator (KVM). Without this the emulator falls back to slow software
            # rendering (a ~7min boot + ~4min APK install), which starves the Maestro Android driver and
            # times it out ("driver did not start up in time"). GitHub's Linux runners expose /dev/kvm but
            # need the group/permissions opened for the emulator process.
            - name: Enable KVM
              if: steps.secrets.outcome == 'success'
              run: |
                  echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
                      | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                  sudo udevadm control --reload-rules
                  sudo udevadm trigger --name-match=kvm
            # Boot the emulator, install the APK, and run the flows. Install + test run INSIDE the
            # emulator-runner `script` (the emulator is only up there). `adb reverse` also maps the
            # emulator's own localhost:3000 to the runner, a belt-and-suspenders alongside 10.0.2.2.
            # A generous MAESTRO_DRIVER_STARTUP_TIMEOUT absorbs first-run driver-install latency.
            - name: Run Maestro flows on emulator
              if: steps.secrets.outcome == 'success'
              uses: reactivecircus/android-emulator-runner@v2
              env:
                  MAESTRO_DRIVER_STARTUP_TIMEOUT: '300000'
              with:
                  api-level: 34
                  arch: x86_64
                  profile: pixel_6
                  cores: 3
                  ram-size: 4096M
                  emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none
                  disable-animations: true
                  script: |
                      adb install -r packages/apps/commise/mobile/android/app/build/outputs/apk/release/app-release.apk
                      adb reverse tcp:3000 tcp:3000 || true
                      # Re-provision the sign-in user immediately before the flows. The shared user lives in
                      # the sandbox Clerk instance, and the parallel web-E2E job's globalTeardown
                      # (deleteAllE2EUsers) removes it ~45min before these flows run — so the early provision
                      # step above is stale by now. This recreates it (idempotent) with a near-zero window.
                      node packages/apps/commise/mobile/tests/e2e/ensure-signin-user.mjs
                      maestro test packages/apps/commise/mobile/.maestro
            - name: Upload Maestro artifacts
              if: failure() && steps.secrets.outcome == 'success'
              uses: actions/upload-artifact@v4
              with:
                  name: maestro-report-${{ inputs.stage }}
                  path: ~/.maestro/tests
                  retention-days: 7
                  if-no-files-found: ignore
            - name: Recipe-service logs on failure
              if: failure() && steps.secrets.outcome == 'success'
              run: docker logs recipe-maestro 2>&1 | tail -100 || true

    load-test:
        name: Load test (recipe — k6)
        runs-on: ubuntu-latest
        needs: [install]
        # T081/SC-009 performance gate. Gated behind `run_load_test` (default false) so the heavy k6 run
        # never fires on ordinary PR / push pipelines; a caller opts in with `run_load_test: true`. Boots
        # the recipe-service against a Postgres service and runs the tests/load k6 scripts; a threshold
        # breach exits k6 non-zero and fails the job.
        if: ${{ inputs.run_load_test }}
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: recipe_load
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm
            - name: Restore dependencies
              uses: actions/cache/restore@v5
              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                      packages/*/*/node_modules
                      packages/*/*/*/node_modules
                      packages/*/*/*/*/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
            - name: Install k6
              run: |
                  sudo gpg -k
                  sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
                      --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
                  echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
                      | sudo tee /etc/apt/sources.list.d/k6.list
                  sudo apt-get update
                  sudo apt-get install -y k6
            # Build the service AND its shared deps (turbo `^build`), so the Dockerfile can COPY their
            # dist + prod.package.json. A plain `node dist/src/main.js` boot cannot resolve the workspace
            # `@kitchensink/*` bare specifiers outside the image (the src-exports/.js tangle), so we boot the
            # PROVEN Docker image instead — the same artifact prod runs.
            - name: Build recipe-service (+ shared deps)
              run: npx turbo run build --filter=@kitchensink/recipe-service
            - name: Build recipe-service image
              run: docker build -f packages/services/recipe-service/Dockerfile -t recipe-load:ci .
            # Apply migrations + seed the catalog ingredients the load payloads attach by id. MANDATORY:
            # since T043b every create validates each line's ingredientId, so without these every write 400s
            # and trips the k6 failure-rate threshold.
            - name: Prepare load database
              env:
                  DATABASE_URL: postgres://postgres:postgres@localhost:5432/recipe_load
              run: node packages/services/recipe-service/tests/load/prepare-db.mjs
            # Boot the image with the dev-auth bypass (RECIPE_DEV_AUTH_USER_ID) so the load needs no live
            # Clerk token, and with the per-user rate limits raised — the whole load is ONE dev user, so the
            # default RATE_LIMIT_* (120/30/60) would 429 under concurrency and fail the status checks. The
            # SC-009 scenario exercises only reads + writes, so S3/SQS point at unused placeholders.
            - name: Boot recipe-service (Docker, dev-bypass)
              run: |
                  docker run -d --name recipe-load --network host \
                      -e NODE_ENV=development \
                      -e DATABASE_URL=postgres://postgres:postgres@localhost:5432/recipe_load \
                      -e PORT=3000 \
                      -e CLERK_JWT_KEY=load-test-placeholder-key \
                      -e CLERK_AUTHORIZED_PARTIES=http://localhost:3000 \
                      -e S3_ENDPOINT=http://localhost:4566 -e S3_FORCE_PATH_STYLE=true \
                      -e S3_BUCKET_PHOTOS=commise-photos -e S3_BUCKET_VERSIONS=commise-versions \
                      -e CLOUDFRONT_URL=http://localhost:4566/commise-photos \
                      -e SQS_ENDPOINT=http://localhost:4566 \
                      -e ACCOUNT_ERASURE_QUEUE_URL=http://localhost:4566/000000000000/erasure \
                      -e RECIPE_DEV_AUTH_USER_ID=01JLOAD000000000000000000A \
                      -e RATE_LIMIT_READ=1000000 -e RATE_LIMIT_WRITE=1000000 \
                      -e RATE_LIMIT_SEARCH=1000000 -e RATE_LIMIT_PHOTO_UPLOAD=1000000 \
                      recipe-load:ci
                  for i in $(seq 1 40); do
                      if curl -sf http://localhost:3000/health > /dev/null; then echo "service up"; break; fi
                      sleep 2
                  done
                  curl -sf http://localhost:3000/health || { echo "service did not boot"; docker logs recipe-load; exit 1; }
            - name: Run k6 load scripts
              working-directory: packages/services/recipe-service
              env:
                  RECIPE_API_BASE_URL: http://localhost:3000
              run: |
                  k6 run --summary-export=k6-sc009-summary.json tests/load/sc009-read-write.load.js
                  k6 run --summary-export=k6-search-summary.json tests/load/search-latency.load.js
                  k6 run --summary-export=k6-save-summary.json tests/load/save-under-archive.load.js
            - name: Upload k6 summaries
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: recipe-k6-summaries-${{ inputs.stage }}
                  path: packages/services/recipe-service/k6-*-summary.json
                  retention-days: 7
                  if-no-files-found: warn
