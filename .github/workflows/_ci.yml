name: CI (reusable)

# Reusable CI pipeline, parameterized by `stage`. Called by ci-pr.yml (stage=sandbox) and
# ci-main.yml (stage=prod). All AWS/Clerk secret loading goes through the load-secrets composite
# action, which reads kitchensink/<stage>/identity/keys — so PR pipelines use sandbox secrets and the
# main pipeline uses prod secrets, with no duplicated secret-fetch logic.
#
# TIERS. This file is the BASE tier in full: install, then lint/format/typecheck/test/integration/
# build/e2e. The HEAVY tier (mobile Maestro + the recipe/food k6 load tests) lives in its own reusable
# workflow, `_ci-heavy.yml`, called only by heavy-e2e.yml / recipe-loadtest.yml / ci-full.yml.
#
# Those jobs used to live HERE behind `run_mobile_maestro` / `run_load_test` inputs, with a
# `run_base_jobs` input so a heavy-only caller could switch this tier off. Two reasons that is gone:
# GitHub renders every job of a called workflow in every caller's run graph regardless of `if:`, so each
# PR run showed three permanently-`skipped` jobs that read as a broken pipeline; and tier membership is
# better expressed by WHICH workflow a caller invokes than by booleans threaded through ~16 `if:` gates.
# The collision that `run_base_jobs` originally fixed — heavy-e2e.yml starting a SECOND concurrent
# `e2e-web` on the same commit, two Playwright suites tearing down each other's shared sandbox Clerk
# sign-in fixture — is now structurally impossible: heavy-e2e.yml no longer calls this file at all.
#
# Hardening path (requires repo/IAM setup, see docs/CI_ARCHITECTURE.md): move AWS auth to OIDC with
# two stage-scoped roles and adopt GitHub Environments so prod secrets are unreachable from PR runs.

on:
    workflow_call:
        inputs:
            stage:
                description: Deployment stage — 'sandbox' (PRs) or 'prod' (main)
                required: true
                type: string
        # Declared EXPLICITLY so callers can drop `secrets: inherit` (zizmor `secrets-inherit`), which
        # hands a called workflow every secret in the repository rather than the two it uses. These two are
        # the complete set this file consumes — they are the only `secrets.*` references in it, and they go
        # nowhere except the `load-secrets` composite action's inputs.
        #
        # `required: false` is deliberate, not laziness: GitHub WITHHOLDS secrets from fork PRs and
        # Dependabot runs, and this pipeline is built to degrade gracefully there — `load-secrets` carries
        # `continue-on-error` and the dependent steps gate on `steps.secrets.outcome` (see the inventory in
        # `workflow-invariants.test.ts`). Marking them required would turn that designed skip into an
        # unfixable red check on exactly the PRs that cannot supply them.
        secrets:
            AWS_ACCESS_KEY_ID:
                description: AWS access key id, used only to read stage-scoped secrets from Secrets Manager
                required: false
            AWS_SECRET_ACCESS_KEY:
                description: AWS secret access key paired with AWS_ACCESS_KEY_ID
                required: false

permissions:
    contents: read

env:
    DEFAULT_AWS_REGION: ${{ vars.DEFAULT_AWS_REGION }}

jobs:
    install:
        name: Install dependencies
        runs-on: ubuntu-latest
        # Seeds the `actions/cache` entry every job below restores. `_ci-heavy.yml` keeps its own copy of
        # this job: a reusable workflow cannot `needs:` a job in another workflow.
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - name: Cache dependencies
              uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                      packages/*/*/node_modules
                      packages/*/*/*/node_modules
                      packages/*/*/*/*/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

    build-ui:
        name: Build @commise/ui
        runs-on: ubuntu-latest
        needs: [install]
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24
                  cache: npm
            - name: Restore dependencies
              uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                      packages/*/*/node_modules
                      packages/*/*/*/node_modules
                      packages/*/*/*/*/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
            - run: npm run build --workspace=@commise/ui
            - name: Cache UI build artifacts
              uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
              with:
                  path: packages/apps/commise/ui/dist
                  key: ${{ runner.os }}-ui-dist-${{ github.sha }}

    lint:
        name: Lint
        runs-on: ubuntu-latest
        needs: [install]
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24
                  cache: npm
            - name: Restore dependencies
              uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                      packages/*/*/node_modules
                      packages/*/*/*/node_modules
                      packages/*/*/*/*/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
            - run: npx turbo run lint

            # Workflow files get NO coverage from `turbo run lint` — eslint does not read YAML. GitHub
            # validates them only at dispatch time, and an invalid one does not fail a check: it produces a
            # zero-job `startup_failure` attributed to the PUSH event, so the workflow that should have run
            # SILENTLY DOES NOT. That is how a broken `sandbox-deploy.yml` shipped and the per-PR deploy
            # simply never started (issue #124's first run) — every local gate was green, YAML parsed, and
            # even the official Actions JSON schema validated it.
            #
            # The defect was a literal `${{` `}}` written as PROSE inside a `run:` block comment. GitHub
            # interpolates expressions in `run:` bodies BEFORE the shell sees them, comments included, so an
            # empty interpolation is a syntax error. Only an expression-aware linter catches that class.
            #
            # actionlint is pinned: it is the validator, so an unpinned upgrade could change what passes.
            - name: Lint GitHub workflow files (actionlint — expression + context checks)
              run: |
                  set -euo pipefail
                  version=1.7.12
                  # Pinned AND checksum-verified. The version pin alone only fixes WHICH release is fetched;
                  # it says nothing about the bytes that arrive. Since actionlint is the validator, a swapped
                  # artifact would change what passes review while every check stayed green — so verify the
                  # digest from upstream's published `*_checksums.txt`. Integrity, not authenticity: upstream
                  # publishes no signature, so this proves the bytes are the ones reviewed, not who built them.
                  sha256=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
                  curl -sSfL -o /tmp/actionlint.tar.gz \
                    "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz"
                  echo "${sha256}  /tmp/actionlint.tar.gz" | sha256sum --check --strict
                  tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
                  # shellcheck/pyflakes are off: this gate is about workflow VALIDITY, and the runner has
                  # neither tool, which would otherwise be reported as errors on every embedded script.
                  /tmp/actionlint -shellcheck= -pyflakes= .github/workflows/*.yml

            # `turbo run lint` reads the AST but never the MANIFEST, so a package importing something it
            # does not declare passes every local gate and resolves only through npm workspace hoisting.
            # That is how `@commise/i18n` (36 files) and `@commise/features-core` (24 web + 15 mobile,
            # including value imports) sat undeclared in production source — the same class as the
            # prod.package.json/clean-state-build failure, invisible until an isolated install.
            #
            # This is a RATCHET, not a plain gate: 135 findings remain (mostly @testing-library
            # devDependency gaps, 8 k6 runtime imports, one real package cycle, one false positive), so
            # failing on any finding would block every PR. The 26 distinct (package, dependency, rule)
            # triples are recorded in scripts/boundaries-baseline.json and a NEW one fails the build.
            # Deliberately NOT `continue-on-error` — see scripts/boundariesRatchet.mjs for why a
            # green-because-ignored step is the defect class this repo is trying to eliminate.
            #
            # ⚠️ `npm run boundaries` SPAWNS turbo from inside the ratchet — it is deliberately NOT
            # `turbo boundaries | node …` any more. A pipeline exits with its LAST command's status, so
            # that form returned 0 whenever the ratchet was satisfied EVEN IF turbo crashed or the
            # subcommand did not exist, and this step was green having checked nothing (PR #91 review).
            # `set -o pipefail` does not fix it: npm has no `script-shell` set, so scripts run under
            # `/bin/sh` = dash on ubuntu-latest, which rejects `-o pipefail`. Do not reintroduce the pipe.
            - name: Workspace boundaries (undeclared-dependency ratchet)
              run: npm run boundaries

    format:
        name: Format check
        runs-on: ubuntu-latest
        needs: [install]
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24
                  cache: npm
            - name: Restore dependencies
              uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                      packages/*/*/node_modules
                      packages/*/*/*/node_modules
                      packages/*/*/*/*/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
            - run: npx turbo run format:check

    typecheck:
        name: Typecheck
        runs-on: ubuntu-latest
        needs: [install]
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24
                  cache: npm
            - name: Restore dependencies
              uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                      packages/*/*/node_modules
                      packages/*/*/*/node_modules
                      packages/*/*/*/*/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
            - run: npx turbo run typecheck

    test:
        name: Test
        runs-on: ubuntu-latest
        needs: [install]
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24
                  cache: npm
            - name: Restore dependencies
              uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                      packages/*/*/node_modules
                      packages/*/*/*/node_modules
                      packages/*/*/*/*/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
            - run: npx turbo run test

    integration-identity:
        name: Integration (identity — Postgres)
        runs-on: ubuntu-latest
        needs: [install]
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: identity_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24
                  cache: npm
            - name: Restore dependencies
              uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                      packages/*/*/node_modules
                      packages/*/*/*/node_modules
                      packages/*/*/*/*/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
            # Self-contained: the integration suite bootstraps the schema from migrations against the
            # Postgres service and proves create-user idempotency. No AWS/Clerk secrets required.
            - name: Run identity integration tests
              env:
                  DATABASE_URL: postgres://postgres:postgres@localhost:5432/identity_test
              run: npm run test:integration --workspace=@kitchensink/identity-service

    # identity-webhooks had NO integration tier at all until 2026-08-07 — and it owns the GDPR erasure
    # WRITE path. Its unit specs mock the Drizzle builder as `{ where: () => Promise.resolve() }` and
    # record deletes as the literal string 'table', so they structurally cannot observe a WHERE clause or
    # which table was hit. Three mutations were proven to pass that unit suite while being catastrophic:
    # dropping the WHERE from the erasure UPDATE (erases EVERY user row), replacing the companion purge
    # with `delete(users)` (hard-deletes a row CR-002 R1 says must never be hard-deleted), and dropping the
    # WHERE from both companion DELETEs (purges every user's accounts and profiles). This tier is what
    # makes those visible.
    #
    # Needs NO LocalStack and NO Clerk secrets — verified by running it with DATABASE_URL as the only env
    # var. Its own database, deliberately separate from identity's: both tiers DROP the `public` schema in
    # global-setup, so sharing one would have them racing each other's resets.
    integration-identity-webhooks:
        name: Integration (identity-webhooks — Postgres)
        runs-on: ubuntu-latest
        needs: [install]
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: identity_webhooks_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24
                  cache: npm
            - name: Restore dependencies
              uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                      packages/*/*/node_modules
                      packages/*/*/*/node_modules
                      packages/*/*/*/*/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
            # The tier skips cleanly when DATABASE_URL is unset and HARD-FAILS when it is set but
            # unreachable (verified: ECONNREFUSED aborts the run rather than reporting a pass). So setting
            # it here is what makes the tier actually execute — do not drop this env block thinking the
            # suite self-configures.
            - name: Run identity-webhooks integration tests
              env:
                  DATABASE_URL: postgres://postgres:postgres@localhost:5432/identity_webhooks_test
              run: npm run test:integration --workspace=@kitchensink/identity-webhooks

    integration-food:
        name: Integration (food — Postgres)
        runs-on: ubuntu-latest
        needs: [install]
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: food_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24
                  cache: npm
            - name: Restore dependencies
              uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                      packages/*/*/node_modules
                      packages/*/*/*/node_modules
                      packages/*/*/*/*/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
            # Self-contained: the integration suite bootstraps the kitchensink_food schema from the
            # ordered migration SQL against the Postgres service and validates the FR-028 CHECK,
            # fetch_queue dedup, the singleton seed, indexes, and pg_trgm. No AWS/Clerk secrets.
            - name: Run food integration tests
              env:
                  DATABASE_URL: postgres://postgres:postgres@localhost:5432/food_test
              run: npm run test:integration --workspace=packages/services/food-service

    integration-recipe:
        name: Integration (recipe — Postgres + LocalStack)
        runs-on: ubuntu-latest
        needs: [install]
        # Feature 001 recipe-service. Postgres backs the relational data; LocalStack provides the AWS
        # services recipe-service uses (S3 photo/version archive, SQS archive queue) so the integration
        # suite can exercise them without real AWS. Mirrors `integration-food`.
        #
        # The comment here used to say recipe-service was "still a skeleton (only /health is wired)" and that
        # `--if-present` kept the job green until a suite landed. Both are long obsolete — the script and 36
        # integration specs exist — so `--if-present` had stopped being a placeholder and become a hazard:
        # its only remaining effect was to make a script RENAME fail silently green. Dropped.
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: recipe_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
            localstack:
                image: localstack/localstack:4.4.0
                env:
                    # Community tier — no auth token. recipe-service's AWS surface (S3 archive, SQS,
                    # EventBridge=`events`, Secrets Manager, SSM) is all free/Community.
                    SERVICES: s3,sqs,sns,events,secretsmanager,sts,iam,logs,cloudwatch,ssm
                ports:
                    - 4566:4566
                options: >-
                    --health-cmd "curl -sf http://localhost:4566/_localstack/health | grep -q available"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 20
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24
                  cache: npm
            - name: Restore dependencies
              uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                      packages/*/*/node_modules
                      packages/*/*/*/node_modules
                      packages/*/*/*/*/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
            # The suite bootstraps the schema from src/database/migrations against the Postgres service
            # and seeds its own fixtures (same pattern as identity/food). No AWS/Clerk secrets required.
            - name: Run recipe integration tests
              env:
                  DATABASE_URL: postgres://postgres:postgres@localhost:5432/recipe_test
                  AWS_ENDPOINT_URL: http://localhost:4566
                  AWS_ACCESS_KEY_ID: test
                  AWS_SECRET_ACCESS_KEY: test
                  AWS_REGION: us-east-1
                  # recipe-service reads S3 config via its own env keys (config/config.types.ts), not the
                  # generic AWS_* ones — LocalStack needs path-style addressing, so both are required or
                  # the photos/versions S3 clients emit virtual-host URLs that don't resolve.
                  S3_ENDPOINT: http://localhost:4566
                  S3_FORCE_PATH_STYLE: 'true'
                  S3_BUCKET_PHOTOS: commise-photos
                  S3_BUCKET_VERSIONS: commise-versions
                  CLOUDFRONT_URL: http://localhost:4566/commise-photos
              run: npm run test:integration --workspace=@kitchensink/recipe-service

    integration-recipe-workers:
        name: Integration (recipe-workers — Postgres + LocalStack)
        runs-on: ubuntu-latest
        needs: [install]
        # Feature 001 recipe-workers. The GDPR account-erasure worker and the version-archive drain make
        # DESTRUCTIVE, compliance-critical guarantees (FK/cascade behaviour, the `cloned_from_id` NO-ACTION
        # detach, "no deleted_at filter", the dual-bucket owner-prefix S3 sweep, the archive-resurrection
        # guard) that a fake db/mocked S3 CANNOT prove — only real Postgres + real S3 can. Those specs live
        # in packages/services/recipe-workers/__tests__/integration and had NO CI job, so the guarantees
        # passed only on a developer's machine; this job puts them under CI. Mirrors `integration-recipe`:
        # Postgres backs the relational cascades, LocalStack provides the S3 the sweep/guard exercise.
        #
        # UNLIKE recipe-service, the workers integration suite has NO vitest globalSetup that migrates the
        # schema — it deliberately drives the exported `db`-taking seams over a caller-supplied pool and
        # ASSUMES the recipe schema already exists (see the spec headers). So this job applies the SAME
        # ordered, hand-authored recipe-service migrations (src/database/migrations/000*_*.sql — the single
        # source of truth for the schema, applied exactly as recipe-service's tests/global-setup.ts does:
        # a clean `public`, then each file in filename order) to the throwaway DB BEFORE the run. Without
        # this step every spec errors with `relation "recipes" does not exist` (verified). The specs
        # self-provision their S3 buckets via CreateBucket, so no bucket-init step is needed here.
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: recipe_workers_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
            localstack:
                image: localstack/localstack:4.4.0
                env:
                    # Community tier — no auth token. The workers' AWS surface is S3 only (SQS is driven
                    # via the exported seams, not a live queue), but the S3 family is free/Community.
                    SERVICES: s3,sqs
                ports:
                    - 4566:4566
                options: >-
                    --health-cmd "curl -sf http://localhost:4566/_localstack/health | grep -q available"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 20
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24
                  cache: npm
            - name: Restore dependencies
              uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                      packages/*/*/node_modules
                      packages/*/*/*/node_modules
                      packages/*/*/*/*/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
            # Apply the recipe schema to the throwaway DB FIRST — the workers integration specs have no
            # globalSetup and assume the schema is present. This is the SAME set of ordered migration SQL
            # files recipe-service's tests/global-setup.ts applies (drop `public`, then each file in
            # filename order), so the schema under test is byte-identical to the recipe-service run.
            - name: Apply recipe schema migrations to the throwaway DB
              env:
                  PGHOST: localhost
                  PGPORT: '5432'
                  PGUSER: postgres
                  PGPASSWORD: postgres
                  PGDATABASE: recipe_workers_test
              run: |
                  psql -v ON_ERROR_STOP=1 -c 'DROP SCHEMA IF EXISTS public CASCADE; CREATE SCHEMA public;'
                  for f in packages/services/recipe-service/src/database/migrations/*.sql; do
                      echo "applying $f"
                      psql -v ON_ERROR_STOP=1 -f "$f"
                  done
            # Drives the erasure/archive integration specs against the real, migrated Postgres + LocalStack
            # S3. The S3 clients hardcode `test`/`test` creds and force path-style addressing, so only the
            # endpoint + bucket names come from env; both are set for parity with `integration-recipe`.
            # The lambda BUNDLE must exist before the integration tier. `workers-app-synth.integration.test.ts`
            # spawns the real CDK app, and `RecipeWorkersStack` refuses to synth without `dist/` — it asserts
            # the bundle is present rather than deploying a phantom `lambda.Code.fromAsset`. That check is
            # correct; what was missing is that this job never built it, so the spec passed locally (where a
            # previous build had left `dist/` lying around) and failed in CI's clean checkout. Same class as
            # the `cdk.out` format:check and the incremental-tsc-skips-emit traps: a build artifact that
            # exists locally by accident is not a dependency that exists.
            #
            # Run through turbo, not the bare npm script, so `^build` drags in the shared packages the bundle
            # needs (`@kitchensink/recipe-core`) instead of assuming they are already built.
            - name: Build the recipe-workers lambda bundle (the synth spec needs it)
              run: npx turbo run build --filter=@kitchensink/recipe-workers

            - name: Run recipe-workers integration tests
              env:
                  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/recipe_workers_test
                  AWS_ENDPOINT_URL: http://localhost:4566
                  AWS_ACCESS_KEY_ID: test
                  AWS_SECRET_ACCESS_KEY: test
                  AWS_REGION: us-east-1
                  S3_ENDPOINT: http://localhost:4566
                  S3_FORCE_PATH_STYLE: 'true'
                  S3_BUCKET_PHOTOS: commise-photos
                  S3_BUCKET_VERSIONS: commise-versions
              run: npm run test:integration --workspace=@kitchensink/recipe-workers

    integration-selfcontained:
        # Static name covering both self-contained integration suites (same precedent as `e2e-backend`).
        # These two tiers use REAL adapters — the app's actual Tailwind compiler, and the client's real
        # `ky`/`fetch` transport against a booted `node:http` server — but need NO service containers, so
        # giving each its own job would pay two checkout+restore cycles for sub-second suites.
        name: Integration (self-contained — web + recipe client)
        runs-on: ubuntu-latest
        # build-ui: the web suite compiles `src/app/globals.css`, which `@import`s `@commise/ui/theme.css`
        # — and that export resolves to `dist/theme.css`. Without the built UI the compile step fails.
        needs: [install, build-ui]
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24
                  cache: npm
            - name: Restore dependencies
              uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                      packages/*/*/node_modules
                      packages/*/*/*/node_modules
                      packages/*/*/*/*/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
            - name: Restore UI build artifacts
              uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
              with:
                  path: packages/apps/commise/ui/dist
                  key: ${{ runner.os }}-ui-dist-${{ github.sha }}
            - name: Ensure @commise/ui is built (fallback if the per-SHA cache restore missed)
              run: '[ -n "$(ls -A packages/apps/commise/ui/dist 2>/dev/null)" ] || npm run build --workspace=@commise/ui'
            - name: Run web integration tests
              run: npm run test:integration --workspace=@commise/web
            - name: Run recipe-service-client integration tests
              run: npm run test:integration --workspace=@kitchensink/recipe-service-client

    e2e-food:
        name: E2E (food — booted app + Postgres + LocalStack)
        runs-on: ubuntu-latest
        needs: [install]
        # Two service containers mirror infra/localstack/docker-compose.yml: a plain Postgres (the DB,
        # NOT LocalStack RDS) and a LocalStack container for the AWS services food-service will use from
        # Phase 3 (EventBridge=`events`, SQS, Secrets Manager). The CURRENT E2E only boots the Nest app
        # and exercises /health + the migrated Postgres, so it does NOT yet call LocalStack; the
        # container is provisioned now so the Phase 3 AWS-service flows plug straight in.
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: food_e2e
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
            localstack:
                image: localstack/localstack:4.4.0
                env:
                    # Community tier — no auth token. Every service food-service uses (EventBridge=`events`,
                    # SQS, SNS, Secrets Manager, SSM, IAM, STS, CloudWatch Logs) is free/Community; the
                    # Pro-only services (RDS, ECS) are deliberately avoided (Docker Postgres for the DB,
                    # the Nest app boots as a process). Add LOCALSTACK_AUTH_TOKEN only if a Pro feature is
                    # ever adopted.
                    SERVICES: secretsmanager,events,sqs,sns,sts,iam,logs,cloudwatch,ssm
                ports:
                    - 4566:4566
                options: >-
                    --health-cmd "curl -sf http://localhost:4566/_localstack/health | grep -q available"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 20
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24
                  cache: npm
            - name: Restore dependencies
              uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                      packages/*/*/node_modules
                      packages/*/*/*/node_modules
                      packages/*/*/*/*/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
            # Boots the real food-service Nest app against the Postgres service, applies the
            # kitchensink_food migration, and asserts GET /health + DB reachability end to end.
            - name: Run food E2E tests
              env:
                  DATABASE_URL: postgres://postgres:postgres@localhost:5432/food_e2e
                  USDA_API_KEY: e2e-dummy-key
              run: npm run test:e2e --workspace=packages/services/food-service

    # recipe-service's ENTIRE e2e tier was dark until 2026-08-07: 14 spec files / 54 tests existed and NO
    # workflow invoked them. `test:e2e` was wired for food-service, identity, identity-webhooks, web and
    # mobile — never recipe-service. Among the unrun specs: `erasure-lock.e2e.test.ts` (GDPR C-007),
    # `throttle.e2e.test.ts`, `recipe-input-validation.e2e.test.ts`. A regression in any of those reached
    # production behind green checks. Measured green in 15s before wiring, so this is not papering over a
    # broken tier. Same services and env block as `integration-recipe` — the environment it was verified in.
    e2e-recipe:
        name: E2E (recipe — Postgres + LocalStack)
        runs-on: ubuntu-latest
        needs: [install]
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: recipe_e2e
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
            localstack:
                image: localstack/localstack:4.4.0
                env:
                    SERVICES: s3,sqs,sns,events,secretsmanager,sts,iam,logs,cloudwatch,ssm
                ports:
                    - 4566:4566
                options: >-
                    --health-cmd "curl -sf http://localhost:4566/_localstack/health | grep -q available"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 20
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24
                  cache: npm
            - name: Restore dependencies
              uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                      packages/*/*/node_modules
                      packages/*/*/*/node_modules
                      packages/*/*/*/*/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
            # Own database (recipe_e2e), separate from integration's recipe_test: both tiers reset the
            # schema in setup, so sharing one would have them racing. The S3_* pair is required, not
            # optional — recipe-service reads S3 config via its own env keys and LocalStack needs
            # path-style addressing or the photo/version clients emit unresolvable virtual-host URLs.
            - name: Run recipe E2E tests
              env:
                  DATABASE_URL: postgres://postgres:postgres@localhost:5432/recipe_e2e
                  AWS_ENDPOINT_URL: http://localhost:4566
                  AWS_ACCESS_KEY_ID: test
                  AWS_SECRET_ACCESS_KEY: test
                  AWS_REGION: us-east-1
                  S3_ENDPOINT: http://localhost:4566
                  S3_FORCE_PATH_STYLE: 'true'
                  S3_BUCKET_PHOTOS: commise-photos
                  S3_BUCKET_VERSIONS: commise-versions
                  CLOUDFRONT_URL: http://localhost:4566/commise-photos
              run: npm run test:e2e --workspace=@kitchensink/recipe-service

    build:
        name: Build ${{ matrix.workspace }}
        runs-on: ubuntu-latest
        needs: [install, build-ui]
        strategy:
            fail-fast: false
            matrix:
                workspace:
                    - '@kitchensink/identity-service'
                    - '@kitchensink/identity-webhooks'
                    - '@commise/web'
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24
                  cache: npm
            - name: Restore dependencies
              uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                      packages/*/*/node_modules
                      packages/*/*/*/node_modules
                      packages/*/*/*/*/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
            - name: Restore UI build artifacts
              uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
              with:
                  path: packages/apps/commise/ui/dist
                  key: ${{ runner.os }}-ui-dist-${{ github.sha }}
            - name: Ensure @commise/ui is built (fallback if the per-SHA cache restore missed)
              if: matrix.workspace == '@commise/web'
              run: '[ -n "$(ls -A packages/apps/commise/ui/dist 2>/dev/null)" ] || npm run build --workspace=@commise/ui'

            # The web build statically prerenders Clerk-wrapped pages and needs a real publishable
            # key. Load the stage-scoped key; if creds are unavailable (e.g. fork PRs) the build is
            # skipped rather than failing.
            - name: Load ${{ inputs.stage }} secrets
              if: matrix.workspace == '@commise/web'
              id: secrets
              continue-on-error: true
              uses: ./.github/actions/load-secrets
              with:
                  stage: ${{ inputs.stage }}
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ env.DEFAULT_AWS_REGION }}

            - name: Build
              if: matrix.workspace != '@commise/web' || steps.secrets.outcome == 'success'
              run: npm run build --workspace="$WORKSPACE"
              # The web app's endpoints are declared with NO default and validated at build time
              # (src/config/env.ts), so `next build` FAILS unless they are supplied — by design: that is
              # what stops an unconfigured build from inlining `http://localhost:3000` into a bundle it
              # ships to real browsers, which is exactly what reached the sandbox preview.
              #
              # This job only proves the app COMPILES; its output is never deployed (Vercel builds the
              # preview, the prod pipeline builds prod). So localhost is the honest value here — it makes
              # the build hermetic and needs no cloud endpoint. Harmless for the other workspaces.
              env:
                  # Via `env:` rather than interpolated into the command, so no `${{ … }}` reaches a shell
                  # anywhere in this file. The matrix values are static literals, so this is uniformity and
                  # defence-in-depth rather than a live injection fix.
                  WORKSPACE: ${{ matrix.workspace }}
                  NEXT_PUBLIC_RECIPE_API_URL: http://localhost:3000
                  NEXT_PUBLIC_IDENTITY_API_URL: http://localhost:4000
                  # `src/config/env.ts` now REQUIRES the Clerk publishable key and asserts it belongs to the
                  # same stage as the endpoints above (the 2026-08-07 outage: a sandbox key against production
                  # endpoints). These endpoints are localhost placeholders and this build is never deployed, so
                  # a development-instance placeholder is the coherent value. Deliberately NOT the real key via
                  # load-secrets: that would make this job depend on secrets, and GitHub withholds them from
                  # Dependabot-triggered runs, which would red every dependency PR. Decodes to `localhost$`.
                  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_bG9jYWxob3N0JA

    e2e-backend:
        # Static name (not a matrix) so a skipped run still shows a clean title instead of a raw
        # `${{ matrix.* }}` template. Both backend workspaces run sequentially in one job.
        name: E2E (backend services)
        runs-on: ubuntu-latest
        needs: build
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24
                  cache: npm
            - name: Restore dependencies
              uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                      packages/*/*/node_modules
                      packages/*/*/*/node_modules
                      packages/*/*/*/*/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
            - name: Load ${{ inputs.stage }} secrets
              id: secrets
              continue-on-error: true
              uses: ./.github/actions/load-secrets
              with:
                  stage: ${{ inputs.stage }}
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ env.DEFAULT_AWS_REGION }}
            - name: Run e2e tests
              if: steps.secrets.outcome == 'success'
              run: |
                  npm run test:e2e --workspace=@kitchensink/identity-service
                  npm run test:e2e --workspace=@kitchensink/identity-webhooks

    e2e-web:
        name: E2E (web — Playwright)
        runs-on: ubuntu-latest
        needs: build
        # `id-token: write` is what makes the Argos upload SECRETLESS (U10a): the CLI exchanges a short-lived
        # GitHub OIDC token for a build-scoped Argos credential, so no `ARGOS_TOKEN` secret exists to leak — and
        # a FORK pull request, which cannot read repository secrets at all, still uploads (Argos falls back to
        # its tokenless GitHub-Actions path when OIDC is unavailable). `contents: read` must be restated because
        # a job-level `permissions:` REPLACES the workflow default rather than adding to it.
        permissions:
            contents: read
            id-token: write
        # Base tier. Gating this is what stops a labelled PR from running TWO concurrent Playwright suites
        # on the same commit (ci-pr.yml + heavy-e2e.yml) against the shared sandbox Clerk instance.
        # Pin BOTH API origins the web app resolves from env. `src/config/env.ts` declares them with NO
        # default and validates at load, so an unset variable is a loud build failure rather than a silent
        # localhost fallback — which means CI must state them. Locally the same two values come from the
        # COMMITTED `.env.development`, which Next loads only for `next dev`; the Playwright webServer runs
        # `npm run dev`, so a developer machine and CI resolve identical origins.
        #
        # These localhost values are the CORRECT ones for this suite, not a placeholder: every spec mocks the
        # API with the ORIGIN-AGNOSTIC glob `page.route('**/api/v1/**')` (tests/e2e/utils/recipeApi.ts, plus the
        # two narrower `**/api/v1/...` routes in accountDangerZone/ingredientCatalogPick), and no spec ever builds
        # a URL out of these vars — so the browser-side origin only has to be a valid absolute URL. Port 3000
        # is the Playwright dev server itself and nothing listens on 4000, which means the SERVER-side SSR
        # prefetch (which `page.route` cannot intercept) fails and each page degrades to its client fetch —
        # exactly the behavior `tests/e2e/ssrPrefetch.spec.ts` asserts. Pointing these at a live backend would
        # make the suite non-hermetic, not more correct (that path is the opt-in `recipeLive.spec.ts`, gated on
        # E2E_LIVE_BACKEND=1, which stays skipped here).
        env:
            NEXT_PUBLIC_RECIPE_API_URL: http://localhost:3000
            NEXT_PUBLIC_IDENTITY_API_URL: http://localhost:4000
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24
                  cache: npm
            - name: Restore dependencies
              uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                      packages/*/*/node_modules
                      packages/*/*/*/node_modules
                      packages/*/*/*/*/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
            # The Playwright dev server imports @commise/ui/theme.css, so the built UI dist must
            # be present (mirrors the build job).
            - name: Restore UI build artifacts
              uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
              with:
                  path: packages/apps/commise/ui/dist
                  key: ${{ runner.os }}-ui-dist-${{ github.sha }}
            - name: Ensure @commise/ui is built (fallback if the per-SHA cache restore missed)
              run: '[ -n "$(ls -A packages/apps/commise/ui/dist 2>/dev/null)" ] || npm run build --workspace=@commise/ui'
            # The web E2E runs ClerkJS in a browser against the Playwright dev server on
            # http://localhost:3000. Clerk *production* instances (pk_live) are domain-locked and
            # refuse to initialize on any origin other than their production domain — ClerkJS aborts
            # with "Production Keys are only allowed for domain <domain>", so <SignIn> never mounts and
            # the sign-in page renders without the auth form (only the Next.js <title> survives). A
            # *development* instance (pk_test) permits localhost, so the web E2E must always use the
            # sandbox (dev) Clerk keys regardless of the pipeline stage. (Backend/mobile E2E don't run
            # ClerkJS in a localhost browser, so they keep using the stage's own secrets.)
            - name: Load sandbox (dev-instance) Clerk secrets for localhost web E2E
              id: secrets
              continue-on-error: true
              uses: ./.github/actions/load-secrets
              with:
                  stage: sandbox
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ env.DEFAULT_AWS_REGION }}
            # Cache the Playwright browser binaries (~/.cache/ms-playwright) keyed on the lockfile so
            # the Chromium download only happens when the Playwright version changes.
            - name: Cache Playwright browsers
              id: playwright-cache
              if: steps.secrets.outcome == 'success'
              uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
              with:
                  path: ~/.cache/ms-playwright
                  key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
            # Cache miss: download the browser + OS deps. Cache hit: browsers are restored, so only the
            # OS-level system dependencies still need installing.
            - name: Install Playwright browsers (cache miss)
              if: steps.secrets.outcome == 'success' && steps.playwright-cache.outputs.cache-hit != 'true'
              run: npx playwright install --with-deps chromium
            - name: Install Playwright system deps (cache hit)
              if: steps.secrets.outcome == 'success' && steps.playwright-cache.outputs.cache-hit == 'true'
              run: npx playwright install-deps chromium
            - name: Run web e2e tests
              if: steps.secrets.outcome == 'success'
              run: npm run test:e2e --workspace=@commise/web
            # U10a half 1 — hand the visual-regression PNGs to Argos for comparison. `npx --yes` rather than a
            # devDependency ON PURPOSE: adding one without regenerating package-lock.json would break every
            # `npm ci` in the pipeline, and this is the only place the CLI is ever invoked.
            #
            # Gated on the `ARGOS_ENABLED` repository VARIABLE (not a secret) so the step is inert until the
            # Argos project exists and is linked to this repository. Without that one-time setup the upload
            # cannot succeed, and a step that always fails is worse than one that is explicitly switched off.
            # Flip the variable to `true` once the project is linked; no code change needed.
            #
            # Not `continue-on-error`: once enabled, a failed upload means the visual gate did not run, and that
            # must be visible rather than green.
            - name: Upload visual-regression screenshots to Argos
              if: ${{ !cancelled() && steps.secrets.outcome == 'success' && vars.ARGOS_ENABLED == 'true' }}
              run: npx --yes @argos-ci/cli@6 upload packages/apps/commise/web/screenshots --build-name web
            # U10a half 2 — the mockup-fidelity artifact (wireframe/implementation image pairs, report.json and
            # a side-by-side index.html). Uploaded on PASS as well as failure: it is a REVIEW artifact, not a
            # failure diagnostic, and its whole purpose is to be read on a green run.
            - name: Upload mockup-fidelity report
              if: ${{ !cancelled() && steps.secrets.outcome == 'success' }}
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: mockup-fidelity-${{ inputs.stage }}
                  path: packages/apps/commise/web/mockup-fidelity
                  retention-days: 14
                  if-no-files-found: warn
            # Failure-only: upload the Playwright HTML report + traces so a red run is debuggable.
            - name: Upload Playwright report + traces
              if: failure() && steps.secrets.outcome == 'success'
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: playwright-report-${{ inputs.stage }}
                  path: |
                      packages/apps/commise/web/playwright-report
                      packages/apps/commise/web/test-results
                  retention-days: 7
                  if-no-files-found: ignore

    e2e-mobile:
        name: E2E (mobile — Vitest)
        runs-on: ubuntu-latest
        needs: build
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24
                  cache: npm
            - name: Restore dependencies
              uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                      packages/*/*/node_modules
                      packages/*/*/*/node_modules
                      packages/*/*/*/*/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
            - name: Load ${{ inputs.stage }} secrets
              id: secrets
              continue-on-error: true
              uses: ./.github/actions/load-secrets
              with:
                  stage: ${{ inputs.stage }}
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ env.DEFAULT_AWS_REGION }}
            - name: Run mobile e2e tests
              if: steps.secrets.outcome == 'success'
              run: npm run test:e2e --workspace=@commise/mobile
