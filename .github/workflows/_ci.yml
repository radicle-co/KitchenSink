        runs-on: ubuntu-latest
        needs: build
        # SHARDED, 4 ways. This job WAS the entire critical path of a PR run: measured on the green run
        # 31514368684 it started at +4.0m and ran 15.5m, ending at 19.5m, while every other job in the
        # pipeline finished by ~+6m (next slowest: `Test`, 4.8m). Wall clock was 19.4m for 42.1m of summed
        # job time — i.e. already ~2.2x compressed, with nothing left to win anywhere but here.
        #
        # WHY FOUR. The suite's cost is FLAT per test, not concentrated in one slow spec — measured from the
        # dot-reporter timeline of that same run: 8.29 s/test over tests 1–80, then 8.12 s/test over the
        # remaining 22 (102 tests, 14.5m). So there is no dominant serial spec to isolate, and sharding by
        # test count tracks sharding by time. Playwright balances whole FILES (it never splits one), and the
        # largest file here holds 9 tests against ~25.5 per shard, so 4 shards balance cleanly. Above ~4 the
        # win collapses into fixed cost — ~1.4m of checkout/deps/browser install plus a Next dev-server boot,
        # paid per shard — while the Clerk fixture count, the runner minutes, and the exposure to the
        # `waitForTestUserExternalId` setup flake all keep scaling linearly. 4 buys ~5.2m per shard
        # (≈ +6.5m runner minutes total) for roughly a 9m cut in wall clock; 8 would roughly double the added
        # cost to shave ~1.5m more, against the repo's cost posture (ADR-0007/ADR-0008).
        #
        # ⚠️ `COMMISE_E2E_SHARD` below is LOAD-BEARING, not decoration — see the env block.
        strategy:
            # Never fail-fast. Two reasons, both concrete: a cancelled shard is killed before Playwright's
            # `globalTeardown` runs, which LEAKS its Clerk fixture user (reclaimed only by the 12h age-gated
            # sweep); and one shard's failure would otherwise destroy the other three shards' results, so the
            # merged report — the whole point of the blob/merge split below — would be missing most of the run.
            fail-fast: false
            matrix:
                # ⛔ EIGHT, and the ceiling is arithmetic — see the Clerk interlock above.
                #
                # The only Clerk limit SHARED across shards is the Backend API (100 req/10s on a dev
                # instance); per-user and per-IP limits do not bind, because each shard provisions its own
                # user on its own runner IP. This suite spends ~1 BAPI call per test, so:
                #   4 shards ≈ 5 req/10s  → 20x margin      8 shards ≈ 10 req/10s → 10x margin
                #
                # Measured 2026-08-18: 108 tests in 34 files at ~9.8s each, and `setup` is a DEPENDENCY
                # project so it is not sharded — it runs IN FULL in every shard, at a measured 32-35s.
                # That fixed toll is what bounds this, not Clerk:
                #   4 shards → 27 tests + 35s setup ≈ 300s     8 shards → 14 tests + 35s ≈ 167s
                # Past ~8 the toll dominates (16 shards would pay 16x35s to run 7 tests each), so raising
                # this further buys nothing. `--shard` distributes whole FILES, and there are 34 of them,
                # so 8 shards still have real work to split.
                shard: [1, 2, 3, 4, 5, 6, 7, 8]
        # `id-token: write` is what makes the Argos upload SECRETLESS (U10a): the CLI exchanges a short-lived
        # GitHub OIDC token for a build-scoped Argos credential, so no `ARGOS_TOKEN` secret exists to leak — and
        # a FORK pull request, which cannot read repository secrets at all, still uploads (Argos falls back to
        # its tokenless GitHub-Actions path when OIDC is unavailable). `contents: read` must be restated because
        # a job-level `permissions:` REPLACES the workflow default rather than adding to it.
        permissions:
            contents: read
            id-token: write # the secretless Argos OIDC exchange — see the note above
        # Base tier. Gating this is what stops a labelled PR from running TWO concurrent Playwright suites
        # on the same commit (ci-pr.yml + heavy-e2e.yml) against the shared sandbox Clerk instance.
        # Pin BOTH API origins the web app resolves from env. `src/config/env.ts` declares them with NO
        # default and validates at load, so an unset variable is a loud build failure rather than a silent
        # localhost fallback — which means CI must state them. Locally the same two values come from the
        # COMMITTED `.env.development`, which Next loads only for `next dev`; the Playwright webServer runs
        # `npm run dev` there, so a developer machine and CI resolve identical origins.
        #
        # ⚠️ THESE ARE ALSO BAKED, not merely read at runtime. `NEXT_PUBLIC_*` is inlined by the bundler, so
        # the values that reach the BROWSER are the ones the `build` job stated when it compiled the artifact
        # this job serves. They are restated here because the Next SERVER process still reads them, and the two
        # statements must agree — `webE2eProductionBuild.test.ts` fails if they diverge.
        #
        # These localhost values are the CORRECT ones for this suite, not a placeholder: every spec mocks the
        # API with the ORIGIN-AGNOSTIC glob `page.route('**/api/v1/**')` (tests/e2e/utils/recipeApi.ts, plus the
        # two narrower `**/api/v1/...` routes in accountDangerZone/ingredientCatalogPick), and no spec ever builds
        # a URL out of these vars — so the browser-side origin only has to be a valid absolute URL. Port 3000
        # is the Playwright web server itself and nothing listens on 4000, which means the SERVER-side SSR
        # prefetch (which `page.route` cannot intercept) fails and each page degrades to its client fetch —
        # exactly the behavior `tests/e2e/ssrPrefetch.spec.ts` asserts. Pointing these at a live backend would
        # make the suite non-hermetic, not more correct (that path is the opt-in `recipeLive.spec.ts`, gated on
        # E2E_LIVE_BACKEND=1, which stays skipped here).
        env:
            NEXT_PUBLIC_RECIPE_API_URL: http://localhost:3000
            NEXT_PUBLIC_IDENTITY_API_URL: http://localhost:4000
            # ⛔ SERVE THE BUILD, DO NOT COMPILE DURING THE TESTS. `playwright.config.ts` reads this and runs
            # `next start` instead of `next dev` (tests/e2e/utils/webServerMode.ts owns the resolution and its
            # reasoning). It is stated EXPLICITLY rather than left to the `CI` default so that the run graph
            # shows which server this job drives — the difference is not cosmetic.
            #
            # With `next dev`, Next compiles a route the first time it is REQUESTED, and that compilation
            # lands inside the assertion that triggered it: specs that only click a link and read a heading
            # measured 18.3s / 14.4s / 10.6s, i.e. AT their budgets, and on 6e40d66a all three attempts of
            # `recipeSourceTabs.spec.ts` failed with `toHaveURL(/\/discover/)` still reading `/en/recipes`
            # fourteen times — a correct link that had not finished navigating in 5s. Retries hid most of it,
            # which is exactly why it survived. Reproduced on one machine: `dev` 56.4s with that spec rescued
            # by a retry, `start` 27.0s with nothing flaky.
            E2E_WEB_SERVER: start
            # ⚠️ THE CLERK SAFETY INTERLOCK FOR SHARDING. Read before touching the matrix.
            #
            # Each shard is a SEPARATE Playwright process, so each runs `globalSetup` AND `globalTeardown`.
            # `deriveRunKey` (tests/e2e/utils/runFixtureIdentity.ts) keys the run-scoped Clerk fixture on
            # GITHUB_RUN_ID + GITHUB_RUN_ATTEMPT + GITHUB_JOB — and `GITHUB_JOB` is the job's ID, identical
            # for every leg of a matrix. Without this variable all four shards would derive the SAME key, so
            # (a) four concurrent `createUser` calls would race one unique username, and (b) the first shard
            # to finish would DELETE the shared sign-in fixture the other three are still authenticating as,
            # since teardown's `own` rule matches it. That is bbf7ea7c's cross-workflow failure — "test
            # sign-in user is missing — globalSetup should have created it" — reproduced INSIDE one run.
            #
            # With it, each shard provisions, uses and deletes its OWN user, so teardown can never reach a
            # sibling's live fixture. That is also what keeps the SERIALIZATION guarantee intact: the suite is
            # serial (`workers: 1`, `fullyParallel: false`) because concurrent sign-ins AS ONE USER flake, and
            # Clerk's Frontend-API sign-in limits are scoped per USER and per IP. Four shards means four
            # distinct users on four distinct runner IPs, each still driving its sign-ins strictly one at a
            # time — so the per-user/per-IP budget each shard sees is unchanged from today's single stream,
            # rather than four streams contending for one. The per-INSTANCE limit that IS shared is the
            # Backend API (100 req/10s on a dev instance); this suite spends ~1 BAPI call per test, so four
            # shards ask for ~5 per 10s against that 100 — a ~20x margin.
            #
            # ── HOW THE `setup` PROJECT INTERACTS WITH THIS (verified against Playwright's own source) ──
            #
            # The suite now authenticates ONCE per run in a `setup` project and persists `storageState`
            # (tests/e2e/auth.setup.ts), which took the run from ~90 ticket sign-ins to ~7. A setup project
            # reached through `dependencies:` is classified `"dependency"`, not `"top-level"`
            # (`buildProjectsClosure` in playwright/lib/runner/index.js), and only top-level project suites are
            # handed to `filterForShard`. So `setup` is NOT sharded: it runs IN FULL in every shard.
            #
            # That is the correct behaviour here, and it is this variable that makes it correct. Each shard
            # derives its own run key, provisions its own Clerk user, and therefore must authenticate as ITS
            # user — and `authStatePath` keys the state FILE on the same run key, so no shard can restore a
            # session belonging to a user another shard's teardown deletes. Sharing one key or one state file
            # would recreate bbf7ea7c inside the run, one layer lower down.
            #
            # Do NOT delete this, do NOT raise `workers` above 1, and do NOT let two shards share a key.
            COMMISE_E2E_SHARD: ${{ matrix.shard }}
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24
            - name: Restore dependencies
              uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                      packages/*/*/node_modules
                      packages/*/*/*/node_modules
                      packages/*/*/*/*/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
            # ⛔ A CACHE MISS MUST BE SLOW, NOT FATAL. These jobs restore `node_modules` and never install,
            # so before this step a miss did not degrade them — it killed them: no `node_modules` means no
            # `tsc`, and the build step died with `sh: 1: tsc: not found` / `npm error code 127`. Across the
            # 8 Playwright shards plus the merged report that turned ONE evicted cache entry into 9 red jobs,
            # and a re-run usually went green because `install` had re-saved the entry meanwhile — which is
            # exactly what made it look like flake instead of a missing fallback.
            #
            # The miss is real and expected: the repo's Actions cache sits under a 10 GB cap with LRU
            # eviction, and every lockfile change mints a fresh entry, so an in-flight run CAN have its entry
            # evicted underneath it. The `::warning::` keeps that visible — a silent reinstall would hide the
            # eviction rate, which is the number worth watching.
            - name: Install dependencies if the cache missed
              run: |
                  if [ -d node_modules ] && [ -n "$(ls -A node_modules 2>/dev/null)" ]; then
                      exit 0
                  fi
                  echo "::warning::node_modules cache miss (entry evicted or never saved) — running npm ci"
                  npm ci
            # STILL REQUIRED after the move to `next start`, for a different reason — worth stating, because
            # the old one no longer holds. The server this job runs is PRE-BUILT (`@commise/ui` is in
            # `transpilePackages`, so it is compiled INTO the artifact; `.next/server` carries no
            # `require("@commise/ui…")` at all), so the dev server's `theme.css` import is gone. But
            # `tests/e2e/mockupFidelity.spec.ts` imports `@commise/ui/tokens/gradients`, which the package's
            # own exports map resolves to `./dist/tokens/gradients.js` — Playwright loads that spec directly,
            # so the dist must exist or the shard holding it fails to collect.
            - name: Restore UI build artifacts
              uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
              with:
                  path: packages/apps/commise/ui/dist
                  key: ${{ runner.os }}-ui-dist-${{ github.sha }}
            - name: Ensure @commise/ui is built (fallback if the per-SHA cache restore missed)
              run: '[ -n "$(ls -A packages/apps/commise/ui/dist 2>/dev/null)" ] || npm run build --workspace=@commise/ui'
            # The web E2E runs ClerkJS in a browser against the Playwright dev server on
            # http://localhost:3000. Clerk *production* instances (pk_live) are domain-locked and
            # refuse to initialize on any origin other than their production domain — ClerkJS aborts
            # with "Production Keys are only allowed for domain <domain>", so <SignIn> never mounts and
            # the sign-in page renders without the auth form (only the Next.js <title> survives). A
            # *development* instance (pk_test) permits localhost, so the web E2E must always use the
            # sandbox (dev) Clerk keys regardless of the pipeline stage. (Backend/mobile E2E don't run
            # ClerkJS in a localhost browser, so they keep using the stage's own secrets.)
            - name: Load sandbox (dev-instance) Clerk secrets for localhost web E2E
              id: secrets
              continue-on-error: true
              uses: ./.github/actions/load-secrets
              with:
                  stage: sandbox
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ env.DEFAULT_AWS_REGION }}
            # THE PRODUCTION BUILD THIS SHARD SERVES. `playwright.config.ts` runs `next start` under CI
            # (`E2E_WEB_SERVER` in this job's `env:` above), and `next start` SERVES a build — it does not make
            # one. The `build` job made it once, with the sandbox Clerk key and these same localhost origins,
            # and all eight shards restore that one artifact rather than each paying a `next build`.
            #
            # No fallback build here, on purpose. A shard that reached this point without an artifact has a
            # broken pipeline (the upload is in its `needs` closure), and `next start` says so immediately and
            # loudly; rebuilding would paper over it at ~8x the cost. `if-no-files-found: error` on the upload
            # side is the other half of that.
            - name: Download the web production build
              if: steps.secrets.outcome == 'success'
              uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
              with:
                  name: web-next-build-${{ inputs.stage }}
                  path: packages/apps/commise/web/.next
            # Cache the Playwright browser binaries (~/.cache/ms-playwright) keyed on the lockfile so
            # the Chromium download only happens when the Playwright version changes.
            - name: Cache Playwright browsers
              id: playwright-cache
              if: steps.secrets.outcome == 'success'
              uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
              with:
                  path: ~/.cache/ms-playwright
                  key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
            # Cache miss: download the browser + OS deps. Cache hit: browsers are restored, so only the
            # OS-level system dependencies still need installing.
            # ⛔ BOUNDED AND RETRIED, because this step is the one that hangs.
            #
            # Both commands shell out to `apt-get` for Chromium's OS libraries. On 2026-08-18 two shards sat
            # in `install-deps` for 1h47m — the log's last line is apt fetching package lists from the
            # Ubuntu/Microsoft/Google mirrors, then nothing — while the other two had already cleared it and
            # finished in 6 and 10 minutes. A mirror stall is not our defect, but an UNBOUNDED one is: with
            # no step timeout it presents as "CI is still running" rather than a failure anyone can retry.
            #
            # 18 SECONDS is the measured normal for the cache-hit path. The budget is nevertheless 8
            # minutes, because a 3-minute one FAILED ALL EIGHT SHARDS on 2026-08-18: the mirror was serving
            # font packages at 30-60s each, which is slow rather than stuck, and a bound tight enough to
            # catch a stall is also tight enough to reject a bad night. 8 minutes still turns the 1h47m
            # hang seen earlier into a fast, retryable failure, which is the property that matters.
            #
            # ⚠️ Running this job in `mcr.microsoft.com/playwright` — which would remove apt entirely — was
            # TRIED and REVERTED. The image boots, but the dependency cache saved by the `install` job on
            # the host is not found inside the container, so `@commise/ui` cannot build (`tsc`, exit 127)
            # and every shard fails deterministically. That trades a transient mirror problem for a
            # permanent one. It is still the right long-term fix; it needs the node_modules question solved
            # first (install inside the container, or a container-keyed cache).
            #
            # The retry then absorbs exactly the
            # transient this was: one stalled fetch costs ~3 minutes and self-heals instead of costing a
            # re-run of the whole shard. `apt-get update` is re-run first because a half-populated list is
            # the state a killed fetch leaves behind.
            - name: Install Playwright browsers (cache miss)
              if: steps.secrets.outcome == 'success' && steps.playwright-cache.outputs.cache-hit != 'true'
              timeout-minutes: 12
              run: |
                  npx playwright install --with-deps chromium \
                      || { echo "::warning::playwright install stalled or failed — retrying once"; \
                           sudo apt-get update -qq; \
                           npx playwright install --with-deps chromium; }
            # ⛔ PROBE, don't pre-install. A cached browser BINARY is useless without its shared libraries,
            # but on the ubuntu-latest image those libraries are already present — and `install-deps` pays a
            # full `apt-get update` against Azure's mirrors to discover that. Every shard paid it, so one
            # flaky mirror took out shards 2/8 and 6/8 (`has timed out after 8 minutes`) on a run whose only
            # change was documentation, and the retry-once wrapper could not help: the stall consumed the
            # whole budget before the fallback was reached.
            #
            # Launching the browser is the ONLY evidence that actually matters here — it is exactly what the
            # shard is about to do, and it costs ~2s instead of ~3min. So apt is now the FALLBACK, reached
            # only when the launch really fails, and it keeps the update+retry that a genuine miss needs.
            # `--no-sandbox` because the probe runs as root on the runner, where Chromium's sandbox refuses
            # to start; the tests themselves launch through Playwright's own config, which is unaffected.
            - name: Ensure Playwright system deps (cache hit)
              if: steps.secrets.outcome == 'success' && steps.playwright-cache.outputs.cache-hit == 'true'
              timeout-minutes: 8
              run: |
                  if node -e "require('playwright-core').chromium.launch({args:['--no-sandbox']}).then(b => b.close())"; then
                      echo "chromium launches — system deps already satisfied, skipping apt"
                  else
                      echo "::warning::chromium failed to launch on the cached browser — installing system deps"
                      npx playwright install-deps chromium \
                          || { echo "::warning::playwright install-deps stalled or failed — retrying once"; \
                               sudo apt-get update -qq; \
                               npx playwright install-deps chromium; }
                  fi
            # `--shard` is Playwright's own splitter (it distributes whole FILES to balance test count, and
            # never splits a file). `--reporter=blob` overrides the config's `html` for CI only: a blob report
            # is the machine-readable intermediate that `merge-reports` recombines in the report job below, so
            # a failure stays diagnosable from ONE artifact instead of four partial HTML reports. The config
            # keeps `html` as its default so a local `npx playwright test` is unchanged.
            - name: Run web e2e tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
              if: steps.secrets.outcome == 'success'
              # ⚠️ The shard coordinates reach the shell through `env:`, NOT by `${{ }}` interpolation into
              # the `run:` body. Expanding a template directly into a shell script is the
              # `template-injection` class: the expansion happens BEFORE the shell sees the line, so the
              # value is spliced in as code rather than passed as data. These two happen to be integers
              # GitHub generates, so nothing is exploitable here today — but the audit is gating precisely
              # so that the pattern never gets copied to a value an outsider controls (a PR title, a branch
              # name, a comment body). The step NAME above may keep its `${{ }}`: a name is not executed.
              env:
                  SHARD_INDEX: ${{ matrix.shard }}
                  SHARD_TOTAL: ${{ strategy.job-total }}
              run: |
                  npm run test:e2e --workspace=@commise/web -- \
                      --shard="${SHARD_INDEX}/${SHARD_TOTAL}" \
                      --reporter=blob
            # One blob per shard, consumed ONLY by the report job. `!cancelled()` rather than `failure()`: the
            # merged report must describe the whole run, so a PASSING shard's blob is required too.
            - name: Upload blob report (shard ${{ matrix.shard }})
              if: ${{ !cancelled() && steps.secrets.outcome == 'success' }}
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: e2e-web-blob-${{ inputs.stage }}-${{ matrix.shard }}
                  path: packages/apps/commise/web/blob-report
                  retention-days: 1
                  if-no-files-found: ignore
            # The visual-regression PNGs and the mockup-fidelity pairs are produced by whichever SHARD happens
            # to hold `visualRegression.spec.ts` / `mockupFidelity.spec.ts`. They are staged per shard here and
            # consolidated in the report job, so Argos still receives ONE build for the commit rather than four
            # competing partial uploads.
            - name: Upload visual + fidelity output (shard ${{ matrix.shard }})
              if: ${{ !cancelled() && steps.secrets.outcome == 'success' }}
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: e2e-web-visual-${{ inputs.stage }}-${{ matrix.shard }}
                  path: |
                      packages/apps/commise/web/screenshots
                      packages/apps/commise/web/mockup-fidelity
                  retention-days: 1
                  if-no-files-found: ignore
            # Failure-only: the raw traces for THIS shard. The human-readable report is the MERGED one built
            # by `e2e-web-report`; this is the trace payload the blob report does not carry.
            - name: Upload Playwright traces (shard ${{ matrix.shard }})
              if: failure() && steps.secrets.outcome == 'success'
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: playwright-traces-${{ inputs.stage }}-${{ matrix.shard }}
                  path: packages/apps/commise/web/test-results
                  retention-days: 7
                  if-no-files-found: ignore

    # THE SINGLE SIGNAL for the web E2E tier, and the reason sharding does not cost the owner four checks to
    # reconcile. It recombines the four blob reports into ONE Playwright HTML report, does the ONE Argos upload
    # for the commit, and then RE-ASSERTS the shards' verdict as its own status.
    #
    # `!cancelled()` (not `success()`) is what makes it run when a shard FAILED — which is exactly when the
    # merged report matters most. Because the job then runs on failure, its own green would otherwise mask a
    # red shard, so the final step compares `needs.e2e-web.result` and exits non-zero. That comparison IS the
    # gate: without it this job would report success over a broken suite.
    e2e-web-report:
        name: E2E (web — Playwright) · merged report
        timeout-minutes: 15
        runs-on: ubuntu-latest
        needs: e2e-web
        if: ${{ !cancelled() }}
        permissions:
            # Checkout only — this job merges blob artifacts and uploads to Argos; it writes nothing to the repo.
            contents: read
            # Same secretless Argos OIDC exchange as the shard job — the upload moved here, so the permission
            # must move with it (a job-level `permissions:` REPLACES the workflow default rather than adding).
            # The comment must be TRAILING to satisfy `undocumented-permissions`: the audit reads the same
            # line, not the lines above it, which is why the block comment alone left this flagged.
            id-token: write # the secretless Argos OIDC exchange — see the note above
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24
            # `merge-reports` is part of the installed @playwright/test, so the same restored node_modules the
            # shards used is all this needs — no browser download (it renders a report, it runs no tests).
            - name: Restore dependencies
              uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                      packages/*/*/node_modules
                      packages/*/*/*/node_modules
                      packages/*/*/*/*/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
            # ⛔ A CACHE MISS MUST BE SLOW, NOT FATAL. These jobs restore `node_modules` and never install,
            # so before this step a miss did not degrade them — it killed them: no `node_modules` means no
            # `tsc`, and the build step died with `sh: 1: tsc: not found` / `npm error code 127`. Across the
            # 8 Playwright shards plus the merged report that turned ONE evicted cache entry into 9 red jobs,
            # and a re-run usually went green because `install` had re-saved the entry meanwhile — which is
            # exactly what made it look like flake instead of a missing fallback.
            #
            # The miss is real and expected: the repo's Actions cache sits under a 10 GB cap with LRU
            # eviction, and every lockfile change mints a fresh entry, so an in-flight run CAN have its entry
            # evicted underneath it. The `::warning::` keeps that visible — a silent reinstall would hide the
            # eviction rate, which is the number worth watching.
            - name: Install dependencies if the cache missed
              run: |
                  if [ -d node_modules ] && [ -n "$(ls -A node_modules 2>/dev/null)" ]; then
                      exit 0
                  fi
                  echo "::warning::node_modules cache miss (entry evicted or never saved) — running npm ci"
                  npm ci
            # `merge-multiple` flattens all four shards' blobs into one directory, which is the input shape
            # `merge-reports` expects. Absent blobs are tolerated: on a fork PR the shards skip their run
            # entirely (no secrets), and this job must not invent a red for that designed skip.
            - name: Download shard blob reports
              uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
              with:
                  pattern: e2e-web-blob-${{ inputs.stage }}-*
                  path: packages/apps/commise/web/blob-report
                  merge-multiple: true
              continue-on-error: true
            - name: Download shard visual + fidelity output
              uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
              with:
                  pattern: e2e-web-visual-${{ inputs.stage }}-*
                  path: packages/apps/commise/web
                  merge-multiple: true
              continue-on-error: true
            # ONE HTML report for the whole suite. Guarded on the blobs actually being present so a fork PR (or
            # a run whose shards never started) produces a clear "no blobs" note instead of a merge crash.
            - name: Merge shard reports into one Playwright HTML report
              id: merge
              run: |
                  if [ -z "$(ls -A packages/apps/commise/web/blob-report 2>/dev/null)" ]; then
                      echo "no blob reports found — the shards did not run (fork PR / missing secrets)"
                      echo "merged=false" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  npx playwright merge-reports --reporter html packages/apps/commise/web/blob-report
                  echo "merged=true" >> "$GITHUB_OUTPUT"
              env:
                  PLAYWRIGHT_HTML_OPEN: never
                  PLAYWRIGHT_HTML_OUTPUT_DIR: packages/apps/commise/web/playwright-report
            - name: Upload merged Playwright report
              if: steps.merge.outputs.merged == 'true'
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: playwright-report-${{ inputs.stage }}
                  path: packages/apps/commise/web/playwright-report
                  retention-days: 7
                  if-no-files-found: ignore
            # U10a half 1 — hand the visual-regression PNGs to Argos for comparison. `npx --yes` rather than a
            # devDependency ON PURPOSE: adding one without regenerating package-lock.json would break every
            # `npm ci` in the pipeline, and this is the only place the CLI is ever invoked.
            #
            # Gated on the `ARGOS_ENABLED` repository VARIABLE (not a secret) so the step is inert until the
            # Argos project exists and is linked to this repository. Without that one-time setup the upload
            # cannot succeed, and a step that always fails is worse than one that is explicitly switched off.
            # Flip the variable to `true` once the project is linked; no code change needed.
            #
            # It lives HERE rather than in the shard job so the commit gets ONE Argos build assembled from all
            # four shards' PNGs, instead of four racing partial uploads of the same build name.
            #
            # Not `continue-on-error`: once enabled, a failed upload means the visual gate did not run, and that
            # must be visible rather than green.
            - name: Upload visual-regression screenshots to Argos
              if: ${{ steps.merge.outputs.merged == 'true' && vars.ARGOS_ENABLED == 'true' }}
              run: npx --yes @argos-ci/cli@6 upload packages/apps/commise/web/screenshots --build-name web
            # U10a half 2 — the mockup-fidelity artifact (wireframe/implementation image pairs, report.json and
            # a side-by-side index.html). Uploaded on PASS as well as failure: it is a REVIEW artifact, not a
            # failure diagnostic, and its whole purpose is to be read on a green run.
            - name: Upload mockup-fidelity report
              if: steps.merge.outputs.merged == 'true'
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: mockup-fidelity-${{ inputs.stage }}
                  path: packages/apps/commise/web/mockup-fidelity
                  retention-days: 14
                  if-no-files-found: warn
            # THE GATE. This job runs on `!cancelled()`, so without this step a failed shard would sit behind a
            # GREEN merged-report check — precisely the "four signals the owner has to reconcile" problem in its
            # worst form, a single signal that lies. `needs.e2e-web.result` aggregates the whole matrix:
            # `success` only if every shard succeeded, otherwise `failure`/`cancelled`/`skipped`.
            - name: Re-assert the shards' verdict
              # Same `template-injection` reasoning as the shard step: the matrix result arrives as DATA in
              # `env:` rather than being expanded into the script. Note the quoting in the old form was not
              # protection — `'${{ ... }}'` is substituted before the shell parses the line, so a value
              # containing a quote would have ended the string and run whatever followed.
              env:
                  MATRIX_RESULT: ${{ needs.e2e-web.result }}
              run: |
                  result="${MATRIX_RESULT}"
                  echo "e2e-web matrix result: $result"
                  case "$result" in
                      success|skipped) exit 0 ;;
                      *) echo "::error::the web Playwright matrix did not pass ($result) — see the merged report artifact"; exit 1 ;;
                  esac

    e2e-mobile:
        name: E2E (mobile — Vitest)
        timeout-minutes: 30
        runs-on: ubuntu-latest
        needs: build
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24
            - name: Restore dependencies
              uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                      packages/*/*/node_modules
                      packages/*/*/*/node_modules
                      packages/*/*/*/*/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
            # ⛔ A CACHE MISS MUST BE SLOW, NOT FATAL. These jobs restore `node_modules` and never install,
            # so before this step a miss did not degrade them — it killed them: no `node_modules` means no
            # `tsc`, and the build step died with `sh: 1: tsc: not found` / `npm error code 127`. Across the
            # 8 Playwright shards plus the merged report that turned ONE evicted cache entry into 9 red jobs,
            # and a re-run usually went green because `install` had re-saved the entry meanwhile — which is
            # exactly what made it look like flake instead of a missing fallback.
            #
            # The miss is real and expected: the repo's Actions cache sits under a 10 GB cap with LRU
            # eviction, and every lockfile change mints a fresh entry, so an in-flight run CAN have its entry
            # evicted underneath it. The `::warning::` keeps that visible — a silent reinstall would hide the
            # eviction rate, which is the number worth watching.
            - name: Install dependencies if the cache missed
              run: |
                  if [ -d node_modules ] && [ -n "$(ls -A node_modules 2>/dev/null)" ]; then
                      exit 0
                  fi
                  echo "::warning::node_modules cache miss (entry evicted or never saved) — running npm ci"
                  npm ci
            - name: Load ${{ inputs.stage }} secrets
              id: secrets
              continue-on-error: true
              uses: ./.github/actions/load-secrets
              with:
                  stage: ${{ inputs.stage }}
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ env.DEFAULT_AWS_REGION }}
            - name: Run mobile e2e tests
              if: steps.secrets.outcome == 'success'
              run: npm run test:e2e --workspace=@commise/mobile
