    e2e-food:
        name: E2E (food — booted app + Postgres + LocalStack)
        timeout-minutes: 25
        runs-on: ubuntu-latest
        needs: [install]
        # Two service containers mirror infra/localstack/docker-compose.yml: a plain Postgres (the DB,
        # NOT LocalStack RDS) and a LocalStack container for the AWS services food-service will use from
