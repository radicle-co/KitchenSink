            # bodies so a pattern can never be copied to a value an outsider controls. (2) The filters
            # contain `*`, and an unquoted glob is subject to PATHNAME EXPANSION before turbo ever sees it —
            # `set -f` disables that, while leaving the word splitting that turns one string into several
            # `--filter` arguments. Quoting `"$TEST_FILTER"` instead would pass the whole thing as a SINGLE
            # argument, which turbo reads as one malformed filter and answers with zero tasks.
