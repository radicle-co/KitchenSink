            - name: Restore dependencies
              uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                      packages/*/*/node_modules
                      packages/*/*/*/node_modules
                      packages/*/*/*/*/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
            # ⛔ A CACHE MISS MUST BE SLOW, NOT FATAL. These jobs restore `node_modules` and never install,
            # so before this step a miss did not degrade them — it killed them: no `node_modules` means no
            # `tsc`, and the build step died with `sh: 1: tsc: not found` / `npm error code 127`. Across the
            # 8 Playwright shards plus the merged report that turned ONE evicted cache entry into 9 red jobs,
            # and a re-run usually went green because `install` had re-saved the entry meanwhile — which is
            # exactly what made it look like flake instead of a missing fallback.
            #
            # The miss is real and expected: the repo's Actions cache sits under a 10 GB cap with LRU
            # eviction, and every lockfile change mints a fresh entry, so an in-flight run CAN have its entry
            # evicted underneath it. The `::warning::` keeps that visible — a silent reinstall would hide the
            # eviction rate, which is the number worth watching.
            - name: Install dependencies if the cache missed
              run: |
                  if [ -d node_modules ] && [ -n "$(ls -A node_modules 2>/dev/null)" ]; then
                      exit 0
                  fi
                  echo "::warning::node_modules cache miss (entry evicted or never saved) — running npm ci"
                  npm ci
            - name: Restore UI build artifacts
              uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
              with:
                  path: packages/apps/commise/ui/dist
                  key: ${{ runner.os }}-ui-dist-${{ github.sha }}
            - name: Ensure @commise/ui is built (fallback if the per-SHA cache restore missed)
              if: matrix.workspace == '@commise/web'
              run: '[ -n "$(ls -A packages/apps/commise/ui/dist 2>/dev/null)" ] || npm run build --workspace=@commise/ui'

            # ⛔ SANDBOX, NOT `inputs.stage` — and that is the whole reason this artifact is usable.
            #
            # `NEXT_PUBLIC_*` is INLINED by the bundler, so the Clerk instance this bundle talks to is frozen
            # in right here. `e2e-web` now SERVES this build (`next start`) and signs into it with the SANDBOX
            # development instance — which is not a preference: Clerk production keys are domain-locked and
            # clerk-js aborts with "Production Keys are only allowed for domain <domain>" on localhost, so
            # <SignIn> never mounts. See `e2e-web`'s own load-secrets step for the full account.
            #
            # Loading `${{ inputs.stage }}` here would therefore bake a `pk_live` key on `main` into the very
            # bundle the localhost Playwright suite has to authenticate against. Both jobs read the ONE secret
            # `kitchensink/sandbox/identity/keys`, so the built instance and the harness instance cannot drift
            # apart — pinning two equal literals instead would let them go stale together.
            # `webE2eProductionBuild.test.ts` fails if either side moves.
            #
            # If creds are unavailable (e.g. fork PRs) the build is skipped rather than failing — and `e2e-web`
            # skips on the same condition, so the pair stays consistent.
            - name: Load sandbox (dev-instance) Clerk secrets for the web build
              if: matrix.workspace == '@commise/web'
              id: secrets
              continue-on-error: true
              uses: ./.github/actions/load-secrets
              with:
                  stage: sandbox
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ env.DEFAULT_AWS_REGION }}

            - name: Build
              if: matrix.workspace != '@commise/web' || steps.secrets.outcome == 'success'
              run: npm run build --workspace="$WORKSPACE"
              # The web app's endpoints are declared with NO default and validated at build time
              # (src/config/env.ts), so `next build` FAILS unless they are supplied — by design: that is
              # what stops an unconfigured build from inlining `http://localhost:3000` into a bundle it
              # ships to real browsers, which is exactly what reached the sandbox preview.
              #
              # ⚠️ THIS OUTPUT IS NOW RUN, not merely compiled. It is still deployed nowhere (Vercel builds the
              # preview, the prod pipeline builds prod), but `e2e-web` downloads it and serves it with
              # `next start`, so these values are the ones the Playwright suite's browser actually sees. They
              # are therefore the SAME localhost origins `e2e-web` states at runtime, and that equality is
              # asserted by `webE2eProductionBuild.test.ts` rather than left to review. Nothing listens on
              # :4000, and :3000 is the web server itself — which is deliberate: every spec mocks the API with
              # the origin-agnostic `page.route('**/api/v1/**')`, so the SSR-side prefetch fails and each page
              # degrades to its client fetch, exactly what `tests/e2e/ssrPrefetch.spec.ts` asserts.
              #
              # `NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY` is deliberately ABSENT here: it arrives from the sandbox
              # `load-secrets` step above, and a value on this line would override it (step `env:` beats
              # `$GITHUB_ENV`) and bake an instance the Playwright harness cannot sign into. It used to hold
              # the placeholder `pk_test_bG9jYWxob3N0JA` ("localhost$"), which was harmless while nothing ran
              # this bundle and is a live defect now.
              env:
                  # Via `env:` rather than interpolated into the command, so no `${{ … }}` reaches a shell
                  # anywhere in this file. The matrix values are static literals, so this is uniformity and
                  # defence-in-depth rather than a live injection fix.
                  WORKSPACE: ${{ matrix.workspace }}
                  NEXT_PUBLIC_RECIPE_API_URL: http://localhost:3000
                  NEXT_PUBLIC_IDENTITY_API_URL: http://localhost:4000

            # ⛔ AN ARTIFACT, NOT `actions/cache`. The repo's Actions cache sits under GitHub's 10 GB cap with
            # LRU eviction, and it has already been the outage: at 9.77 GB, entries were evicted out from under
            # running jobs and one `node_modules` miss turned into 9 red Playwright jobs (see the restore-step
            # comments above and `cache-prune.yml`). A per-SHA `.next` entry — one per commit, ~30 MB — would
            # feed exactly that. Artifacts have their own storage and retention, and this one is consumed by
            # `e2e-web` in the same run and by nothing else.
            #
            # `.next/cache` is webpack's incremental cache (1.7 GB locally) and `.next/standalone` is the
            # self-contained server for a future ECS deploy (130 MB); `next start` reads NEITHER, so both are
            # excluded and what ships is ~30 MB of `server/` + `static/` + manifests. The negated patterns do
            # not participate in the artifact's root calculation (`@actions/glob` omits them from the search
            # paths), so the single positive path stays the root and entries are relative to `.next` —
            # which is what makes the download below restore in place.
            - name: Upload the web production build for the Playwright suite
              if: matrix.workspace == '@commise/web' && steps.secrets.outcome == 'success'
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: web-next-build-${{ inputs.stage }}
                  path: |
                      packages/apps/commise/web/.next
                      !packages/apps/commise/web/.next/cache
                      !packages/apps/commise/web/.next/standalone
                  # 3, not the 1 the sibling blob-report artifacts use, and the difference is the RE-RUN
                  # window: "Re-run failed jobs" re-runs `e2e-web` alone and feeds it the ORIGINAL run's
                  # artifacts, so a 1-day retention turns re-running yesterday's red shard into
                  # "Artifact not found" — a pipeline failure that looks nothing like the test failure being
                  # investigated. The blobs are produced and consumed within one run and have no such window.
                  retention-days: 3
                  # NOT the default `warn`: an empty upload yields an empty download, and `next start` then
                  # dies with "could not find a production build" two jobs away from the cause.
                  if-no-files-found: error
                  # ⛔ REQUIRED. `.next` is a HIDDEN directory and upload-artifact v4 skips dotfiles unless
                  # told otherwise, so EVERY file in this artifact is filtered out and the step reports
                  # `No files were found with the provided path` — which `if-no-files-found: error` then
                  # (correctly) turns red. Being the artifact ROOT does not exempt it: the filter tests the
                  # path, and the dot is in the path. This is not a theoretical footnote — it is what failed
                  # on the first real run of this artifact.
                  include-hidden-files: true

    e2e-backend:
        # Static name (not a matrix) so a skipped run still shows a clean title instead of a raw
