              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                      packages/*/*/node_modules
                      packages/*/*/*/node_modules
                      packages/*/*/*/*/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
            # ⛔ A CACHE MISS MUST BE SLOW, NOT FATAL. These jobs restore `node_modules` and never install,
            # so before this step a miss did not degrade them — it killed them: no `node_modules` means no
            # `tsc`, and the build step died with `sh: 1: tsc: not found` / `npm error code 127`. Across the
            # 8 Playwright shards plus the merged report that turned ONE evicted cache entry into 9 red jobs,
            # and a re-run usually went green because `install` had re-saved the entry meanwhile — which is
            # exactly what made it look like flake instead of a missing fallback.
            #
            # The miss is real and expected: the repo's Actions cache sits under a 10 GB cap with LRU
            # eviction, and every lockfile change mints a fresh entry, so an in-flight run CAN have its entry
            # evicted underneath it. The `::warning::` keeps that visible — a silent reinstall would hide the
            # eviction rate, which is the number worth watching.
            - name: Install dependencies if the cache missed
              run: |
                  if [ -d node_modules ] && [ -n "$(ls -A node_modules 2>/dev/null)" ]; then
                      exit 0
                  fi
                  echo "::warning::node_modules cache miss (entry evicted or never saved) — running npm ci"
                  npm ci
            # Self-contained: the integration suite bootstraps the schema from migrations against the
            # Postgres service and proves create-user idempotency. No AWS/Clerk secrets required.
            - name: Run identity integration tests
              env:
                  DATABASE_URL: postgres://postgres:postgres@localhost:5432/identity_test
              run: npm run test:integration --workspace=@kitchensink/identity-service

    # identity-webhooks had NO integration tier at all until 2026-08-07 — and it owns the GDPR erasure
    # WRITE path. Its unit specs mock the Drizzle builder as `{ where: () => Promise.resolve() }` and
    # record deletes as the literal string 'table', so they structurally cannot observe a WHERE clause or
    # which table was hit. Three mutations were proven to pass that unit suite while being catastrophic:
    # dropping the WHERE from the erasure UPDATE (erases EVERY user row), replacing the companion purge
    # with `delete(users)` (hard-deletes a row CR-002 R1 says must never be hard-deleted), and dropping the
    # WHERE from both companion DELETEs (purges every user's accounts and profiles). This tier is what
    # makes those visible.
    #
    # Needs NO LocalStack and NO Clerk secrets — verified by running it with DATABASE_URL as the only env
    # var. Its own database, deliberately separate from identity's: both tiers DROP the `public` schema in
    # global-setup, so sharing one would have them racing each other's resets.

    # ⛔ THE DEPLOYED IDENTITY SERVICE — not a boot on the runner. Until 2026-09-04 this job compiled identity
    # and started it beside a Postgres service container: that proves the code CAN boot and proves nothing at
    # all about the thing users reach. Owner ruling 2026-09-04 — an end-to-end test drives the deployed
    # system, or it is skipped.
    #
    # ⚠️ The identity service is GLOBAL infra (ADR-0005): ONE deploy per BASE stage, shared by every `pr-{N}`
    # preview, so this drives `identity.{base stage}.{apex}` rather than a per-PR host. It is still gated on
    # the per-PR sandbox's liveness — a pull request with nothing deployed has no end-to-end tier at all, and
    # a shared-service check that ran anyway would be the one E2E job that is green on a PR with no sandbox.
    #
    # `deployedSmoke.ts` is this repository's ONE authority on "is this deployment good", so this COMPOSES it
    # rather than standing a second one beside it. Two of its five classifiers apply here: health, and the
    # CORS preflight — the check `/health` structurally cannot make, because a preflight is credential-less by
    # spec, so a service whose auth runs ahead of CORS answers 401 and is unreachable from every browser while
    # staying 200 to curl (a stale pre-CORS recipe build served pr-73 for fifteen days behind exactly that
    # green). The image-currency and dependency-wiring classifiers are deliberately NOT invoked: both compare
    # against what a DEPLOY just produced, and this workflow deploys nothing.
    e2e-identity-boot:
        name: E2E (identity — the deployed identity service)
        timeout-minutes: 15
        runs-on: ubuntu-latest
        needs: [install, resolve-sandbox]
        if: needs.resolve-sandbox.outputs.live == 'true'
        env:
            IDENTITY_ORIGIN: ${{ needs.resolve-sandbox.outputs.identity_origin }}
            WEB_ORIGIN: ${{ needs.resolve-sandbox.outputs.web_origin }}
        steps:
            # ⛔ FIRST, and before anything is fetched: every URL this job probes arrives from ANOTHER job's
            # output, and this job's whole purpose is to send requests to them. An origin outside our own apex
            # is either a resolver handed the wrong domain (an empty or re-pointed `DOMAIN_NAME` repository
            # variable resolves to `https://identity.sandbox.` — a name, and a request, that is not ours) or a
            # `needs` plumbing mistake. It fails LOUDLY rather than skipping: a target this job cannot vouch
            # for is a defect, not an absence.
            - name: Confirm every resolved target is under this repository's own domain
              env:
                  DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
              run: |
                  set -euo pipefail
                  if [ -z "${DOMAIN_NAME}" ]; then
                      echo '::error::the DOMAIN_NAME repository variable is empty — every resolved origin would be a bare label'
                      exit 1
                  fi
                  for origin in "${IDENTITY_ORIGIN}" "${WEB_ORIGIN}"; do
                      case "${origin}" in
                          "https://${DOMAIN_NAME}" | "https://"*".${DOMAIN_NAME}") echo "target ${origin}" ;;
                          *)
                              echo "::error::resolved target '${origin}' is not under ${DOMAIN_NAME} — refusing to drive it"
                              exit 1
                              ;;
                      esac
                  done
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
