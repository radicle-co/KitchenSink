            - name: Install dependencies if the cache missed
              run: |
                  if [ -d node_modules ] && [ -n "$(ls -A node_modules 2>/dev/null)" ]; then
                      exit 0
                  fi
                  echo "::warning::node_modules cache miss (entry evicted or never saved) — running npm ci"
                  npm ci
            - name: Restore UI build artifacts
              uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
              with:
                  path: packages/apps/commise/ui/dist
                  key: ${{ runner.os }}-ui-dist-${{ github.sha }}
            - name: Ensure @commise/ui is built (fallback if the per-SHA cache restore missed)
              run: '[ -n "$(ls -A packages/apps/commise/ui/dist 2>/dev/null)" ] || npm run build --workspace=@commise/ui'
            - name: Run web integration tests
              run: npm run test:integration --workspace=@commise/web
            - name: Run recipe-service-client integration tests
              run: npm run test:integration --workspace=@kitchensink/recipe-service-client
            # Self-contained like the recipe one: a real in-process `node:http` server, no Docker. It covers the
            # drift-layer-3 skew probe as a genuinely separate unauthenticated `GET /health` on the wire
            # (CODING_STANDARDS §15.2.5) — behaviour a mocked `fetch` cannot prove. A non-unit tier is only real
            # if CI calls it by name (§7), which is why this step exists alongside the config and the script.
            - name: Run food-service-client integration tests
              run: npm run test:integration --workspace=@kitchensink/food-service-client
            # The deployed-run seeder. Self-contained like the two client tiers above: a real in-process
            # `node:http` server that validates every request with the SHIPPED `createRecipeRequestSchema`
            # and answers shapes the SHIPPED client parses. That is the one thing a mocked test structurally
            # cannot do here — `seed.ts` writes `unit: ''` because the DATABASE accepts it and the write
            # schema REJECTS it, so a mock would take the empty string happily and the defect would surface
            # as a `400` in the middle of a fifty-minute emulator job.
            - name: Run e2e-seed integration tests
              run: npm run test:integration --workspace=@kitchensink/e2e-seed
            # Pure text-normalization (MOD-019/020/021) — no Docker, no network. Its integration tier runs the
            # ASSEMBLED pipeline over a committed slice of real Project Gutenberg prose against a hand-checked
            # golden file, which is the only tier that can catch a stage regressing while every unit truth table
            # still passes. A non-unit tier is only real if CI calls it by name (§7).
            - name: Run recipe-import-core integration tests
              run: npm run test:integration --workspace=@kitchensink/recipe-import-core
            # The curated cookbook importer. Its integration tier drives the REAL `POST /api/v1/recipes` and the
            # REAL ingredient-resolution endpoints, and SKIPS (rather than fails) when `COOKBOOK_IMPORT_RECIPE_URL`
            # is unset — mirroring how the recipe service's own DB-backed tiers guard on `DATABASE_URL`. The step
            # exists so the suite is wired the day an origin is provided, instead of being discovered missing then.
            # The CRF half of the parse comparison needs the Python model installed, or its tier resolves to
            # `describe.skip` and proves nothing — a tier CI calls but cannot run is a tier that does not
            # exist (§7.1). It is a pure pip install: no service, no Docker, no network at test time.
            - name: Install the CRF ingredient parser (cookbook-import parse comparison)
              # ⚠️ PINNED to the version the comparison was measured against. The CRF model file ships with the
              # package, so an unpinned upgrade silently changes what "the CRF parser said" means and would
              # move every agreement figure in the report without a line of our code changing.
              #
              # ⛔ The pin is DERIVED from `requirements.txt`, not restated here. ADR-0025 calls that pin
              # load-bearing three times over and names the places it must agree; a literal copy in YAML is a
              # fourth, kept in step by memory. `--requirement` reads the one the deployed asset is built
              # from, so a version bump cannot leave CI measuring against the previous model.
              #
              # ⛔ `python3 -m pip`, not bare `pip`: this must land in the interpreter that later IMPORTS it.
              run: python3 -m pip install --user --requirement packages/services/ingredient-parser/requirements.txt
            # ⛔ The install SUCCEEDING is not the engine WORKING, and both tiers below guard on availability
            # (`describe.skip` for cookbook-import's parse comparison, a probe in the parser's own handler
            # tier). So a pip install that landed a distribution whose native extension will not load would
            # read here as two skipped tiers and a green job — a tier CI calls but cannot run is a tier that
            # does not exist (§7.1). This is the same observation the `services` unit group makes for
            # `crfEngineVersionParity.test.ts`, for the same reason, and it was missing here.
            - name: Assert the CRF engine is importable — neither tier below may silently skip
              run: |
                  set -uo pipefail
                  if ! version=$(python3 -c "import ingredient_parser, importlib.metadata as m; print(m.version('ingredient-parser-nlp'))" 2>&1); then
                      echo "::error::the CRF engine is not importable on this runner (${version}). cookbook-import's parse comparison and the ingredient-parser handler tier both guard on availability, so they would SKIP and this job would report green having proved nothing about the engine." >&2
                      exit 1
                  fi
                  echo "CRF engine importable: ingredient-parser-nlp ${version}"
            - name: Run cookbook-import integration tests
              run: npm run test:integration --workspace=@kitchensink/cookbook-import
            # The CRF engine's own deployable (ADR-0025). Two tiers no unit test can stand in for: the
            # PACKAGING tier runs the real `pip install --platform manylinux2014_aarch64 --python-version 3.13`
            # and interrogates what came out (the model artifact is present and whole, every compiled
            # extension targets the Lambda rather than this runner, the tree fits Lambda's 250 MB unzipped
            # limit) — including the mutation, where it deletes the model and asserts the guard reports it;
            # the HANDLER tier imports handler.py into a real interpreter with the pinned engine (installed
            # by the step above) and feeds its answer through the caller's zod. Needs network for pip.
            # ⚠️ `@kitchensink/infra-security` exports BUILT js only (`main: ./dist/index.js`, ADR-0013), and
            # this job calls `npm run test:integration` per workspace rather than going through turbo — so
            # nothing here builds it and vitest fails to resolve the entry. `packaging.ts` imports
            # `PYTHON_LAMBDA_RUNTIME` from it, so the packaging tier below cannot load without it. Same
            # fallback shape as the `@commise/ui` step above, for the same reason.
            - name: Ensure @kitchensink/infra-security is built (it exports dist, not src)
              run: '[ -n "$(ls -A packages/infra/security/dist 2>/dev/null)" ] || npm run build --workspace=@kitchensink/infra-security'
            - name: Run ingredient-parser integration tests
              run: npm run test:integration --workspace=@kitchensink/ingredient-parser

    # ⛔ THE DEPLOYED FOOD SERVICE. This job used to boot food beside a Postgres + LocalStack pair on the
    # runner and call that an E2E test; it proved the code boots and nothing about the deployment. Owner
    # ruling 2026-09-04 — an end-to-end test drives the deployed system, or it is skipped.
    #
    # NO `--web-origin`, and that is DERIVED rather than an oversight: `food-service/src/main.ts` has no
    # `app.enableCors(…)` because nothing outside the cluster calls it (its only consumer is the recipe
    # service, server-to-server), so sending it a preflight would assert a browser path that does not exist.
    # `prodDeploySmokeDepth.test.ts` reads each service's `main.ts` and requires the flag exactly when CORS is
    # enabled, so if food ever becomes browser-facing the build says so.
    #
    # ⛔ Which is why the authorization-boundary probe below carries food's second assertion instead. It is
    # ADR-0010's rule, restated at the one service it is about: `GET /api/v1/foods/search` requires a
    # Clerk-verified token, so **`401`/`403` (and `429`) are the PASS** — a status only DNS, the shared ALB's
    # host rule and food's own auth layer together can produce. A `2xx` to an unauthenticated probe is an
    # authorization hole; the shared ALB's default `404` for an unmatched host (ADR-0003) means the listener
    # rule is missing; a transport failure fails the step by curl's own exit status.
    #
    # ⚠️ What the conversion COST, recorded rather than hidden: `packages/services/food-service`'s in-process
    # e2e suite is no longer invoked anywhere in this file. It boots a Nest app against a real database and
    # cannot be pointed at a deployed origin; re-homing it belongs with whoever owns the `Integration (…)`
    # tier.
    e2e-food:
        name: E2E (food — the deployed food service)
        timeout-minutes: 15
        runs-on: ubuntu-latest
        needs: [install, resolve-sandbox]
        if: needs.resolve-sandbox.outputs.live == 'true'
        env:
            FOOD_ORIGIN: ${{ needs.resolve-sandbox.outputs.food_origin }}
        steps:
            # ⛔ FIRST, before anything is fetched — see the sibling note on `e2e-identity-boot`. A target this
            # job cannot vouch for is a defect, not an absence, so it fails loudly rather than skipping.
            - name: Confirm every resolved target is under this repository's own domain
              env:
                  DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
              run: |
                  set -euo pipefail
                  if [ -z "${DOMAIN_NAME}" ]; then
                      echo '::error::the DOMAIN_NAME repository variable is empty — every resolved origin would be a bare label'
                      exit 1
                  fi
                  case "${FOOD_ORIGIN}" in
                      "https://${DOMAIN_NAME}" | "https://"*".${DOMAIN_NAME}") echo "target ${FOOD_ORIGIN}" ;;
                      *)
                          echo "::error::resolved target '${FOOD_ORIGIN}' is not under ${DOMAIN_NAME} — refusing to drive it"
                          exit 1
                          ;;
                  esac
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24
            - name: Restore dependencies
              uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                      packages/*/*/node_modules
                      packages/*/*/*/node_modules
                      packages/*/*/*/*/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
            - name: Install dependencies if the cache missed
              run: |
                  if [ -d node_modules ] && [ -n "$(ls -A node_modules 2>/dev/null)" ]; then
                      exit 0
                  fi
                  echo "::warning::node_modules cache miss (entry evicted or never saved) — running npm ci"
                  npm ci
            - name: Smoke test — the deployed food service is live
              run: |
                  npx tsx packages/services/recipe-service/infra/smoke/deployedSmoke.ts \
                    --base-url "${FOOD_ORIGIN}"
            - name: The deployed catalog must reject an unauthenticated caller
              run: |
                  set -euo pipefail
                  code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${FOOD_ORIGIN}/api/v1/foods/search?q=smoke")
                  echo "GET ${FOOD_ORIGIN}/api/v1/foods/search -> ${code}"
                  case "${code}" in
                      401 | 403 | 429) echo 'the deployed catalog is routed and its auth layer is wired.' ;;
                      2*)
                          echo "::error::the deployed catalog answered ${code} to an UNAUTHENTICATED caller — the auth layer is not in front of it"
                          exit 1
                          ;;
                      404)
                          echo "::error::got 404 — the shared ALB has no listener rule for this host, or food is not deployed at this stage (ADR-0003)"
                          exit 1
                          ;;
                      *)
                          echo "::error::expected 401/403 from the unauthenticated catalog search, got ${code}"
                          exit 1
                          ;;
                  esac

    # ⛔ THE DEPLOYED RECIPE SERVICE. Same conversion as `e2e-food` above and for the same ruling: this job
    # used to stand recipe up on the runner against a Postgres + LocalStack pair.
    #
    # ⚠️ What that conversion COST is recorded rather than hidden: `packages/services/recipe-service`'s
    # in-process e2e suite — 20 spec files including `erasureLock.e2e.test.ts` (GDPR C-007),
    # `throttle.e2e.test.ts` and `recipeInputValidation.e2e.test.ts` — is no longer invoked anywhere in this
    # file. Those specs boot a Nest app in-process against a real database; they cannot be pointed at a
    # deployed origin, and re-homing them belongs with whoever owns the `Integration (…)` tier.
    #
    # `--web-origin` IS passed here, and is required: `recipe-service/src/main.ts` calls `app.enableCors(…)`
    # and the web app calls it cross-origin, so the credential-less CORS preflight is the check that says a
    # BROWSER can reach this deployment — the one `/health` cannot make.
    e2e-recipe:
        name: E2E (recipe — the deployed recipe service)
        timeout-minutes: 15
        runs-on: ubuntu-latest
        needs: [install, resolve-sandbox]
        if: needs.resolve-sandbox.outputs.live == 'true'
        env:
            RECIPE_ORIGIN: ${{ needs.resolve-sandbox.outputs.recipe_origin }}
            WEB_ORIGIN: ${{ needs.resolve-sandbox.outputs.web_origin }}
        steps:
            - name: Confirm every resolved target is under this repository's own domain
              env:
                  DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
              run: |
                  set -euo pipefail
                  if [ -z "${DOMAIN_NAME}" ]; then
                      echo '::error::the DOMAIN_NAME repository variable is empty — every resolved origin would be a bare label'
                      exit 1
                  fi
                  for origin in "${RECIPE_ORIGIN}" "${WEB_ORIGIN}"; do
                      case "${origin}" in
                          "https://${DOMAIN_NAME}" | "https://"*".${DOMAIN_NAME}") echo "target ${origin}" ;;
                          *)
                              echo "::error::resolved target '${origin}' is not under ${DOMAIN_NAME} — refusing to drive it"
                              exit 1
                              ;;
                      esac
                  done
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24
            - name: Restore dependencies
              uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                      packages/*/*/node_modules
                      packages/*/*/*/node_modules
                      packages/*/*/*/*/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
            - name: Install dependencies if the cache missed
              run: |
                  if [ -d node_modules ] && [ -n "$(ls -A node_modules 2>/dev/null)" ]; then
                      exit 0
                  fi
                  echo "::warning::node_modules cache miss (entry evicted or never saved) — running npm ci"
                  npm ci
            - name: Smoke test — the deployed recipe service is live and browser-reachable
              run: |
                  npx tsx packages/services/recipe-service/infra/smoke/deployedSmoke.ts \
                    --base-url "${RECIPE_ORIGIN}" \
                    --web-origin "${WEB_ORIGIN}"

    # ────────────────────────────────────────────────────────────────────────────────────────────────
    # ⛔ recipe ↔ food, ON THE DEPLOYED STAGE. Recipe detail nutrition comes FROM the food service, and until
    # this suite existed no CI job anywhere ran the two together — every recipe tier points
    # `FOOD_SERVICE_URL` at a port nothing listens on ON PURPOSE, so the whole suite proved only that recipe
    # degrades gracefully when food is absent. Those degraded-path specs are correct and are DELIBERATELY
    # UNCHANGED; this job is additional.
    #
    # It used to prove that against two services booted on THIS RUNNER, which is a proof about the code and
    # not about the deployment. Owner ruling 2026-09-04 moves it onto the deployed stage: both origins are
    # this PR's own `pr-{N}` services, resolved by `resolve-sandbox`, and the job SKIPS when there is no
    # sandbox.
    #
    # ⛔ GATED OFF — and the reason CHANGED on 2026-09-05. The credential half is solved; the CATALOG half
    # is not. Turning it on is the repository variable `LINKAGE_E2E_ENABLED`, no code edit.
    #
    # SOLVED — the credential. `mintLinkageCredentials.ts` used to self-sign with a throwaway RSA keypair,
    # which worked only while both services were booted on this runner against that key; a deployed stage
    # verifies against its own Clerk instance and answered 401 to every call. It now signs in a fixed Clerk
    # TEST PROFILE (`+clerk_test`, fixed code 424242, exempt from the instance's mail quota) against the
    # Frontend API with `Origin` set to the stage's web origin — so the token carries `azp` equal to that
    # origin, which is what `CLERK_AZP_PATTERN` is anchored against (ADR-0001), plus grants in the signed
    # `public_metadata`. Proven against the live `pr-91` stage: recipe answers
    # `200 {"catalogAvailability":"ok"}`, which is the exact assertion the degraded tier can never make.
    #
    # ⛔ Do NOT "simplify" that to Clerk's Backend API (`POST /sessions` → `POST /sessions/{id}/tokens`).
    # That token carries NO `azp`, and an `azp`-less token is admitted only by `isNativeClientToken` — the
    # `client_type: 'native'` claim from the mobile app's own template — whose docstring is explicit that a
    # token is admitted because it PROVES it is native, "not merely because it lacks an origin". Measured:
    # a Backend-API token gets 401 from BOTH services.
    #
    # SOLVED — the catalog. Under ADR-0006 each preview gets its own fresh logical database and nothing seeded
    # the food half, so `/api/v1/foods/search?query=flour` answered `{"results":[]}` on a live, healthy stage
    # and the suite had nothing to link to. The seeding step below fills it through the PRODUCT'S OWN DOOR:
    # `POST /api/v1/foods/batch`, which any authenticated caller may use and whose worker fetches from USDA
    # exactly as it would for a real user (owner ruling — "send a list of foods through the API to get
    # processed and synced from USDA").
    #
    # ⛔ Not the bulk seed CLI, which needs a `DATABASE_URL` to the in-VPC RDS a runner cannot reach, and not
    # ADR-0029's authored-foods door, whose rows are private to their author and therefore INVISIBLE to the
    # caller-invariant `/nutrition?ids=` route this suite reads.
    #
    # ⚠️ The seeding step introduces a real third-party dependency (USDA) into this job. That is priced in:
    # ten names, a preview's worker holding its own per-IP quota (ADR-0004 — Fargate egresses via its own
    # public IP, not the NAT), and a bounded poll that fails LOUDLY rather than letting the suite run against
    # a half-filled catalog. A suite that skipped there would fail about search relevance instead of about
    # the one fact that explains it.
    #
    # ⚠️ It must not become a skip-tolerant SUITE: the specs still fail loudly when food is unreachable,
    # which is the property they were split from the degraded-path specs to have.
    #
    # ⚠️ `RECIPE_DEV_AUTH_USER_ID` is deliberately NEVER set: under recipe's dev bypass there is no bearer to
    # forward, so `FoodCatalogGateway` degrades to `catalogAvailability: 'unavailable'` WITHOUT ISSUING A
    # REQUEST — a job written that way would report success with a live food service sitting untouched.
    e2e-cross-service-linkage:
        name: E2E (recipe ↔ food — the deployed services, actually linked)
        timeout-minutes: 20
        runs-on: ubuntu-latest
        needs: [install, resolve-sandbox]
        # ⚠️ The `vars.LINKAGE_E2E_ENABLED` half is GONE, because the reason for it is. It existed for one
        # stated blocker — an empty per-PR food catalog — and the seeding step below closes it. A live
        # sandbox is now the only precondition, so this check is present on every PR that raises one rather
        # than absent behind a repository variable nobody would think to look at.
        if: needs.resolve-sandbox.outputs.live == 'true'
        env:
            # REQUIRED with no default, and the suite THROWS rather than skipping when one is absent: by the
            # time it runs, `resolve-sandbox` has already reported the stage serving, so absence is a
            # regression and not an excuse to pass quietly.
            LINKAGE_RECIPE_URL: ${{ needs.resolve-sandbox.outputs.recipe_origin }}
            LINKAGE_FOOD_URL: ${{ needs.resolve-sandbox.outputs.food_origin }}
            # The `azp` a browser session token carries on this stage — the per-PR preview subdomain
            # (ADR-0001), which is what `CLERK_AZP_PATTERN` on the deployed services is anchored against.
            LINKAGE_AZP: ${{ needs.resolve-sandbox.outputs.web_origin }}
        steps:
            - name: Confirm every resolved target is under this repository's own domain
              env:
                  DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
              run: |
                  set -euo pipefail
                  if [ -z "${DOMAIN_NAME}" ]; then
                      echo '::error::the DOMAIN_NAME repository variable is empty — every resolved origin would be a bare label'
                      exit 1
                  fi
                  for origin in "${LINKAGE_RECIPE_URL}" "${LINKAGE_FOOD_URL}" "${LINKAGE_AZP}"; do
                      case "${origin}" in
                          "https://${DOMAIN_NAME}" | "https://"*".${DOMAIN_NAME}") echo "target ${origin}" ;;
                          *)
                              echo "::error::resolved target '${origin}' is not under ${DOMAIN_NAME} — refusing to drive it"
                              exit 1
                              ;;
                      esac
                  done
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24
            - name: Restore dependencies
              uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                      packages/*/*/node_modules
                      packages/*/*/*/node_modules
                      packages/*/*/*/*/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
            - name: Install dependencies if the cache missed
              run: |
                  if [ -d node_modules ] && [ -n "$(ls -A node_modules 2>/dev/null)" ]; then
                      exit 0
                  fi
                  echo "::warning::node_modules cache miss (entry evicted or never saved) — running npm ci"
                  npm ci
            # `$RUNNER_TEMP`, not `${{ runner.temp }}` — an expression is substituted into the script TEXT
            # before bash parses it, which zizmor's template-injection audit correctly rejects.
            #
            # ⛔ THE SECRETS WERE NEVER LOADED, and nothing noticed because the job was gated off. Both the
            # credential mint and the catalog seed read `CLERK_SECRET_KEY` / `CLERK_PUBLISHABLE_KEY`, and
            # neither existed in this job's environment — so removing the gate without this step would have
            # turned "absent check" into "check that always fails on its first step". A fork PR has no access
            # to them, so the load is soft and every step below is gated on its outcome.
            - name: Load sandbox (dev-instance) Clerk secrets for the linkage suite
              id: secrets
              continue-on-error: true
              uses: ./.github/actions/load-secrets
              with:
                  stage: sandbox
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ env.DEFAULT_AWS_REGION }}
            # ⛔ BEFORE THE MINT, NOT AFTER IT — the ordering is the fix for a real failure, not tidiness.
            # A Clerk session token lives about sixty seconds. The mint step writes ONE to a file and the
            # suite reads it, so anything slow between the two spends that budget: this step took ~100s on
            # its first successful run (it seeds ten foods and walks a disambiguation for each), and every
            # assertion in the suite then failed `401 UNAUTHORIZED` against a token that had simply aged
            # out. Seeding first leaves the mint adjacent to its only consumer.
            #
            # ⚠️ It also removes a second hazard: this step and the mint sign in as the SAME address, and
            # a Clerk instance that permits one session per client would have had the later sign-in end
            # the earlier one's session. Adjacency makes both questions moot.
            #
            # It must SUCCEED. The batch endpoint dedups on the normalized name, so
            # this is idempotent: against a catalog that is already filled it is a batch of inline hits and
            # no waiting at all. Against an empty one it enqueues, and the poll waits for the food worker.
            #
            # ⚠️ It uses the SAME identity the suite signs its bearer with. The catalog is stage-wide and
            # caller-invariant, so any authenticated caller may fill it — a second account would be a fourth
            # Clerk user for a write attributed to nobody.
            - name: Seed this stage's food catalog from USDA (e2e-seed seed-catalog)
              if: steps.secrets.outcome == 'success'
              env:
                  E2E_SEED_RECIPE_URL: ${{ needs.resolve-sandbox.outputs.recipe_origin }}
                  E2E_SEED_FOOD_URL: ${{ needs.resolve-sandbox.outputs.food_origin }}
                  E2E_SEED_WEB_ORIGIN: ${{ needs.resolve-sandbox.outputs.web_origin }}
                  # The SAME address the mint step signs in as, so the catalog write and the suite's own
                  # bearer belong to one identity rather than two accounts on a shared instance.
                  E2E_SEED_CATALOG_EMAIL: ${{ env.LINKAGE_E2E_TEST_EMAIL || 'linkage-e2e+clerk_test@example.com' }}
              run: npm run seed-catalog --workspace=@kitchensink/e2e-seed
            # ⛔ `LINKAGE_CREDENTIALS` is exported HERE rather than in this job's `env:` block, and that is not
            # a style choice. The `runner` context does not exist until a runner has been assigned, so
            # referencing it at job level does not warn and does not skip the job — GitHub refuses to LOAD the
            # workflow, and the run reports "a workflow file issue" with ZERO jobs. This branch ran that way
            # for three days and fifteen units, publishing no checks at all.
            # `packages/infra/global/__tests__/workflowContextAvailability.test.ts` fails if it comes back.
            #
            # ⚠️ This is the OPEN BLOCKER named in the job header: the key minted here is not the key the
            # deployed stage verifies.
            - name: Mint the Clerk credential the suite signs its bearer with
              if: steps.secrets.outcome == 'success'
              run: |
                  npx tsx packages/tools/cross-service-e2e/scripts/mintLinkageCredentials.ts "${RUNNER_TEMP}/linkage"
                  echo "LINKAGE_CREDENTIALS=${RUNNER_TEMP}/linkage/linkage-credentials.json" >> "$GITHUB_ENV"
            - name: Prove recipe ↔ food linkage against the deployed services
              if: steps.secrets.outcome == 'success'
              run: npm run test:e2e --workspace=@kitchensink/cross-service-e2e

    # ⛔ ITS OWN JOB, and its own vitest config, because these specs are not unit tests by any measure: they
    # run `turbo run build`, `npm run bundle:lambda`, esbuild, two `cdk synth`s in child processes, and shell
    # scripts against real fixtures. They are NOT folded into `integration-selfcontained` — that job groups
    # SUB-SECOND suites to avoid paying two checkout+restore cycles, and this one is minutes.
    #
    # They previously sat in `__tests__/` and so matched the default unit glob, which is how one of them —
    # `cdkNagSynth.integration.test.ts`, which writes `dist-lambda/` into the package root as a side effect of
    # bundling — came to run in PARALLEL with `cdkNagTemplateParity.test.ts`, whose two synths must be
    # byte-identical. The bundle landing between them broke the ADR-0002 no-prod-diff proof on a diff nobody
    # wrote. No secrets: the one live-probing suite is `describe.runIf`-gated on PROD_WEB_SMOKE_ORIGIN, which
    # only `prod-deploy.yml` sets, so it skips here by design.
    #
    # ⚠️ ONE service container, added with the ADR-0031 per-PR database reaper. That suite issues real
    # `DROP DATABASE` statements, and the three things it exists to prove are all boundary facts a fake pool
    # cannot answer: that `WITH (FORCE)` defeats the session a torn-down preview leaves behind, that the
    # shared BASE database and the neighbouring PR survive a reap, and that the `LIKE … ESCAPE` narrowing does
    # not claim a name it has no business claiming. `DATABASE_URL` is set on the STEP that runs the suite, not
    # on the job, because `prodDeploySmokeDepth.test.ts` requires exactly that — an `env:` on a step that does
    # not run the file reads like wiring and is not.
    integration-infra:
        name: Integration (infra — synth + bundle)
        timeout-minutes: 30
        runs-on: ubuntu-latest
        needs: [install]
        services:
            postgres:
                image: postgres:18 # zizmor: ignore[unpinned-images] — see the note in this file’s header
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24
            - name: Restore dependencies
              uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                      packages/*/*/node_modules
                      packages/*/*/*/node_modules
                      packages/*/*/*/*/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
            # ⛔ A CACHE MISS MUST BE SLOW, NOT FATAL. These jobs restore `node_modules` and never install,
            # so before this step a miss did not degrade them — it killed them: no `node_modules` means no
            # `tsc`, and the build step died with `sh: 1: tsc: not found` / `npm error code 127`. Across the
            # 8 Playwright shards plus the merged report that turned ONE evicted cache entry into 9 red jobs,
            # and a re-run usually went green because `install` had re-saved the entry meanwhile — which is
            # exactly what made it look like flake instead of a missing fallback.
            #
            # The miss is real and expected: the repo's Actions cache sits under a 10 GB cap with LRU
            # eviction, and every lockfile change mints a fresh entry, so an in-flight run CAN have its entry
            # evicted underneath it. The `::warning::` keeps that visible — a silent reinstall would hide the
            # eviction rate, which is the number worth watching.
            - name: Install dependencies if the cache missed
              run: |
                  if [ -d node_modules ] && [ -n "$(ls -A node_modules 2>/dev/null)" ]; then
                      exit 0
                  fi
                  echo "::warning::node_modules cache miss (entry evicted or never saved) — running npm ci"
                  npm ci
            # ⛔ DERIVED, never a list of package names — and this job is the third place the class has
            # bitten. Several workspace packages export BUILT js only (`@kitchensink/infra-alb`,
            # `@kitchensink/infra-security`), so a `--workspace=` run, which does NOT go through turbo,
            # resolves nothing and vitest dies with "Failed to resolve entry for package". Two other jobs
            # already carry a hand-written `[ -n "$(ls -A …/dist)" ] || npm run build --workspace=X` step
            # each; a third copy is what Metz's rule of three exists to stop.
            #
            # `^...` is turbo's DEPENDENCY selector: build everything `@kitchensink/infra-global` depends on
            # and not the package itself. A dependency added tomorrow is covered the day it is added, which
            # a named list cannot be. Measured 2026-09-03: it builds 13 packages including `infra-alb`.
            #
            # This went red the moment `nagRulesAtZero.integration.test.ts` reached `EdgeStack`, which
            # imports `@kitchensink/infra-alb`. It passed locally on a tree that still held a stale `dist/`
            # from an earlier build — the exact reason a build-order change has to be proved from a clean
            # state, because otherwise the failure is invisible until CI.
            - name: Build the workspace dependencies this per-workspace run cannot build itself
              run: npx turbo run build --filter=@kitchensink/infra-global^...
            # `DATABASE_URL` points at the MAINTENANCE database, because `DROP DATABASE` cannot run from
            # inside the database being dropped. The suite CREATES and DROPS databases with the real
            # ADR-0006 names, which is safe here and only here: this is a throwaway service container.
            - name: Run infra integration tests
              env:
                  DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
              run: npm run test:integration --workspace=@kitchensink/infra-global

    build:
        name: Build ${{ matrix.workspace }}
        timeout-minutes: 30
        runs-on: ubuntu-latest
        needs: [install, build-ui]
        strategy:
            fail-fast: false
            matrix:
                workspace:
                    - '@kitchensink/identity-service'
                    - '@kitchensink/identity-webhooks'
                    - '@commise/web'
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24
            - name: Restore dependencies
              uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                      packages/*/*/node_modules
                      packages/*/*/*/node_modules
                      packages/*/*/*/*/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
            # ⛔ A CACHE MISS MUST BE SLOW, NOT FATAL. These jobs restore `node_modules` and never install,
            # so before this step a miss did not degrade them — it killed them: no `node_modules` means no
            # `tsc`, and the build step died with `sh: 1: tsc: not found` / `npm error code 127`. Across the
            # 8 Playwright shards plus the merged report that turned ONE evicted cache entry into 9 red jobs,
            # and a re-run usually went green because `install` had re-saved the entry meanwhile — which is
            # exactly what made it look like flake instead of a missing fallback.
            #
            # The miss is real and expected: the repo's Actions cache sits under a 10 GB cap with LRU
            # eviction, and every lockfile change mints a fresh entry, so an in-flight run CAN have its entry
            # evicted underneath it. The `::warning::` keeps that visible — a silent reinstall would hide the
            # eviction rate, which is the number worth watching.
            - name: Install dependencies if the cache missed
              run: |
                  if [ -d node_modules ] && [ -n "$(ls -A node_modules 2>/dev/null)" ]; then
                      exit 0
                  fi
                  echo "::warning::node_modules cache miss (entry evicted or never saved) — running npm ci"
                  npm ci
            - name: Restore UI build artifacts
              uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
              with:
                  path: packages/apps/commise/ui/dist
                  key: ${{ runner.os }}-ui-dist-${{ github.sha }}
            - name: Ensure @commise/ui is built (fallback if the per-SHA cache restore missed)
              if: matrix.workspace == '@commise/web'
              run: '[ -n "$(ls -A packages/apps/commise/ui/dist 2>/dev/null)" ] || npm run build --workspace=@commise/ui'

            # ⛔ SANDBOX, NOT `inputs.stage` — and that is the whole reason this artifact is usable.
            #
            # `NEXT_PUBLIC_*` is INLINED by the bundler, so the Clerk instance this bundle talks to is frozen
            # in right here. `e2e-web` now SERVES this build (`next start`) and signs into it with the SANDBOX
            # development instance — which is not a preference: Clerk production keys are domain-locked and
            # clerk-js aborts with "Production Keys are only allowed for domain <domain>" on localhost, so
            # <SignIn> never mounts. See `e2e-web`'s own load-secrets step for the full account.
            #
            # Loading `${{ inputs.stage }}` here would therefore bake a `pk_live` key on `main` into the very
            # bundle the localhost Playwright suite has to authenticate against. Both jobs read the ONE secret
            # `kitchensink/sandbox/identity/keys`, so the built instance and the harness instance cannot drift
            # apart — pinning two equal literals instead would let them go stale together.
            # `webE2eProductionBuild.test.ts` fails if either side moves.
            #
            # If creds are unavailable (e.g. fork PRs) the build is skipped rather than failing — and `e2e-web`
            # skips on the same condition, so the pair stays consistent.
            - name: Load sandbox (dev-instance) Clerk secrets for the web build
              if: matrix.workspace == '@commise/web'
              id: secrets
              continue-on-error: true
              uses: ./.github/actions/load-secrets
              with:
                  stage: sandbox
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ env.DEFAULT_AWS_REGION }}

            - name: Build
              if: matrix.workspace != '@commise/web' || steps.secrets.outcome == 'success'
              run: npm run build --workspace="$WORKSPACE"
              # The web app's endpoints are declared with NO default and validated at build time
              # (src/config/env.ts), so `next build` FAILS unless they are supplied — by design: that is
              # what stops an unconfigured build from inlining `http://localhost:3000` into a bundle it
              # ships to real browsers, which is exactly what reached the sandbox preview.
              #
              # ⚠️ THIS OUTPUT IS NOW RUN, not merely compiled. It is still deployed nowhere (Vercel builds the
              # preview, the prod pipeline builds prod), but `e2e-web` downloads it and serves it with
              # `next start`, so these values are the ones the Playwright suite's browser actually sees. They
              # are therefore the SAME localhost origins `e2e-web` states at runtime, and that equality is
              # asserted by `webE2eProductionBuild.test.ts` rather than left to review. Nothing listens on
              # :4000, and :3000 is the web server itself — which is deliberate: every spec mocks the API with
              # the origin-agnostic `page.route('**/api/v1/**')`, so the SSR-side prefetch fails and each page
              # degrades to its client fetch, exactly what `tests/e2e/ssrPrefetch.spec.ts` asserts.
              #
              # `NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY` is deliberately ABSENT here: it arrives from the sandbox
              # `load-secrets` step above, and a value on this line would override it (step `env:` beats
              # `$GITHUB_ENV`) and bake an instance the Playwright harness cannot sign into. It used to hold
              # the placeholder `pk_test_bG9jYWxob3N0JA` ("localhost$"), which was harmless while nothing ran
              # this bundle and is a live defect now.
              env:
                  # Via `env:` rather than interpolated into the command, so no `${{ … }}` reaches a shell
                  # anywhere in this file. The matrix values are static literals, so this is uniformity and
                  # defence-in-depth rather than a live injection fix.
                  WORKSPACE: ${{ matrix.workspace }}
                  NEXT_PUBLIC_RECIPE_API_URL: http://localhost:3000
                  NEXT_PUBLIC_IDENTITY_API_URL: http://localhost:4000

            # ⛔ AN ARTIFACT, NOT `actions/cache`. The repo's Actions cache sits under GitHub's 10 GB cap with
            # LRU eviction, and it has already been the outage: at 9.77 GB, entries were evicted out from under
            # running jobs and one `node_modules` miss turned into 9 red Playwright jobs (see the restore-step
            # comments above and `cache-prune.yml`). A per-SHA `.next` entry — one per commit, ~30 MB — would
            # feed exactly that. Artifacts have their own storage and retention, and this one is consumed by
            # `e2e-web` in the same run and by nothing else.
            #
            # `.next/cache` is webpack's incremental cache (1.7 GB locally) and `.next/standalone` is the
            # self-contained server for a future ECS deploy (130 MB); `next start` reads NEITHER, so both are
            # excluded and what ships is ~30 MB of `server/` + `static/` + manifests. The negated patterns do
            # not participate in the artifact's root calculation (`@actions/glob` omits them from the search
            # paths), so the single positive path stays the root and entries are relative to `.next` —
            # which is what makes the download below restore in place.
            - name: Upload the web production build for the Playwright suite
              if: matrix.workspace == '@commise/web' && steps.secrets.outcome == 'success'
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: web-next-build-${{ inputs.stage }}
                  path: |
                      packages/apps/commise/web/.next
                      !packages/apps/commise/web/.next/cache
                      !packages/apps/commise/web/.next/standalone
                  # 3, not the 1 the sibling blob-report artifacts use, and the difference is the RE-RUN
                  # window: "Re-run failed jobs" re-runs `e2e-web` alone and feeds it the ORIGINAL run's
                  # artifacts, so a 1-day retention turns re-running yesterday's red shard into
                  # "Artifact not found" — a pipeline failure that looks nothing like the test failure being
                  # investigated. The blobs are produced and consumed within one run and have no such window.
                  retention-days: 3
                  # NOT the default `warn`: an empty upload yields an empty download, and `next start` then
                  # dies with "could not find a production build" two jobs away from the cause.
                  if-no-files-found: error
                  # ⛔ REQUIRED. `.next` is a HIDDEN directory and upload-artifact v4 skips dotfiles unless
                  # told otherwise, so EVERY file in this artifact is filtered out and the step reports
                  # `No files were found with the provided path` — which `if-no-files-found: error` then
                  # (correctly) turns red. Being the artifact ROOT does not exempt it: the filter tests the
                  # path, and the dot is in the path. This is not a theoretical footnote — it is what failed
                  # on the first real run of this artifact.
                  include-hidden-files: true

    # ⛔ THE DEPLOYED IDENTITY API SURFACE — the authorization boundary and the routing contract of the thing
    # that is actually running, which every other tier in this file is structurally blind to.
    #
    # Until 2026-09-04 this job ran identity's and identity-webhooks' in-process e2e suites: a Nest app booted
    # inside vitest over a mocked `pg` and a mocked SQS client. That reaches nothing, so it can never see an
    # unverified or missing `CLERK_JWT_KEY`, an `IDENTITY_DEV_AUTH_USER_ID` that survived into a stage, a
    # listener rule that was never added, or a deployed build that stopped serving a path. Owner ruling
    # 2026-09-04 — an end-to-end test drives the deployed system, or it is skipped.
    #
    # The two assertions are the ones those suites existed for, moved onto the deployment:
    #
    #   1. a protected route REJECTS an unauthenticated caller — 401/403 means the request reached the
    #      router AND `AuthMiddleware` and was refused; 404 means the route was never registered on this
    #      build (or the shared ALB has no rule for this host, ADR-0003) and 500 means a provider is missing.
    #   2. the DEPRECATED bare-`v1` alias still answers. Every endpoint is canonically `/api/{version}/`
    #      (ADR-0011) and ALSO answers the bare `/{version}/` path it shipped on, and that alias's consumers
    #      CANNOT be fixed by redeploying this repository: the Clerk dashboard holds the webhook URL, and
    #      shipped mobile builds plus cached web bundles have their endpoints inlined from build-time
    #      `NEXT_PUBLIC_*` values. If it silently stopped resolving, those clients would 404 with nothing in
    #      this repository failing.
    #
    # ⚠️ Residual, stated rather than hidden: identity-WEBHOOKS has no deployed assertion here. Its public
    # face is an API Gateway custom domain (`registration.identity[.sandbox].{apex}`), a fourth host shape
    # this file has no resolver for, and its one route is a Svix-signed POST. Its in-process e2e suite is no
    # longer invoked anywhere in this file — re-homing it belongs with whoever owns the `Integration (…)`
    # tier.
    e2e-backend:
        # Static name (not a matrix) so a skipped run shows a clean title instead of a raw `${{ matrix.* }}`
        # template — and, per invariant 8, because branch protection matches a required check by its RENDERED
        # name.
        name: E2E (identity — the deployed API surface rejects unauthenticated callers)
        timeout-minutes: 15
        runs-on: ubuntu-latest
        needs: [resolve-sandbox]
        if: needs.resolve-sandbox.outputs.live == 'true'
        env:
            IDENTITY_ORIGIN: ${{ needs.resolve-sandbox.outputs.identity_origin }}
        steps:
            # ⛔ FIRST, before anything is fetched — see the sibling note on `e2e-identity-boot`.
            - name: Confirm every resolved target is under this repository's own domain
              env:
                  DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
              run: |
                  set -euo pipefail
                  if [ -z "${DOMAIN_NAME}" ]; then
                      echo '::error::the DOMAIN_NAME repository variable is empty — every resolved origin would be a bare label'
                      exit 1
                  fi
                  case "${IDENTITY_ORIGIN}" in
                      "https://${DOMAIN_NAME}" | "https://"*".${DOMAIN_NAME}") echo "target ${IDENTITY_ORIGIN}" ;;
                      *)
                          echo "::error::resolved target '${IDENTITY_ORIGIN}' is not under ${DOMAIN_NAME} — refusing to drive it"
                          exit 1
                          ;;
                  esac
            # No checkout, no dependencies: two HTTP requests against a deployed origin need neither, and the
            # ~90 s of `npm ci` they would cost buys nothing.
            - name: A protected route must reject, not 404 or 500
              run: |
                  set -euo pipefail
                  for path in /api/v1/users/me /v1/users/me; do
                      code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${IDENTITY_ORIGIN}${path}")
                      echo "GET ${IDENTITY_ORIGIN}${path} -> ${code}"
                      case "${code}" in
                          401 | 403) ;;
                          2*)
                              echo "::error::${path} answered ${code} to an UNAUTHENTICATED caller — AuthMiddleware is not in front of it"
                              exit 1
                              ;;
                          404)
                              echo "::error::${path} answered 404 — the route is not registered on the deployed build, or the shared ALB has no rule for this host (ADR-0003). The bare-v1 alias has consumers this repository cannot redeploy."
                              exit 1
                              ;;
                          *)
                              echo "::error::expected 401/403 from ${path}, got ${code}"
                              exit 1
                              ;;
                      esac
                  done
                  echo 'the deployed identity API rejects unauthenticated callers on both path spellings.'

    # ⛔ PLAYWRIGHT AGAINST THE DEPLOYED PREVIEW. This job used to serve a `next start` on `localhost:3000`
    # from an artifact the `build` job produced and call that an E2E test. Owner ruling 2026-09-04 — an
    # end-to-end test drives the deployed system, or it is skipped — so it now drives this PR's own preview
    # origin, `pr-{N}.sandbox.{apex}` (ADR-0001; the older `sandbox.{apex}/pr-{N}` path form 404s BY DESIGN),
    # and SKIPS when there is no sandbox.
    #
    # ⛔⛔ OPEN BLOCKER, STATED RATHER THAN HIDDEN — like `e2e-cross-service-linkage`, this cannot PASS
    # against a live preview yet, and the blocker is INFRA rather than workflow. ADR-0001's
    # "Update (2026-07-28)": a preview is UNREACHABLE in a browser. The sandbox router's Host swap leaves the
    # Next app terminating the Vercel deployment host, so Clerk's handshake `redirect_url` dead-ends at
    # `vercel.com/login` and Next rejects every Server Action with a 500 (`Origin !== Host`). The proven cure
    # resolves `pr-{N}.sandbox.{apex}` DIRECTLY to Vercel (Route 53 CNAME + Vercel domain + a per-deployment
    # alias), which `scripts/createPreviewDomain.ts` now does — so this is expected to clear as that lands,
    # and until it does the tier is skipped on every PR with no sandbox anyway.
    #
    # ⚠️ `PLAYWRIGHT_BASE_URL` is what switches the suite over: `playwright.config.ts` reads it as `baseURL`
    # AND omits its `webServer` entirely when it is set, so nothing is compiled or served on this runner.
    e2e-web:
        # ⛔ A CONSTANT, INCLUDING THE SHARD. A skipped job never evaluates its name, so an
        # interpolated one renders the RAW `${{ … }}` in the checks list — observed on this very job
        # once the liveness gate started skipping it:
        #   `E2E (web — Playwright against the deployed preview) ${{ matrix.shard }}/${{ strategy.job-total }}`
        # ⚠️ `matrix`/`strategy` are NOT exempt from that, which is what the first version of
        # workflowInvariants' invariant 8 assumed. They render correctly only while the job RUNS;
        # these shards now skip by default, so that is the uncommon case. The shard number stays in
        # the STEP name, where a human reads it and no required-check rule matches on it.
        name: E2E (web — Playwright against the deployed preview)
        if: needs.resolve-sandbox.outputs.live == 'true'
        # 30 + the sandbox wake's own 15-minute bound (see the wake step below). A run that lands in ADR-0007's
        # 00:00–09:00 ET window legitimately waits minutes for a stopped `db.t4g.micro` to reach `available`,
        # and a JOB timeout is precisely the misleading failure that step exists to prevent: it would kill the
        # shard mid-wake with "the job running on runner … has exceeded the maximum execution time" rather than
        # the script's own annotated verdict. The wake is self-bounding, so this only has to be wide enough to
        # let that bound be the one that fires.
        timeout-minutes: 45
        runs-on: ubuntu-latest
        # `build-ui` rather than `build`: the `.next` artifact is gone with the local server, but
        # `mockupFidelity.spec.ts` still imports `@commise/ui/tokens/gradients`, whose exports map resolves to
        # `./dist/…`, so the shard holding that spec fails to COLLECT without the UI dist.
        needs: [build-ui, resolve-sandbox]
        # SHARDED, 4 ways. This job WAS the entire critical path of a PR run: measured on the green run
        # 31514368684 it started at +4.0m and ran 15.5m, ending at 19.5m, while every other job in the
        # pipeline finished by ~+6m (next slowest: `Test`, 4.8m). Wall clock was 19.4m for 42.1m of summed
        # job time — i.e. already ~2.2x compressed, with nothing left to win anywhere but here.
        #
        # WHY FOUR. The suite's cost is FLAT per test, not concentrated in one slow spec — measured from the
        # dot-reporter timeline of that same run: 8.29 s/test over tests 1–80, then 8.12 s/test over the
        # remaining 22 (102 tests, 14.5m). So there is no dominant serial spec to isolate, and sharding by
        # test count tracks sharding by time. Playwright balances whole FILES (it never splits one), and the
        # largest file here holds 9 tests against ~25.5 per shard, so 4 shards balance cleanly. Above ~4 the
        # win collapses into fixed cost — ~1.4m of checkout/deps/browser install plus a Next dev-server boot,
        # paid per shard — while the Clerk fixture count, the runner minutes, and the exposure to the
        # `waitForTestUserExternalId` setup flake all keep scaling linearly. 4 buys ~5.2m per shard
        # (≈ +6.5m runner minutes total) for roughly a 9m cut in wall clock; 8 would roughly double the added
        # cost to shave ~1.5m more, against the repo's cost posture (ADR-0007/ADR-0008).
        #
        # ⚠️ `COMMISE_E2E_SHARD` below is LOAD-BEARING, not decoration — see the env block.
        strategy:
            # Never fail-fast. Two reasons, both concrete: a cancelled shard is killed before Playwright's
            # `globalTeardown` runs, which LEAKS its Clerk fixture user (reclaimed only by the 12h age-gated
            # sweep); and one shard's failure would otherwise destroy the other three shards' results, so the
            # merged report — the whole point of the blob/merge split below — would be missing most of the run.
            fail-fast: false
            matrix:
                # ⛔ EIGHT, and the ceiling is arithmetic — see the Clerk interlock above.
                #
                # The only Clerk limit SHARED across shards is the Backend API (100 req/10s on a dev
                # instance); per-user and per-IP limits do not bind, because each shard provisions its own
                # user on its own runner IP. This suite spends ~1 BAPI call per test, so:
                #   4 shards ≈ 5 req/10s  → 20x margin      8 shards ≈ 10 req/10s → 10x margin
                #
                # Measured 2026-08-18: 108 tests in 34 files at ~9.8s each, and `setup` is a DEPENDENCY
                # project so it is not sharded — it runs IN FULL in every shard, at a measured 32-35s.
                # That fixed toll is what bounds this, not Clerk:
                #   4 shards → 27 tests + 35s setup ≈ 300s     8 shards → 14 tests + 35s ≈ 167s
                # Past ~8 the toll dominates (16 shards would pay 16x35s to run 7 tests each), so raising
                # this further buys nothing. `--shard` distributes whole FILES, and there are 34 of them,
                # so 8 shards still have real work to split.
                shard: [1, 2, 3, 4, 5, 6, 7, 8]
        # `id-token: write` is what makes the Argos upload SECRETLESS (U10a): the CLI exchanges a short-lived
        # GitHub OIDC token for a build-scoped Argos credential, so no `ARGOS_TOKEN` secret exists to leak — and
        # a FORK pull request, which cannot read repository secrets at all, still uploads (Argos falls back to
        # its tokenless GitHub-Actions path when OIDC is unavailable). `contents: read` must be restated because
        # a job-level `permissions:` REPLACES the workflow default rather than adding to it.
        permissions:
            contents: read
            id-token: write # the secretless Argos OIDC exchange — see the note above
        # ⛔ THE DEPLOYED PREVIEW, and nothing on this runner. `playwright.config.ts` reads
        # `PLAYWRIGHT_BASE_URL` as `baseURL` and — critically — declares NO `webServer` when it is set, so
        # there is no `next start`, no `.next` artifact to download and no port to bind.
        #
        # ⚠️ `NEXT_PUBLIC_RECIPE_API_URL` / `NEXT_PUBLIC_IDENTITY_API_URL` are deliberately GONE rather than
        # re-pointed. They were the SERVER-side statement for the Next process this job used to run; the
        # preview's own Vercel deployment states its own, and a value here would be read by nothing while
        # reading as configuration. The specs themselves never build a URL out of them — every one mocks the
        # API with the origin-agnostic glob `page.route('**/api/v1/**')` (tests/e2e/utils/recipeApi.ts).
        env:
            PLAYWRIGHT_BASE_URL: ${{ needs.resolve-sandbox.outputs.web_origin }}
            # ⚠️ THE CLERK SAFETY INTERLOCK FOR SHARDING. Read before touching the matrix.
            #
            # Each shard is a SEPARATE Playwright process, so each runs `globalSetup` AND `globalTeardown`.
            # `deriveRunKey` (tests/e2e/utils/runFixtureIdentity.ts) keys the run-scoped Clerk fixture on
            # GITHUB_RUN_ID + GITHUB_RUN_ATTEMPT + GITHUB_JOB — and `GITHUB_JOB` is the job's ID, identical
            # for every leg of a matrix. Without this variable all four shards would derive the SAME key, so
            # (a) four concurrent `createUser` calls would race one unique username, and (b) the first shard
            # to finish would DELETE the shared sign-in fixture the other three are still authenticating as,
            # since teardown's `own` rule matches it. That is bbf7ea7c's cross-workflow failure — "test
            # sign-in user is missing — globalSetup should have created it" — reproduced INSIDE one run.
            #
            # With it, each shard provisions, uses and deletes its OWN user, so teardown can never reach a
            # sibling's live fixture. That is also what keeps the SERIALIZATION guarantee intact: the suite is
            # serial (`workers: 1`, `fullyParallel: false`) because concurrent sign-ins AS ONE USER flake, and
            # Clerk's Frontend-API sign-in limits are scoped per USER and per IP. Four shards means four
            # distinct users on four distinct runner IPs, each still driving its sign-ins strictly one at a
            # time — so the per-user/per-IP budget each shard sees is unchanged from today's single stream,
            # rather than four streams contending for one. The per-INSTANCE limit that IS shared is the
            # Backend API (100 req/10s on a dev instance); this suite spends ~1 BAPI call per test, so four
            # shards ask for ~5 per 10s against that 100 — a ~20x margin.
            #
            # ── HOW THE `setup` PROJECT INTERACTS WITH THIS (verified against Playwright's own source) ──
            #
            # The suite now authenticates ONCE per run in a `setup` project and persists `storageState`
            # (tests/e2e/auth.setup.ts), which took the run from ~90 ticket sign-ins to ~7. A setup project
            # reached through `dependencies:` is classified `"dependency"`, not `"top-level"`
            # (`buildProjectsClosure` in playwright/lib/runner/index.js), and only top-level project suites are
            # handed to `filterForShard`. So `setup` is NOT sharded: it runs IN FULL in every shard.
            #
            # That is the correct behaviour here, and it is this variable that makes it correct. Each shard
            # derives its own run key, provisions its own Clerk user, and therefore must authenticate as ITS
            # user — and `authStatePath` keys the state FILE on the same run key, so no shard can restore a
            # session belonging to a user another shard's teardown deletes. Sharing one key or one state file
            # would recreate bbf7ea7c inside the run, one layer lower down.
            #
            # Do NOT delete this, do NOT raise `workers` above 1, and do NOT let two shards share a key.
            COMMISE_E2E_SHARD: ${{ matrix.shard }}
        steps:
            # ⛔ FIRST, and before anything is fetched: this origin arrives from ANOTHER job's output and this
            # job's whole purpose is to drive a browser at it. An origin outside our own apex is either a
            # resolver handed the wrong domain (an empty `DOMAIN_NAME` repository variable resolves to
            # `https://pr-91.sandbox.` — a name, and a request, that is not ours) or a `needs` plumbing
            # mistake. It fails LOUDLY rather than skipping: a target this job cannot vouch for is a defect.
            - name: Confirm the resolved preview origin is under this repository's own domain
              env:
                  DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
              run: |
                  set -euo pipefail
                  if [ -z "${DOMAIN_NAME}" ]; then
                      echo '::error::the DOMAIN_NAME repository variable is empty — the resolved origin would be a bare label'
                      exit 1
                  fi
                  case "${PLAYWRIGHT_BASE_URL}" in
                      "https://${DOMAIN_NAME}" | "https://"*".${DOMAIN_NAME}") echo "target ${PLAYWRIGHT_BASE_URL}" ;;
                      *)
                          echo "::error::resolved target '${PLAYWRIGHT_BASE_URL}' is not under ${DOMAIN_NAME} — refusing to drive it"
                          exit 1
                          ;;
                  esac
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24
            - name: Restore dependencies
              uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                      packages/*/*/node_modules
                      packages/*/*/*/node_modules
                      packages/*/*/*/*/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
            # ⛔ A CACHE MISS MUST BE SLOW, NOT FATAL. These jobs restore `node_modules` and never install,
            # so before this step a miss did not degrade them — it killed them: no `node_modules` means no
            # `tsc`, and the build step died with `sh: 1: tsc: not found` / `npm error code 127`. Across the
            # 8 Playwright shards plus the merged report that turned ONE evicted cache entry into 9 red jobs,
            # and a re-run usually went green because `install` had re-saved the entry meanwhile — which is
            # exactly what made it look like flake instead of a missing fallback.
            #
            # The miss is real and expected: the repo's Actions cache sits under a 10 GB cap with LRU
            # eviction, and every lockfile change mints a fresh entry, so an in-flight run CAN have its entry
            # evicted underneath it. The `::warning::` keeps that visible — a silent reinstall would hide the
            # eviction rate, which is the number worth watching.
            - name: Install dependencies if the cache missed
              run: |
                  if [ -d node_modules ] && [ -n "$(ls -A node_modules 2>/dev/null)" ]; then
                      exit 0
                  fi
                  echo "::warning::node_modules cache miss (entry evicted or never saved) — running npm ci"
                  npm ci
            # STILL REQUIRED after the move to `next start`, for a different reason — worth stating, because
            # the old one no longer holds. The server this job runs is PRE-BUILT (`@commise/ui` is in
            # `transpilePackages`, so it is compiled INTO the artifact; `.next/server` carries no
            # `require("@commise/ui…")` at all), so the dev server's `theme.css` import is gone. But
            # `tests/e2e/mockupFidelity.spec.ts` imports `@commise/ui/tokens/gradients`, which the package's
            # own exports map resolves to `./dist/tokens/gradients.js` — Playwright loads that spec directly,
            # so the dist must exist or the shard holding it fails to collect.
            - name: Restore UI build artifacts
              uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
              with:
                  path: packages/apps/commise/ui/dist
                  key: ${{ runner.os }}-ui-dist-${{ github.sha }}
            - name: Ensure @commise/ui is built (fallback if the per-SHA cache restore missed)
              run: '[ -n "$(ls -A packages/apps/commise/ui/dist 2>/dev/null)" ] || npm run build --workspace=@commise/ui'
            # The suite drives ClerkJS in a browser against the PREVIEW origin, `pr-{N}.sandbox.{apex}`, and
            # that origin is served by the SANDBOX Clerk instance. Clerk *production* instances (pk_live) are
            # domain-locked and refuse to initialize on any origin other than their production domain —
            # ClerkJS aborts with "Production Keys are only allowed for domain <domain>", so <SignIn> never
            # mounts and the sign-in page renders without the auth form (only the Next.js <title> survives).
            # So these are always the sandbox (dev-instance) keys regardless of the pipeline stage — which is
            # also why the wake below is always about the SANDBOX database.
            #
            # These are the BACKEND keys the fixture provisioning uses (`globalSetup` calls Clerk's Backend
            # API to create the run-scoped user); the publishable key the BROWSER runs on is the one the
            # preview's own Vercel build inlined.
            - name: Load sandbox (dev-instance) Clerk secrets for the preview web E2E
              id: secrets
              continue-on-error: true
              uses: ./.github/actions/load-secrets
              with:
                  stage: sandbox
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ env.DEFAULT_AWS_REGION }}
            # ⛔ ADR-0007 × THIS SUITE'S CLERK FIXTURE — the same nightly shutdown that wedges deploys, hitting
            # a job that deploys NOTHING. `globalSetup` creates a run-scoped Clerk user and then BLOCKS for 30s
            # waiting for `external_id` to be backfilled; that backfill is the sandbox `user.created` webhook —
            # a VPC-attached Lambda that reaches Secrets Manager and the Clerk Backend API through the sandbox
            # NAT instance and writes the app user to the sandbox RDS. ADR-0007 stops BOTH nightly, 00:00–09:00
            # ET, so inside that window the backfill can never arrive.
            #
            # Observed 2026-08-25 at 01:37 ET on dcf2aaef: all eight shards dead in ~1 minute each, NO test
            # results produced at all, every one failing with `waitForTestUserExternalId: … still has no
            # externalId after 30000ms`. That message names a webhook outage because it was written without
            # knowing the outage is on a SCHEDULE — the suite is not flaky overnight, it is impossible.
            #
            # Waking here is near-free on a daytime run (two describe calls against an already-`available`
            # instance and an already-`running` NAT — `ensure` is idempotent) and starts the tier only on a run
            # that actually lands in the window, which is exactly when it must. The nightly schedule is
            # untouched, so ADR-0007's cost intent stands. The script takes no instance argument by
            # construction — it discovers and validates — so it cannot address the prod database.
            #
            # ⛔ It runs BEFORE the artifact download and the browser install, and its exit status is NOT
            # suppressed: a wake failure must end this job immediately and by its own name, rather than let the
            # suite proceed and die 30s later inside globalSetup with a message that sends the reader hunting a
            # webhook outage. Diagnosing that misdirection is most of what this incident cost.
            #
            # ⚠️ This runs on the `main` (prod) pipeline too, and that is correct rather than a leak: this job
            # ALWAYS authenticates against the sandbox dev instance whatever `inputs.stage` says (see the step
            # above for why pk_live cannot serve localhost), so it is always the SANDBOX that has to be awake.
            #
            # AWS credentials come from the `load-secrets` step above, which configures them with the SAME
            # static keys the deploy workflows already run this script under — so this needs no IAM change.
            - name: Wake the shared sandbox (ADR-0007 stops the RDS + NAT this suite's Clerk fixture needs)
              if: steps.secrets.outcome == 'success'
              run: bash .github/scripts/sandbox-wake.sh ensure "${DEFAULT_AWS_REGION}"
            # Cache the Playwright browser binaries (~/.cache/ms-playwright) keyed on the lockfile so
            # the Chromium download only happens when the Playwright version changes.
            - name: Cache Playwright browsers
              id: playwright-cache
              if: steps.secrets.outcome == 'success'
              uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
              with:
                  path: ~/.cache/ms-playwright
                  key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
            # Cache miss: download the browser + OS deps. Cache hit: browsers are restored, so only the
            # OS-level system dependencies still need installing.
            # ⛔ BOUNDED AND RETRIED, because this step is the one that hangs.
            #
            # Both commands shell out to `apt-get` for Chromium's OS libraries. On 2026-08-18 two shards sat
            # in `install-deps` for 1h47m — the log's last line is apt fetching package lists from the
            # Ubuntu/Microsoft/Google mirrors, then nothing — while the other two had already cleared it and
            # finished in 6 and 10 minutes. A mirror stall is not our defect, but an UNBOUNDED one is: with
            # no step timeout it presents as "CI is still running" rather than a failure anyone can retry.
            #
            # 18 SECONDS is the measured normal for the cache-hit path. The budget is nevertheless 8
            # minutes, because a 3-minute one FAILED ALL EIGHT SHARDS on 2026-08-18: the mirror was serving
            # font packages at 30-60s each, which is slow rather than stuck, and a bound tight enough to
            # catch a stall is also tight enough to reject a bad night. 8 minutes still turns the 1h47m
            # hang seen earlier into a fast, retryable failure, which is the property that matters.
            #
            # ⚠️ Running this job in `mcr.microsoft.com/playwright` — which would remove apt entirely — was
            # TRIED and REVERTED. The image boots, but the dependency cache saved by the `install` job on
            # the host is not found inside the container, so `@commise/ui` cannot build (`tsc`, exit 127)
            # and every shard fails deterministically. That trades a transient mirror problem for a
            # permanent one. It is still the right long-term fix; it needs the node_modules question solved
            # first (install inside the container, or a container-keyed cache).
            #
            # The retry then absorbs exactly the
            # transient this was: one stalled fetch costs ~3 minutes and self-heals instead of costing a
            # re-run of the whole shard. `apt-get update` is re-run first because a half-populated list is
            # the state a killed fetch leaves behind.
            - name: Install Playwright browsers (cache miss)
              if: steps.secrets.outcome == 'success' && steps.playwright-cache.outputs.cache-hit != 'true'
              timeout-minutes: 12
              run: |
                  npx playwright install --with-deps chromium \
                      || { echo "::warning::playwright install stalled or failed — retrying once"; \
                           sudo apt-get update -qq; \
                           npx playwright install --with-deps chromium; }
            # ⛔ PROBE, don't pre-install. A cached browser BINARY is useless without its shared libraries,
            # but on the ubuntu-latest image those libraries are already present — and `install-deps` pays a
            # full `apt-get update` against Azure's mirrors to discover that. Every shard paid it, so one
            # flaky mirror took out shards 2/8 and 6/8 (`has timed out after 8 minutes`) on a run whose only
            # change was documentation, and the retry-once wrapper could not help: the stall consumed the
            # whole budget before the fallback was reached.
            #
            # Launching the browser is the ONLY evidence that actually matters here — it is exactly what the
            # shard is about to do, and it costs ~2s instead of ~3min. So apt is now the FALLBACK, reached
            # only when the launch really fails, and it keeps the update+retry that a genuine miss needs.
            # `--no-sandbox` because the probe runs as root on the runner, where Chromium's sandbox refuses
            # to start; the tests themselves launch through Playwright's own config, which is unaffected.
            - name: Ensure Playwright system deps (cache hit)
              if: steps.secrets.outcome == 'success' && steps.playwright-cache.outputs.cache-hit == 'true'
              timeout-minutes: 8
              run: |
                  if node -e "require('playwright-core').chromium.launch({args:['--no-sandbox']}).then(b => b.close())"; then
                      echo "chromium launches — system deps already satisfied, skipping apt"
                  else
                      echo "::warning::chromium failed to launch on the cached browser — installing system deps"
                      npx playwright install-deps chromium \
                          || { echo "::warning::playwright install-deps stalled or failed — retrying once"; \
                               sudo apt-get update -qq; \
                               npx playwright install-deps chromium; }
                  fi
            # `--shard` is Playwright's own splitter (it distributes whole FILES to balance test count, and
            # never splits a file). `--reporter=blob` overrides the config's `html` for CI only: a blob report
            # is the machine-readable intermediate that `merge-reports` recombines in the report job below, so
            # a failure stays diagnosable from ONE artifact instead of four partial HTML reports. The config
            # keeps `html` as its default so a local `npx playwright test` is unchanged.
            - name: Run web e2e tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
              if: steps.secrets.outcome == 'success'
              # ⚠️ The shard coordinates reach the shell through `env:`, NOT by `${{ }}` interpolation into
              # the `run:` body. Expanding a template directly into a shell script is the
              # `template-injection` class: the expansion happens BEFORE the shell sees the line, so the
              # value is spliced in as code rather than passed as data. These two happen to be integers
              # GitHub generates, so nothing is exploitable here today — but the audit is gating precisely
              # so that the pattern never gets copied to a value an outsider controls (a PR title, a branch
              # name, a comment body). The step NAME above may keep its `${{ }}`: a name is not executed.
              env:
                  SHARD_INDEX: ${{ matrix.shard }}
                  SHARD_TOTAL: ${{ strategy.job-total }}
              run: |
                  npm run test:e2e --workspace=@commise/web -- \
                      --shard="${SHARD_INDEX}/${SHARD_TOTAL}" \
                      --reporter=blob
            # One blob per shard, consumed ONLY by the report job. `!cancelled()` rather than `failure()`: the
            # merged report must describe the whole run, so a PASSING shard's blob is required too.
            - name: Upload blob report (shard ${{ matrix.shard }})
              if: ${{ !cancelled() && steps.secrets.outcome == 'success' }}
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: e2e-web-blob-${{ inputs.stage }}-${{ matrix.shard }}
                  path: packages/apps/commise/web/blob-report
                  retention-days: 1
                  if-no-files-found: ignore
            # ⛔ NO visual/fidelity upload here. Both specs that produce it (`visualRegression`,
            # `mockupFidelity`) stub the recipe API, so `specTier.ts` puts them in the stubbed tier and this
            # job never runs them. An upload kept "just in case" would be a PRODUCER THAT CANNOT PRODUCE: it
            # finds no files, `if-no-files-found: ignore` passes, and the report job uploads an empty set to
            # Argos with every check green. That shipped for one commit.
            - name: Upload Playwright traces (shard ${{ matrix.shard }})
              if: failure() && steps.secrets.outcome == 'success'
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: playwright-traces-${{ inputs.stage }}-${{ matrix.shard }}
                  path: packages/apps/commise/web/test-results
                  retention-days: 7
                  if-no-files-found: ignore

    # THE SINGLE SIGNAL for the web E2E tier, and the reason sharding does not cost the owner four checks to
    # reconcile. It recombines the four blob reports into ONE Playwright HTML report, does the ONE Argos upload
    # for the commit, and then RE-ASSERTS the shards' verdict as its own status.
    #
    # `!cancelled()` (not `success()`) is what makes it run when a shard FAILED — which is exactly when the
    # merged report matters most. Because the job then runs on failure, its own green would otherwise mask a
    # red shard, so the final step compares `needs.e2e-web.result` and exits non-zero. That comparison IS the
    # gate: without it this job would report success over a broken suite.
    integration-web-playwright:
        # ⛔ A CONSTANT, INCLUDING THE SHARD. A skipped job never evaluates its name, so an
        # interpolated one renders the RAW `${{ … }}` in the checks list — observed on this very job
        # once the liveness gate started skipping it:
        #   `E2E (web — Playwright against the deployed preview) ${{ matrix.shard }}/${{ strategy.job-total }}`
        # ⚠️ `matrix`/`strategy` are NOT exempt from that, which is what the first version of
        # workflowInvariants' invariant 8 assumed. They render correctly only while the job RUNS;
        # these shards now skip by default, so that is the uncommon case. The shard number stays in
        # the STEP name, where a human reads it and no required-check rule matches on it.
        name: Integration (web — Playwright over a stubbed API, locally booted)
        # 30 + the sandbox wake's own 15-minute bound (see the wake step below). A run that lands in ADR-0007's
        # 00:00–09:00 ET window legitimately waits minutes for a stopped `db.t4g.micro` to reach `available`,
        # and a JOB timeout is precisely the misleading failure that step exists to prevent: it would kill the
        # shard mid-wake with "the job running on runner … has exceeded the maximum execution time" rather than
        # the script's own annotated verdict. The wake is self-bounding, so this only has to be wide enough to
        # let that bound be the one that fires.
        timeout-minutes: 45
        runs-on: ubuntu-latest
        # `build-ui` rather than `build`: the `.next` artifact is gone with the local server, but
        # `mockupFidelity.spec.ts` still imports `@commise/ui/tokens/gradients`, whose exports map resolves to
        # `./dist/…`, so the shard holding that spec fails to COLLECT without the UI dist.
        needs: [build, build-ui]
        # SHARDED, 4 ways. This job WAS the entire critical path of a PR run: measured on the green run
        # 31514368684 it started at +4.0m and ran 15.5m, ending at 19.5m, while every other job in the
        # pipeline finished by ~+6m (next slowest: `Test`, 4.8m). Wall clock was 19.4m for 42.1m of summed
        # job time — i.e. already ~2.2x compressed, with nothing left to win anywhere but here.
        #
        # WHY FOUR. The suite's cost is FLAT per test, not concentrated in one slow spec — measured from the
        # dot-reporter timeline of that same run: 8.29 s/test over tests 1–80, then 8.12 s/test over the
        # remaining 22 (102 tests, 14.5m). So there is no dominant serial spec to isolate, and sharding by
        # test count tracks sharding by time. Playwright balances whole FILES (it never splits one), and the
        # largest file here holds 9 tests against ~25.5 per shard, so 4 shards balance cleanly. Above ~4 the
        # win collapses into fixed cost — ~1.4m of checkout/deps/browser install plus a Next dev-server boot,
        # paid per shard — while the Clerk fixture count, the runner minutes, and the exposure to the
        # `waitForTestUserExternalId` setup flake all keep scaling linearly. 4 buys ~5.2m per shard
        # (≈ +6.5m runner minutes total) for roughly a 9m cut in wall clock; 8 would roughly double the added
        # cost to shave ~1.5m more, against the repo's cost posture (ADR-0007/ADR-0008).
        #
        # ⚠️ `COMMISE_E2E_SHARD` below is LOAD-BEARING, not decoration — see the env block.
        strategy:
            # Never fail-fast. Two reasons, both concrete: a cancelled shard is killed before Playwright's
            # `globalTeardown` runs, which LEAKS its Clerk fixture user (reclaimed only by the 12h age-gated
            # sweep); and one shard's failure would otherwise destroy the other three shards' results, so the
            # merged report — the whole point of the blob/merge split below — would be missing most of the run.
            fail-fast: false
            matrix:
                # ⛔ EIGHT, and the ceiling is arithmetic — see the Clerk interlock above.
                #
                # The only Clerk limit SHARED across shards is the Backend API (100 req/10s on a dev
                # instance); per-user and per-IP limits do not bind, because each shard provisions its own
                # user on its own runner IP. This suite spends ~1 BAPI call per test, so:
                #   4 shards ≈ 5 req/10s  → 20x margin      8 shards ≈ 10 req/10s → 10x margin
                #
                # Measured 2026-08-18: 108 tests in 34 files at ~9.8s each, and `setup` is a DEPENDENCY
                # project so it is not sharded — it runs IN FULL in every shard, at a measured 32-35s.
                # That fixed toll is what bounds this, not Clerk:
                #   4 shards → 27 tests + 35s setup ≈ 300s     8 shards → 14 tests + 35s ≈ 167s
                # Past ~8 the toll dominates (16 shards would pay 16x35s to run 7 tests each), so raising
                # this further buys nothing. `--shard` distributes whole FILES, and there are 34 of them,
                # so 8 shards still have real work to split.
                shard: [1, 2, 3, 4, 5, 6]
        # `id-token: write` is what makes the Argos upload SECRETLESS (U10a): the CLI exchanges a short-lived
        # GitHub OIDC token for a build-scoped Argos credential, so no `ARGOS_TOKEN` secret exists to leak — and
        # a FORK pull request, which cannot read repository secrets at all, still uploads (Argos falls back to
        # its tokenless GitHub-Actions path when OIDC is unavailable). `contents: read` must be restated because
        # a job-level `permissions:` REPLACES the workflow default rather than adding to it.
        permissions:
            contents: read
            id-token: write # the secretless Argos OIDC exchange — see the note above
        # ⛔ THE DEPLOYED PREVIEW, and nothing on this runner. `playwright.config.ts` reads
        # `PLAYWRIGHT_BASE_URL` as `baseURL` and — critically — declares NO `webServer` when it is set, so
        # there is no `next start`, no `.next` artifact to download and no port to bind.
        #
        # ⚠️ `NEXT_PUBLIC_RECIPE_API_URL` / `NEXT_PUBLIC_IDENTITY_API_URL` are deliberately GONE rather than
        # re-pointed. They were the SERVER-side statement for the Next process this job used to run; the
        # preview's own Vercel deployment states its own, and a value here would be read by nothing while
        # reading as configuration. The specs themselves never build a URL out of them — every one mocks the
        # API with the origin-agnostic glob `page.route('**/api/v1/**')` (tests/e2e/utils/recipeApi.ts).
        env:
            # No `PLAYWRIGHT_BASE_URL`: the config declares its own `webServer` when this is unset, which
            # is exactly the harness these specs need — an app whose `NEXT_PUBLIC_API_URL` points at itself,
            # where no recipe API answers, so every SSR prefetch fails and the page falls back to the client
            # fetch the browser stub CAN intercept.
            PLAYWRIGHT_MOCKED_ONLY: '1'
            # ⚠️ THE CLERK SAFETY INTERLOCK FOR SHARDING. Read before touching the matrix.
            #
            # Each shard is a SEPARATE Playwright process, so each runs `globalSetup` AND `globalTeardown`.
            # `deriveRunKey` (tests/e2e/utils/runFixtureIdentity.ts) keys the run-scoped Clerk fixture on
            # GITHUB_RUN_ID + GITHUB_RUN_ATTEMPT + GITHUB_JOB — and `GITHUB_JOB` is the job's ID, identical
            # for every leg of a matrix. Without this variable all four shards would derive the SAME key, so
            # (a) four concurrent `createUser` calls would race one unique username, and (b) the first shard
            # to finish would DELETE the shared sign-in fixture the other three are still authenticating as,
            # since teardown's `own` rule matches it. That is bbf7ea7c's cross-workflow failure — "test
            # sign-in user is missing — globalSetup should have created it" — reproduced INSIDE one run.
            #
            # With it, each shard provisions, uses and deletes its OWN user, so teardown can never reach a
            # sibling's live fixture. That is also what keeps the SERIALIZATION guarantee intact: the suite is
            # serial (`workers: 1`, `fullyParallel: false`) because concurrent sign-ins AS ONE USER flake, and
            # Clerk's Frontend-API sign-in limits are scoped per USER and per IP. Four shards means four
            # distinct users on four distinct runner IPs, each still driving its sign-ins strictly one at a
            # time — so the per-user/per-IP budget each shard sees is unchanged from today's single stream,
            # rather than four streams contending for one. The per-INSTANCE limit that IS shared is the
            # Backend API (100 req/10s on a dev instance); this suite spends ~1 BAPI call per test, so four
            # shards ask for ~5 per 10s against that 100 — a ~20x margin.
            #
            # ── HOW THE `setup` PROJECT INTERACTS WITH THIS (verified against Playwright's own source) ──
            #
            # The suite now authenticates ONCE per run in a `setup` project and persists `storageState`
            # (tests/e2e/auth.setup.ts), which took the run from ~90 ticket sign-ins to ~7. A setup project
            # reached through `dependencies:` is classified `"dependency"`, not `"top-level"`
            # (`buildProjectsClosure` in playwright/lib/runner/index.js), and only top-level project suites are
            # handed to `filterForShard`. So `setup` is NOT sharded: it runs IN FULL in every shard.
            #
            # That is the correct behaviour here, and it is this variable that makes it correct. Each shard
            # derives its own run key, provisions its own Clerk user, and therefore must authenticate as ITS
            # user — and `authStatePath` keys the state FILE on the same run key, so no shard can restore a
            # session belonging to a user another shard's teardown deletes. Sharing one key or one state file
            # would recreate bbf7ea7c inside the run, one layer lower down.
            #
            # Do NOT delete this, do NOT raise `workers` above 1, and do NOT let two shards share a key.
            COMMISE_E2E_SHARD: ${{ matrix.shard }}
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24
            - name: Restore dependencies
              uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                      packages/*/*/node_modules
                      packages/*/*/*/node_modules
                      packages/*/*/*/*/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
            # ⛔ A CACHE MISS MUST BE SLOW, NOT FATAL. These jobs restore `node_modules` and never install,
            # so before this step a miss did not degrade them — it killed them: no `node_modules` means no
            # `tsc`, and the build step died with `sh: 1: tsc: not found` / `npm error code 127`. Across the
            # 8 Playwright shards plus the merged report that turned ONE evicted cache entry into 9 red jobs,
            # and a re-run usually went green because `install` had re-saved the entry meanwhile — which is
            # exactly what made it look like flake instead of a missing fallback.
            #
            # The miss is real and expected: the repo's Actions cache sits under a 10 GB cap with LRU
            # eviction, and every lockfile change mints a fresh entry, so an in-flight run CAN have its entry
            # evicted underneath it. The `::warning::` keeps that visible — a silent reinstall would hide the
            # eviction rate, which is the number worth watching.
            - name: Install dependencies if the cache missed
              run: |
                  if [ -d node_modules ] && [ -n "$(ls -A node_modules 2>/dev/null)" ]; then
                      exit 0
                  fi
                  echo "::warning::node_modules cache miss (entry evicted or never saved) — running npm ci"
                  npm ci
            # STILL REQUIRED after the move to `next start`, for a different reason — worth stating, because
            # the old one no longer holds. The server this job runs is PRE-BUILT (`@commise/ui` is in
            # `transpilePackages`, so it is compiled INTO the artifact; `.next/server` carries no
            # `require("@commise/ui…")` at all), so the dev server's `theme.css` import is gone. But
            # `tests/e2e/mockupFidelity.spec.ts` imports `@commise/ui/tokens/gradients`, which the package's
            # own exports map resolves to `./dist/tokens/gradients.js` — Playwright loads that spec directly,
            # so the dist must exist or the shard holding it fails to collect.
            - name: Restore UI build artifacts
              uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
              with:
                  path: packages/apps/commise/ui/dist
                  key: ${{ runner.os }}-ui-dist-${{ github.sha }}
            - name: Ensure @commise/ui is built (fallback if the per-SHA cache restore missed)
              run: '[ -n "$(ls -A packages/apps/commise/ui/dist 2>/dev/null)" ] || npm run build --workspace=@commise/ui'
            # The suite drives ClerkJS in a browser against the PREVIEW origin, `pr-{N}.sandbox.{apex}`, and
            # that origin is served by the SANDBOX Clerk instance. Clerk *production* instances (pk_live) are
            # domain-locked and refuse to initialize on any origin other than their production domain —
            # ClerkJS aborts with "Production Keys are only allowed for domain <domain>", so <SignIn> never
            # mounts and the sign-in page renders without the auth form (only the Next.js <title> survives).
            # So these are always the sandbox (dev-instance) keys regardless of the pipeline stage — which is
            # also why the wake below is always about the SANDBOX database.
            #
            # These are the BACKEND keys the fixture provisioning uses (`globalSetup` calls Clerk's Backend
            # API to create the run-scoped user); the publishable key the BROWSER runs on is the one the
            # preview's own Vercel build inlined.
            - name: Load sandbox (dev-instance) Clerk secrets for the stubbed-API web suite
              id: secrets
              continue-on-error: true
              uses: ./.github/actions/load-secrets
              with:
                  stage: sandbox
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ env.DEFAULT_AWS_REGION }}
            # ⛔ ADR-0007 × THIS SUITE'S CLERK FIXTURE — the same nightly shutdown that wedges deploys, hitting
            # a job that deploys NOTHING. `globalSetup` creates a run-scoped Clerk user and then BLOCKS for 30s
            # waiting for `external_id` to be backfilled; that backfill is the sandbox `user.created` webhook —
            # a VPC-attached Lambda that reaches Secrets Manager and the Clerk Backend API through the sandbox
            # NAT instance and writes the app user to the sandbox RDS. ADR-0007 stops BOTH nightly, 00:00–09:00
            # ET, so inside that window the backfill can never arrive.
            #
            # Observed 2026-08-25 at 01:37 ET on dcf2aaef: all eight shards dead in ~1 minute each, NO test
            # results produced at all, every one failing with `waitForTestUserExternalId: … still has no
            # externalId after 30000ms`. That message names a webhook outage because it was written without
            # knowing the outage is on a SCHEDULE — the suite is not flaky overnight, it is impossible.
            #
            # Waking here is near-free on a daytime run (two describe calls against an already-`available`
            # instance and an already-`running` NAT — `ensure` is idempotent) and starts the tier only on a run
            # that actually lands in the window, which is exactly when it must. The nightly schedule is
            # untouched, so ADR-0007's cost intent stands. The script takes no instance argument by
            # construction — it discovers and validates — so it cannot address the prod database.
            #
            # ⛔ It runs BEFORE the artifact download and the browser install, and its exit status is NOT
            # suppressed: a wake failure must end this job immediately and by its own name, rather than let the
            # suite proceed and die 30s later inside globalSetup with a message that sends the reader hunting a
            # webhook outage. Diagnosing that misdirection is most of what this incident cost.
            #
            # ⚠️ This runs on the `main` (prod) pipeline too, and that is correct rather than a leak: this job
            # ALWAYS authenticates against the sandbox dev instance whatever `inputs.stage` says (see the step
            # above for why pk_live cannot serve localhost), so it is always the SANDBOX that has to be awake.
            #
            # AWS credentials come from the `load-secrets` step above, which configures them with the SAME
            # static keys the deploy workflows already run this script under — so this needs no IAM change.
            - name: Wake the shared sandbox (ADR-0007 stops the RDS + NAT this suite's Clerk fixture needs)
              if: steps.secrets.outcome == 'success'
              run: bash .github/scripts/sandbox-wake.sh ensure "${DEFAULT_AWS_REGION}"
            # Cache the Playwright browser binaries (~/.cache/ms-playwright) keyed on the lockfile so
            # the Chromium download only happens when the Playwright version changes.
            # `next start` SERVES a build; it does not make one. The `build` job publishes `.next` and this
            # restores it in place (the artifact's entries are relative to `.next`, which is what makes the
            # bare `path:` below correct).
            - name: Restore the web production build
              if: steps.secrets.outcome == 'success'
              uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
              with:
                  name: web-next-build-${{ inputs.stage }}
                  path: packages/apps/commise/web/.next
            - name: Cache Playwright browsers
              id: playwright-cache
              if: steps.secrets.outcome == 'success'
              uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
              with:
                  path: ~/.cache/ms-playwright
                  key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
            # Cache miss: download the browser + OS deps. Cache hit: browsers are restored, so only the
            # OS-level system dependencies still need installing.
            # ⛔ BOUNDED AND RETRIED, because this step is the one that hangs.
            #
            # Both commands shell out to `apt-get` for Chromium's OS libraries. On 2026-08-18 two shards sat
            # in `install-deps` for 1h47m — the log's last line is apt fetching package lists from the
            # Ubuntu/Microsoft/Google mirrors, then nothing — while the other two had already cleared it and
            # finished in 6 and 10 minutes. A mirror stall is not our defect, but an UNBOUNDED one is: with
            # no step timeout it presents as "CI is still running" rather than a failure anyone can retry.
            #
            # 18 SECONDS is the measured normal for the cache-hit path. The budget is nevertheless 8
            # minutes, because a 3-minute one FAILED ALL EIGHT SHARDS on 2026-08-18: the mirror was serving
            # font packages at 30-60s each, which is slow rather than stuck, and a bound tight enough to
            # catch a stall is also tight enough to reject a bad night. 8 minutes still turns the 1h47m
            # hang seen earlier into a fast, retryable failure, which is the property that matters.
            #
            # ⚠️ Running this job in `mcr.microsoft.com/playwright` — which would remove apt entirely — was
            # TRIED and REVERTED. The image boots, but the dependency cache saved by the `install` job on
            # the host is not found inside the container, so `@commise/ui` cannot build (`tsc`, exit 127)
            # and every shard fails deterministically. That trades a transient mirror problem for a
            # permanent one. It is still the right long-term fix; it needs the node_modules question solved
            # first (install inside the container, or a container-keyed cache).
            #
            # The retry then absorbs exactly the
            # transient this was: one stalled fetch costs ~3 minutes and self-heals instead of costing a
            # re-run of the whole shard. `apt-get update` is re-run first because a half-populated list is
            # the state a killed fetch leaves behind.
            - name: Install Playwright browsers (cache miss)
              if: steps.secrets.outcome == 'success' && steps.playwright-cache.outputs.cache-hit != 'true'
              timeout-minutes: 12
              run: |
                  npx playwright install --with-deps chromium \
                      || { echo "::warning::playwright install stalled or failed — retrying once"; \
                           sudo apt-get update -qq; \
                           npx playwright install --with-deps chromium; }
            # ⛔ PROBE, don't pre-install. A cached browser BINARY is useless without its shared libraries,
            # but on the ubuntu-latest image those libraries are already present — and `install-deps` pays a
            # full `apt-get update` against Azure's mirrors to discover that. Every shard paid it, so one
            # flaky mirror took out shards 2/8 and 6/8 (`has timed out after 8 minutes`) on a run whose only
            # change was documentation, and the retry-once wrapper could not help: the stall consumed the
            # whole budget before the fallback was reached.
            #
            # Launching the browser is the ONLY evidence that actually matters here — it is exactly what the
            # shard is about to do, and it costs ~2s instead of ~3min. So apt is now the FALLBACK, reached
            # only when the launch really fails, and it keeps the update+retry that a genuine miss needs.
            # `--no-sandbox` because the probe runs as root on the runner, where Chromium's sandbox refuses
            # to start; the tests themselves launch through Playwright's own config, which is unaffected.
            - name: Ensure Playwright system deps (cache hit)
              if: steps.secrets.outcome == 'success' && steps.playwright-cache.outputs.cache-hit == 'true'
              timeout-minutes: 8
              run: |
                  if node -e "require('playwright-core').chromium.launch({args:['--no-sandbox']}).then(b => b.close())"; then
                      echo "chromium launches — system deps already satisfied, skipping apt"
                  else
                      echo "::warning::chromium failed to launch on the cached browser — installing system deps"
                      npx playwright install-deps chromium \
                          || { echo "::warning::playwright install-deps stalled or failed — retrying once"; \
                               sudo apt-get update -qq; \
                               npx playwright install-deps chromium; }
                  fi
            # `--shard` is Playwright's own splitter (it distributes whole FILES to balance test count, and
            # never splits a file). `--reporter=blob` overrides the config's `html` for CI only: a blob report
            # is the machine-readable intermediate that `merge-reports` recombines in the report job below, so
            # a failure stays diagnosable from ONE artifact instead of four partial HTML reports. The config
            # keeps `html` as its default so a local `npx playwright test` is unchanged.
            - name: Run the stubbed-API web suite (shard ${{ matrix.shard }}/${{ strategy.job-total }})
              if: steps.secrets.outcome == 'success'
              # ⚠️ The shard coordinates reach the shell through `env:`, NOT by `${{ }}` interpolation into
              # the `run:` body. Expanding a template directly into a shell script is the
              # `template-injection` class: the expansion happens BEFORE the shell sees the line, so the
              # value is spliced in as code rather than passed as data. These two happen to be integers
              # GitHub generates, so nothing is exploitable here today — but the audit is gating precisely
              # so that the pattern never gets copied to a value an outsider controls (a PR title, a branch
              # name, a comment body). The step NAME above may keep its `${{ }}`: a name is not executed.
              env:
                  SHARD_INDEX: ${{ matrix.shard }}
                  SHARD_TOTAL: ${{ strategy.job-total }}
              run: |
                  npm run test:e2e --workspace=@commise/web -- \
                      --shard="${SHARD_INDEX}/${SHARD_TOTAL}" \
                      --reporter=blob
            # One blob per shard, consumed ONLY by the report job. `!cancelled()` rather than `failure()`: the
            # merged report must describe the whole run, so a PASSING shard's blob is required too.
            - name: Upload blob report (shard ${{ matrix.shard }})
              if: ${{ !cancelled() && steps.secrets.outcome == 'success' }}
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: integration-web-blob-${{ inputs.stage }}-${{ matrix.shard }}
                  path: packages/apps/commise/web/blob-report
                  retention-days: 1
                  if-no-files-found: ignore
            # The visual-regression PNGs and the mockup-fidelity pairs are produced by whichever SHARD happens
            # to hold `visualRegression.spec.ts` / `mockupFidelity.spec.ts`. They are staged per shard here and
            # consolidated in the report job, so Argos still receives ONE build for the commit rather than four
            # competing partial uploads.
            - name: Upload visual + fidelity output (shard ${{ matrix.shard }})
              if: ${{ !cancelled() && steps.secrets.outcome == 'success' }}
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: integration-web-visual-${{ inputs.stage }}-${{ matrix.shard }}
                  path: |
                      packages/apps/commise/web/screenshots
                      packages/apps/commise/web/mockup-fidelity
                  retention-days: 1
                  if-no-files-found: ignore
            # Failure-only: the raw traces for THIS shard. The human-readable report is the MERGED one built
            # by `e2e-web-report`; this is the trace payload the blob report does not carry.
            - name: Upload Playwright traces (shard ${{ matrix.shard }})
              if: failure() && steps.secrets.outcome == 'success'
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: playwright-traces-${{ inputs.stage }}-${{ matrix.shard }}
                  path: packages/apps/commise/web/test-results
                  retention-days: 7
                  if-no-files-found: ignore

    # THE SINGLE SIGNAL for the web E2E tier, and the reason sharding does not cost the owner four checks to
    # reconcile. It recombines the four blob reports into ONE Playwright HTML report, does the ONE Argos upload
    # for the commit, and then RE-ASSERTS the shards' verdict as its own status.
    #
    # `!cancelled()` (not `success()`) is what makes it run when a shard FAILED — which is exactly when the
    # merged report matters most. Because the job then runs on failure, its own green would otherwise mask a
    # red shard, so the final step compares `needs.e2e-web.result` and exits non-zero. That comparison IS the
    # gate: without it this job would report success over a broken suite.
    e2e-web-report:
        name: E2E (web — Playwright) · merged report
        timeout-minutes: 15
        runs-on: ubuntu-latest
        # BOTH web tiers, because the suite is split across them and the report is for the whole suite.
        # ⛔ The visual + fidelity output comes ONLY from the stubbed tier — `visualRegression.spec.ts` and
        # `mockupFidelity.spec.ts` both stub the recipe API, so `specTier.ts` places them there. A report job
        # consuming only the deployed tier's artifacts uploads NOTHING to Argos and still goes green, because
        # `if-no-files-found: ignore` and `continue-on-error: true` cannot tell that apart from the fork-PR
        # skip they exist for. Invariant 2 catches the wiring half; removing the deployed tier's now-empty
        # upload step catches the other half.
        needs: [resolve-sandbox, e2e-web, integration-web-playwright]
        # ⛔ `!cancelled()` makes this run when a SHARD failed — which is exactly when the merged report
        # matters most — but it must NOT make it run when there is no sandbox: `!cancelled()` alone is true
        # for a SKIPPED dependency, so this job would go green with nothing to merge and publish an empty
        # report as the tier's single signal. The liveness term is what keeps "nothing deployed" a SKIP here
        # too, in step with the shards it reports on.
        # NOT gated on a live sandbox: the stubbed tier runs regardless, and it owns the visual half.
        if: ${{ !cancelled() }}
        permissions:
            # Checkout only — this job merges blob artifacts and uploads to Argos; it writes nothing to the repo.
            contents: read
            # Same secretless Argos OIDC exchange as the shard job — the upload moved here, so the permission
            # must move with it (a job-level `permissions:` REPLACES the workflow default rather than adding).
            # The comment must be TRAILING to satisfy `undocumented-permissions`: the audit reads the same
            # line, not the lines above it, which is why the block comment alone left this flagged.
            id-token: write # the secretless Argos OIDC exchange — see the note above
        steps:
            # ⛔ THE REPORT MUST SAY WHAT IT REPORTS ON. A merged Playwright report is read days later, out of
            # the run that produced it, and "the web suite passed" is a different claim from "the web suite
            # passed against pr-91's preview". Naming the origin here is also what makes this job legible to
            # `workflowInvariants` invariant 7: a job whose displayed name says E2E must name a deployed
            # target, and this one merges artifacts rather than issuing requests.
            - name: Record which deployed origin this report describes
              env:
                  WEB_ORIGIN: ${{ needs.resolve-sandbox.outputs.web_origin }}
                  STAGE: ${{ needs.resolve-sandbox.outputs.stage }}
                  DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
              run: |
                  set -euo pipefail
                  case "${WEB_ORIGIN}" in
                      "https://"*".${DOMAIN_NAME}") ;;
                      *)
                          echo "::error::the shards' target '${WEB_ORIGIN}' is not under ${DOMAIN_NAME} — this report would misname what it describes"
                          exit 1
                          ;;
                  esac
                  echo "Playwright, against the deployed preview \`${WEB_ORIGIN}\` (stage \`${STAGE}\`)." >> "$GITHUB_STEP_SUMMARY"
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24
            # `merge-reports` is part of the installed @playwright/test, so the same restored node_modules the
            # shards used is all this needs — no browser download (it renders a report, it runs no tests).
            - name: Restore dependencies
              uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                      packages/*/*/node_modules
                      packages/*/*/*/node_modules
                      packages/*/*/*/*/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
            # ⛔ A CACHE MISS MUST BE SLOW, NOT FATAL. These jobs restore `node_modules` and never install,
            # so before this step a miss did not degrade them — it killed them: no `node_modules` means no
            # `tsc`, and the build step died with `sh: 1: tsc: not found` / `npm error code 127`. Across the
            # 8 Playwright shards plus the merged report that turned ONE evicted cache entry into 9 red jobs,
            # and a re-run usually went green because `install` had re-saved the entry meanwhile — which is
            # exactly what made it look like flake instead of a missing fallback.
            #
            # The miss is real and expected: the repo's Actions cache sits under a 10 GB cap with LRU
            # eviction, and every lockfile change mints a fresh entry, so an in-flight run CAN have its entry
            # evicted underneath it. The `::warning::` keeps that visible — a silent reinstall would hide the
            # eviction rate, which is the number worth watching.
            - name: Install dependencies if the cache missed
              run: |
                  if [ -d node_modules ] && [ -n "$(ls -A node_modules 2>/dev/null)" ]; then
                      exit 0
                  fi
                  echo "::warning::node_modules cache miss (entry evicted or never saved) — running npm ci"
                  npm ci
            # `merge-multiple` flattens all four shards' blobs into one directory, which is the input shape
            # `merge-reports` expects. Absent blobs are tolerated: on a fork PR the shards skip their run
            # entirely (no secrets), and this job must not invent a red for that designed skip.
            - name: Download shard blob reports (deployed tier)
              uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
              with:
                  pattern: e2e-web-blob-${{ inputs.stage }}-*
                  path: packages/apps/commise/web/blob-report
                  merge-multiple: true
              continue-on-error: true
            - name: Download shard blob reports (stubbed tier)
              uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
              with:
                  pattern: integration-web-blob-${{ inputs.stage }}-*
                  path: packages/apps/commise/web/blob-report
                  merge-multiple: true
              continue-on-error: true
            # ⛔ The stubbed tier is the ONLY producer of these — both specs that make them stub the API.
            - name: Download shard visual + fidelity output (stubbed tier)
              uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
              with:
                  pattern: integration-web-visual-${{ inputs.stage }}-*
                  path: packages/apps/commise/web
                  merge-multiple: true
              continue-on-error: true
            # ONE HTML report for the whole suite. Guarded on the blobs actually being present so a fork PR (or
            # a run whose shards never started) produces a clear "no blobs" note instead of a merge crash.
            - name: Merge shard reports into one Playwright HTML report
              id: merge
              run: |
                  if [ -z "$(ls -A packages/apps/commise/web/blob-report 2>/dev/null)" ]; then
                      echo "no blob reports found — the shards did not run (fork PR / missing secrets)"
                      echo "merged=false" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  npx playwright merge-reports --reporter html packages/apps/commise/web/blob-report
                  echo "merged=true" >> "$GITHUB_OUTPUT"
              env:
                  PLAYWRIGHT_HTML_OPEN: never
                  PLAYWRIGHT_HTML_OUTPUT_DIR: packages/apps/commise/web/playwright-report
            - name: Upload merged Playwright report
              if: steps.merge.outputs.merged == 'true'
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: playwright-report-${{ inputs.stage }}
                  path: packages/apps/commise/web/playwright-report
                  retention-days: 7
                  if-no-files-found: ignore
            # U10a half 1 — hand the visual-regression PNGs to Argos for comparison. The CLI is a devDependency
            # of `@commise/web` (the package whose screenshots these are) and is invoked with `--no-install`,
            # so the version that runs is the one the lockfile pins and Dependabot bumps. It used to be
            # `npx --yes @argos-ci/cli@6`, a major-only range that let the registry choose the minor on the
            # day — `postPruneToolchain.test.ts` refuses any `npx` the lockfile does not provide.
            #
            # Gated on the `ARGOS_ENABLED` repository VARIABLE (not a secret) so the step is inert until the
            # Argos project exists and is linked to this repository. Without that one-time setup the upload
            # cannot succeed, and a step that always fails is worse than one that is explicitly switched off.
            # Flip the variable to `true` once the project is linked; no code change needed.
            #
            # It lives HERE rather than in the shard job so the commit gets ONE Argos build assembled from all
            # four shards' PNGs, instead of four racing partial uploads of the same build name.
            #
            # Not `continue-on-error`: once enabled, a failed upload means the visual gate did not run, and that
            # must be visible rather than green.
            - name: Upload visual-regression screenshots to Argos
              if: ${{ steps.merge.outputs.merged == 'true' && vars.ARGOS_ENABLED == 'true' }}
              run: npx --no-install argos upload packages/apps/commise/web/screenshots --build-name web
            # U10a half 2 — the mockup-fidelity artifact (wireframe/implementation image pairs, report.json and
            # a side-by-side index.html). Uploaded on PASS as well as failure: it is a REVIEW artifact, not a
            # failure diagnostic, and its whole purpose is to be read on a green run.
            - name: Upload mockup-fidelity report
              if: steps.merge.outputs.merged == 'true'
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: mockup-fidelity-${{ inputs.stage }}
                  path: packages/apps/commise/web/mockup-fidelity
                  retention-days: 14
                  if-no-files-found: warn
            # THE GATE. This job runs on `!cancelled()`, so without this step a failed shard would sit behind a
            # GREEN merged-report check — precisely the "four signals the owner has to reconcile" problem in its
            # worst form, a single signal that lies. `needs.e2e-web.result` aggregates the whole matrix:
            # `success` only if every shard succeeded, otherwise `failure`/`cancelled`/`skipped`.
            - name: Re-assert the shards' verdict
              # Same `template-injection` reasoning as the shard step: the matrix result arrives as DATA in
              # `env:` rather than being expanded into the script. Note the quoting in the old form was not
              # protection — `'${{ ... }}'` is substituted before the shell parses the line, so a value
              # containing a quote would have ended the string and run whatever followed.
              env:
                  MATRIX_RESULT: ${{ needs.e2e-web.result }}
              run: |
                  result="${MATRIX_RESULT}"
                  echo "e2e-web matrix result: $result"
                  case "$result" in
                      success|skipped) exit 0 ;;
                      *) echo "::error::the web Playwright matrix did not pass ($result) — see the merged report artifact"; exit 1 ;;
                  esac

    e2e-mobile:
        # ⛔ NOT "Hermetic". This job boots no backend and drives no deployment — it is a Vitest component
        # test of the real `useAuth` hook over a mocked Clerk — so it was never the tier ADR-0032's ruling
        # was about. But `Hermetic` is the exact label that ruling forbids ("do NOT re-create a
        # locally-booted e2e job under any label — `Hermetic`, `Contract`, `E2E-local`"), and a reader
        # scanning the checks cannot tell a forbidden tier from a component test by its name. §1's rule is
        # that a tier's name states its TARGET; this one now does.
        name: Test (mobile — the real useAuth hook over a mocked Clerk)
        # ⛔ RE-ENABLED 2026-09-05, AND THE DISABLE REASON WAS NEVER TRUE OF THIS JOB. It read: "this job
        # reaches REMOTE services (sandbox Clerk / stage secrets / upstream APIs)". It does not, and did not
        # then: the suite mocks `@clerk/expo` outright, references no secret, and boots nothing. Measured
        # before removing the gate — `grep -c 'process.env|CLERK|SECRET|AWS_'` is 0, and the suite passes
        # 15/15 with AWS and Clerk credentials unset in the environment. So a hermetic contract tier was
        # being withheld from every PR for a property it does not have.
        timeout-minutes: 30
        runs-on: ubuntu-latest
        needs: build
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24
            - name: Restore dependencies
              uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                      packages/*/*/node_modules
                      packages/*/*/*/node_modules
                      packages/*/*/*/*/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
            # ⛔ A CACHE MISS MUST BE SLOW, NOT FATAL. These jobs restore `node_modules` and never install,
            # so before this step a miss did not degrade them — it killed them: no `node_modules` means no
            # `tsc`, and the build step died with `sh: 1: tsc: not found` / `npm error code 127`. Across the
            # 8 Playwright shards plus the merged report that turned ONE evicted cache entry into 9 red jobs,
            # and a re-run usually went green because `install` had re-saved the entry meanwhile — which is
            # exactly what made it look like flake instead of a missing fallback.
            #
            # The miss is real and expected: the repo's Actions cache sits under a 10 GB cap with LRU
            # eviction, and every lockfile change mints a fresh entry, so an in-flight run CAN have its entry
            # evicted underneath it. The `::warning::` keeps that visible — a silent reinstall would hide the
            # eviction rate, which is the number worth watching.
            - name: Install dependencies if the cache missed
              run: |
                  if [ -d node_modules ] && [ -n "$(ls -A node_modules 2>/dev/null)" ]; then
                      exit 0
                  fi
                  echo "::warning::node_modules cache miss (entry evicted or never saved) — running npm ci"
                  npm ci
            # ⛔ THE SECRETS LOAD IS GONE, AND ITS REMOVAL CLOSES A FALSE-GREEN PATH. It was
            # `continue-on-error: true` and this step was gated `if: steps.secrets.outcome == 'success'`, so
            # a secrets failure skipped the tests and the JOB STILL REPORTED GREEN having run none — the
            # same false status `CODING_STANDARDS` §7.1a exists to prevent, and worse than a red job because
            # nobody investigates a pass. The suite needs no secret, so the honest fix is to stop asking for
            # one rather than to harden the gate around it.
            - name: Run mobile hermetic tests
              run: npm run test:e2e --workspace=@commise/mobile
