name: Account Infra Deploy

# The ACCOUNT-scoped deploy: infrastructure that exists once per AWS account, with no stage at all.
#
# Today that is `kitchensink-cost-guardrails` — the $300 monthly budget, the cost anomaly monitor and the
# subscription that notifies on a spike (ADR-0008). One of each, for the whole account.
#
# ## ⛔ WHY THIS IS ITS OWN WORKFLOW
#
# Constructed inside `packages/infra/global/bin/app.ts` behind `if (stage === 'prod')` and deployed by
# `prod-deploy.yml`, the stack would get the right NUMBER of copies (one) by the wrong mechanism, and:
#
#   - the account's cost monitoring could not be touched without running a full production deploy, and
#   - the stack would inherit the per-stage app's `Environment` tag, labelling an account-wide resource
#     `production` — so a tag rename would threaten to replace the two Cost Explorer resources.
#
# "Global" covers two different things: **stage-shared** infrastructure (one VPC, RDS, ALB and identity
# service PER STAGE — `bin/app.ts`, tagged `sandbox`/`production`) and **account-scoped** infrastructure
# (one, ever — `bin/account.ts`, tagged `global`). They are separate apps with separate
# pipelines, and the account app has no `stage` variable at all, so a per-stage deploy of it is not refused
# — it is unrepresentable.
#
# ⛔ Do NOT add a `stage` input here, and do not deploy this from a per-stage pipeline. The whole point is
# that there is nothing stage-shaped about a budget that watches every stage's spend at once.

on:
    # ⚠️ `push` on `main` only, scoped to the paths that can change it. There is no per-stage trigger because
    # there is no per-stage version of this — one account, one deploy.
    # ⚠️ NO `branches:` FILTER, and that is the fix for a real defect rather than a widening. This trigger
    # was `branches: [main]`, which named the right paths and registered NOTHING from a feature branch — so
    # the workflow could not be dispatched at all, while looking registered to any check that merely asked
    # whether a push trigger existed. Off main the run is a REGISTRATION run: the job below refuses it.
    push:
        paths:
            - packages/infra/global/bin/account.ts
            - packages/infra/global/lib/platform/CostGuardrailsStack.ts
            - .github/workflows/accountDeploy.yml
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    # Never cancelled: an interrupted `cdk deploy` leaves the stack in UPDATE_IN_PROGRESS, which the next run
    # cannot touch.
    group: account-infra
    cancel-in-progress: false

env:
    NODE_VERSION: 24
    DEFAULT_AWS_REGION: ${{ vars.DEFAULT_AWS_REGION }}
    CDK_DEFAULT_REGION: ${{ vars.DEFAULT_AWS_REGION }}
    AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}

jobs:
    deploy:
        name: Deploy the account-scoped infrastructure
        runs-on: ubuntu-latest
        # At most the `prod` role's default one-hour session: a deploy that outlives its session loses its
        # credentials while CloudFormation is still working.
        timeout-minutes: 60
        permissions:
            contents: read
            packages: read # `@radicle-co/infra-shared` authenticates even a public read
            id-token: write # awsAuth: the `prod` role, which trusts only the Production environment on `main`
        # ⛔ A push DEPLOYS only on the default branch; anywhere else it is a registration run and must do
        # nothing. This governs the account's real spend infrastructure, so an edit on a feature branch
        # deploying it would be a production change nobody asked for.
        if: >-
            github.event_name == 'workflow_dispatch' ||
            (github.event_name == 'push' && github.ref == 'refs/heads/main')
        # Bound to `Production`, because this is real spend-governing infrastructure on the live account and
        # that environment carries the required-reviewer rule. ⚠️ NOT a reclamation job — nothing here
        # deletes anything, so gating it is safe (`reclamationNeverGated.test.ts` only forbids the binding on
        # jobs that tear down).
        #
        # ⛔ THE ORDER OF THE ACCOUNT DEPLOY IS KEPT BY THE REVIEWER, NOT BY THIS WORKFLOW (ADR-0065, Decision 11). The
        # CI-role stack is first deployed under `ksaccount` by the owner with administrator credentials
        # (`docs/runbooks/cdkBootstrapQualifiers.md`, section 4), and this workflow is safe to approve only after the
        # production stacks have moved onto `ksprod`: the `ksaccount` boundary denies the default bootstrap roles, so a
        # run before that cuts the old deploy path out from under them. No step below can see that; the preflight only
        # asks whether `ksaccount` exists. `accountDeployGate.test.ts` holds the gate itself (this binding, the `prod`
        # tier, main-or-dispatch), so it cannot be removed without a test saying why it mattered.
        environment: Production
        env:
            COST_ALERT_EMAIL: ${{ vars.COST_ALERT_EMAIL }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm

            - name: Install dependencies
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: npm ci --no-audit --no-fund

            # `npm install`, as every CDK job installs (`infra-package`): this package has no lockfile until
            # `@radicle-co/infra-shared` publishes (see `.gitignore`), and `npm ci` refuses to run without one.
            - name: Install the CDK app's own dependencies
              working-directory: packages/infra/global
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: npm install --no-audit --no-fund

            - name: Sign in to AWS
              uses: ./.github/actions/awsAuth
              with:
                  tier: prod
                  account-id: ${{ vars.AWS_ACCOUNT_ID }}
                  region: ${{ vars.DEFAULT_AWS_REGION }}

            # ⛔ ADR-0065: every stack below deploys through KitchenSink's own CDK bootstrap qualifier. Until the owner has run
            # `docs/runbooks/cdkBootstrapQualifiers.md` that bootstrap does not exist and `cdk deploy` dies at AssumeRole with an
            # error that names neither the qualifier nor the cure. This turns it into one `::error::` that does.
            # `bootstrapPreflightWiring.test.ts` requires it before every `cdk deploy`.
            - name: Check the CDK bootstrap is present for this stage
              run: bash .github/scripts/bootstrapPreflight.sh check "account" "${DEFAULT_AWS_REGION}"

            # ⛔ HOW THESE CREDENTIALS REACH THE ACCOUNT QUALIFIER (ADR-0065). The step above signs in as the `prod` CI
            # role, which only a job bound to the `Production` environment on `main` can become. That role alone holds
            # `sts:AssumeRole` on `cdk-ksaccount-{deploy,file-publishing,lookup}-role-*`, and the `ksaccount` bootstrap
            # roles trust that one principal (`BOOTSTRAP_TRUST`), so the CDK CLI reaches the deploy role the app's
            # synthesizer names with no further workflow step. Branch and non-prod roles can neither assume nor be
            # trusted by it. The CI roles' own stack is in THIS app, so it is also a stack this job could widen: the
            # `ksaccount` execution policy denies editing its own boundary and policies, which the owner deploys by hand.
            # ⚠️ The package's OWN `cdk`/`tsx`, never `npx`: CDK is deliberately outside the npm workspace
            # (ADR-0013), so `npx` would resolve nothing here. `postPruneToolchain.test.ts` asserts it.
            - name: Deploy the account-scoped stacks
              run: packages/infra/global/node_modules/.bin/cdk deploy --app "packages/infra/global/node_modules/.bin/tsx packages/infra/global/bin/account.ts" --no-previous-parameters --all --require-approval never

            # ⛔ The SAME `--app` string, byte for byte. `deployVerificationCoverage.test.ts` asserts that
            # every app a job deploys is verified by that same job, and compares the two strings — a verifier
            # pointed at a stale `--app` checks the wrong thing and stays green, which is the failure this
            # repository keeps paying for.
            - name: Verify the account infra deployment — every resource and handler
              run: |
                  set -euo pipefail
                  bash .github/scripts/verifyDeployment.sh verify "${DEFAULT_AWS_REGION}" \
                    "packages/infra/global/node_modules/.bin/tsx packages/infra/global/bin/account.ts"
