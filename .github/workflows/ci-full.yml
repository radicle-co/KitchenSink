# CI — full pipeline (all jobs, on demand).
#
# The ordinary PR/main pipelines (`ci-pr.yml` / `ci-main.yml`) call `_ci.yml` only — the BASE tier. The two
# heavyweight tiers (the k6 SC-009 load gate and the Maestro mobile-emulator flows) live in `_ci-heavy.yml`
# and are opt-in purely for cost/duration. This workflow is the manual entry point that runs the COMPLETE
# pipeline end to end (T116) by calling BOTH reusable workflows. The two run CONCURRENTLY and independently
# — `heavy` does not `needs: base`, so a lint failure does not cancel a 50-minute emulator run that would
# have told you something different.
#
# Trigger: Actions → "CI — full (all jobs, on demand)" → Run workflow (pick a branch), or
#   `gh workflow run ci-full.yml --ref <branch> [-f run_mobile_maestro=false] [-f run_load_test=false]`.
#
# NOTE (workflow_dispatch): a workflow is only dispatchable once it exists on the repository's DEFAULT
# branch — so this file must be merged to `main` before the "Run workflow" button / `gh workflow run`
# can target it (then you may still select any branch as the ref).
name: CI — full (all jobs, on demand)

on:
    workflow_dispatch:
        inputs:
            stage:
                description: Stage whose secrets to use
                type: choice
                options: [sandbox, prod]
                default: sandbox
            run_load_test:
                description: Run the k6 SC-009 load gate
                type: boolean
                default: true
            run_mobile_maestro:
                description: Run the Maestro mobile-emulator flows
                type: boolean
                default: true

# One full run at a time per ref.
concurrency:
    group: ci-full-${{ github.ref }}
    cancel-in-progress: true

jobs:
    base:
        uses: ./.github/workflows/_ci.yml
        with:
            stage: ${{ inputs.stage }}
        secrets: inherit

    heavy:
        # Skipped entirely when the dispatcher turns both tiers off, rather than starting a job whose
        # only work would be to skip its own two children.
        if: ${{ inputs.run_load_test || inputs.run_mobile_maestro }}
        uses: ./.github/workflows/_ci-heavy.yml
        with:
            stage: ${{ inputs.stage }}
            run_load_test: ${{ inputs.run_load_test }}
            run_mobile_maestro: ${{ inputs.run_mobile_maestro }}
        secrets: inherit
