# CI — full pipeline (all jobs, on demand).
#
# The ordinary PR/main pipelines (`ci-pr.yml` / `ci-main.yml`) call `_ci.yml` only — the BASE tier. The two
# heavyweight tiers (the k6 SC-009 load gate and the Maestro mobile flows) live in `_ci-heavy.yml` and are opt-in
# purely for cost/duration. This workflow is the manual entry point that runs the COMPLETE pipeline end to end
# (T116) by calling BOTH reusable workflows — EXCEPT Maestro: it passes `run_mobile_maestro: false`, because the
# Maestro shards drive a test app that `_mobileAppBuild.yml` builds, and only `_ci.yml` (behind the `mobile-e2e` label)
# and `deployedE2e.yml` (the manual door) have a build job to hand them one. Run Maestro from `deployedE2e.yml`. The two run CONCURRENTLY and independently
# — `heavy` does not `needs: base`, so a lint failure does not cancel a 50-minute emulator run that would
# have told you something different.
#
# Trigger: Actions → "CI — full (all jobs, on demand)" → Run workflow (pick a branch), or
#   `gh workflow run ci-full.yml --ref <branch> [-f run_load_test=false]`.
#
# NOTE (workflow_dispatch): a workflow is only dispatchable once it exists on the repository's DEFAULT
# branch — so this file must be merged to `main` before the "Run workflow" button / `gh workflow run`
# can target it (then you may still select any branch as the ref).
name: CI — full (all jobs, on demand)

on:
    workflow_dispatch:
        inputs:
            stage:
                description: Stage whose secrets to use
                type: choice
                options: [sandbox, prod]
                default: sandbox
            run_load_test:
                description: Run the k6 SC-009 load gate
                type: boolean
                default: true

# Declared rather than inherited — see ci-pr.yml: an absent block takes the repository default token scope,
# which is configured outside this file and can change without a diff here.
permissions:
    contents: read

# One full run at a time per ref.
concurrency:
    group: ci-full-${{ github.ref }}
    cancel-in-progress: true

jobs:
    base:
        uses: ./.github/workflows/_ci.yml
        # `id-token: write` must be granted by the CALLER for `_ci.yml`'s jobs to sign in through `awsAuth` and for
        # its web shards' Argos exchange (a called workflow can only downgrade). Job-scoped, and `contents: read`
        # restated because a job-level block replaces the workflow default.
        permissions:
            contents: read
            id-token: write # awsAuth and Argos in _ci.yml (a callee only downgrades)
            # ⛔ A callee can only downgrade, so omitting this rejects the whole run (`startup_failure`).
            actions: read # mobile-app-build reuses an earlier run's test app artifact
            # ⛔ Same rule, and this caller was MISSED when the constructs started publishing:
            # `_ci.yml`'s `infra-shared` job writes the prerelease to GitHub Packages, and `cdk-checks`,
            # `integration-infra`, `integration-selfcontained` and `deploy-preview` read it back. Without
            # the grant here a hand-dispatched full run is rejected with `startup_failure` — no logs, no
            # failed job, just a status word. `reusableWorkflowPermissions.test.ts` found this one.
            packages: write # zizmor: ignore[use-trusted-publishing]
        with:
            stage: ${{ inputs.stage }}
        # Explicit, not `inherit` — see ci-pr.yml. ⚠️ TRANSITIONAL: the AWS key is passed because `stage: prod` still
        # signs `_ci.yml`'s infra checks in with it (ADR-0063); at `sandbox` it is unused.
        secrets:
            AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            # Forwarded because `_ci.yml`'s queue-guarantee tier reads the cron monitor. Declaring it there
            # without passing it here would leave the reference resolving to an empty string — the tier
            # would skip, and the job would stay green while proving nothing.
            SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

    heavy:
        # Skipped entirely when the dispatcher turns the load gate off, rather than starting a job whose only work
        # would be to skip its own children.
        if: ${{ inputs.run_load_test }}
        uses: ./.github/workflows/_ci-heavy.yml
        # `_ci-heavy.yml`'s jobs sign in to AWS through `awsAuth`, and a called workflow can only downgrade.
        permissions:
            contents: read
            id-token: write # awsAuth in _ci-heavy.yml (a callee only downgrades)
        with:
            stage: ${{ inputs.stage }}
            run_load_test: ${{ inputs.run_load_test }}
            # ⛔ A LITERAL FALSE, not a form field. The Maestro shards need a built test app (`android_test_app` /
            # `ios_test_app`) that this workflow has no job to produce; with the tier on and no app they would REFUSE (red),
            # and with it off they never exist. `workflowInvariants.test.ts` (artifact pairing) clears this call site on
            # exactly that literal, so turning Maestro on here without a build job is a red guard, not a quiet gap.
            run_mobile_maestro: false
