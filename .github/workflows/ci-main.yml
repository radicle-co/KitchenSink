name: CI — main (prod)

# Pushes to main run the shared CI pipeline against the PROD stage (prod secrets).
on:
    push:
        branches: [main]

# Declared rather than inherited — see ci-pr.yml: an absent block takes the repository default token scope,
# which is configured outside this file and can change without a diff here.
permissions:
    contents: read

jobs:
    ci:
        uses: ./.github/workflows/_ci.yml
        # `id-token: write` must be granted by the CALLER for `_ci.yml`'s jobs to sign in through `awsAuth` and for
        # its web shards' Argos exchange (a called workflow can only downgrade). Job-scoped, and `contents: read`
        # restated because a job-level block replaces the workflow default.
        permissions:
            contents: read
            id-token: write # awsAuth and Argos in _ci.yml (a callee only downgrades)
            # ⛔ A callee can only downgrade, so omitting this rejects the whole run (`startup_failure`).
            actions: read # mobile-app-build reuses an earlier run's test app artifact
            # `_ci.yml`'s `infra-shared` job declares `packages: write`, and a called workflow's job may only
            # DOWNGRADE the caller's grant — requesting more is a hard error, so it is granted here even
            # though on main the job publishes nothing (the release is `publishInfraShared.yml`'s job).
            packages: write # zizmor: ignore[use-trusted-publishing]
        with:
            stage: prod
        # Explicit, not `inherit` — see ci-pr.yml. AWS is no secret: `_ci.yml`'s `infra` signs `deployInfra.yml`'s
        # prod-stage checks in on the `prod-read` role (ADR-0063).
        secrets:
            # Forwarded because `_ci.yml`'s queue-guarantee tier reads the cron monitor. Declaring it there
            # without passing it here would leave the reference resolving to an empty string — the tier
            # would skip, and the job would stay green while proving nothing.
            SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
            # Forwarded because the deployed web tier refuses a preview it cannot prove current, and without the token
            # it cannot ask Vercel (`webPreviewCurrencyGate.test.ts` checks this hop).
            VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
