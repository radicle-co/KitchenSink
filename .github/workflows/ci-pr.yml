name: CI — PR (sandbox)

# Pull requests run the shared CI pipeline against the SANDBOX stage (sandbox secrets).
on:
    pull_request:
        branches: [main]

concurrency:
    group: ci-pr-${{ github.ref }}
    cancel-in-progress: true

jobs:
    ci:
        uses: ./.github/workflows/_ci.yml
        with:
            stage: sandbox
            # TEMPORARY (revert once Maestro is green): ci-full.yml can only be workflow_dispatch-ed once on
            # the default branch, so enable the Maestro mobile tier here to iterate it green on the PR.
            run_mobile_maestro: true
        secrets: inherit
