# AI code review.
#
# WHY THIS WAS RECONFIGURED. The previous version ran the stock `code-review` plugin, whose command
# declares (verified in the plugin source at
# `~/.claude/plugins/marketplaces/claude-plugins-official/plugins/code-review/commands/code-review.md`):
#
#   allowed-tools: Bash(gh issue view:*), Bash(gh search:*), Bash(gh issue list:*),
#                  Bash(gh pr comment:*), Bash(gh pr diff:*), Bash(gh pr view:*), Bash(gh pr list:*)
#
# Seven `gh` patterns and nothing else — no Read, no Grep, no Glob. So it could not open
# `docs/architecture/decisions/` even if asked. For a repository whose ten ADRs exist precisely to
# record decisions that LOOK like bugs (a deliberate 404, a NAT instance instead of a Gateway, a
# service with no load balancer of its own, prod/non-prod divergence), a reviewer that can only see
# the diff will confidently recommend reverting them. That is not a hypothetical: correcting the
# same class of false context in AGENTS.md is a sibling commit on this branch.
#
# `pr-review-toolkit` is the swap. Its agents carry NO `tools:` frontmatter (verified across all six),
# so they inherit the default grant including Read/Grep/Glob — which is what makes reading an ADR
# possible at all. Two of its agents map directly onto this repo's worst defect classes:
#
#   - `silent-failure-hunter` — "zero tolerance for silent failures", "any error that occurs without
#     proper logging and user feedback is a critical defect". That is a verbatim description of the
#     bootstrap stub that returned CREATE_COMPLETE for work it never did and ran production for four
#     weeks behind green deploys.
#   - `pr-test-analyzer` — judges BEHAVIOURAL rather than line coverage, which is the right lens.
#     ⚠️ Its stock prompt says it should work "without being overly pedantic about 100% coverage"
#     (verified verbatim in the agent file). That directly contradicts `docs/CODING_STANDARDS.md`
#     §7.1, which is absolute and admits no exceptions. The prompt below overrides it explicitly.
#     If you ever drop that override, this reviewer will start excusing missing tests.
#
# TRIGGERS: deliberately NOT `synchronize`. Firing a full review on every push produced review noise
# nobody read, and noise is how a real finding gets scrolled past. It runs when a PR opens, when it
# becomes ready, when it reopens, and on demand via the `ai-review` label for a re-run after changes.
name: Claude Code Review

on:
    pull_request:
        types: [opened, ready_for_review, reopened, labeled]

permissions:
    contents: read

concurrency:
    # Cancel a superseded review rather than posting two sets of comments on the same PR.
    group: claude-review-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    claude-review:
        name: Review
        # `labeled` fires for EVERY label, so gate it: only the `ai-review` label re-triggers a review.
        # Without this, adding an unrelated label (e.g. `heavy-e2e`) would spend a full review run.
        if: >-
            github.event.action != 'labeled' ||
            github.event.label.name == 'ai-review'
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
            pull-requests: write
            issues: read
            id-token: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  # Depth 1 is sufficient and deliberate: the reviewer needs the ADRs and standards as
                  # FILES at this commit, which a shallow checkout provides in full. It does not need
                  # history, and a full fetch on this repo is not free.
                  fetch-depth: 1

            - name: Run Claude Code Review
              id: claude-review
              uses: anthropics/claude-code-action@v1
              with:
                  claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
                  plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
                  plugins: 'pr-review-toolkit@claude-code-plugins'
                  prompt: |
                      Review pull request #${{ github.event.pull_request.number }} of
                      ${{ github.repository }}.

                      READ THESE BEFORE COMMENTING — they change what counts as a defect here:

                      1. `CLAUDE.md`, section "Deliberate decisions — looks wrong, isn't". Every entry is a
                         choice that resembles a bug and is not one, with a linked ADR.
                      2. The specific ADR under `docs/architecture/decisions/` for any file you are about
                         to criticise. You have Read/Grep/Glob — use them. Do not reason from the diff
                         alone.
                      3. `docs/CODING_STANDARDS.md`, especially §1 (file naming, which differs between
                         backend kebab-case and frontend camel/PascalCase packages) and §7.1 (tests).
                      4. `.github/instructions/*.instructions.md` for the paths the diff touches.

                      HARD RULES FOR THIS REPOSITORY:

                      - NEVER recommend reverting a decision recorded in an ADR without first reading that
                        ADR and engaging with the failure it prevents. If after reading it you still think
                        it is wrong, say so explicitly as a challenge to the ADR — do not present it as an
                        ordinary defect. Recommending an ADR revert unknowingly is the single worst
                        outcome of this job.
                      - The test mandate in §7.1 is ABSOLUTE and has no exceptions. Ignore any instinct to
                        avoid being "pedantic about 100% coverage": UI code needs a component test for
                        EVERY state, not just the happy path; non-UI code needs unit AND integration
                        tests; a deployable service also needs e2e AND k6. Code missing the tests its
                        category requires is INCOMPLETE and must be flagged as such. A test that would
                        still pass if the code were subtly broken is coverage theater and does not count
                        toward the mandate — apply the mutation lens and say when a test fails it.
                      - Weight your attention toward SILENT FAILURE above all else. A fallback that
                        returns success, a swallowed catch, a default substituted for a required input, a
                        `continue-on-error`, a `|| true`, an assertion that cannot fail, a smoke test that
                        proves less than its name claims. This repository has lost four weeks of
                        production to exactly this class.
                      - Lead the review with the DESIGN PATTERNS involved — which are used, introduced or
                        affected, and why they fit — before line-level detail. That is the house style for
                        reviews here, per CLAUDE.md.
                      - Localisation: any string a user reads must go through the localisation path, never
                        a hard-coded literal.

                      Be specific and concrete. Prefer a small number of real findings with evidence over
                      a long list of style observations. If you are uncertain whether something is a
                      defect, say you are uncertain and why, rather than asserting it.
