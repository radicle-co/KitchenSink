# Builds the engineering documentation site on every change, and PUBLISHES it — PUBLICLY — when a change
# reaches `main`.
#
# ══ ⛔ THIS SITE IS PUBLIC. ANYONE WITH THE URL CAN READ EVERY WORD OF IT. ═══════════════════════════
#
# There is no login, no allowlist and no deployment protection in front of it. Treat every page it
# serves as published to the internet, because it is. Two things follow, and they are the whole reason
# this notice is at the top of the file:
#
#   1. **What ships is decided by ONE allowlist** — `CONTENT_SOURCES` in
#      `packages/tools/docs-site/src/content/contentRegistry.ts`. `docs/` also holds working material
#      (reviews, plans, brainstorms, reports, competitive analyses) which is correspondence, not
#      documentation, and is deliberately NOT in it. Widening that allowlist publishes whatever the new
#      glob reaches. Read what you are admitting before you admit it.
#   2. **The AWS account id must not appear in the corpus at all**, and that is CHECKED rather than
#      trusted — by `Assert the built site carries no AWS account id` below (which gates the artifact, on
#      pull requests too) and by `packages/infra/global/__tests__/assertNoAwsAccountIds.test.ts` over
#      `docs/` in the ordinary test tier. Both run `scripts/assertNoAwsAccountIds.mjs`, which DISCOVERS
#      the ids from the repository's own ARNs rather than hardcoding one, so the guard never restates the
#      value it exists to keep out of print. If either goes red, scrub the document — do not weaken the
#      guard.
#
# ⚠️ **WHY IT IS PUBLIC, so nobody spends another day trying to make it private.** This workflow was
# originally built to publish behind Vercel Authentication scoped to All Deployments, and refused to
# deploy unless the API reported `ssoProtection.deploymentType == "all"`. That protection is **not
# available on this team's Vercel plan, and it fails OPEN rather than loudly**: measured 2026-09-02 — the
# API ACCEPTS the `ssoProtection` setting and then does not enforce it, and a real preview deployment
# served real content to an anonymous request (the deployment was deleted immediately). A configuration
# assertion against an API that lies is worse than no assertion, because it reports a guarantee nobody
# holds. So the owner ruled: publish publicly, and move the control from "nobody can read it" to "there
# is nothing in it worth reading". ⛔ Do not re-add an `ssoProtection` gate on the strength of the API
# accepting the setting; that is exactly what was already tried.
#
# ══ WHAT THE OWNER MUST CREATE BY HAND (this workflow cannot create any of it) ══════════════════════
#
# 1. A NEW Vercel project on the `Radicle` team, separate from the web app's. Do NOT connect it to a
#    Git repository: a repo-connected project builds on every push to KitchenSink, which is precisely
#    the per-pull-request cost this workflow is shaped to avoid. Framework preset "Other"; no build
#    command and no root directory are needed, because the deploy below is `--prebuilt` and Vercel
#    never builds anything.
# 2. ⛔ NO custom domain on this project, and NO Route 53 record pointing at it. The reason is no longer
#    protection-related — nothing is protected — but it still holds, twice over: a Vercel *branch domain*
#    (`gitBranch`) was MEASURED in ADR-0001 item 2 to resolve to the wrong deployment, and the site
#    simply does not need a second address. One project-generated `<name>.vercel.app` is the whole
#    surface, and `Assert the docs project has no second address` below fails if any non-`.vercel.app`
#    domain appears on the project. `docsSiteDeployGuards.test.ts` fails if this workflow ever grows a
#    step that would attach one.
# 3. A GitHub Environment named `Docs`, with no protection rules required. (A reviewer or branch
#    policy here is harmless if wanted — unlike `Sandbox`, nothing in this workflow reclaims a
#    resource, so a stalled run leaks nothing. See zizmor.yml's Environments burn-down.)
# 4. Repository VARIABLES (Settings → Secrets and variables → Actions → Variables):
#      • DOCS_VERCEL_PROJECT_ID — the NEW project's id (`prj_…`). ⛔ Never reuse `VERCEL_PROJECT_ID`;
#        that one is the web app, and publishing this corpus into it would put the documentation behind
#        the product's own preview domains and give the product's project a second content source.
#      • DOCS_SITE_URL          — the project's production URL, e.g. `https://commise-docs.vercel.app`.
#                                 Used for the site's canonical/OG/sitemap `url`, and probed below.
#      • VERCEL_TEAM_ID         — ALREADY EXISTS (shared with sandbox-web-preview.yml).
#    Repository SECRET:
#      • VERCEL_TOKEN           — ALREADY EXISTS. A team-scoped account token, not a project one.
#
# If any of these is missing the deploy FAILS and names it. Nothing here degrades to a skip: a deploy
# step that no-ops when unconfigured is the "check whose signal reached no one" failure this
# repository has spent months removing.
#
# ══ WHEN IT DEPLOYS, AND WHY NOT MORE OFTEN ═════════════════════════════════════════════════════════
#
# `push` to `main`, plus `workflow_dispatch`. Deliberately NOT on pull requests. A documentation site
# has one reader-facing version, so a per-PR deployment would buy a preview nobody asked for and
# charge every unrelated pull request an outward action against a third party — and, now that the site
# is public, would multiply the number of world-readable copies of the corpus. Pull requests still
# BUILD, and the build is where both content gates live (`onBrokenLinks: 'throw'` and the account-id
# scan), so a pull request that would publish an account id is red BEFORE it can be merged.
#
# ⚠️ `workflow_dispatch` only appears in the Actions UI once this file exists on the DEFAULT branch,
# so until this lands on `main` there is no way to run the deploy at all — which is also why the
# post-deploy probe below has never executed against a real deployment. It is wired to run on the first
# one, and it fails the job rather than reporting anything on faith.
#
# ══ WHY THE VERCEL CLI, AND WHY THE DEPLOY JOB HAS NO CHECKOUT ══════════════════════════════════════
#
# `sandbox-web-preview.yml` deploys the web app through the REST API with a note saying `vercel deploy`
# was MEASURED to be blocked (`readyStateReason: "Git author <email> must have access to the team
# Radicle on Vercel to create deployments"`, `seatBlock.blockCode = TEAM_ACCESS_REQUIRED`). That block
# keys on the GIT AUTHOR, which the CLI reads from the `.git` directory in its working directory — so
# the deploy job here performs NO checkout and runs in a directory that is not a repository, carrying
# no git metadata for the seat check to reject. The REST alternative is worse for this case: it takes a
# `gitSource`, which needs the project connected to the repository, which is the per-push build this
# workflow exists to avoid.
# ⛔ Do NOT "helpfully" add a checkout step to the deploy job. It would re-attach the git author, and
# nothing in that job needs the repository — the site arrives as an artifact and the Vercel CLI comes
# from npm.
# ⚠️ That absence is also why the account-id scan runs in the BUILD job and not here: the scan DERIVES
# the ids it looks for from the repository's own tracked sources, and this job has no repository. The
# bytes are the same bytes either way — the artifact is uploaded from the directory the scan passed,
# with `if-no-files-found: error`, and downloaded straight into the deploy directory — so re-scanning
# here would buy nothing except a second, weaker copy of the rule that would have to hardcode the id.
# ⚠️ UNVERIFIED: no deploy has run, so the claim that a git-less CLI deploy escapes the seat block is
# reasoned from the measured error message, not observed. If it is wrong, the failure is loud (the CLI
# exits non-zero) and the fix is to give the deploying identity a team seat.
#
# The site is deployed as a Build Output API v3 directory (`.vercel/output/static` + a `{"version":3}`
# config), assembled from the artifact the `build` job already proved. Vercel therefore runs no build
# of its own, and the bytes that ship are byte-for-byte the bytes both build gates passed.
#
# ══ WHY THIS IS A SEPARATE WORKFLOW, AND WHY IT IS PATH-FILTERED ════════════════════════════════════
#
# The site pulls in Docusaurus, which is ~1,100 packages, and a full build takes ~15s on top of a cold
# `npm ci`. Wiring it into `_ci.yml` would spend that on every pull request, including the ones that
# touch neither the documentation nor the site. So it is its own workflow, gated on the paths that can
# actually break it, and its build script is deliberately named `docs:build` rather than `build` — the
# name keeps it out of `turbo run build`, so `npm run build` at the repo root is exactly as fast as it
# was before this package existed.
#
# ⚠️ RESIDUAL RISK, stated rather than hidden: the site's Markdown may link into `specs/` or
# `.specify/`, and those paths are NOT in the filter below (they change on nearly every pull request,
# and including them would defeat the whole point of the filter). Deleting a file that a published
# ADR links to therefore fails this workflow on the NEXT run that touches a filtered path, not on the
# pull request that deleted it.
#
# ⚠️ RESIDUAL RISK, second: the account-id scan under `docs/` runs on the ORDINARY test tier, whose CI
# job is not path-filtered — but this workflow's copy of it is, so a change that adds an account id to
# `docs/generated/**` through a generator living outside the filter is caught by the test tier rather
# than here. Both gates exist precisely so neither has to be the only one.
#
# What the build proves, beyond "webpack finished":
#   * `onBrokenLinks: 'throw'` — a documentation link that resolves to nothing fails here rather than
#     serving a 404 nobody sees.
#   * `contentRegistry.test.ts` (run by `_ci.yml`, not here) — every declared content source still
#     reaches real files, so a renamed directory cannot silently shrink the site.
#   * The section check below — the build emitted the routes the registry declares, so a build that
#     succeeds while mounting nothing is still a failure.
#   * The account-id scan below — the RENDERED bytes, not just the sources, carry no AWS account id.
#     Rendering is the right place for it: a generated section, a plugin's metadata or a copied asset
#     reaches the published output by a route a source-only scan does not model.

name: Docs site

on:
    push:
        branches: [main]
        paths:
            - 'docs/**'
            - 'packages/tools/docs-site/**'
            - 'package-lock.json'
            - '.github/workflows/docs.yml'
    pull_request:
        branches: [main]
        paths:
            - 'docs/**'
            - 'packages/tools/docs-site/**'
            - 'package-lock.json'
            - '.github/workflows/docs.yml'
    workflow_dispatch:

# Declared rather than inherited: with no `permissions:` block a workflow gets the repository's
# DEFAULT token scope, which is set OUTSIDE this file, so the pipeline's privilege could change
# without a diff here. Nothing in this workflow writes to the repository — the publish goes to Vercel
# and is authorised by a Vercel token, not by `GITHUB_TOKEN`.
permissions:
    contents: read # read the checkout being built

concurrency:
    # Keyed on the ref, so two pushes to `main` cannot race each other into the same Vercel project and
    # leave the older build aliased as production.
    group: docs-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    # ⛔ EXACTLY pinned, like zizmor's own installer and for the same reason: a floating range on the
    # tool that performs an outward publish lets an upstream release change what this workflow does
    # with no repository change to point at.
    VERCEL_CLI_VERSION: '59.11.2'

jobs:
    build:
        name: Build the documentation site
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read # checkout of the tree being built
        steps:
            - name: Check the deployment identity is configured
              # FIRST, and before `npm ci`, on every event that can deploy. `DOCS_SITE_URL` is baked
              # into the artifact as the site's canonical URL, so discovering it is missing in the
              # deploy job would mean shipping pages that name `example.invalid`. On a pull request
              # this is skipped and the placeholder is correct.
              if: github.event_name != 'pull_request'
              env:
                  DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL }}
              run: |
                  set -euo pipefail
                  if [ -z "${DOCS_SITE_URL}" ]; then
                    echo "::error title=DOCS_SITE_URL is not set::This run can deploy, so the site must be built with its real canonical URL. Add a repository VARIABLE named DOCS_SITE_URL (e.g. https://commise-docs.vercel.app) — see the header of .github/workflows/docs.yml."
                    exit 1
                  fi
                  echo "building for ${DOCS_SITE_URL}"

            - name: Checkout repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  # The job never pushes; leaving the token in `.git/config` would only widen what a
                  # later step (or a compromised dependency) could reach.
                  persist-credentials: false

            - name: Set up Node
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build the documentation site
              env:
                  DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL }}
              run: npm run docs:build --workspace=@kitchensink/docs-site

            - name: Check every declared section was emitted
              # A green webpack run is not the same as a site with pages in it: a mis-resolved content
              # path yields a section with a navbar entry and no routes, and Docusaurus does not treat
              # that as an error. `-e` is on by default for `run:` steps, and no status here is
              # suppressed, so any missing section fails the job.
              run: |
                  set -euo pipefail
                  cd packages/tools/docs-site/build
                  for section in handbook infrastructure components design; do
                      if [ ! -f "${section}/index.html" ] && [ -z "$(find "${section}" -name index.html -print -quit 2>/dev/null)" ]; then
                          echo "::error::the site built but emitted no pages under /${section}"
                          exit 1
                      fi
                  done
                  echo "every declared section emitted at least one page"

            - name: Assert the built site carries no AWS account id
              # ⛔ THE CONTROL THAT REPLACED DEPLOYMENT PROTECTION, and the reason this step has no
              # `if:` — it runs on pull requests too, so a document that would publish an account id is
              # red before it can be merged rather than after it is already served.
              #
              # It gates the ARTIFACT: nothing downstream can publish bytes this step did not pass,
              # because the upload below is the only producer of what the deploy job consumes.
              #
              # The script DERIVES the ids from the repository's own ARNs instead of naming one — see
              # its header, and `packages/infra/global/__tests__/assertNoAwsAccountIds.test.ts` for the
              # non-vacuity argument. It fails closed: no derived id, a missing directory, or a walk
              # that reached no files are all failures, not passes.
              run: node scripts/assertNoAwsAccountIds.mjs packages/tools/docs-site/build

            - name: Upload the built site
              # Only on the events that can deploy. The artifact exists so the DEPLOYED bytes are the
              # bytes the two checks above passed — rebuilding in the deploy job would publish a
              # second, unverified build of the same commit.
              if: github.event_name != 'pull_request'
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: docs-site
                  path: packages/tools/docs-site/build
                  retention-days: 1
                  if-no-files-found: error

    deploy:
        name: Publish the documentation site (public)
        needs: build
        # Pull requests build and stop. Everything else — `main` and a hand-dispatched run — publishes.
        if: github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        # Binds the Vercel token to a named deployment target, the way every other deploying job in
        # this repository does (zizmor.yml's Environments burn-down). It also gives the docs site its
        # own deployment history rather than burying it in `Sandbox`.
        environment: Docs
        permissions:
            contents: read # this job checks nothing out; the minimum grant, declared so nothing wider is inherited
        steps:
            - name: Check the Vercel credentials are configured
              env:
                  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
                  VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
                  DOCS_VERCEL_PROJECT_ID: ${{ vars.DOCS_VERCEL_PROJECT_ID }}
                  DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL }}
                  WEB_VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
              run: |
                  set -euo pipefail
                  missing=''
                  [ -n "${VERCEL_TOKEN}" ]           || missing="${missing} secrets.VERCEL_TOKEN"
                  [ -n "${VERCEL_TEAM_ID}" ]         || missing="${missing} vars.VERCEL_TEAM_ID"
                  [ -n "${DOCS_VERCEL_PROJECT_ID}" ] || missing="${missing} vars.DOCS_VERCEL_PROJECT_ID"
                  [ -n "${DOCS_SITE_URL}" ]          || missing="${missing} vars.DOCS_SITE_URL"
                  if [ -n "${missing}" ]; then
                    echo "::error title=Docs deploy is not configured::Missing:${missing}. See the header of .github/workflows/docs.yml for exactly what to create in Vercel and GitHub. This job fails rather than skipping, on purpose."
                    exit 1
                  fi
                  # ⛔ The docs corpus must never be published into the web app's project. That project
                  # carries the product's own domains and its own deployment history; a second content
                  # source inside it would put the documentation on the product's addresses and make
                  # every product deploy and every docs deploy share one alias.
                  if [ -n "${WEB_VERCEL_PROJECT_ID}" ] && [ "${DOCS_VERCEL_PROJECT_ID}" = "${WEB_VERCEL_PROJECT_ID}" ]; then
                    echo "::error title=DOCS_VERCEL_PROJECT_ID is the web app's project::These must be two different Vercel projects. The web app's project carries the product's custom domains; the docs site must not be served from them."
                    exit 1
                  fi
                  echo "docs deploy is configured"

            - name: Assert the docs project has no second address
              # The site is public, so this is no longer about protection — it is about ADDRESSING, and
              # it survived the ruling for two independent reasons:
              #
              #   • ADR-0001 item 2 MEASURED that a Vercel branch domain (`gitBranch`) resolves to the
              #     WRONG deployment, so a second address here would sometimes serve a stale corpus
              #     while the probe below reported the fresh one healthy.
              #   • Nothing needs one. `DOCS_SITE_URL` is the project's generated `<name>.vercel.app`,
              #     it is stable across deploys, and every extra name is another thing to reclaim (see
              #     ADR-0005/#94 on why a preview's address is CI's job precisely because
              #     CloudFormation owns neither half of it).
              #
              # This asserts the project's CURRENT state; `docsSiteDeployGuards.test.ts` asserts that
              # this workflow never grows a step that would ATTACH one. Two different failure modes.
              env:
                  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
                  VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
                  DOCS_VERCEL_PROJECT_ID: ${{ vars.DOCS_VERCEL_PROJECT_ID }}
              run: |
                  set -euo pipefail
                  project=$(curl --silent --show-error --fail-with-body \
                    --header "Authorization: Bearer ${VERCEL_TOKEN}" \
                    "https://api.vercel.com/v9/projects/${DOCS_VERCEL_PROJECT_ID}?teamId=${VERCEL_TEAM_ID}")

                  custom=$(printf '%s' "${project}" | jq -r '[.alias[]?.domain | select(endswith(".vercel.app") | not)] | join(", ")')
                  if [ -n "${custom}" ]; then
                    echo "::error title=Docs project has a second address::Found: ${custom}. The ruling is ONE generated *.vercel.app address for this project — no custom domain, no branch domain, no Route 53 record (ADR-0001 item 2 measured a branch domain resolving to the wrong deployment). Remove it, or reopen the ruling."
                    exit 1
                  fi

                  echo "project has exactly its generated *.vercel.app address"

            - name: Set up Node
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  # No `cache: npm` — this job has no checkout and therefore no lockfile to key on.
                  node-version: 24

            - name: Download the built site
              uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
              with:
                  name: docs-site
                  path: .vercel/output/static

            - name: Assemble the Build Output API directory
              # https://vercel.com/docs/build-output-api — `{"version": 3}` is the whole required
              # config for a purely static deployment, and `static/` is served as-is. Assembling it
              # here rather than running `vercel build` is what keeps Vercel from building anything:
              # there is no framework to detect, no root directory to configure and no second
              # `npm ci` inside somebody else's builder.
              env:
                  VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
                  DOCS_VERCEL_PROJECT_ID: ${{ vars.DOCS_VERCEL_PROJECT_ID }}
              run: |
                  set -euo pipefail
                  printf '{"version":3}\n' > .vercel/output/config.json
                  # `.vercel/project.json` is the documented link file (Vercel CLI project linking);
                  # writing it is how a CI runner adopts an existing project without an interactive
                  # `vercel link`.
                  jq -nc --arg project "${DOCS_VERCEL_PROJECT_ID}" --arg org "${VERCEL_TEAM_ID}" \
                    '{projectId: $project, orgId: $org}' > .vercel/project.json
                  echo "assembled $(find .vercel/output/static -type f | wc -l) files"

            - name: Deploy to Vercel
              id: deploy
              # `--prod` so the site has ONE stable address readers can bookmark, instead of a new
              # preview URL per push.
              env:
                  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
              run: |
                  set -euo pipefail
                  # `npx`, not a global `npm install` — the latter is what zizmor's `adhoc-packages`
                  # audit flags, and the gate runs at the pedantic persona with no severity floor.
                  # Vercel documents stdout as "always the Deployment URL", but this step's whole
                  # output is the probe's input, so the URL is EXTRACTED rather than trusted: anything
                  # the tool ever decides to print alongside it must not become the address that gets
                  # checked.
                  output=$(npx --yes "vercel@${VERCEL_CLI_VERSION}" deploy --prebuilt --prod --yes --token "${VERCEL_TOKEN}")
                  url=''
                  if ! url=$(printf '%s\n' "${output}" | grep -oE '^https://[A-Za-z0-9.-]+$' | tail -1); then
                    url=''
                  fi
                  if [ -z "${url}" ]; then
                    echo "::error title=Vercel deploy produced no URL::The CLI exited 0 but printed no deployment address. Treating this as a failure rather than probing an empty one. Raw output: ${output}"
                    exit 1
                  fi
                  echo "deployment_url=${url}" >> "${GITHUB_OUTPUT}"
                  echo "deployed ${url}"

            - name: Verify the deployment reached READY
              # ⛔ THE POST-DEPLOY GATE, and it deliberately does NOT make an HTTP request.
              #
              # It used to probe every published address for a `200` carrying Docusaurus's generator
              # tag. That assertion encoded a decision that has since been reversed twice in one day:
              # the site was private, then public, then private again. Each flip made the probe assert
              # the opposite of the truth, and a gate that must be rewritten whenever an unrelated
              # setting changes is a gate that will eventually be rewritten wrongly — or deleted.
              #
              # ⚠️ Worse, the HTTP probe could not tell the two states apart honestly. With protection
              # ON, Vercel answers `302` to `vercel.com/sso-api`, and FOLLOWING that redirect lands on
              # a `200` login page whose body echoes the requested path back — so a naive
              # "did I get my page?" check can match its own route in the login page's markup and
              # report success. That false positive was observed while verifying this very site.
              #
              # So the question is narrowed to the one this job is actually responsible for: DID THE
              # DEPLOYMENT LAND? Vercel's own API answers that, and its answer is indifferent to
              # deployment protection, custom domains, and who is allowed to read the site.
              # `readyState` must be `READY`; `ERROR`, `CANCELED`, `BUILDING` and `QUEUED` all fail,
              # and so does an unparseable response — a gate that cannot read its answer has not got one.
              #
              # ⛔ WHAT THIS NO LONGER CATCHES, stated rather than hidden: a deployment that is READY
              # and serves a broken page. That risk is carried by `docs:build` (which fails the whole
              # workflow on a broken link, `onBrokenLinks: 'throw'`) and by the account-id scan over
              # the built artifact, both of which run BEFORE anything is uploaded. Reachability is a
              # property of the protection setting, which is an owner decision, not a CI invariant.
              env:
                  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
                  VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
                  DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
              run: |
                  set -euo pipefail

                  host="${DEPLOYMENT_URL#https://}"
                  response=$(curl --silent --show-error --fail-with-body \
                    --header "Authorization: Bearer ${VERCEL_TOKEN}" \
                    "https://api.vercel.com/v13/deployments/${host}?teamId=${VERCEL_TEAM_ID}")

                  state=$(printf '%s' "${response}" | jq -r '.readyState // empty')

                  if [ -z "${state}" ]; then
                    echo "::error title=Vercel did not report a deployment state::Asked for ${host} and got no readyState back. Refusing to call this a successful deploy on an answer this job could not read."
                    exit 1
                  fi

                  if [ "${state}" != "READY" ]; then
                    echo "::error title=The documentation deployment did not land::${host} is in state ${state}, not READY. The site was uploaded but is not being served from this deployment."
                    exit 1
                  fi

                  echo "deployment ${host} is READY"
