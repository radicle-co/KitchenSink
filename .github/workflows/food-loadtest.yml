# Manually-triggered food-API load test (k6). Runs the packages/tools/loadtest harness against a deployed
# food preview: provisions a distinct-user pool + an admin observer, runs the k6 journey while sampling
# server-side metrics, produces a capacity/degradation report, and tears down every test user.
#
# Trigger: Actions → "Food API load test" → Run workflow (or `gh workflow run food-loadtest.yml`).
# Needs the same repo AWS credentials the deploy workflows use (to read the Clerk secret + CloudWatch).
name: Food API load test (deployed origin — manual only)

on:
    workflow_dispatch:
        inputs:
            # ⛔ A STAGE, NOT A URL. This input WAS `target_url`, defaulting to a typed
            # `food-pr-59` host — a name that stopped resolving the day PR 59 closed, whose failure mode is
            # a run reporting the target as down rather than the default as stale. The host shape now comes
            # from `publicServiceOriginForStage` (ADR-0003 / ADR-0006), the same authority the deploy
            # pipelines use, so this input names the thing a human actually knows.
            target_stage:
                description: 'Deploy stage to hit — sandbox, prod, or pr-{N}'
                required: true
                default: 'sandbox'
            base_stage:
                description: 'Clerk instance / secret stage (sandbox or prod)'
                required: true
                default: 'sandbox'
            baseline_rate:
                description: 'Baseline arrival rate (req/s)'
                required: true
                default: '1'
            hold_rate:
                description: 'Hold-at-target rate (req/s) — the "supported rate" being validated'
                required: true
                default: '2'
            ramp_rate:
                description: 'Over-ramp peak rate (req/s) — pushes past hold to find saturation'
                required: true
                default: '3'
            hold_duration:
                description: 'Hold phase duration (k6 duration, e.g. 1m, 2m30s)'
                required: true
                default: '1m'
            ramp_duration:
                description: 'Ramp phase duration'
                required: true
                default: '1m'
            # Also sizes the distinct-user pool. GitHub allows a workflow AT MOST 10 workflow_dispatch
            # inputs, and this workflow had 11 — so "Run workflow" could be rejected outright. `pool_size`
            # was the one to fold in: its only documented constraint was `pool_size >= max_vus`, so
            # deriving it AS max_vus satisfies that by construction and removes a real footgun (a dispatch
            # with pool_size < max_vus would have reused users across VUs and skewed the run).
            max_vus:
                description: 'Max VUs (also the distinct-user pool size) — must cover ramp_rate x max-iteration-duration'
                required: true
                default: '100'
            poll_timeout_s:
                description: 'Max seconds to poll an add to a terminal state'
                required: true
                default: '20'
            keep_users:
                description: 'Skip teardown (leave the test users) — for debugging'
                type: boolean
                default: false

permissions:
    contents: read # checkout only — the AWS/Clerk work uses repo secrets, not the GITHUB_TOKEN

# A load test provisions a distinct-user pool against a SHARED Clerk instance and then tears it down, so
# two concurrent runs would race each other's users and skew both reports. `cancel-in-progress: false`
# because killing a run mid-flight is what LEAKS those users (teardown never executes) — queue instead.
concurrency:
    group: food-loadtest-${{ github.event.inputs.base_stage }}
    cancel-in-progress: false

env:
    NODE_VERSION: 24
    DEFAULT_AWS_REGION: ${{ vars.DEFAULT_AWS_REGION }}
    DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}

jobs:
    loadtest:
        # ⛔ A CONSTANT — the target stage is reported in the job summary, never in the check name.
        # Pinned by workflowInvariants' invariant 8.
        name: Run k6 food-API journey (deployed origin)
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false

            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Install dependencies
              run: npm ci

            - name: Install k6 (into the loadtest package)
              run: npm run k6:install --workspace=@kitchensink/loadtest

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ env.DEFAULT_AWS_REGION }}

            # ⛔ THE HOST SHAPE IS RESOLVED, NEVER TYPED — see the `target_stage` note above.
            - name: Build the workspace package the origin resolver imports
              run: npx turbo run build --filter=@kitchensink/infra-alb
            - name: Resolve the food origin for this stage
              id: origin
              env:
                  TARGET_STAGE: ${{ inputs.target_stage }}
              run: |
                  set -euo pipefail
                  url=$(node packages/tools/loadtest/printPublicOrigin.mjs food "${TARGET_STAGE}" "${DOMAIN_NAME}")
                  echo "url=${url}" >>"$GITHUB_OUTPUT"
                  echo "food load-test target: ${url}"
            - name: Resolve Clerk config (secret, FAPI, azp)
              id: clerk
              env:
                  STAGE: ${{ inputs.base_stage }}
              run: |
                  set -euo pipefail
                  SECRET=$(aws secretsmanager get-secret-value --region "$DEFAULT_AWS_REGION" \
                      --secret-id "kitchensink/${STAGE}/identity/keys" --query SecretString --output text)
                  SK=$(printf '%s' "$SECRET" | python3 -c "import sys,json;print(json.load(sys.stdin)['SECRET_KEY'])")
                  PK=$(printf '%s' "$SECRET" | python3 -c "import sys,json;print(json.load(sys.stdin)['PUBLISHABLE_KEY'])")
                  # FAPI host is base64-encoded in the publishable key (pk_{test,live}_<base64(host$)>).
                  # Strip whichever prefix is present so base_stage=prod (pk_live_…) works too.
                  PK_B64=${PK#pk_test_}; PK_B64=${PK_B64#pk_live_}
                  FAPI_HOST=$(printf '%s' "$PK_B64" | python3 -c "import sys,base64;print(base64.b64decode(sys.stdin.read().strip()+'==').decode().rstrip('$'))")
                  # azp the minted tokens must carry = the first configured authorized party.
                  AZP=$(aws ssm get-parameter --region "$DEFAULT_AWS_REGION" \
                      --name "/kitchensink/${STAGE}/clerk/authorized-parties" --query Parameter.Value --output text | cut -d, -f1 | tr -d '[:space:]')
                  echo "::add-mask::$SK"
                  echo "sk=$SK" >> "$GITHUB_OUTPUT"
                  echo "fapi=https://${FAPI_HOST}" >> "$GITHUB_OUTPUT"
                  echo "origin=${AZP}" >> "$GITHUB_OUTPUT"
                  echo "Resolved FAPI=https://${FAPI_HOST}  azp=${AZP}"

            - name: Run load test
              env:
                  CLERK_SECRET_KEY: ${{ steps.clerk.outputs.sk }}
                  FAPI: ${{ steps.clerk.outputs.fapi }}
                  ORIGIN: ${{ steps.clerk.outputs.origin }}
                  FOOD_BASE_URL: ${{ steps.origin.outputs.url }}
                  # One distinct user per VU — see the max_vus input note (pool_size was folded in to stay
                  # inside GitHub's 10-input workflow_dispatch limit). This is exactly the harness's own
                  # default: run.mjs resolves `POOL_SIZE ?? MAX_VUS ?? 100`.
                  POOL_SIZE: ${{ inputs.max_vus }}
                  MAX_VUS: ${{ inputs.max_vus }}
                  BASELINE_RATE: ${{ inputs.baseline_rate }}
                  HOLD_RATE: ${{ inputs.hold_rate }}
                  RAMP_RATE: ${{ inputs.ramp_rate }}
                  HOLD_DURATION: ${{ inputs.hold_duration }}
                  RAMP_DURATION: ${{ inputs.ramp_duration }}
                  POLL_TIMEOUT_S: ${{ inputs.poll_timeout_s }}
                  KEEP: ${{ inputs.keep_users && '1' || '0' }}
                  REGION: ${{ env.DEFAULT_AWS_REGION }}
              # `npm run -w` sets cwd to the package, so run.mjs writes report/series there (OUT_DIR=.).
              run: npm run loadtest --workspace=@kitchensink/loadtest

            - name: Publish report to job summary
              if: always()
              working-directory: packages/tools/loadtest
              run: |
                  if [ -f report.md ]; then cat report.md >> "$GITHUB_STEP_SUMMARY"; else echo "No report produced." >> "$GITHUB_STEP_SUMMARY"; fi

            - name: Upload artifacts
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: food-loadtest-results
                  path: |
                      packages/tools/loadtest/report.md
                      packages/tools/loadtest/k6-summary.json
                      packages/tools/loadtest/server-metrics.json
                  if-no-files-found: warn
