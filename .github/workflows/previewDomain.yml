name: Preview Domain (reusable)

# Give one PR's web preview its public hostname, `pr-{N}.sandbox.<domain>` (ADR-0001, ADR-0033, issue #94).
#
# ⚠️  DELIBERATE — the exact MIRROR of the teardown's preview-domain section (`teardownSandboxPr.sh` §0,
#     `scripts/teardownPreviewDomain.ts`), and it must stay that way.
#
# EXTRACTED from `sandbox-deploy.yml`'s `preview-domain` job (ADR-0060), which the owner has disabled: Sandbox Up
# calls this, so the address is published by the one button that starts a sandbox and depends on no disabled
# workflow. The job's contents are unchanged.
#
# A preview is reachable only when THREE records outside CloudFormation agree: a Vercel project-domain binding
# claiming `pr-{N}.sandbox.<domain>`, a Route 53 `CNAME → cname.vercel-dns.com`, and a per-deployment ALIAS. Three
# things are load-bearing and must not be "simplified" (all three are in
# `packages/apps/commise/web/scripts/createPreviewDomain.ts`, with the reasoning and the tests):
#   • the Vercel claim happens BEFORE the Route 53 write — DNS resolving to Vercel for a name nobody claims is a
#     subdomain-takeover window, so an interrupted run may only leave the safe half-state;
#   • the ALIAS happens LAST and is retried — Vercel refuses it with `400 cert_missing` until a cert exists, and
#     refuses the cert until the name already resolves to Vercel (`449`), both measured;
#   • the DNS scope is exact first-label equality, so the apex, the `*.sandbox` wildcard and the shared
#     `identity.sandbox.<domain>` host can never be written.
# Do NOT swap it for a Vercel *branch domain* (`gitBranch`): ADR-0001 measured that this re-enables deployment
# protection (302 → vercel.com/sso-api), and clearing it falls back to PRODUCTION.
on:
    workflow_call:
        inputs:
            stage:
                description: The PR's preview stage, `pr-{N}`. A named stage owns no preview address.
                required: true
                type: string
            commit_sha:
                description: >-
                    The full head sha of the PR commit the address must serve. When set, the deployment is CHOSEN by
                    that commit (and waited for until READY); when empty, the by-hand door's branch lookup is used.
                required: false
                type: string
                default: ''
        # AWS is reached through `awsAuth`, so no AWS secret is passed in; a caller grants `id-token: write`.
        secrets:
            VERCEL_TOKEN:
                required: true

permissions:
    contents: read

jobs:
    preview-domain:
        name: Publish sandbox preview address
        runs-on: ubuntu-latest
        timeout-minutes: 30
        # Constrained to a `pr-{N}` stage: a named stage owns no per-PR preview address, and
        # `previewDomainScope.ts` refuses it anyway.
        if: startsWith(inputs.stage, 'pr-')
        # ⛔ Two pushes in quick succession start two of these. Serialised, never cancelled: a cancel could land
        # between the claim and the alias, and an unserialised pair could finish out of order and leave the address
        # on the OLDER commit. GitHub keeps one pending run per group and drops the older pending one, so the
        # newest push always runs last.
        concurrency:
            group: preview-address-${{ inputs.stage }}
            cancel-in-progress: false
        # Signs in to AWS and reads the Vercel token. Bound to `Sandbox`, which keeps ZERO protection rules: the
        # binding makes the deploy target explicit, and a required reviewer would stall every Sandbox Up.
        environment: Sandbox
        permissions:
            contents: read
            id-token: write # awsAuth: the non-prod role (it writes only pr-*.sandbox CNAMEs)
        env:
            PR: ${{ inputs.stage }}
            REGION: ${{ vars.DEFAULT_AWS_REGION }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            # The creation step runs `npx tsx …/createPreviewDomain.ts`.
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - name: Sign in to AWS
              id: aws
              uses: ./.github/actions/awsAuth
              with:
                  tier: nonprod
                  account-id: ${{ vars.AWS_ACCOUNT_ID }}
                  region: ${{ vars.DEFAULT_AWS_REGION }}
            # Resolved from the CloudFormation export rather than a repo variable, exactly as the PR-close
            # cleanup does — one source of truth for the zone both halves of the lifecycle write to.
            - name: Resolve the sandbox hosted zone
              id: zone
              run: |
                  set -euo pipefail
                  # Resolved through the shared helper: ListExports PAGES, and `--query` is applied per page,
                  # so the inline form returns "VALUE\nNone" or "None\nVALUE" depending on which page holds
                  # the export. See .github/scripts/cfnExport.sh.
                  ZONE=$(bash .github/scripts/cfnExport.sh 'kitchensink-domain-sandbox:HostedZoneId' "$REGION")
                  if [ -z "$ZONE" ] || [ "$ZONE" = "None" ]; then
                    echo "::error::CloudFormation export 'kitchensink-domain-sandbox:HostedZoneId' not found — the preview DNS record cannot be created"
                    exit 1
                  fi
                  echo "hosted_zone_id=$ZONE" >> "$GITHUB_OUTPUT"
            # The deployment the hostname must serve, for the by-hand door only (no commit named). A pull request
            # run passes `commit_sha` and the script below chooses the deployment BY THAT COMMIT: this action looks
            # a deployment up by branch, which in the window between a push and its build names the previous build.
            - name: Wait for this PR's Vercel preview deployment
              id: preview
              if: ${{ inputs.commit_sha == '' }}
              uses: zentered/vercel-preview-url@fba568fc6d882ae788a9724d7e28dee618728771 # v1.4.0
              env:
                  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
              with:
                  vercel_team_id: ${{ vars.VERCEL_TEAM_ID }}
                  vercel_project_id: ${{ vars.VERCEL_PROJECT_ID }}
            # Same env contract as the teardown (`teardownSandboxPr.sh`), plus the deployment to alias. Every value is
            # passed through `env:` (never interpolated into the shell) so an untrusted output cannot be
            # injected into the command line, and the script prints only the host and the outcomes.
            - name: Create this PR's preview address and alias it to that deployment
              env:
                  PR_TOKEN: ${{ env.PR }}
                  PREVIEW_ZONE: sandbox.${{ vars.DOMAIN_NAME }}
                  PREVIEW_HOSTED_ZONE_ID: ${{ steps.zone.outputs.hosted_zone_id }}
                  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
                  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
                  VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
                  PREVIEW_COMMIT_SHA: ${{ inputs.commit_sha }}
                  VERCEL_DEPLOYMENT: ${{ steps.preview.outputs.preview_url }}
              run: npx tsx packages/apps/commise/web/scripts/createPreviewDomain.ts
