name: Production Deploy

on:
    push:
        branches: [main]
        paths:
            - 'packages/infra/global/**'
            - 'packages/services/identity/**'
            - 'packages/services/identity-webhooks/**'
            - 'packages/services/identity-webhooks/infra/**'
            - 'packages/services/identity/infra/**'
            # The feature services. These must be listed even though the `food`/`recipe` deploy flags below are
            # computed from their own paths-filter groups: a filter can only classify a run that STARTED, so
            # while these were absent a food-only or recipe-only merge never fired this workflow at all, and
            # those legs deployed only when a change happened to ride along with an identity/global one.
            # Keep in step with the `food`/`recipe` filters — prod-deploy-reachability.test.ts asserts it.
            - 'packages/services/food-service/**'
            - 'packages/services/recipe-service/**'
            - 'packages/services/recipe-workers/**'
            - 'packages/shared/recipe-core/**'
            - 'Dockerfile'
            - '.github/workflows/prod-deploy.yml'
    workflow_dispatch:

permissions:
    id-token: write
    contents: read

concurrency:
    group: prod-deploy
    cancel-in-progress: false

env:
    NODE_VERSION: 24
    DEFAULT_AWS_REGION: ${{ vars.DEFAULT_AWS_REGION }}
    CDK_DEFAULT_REGION: ${{ vars.DEFAULT_AWS_REGION }}
    CDK_DEFAULT_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
    STAGE: prod
    DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
    # Source-map upload (U11). The upload step no-ops until this secret is set.
    SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

jobs:
    deploy:
        name: Deploy Production
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            # Per-service change detection so identity-service and identity-webhooks deploy
            # independently — a webhooks-only change must not rebuild the Docker image or redeploy the
            # ECS service, and vice versa. A change under packages/infra/global/** (shared VPC/RDS/SGs)
            # redeploys both consumers; a workflow_dispatch deploys everything.
            - name: Detect changes
              uses: dorny/paths-filter@v3
              id: changes
              with:
                  filters: |
                      global:
                        - 'packages/infra/global/**'
                      service:
                        - 'packages/services/identity/**'
                        - 'Dockerfile'
                      webhooks:
                        - 'packages/services/identity-webhooks/**'
                      food:
                        - 'packages/services/food-service/**'
                      recipe:
                        - 'packages/services/recipe-service/**'
                        - 'packages/services/recipe-workers/**'
                        - 'packages/shared/recipe-core/**'

            - name: Compute deploy flags
              id: flags
              run: |
                  deploy_global=false
                  deploy_service=false
                  deploy_webhooks=false
                  # On a PUSH, feature services deploy ONLY when their own paths changed. Unlike identity they
                  # are not implied by a `global` change, so an infra-only commit cannot roll a feature service
                  # to prod as a side effect.
                  deploy_food=false
                  deploy_recipe=false
                  # A workflow_dispatch is an explicit operator action, not a side effect, so it deploys
                  # EVERYTHING — feature services included. Excluding them left no way to bring a feature
                  # service up for the first time (or roll one back) short of touching its sources, which is
                  # how the food and recipe legs came to exist for months without ever running once.
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                    deploy_global=true; deploy_service=true; deploy_webhooks=true
                    deploy_food=true; deploy_recipe=true
                  fi
                  if [ "${{ steps.changes.outputs.global }}" = "true" ]; then
                    deploy_global=true; deploy_service=true; deploy_webhooks=true
                  fi
                  if [ "${{ steps.changes.outputs.service }}" = "true" ]; then deploy_service=true; fi
                  if [ "${{ steps.changes.outputs.webhooks }}" = "true" ]; then deploy_webhooks=true; fi
                  if [ "${{ steps.changes.outputs.food }}" = "true" ]; then deploy_food=true; fi
                  if [ "${{ steps.changes.outputs.recipe }}" = "true" ]; then deploy_recipe=true; fi
                  run_migrations=false
                  if [ "$deploy_service" = "true" ] || [ "$deploy_webhooks" = "true" ]; then run_migrations=true; fi
                  {
                    echo "deploy_global=$deploy_global"
                    echo "deploy_service=$deploy_service"
                    echo "deploy_webhooks=$deploy_webhooks"
                    echo "run_migrations=$run_migrations"
                    echo "deploy_food=$deploy_food"
                    echo "deploy_recipe=$deploy_recipe"
                  } >> "$GITHUB_OUTPUT"
                  echo "global=$deploy_global service=$deploy_service webhooks=$deploy_webhooks migrations=$run_migrations food=$deploy_food recipe=$deploy_recipe"

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build identity service package
              if: steps.flags.outputs.deploy_service == 'true'
              # turbo (not a bare workspace build) so `^build` compiles the shared
              # @kitchensink/identity-utils dist first — the image copies that dist and crash-loops
              # without it (KTD2a). nest build alone does not build workspace dependencies.
              run: npx turbo run build --filter=@kitchensink/identity-service

            - name: Prepare identity service Docker image
              if: steps.flags.outputs.deploy_service == 'true'
              run: npm run docker:prepare --workspace=packages/services/identity

            - name: Build webhooks package
              if: steps.flags.outputs.deploy_webhooks == 'true'
              # turbo (not plain npm) so the workspace DEPENDENCY graph is built too: the CDK
              # entrypoint imports @kitchensink/infra-security, whose built dist must exist before
              # `node .../infra/dist/bin/app.js` can load it (ADR-0013).
              run: npx turbo run build --filter=@kitchensink/identity-webhooks

            # Upload the tsc-emitted .js.map files so Lambda stack traces symbolicate against the
            # commit-SHA release (U11). Guarded on the token + project so it no-ops until configured.
            - name: Upload webhooks Lambda source maps to Sentry
              if: ${{ steps.flags.outputs.deploy_webhooks == 'true' && env.SENTRY_AUTH_TOKEN != '' && vars.SENTRY_WEBHOOKS_PROJECT != '' }}
              continue-on-error: true
              env:
                  SENTRY_ORG: radicle-co
                  SENTRY_PROJECT: ${{ vars.SENTRY_WEBHOOKS_PROJECT }}
              run: |
                  npx @sentry/cli@latest sourcemaps inject packages/services/identity-webhooks/dist
                  npx @sentry/cli@latest sourcemaps upload --release "${{ github.sha }}" packages/services/identity-webhooks/dist

            - name: Build global infra
              if: steps.flags.outputs.deploy_global == 'true'
              # turbo (not plain npm) so the workspace DEPENDENCY graph is built too — see the
              # webhooks build step above and ADR-0013.
              run: npx turbo run build --filter=@kitchensink/infra-global

            # `build` is tsc only — it does NOT bundle the DataStack's custom-resource handlers. Without this
            # step `dist-lambda/` is absent at synth, and the DataStack ships an inline placeholder instead of
            # the real food/recipe bootstrap. That is not theoretical: prod ran for four weeks with a 101-byte
            # stub that created NO `food_app`/`recipe_app` role while CloudFormation reported CREATE_COMPLETE.
            # The package's own `npm run deploy` bundles first; this workflow calls `cdk deploy` directly, so
            # it has to do it here. Guarded by prod-deploy-bootstrap-bundle.test.ts.
            - name: Bundle global infra custom-resource handlers
              if: steps.flags.outputs.deploy_global == 'true'
              run: npm run bundle:lambda --workspace=packages/infra/global

            - name: Build identity service infra
              if: steps.flags.outputs.deploy_service == 'true'
              run: npm run infra:build --workspace=packages/services/identity

            - name: Build identity-webhooks infra
              if: steps.flags.outputs.deploy_webhooks == 'true'
              run: npm run infra:build --workspace=packages/services/identity-webhooks

            # ⚠️ MUST stay ABOVE "Prune dev dependencies". `nest build` is a devDependency binary
            # (@nestjs/cli), so building after the prune exits 127 "command not found" — which is exactly how
            # the first production deploy of these two services failed: their builds were written inline with
            # their Docker steps, further down, on the other side of the prune. The identity leg was always
            # correct (it builds at the top); food and recipe were the outliers.
            #
            # turbo, not a bare workspace build, so `^build` compiles the shared dists the images COPY
            # (recipe-core, food-service-client, clerk-verify, identity-core) — without them the container
            # crash-loops at boot on the bare @kitchensink/* specifiers.
            - name: Build food service package
              if: steps.flags.outputs.deploy_food == 'true'
              run: npx turbo run build --filter=@kitchensink/food-service

            - name: Build recipe service + workers packages
              if: steps.flags.outputs.deploy_recipe == 'true'
              run: npx turbo run build --filter=@kitchensink/recipe-service --filter=@kitchensink/recipe-workers

            - name: Prune dev dependencies
              run: npm prune --omit=dev

            - name: Verify runtime dependencies
              run: |
                  node -e "require('aws-cdk-lib')" || (echo 'FATAL: aws-cdk-lib missing after prune' && exit 1)

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ env.DEFAULT_AWS_REGION }}

            - name: Resolve AWS Account ID
              id: account
              run: |
                  echo "id=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_OUTPUT"

            # Gated on ANY image-pushing deploy, not just identity: a food- or recipe-only change still
            # needs the registry, and without this the push step would receive an empty
            # `steps.login-ecr.outputs.registry` and tag the image against a bare `/kitchensink-…` path.
            - name: Login to Amazon ECR
              id: login-ecr
              if: |
                  steps.flags.outputs.deploy_service == 'true' ||
                  steps.flags.outputs.deploy_food == 'true' ||
                  steps.flags.outputs.deploy_recipe == 'true'
              uses: aws-actions/amazon-ecr-login@v2

            - name: Ensure ECR repository exists
              if: steps.flags.outputs.deploy_service == 'true'
              run: aws ecr describe-repositories --repository-names kitchensink-identity || aws ecr create-repository --repository-name kitchensink-identity

            - name: Build, tag, and push identity service Docker image
              if: steps.flags.outputs.deploy_service == 'true'
              env:
                  ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
                  IMAGE_TAG: ${{ github.sha }}
              run: |
                  docker buildx build --platform linux/amd64 -f packages/services/identity/Dockerfile -t ${ECR_REGISTRY}/kitchensink-identity:${IMAGE_TAG} --push .

            - name: CDK Bootstrap
              run: npx cdk bootstrap aws://${{ steps.account.outputs.id }}/${DEFAULT_AWS_REGION}

            - name: CDK Deploy (global infra)
              if: steps.flags.outputs.deploy_global == 'true'
              run: |
                  STAGE=${{ env.STAGE }} npx cdk deploy --app "node packages/infra/global/dist/bin/app.js" --all --require-approval never

            - name: Resolve Identity VPC ID
              id: identity-vpc
              run: |
                  echo "vpc_id=$(aws cloudformation list-exports --query "Exports[?Name=='kitchensink-network-prod:VpcId'].Value" --output text)" >> "$GITHUB_OUTPUT"

            - name: CDK Deploy (identity service)
              if: steps.flags.outputs.deploy_service == 'true'
              run: |
                  STAGE=${{ env.STAGE }} IDENTITY_IMAGE_TAG=${{ github.sha }} IDENTITY_VPC_ID=${{ steps.identity-vpc.outputs.vpc_id }} npx cdk deploy --app "node packages/services/identity/infra/dist/bin/app.js" --all --require-approval never

            - name: CDK Deploy (identity-webhooks)
              if: steps.flags.outputs.deploy_webhooks == 'true'
              run: STAGE=${{ env.STAGE }} IDENTITY_VPC_ID=${{ steps.identity-vpc.outputs.vpc_id }} SENTRY_RELEASE=${{ github.sha }} npx cdk deploy --app "node packages/services/identity-webhooks/infra/dist/bin/app.js" --all --require-approval never

            # The RDS instance is in private-isolated subnets, unreachable from the runner — so apply
            # schema migrations by invoking the in-VPC MigrationFunction Lambda (idempotent; tracked in
            # schema_migrations). Runs after the webhooks stack (which owns the Lambda) and the global
            # infra deploy (which gives the lambda SG egress to PostgreSQL).
            - name: Run identity DB migrations
              if: steps.flags.outputs.run_migrations == 'true'
              run: |
                  set -euo pipefail
                  FN=$(aws cloudformation list-exports \
                    --query "Exports[?Name=='kitchensink-identity-webhooks-${STAGE}:MigrationFunctionName'].Value" \
                    --output text)
                  echo "Invoking migration runner: $FN"
                  ERR=$(aws lambda invoke --function-name "$FN" --query 'FunctionError' --output text /tmp/migrate-out.json)
                  echo "Result: $(cat /tmp/migrate-out.json)"
                  if [ "$ERR" != "None" ]; then echo "::error::identity DB migration failed"; exit 1; fi

            # Post-deploy smoke test. `cdk deploy` returning success only means the stack converged —
            # it does NOT prove the service serves traffic. Hit the public /health end-to-end
            # (DNS -> shared ALB -> host-based listener rule -> ECS task) so a broken ALB host rule, an
            # unhealthy/crash-looping task, or a cert/DNS regression fails the deploy instead of
            # silently shipping a dead service. Prod stage => identity.<domain> (no stage prefix).
            - name: Smoke test — identity service live & reachable (prod)
              if: steps.flags.outputs.deploy_service == 'true'
              env:
                  HEALTH_URL: https://identity.${{ vars.DOMAIN_NAME }}/health
              run: |
                  set -uo pipefail
                  echo "Smoke-testing $HEALTH_URL"
                  attempts=20; delay=15; code=000
                  for i in $(seq 1 "$attempts"); do
                    code=$(curl -s -o /tmp/health.out -w '%{http_code}' --max-time 10 "$HEALTH_URL" || true)
                    [ -z "$code" ] && code=000
                    if [ "$code" = "200" ]; then
                      echo "✅ identity healthy (HTTP 200) on attempt $i: $(cat /tmp/health.out)"
                      exit 0
                    fi
                    echo "attempt $i/$attempts: HTTP $code at $HEALTH_URL — retrying in ${delay}s"
                    sleep "$delay"
                  done
                  echo "::error::identity not serving HTTP 200 at $HEALTH_URL after ~$((attempts * delay))s (last=$code)"
                  exit 1

            # ────────────────────────────────────────────────────────────────────────────────────────
            # Feature services (food, recipe). Until now prod-deploy handled only global infra +
            # identity + identity-webhooks, so NEITHER feature service had any production deploy path —
            # feature 001's own backend could not reach prod at all. Each is gated on its own paths, so
            # an identity or infra change never rolls a feature service to prod as a side effect.
            #
            # NOTE: the first successful run CREATES production infrastructure for these services
            # (ECS services, queues, lambdas, DNS). That is intended, but it is not a no-op deploy.
            # ────────────────────────────────────────────────────────────────────────────────────────

            - name: Ensure food ECR repository exists
              if: steps.flags.outputs.deploy_food == 'true'
              run: aws ecr describe-repositories --repository-names kitchensink-food || aws ecr create-repository --repository-name kitchensink-food

            - name: Build, tag, and push food service Docker image
              if: steps.flags.outputs.deploy_food == 'true'
              env:
                  ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
                  IMAGE_TAG: ${{ github.sha }}
              run: |
                  npm run docker:prepare --workspace=packages/services/food-service
                  npm run infra:build --workspace=packages/services/food-service
                  npm run bundle:lambda --workspace=packages/services/food-service
                  docker buildx build --platform linux/amd64 -f packages/services/food-service/Dockerfile \
                    -t ${ECR_REGISTRY}/kitchensink-food:${IMAGE_TAG} --push .

            - name: CDK Deploy (food service)
              if: steps.flags.outputs.deploy_food == 'true'
              run: |
                  STAGE=${{ env.STAGE }} \
                  FOOD_VPC_ID=${{ steps.identity-vpc.outputs.vpc_id }} \
                  FOOD_IMAGE_TAG=${{ github.sha }} \
                  npx cdk deploy --app "node packages/services/food-service/infra/dist/bin/app.js" \
                    --all --require-approval never

            - name: Run food DB migrations
              if: steps.flags.outputs.deploy_food == 'true'
              run: |
                  set -euo pipefail
                  FN=$(aws cloudformation describe-stacks --stack-name "kitchensink-food-service-${STAGE}" \
                      --query "Stacks[0].Outputs[?OutputKey=='FoodMigrationFunctionName'].OutputValue | [0]" --output text)
                  ERR=$(aws lambda invoke --function-name "$FN" --query 'FunctionError' --output text /tmp/food-migrate.json)
                  echo "Result: $(cat /tmp/food-migrate.json)"
                  if [ "$ERR" != "None" ]; then echo "::error::food DB migration failed"; exit 1; fi

            # Recipe: WORKERS BEFORE SERVICE. recipe-workers owns the account-erasure queue and publishes
            # its URL/ARN to SSM (/kitchensink/{stage}/recipe/account-erasure-queue-*), which the service
            # reads at DEPLOY time — service-first fails with "Unable to fetch parameters …". Every input
            # is resolved from the prod platform tier's CloudFormation exports rather than hardcoded.
            - name: Resolve recipe platform inputs (prod exports)
              id: recipe-infra
              if: steps.flags.outputs.deploy_recipe == 'true'
              run: |
                  set -euo pipefail
                  lookup() {
                    local name="$1" value
                    value=$(aws cloudformation list-exports --query "Exports[?Name=='${name}'].Value" --output text)
                    if [ -z "$value" ] || [ "$value" = "None" ]; then
                      echo "::error::CloudFormation export '${name}' not found — is the prod platform tier deployed?"
                      exit 1
                    fi
                    echo "$value"
                  }
                  {
                    echo "lambda_sg_id=$(lookup "kitchensink-network-${STAGE}:LambdaSecurityGroupId")"
                    echo "db_endpoint=$(lookup "kitchensink-data-${STAGE}:DatabaseEndpoint")"
                    echo "db_port=$(lookup "kitchensink-data-${STAGE}:DatabasePort")"
                    # rds-db:connect ARNs key on the DbiResourceId (db-XXXX…), not the instance name.
                    echo "db_resource_id=$(lookup "kitchensink-data-${STAGE}:DatabaseResourceId")"
                    # The BASE logical database name (#119) — the workers app is a separate `cdk deploy` and
                    # cannot `Fn.importValue` this export the way the recipe SERVICE stack does, so CI hands
                    # it the resolved value and both stacks derive from ONE shared function. On prod
                    # stage == baseStage, so this IS the name the workers use.
                    echo "db_base_name=$(lookup "kitchensink-data-${STAGE}:RecipeDatabaseName")"
                    echo "archive_bucket=$(lookup "kitchensink-data-${STAGE}:ArchiveBucketName")"
                    echo "media_bucket=$(lookup "kitchensink-data-${STAGE}:MediaBucketName")"
                    echo "handle_sync_topic_arn=$(lookup "kitchensink-data-${STAGE}:HandleSyncTopicArn")"
                  } >> "$GITHUB_OUTPUT"

            # The food origin the recipe service reads ingredient nutrition + catalog suggestions from
            # (issue #120). `RECIPE_FOOD_SERVICE_URL` appeared in NO workflow, so the prod recipe task would
            # boot with no food origin at all and every ingredient call would hit `http://localhost:3002` —
            # itself, on food's port — with `FoodCatalogGateway` swallowing the failures.
            #
            # Derived by RUNNING the food stack's own host helper (`foodServiceOriginForStage`) rather than
            # re-typing `food.${DOMAIN_NAME}` here, so prod and every preview share ONE definition of the host
            # shape. Ordering needs no `needs:`: this is a single sequential job and the food deploy steps above
            # already ran. Prod's food service is persistent, so the host exists even when this run did not
            # redeploy food.
            - name: Resolve the food service origin (prod)
              id: food
              if: steps.flags.outputs.deploy_recipe == 'true'
              run: |
                  set -euo pipefail
                  food_url=$(npx tsx packages/services/food-service/infra/bin/print-food-host.ts \
                    "${STAGE}" "${{ vars.DOMAIN_NAME }}")
                  echo "url=${food_url}" >> "$GITHUB_OUTPUT"
                  echo "recipe will call food at ${food_url}"

            - name: Ensure recipe ECR repository exists
              if: steps.flags.outputs.deploy_recipe == 'true'
              run: aws ecr describe-repositories --repository-names kitchensink-recipes || aws ecr create-repository --repository-name kitchensink-recipes

            - name: Build, tag, and push recipe service Docker image
              if: steps.flags.outputs.deploy_recipe == 'true'
              env:
                  ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
                  IMAGE_TAG: ${{ github.sha }}
              run: |
                  npm run infra:build --workspace=packages/services/recipe-service
                  npm run bundle:lambda --workspace=packages/services/recipe-service
                  docker buildx build --platform linux/amd64 -f packages/services/recipe-service/Dockerfile \
                    -t ${ECR_REGISTRY}/kitchensink-recipes:${IMAGE_TAG} --push .

            - name: CDK Deploy (recipe workers — publishes the erasure-queue SSM params)
              if: steps.flags.outputs.deploy_recipe == 'true'
              run: |
                  STAGE=${{ env.STAGE }} \
                  DOMAIN_NAME=${{ vars.DOMAIN_NAME }} \
                  RECIPE_VPC_ID=${{ steps.identity-vpc.outputs.vpc_id }} \
                  RECIPE_LAMBDA_SG_ID=${{ steps.recipe-infra.outputs.lambda_sg_id }} \
                  RECIPE_DB_ENDPOINT=${{ steps.recipe-infra.outputs.db_endpoint }} \
                  RECIPE_DB_PORT=${{ steps.recipe-infra.outputs.db_port }} \
                  RECIPE_DB_INSTANCE_ID=${{ steps.recipe-infra.outputs.db_resource_id }} \
                  RECIPE_DB_BASE_NAME=${{ steps.recipe-infra.outputs.db_base_name }} \
                  RECIPE_ARCHIVE_BUCKET=${{ steps.recipe-infra.outputs.archive_bucket }} \
                  RECIPE_MEDIA_BUCKET=${{ steps.recipe-infra.outputs.media_bucket }} \
                  HANDLE_SYNC_TOPIC_ARN=${{ steps.recipe-infra.outputs.handle_sync_topic_arn }} \
                  npx cdk deploy --app "npx tsx packages/services/recipe-workers/infra/bin/app.ts" \
                    --all --require-approval never

            - name: CDK Deploy (recipe service)
              if: steps.flags.outputs.deploy_recipe == 'true'
              run: |
                  STAGE=${{ env.STAGE }} \
                  DOMAIN_NAME=${{ vars.DOMAIN_NAME }} \
                  RECIPE_VPC_ID=${{ steps.identity-vpc.outputs.vpc_id }} \
                  RECIPE_IMAGE_TAG=${{ github.sha }} \
                  RECIPE_FOOD_SERVICE_URL=${{ steps.food.outputs.url }} \
                  npx cdk deploy --app "node packages/services/recipe-service/infra/dist/bin/app.js" \
                    --all --require-approval never

            # Omitting this is NOT a no-op: the tasks boot, /health answers 200 and the stack converges,
            # because none of those touch the database — only real queries 500. That exact gap shipped to
            # the sandbox preview.
            - name: Run recipe DB migrations
              if: steps.flags.outputs.deploy_recipe == 'true'
              run: |
                  set -euo pipefail
                  FN=$(aws cloudformation describe-stacks --stack-name "kitchensink-recipe-service-${STAGE}" \
                      --query "Stacks[0].Outputs[?OutputKey=='RecipeMigrationFunctionName'].OutputValue | [0]" --output text)
                  ERR=$(aws lambda invoke --function-name "$FN" --payload '{"action":"migrate"}' \
                      --cli-binary-format raw-in-base64-out --query 'FunctionError' --output text /tmp/recipe-migrate.json)
                  echo "Result: $(cat /tmp/recipe-migrate.json)"
                  if [ "$ERR" != "None" ]; then echo "::error::recipe DB migration failed"; exit 1; fi

            # Health alone would not have caught the sandbox outage: the service was healthy to curl while
            # every BROWSER was blocked, because a CORS preflight carries no credentials and the auth layer
            # answered it with 401. This asserts live + browser-reachable + running the image we just built +
            # WIRED to the food service (issue #124): the running task must carry the right FOOD_SERVICE_URL,
            # and that origin must answer. `food.<domain>/api/v1/foods/search` answers 401 BY DESIGN (it needs a
            # Clerk token), and the smoke treats that 401 as the PASS — only a transport failure or the shared
            # ALB's default 404 is a failure.
            - name: Smoke test — recipe service live, browser-reachable, CURRENT and WIRED to food (prod)
              if: steps.flags.outputs.deploy_recipe == 'true'
              run: |
                  set -euo pipefail
                  cluster=$(aws ecs list-clusters --query 'clusterArns[]' --output text \
                    | tr '\t' '\n' | grep "recipe-service-${STAGE}-" | head -1)
                  service=$(aws ecs list-services --cluster "$cluster" --query 'serviceArns[0]' --output text)
                  task_def=$(aws ecs describe-services --cluster "$cluster" --services "$service" \
                    --query 'services[0].taskDefinition' --output text)
                  image=$(aws ecs describe-task-definition --task-definition "$task_def" \
                    --query 'taskDefinition.containerDefinitions[0].image' --output text)
                  # ⚠️ LOWERCASE `name`/`value`. ECS `KeyValuePair` is one of the few AWS shapes that is
                  # not PascalCase, unlike the `Exports[?Name==…].Value` queries elsewhere in this file.
                  # Filtering on `Name` matches NOTHING and yields `None`, which this step maps to an empty
                  # string — indistinguishable from the variable genuinely being unset. That produced a
                  # FALSE smoke failure claiming the recipe task could not reach food, while revision 18
                  # carried FOOD_SERVICE_URL=https://food-pr-73.commise.app the whole time.
                  food_url=$(aws ecs describe-task-definition --task-definition "$task_def" \
                    --query "taskDefinition.containerDefinitions[0].environment[?name=='FOOD_SERVICE_URL'].value | [0]" \
                    --output text)
                  [ "$food_url" = 'None' ] && food_url=''
                  npx tsx packages/services/recipe-service/infra/smoke/deployedSmoke.ts \
                    --base-url "https://recipe.${{ vars.DOMAIN_NAME }}" \
                    --web-origin "https://${{ vars.DOMAIN_NAME }}" \
                    --expected-image-tag "${{ github.sha }}" \
                    --running-image-tag "${image##*:}" \
                    --food-origin "${{ steps.food.outputs.url }}" \
                    --configured-food-origin "${food_url}"

            - name: Smoke test — food service live & reachable (prod)
              if: steps.flags.outputs.deploy_food == 'true'
              env:
                  HEALTH_URL: https://food.${{ vars.DOMAIN_NAME }}/health
              run: |
                  set -uo pipefail
                  attempts=20; delay=15; code=000
                  for i in $(seq 1 "$attempts"); do
                    code=$(curl -s -o /tmp/food-health.out -w '%{http_code}' --max-time 10 "$HEALTH_URL" || true)
                    [ -z "$code" ] && code=000
                    if [ "$code" = "200" ]; then echo "✅ food healthy on attempt $i"; exit 0; fi
                    echo "attempt $i/$attempts: HTTP $code at $HEALTH_URL — retrying in ${delay}s"
                    sleep "$delay"
                  done
                  echo "::error::food not serving HTTP 200 at $HEALTH_URL after ~$((attempts * delay))s (last=$code)"
                  exit 1
