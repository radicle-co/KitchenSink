# Recipe-service k6 load test (T081/SC-009 performance gate).
#
# The recipe k6 job lives in the reusable `_ci-heavy.yml`, which no ordinary PR/push pipeline calls, so the
# heavy run never fires on one. This workflow is the intended opt-in CALLER: it invokes `_ci-heavy.yml`
# with the Maestro half switched off, so the k6 jobs run without the 50-minute emulator — on a weekly
# schedule and on demand. (Mirrors the per-service load-test trigger pattern of food-loadtest.yml.)
#
# NOTE: `run_load_test` is ONE input covering EVERY k6 job in `_ci-heavy.yml` — the three ISOLATED-SUBSTRATE
# jobs (recipe + food + identity, which boot their own containers against seeded fixtures) AND the DEPLOYED
# job, which measures a real preview's origin. This caller runs all four, not only the recipe one. Accepted
# rather than plumbed around with a per-service input — see the same note in heavy-e2e.yml.
#
# ⚠️ On the weekly cron there is no PR in context, so the deployed job measures the stage this caller names
# (`sandbox`). If nothing is serving there, that job SKIPS — an absent preview is not a failure.
#
# Trigger: Actions → "Load test (k6 — every service tier)" → Run workflow, or
# `gh workflow run recipe-loadtest.yml -f load_test_target=sandbox`.
#
# Requires the `RECIPE_LOAD_TEST_TOKEN` repo secret (a Clerk token minted for authenticated load
# requests); the k6 job reads it to hit protected endpoints. Set it before the first real run — without
# it the load scripts cannot authenticate.
name: Load test (k6 — every service tier)

on:
    workflow_dispatch:
        inputs:
            # ⛔ MANUAL-ONLY, BY CONSTRUCTION. `prod` is refused at runtime by `_ci-heavy.yml`'s own
            # `Refuse a prod target on anything but a manual dispatch` step unless `github.event_name` is
            # `workflow_dispatch` — so the weekly cron below CANNOT reach production even if this default
            # were changed. The default stays `sandbox` regardless, because a scheduled run takes defaults.
            load_test_target:
                description: 'Which ENVIRONMENT the deployed k6 tier measures — sandbox or prod (manual only)'
                required: false
                type: choice
                options:
                    - sandbox
                    - prod
                default: sandbox
    # Weekly regression run (Monday 05:00 UTC) so the perf gate is exercised regularly, not just on demand.
    schedule:
        - cron: '0 5 * * 1'

# One heavy load run at a time — a scheduled and a manual trigger should not stack.
concurrency:
    group: recipe-loadtest
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    loadtest:
        # HEAVY tier only, and only its k6 half: `_ci-heavy.yml` holds nothing but the load tests and the
        # Maestro job, so this caller no longer has to switch the base tier off to avoid re-running
        # lint/typecheck/test/build/integration/e2e on a commit ci-pr.yml already covered — nor to avoid
        # starting a second `e2e-web` against the shared sandbox Clerk instance. Use ci-full.yml for
        # everything.
        uses: ./.github/workflows/_ci-heavy.yml
        with:
            stage: sandbox
            # The DEPLOYED tier's target. Empty on a scheduled run (no dispatch inputs), which falls back to
            # `sandbox` — the safe value, and the only one an automatic trigger is allowed to produce.
            load_test_target: ${{ inputs.load_test_target || 'sandbox' }}
            # The 50-minute emulator job is not what a weekly load run is for.
            run_mobile_maestro: false
        # Explicit, not `inherit` — `_ci-heavy.yml` declares exactly these two, and `inherit` would hand it
        # every repository secret regardless of need.
        secrets:
            AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
