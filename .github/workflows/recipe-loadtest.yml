# k6 load test against the DEPLOYED origins (owner ruling 2026-09-05: "K6 should also be hitting sandbox or
# production, depending on the flow … It follows the same pattern as the end to end tests").
#
# The k6 job lives in the reusable `_ci-heavy.yml`, which no ordinary PR/push pipeline calls, so the heavy
# run never fires on one. This workflow is the intended opt-in CALLER: it invokes `_ci-heavy.yml` with the
# Maestro half switched off, so k6 runs without the 50-minute emulator — on demand only (owner ruling 2026-09-13:
# "not run k6 automatically, but let it remain a job I can manually trigger").
#
# NOTE: `_ci-heavy.yml` now holds exactly ONE k6 job (`load-test-deployed`). It resolves this stage's
# deployed recipe, food and identity origins and runs `deployedOrigin.load.js` against each one that is
# serving. The three runner-local k6 jobs this caller used to reach (`load-test`, `load-test-food`,
# `load-test-identity`) were DELETED under the same ruling — their subject was the substrate they booted, so
# a deployed origin cannot carry their assertions. The scripts they ran are still committed under
# `packages/services/*/tests/load/` and are still runnable by hand (`npm run test:load` in each package);
# what is gone is their CI wiring, and each package's `tests/load/README.md` says so.
#
# ⚠️ A dispatch has no PR in context, so the job measures the stage this caller names (`sandbox`). If nothing is
# serving there, each leg SKIPS — an absent preview is not a failure.
#
# Trigger: Actions → "Load test (k6 — deployed origins)" → Run workflow, or
# `gh workflow run recipe-loadtest.yml -f load_test_target=sandbox`.
#
# ⚠️ No load-test credential is needed or read: `deployedOrigin.load.js` is deliberately UNAUTHENTICATED —
# its two series are `/health` and a protected route that MUST refuse an anonymous caller. (The old
# `RECIPE_LOAD_TEST_TOKEN` repo secret was consumed only by the deleted runner-local recipe job; it is
# referenced now solely by the committed scripts' own local-run instructions.)
name: Load test (k6 — deployed origins)

on:
    workflow_dispatch:
        inputs:
            # ⛔ MANUAL-ONLY, BY CONSTRUCTION. `prod` is refused at runtime by `_ci-heavy.yml`'s own
            # `Refuse a prod target on anything but a manual dispatch` step unless `github.event_name` is
            # `workflow_dispatch`. There is no schedule: `k6TargetsDeployedOrigins.test.ts` refuses any automatic
            # trigger on a workflow that can start k6.
            load_test_target:
                description: 'Which ENVIRONMENT the k6 tier measures — sandbox or prod (manual only)'
                required: false
                type: choice
                options:
                    - sandbox
                    - prod
                default: sandbox

# One heavy load run at a time — two manual dispatches should not stack.
concurrency:
    group: recipe-loadtest
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    loadtest:
        # HEAVY tier only, and only its k6 half: `_ci-heavy.yml` holds nothing but the k6 job and the
        # Maestro job, so this caller no longer has to switch the base tier off to avoid re-running
        # lint/typecheck/test/build/integration/e2e on a commit ci-pr.yml already covered — nor to avoid
        # starting a second `e2e-web` against the shared sandbox Clerk instance. Use ci-full.yml for
        # everything.
        uses: ./.github/workflows/_ci-heavy.yml
        with:
            stage: sandbox
            # The k6 tier's target, as dispatched; `sandbox` when the input is left empty.
            load_test_target: ${{ inputs.load_test_target || 'sandbox' }}
            # The 50-minute emulator job is not what a load run is for.
            run_mobile_maestro: false
        # Explicit, not `inherit` — `_ci-heavy.yml` declares exactly these two, and `inherit` would hand it
        # every repository secret regardless of need.
        secrets:
            AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
