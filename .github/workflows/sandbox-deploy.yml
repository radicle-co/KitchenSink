name: Sandbox Deploy

on:
    workflow_dispatch:
        inputs:
            service:
                description: 'Service to sandbox deploy (e.g. payments, notifications)'
                required: true
                type: string
            stage:
                description: 'Sandbox stage name (e.g. pr-15, team-feature-x)'
                required: true
                type: string
    pull_request:
        types: [opened, synchronize, reopened, closed]
        # Runs for ALL PRs. Per-service path filters are on each job.
        # This workflow is for ephemeral pr-{N} sandboxes of other services. The identity service +
        # webhooks have their own *persistent* shared sandbox env — see sandbox-identity-deploy.yml.

permissions:
    id-token: write
    contents: read

concurrency:
    group: sandbox-deploy-${{ github.event.inputs.stage || format('pr-{0}', github.event.pull_request.number) }}
    cancel-in-progress: false

env:
    NODE_VERSION: 24
    DEFAULT_AWS_REGION: ${{ vars.DEFAULT_AWS_REGION }}
    CDK_DEFAULT_REGION: ${{ vars.DEFAULT_AWS_REGION }}
    DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}

jobs:
    # ── Cleanup: on PR close, tear down THIS PR's ephemeral resources (ADR-0005) ──
    # Deletes everything tagged Environment=pr-{N} OR named `pr-{N}` / `pr-{N}-…` — the PR's feature
    # stacks (tagged via the App-level Environment tag), plus log groups + ECR repos the stacks don't
    # own. There is deliberately NO denylist: persistent global infra is Environment=global and named
    # kitchensink-*, so it can never match a pr-{N} tag or prefix — that precision IS the safety. The
    # match is delimiter-aware (pr-{N} exactly or pr-{N}-…) so pr-1 != pr-15/pr-100. Static job name
    # (no ${{ }}) so the open-PR skipped state shows a clean title.
    cleanup:
        name: Destroy sandbox preview
        runs-on: ubuntu-latest
        if: github.event_name == 'pull_request' && github.event.action == 'closed'
        env:
            PR: pr-${{ github.event.pull_request.number }}
            REGION: ${{ vars.DEFAULT_AWS_REGION }}
        steps:
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ vars.DEFAULT_AWS_REGION }}

            # Drop the per-PR food logical database (ADR-0006) BEFORE the stacks are deleted — the
            # in-VPC migration-runner Lambda is the only thing that can reach the PRIVATE_ISOLATED RDS,
            # and it is torn down with the food stack in the next step. We invoke THIS PR's food
            # migration function (which knows FOOD_DB_NAME=kitchensink_food_pr_{N}) with {action:'drop'};
            # the handler refuses to drop the shared base `kitchensink_food` and DROPs … WITH (FORCE) so
            # a still-draining preview's connections don't block it. Guarded: if this PR never deployed a
            # food service (the common case until the deploy job below is switched on), the stack/output
            # is absent and we skip. $PR is exactly `pr-{N}`, so the stack-name match is delimiter-safe.
            - name: Drop per-PR food database for ${{ env.PR }}
              run: |
                  set -uo pipefail
                  STACK="kitchensink-food-service-$PR"
                  FN=$(aws cloudformation describe-stacks --region "$REGION" --stack-name "$STACK" \
                      --query "Stacks[0].Outputs[?OutputKey=='FoodMigrationFunctionName'].OutputValue | [0]" \
                      --output text 2>/dev/null) || FN=""
                  if [ -z "$FN" ] || [ "$FN" = "None" ]; then
                      echo "No food migration function for $PR (stack $STACK absent or no output) — nothing to drop."
                      exit 0
                  fi

                  echo "[food-db] invoking $FN with {action:drop} to drop kitchensink_food_${PR//-/_}"
                  if aws lambda invoke --region "$REGION" --function-name "$FN" \
                      --payload '{"action":"drop"}' --cli-binary-format raw-in-base64-out \
                      /tmp/food-drop-result.json >/tmp/food-drop-invoke.json 2>/dev/null; then
                      if grep -q '"FunctionError"' /tmp/food-drop-invoke.json; then
                          echo "::warning::food DB drop for $PR returned a FunctionError — inspect $FN logs"
                      else
                          echo "[food-db] drop result: $(cat /tmp/food-drop-result.json)"
                      fi
                  else
                      echo "::warning::could not invoke $FN to drop the per-PR food DB — drop it manually"
                  fi

            - name: Delete ephemeral resources for ${{ env.PR }}
              run: |
                  set -uo pipefail
                  echo "Tearing down ephemeral resources for: $PR (region $REGION)"

                  # belongs <name>: true if <name> is exactly $PR or starts with "$PR-". The trailing
                  # dash prevents pr-1 from matching pr-15 / pr-100.
                  belongs() { case "$1" in "$PR" | "$PR"-*) return 0 ;; *) return 1 ;; esac; }
                  # path_belongs: same, but also matches a "$PR" / "$PR-" segment inside a path (e.g. an
                  # auto-created /aws/ecs/containerinsights/$PR-cluster.../performance group).
                  path_belongs() {
                      belongs "$1" && return 0
                      case "$1" in *"/$PR" | *"/$PR-"* | *"/$PR/"*) return 0 ;; *) return 1 ;; esac
                  }

                  ## 1. CloudFormation stacks — tagged Environment=$PR OR name matches $PR.
                  for s in $(aws cloudformation list-stacks --region "$REGION" \
                      --stack-status-filter CREATE_COMPLETE UPDATE_COMPLETE ROLLBACK_COMPLETE UPDATE_ROLLBACK_COMPLETE UPDATE_ROLLBACK_FAILED DELETE_FAILED \
                      --query 'StackSummaries[].StackName' --output text 2>/dev/null); do
                      envtag=$(aws cloudformation describe-stacks --region "$REGION" --stack-name "$s" \
                          --query "Stacks[0].Tags[?Key=='Environment'].Value | [0]" --output text 2>/dev/null)
                      # The feature-stack naming convention is the suffix kitchensink-{service}-pr-{N};
                      # those are caught by the Environment=$PR tag (belongs() also catches any pr-{N}-prefixed stack).
                      if belongs "$s" || [ "$envtag" = "$PR" ]; then
                          echo "[stack] delete $s (Environment=$envtag)"
                          aws cloudformation delete-stack --region "$REGION" --stack-name "$s"
                          aws cloudformation wait stack-delete-complete --region "$REGION" --stack-name "$s" 2>/dev/null || \
                              echo "::warning::stack $s did not finish deleting in time — check it"
                      fi
                  done

                  ## 2. Tag sweep — anything else tagged Environment=$PR the stacks did not own.
                  for arn in $(aws resourcegroupstaggingapi get-resources --region "$REGION" \
                      --tag-filters "Key=Environment,Values=$PR" \
                      --query 'ResourceTagMappingList[].ResourceARN' --output text 2>/dev/null); do
                      case "$arn" in
                          *:log-group:*) lg="${arn##*:log-group:}"; lg="${lg%:\*}"
                              echo "[logs/tag] delete $lg"; aws logs delete-log-group --region "$REGION" --log-group-name "$lg" || true ;;
                          *:repository/*) repo="${arn##*:repository/}"
                              echo "[ecr/tag] delete $repo"; aws ecr delete-repository --region "$REGION" --repository-name "$repo" --force || true ;;
                          *) echo "::warning::tagged $PR but not auto-deleted (add a handler for its type): $arn" ;;
                      esac
                  done

                  ## 3. Name-prefix sweep — auto-created resources that could not be tagged.
                  for lg in $(aws logs describe-log-groups --region "$REGION" \
                      --query 'logGroups[].logGroupName' --output text 2>/dev/null); do
                      if path_belongs "$lg"; then
                          echo "[logs/name] delete $lg"; aws logs delete-log-group --region "$REGION" --log-group-name "$lg" || true
                      fi
                  done
                  for repo in $(aws ecr describe-repositories --region "$REGION" \
                      --query 'repositories[].repositoryName' --output text 2>/dev/null); do
                      if belongs "$repo"; then
                          echo "[ecr/name] delete $repo (force)"; aws ecr delete-repository --region "$REGION" --repository-name "$repo" --force || true
                      fi
                  done

                  echo "Cleanup for $PR complete."

    # ═══════════════════════════════════════════════════════════════════
    # Per-service sandbox deploy jobs.
