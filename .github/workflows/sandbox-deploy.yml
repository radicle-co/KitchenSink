name: Sandbox Deploy

on:
    workflow_dispatch:
        inputs:
            service:
                description: 'Service to sandbox deploy (e.g. payments, notifications)'
                required: true
                type: string
            stage:
                description: 'Sandbox stage name (e.g. pr-15, team-feature-x)'
                required: true
                type: string
    # ⛔ NO `schedule:` AND NO `pull_request:` (ADR-0060). The owner ruled on 2026-10-12 that no scheduled job runs
    # except the midnight sandbox stop, and disabled this workflow. Its daily reaper moved to
    # `sandboxReapClosed.yml` (by hand), its PR-close teardown to `sandboxCleanup.yml`, and its preview address to
    # `previewDomain.yml` (called by Sandbox Up). What is left is the operator's hand-dispatch door below.

# NO `id-token: write` — every AWS auth in this workflow uses STATIC access keys
# (`aws-actions/configure-aws-credentials` + `secrets.AWS_ACCESS_KEY_ID`), never OIDC, so the grant was dead
# privilege. It mattered more here than in the other deploy workflows: this one used to trigger on
# `pull_request`, so a workflow-level OIDC-token grant was reachable from a run whose ref is PR-authored code.
# Verified before removal: no `role-to-assume` / `web-identity` / `ACTIONS_ID_TOKEN` reference exists
# anywhere under `.github/`. If a job is ever migrated to OIDC role assumption, add `id-token: write` to
# THAT job's own `permissions:` block — never back at the workflow level.
permissions:
    contents: read

concurrency:
    group: sandbox-deploy-${{ github.event.inputs.stage }}
    cancel-in-progress: false

env:
    NODE_VERSION: 24
    DEFAULT_AWS_REGION: ${{ vars.DEFAULT_AWS_REGION }}
    CDK_DEFAULT_REGION: ${{ vars.DEFAULT_AWS_REGION }}
    DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}

jobs:
    # ═══════════════════════════════════════════════════════════════════
    # Per-service sandbox deploy jobs.
    #
    # Copy the template below for each new service. For each job:
    #   1. paths: filter ensures it only runs when that service changed
    #   2. Deploys with stage=pr-{N} to kitchensink-{service}-*-pr-{N} stacks
    #   3. Uses domain: {service}-pr-{N}.commise.app (fits *.commise.app wildcard cert)
    #
    # ⚠️  Don't add identity services here. Prod deploys via prod-deploy.yml; the persistent shared
    #     sandbox identity env deploys via sandbox-identity-deploy.yml (STAGE=sandbox).
    # ═══════════════════════════════════════════════════════════════════
    #
    # TEMPLATE:
    # ---
    # deploy-{service}:
    #     name: Deploy {service} sandbox (pr-${{ github.event.pull_request.number }})
    #     runs-on: ubuntu-latest
    #     if: |
    #         (github.event_name == 'pull_request' && github.event.action != 'closed') ||
    #         (github.event_name == 'workflow_dispatch' && github.event.inputs.service == '{service}')
    #     env:
    #         STAGE: ${{ github.event.inputs.stage || format('pr-{0}', github.event.pull_request.number) }}
    #         SERVICE_DOMAIN: ${{ format('{service}-pr-{0}', github.event.pull_request.number) }}.${{ vars.DOMAIN_NAME }}
    #     steps:
    #         - name: Checkout
    #           uses: actions/checkout@v6
    #         - name: Setup Node.js
    #           uses: actions/setup-node@v6
    #           with: { node-version: ${{ env.NODE_VERSION }}, cache: npm }
    #         - name: Install dependencies
    #           run: npm ci
    #         - name: Build service package
    #           run: npm run build --workspace=packages/services/{service}
    #         - name: Build service infra
    #           run: npm run infra:build --workspace=packages/services/{service}
    #         - name: Prune dev dependencies
    #           run: npm prune --omit=dev
    #         - name: Configure AWS credentials
    #           uses: aws-actions/configure-aws-credentials@v4
    #           with:
    #               aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
    #               aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    #               aws-region: ${{ env.DEFAULT_AWS_REGION }}
    #         - name: CDK Bootstrap
    #                         run: npx cdk bootstrap aws://${{ vars.AWS_ACCOUNT_ID }}/${DEFAULT_AWS_REGION}
    #         - name: CDK Deploy
    #           run: |
    #               STAGE=${{ env.STAGE }} \
    #               SERVICE_DOMAIN=${{ env.SERVICE_DOMAIN }} \
    #               npx cdk deploy \
    #                 --app "packages/services/{service}/infra/node_modules/.bin/tsx packages/services/{service}/infra/bin/app.ts" \
    #                 --all --require-approval never

    # ═══════════════════════════════════════════════════════════════════
    # per-PR FOOD preview deploy (ADR-0006) — ACTIVE, gated **ensure-exists** (ADR-0010, issue #124).
    #
    # ⚠️  DELIBERATE — see docs/architecture/decisions/0010-ensure-exists-per-pr-deploy-gate.md
    #
    # It runs when food changed, when the run was dispatched by hand, when `kitchensink-food-service-pr-{N}`
    # is ABSENT or wedged, or when `food-pr-{N}.<domain>/health` does not answer 200 — and skips only when it
    # is BOTH unchanged and already serving. Do NOT restore the old `steps.changes.outputs.food == 'true'`
    # gate on every step: that is what left recipe-only PRs with no food service at all, pointing the
    # REQUIRED `RECIPE_FOOD_SERVICE_URL` at a host that did not resolve. Do NOT replace it with an
    # unconditional redeploy either — that rebuilds and pushes two Docker images for a README-only push.
    # On PR close, the `Drop per-PR food database` cleanup step above reclaims the `kitchensink_food_pr_{N}`
    # logical DB, and the Environment-tag cleanup deletes the stacks.
    #
    # How it works (ADR-0006): the food infra bin resolves baseStage internally (prod→prod, everything
    # else→sandbox), so a `STAGE=pr-{N}` deploy imports the SHARED sandbox platform (VPC/RDS/ALB/domain)
    # and provisions an isolated `kitchensink_food_pr_{N}` logical DB on that shared instance. FOOD_VPC_ID
    # MUST be the SANDBOX VPC id (the base platform), NOT a per-PR VPC (there is none) — set the
    # `SANDBOX_VPC_ID` repo variable. The preview host is `food-pr-{N}.commise.app` (single label,
    # covered by the `*.commise.app` cert — the prior `food.pr-{N}` 3-label wrinkle is resolved by the
    # dash form in `foodSubdomainForStage`). Per-PR DB creation needs sandbox `food_migrator` to have
    # `CREATEDB` (granted outside prod by DataStack's role-model bootstrap, ADR-0039).
    # ═══════════════════════════════════════════════════════════════════
    #

    # ⛔ THE HAND-DISPATCH PATH ONLY. The PR path is gone from this workflow: `_ci.yml` probes whether the
    # shared sandbox tier is up and calls `sandboxPreview.yml` itself, so "deploy, migrate, then test what
    # was deployed" is ONE job graph. It could never be one while these jobs lived here, because GitHub
    # Actions has no cross-workflow `needs` — two workflows on the same `pull_request` event run
    # independently, and `_ci.yml`'s tiers had no way to wait for this one.
    #
    # What is left here is the operator's door: deploy a named service at a named stage, on demand.
    deploy-dispatch:
        name: Deploy sandbox preview (dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: ./.github/workflows/sandboxPreview.yml
        # ⛔ Granted so the CALLED workflow's jobs can read GitHub Packages. A reusable workflow can
        # only DOWNGRADE what its caller gives it, so a `packages: read` on a callee job that no
        # caller granted is not ignored — the whole run is rejected with `startup_failure` before a
        # single step executes. `contents: read` is restated because a job-level block REPLACES the
        # workflow default.
        permissions:
            contents: read
            packages: read # zizmor: ignore[use-trusted-publishing]
        with:
            stage: ${{ github.event.inputs.stage }}
            # A hand-dispatched deploy is unconditional by definition — the operator asking IS the changed-
            # paths term, and ADR-0010 already records the dispatch bypassing the gate.
            forced: true
        secrets:
            AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
