name: Sandbox Deploy

on:
    workflow_dispatch:
        inputs:
            service:
                description: 'Service to sandbox deploy (e.g. payments, notifications)'
                required: true
                type: string
            stage:
                description: 'Sandbox stage name (e.g. pr-15, team-feature-x)'
                required: true
                type: string
    schedule:
        # Daily reaper (ADR-0005): sweep pr-{N} previews the on-close cleanup missed — closed PRs whose
        # teardown failed/hung, and long-abandoned open PRs. Uses the same teardown-sandbox-pr.sh script,
        # so it can never touch the shared global/identity/data infra (those never match pr-{N}).
        - cron: '0 6 * * *'
    pull_request:
        types: [opened, synchronize, reopened, closed]
        # Runs for ALL PRs. Per-service path filters are on each job.
        # This workflow is for ephemeral pr-{N} sandboxes of other services. The identity service +
        # webhooks have their own *persistent* shared sandbox env — see sandbox-identity-deploy.yml.

# NO `id-token: write` — every AWS auth in this workflow uses STATIC access keys
# (`aws-actions/configure-aws-credentials` + `secrets.AWS_ACCESS_KEY_ID`), never OIDC, so the grant was dead
# privilege. It mattered more here than in the other deploy workflows: this one triggers on `pull_request`,
# so a workflow-level OIDC-token grant was reachable from every job on a run whose ref is PR-authored code.
# Verified before removal: no `role-to-assume` / `web-identity` / `ACTIONS_ID_TOKEN` reference exists
# anywhere under `.github/`. If a job is ever migrated to OIDC role assumption, add `id-token: write` to
# THAT job's own `permissions:` block — never back at the workflow level.
permissions:
    contents: read

concurrency:
    group: sandbox-deploy-${{ github.event.inputs.stage || format('pr-{0}', github.event.pull_request.number) }}
    cancel-in-progress: false

env:
    NODE_VERSION: 24
    DEFAULT_AWS_REGION: ${{ vars.DEFAULT_AWS_REGION }}
    CDK_DEFAULT_REGION: ${{ vars.DEFAULT_AWS_REGION }}
    DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}

jobs:
    # ── Cleanup: on PR close, tear down THIS PR's ephemeral resources (ADR-0005) ──
    # Deletes everything tagged Environment=pr-{N} OR named `pr-{N}` / `pr-{N}-…` — the PR's feature
    # stacks (tagged via the App-level Environment tag), plus log groups + ECR repos the stacks don't
    # own, plus the preview's PUBLIC ADDRESS (the `pr-{N}.sandbox.<domain>` Route 53 record and the
    # Vercel project-domain binding — ADR-0001 "Update (2026-07-28)"; a CNAME left pointing at Vercel
    # after the domain is released is a subdomain-takeover vector). There is deliberately NO denylist:
    # persistent global infra is Environment=global and named kitchensink-*, so it can never match a
    # pr-{N} tag or prefix — that precision IS the safety. The match is delimiter-aware (pr-{N} exactly
    # or pr-{N}-…) so pr-1 != pr-15/pr-100, and the DNS half is stricter still (the record's first label
    # must be EXACTLY pr-{N}, so the apex, the *.sandbox wildcard and the shared identity.sandbox.… host
    # can never be targets). Static job name (no ${{ }}) so the open-PR skipped state shows a clean title.
    cleanup:
        name: Destroy sandbox preview
        runs-on: ubuntu-latest
        if: github.event_name == 'pull_request' && github.event.action == 'closed'

        # ── THE `Sandbox` BINDING — read this once; the other jobs here just point back at it ──────────
        #
        # ⛔ THIS JOB IS DELIBERATELY **NOT** BOUND to the `Sandbox` Environment, and neither is
        # `reap-abandoned`. Both are RECLAMATION jobs: they delete per-PR infrastructure. An Environment
        # binding is a place a run can be made to WAIT, and the failure modes are not symmetric — a stalled
        # deploy is loud and costs nothing, while a stalled cleanup silently leaks AWS spend, which is the
        # exact failure this script exists to prevent. So reclamation is never gated, and the guard is code,
        # not convention: `__tests__/reclamationNeverGated.test.ts` fails if either job gains an
        # `environment:` key. The deploying jobs below (`preview-domain`, `deploy-food`, `deploy-recipe`) ARE
        # bound, because stalling them is merely visible.
        #
        # ⚠️ BE HONEST ABOUT WHAT THOSE BINDINGS DO AND DO NOT BUY TODAY. `AWS_ACCESS_KEY_ID` /
        # `AWS_SECRET_ACCESS_KEY` are ORGANIZATION secrets (verified via
        # `gh api repos/:owner/:repo/actions/organization-secrets`), and an org secret CANNOT be scoped to an
        # Environment — environment secrets are repo-level only. So a binding does not yet narrow which jobs
        # can reach those keys; it makes the deploy target explicit, gives sandbox deploys their own
        # deployment history, and pre-wires the seam. The boundary actually moves when a per-stage credential
        # is stored AS a `Sandbox`/`Production` environment secret, which SHADOWS the org secret of the same
        # name (GitHub precedence: environment > repository > organization) — or when both become OIDC roles.
        # Until then, treat these bindings as plumbing, not as hardening.
        #
        # ⛔ `Sandbox` MUST ALSO KEEP ZERO PROTECTION RULES. Not laxity, a constraint: the bound jobs run
        # unattended on every non-closed `pull_request` event, so a required reviewer or branch policy would
        # stall every preview. Approval gating belongs on `Production` (see prod-deploy.yml), which is bound
        # to exactly one job and has no unattended trigger.

        env:
            PR: pr-${{ github.event.pull_request.number }}
            REGION: ${{ vars.DEFAULT_AWS_REGION }}
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false
            # The preview-domain step runs `npx tsx …/teardownPreviewDomain.ts`; the rest of the script
            # is aws-cli only.
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
            - run: npm ci
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ vars.DEFAULT_AWS_REGION }}
            # ⚠️ DELIBERATE — this step MUST NOT be able to abort the job. See the analyzer in
            # packages/infra/global/__tests__/sandboxReclamationReachability.test.ts.
            #
            # The hosted zone is an input to ONE part of teardown (the preview DNS record). The stacks, ECR
            # repos and log groups — all of the billable compute — need no zone at all. When this step
            # ended in `exit 1`, a lookup failure skipped the teardown step entirely and leaked 9 merged
            # PRs' worth of running Fargate tasks behind a red check nobody read, and the daily reaper
            # failed all 11 times it ever ran. So an unresolvable zone is reported here and handed to the
            # script as an EMPTY value: teardown-sandbox-pr.sh already treats that as an `::error::` +
            # non-zero exit (section 0) while still reclaiming everything that does not depend on it.
            # `--optional` is what keeps absence from aborting; never re-add an `exit` to this step.
            - name: Resolve the sandbox hosted zone
              id: zone
              run: |
                  set -euo pipefail
                  # Resolved through the shared helper: ListExports PAGES, and `--query` is applied per page,
                  # so the inline form returns "VALUE\nNone" or "None\nVALUE" depending on which page holds
                  # the export — and that two-line value is what GitHub rejected with `Invalid format 'None'`,
                  # failing this step. The helper collapses it to exactly one line.
                  # See .github/scripts/cfn-export.sh.
                  ZONE=$(bash .github/scripts/cfn-export.sh --optional 'kitchensink-domain-sandbox:HostedZoneId' "$REGION")
                  if [ -z "$ZONE" ]; then
                    echo "::error::CloudFormation export 'kitchensink-domain-sandbox:HostedZoneId' not found — the preview DNS record cannot be removed; the rest of the teardown still runs and the job will fail"
                  fi
                  echo "hosted_zone_id=$ZONE" >> "$GITHUB_OUTPUT"
            # All teardown logic lives in one script so the on-close cleanup and the scheduled reaper
            # cannot drift. It is scoped hard to pr-{N} (name, Environment tag, or exact DNS label), so
            # the shared global/identity/data infra can never match.
            # `!cancelled()` is the SECOND protection, independent of the analyzer's ordering rule: GitHub
            # skips every remaining step once any step fails, so without this a predecessor that fails
            # WITHOUT an explicit `exit` — a command failing under `set -e`, or the malformed
            # `$GITHUB_OUTPUT` write that caused this incident — silently skips reclamation again. The
            # teardown now runs on its own merits and reports its own outcome. `!cancelled()` rather than
            # `always()` on purpose: a cancelled run must not start deleting infrastructure.
            - name: Tear down ${{ env.PR }} sandbox resources
              if: ${{ !cancelled() }}
              env:
                  PREVIEW_ZONE: sandbox.${{ vars.DOMAIN_NAME }}
                  PREVIEW_HOSTED_ZONE_ID: ${{ steps.zone.outputs.hosted_zone_id }}
                  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
                  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
                  VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
                  # Reclaims this PR's LEGACY `sandbox-preview/pr-{N}` GitHub Environment (teardown §0b).
                  # NOT `github.token`: `administration` is not a grantable `permissions:` key, so the
                  # workflow token structurally cannot delete an environment — which is why `c86f3e09`
                  # stopped CREATING per-PR environments and moved every preview onto the one shared
                  # `sandbox-preview`. So this is a DRAINING backlog, not an ongoing stream: only the
                  # legacy names that predate that commit are left, and §0b's ledger says which. If the
                  # secret is ever unset (rotation, or a run without secret access) the step WARNS and
                  # skips rather than failing the close, because it reclaims metadata, not spend.
                  GH_ENVIRONMENT_ADMIN_TOKEN: ${{ secrets.GH_ENVIRONMENT_ADMIN_TOKEN }}
              run: |
                  chmod +x .github/scripts/teardown-sandbox-pr.sh
                  .github/scripts/teardown-sandbox-pr.sh "$PR" "$REGION"

    # ── Preview address: give this PR's web preview its public hostname (ADR-0001, issue #94) ──
    #
    # ⚠️  DELIBERATE — the exact MIRROR of the `cleanup` job above, and it must stay that way.
    #
    # A preview is reachable only when THREE records outside CloudFormation agree: a Vercel
    # project-domain binding claiming `pr-{N}.sandbox.<domain>`, a Route 53 `CNAME → cname.vercel-dns.com`,
    # and a per-deployment ALIAS. Teardown has reclaimed all of that since 2026-07-28 while creation stayed
    # HAND-MADE, so teardown was ahead of setup: it would correctly reclaim an address a human had to
    # remember to create. ADR-0001 records the cost — PR #73's alias stayed pinned to one deployment, so
    # every later push to that branch kept serving a stale build. This job re-runs on every PR event, which
    # is what keeps the alias on the CURRENT deployment.
    #
    # Three things are load-bearing and must not be "simplified" (all three are in
    # `packages/apps/commise/web/scripts/createPreviewDomain.ts`, with the reasoning and the tests):
    #   • the Vercel claim happens BEFORE the Route 53 write — DNS resolving to Vercel for a name nobody
    #     claims is a subdomain-takeover window, so an interrupted run may only leave the safe half-state;
    #   • the ALIAS happens LAST and is retried — Vercel refuses it with `400 cert_missing` until a cert
    #     exists, and refuses the cert until the name already resolves to Vercel (`449`), both measured;
    #   • the DNS scope is exact first-label equality, so the apex, the `*.sandbox` wildcard and the shared
    #     `identity.sandbox.<domain>` host can never be written.
    # Do NOT swap it for a Vercel *branch domain* (`gitBranch`): ADR-0001 measured that this re-enables
    # deployment protection (302 → vercel.com/sso-api), and clearing it falls back to PRODUCTION.
    #
    # It deliberately has NO `needs:` and nothing depends on it: a skipped job skips its dependents
    # (ADR-0010), and the web preview's address must not be able to gate — or be gated by — the food and
    # recipe deploys. Same-repo PRs only; a fork PR has no secrets and must never run with these creds.
    preview-domain:
        name: Publish sandbox preview address
        runs-on: ubuntu-latest
        # ⛔ ALSO ON `workflow_dispatch`, and that is not a widening for convenience. `sandbox-up.yml` — the
        # button — starts a preview by DISPATCHING this workflow, so gating on `pull_request` alone meant the
        # button brought the APIs up and never created the browsable address. Nothing caught it, because
        # `resolve-sandbox` derives liveness from `deploy-gate.sh evaluate`, which probes STACKS: a
        # button-started sandbox reports `live=true` with no preview host in DNS, and the manual
        # `deployed-e2e.yml` run then drives Playwright at an origin nobody published.
        #
        # ⚠️ The fork guard applies to the `pull_request` arm only — a dispatch can only come from someone
        # with write access. The dispatch arm is constrained instead to a `pr-{N}` stage, because a named
        # stage owns no per-PR preview address and `previewDomainScope.ts` refuses it anyway.
        if: |
            (github.event_name == 'pull_request' && github.event.action != 'closed' &&
             github.event.pull_request.head.repo.full_name == github.repository) ||
            (github.event_name == 'workflow_dispatch' && startsWith(inputs.stage, 'pr-'))
        # Reads AWS + Vercel credentials — see the `Sandbox` binding note on `cleanup` above.
        environment: Sandbox
        env:
            # On a dispatch the PR token IS the stage; on a `pull_request` it comes from the event payload.
            PR: ${{ github.event_name == 'workflow_dispatch' && inputs.stage || format('pr-{0}', github.event.pull_request.number) }}
            REGION: ${{ vars.DEFAULT_AWS_REGION }}
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false
            # The creation step runs `npx tsx …/createPreviewDomain.ts`.
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
            - run: npm ci
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ vars.DEFAULT_AWS_REGION }}
            # Resolved from the CloudFormation export rather than a repo variable, exactly as `cleanup`
            # does — one source of truth for the zone both halves of the lifecycle write to.
            - name: Resolve the sandbox hosted zone
              id: zone
              run: |
                  set -euo pipefail
                  # Resolved through the shared helper: ListExports PAGES, and `--query` is applied per page,
                  # so the inline form returns "VALUE\nNone" or "None\nVALUE" depending on which page holds
                  # the export. See .github/scripts/cfn-export.sh.
                  ZONE=$(bash .github/scripts/cfn-export.sh 'kitchensink-domain-sandbox:HostedZoneId' "$REGION")
                  if [ -z "$ZONE" ] || [ "$ZONE" = "None" ]; then
                    echo "::error::CloudFormation export 'kitchensink-domain-sandbox:HostedZoneId' not found — the preview DNS record cannot be created"
                    exit 1
                  fi
                  echo "hosted_zone_id=$ZONE" >> "$GITHUB_OUTPUT"
            # The deployment the hostname must serve. Same action + inputs as `sandbox-web-preview.yml`
            # uses for the KVS route, so there is one way to resolve "this PR's preview deployment".
            - name: Wait for this PR's Vercel preview deployment
              id: preview
              uses: zentered/vercel-preview-url@fba568fc6d882ae788a9724d7e28dee618728771 # v1.4.0
              env:
                  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
              with:
                  vercel_team_id: ${{ vars.VERCEL_TEAM_ID }}
                  vercel_project_id: ${{ vars.VERCEL_PROJECT_ID }}
            # Same env contract as the teardown step above, plus the deployment to alias. Every value is
            # passed through `env:` (never interpolated into the shell) so an untrusted output cannot be
            # injected into the command line, and the script prints only the host and the outcomes.
            - name: Create ${{ env.PR }}'s preview address and alias it to that deployment
              env:
                  PR_TOKEN: ${{ env.PR }}
                  PREVIEW_ZONE: sandbox.${{ vars.DOMAIN_NAME }}
                  PREVIEW_HOSTED_ZONE_ID: ${{ steps.zone.outputs.hosted_zone_id }}
                  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
                  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
                  VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
                  VERCEL_DEPLOYMENT: ${{ steps.preview.outputs.preview_url }}
              run: npx tsx packages/apps/commise/web/scripts/createPreviewDomain.ts

    # ── Reaper: daily sweep of pr-{N} previews the on-close cleanup missed (ADR-0005) ──
    # Reaps resources whose PR is CLOSED (a close-cleanup that failed/hung) or long-abandoned (OPEN but
    # no activity in STALE_DAYS). Uses the SAME teardown script → scoped to pr-{N}; the shared
    # global/identity/data infra never matches. Only reaps on a confirmed PR state (skips on API error).
    reap-abandoned:
        name: Reap abandoned sandbox previews
        runs-on: ubuntu-latest
        if: github.event_name == 'schedule'
        # ⛔ DELIBERATELY UNBOUND — reclamation is never gated. See the note on `cleanup` above. This
        # scheduled sweep is the ONLY retry a stack that failed to delete on close ever gets, so putting it
        # behind anything that can WAIT is how per-PR infrastructure becomes a permanent bill.
        permissions:
            contents: read
            pull-requests: read # read each candidate's PR state, so only a CONFIRMED-closed PR is reaped
        env:
            REGION: ${{ vars.DEFAULT_AWS_REGION }}
            GH_TOKEN: ${{ github.token }}
            STALE_DAYS: '30'
            # Grace period before a still-standing stack for a CLOSED PR is treated as a cleanup failure
            # rather than a close still in flight. One day would be enough for the on-close job itself; two
            # absorbs a same-day close whose stack delete was legitimately still running.
            STALE_ORPHAN_DAYS: '2'
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
            - run: npm ci
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ vars.DEFAULT_AWS_REGION }}
            # ⚠️ DELIBERATE — must not abort, for exactly the reason spelled out on the `cleanup` job's
            # copy of this step. The reaper is the ONLY retry left for a stack that failed to delete on
            # close, so a step that aborts here disables the entire safety net: pr-57 and pr-59 sat in
            # DELETE_FAILED from 2026-07-05 and were never retried, because this step failed on all 11
            # scheduled runs the reaper has ever had. `--optional`; never re-add an `exit` here.
            - name: Resolve the sandbox hosted zone
              id: zone
              run: |
                  set -euo pipefail
                  # Resolved through the shared helper: ListExports PAGES, and `--query` is applied per page,
                  # so the inline form returns "VALUE\nNone" or "None\nVALUE" depending on which page holds
                  # the export — the two-line value GitHub rejects with `Invalid format 'None'`.
                  # See .github/scripts/cfn-export.sh.
                  ZONE=$(bash .github/scripts/cfn-export.sh --optional 'kitchensink-domain-sandbox:HostedZoneId' "$REGION")
                  if [ -z "$ZONE" ]; then
                    echo "::error::CloudFormation export 'kitchensink-domain-sandbox:HostedZoneId' not found — dangling preview DNS records cannot be reaped; the rest of the sweep still runs and the job will fail"
                  fi
                  echo "hosted_zone_id=$ZONE" >> "$GITHUB_OUTPUT"
            # Second protection, for the reason given on the `cleanup` job's teardown step.
            - name: Reap pr-{N} resources whose PR is closed or long-stale
              if: ${{ !cancelled() }}
              env:
                  REPOSITORY: ${{ github.repository }}
                  PREVIEW_ZONE: sandbox.${{ vars.DOMAIN_NAME }}
                  PREVIEW_HOSTED_ZONE_ID: ${{ steps.zone.outputs.hosted_zone_id }}
                  # Two jobs in one variable. It lets the sweep (a) DISCOVER a legacy
                  # `sandbox-preview/pr-{N}` environment — see the source list in the script below, where it
                  # is the only signal left once a PR's AWS resources are gone — and (b) DELETE it via
                  # teardown §0b. This is the backstop for a close whose §0b failed; the on-close `cleanup`
                  # job is the mechanism. Nothing creates these names any more (`c86f3e09`), so a
                  # steady-state sweep finds none and this is expected to become a no-op.
                  GH_ENVIRONMENT_ADMIN_TOKEN: ${{ secrets.GH_ENVIRONMENT_ADMIN_TOKEN }}
                  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
                  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
                  VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
              run: |
                  set -uo pipefail
                  chmod +x .github/scripts/teardown-sandbox-pr.sh

                  # Distinct pr-{N} tokens from CFN stack names, ECR repos, log groups, Route 53 record
                  # names, and legacy GitHub Environments. Route 53 is load-bearing, not belt-and-braces:
                  # a PR that only ever had a WEB preview owns no stack, repo or log group, so without
                  # this source its dangling `pr-{N}.sandbox.<domain>` CNAME would be invisible to the
                  # reaper forever. This is only CANDIDATE discovery — the teardown script re-applies the
                  # anchored pr-{N} match (and the DNS half re-checks the exact record label), so an
                  # incidental "pr-5" substring can never widen the blast radius.
                  #
                  # ⚠️ THE SOURCE LIST MUST COVER EVERY RESOURCE CLASS THE TEARDOWN DELETES, or the class
                  # it cannot see becomes unreclaimable the moment the others are gone. That asymmetry was
                  # real: teardown §0b deletes the legacy `sandbox-preview/pr-{N}` GitHub Environment, but
                  # nothing here enumerated environments, so a close whose §0b failed (expired token, API
                  # 403) stranded that name PERMANENTLY — by the next sweep the stacks, ECR repos and the
                  # CNAME were already reclaimed, leaving no token to rediscover the PR by. Same defect
                  # shape as the log-group sweep that matched nothing for two years, and cheap to close.
                  # Asserted by `packages/infra/global/__tests__/reaperDiscoveryCoversTeardown.test.ts`.
                  stacks=$(aws cloudformation list-stacks --region "$REGION" \
                      --stack-status-filter CREATE_COMPLETE CREATE_FAILED ROLLBACK_COMPLETE ROLLBACK_FAILED UPDATE_COMPLETE UPDATE_ROLLBACK_COMPLETE UPDATE_ROLLBACK_FAILED IMPORT_COMPLETE IMPORT_ROLLBACK_COMPLETE IMPORT_ROLLBACK_FAILED DELETE_FAILED \
                      --query 'StackSummaries[].StackName' --output text 2>/dev/null | tr '\t' '\n')
                  tokens=$(
                      {
                          printf '%s\n' "$stacks"
                          aws ecr describe-repositories --region "$REGION" \
                              --query 'repositories[].repositoryName' --output text 2>/dev/null | tr '\t' '\n'
                          aws logs describe-log-groups --region "$REGION" \
                              --query 'logGroups[].logGroupName' --output text 2>/dev/null | tr '\t' '\n'
                          aws route53 list-resource-record-sets --hosted-zone-id "$PREVIEW_HOSTED_ZONE_ID" \
                              --query 'ResourceRecordSets[].Name' --output text 2>/dev/null | tr '\t' '\n'
                          # Gated on the admin token because that token is ALSO what §0b needs to delete
                          # what this finds: without it, discovering the token would only produce a
                          # candidate the teardown must then warn-and-skip on. `--paginate` for the same
                          # reason as §0b (default page size 30). The shared `sandbox-preview`, `Sandbox`,
                          # `Production`, `Preview` and `copilot` names carry no `pr-{N}`, so they yield no
                          # token here — and §0b refuses them twice over regardless.
                          if [ -n "${GH_ENVIRONMENT_ADMIN_TOKEN:-}" ]; then
                              GH_TOKEN="$GH_ENVIRONMENT_ADMIN_TOKEN" gh api --paginate \
                                  "repos/${REPOSITORY}/environments" --jq '.environments[].name' 2>/dev/null
                          fi
                      } | grep -oE 'pr-[0-9]+' | sort -u
                  )
                  # Tokens that still own a STACK. A long-closed PR appearing here is direct evidence the
                  # on-close `cleanup` job did not do its job — see the stale-orphan check in the loop.
                  stack_tokens=$(printf '%s\n' "$stacks" | grep -oE 'pr-[0-9]+' | sort -u)
                  if [ -z "$tokens" ]; then echo "No pr-{N} sandbox resources found."; exit 0; fi
                  echo "Candidate previews: $(echo "$tokens" | tr '\n' ' ')"

                  now=$(date -u +%s)
                  reaper_failed=0
                  # Set when this sweep had to repair something the on-close path owed us. Reported as a
                  # FAILURE at the end even though the reap itself succeeded — see the rationale there.
                  stale_orphans=''
                  for pr in $tokens; do
                      n="${pr#pr-}"
                      pr_json=$(gh api "repos/${REPOSITORY}/pulls/$n" 2>/dev/null) || pr_json=""
                      if [ -z "$pr_json" ]; then
                          echo "::warning::could not resolve PR #$n for $pr — skipping (verify manually)"
                          continue
                      fi
                      state=$(printf '%s' "$pr_json" | jq -r '.state // "unknown"')
                      updated=$(printf '%s' "$pr_json" | jq -r '.updated_at // empty')
                      reason=""
                      if [ "$state" = "closed" ]; then
                          reason="PR #$n is closed"
                          # ── Silent-success guard ──────────────────────────────────────────────────
                          # A stack for a PR that closed days ago should not exist: the on-close cleanup
                          # owned it. When it does, this sweep is a REPAIR, not a routine no-op, and the
                          # distinction has to leave the runner — "the reaper found nothing to do" and
                          # "the reaper never ran" are otherwise indistinguishable from outside, which is
                          # exactly how a broken cleanup stayed invisible while 9 merged PRs kept 27
                          # Fargate tasks running. Keyed on a STACK (not on any leftover token) so it
                          # reports real un-reclaimed infrastructure and stays silent in steady state.
                          closed=$(printf '%s' "$pr_json" | jq -r '.closed_at // empty')
                          closed_at=$(date -u -d "${closed:-@0}" +%s 2>/dev/null || echo 0)
                          if printf '%s\n' "$stack_tokens" | grep -qxF "$pr" &&
                              [ "$closed_at" -gt 0 ] &&
                              [ "$(( (now - closed_at) / 86400 ))" -ge "$STALE_ORPHAN_DAYS" ]; then
                              stale_orphans="$stale_orphans $pr"
                          fi
                      elif [ "$state" = "open" ] && [ -n "$updated" ]; then
                          upd=$(date -u -d "$updated" +%s 2>/dev/null || echo 0)
                          if [ "$upd" -gt 0 ] && [ "$(( (now - upd) / 86400 ))" -ge "$STALE_DAYS" ]; then
                              reason="PR #$n open but stale (no activity since $updated, >${STALE_DAYS}d)"
                          fi
                      fi
                      if [ -n "$reason" ]; then
                          echo "::notice::reaping $pr — $reason"
                          # A failed reap is an ERROR, not a warning: this job is the only thing left
                          # that will notice a dangling `pr-{N}.sandbox.<domain>` CNAME, and a warning
                          # keeps the run green so nobody looks. Keep sweeping the other tokens first.
                          if ! .github/scripts/teardown-sandbox-pr.sh "$pr" "$REGION"; then
                              echo "::error::teardown of $pr reported errors — inspect it by hand"
                              reaper_failed=1
                          fi
                      else
                          echo "keeping $pr (state=$state)"
                      fi
                  done
                  if [ -n "$stale_orphans" ]; then
                      echo "::error::on-close cleanup did NOT reclaim:${stale_orphans} — each still owned a CloudFormation stack ${STALE_ORPHAN_DAYS}+ days after its PR closed. This sweep repaired it; fix the cleanup job, because the reaper is the backstop, not the mechanism."
                      reaper_failed=1
                  fi
                  if [ "$reaper_failed" -ne 0 ]; then
                      echo "::error::Reaper sweep finished with failures."
                      exit 1
                  fi
                  echo "Reaper sweep complete — nothing was owed by the on-close cleanup."

    # ═══════════════════════════════════════════════════════════════════
