name: Sandbox Deploy

on:
    workflow_dispatch:
        inputs:
            service:
                description: 'Service to sandbox deploy (e.g. payments, notifications)'
                required: true
                type: string
            stage:
                description: 'Sandbox stage name (e.g. pr-15, team-feature-x)'
                required: true
                type: string
    schedule:
        # Daily reaper (ADR-0005): sweep pr-{N} previews the on-close cleanup missed — closed PRs whose
        # teardown failed/hung, and long-abandoned open PRs. Uses the same teardown-sandbox-pr.sh script,
        # so it can never touch the shared global/identity/data infra (those never match pr-{N}).
        - cron: '0 6 * * *'
    pull_request:
        types: [opened, synchronize, reopened, closed]
        # Runs for ALL PRs. Per-service path filters are on each job.
        # This workflow is for ephemeral pr-{N} sandboxes of other services. The identity service +
        # webhooks have their own *persistent* shared sandbox env — see sandbox-identity-deploy.yml.

permissions:
    id-token: write
    contents: read

concurrency:
    group: sandbox-deploy-${{ github.event.inputs.stage || format('pr-{0}', github.event.pull_request.number) }}
    cancel-in-progress: false

env:
    NODE_VERSION: 24
    DEFAULT_AWS_REGION: ${{ vars.DEFAULT_AWS_REGION }}
    CDK_DEFAULT_REGION: ${{ vars.DEFAULT_AWS_REGION }}
    DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}

jobs:
    # ── Cleanup: on PR close, tear down THIS PR's ephemeral resources (ADR-0005) ──
    # Deletes everything tagged Environment=pr-{N} OR named `pr-{N}` / `pr-{N}-…` — the PR's feature
    # stacks (tagged via the App-level Environment tag), plus log groups + ECR repos the stacks don't
    # own, plus the preview's PUBLIC ADDRESS (the `pr-{N}.sandbox.<domain>` Route 53 record and the
    # Vercel project-domain binding — ADR-0001 "Update (2026-07-28)"; a CNAME left pointing at Vercel
    # after the domain is released is a subdomain-takeover vector). There is deliberately NO denylist:
    # persistent global infra is Environment=global and named kitchensink-*, so it can never match a
    # pr-{N} tag or prefix — that precision IS the safety. The match is delimiter-aware (pr-{N} exactly
    # or pr-{N}-…) so pr-1 != pr-15/pr-100, and the DNS half is stricter still (the record's first label
    # must be EXACTLY pr-{N}, so the apex, the *.sandbox wildcard and the shared identity.sandbox.… host
    # can never be targets). Static job name (no ${{ }}) so the open-PR skipped state shows a clean title.
    cleanup:
        name: Destroy sandbox preview
        runs-on: ubuntu-latest
        if: github.event_name == 'pull_request' && github.event.action == 'closed'
        env:
            PR: pr-${{ github.event.pull_request.number }}
            REGION: ${{ vars.DEFAULT_AWS_REGION }}
        steps:
            - uses: actions/checkout@v6
            # The preview-domain step runs `npx tsx …/teardownPreviewDomain.ts`; the rest of the script
            # is aws-cli only.
            - uses: actions/setup-node@v6
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
            - run: npm ci
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ vars.DEFAULT_AWS_REGION }}
            - name: Resolve the sandbox hosted zone
              id: zone
              run: |
                  set -euo pipefail
                  ZONE=$(aws cloudformation list-exports --region "$REGION" \
                    --query "Exports[?Name=='kitchensink-domain-sandbox:HostedZoneId'].Value | [0]" --output text)
                  if [ -z "$ZONE" ] || [ "$ZONE" = "None" ]; then
                    echo "::error::CloudFormation export 'kitchensink-domain-sandbox:HostedZoneId' not found — the preview DNS record cannot be removed"
                    exit 1
                  fi
                  echo "hosted_zone_id=$ZONE" >> "$GITHUB_OUTPUT"
            # All teardown logic lives in one script so the on-close cleanup and the scheduled reaper
            # cannot drift. It is scoped hard to pr-{N} (name, Environment tag, or exact DNS label), so
            # the shared global/identity/data infra can never match.
            - name: Tear down ${{ env.PR }} sandbox resources
              env:
                  PREVIEW_ZONE: sandbox.${{ vars.DOMAIN_NAME }}
                  PREVIEW_HOSTED_ZONE_ID: ${{ steps.zone.outputs.hosted_zone_id }}
                  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
                  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
                  VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
              run: |
                  chmod +x .github/scripts/teardown-sandbox-pr.sh
                  .github/scripts/teardown-sandbox-pr.sh "$PR" "$REGION"

    # ── Reaper: daily sweep of pr-{N} previews the on-close cleanup missed (ADR-0005) ──
    # Reaps resources whose PR is CLOSED (a close-cleanup that failed/hung) or long-abandoned (OPEN but
    # no activity in STALE_DAYS). Uses the SAME teardown script → scoped to pr-{N}; the shared
    # global/identity/data infra never matches. Only reaps on a confirmed PR state (skips on API error).
    reap-abandoned:
        name: Reap abandoned sandbox previews
        runs-on: ubuntu-latest
        if: github.event_name == 'schedule'
        permissions:
            contents: read
            pull-requests: read
        env:
            REGION: ${{ vars.DEFAULT_AWS_REGION }}
            GH_TOKEN: ${{ github.token }}
            STALE_DAYS: '30'
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
            - run: npm ci
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ vars.DEFAULT_AWS_REGION }}
            - name: Resolve the sandbox hosted zone
              id: zone
              run: |
                  set -euo pipefail
                  ZONE=$(aws cloudformation list-exports --region "$REGION" \
                    --query "Exports[?Name=='kitchensink-domain-sandbox:HostedZoneId'].Value | [0]" --output text)
                  if [ -z "$ZONE" ] || [ "$ZONE" = "None" ]; then
                    echo "::error::CloudFormation export 'kitchensink-domain-sandbox:HostedZoneId' not found — dangling preview DNS records cannot be reaped"
                    exit 1
                  fi
                  echo "hosted_zone_id=$ZONE" >> "$GITHUB_OUTPUT"
            - name: Reap pr-{N} resources whose PR is closed or long-stale
              env:
                  PREVIEW_ZONE: sandbox.${{ vars.DOMAIN_NAME }}
                  PREVIEW_HOSTED_ZONE_ID: ${{ steps.zone.outputs.hosted_zone_id }}
                  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
                  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
                  VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
              run: |
                  set -uo pipefail
                  chmod +x .github/scripts/teardown-sandbox-pr.sh

                  # Distinct pr-{N} tokens from CFN stack names, ECR repos, log groups, and Route 53
                  # record names. Route 53 is load-bearing, not belt-and-braces: a PR that only ever had
                  # a WEB preview owns no stack, repo or log group, so without this source its dangling
                  # `pr-{N}.sandbox.<domain>` CNAME would be invisible to the reaper forever. This is
                  # only CANDIDATE discovery — the teardown script re-applies the anchored pr-{N} match
                  # (and the DNS half re-checks the exact record label), so an incidental "pr-5"
                  # substring can never widen the blast radius.
                  tokens=$(
                      {
                          aws cloudformation list-stacks --region "$REGION" \
                              --stack-status-filter CREATE_COMPLETE CREATE_FAILED ROLLBACK_COMPLETE ROLLBACK_FAILED UPDATE_COMPLETE UPDATE_ROLLBACK_COMPLETE UPDATE_ROLLBACK_FAILED IMPORT_COMPLETE IMPORT_ROLLBACK_COMPLETE IMPORT_ROLLBACK_FAILED DELETE_FAILED \
                              --query 'StackSummaries[].StackName' --output text 2>/dev/null | tr '\t' '\n'
                          aws ecr describe-repositories --region "$REGION" \
                              --query 'repositories[].repositoryName' --output text 2>/dev/null | tr '\t' '\n'
                          aws logs describe-log-groups --region "$REGION" \
                              --query 'logGroups[].logGroupName' --output text 2>/dev/null | tr '\t' '\n'
                          aws route53 list-resource-record-sets --hosted-zone-id "$PREVIEW_HOSTED_ZONE_ID" \
                              --query 'ResourceRecordSets[].Name' --output text 2>/dev/null | tr '\t' '\n'
                      } | grep -oE 'pr-[0-9]+' | sort -u
                  )
                  if [ -z "$tokens" ]; then echo "No pr-{N} sandbox resources found."; exit 0; fi
                  echo "Candidate previews: $(echo "$tokens" | tr '\n' ' ')"

                  now=$(date -u +%s)
                  reaper_failed=0
                  for pr in $tokens; do
                      n="${pr#pr-}"
                      pr_json=$(gh api "repos/${{ github.repository }}/pulls/$n" 2>/dev/null) || pr_json=""
                      if [ -z "$pr_json" ]; then
                          echo "::warning::could not resolve PR #$n for $pr — skipping (verify manually)"
                          continue
                      fi
                      state=$(printf '%s' "$pr_json" | jq -r '.state // "unknown"')
                      updated=$(printf '%s' "$pr_json" | jq -r '.updated_at // empty')
                      reason=""
                      if [ "$state" = "closed" ]; then
                          reason="PR #$n is closed"
                      elif [ "$state" = "open" ] && [ -n "$updated" ]; then
                          upd=$(date -u -d "$updated" +%s 2>/dev/null || echo 0)
                          if [ "$upd" -gt 0 ] && [ "$(( (now - upd) / 86400 ))" -ge "$STALE_DAYS" ]; then
                              reason="PR #$n open but stale (no activity since $updated, >${STALE_DAYS}d)"
                          fi
                      fi
                      if [ -n "$reason" ]; then
                          echo "::notice::reaping $pr — $reason"
                          # A failed reap is an ERROR, not a warning: this job is the only thing left
                          # that will notice a dangling `pr-{N}.sandbox.<domain>` CNAME, and a warning
                          # keeps the run green so nobody looks. Keep sweeping the other tokens first.
                          if ! .github/scripts/teardown-sandbox-pr.sh "$pr" "$REGION"; then
                              echo "::error::teardown of $pr reported errors — inspect it by hand"
                              reaper_failed=1
                          fi
                      else
                          echo "keeping $pr (state=$state)"
                      fi
                  done
                  if [ "$reaper_failed" -ne 0 ]; then
                      echo "::error::Reaper sweep finished with failures."
                      exit 1
                  fi
                  echo "Reaper sweep complete."

    # ═══════════════════════════════════════════════════════════════════
    # Per-service sandbox deploy jobs.
    #
    # Copy the template below for each new service. For each job:
    #   1. paths: filter ensures it only runs when that service changed
    #   2. Deploys with stage=pr-{N} to kitchensink-{service}-*-pr-{N} stacks
    #   3. Uses domain: {service}-pr-{N}.commise.app (fits *.commise.app wildcard cert)
    #
    # ⚠️  Don't add identity services here. Prod deploys via prod-deploy.yml; the persistent shared
    #     sandbox identity env deploys via sandbox-identity-deploy.yml (STAGE=sandbox).
    # ═══════════════════════════════════════════════════════════════════
    #
    # TEMPLATE:
    # ---
    # deploy-{service}:
    #     name: Deploy {service} sandbox (pr-${{ github.event.pull_request.number }})
    #     runs-on: ubuntu-latest
    #     if: |
    #         (github.event_name == 'pull_request' && github.event.action != 'closed') ||
    #         (github.event_name == 'workflow_dispatch' && github.event.inputs.service == '{service}')
    #     env:
    #         STAGE: ${{ github.event.inputs.stage || format('pr-{0}', github.event.pull_request.number) }}
    #         SERVICE_DOMAIN: ${{ format('{service}-pr-{0}', github.event.pull_request.number) }}.${{ vars.DOMAIN_NAME }}
    #     steps:
    #         - name: Checkout
    #           uses: actions/checkout@v6
    #         - name: Setup Node.js
    #           uses: actions/setup-node@v6
    #           with: { node-version: ${{ env.NODE_VERSION }}, cache: npm }
    #         - name: Install dependencies
    #           run: npm ci
    #         - name: Build service package
    #           run: npm run build --workspace=packages/services/{service}
    #         - name: Build service infra
    #           run: npm run infra:build --workspace=packages/services/{service}
    #         - name: Prune dev dependencies
    #           run: npm prune --omit=dev
    #         - name: Configure AWS credentials
    #           uses: aws-actions/configure-aws-credentials@v4
    #           with:
    #               aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
    #               aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    #               aws-region: ${{ env.DEFAULT_AWS_REGION }}
    #         - name: CDK Bootstrap
    #                         run: npx cdk bootstrap aws://${{ vars.AWS_ACCOUNT_ID }}/${DEFAULT_AWS_REGION}
    #         - name: CDK Deploy
    #           run: |
    #               STAGE=${{ env.STAGE }} \
    #               SERVICE_DOMAIN=${{ env.SERVICE_DOMAIN }} \
    #               npx cdk deploy \
    #                 --app "node packages/services/{service}/infra/dist/bin/app.js" \
    #                 --all --require-approval never

    # ═══════════════════════════════════════════════════════════════════
    # per-PR FOOD preview deploy (ADR-0006) — ACTIVE, gated to food-only changes.
    #
    # Runs only when `packages/services/food-service/**` changed on the PR (the `dorny/paths-filter`
    # step gates every step). On PR close, the `Drop per-PR food database` cleanup step above reclaims
    # the `kitchensink_food_pr_{N}` logical DB, and the `Environment=pr-{N}` cleanup deletes the stacks.
    #
    # How it works (ADR-0006): the food infra bin resolves baseStage internally (prod→prod, everything
    # else→sandbox), so a `STAGE=pr-{N}` deploy imports the SHARED sandbox platform (VPC/RDS/ALB/domain)
    # and provisions an isolated `kitchensink_food_pr_{N}` logical DB on that shared instance. FOOD_VPC_ID
    # MUST be the SANDBOX VPC id (the base platform), NOT a per-PR VPC (there is none) — set the
    # `SANDBOX_VPC_ID` repo variable. The preview host is `food-pr-{N}.commise.app` (single label,
    # covered by the `*.commise.app` cert — the prior `food.pr-{N}` 3-label wrinkle is resolved by the
    # dash form in `foodSubdomainForStage`). Per-PR DB creation needs sandbox `food_app` to have
    # `CREATEDB` (granted in the non-prod bootstrap SQL, DataStack).
    # ═══════════════════════════════════════════════════════════════════
    #
    deploy-food:
        name: Deploy food sandbox (pr-${{ github.event.pull_request.number }})
        runs-on: ubuntu-latest
        if: |
            (github.event_name == 'pull_request' && github.event.action != 'closed') ||
            (github.event_name == 'workflow_dispatch' && github.event.inputs.service == 'food')
        env:
            STAGE: ${{ github.event.inputs.stage || format('pr-{0}', github.event.pull_request.number) }}
            FOOD_VPC_ID: ${{ vars.SANDBOX_VPC_ID }} # the SHARED sandbox VPC (baseStage), not per-PR
        steps:
            - name: Checkout
              uses: actions/checkout@v6
            # Gate: only proceed when the food service actually changed on this PR.
            - name: Detect food changes
              id: changes
              uses: dorny/paths-filter@v3
              with:
                  filters: |
                      food:
                          - 'packages/services/food-service/**'
            - name: Setup Node.js
              if: steps.changes.outputs.food == 'true'
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
            - name: Install dependencies
              if: steps.changes.outputs.food == 'true'
              run: npm ci
            # turbo (not a bare workspace build) so `^build` compiles the shared @kitchensink/clerk-verify
            # and @kitchensink/usda-client dist first — the image copies those dists and crash-loops on
            # the bare specifiers without them.
            - name: Build food package (+ shared dist)
              if: steps.changes.outputs.food == 'true'
              run: npx turbo run build --filter=@kitchensink/food-service
            # Rewrite the food package.json exports/main to ./dist (prod.package.json) for the image.
            - name: Prepare food service Docker image (prod manifest)
              if: steps.changes.outputs.food == 'true'
              run: npm run docker:prepare --workspace=packages/services/food-service
            - name: Build food infra
              if: steps.changes.outputs.food == 'true'
              run: npm run infra:build --workspace=packages/services/food-service
            - name: Bundle migration Lambda
              if: steps.changes.outputs.food == 'true'
              run: npm run bundle:lambda --workspace=packages/services/food-service
            - name: Configure AWS credentials
              if: steps.changes.outputs.food == 'true'
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ vars.DEFAULT_AWS_REGION }}
            - name: Login to Amazon ECR
              id: login-ecr
              if: steps.changes.outputs.food == 'true'
              uses: aws-actions/amazon-ecr-login@v2
            # The food stack imports the repo by name (ecr.Repository.fromRepositoryName); create it on
            # first deploy so the image push + ECS pull have somewhere to go.
            - name: Ensure ECR repository exists
              if: steps.changes.outputs.food == 'true'
              run: aws ecr describe-repositories --repository-names kitchensink-food || aws ecr create-repository --repository-name kitchensink-food
            - name: Build, tag, and push food Docker image
              if: steps.changes.outputs.food == 'true'
              env:
                  ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
                  IMAGE_TAG: sandbox-${{ github.sha }}
              run: |
                  docker buildx build --platform linux/amd64 -f packages/services/food-service/Dockerfile -t ${ECR_REGISTRY}/kitchensink-food:${IMAGE_TAG} --push .
            # Pass 1 — provision the stack (incl. the migration Lambda) with the services scaled to ZERO.
            # A per-PR preview's isolated DB (kitchensink_food_pr_{N}) does not exist until the migration
            # step below runs, so booting tasks now would crash-loop on connect and trip the ECS
            # deployment circuit breaker. Zero desired tasks also means CloudFormation never has to roll
            # back a failed service — which is what previously wedged the Fargate-Spot capacity-provider
            # association in ROLLBACK_FAILED.
            - name: CDK Deploy — pass 1 (scale 0, provision infra + migration Lambda)
              if: steps.changes.outputs.food == 'true'
              run: |
                  STAGE=${{ env.STAGE }} \
                  FOOD_VPC_ID=${{ env.FOOD_VPC_ID }} \
                  FOOD_IMAGE_TAG=sandbox-${{ github.sha }} \
                  FOOD_DESIRED_COUNT=0 \
                  FOOD_WORKER_DESIRED_COUNT=0 \
                  npx cdk deploy \
                    --app "node packages/services/food-service/infra/dist/bin/app.js" \
                    --all --require-approval never
            # Apply migrations into the per-PR DB. The runner CREATEs kitchensink_food_pr_{N} if absent
            # (ADR-0006) before migrating, so a fresh preview self-provisions its isolated database.
            - name: Run food migrations (creates the per-PR DB if absent)
              if: steps.changes.outputs.food == 'true'
              run: |
                  FN=$(aws cloudformation describe-stacks --region "${{ vars.DEFAULT_AWS_REGION }}" \
                      --stack-name "kitchensink-food-service-${{ env.STAGE }}" \
                      --query "Stacks[0].Outputs[?OutputKey=='FoodMigrationFunctionName'].OutputValue | [0]" \
                      --output text)
                  aws lambda invoke --region "${{ vars.DEFAULT_AWS_REGION }}" --function-name "$FN" \
                      --payload '{"action":"migrate"}' --cli-binary-format raw-in-base64-out /tmp/migrate.json
                  cat /tmp/migrate.json
            # Pass 2 — scale the API + worker up now that the image is in ECR and the per-PR DB exists, so
            # tasks boot healthy. (Defaults are 2 / 1; set explicitly for clarity.)
            - name: CDK Deploy — pass 2 (scale services up)
              if: steps.changes.outputs.food == 'true'
              run: |
                  STAGE=${{ env.STAGE }} \
                  FOOD_VPC_ID=${{ env.FOOD_VPC_ID }} \
                  FOOD_IMAGE_TAG=sandbox-${{ github.sha }} \
                  FOOD_DESIRED_COUNT=2 \
                  FOOD_WORKER_DESIRED_COUNT=1 \
                  npx cdk deploy \
                    --app "node packages/services/food-service/infra/dist/bin/app.js" \
                    --all --require-approval never

    # ------------------------------------------------------------------------------------------------
    # Recipe (feature 001). This job exists because its ABSENCE was itself the defect: the recipe service
    # was hand-deployed once (2026-07-13) and never again, so it silently drifted fifteen days behind
    # `main` — missing the CORS support added in 1bba364f — while every existing signal stayed green
    # (`/health` 200, `cdk synth` 0, and k6/Playwright/Maestro/integration all boot or mock their OWN
    # backend). Nothing in the pipeline ever exercised the deployed artifact. See ADR-0005 / ADR-0006.
    #
    # Ordering is load-bearing: recipe-WORKERS owns the account-erasure queue and publishes its URL/ARN to
    # SSM (`/kitchensink/{stage}/recipe/account-erasure-queue-*`), which recipe-SERVICE reads at deploy
    # time. Deploying the service first fails with "Unable to fetch parameters ... from parameter store".
    # SSM (rather than a CFN export) is deliberate — see the comment in recipe-service-stack.ts: an
    # `Fn.importValue` would lock the workers export while the service imports it, and ADR-0005's PR-close
    # cleanup deletes a PR's stacks in no fixed order, so workers-first would hit the ADR-0002
    # export-in-use deadlock unattended.
    #
    # Every infra input is RESOLVED from CloudFormation exports rather than hardcoded or carried in repo
    # variables, so a platform change cannot leave this job pointing at something stale.
    #
    # `needs: deploy-food` makes the food-before-recipe ordering EXPLICIT (issue #120). The recipe service reads
    # food's `/v1/foods/*` API on the per-keystroke ingredient path, and its `RECIPE_FOOD_SERVICE_URL` names
    # THIS PR's food host — which only exists once the food stack has created its listener rule + A-record. The
    # two jobs previously ran concurrently, so any ordering was luck. `deploy-food`'s own `if:` is true for every
    # pull_request event (its per-step `paths-filter` gate is what skips the work), so this dependency never
    # skips the recipe deploy — it only sequences it.
    deploy-recipe:
        name: Deploy recipe sandbox (pr-${{ github.event.pull_request.number }})
        runs-on: ubuntu-latest
        needs: deploy-food
        if: |
            (github.event_name == 'pull_request' && github.event.action != 'closed') ||
            (github.event_name == 'workflow_dispatch' && github.event.inputs.service == 'recipe')
        env:
            STAGE: ${{ github.event.inputs.stage || format('pr-{0}', github.event.pull_request.number) }}
            # A per-PR feature deploy rides the SHARED sandbox platform tier (ADR-0006), so every export
            # below is read from the `sandbox` base stage, never from `pr-{N}`.
            BASE_STAGE: sandbox
            IMAGE_TAG: pr-${{ github.event.pull_request.number }}-${{ github.sha }}
        steps:
            - name: Checkout
              uses: actions/checkout@v6
            # Gate: only proceed when the recipe tier actually changed on this PR. `recipe-core` is in the
            # image, so a change there ships too.
            - name: Detect recipe changes
              id: changes
              uses: dorny/paths-filter@v3
              with:
                  filters: |
                      recipe:
                          - 'packages/services/recipe-service/**'
                          - 'packages/services/recipe-workers/**'
                          - 'packages/shared/recipe-core/**'
            - name: Setup Node.js
              if: steps.changes.outputs.recipe == 'true'
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
            - name: Install dependencies
              if: steps.changes.outputs.recipe == 'true'
              run: npm ci
            # turbo (not a bare workspace build) so `^build` compiles the shared dists the image COPYs
            # (recipe-core, food-service-client, clerk-verify, identity-core). Without them the container
            # crash-loops at boot on the bare @kitchensink/* specifiers.
            - name: Build recipe packages (+ shared dists)
              if: steps.changes.outputs.recipe == 'true'
              run: npx turbo run build --filter=@kitchensink/recipe-service --filter=@kitchensink/recipe-workers
            - name: Build recipe infra
              if: steps.changes.outputs.recipe == 'true'
              run: npm run infra:build --workspace=packages/services/recipe-service
            - name: Bundle recipe lambdas
              if: steps.changes.outputs.recipe == 'true'
              run: npm run bundle:lambda --workspace=packages/services/recipe-service
            - name: Configure AWS credentials
              if: steps.changes.outputs.recipe == 'true'
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ vars.DEFAULT_AWS_REGION }}
            # Resolve every platform input from the shared tier's CloudFormation exports. `set -euo
            # pipefail` plus the empty-check means a renamed or missing export fails HERE, with the export
            # name in the log, instead of surfacing as an opaque CDK error later.
            - name: Resolve platform inputs from CloudFormation exports
              id: infra
              if: steps.changes.outputs.recipe == 'true'
              run: |
                  set -euo pipefail
                  lookup() {
                    local name="$1"
                    local value
                    value=$(aws cloudformation list-exports \
                      --query "Exports[?Name=='${name}'].Value" --output text)
                    if [ -z "$value" ] || [ "$value" = "None" ]; then
                      echo "::error::CloudFormation export '${name}' not found — is the ${BASE_STAGE} platform tier deployed?"
                      exit 1
                    fi
                    echo "$value"
                  }
                  {
                    echo "vpc_id=$(lookup "kitchensink-network-${BASE_STAGE}:VpcId")"
                    echo "lambda_sg_id=$(lookup "kitchensink-network-${BASE_STAGE}:LambdaSecurityGroupId")"
                    echo "db_endpoint=$(lookup "kitchensink-data-${BASE_STAGE}:DatabaseEndpoint")"
                    echo "db_port=$(lookup "kitchensink-data-${BASE_STAGE}:DatabasePort")"
                    # `rds-db:connect` ARNs are keyed on the DbiResourceId (db-XXXX…), NOT the instance name.
                    echo "db_resource_id=$(lookup "kitchensink-data-${BASE_STAGE}:DatabaseResourceId")"
                    echo "archive_bucket=$(lookup "kitchensink-data-${BASE_STAGE}:ArchiveBucketName")"
                    echo "media_bucket=$(lookup "kitchensink-data-${BASE_STAGE}:MediaBucketName")"
                    echo "handle_sync_topic_arn=$(lookup "kitchensink-data-${BASE_STAGE}:HandleSyncTopicArn")"
                  } >> "$GITHUB_OUTPUT"
            # The food origin the recipe service reads ingredient nutrition + catalog suggestions from
            # (issue #120). Keyed on the DEPLOY stage, NOT the base stage: every PR stands up its own food
            # service, and there is no persistent sandbox one to fall back to.
            #
            # Derived by RUNNING the food stack's own host helper (`foodServiceOriginForStage`), never by
            # re-typing `food-pr-{N}.${DOMAIN_NAME}` here: the dash form is a TLS constraint (a 3-label
            # `food.pr-7...` matches no wildcard on the shared ALB cert — ADR-0003/0006), and a second copy of
            # that rule in YAML is exactly the kind of thing that drifts silently. One definition, imported.
            - name: Resolve the food service origin for this stage
              id: food
              if: steps.changes.outputs.recipe == 'true'
              run: |
                  set -euo pipefail
                  food_url=$(npx tsx packages/services/food-service/infra/bin/print-food-host.ts \
                    "${STAGE}" "${{ vars.DOMAIN_NAME }}")
                  echo "url=${food_url}" >> "$GITHUB_OUTPUT"
                  echo "recipe will call food at ${food_url}"
                  # Non-fatal, but say it out loud: a recipe-only PR deploys no food service (deploy-food is
                  # gated on `packages/services/food-service/**`), so this host will not resolve and the
                  # ingredient typeahead will report `catalogAvailability: 'unavailable'` for the whole preview.
                  # That degradation is by design; being unaware of it is not.
                  if ! aws cloudformation describe-stacks --region "${{ vars.DEFAULT_AWS_REGION }}" \
                      --stack-name "kitchensink-food-service-${STAGE}" >/dev/null 2>&1; then
                    echo "::warning::No food service is deployed at stage ${STAGE}, so ${food_url} will not resolve. The recipe preview's ingredient typeahead will degrade to recipe-local-only (catalogAvailability: unavailable). Touch packages/services/food-service/** on this PR to get a per-PR food service."
                  fi
            - name: Login to Amazon ECR
              id: login-ecr
              if: steps.changes.outputs.recipe == 'true'
              uses: aws-actions/amazon-ecr-login@v2
            # The recipe stack imports the repo by name (ecr.Repository.fromRepositoryName), so create it
            # on first deploy — the image push and the ECS pull both need it to exist.
            - name: Ensure ECR repository exists
              if: steps.changes.outputs.recipe == 'true'
              run: aws ecr describe-repositories --repository-names kitchensink-recipes || aws ecr create-repository --repository-name kitchensink-recipes
            # The tag carries the commit SHA and is therefore IMMUTABLE per deploy. That is what makes the
            # currency assertion in the smoke step meaningful: a mutable `pr-{N}` tag would let ECS keep
            # serving a cached older layer while the tag "matched".
            - name: Build, tag, and push recipe Docker image
              if: steps.changes.outputs.recipe == 'true'
              env:
                  ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
              run: |
                  docker buildx build --platform linux/amd64 \
                    -f packages/services/recipe-service/Dockerfile \
                    -t ${ECR_REGISTRY}/kitchensink-recipes:${IMAGE_TAG} --push .
            # Pass 1 — WORKERS first: this creates the account-erasure queue and writes the two SSM
            # parameters the service reads. Skipping it is what makes the service undeployable.
            - name: CDK Deploy — recipe workers (publishes the erasure-queue SSM params)
              if: steps.changes.outputs.recipe == 'true'
              run: |
                  STAGE=${{ env.STAGE }} \
                  DOMAIN_NAME=${{ vars.DOMAIN_NAME }} \
                  RECIPE_VPC_ID=${{ steps.infra.outputs.vpc_id }} \
                  RECIPE_LAMBDA_SG_ID=${{ steps.infra.outputs.lambda_sg_id }} \
                  RECIPE_DB_ENDPOINT=${{ steps.infra.outputs.db_endpoint }} \
                  RECIPE_DB_PORT=${{ steps.infra.outputs.db_port }} \
                  RECIPE_DB_INSTANCE_ID=${{ steps.infra.outputs.db_resource_id }} \
                  RECIPE_ARCHIVE_BUCKET=${{ steps.infra.outputs.archive_bucket }} \
                  RECIPE_MEDIA_BUCKET=${{ steps.infra.outputs.media_bucket }} \
                  HANDLE_SYNC_TOPIC_ARN=${{ steps.infra.outputs.handle_sync_topic_arn }} \
                  npx cdk deploy \
                    --app "npx tsx packages/services/recipe-workers/infra/bin/app.ts" \
                    --all --require-approval never
            # Pass 2 — the service, which can only synth once the SSM parameters above exist.
            - name: CDK Deploy — recipe service
              if: steps.changes.outputs.recipe == 'true'
              run: |
                  STAGE=${{ env.STAGE }} \
                  DOMAIN_NAME=${{ vars.DOMAIN_NAME }} \
                  RECIPE_VPC_ID=${{ steps.infra.outputs.vpc_id }} \
                  RECIPE_IMAGE_TAG=${{ env.IMAGE_TAG }} \
                  RECIPE_FOOD_SERVICE_URL=${{ steps.food.outputs.url }} \
                  npx cdk deploy \
                    --app "node packages/services/recipe-service/infra/dist/bin/app.js" \
                    --all --require-approval never
            # Apply migrations into the per-PR logical DB, creating `kitchensink_recipes_pr_{N}` if absent
            # (ADR-0006), so a fresh preview self-provisions its isolated database. Omitting this is NOT a
            # silent no-op: the tasks boot fine and `/health` answers 200 (it does not touch the DB), so the
            # service looks healthy while every actual query 500s — which is exactly what the first run of
            # this job produced.
            - name: Run recipe migrations (creates the per-PR DB if absent)
              if: steps.changes.outputs.recipe == 'true'
              run: |
                  set -euo pipefail
                  FN=$(aws cloudformation describe-stacks --region "${{ vars.DEFAULT_AWS_REGION }}" \
                      --stack-name "kitchensink-recipe-service-${{ env.STAGE }}" \
                      --query "Stacks[0].Outputs[?OutputKey=='RecipeMigrationFunctionName'].OutputValue | [0]" \
                      --output text)
                  aws lambda invoke --region "${{ vars.DEFAULT_AWS_REGION }}" --function-name "$FN" \
                      --payload '{"action":"migrate"}' --cli-binary-format raw-in-base64-out /tmp/recipe-migrate.json
                  cat /tmp/recipe-migrate.json
                  # `aws lambda invoke` exits 0 even when the FUNCTION threw, so inspect the payload.
                  if grep -q '"errorType"' /tmp/recipe-migrate.json; then
                    echo "::error::recipe migration lambda failed — see payload above"
                    exit 1
                  fi
            # Read the image tag the RUNNING task is actually using, so the smoke step can prove the
            # deployment took effect rather than trusting that `cdk deploy` said "success".
            - name: Resolve the running image tag
              id: running
              if: steps.changes.outputs.recipe == 'true'
              run: |
                  set -euo pipefail
                  cluster=$(aws ecs list-clusters --query 'clusterArns[]' --output text \
                    | tr '\t' '\n' | grep "recipe-service-${STAGE}-" | head -1)
                  service=$(aws ecs list-services --cluster "$cluster" --query 'serviceArns[0]' --output text)
                  task_def=$(aws ecs describe-services --cluster "$cluster" --services "$service" \
                    --query 'services[0].taskDefinition' --output text)
                  image=$(aws ecs describe-task-definition --task-definition "$task_def" \
                    --query 'taskDefinition.containerDefinitions[0].image' --output text)
                  echo "image_tag=${image##*:}" >> "$GITHUB_OUTPUT"
            # THE check the pipeline was missing. `cdk deploy` succeeding proves the stack converged; it
            # does not prove the service serves traffic, and `/health` alone does not prove a BROWSER can
            # reach it — a CORS preflight is sent without credentials, so a service whose auth runs first
            # answers 401 and is unusable from every browser while staying 200 to curl. Verified against
            # both a genuinely broken service (exit 1) and a working one (exit 0).
            - name: Smoke test — deployed recipe service is live, browser-reachable and CURRENT
              if: steps.changes.outputs.recipe == 'true'
              run: |
                  npx tsx packages/services/recipe-service/infra/smoke/deployedSmoke.ts \
                    "https://recipe-${STAGE}.${{ vars.DOMAIN_NAME }}" \
                    "https://${STAGE}.sandbox.${{ vars.DOMAIN_NAME }}" \
                    "${IMAGE_TAG}" \
                    "${{ steps.running.outputs.image_tag }}"
