name: Sandbox Identity Deploy

# Persistent shared SANDBOX identity environment (STAGE=sandbox) at identity.sandbox.commise.app /
# registration.identity.sandbox.commise.app. Unlike sandbox-deploy.yml (ephemeral pr-{N} services),
# this is a single long-lived environment — NOT destroyed on PR close. It deploys per-service,
# independently, whenever that service's code changes OR its stack doesn't exist yet, so any PR that
# touches identity converges the sandbox to the PR's code. A global-infra change redeploys both
# consumers; workflow_dispatch deploys everything.

on:
    pull_request:
        branches: [main]
        paths:
            - 'packages/infra/global/**'
            - 'packages/services/identity/**'
            - 'packages/services/identity-webhooks/**'
            - 'Dockerfile'
            - '.github/workflows/sandbox-identity-deploy.yml'
    workflow_dispatch:

# NO `id-token: write` — the single `deploy` job authenticates to AWS with STATIC access keys, never OIDC,
# so the grant was dead privilege (same removal as prod-deploy.yml / sandbox-deploy.yml). Re-add it on the
# job that assumes a role if this is ever migrated to OIDC.
permissions:
    contents: read

concurrency:
    # One shared sandbox env — serialize deploys (no cancel, so an in-flight deploy completes).
    group: sandbox-identity-deploy
    cancel-in-progress: false

env:
    NODE_VERSION: 24
    DEFAULT_AWS_REGION: ${{ vars.DEFAULT_AWS_REGION }}
    CDK_DEFAULT_REGION: ${{ vars.DEFAULT_AWS_REGION }}
    CDK_DEFAULT_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
    STAGE: sandbox
    DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}

jobs:
    deploy:
        name: Deploy Sandbox Identity
        runs-on: ubuntu-latest

        # Binds the one job here — which authenticates to AWS with static keys and deploys the PERSISTENT
        # shared sandbox identity tier — to the `Sandbox` GitHub Environment. Full rationale, including what
        # this does and does NOT buy while the AWS keys are ORGANIZATION secrets (which cannot be
        # environment-scoped) and why `Sandbox` must keep zero protection rules, is on `sandbox-deploy.yml`'s
        # `cleanup` job. Note the asymmetry with prod-deploy.yml: this tier is shared and long-lived, but its
        # trigger is `pull_request`, so an approval rule would gate every identity-touching PR.
        environment: Sandbox

        # ⚠️ Scoped to this job, NOT to the workflow-level `env:` above (same change as prod-deploy.yml). A
        # workflow-level secret read is in scope for EVERY job in the file — including any added later that
        # has no business with it — and no per-job Environment binding can narrow it back down. Sole consumer
        # is the identity-webhooks CDK deploy's source-map upload, which no-ops while the secret is unset (it
        # is set at neither repo nor organization scope today, so this move is behaviour-neutral).
        env:
            SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

        steps:
            # ⚠️ DELIBERATE: this checkout KEEPS its git credential (`persist-credentials` left at its `true`
            # default), unlike the rest of the repo. `dorny/paths-filter` below is NOT gated on the event, and
            # its GitHub-API code path applies only to `pull_request`; on the `workflow_dispatch` trigger it
            # falls through to `getChangedFilesFromGit`, which fetches the base ref from `origin`. Same
            # reasoning as prod-deploy.yml's `deploy` job — see the note there.
            #
            # The `zizmor: ignore[artipacked]` below is how that exception is DECLARED, per-site, so the gate in
            # zizmor.yml can sit at the `low` floor and still fail on any artipacked we have NOT accepted. It is
            # scoped to this ONE step and to that ONE audit: every other finding here still reports, and the
            # other checkout in this file keeps `persist-credentials: false`. Removing the paths-filter step (or
            # gating it to `pull_request` only) means dropping BOTH the credential and this ignore.
            - name: Checkout # zizmor: ignore[artipacked]
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

            - name: Detect changes
              uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
              id: changes
              with:
                  filters: |
                      global:
                        - 'packages/infra/global/**'
                      service:
                        - 'packages/services/identity/**'
                        - 'Dockerfile'
                      webhooks:
                        - 'packages/services/identity-webhooks/**'

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ env.DEFAULT_AWS_REGION }}

            # Deploy a service when its code changed OR its sandbox stack doesn't exist yet (so the
            # environment self-heals / bootstraps on the first PR). A global-infra change (or missing
            # network stack) forces both consumers to redeploy.
            - name: Compute deploy flags
              id: flags
              # Every `${{ … }}` arrives through `env:` and is read as a quoted shell variable, never
              # interpolated into the script text: GitHub substitutes expressions BEFORE bash parses the
              # body, so an interpolated value is source code, whereas an env var is only ever data.
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  CHANGED_GLOBAL: ${{ steps.changes.outputs.global }}
                  CHANGED_SERVICE: ${{ steps.changes.outputs.service }}
                  CHANGED_WEBHOOKS: ${{ steps.changes.outputs.webhooks }}
              run: |
                  stack_exists() { aws cloudformation describe-stacks --stack-name "$1" >/dev/null 2>&1; }
                  global_missing=false; service_missing=false; webhooks_missing=false
                  # ⛔ BOTH stacks are probed, and the ALB is the one that can actually be gone.
                  # This gate used to ask only about the network stack, which was correct while the sandbox
                  # ALB was permanent. ADR-0028's 2026-08-30 amendment made `kitchensink-alb-sandbox`
                  # reclaimable — it is deleted with the tier and rebuilt here — while the network stack,
                  # which owns the VPC and the NAT the RDS needs, deliberately OUTLIVES it. So the two no
                  # longer imply one another: a reaped tier leaves the network stack standing, the old probe
                  # answers `global_missing=false`, the global-sandbox deploy is skipped, and the identity
                  # deploy then dies resolving `SharedAlbHttpsListenerArn` from a stack that no longer
                  # exists. Probing the stack that can vanish is what makes the button self-healing.
                  stack_exists "kitchensink-network-sandbox" || global_missing=true
                  stack_exists "kitchensink-alb-sandbox" || global_missing=true
                  stack_exists "kitchensink-identity-service-sandbox" || service_missing=true
                  stack_exists "kitchensink-identity-webhooks-sandbox" || webhooks_missing=true

                  deploy_global=false; deploy_service=false; deploy_webhooks=false
                  if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$CHANGED_GLOBAL" = "true" ] || [ "$global_missing" = "true" ]; then
                    deploy_global=true; deploy_service=true; deploy_webhooks=true
                  fi
                  if [ "$CHANGED_SERVICE" = "true" ] || [ "$service_missing" = "true" ]; then deploy_service=true; fi
                  if [ "$CHANGED_WEBHOOKS" = "true" ] || [ "$webhooks_missing" = "true" ]; then deploy_webhooks=true; fi
                  run_migrations=false
                  if [ "$deploy_service" = "true" ] || [ "$deploy_webhooks" = "true" ]; then run_migrations=true; fi
                  {
                    echo "deploy_global=$deploy_global"
                    echo "deploy_service=$deploy_service"
                    echo "deploy_webhooks=$deploy_webhooks"
                    echo "run_migrations=$run_migrations"
                  } >> "$GITHUB_OUTPUT"
                  echo "global=$deploy_global service=$deploy_service webhooks=$deploy_webhooks migrations=$run_migrations (missing: g=$global_missing s=$service_missing w=$webhooks_missing)"

            # ⛔ ADR-0007 × ADR-0022 — the SAME composition that wedged `kitchensink-recipe-service-pr-91`,
            # and this tier is the one that hurts most. The shared sandbox RDS instance is STOPPED nightly
            # 00:00–09:00 ET; `IdentityServiceStack` carries an in-stack migration Trigger, `DataStack`'s
            # bootstrap custom resources CREATE databases and roles, and the five webhook Lambdas all talk
            # to the same instance. An identity deploy inside that window hits the identical
            # `connect ETIMEDOUT …:5432`, fails the update, fails the rollback, and rests in
            # `UPDATE_ROLLBACK_FAILED` — on the SINGLE shared identity service every PR preview signs in
            # against, so the blast radius is every open preview rather than one PR.
            #
            # Run whenever ANY stack in this workflow will deploy. Nothing here keeps the tier awake and
            # the nightly schedule is untouched (ADR-0007's cost intent stands); the script takes no
            # instance argument by construction, so it cannot address the prod database.
            - name: Wake the shared sandbox database
              if: |
                  steps.flags.outputs.deploy_global == 'true' ||
                  steps.flags.outputs.deploy_service == 'true' ||
                  steps.flags.outputs.deploy_webhooks == 'true'
              run: bash .github/scripts/sandbox-wake.sh ensure "${DEFAULT_AWS_REGION}"

            - name: Setup Node.js
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build identity service package
              if: steps.flags.outputs.deploy_service == 'true'
              # turbo (not a bare workspace build) so `^build` compiles the shared
              # @kitchensink/identity-utils dist first — the image copies that dist and crash-loops
              # without it (KTD2a). nest build alone does not build workspace dependencies.
              run: npx turbo run build --filter=@kitchensink/identity-service

            - name: Prepare identity service Docker image
              if: steps.flags.outputs.deploy_service == 'true'
              run: npm run docker:prepare --workspace=packages/services/identity

            - name: Build webhooks package
              if: steps.flags.outputs.deploy_webhooks == 'true'
              # turbo (not plain npm) so the workspace DEPENDENCY graph is built too: the CDK
              # entrypoint imports @kitchensink/infra-security, whose built dist must exist before
              # `node .../infra/dist/bin/app.js` can load it (ADR-0013).
              run: npx turbo run build --filter=@kitchensink/identity-webhooks

            - name: Build global infra
              if: steps.flags.outputs.deploy_global == 'true'
              # turbo (not plain npm) so the workspace DEPENDENCY graph is built too — see the
              # webhooks build step above and ADR-0013.
              run: npx turbo run build --filter=@kitchensink/infra-global

            # `build` is tsc only — it does NOT bundle the DataStack's custom-resource handlers. Without this
            # step `dist-lambda/` is absent at synth and the DataStack ships an inline placeholder instead of
            # the real food/recipe bootstrap, which is how BOTH stages came to hold 217-byte stubs that
            # created no `food_app`/`recipe_app` role while CloudFormation reported success. Must stay ABOVE
            # the prune below: `bundle:lambda` runs esbuild, a devDependency the prune deletes (exit 127).
            # Guarded by globalBootstrapBundle.test.ts, which discovers every global-deploying workflow.
            - name: Bundle global infra custom-resource handlers
              if: steps.flags.outputs.deploy_global == 'true'
              run: npm run bundle:lambda --workspace=packages/infra/global

            - name: Build identity service infra
              if: steps.flags.outputs.deploy_service == 'true'
              run: npm run infra:build --workspace=packages/services/identity

            - name: Build identity-webhooks infra
              if: steps.flags.outputs.deploy_webhooks == 'true'
              run: npm run infra:build --workspace=packages/services/identity-webhooks

            # ⛔ Same two constraints as the prod pipeline: ABOVE the prune (`esbuild` is a devDependency,
            # so a bundle on the far side of it exits 127) and above the identity `cdk deploy` (the stack
            # ships `dist-lambda/` as the migration runner's asset, and an unbundled deploy ships a
            # placeholder that THROWS and fails the in-deploy migration trigger).
            - name: Bundle identity migration runner Lambda
              if: steps.flags.outputs.deploy_service == 'true'
              run: npm run bundle:lambda --workspace=packages/services/identity

            - name: Prune dev dependencies
              run: npm prune --omit=dev

            - name: Verify runtime dependencies
              run: |
                  node -e "require('aws-cdk-lib')" || (echo 'FATAL: aws-cdk-lib missing after prune' && exit 1)

            - name: Resolve AWS Account ID
              id: account
              run: echo "id=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_OUTPUT"

            - name: Login to Amazon ECR
              id: login-ecr
              if: steps.flags.outputs.deploy_service == 'true'
              uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

            - name: Ensure ECR repository exists
              if: steps.flags.outputs.deploy_service == 'true'
              run: bash .github/scripts/ecr-ensure-repo.sh kitchensink-identity

            - name: Build, tag, and push identity service Docker image
              if: steps.flags.outputs.deploy_service == 'true'
              env:
                  ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
                  IMAGE_TAG: sandbox-${{ github.sha }}
              run: |
                  docker buildx build --platform linux/amd64 -f packages/services/identity/Dockerfile -t ${ECR_REGISTRY}/kitchensink-identity:${IMAGE_TAG} --push .

            - name: CDK Bootstrap
              env:
                  ACCOUNT_ID: ${{ steps.account.outputs.id }}
              run: npx cdk bootstrap "aws://${ACCOUNT_ID}/${DEFAULT_AWS_REGION}"

            # `STAGE` is already exported to every step by the workflow-level `env:` block, so the old
            # `STAGE=${{ env.STAGE }}` command prefix was re-deriving a variable that was in scope — and
            # doing it by text substitution. Dropped rather than rewritten; the value reaching `cdk` is
            # identical.
            - name: CDK Deploy (global infra)
              if: steps.flags.outputs.deploy_global == 'true'
              run: npx cdk deploy --app "node packages/infra/global/dist/bin/app.js" --all --require-approval never

            # ⛔ `cdk deploy` exiting 0 proves the stacks CONVERGED, not that the things inside them arrived.
            # Both stages ran this tier with 217-byte bootstrap STUBS that created no `food_app`/`recipe_app`
            # role while CloudFormation reported success — see the bundle step above, which now stops that
            # particular cause. This stops the class: a Lambda that deployed and cannot run, a resource left
            # at its previous revision by a rollback, a handler pointed at a resource no account contains.
            #
            # The stack list is DERIVED by synthesising the same `--app` string above, so the sandbox-only
            # `kitchensink-sandbox-scheduler-sandbox` is picked up without anybody listing it.
            # `deployVerificationCoverage.test.ts` asserts the two strings stay byte-identical.
            - name: Verify the global infra deployment — every resource and handler
              if: steps.flags.outputs.deploy_global == 'true'
              run: |
                  bash .github/scripts/verify-deployment.sh verify "${DEFAULT_AWS_REGION}" \
                    "node packages/infra/global/dist/bin/app.js"

            - name: Resolve Identity VPC ID
              id: identity-vpc
              run: echo "vpc_id=$(bash .github/scripts/cfn-export.sh 'kitchensink-network-sandbox:VpcId')" >> "$GITHUB_OUTPUT"

            # The CDK app reads these from `process.env`, so declaring them in `env:` delivers them exactly
            # as the old command-prefix assignments did — without building the command line out of
            # expression text. `STAGE` comes from the workflow-level `env:` (see above).
            - name: CDK Deploy (identity service)
              if: steps.flags.outputs.deploy_service == 'true'
              env:
                  IDENTITY_IMAGE_TAG: sandbox-${{ github.sha }}
                  IDENTITY_VPC_ID: ${{ steps.identity-vpc.outputs.vpc_id }}
              run: npx cdk deploy --app "node packages/services/identity/infra/dist/bin/app.js" --all --require-approval never

            # The identity stack's RESOURCE check. The smoke at the end of this job asserts the ORIGIN and
            # says nothing about the stack's Lambdas — among them the migration runner the next step invokes,
            # whose asset an unbundled deploy replaces with an inline placeholder that THROWS inside the
            # ADR-0022 Trigger, somewhere no origin probe can see.
            - name: Verify the identity service deployment — every resource and handler
              if: steps.flags.outputs.deploy_service == 'true'
              env:
                  IDENTITY_IMAGE_TAG: sandbox-${{ github.sha }}
                  IDENTITY_VPC_ID: ${{ steps.identity-vpc.outputs.vpc_id }}
              run: |
                  bash .github/scripts/verify-deployment.sh verify "${DEFAULT_AWS_REGION}" \
                    "node packages/services/identity/infra/dist/bin/app.js"

            # The SAFETY NET, not the mechanism: the schema is applied INSIDE the deploy above by an
            # `aws-cdk-lib/triggers` Trigger the ECS service depends on. Kept because it is idempotent and
            # catches a stage whose schema is behind for a reason no code change explains. ⛔ Must stay
            # AFTER the deploy that ships its bundle — hoisting it invokes the previous deploy's Lambda
            # with the previous migration set, which exits 0 having applied nothing.
            #
            # ⛔ UNGATED, matching prod: `if: run_migrations == 'true'` is a path diff, and it skips this net
            # in exactly the case ADR-0022 §4 keeps it for. Safe because `schema_migrations` is keyed by
            # FILENAME with no checksum and the runner skips on a name match, so a run against an up-to-date
            # database applies nothing. The invoke goes through the ONE definition of "did the runner
            # succeed" — `aws lambda invoke` exits 0 when the FUNCTION threw.
            #
            # ⚠️ Unlike the per-PR legs in `sandbox-deploy.yml`, this job has no ADR-0007 wake step to be
            # ordered behind. That is correct here: the SHARED sandbox identity tier is what the nightly
            # stop/start schedule brings back at 09:00 ET, and this workflow runs on `pull_request`, not on
            # the schedule.
            - name: Run identity DB migrations (always — ADR-0022 §4 safety net)
              run: |
                  bash .github/scripts/run-migrations.sh run "${DEFAULT_AWS_REGION}" \
                    "kitchensink-identity-service-${STAGE}" IdentityMigrationFunctionName identity

            - name: CDK Deploy (identity-webhooks)
              if: steps.flags.outputs.deploy_webhooks == 'true'
              env:
                  IDENTITY_VPC_ID: ${{ steps.identity-vpc.outputs.vpc_id }}
                  SENTRY_RELEASE: ${{ github.sha }}
              run: npx cdk deploy --app "node packages/services/identity-webhooks/infra/dist/bin/app.js" --all --require-approval never

            # ⛔ THE only post-deploy signal this stack has ever had, and the one that needed it most: the
            # webhooks app serves no origin, so every check in this file was blind to it. It is five
            # DB-touching Lambdas behind an API Gateway — the Clerk webhook, the SQS deletion worker, the
            # nightly reconciliation, the log forwarder and a migration runner — that no smoke can reach. A
            # `user.created` dropped by a crash-looping handler stays invisible until somebody notices a
            # Clerk account with no row, which is exactly the 2026-06-15 sandbox incident.
            #
            # ⚠️ WebhooksStack deliberately has NO in-stack migration barrier (ADR-0022) — its Lambdas are
            # ordered by deploying AFTER the identity service — so the references those handlers carry are
            # asserted here against the account rather than left to the ordering.
            - name: Verify the identity-webhooks deployment — every handler and reference
              if: steps.flags.outputs.deploy_webhooks == 'true'
              env:
                  IDENTITY_VPC_ID: ${{ steps.identity-vpc.outputs.vpc_id }}
                  SENTRY_RELEASE: ${{ github.sha }}
              run: |
                  bash .github/scripts/verify-deployment.sh verify "${DEFAULT_AWS_REGION}" \
                    "node packages/services/identity-webhooks/infra/dist/bin/app.js"

            # Post-deploy smoke test. `cdk deploy` returning success only means the stack converged —
            # it does NOT prove the service serves traffic. Hit the public /health end-to-end
            # (DNS -> shared ALB -> host-based listener rule -> ECS task) so a broken ALB host rule, an
            # unhealthy/crash-looping task, or a cert/DNS regression fails the deploy instead of
            # silently shipping a dead service. Sandbox stage => identity.sandbox.<domain>.
            - name: Smoke test — identity service live & reachable (sandbox)
              if: steps.flags.outputs.deploy_service == 'true'
              env:
                  HEALTH_URL: https://identity.sandbox.${{ vars.DOMAIN_NAME }}/health
              run: |
                  set -uo pipefail
                  echo "Smoke-testing $HEALTH_URL"
                  attempts=20; delay=15; code=000
                  for i in $(seq 1 "$attempts"); do
                    code=$(curl -s -o /tmp/health.out -w '%{http_code}' --max-time 10 "$HEALTH_URL" || true)
                    [ -z "$code" ] && code=000
                    if [ "$code" = "200" ]; then
                      echo "✅ identity healthy (HTTP 200) on attempt $i: $(cat /tmp/health.out)"
                      exit 0
                    fi
                    echo "attempt $i/$attempts: HTTP $code at $HEALTH_URL — retrying in ${delay}s"
                    sleep "$delay"
                  done
                  echo "::error::identity not serving HTTP 200 at $HEALTH_URL after ~$((attempts * delay))s (last=$code)"
                  exit 1

            # …and CURRENT. The step above proves a container ANSWERS; it does not prove THIS deploy landed —
            # a task running a build from weeks ago returns the same 200, which is how a stale recipe build
            # served pr-73 for fifteen days. Prod has had this assertion since #137; the shared sandbox
            # identity service — the ONE identity every PR preview signs in against — did not, so a rollout
            # the ECS circuit breaker rolled BACK shipped green here. Cluster + service come from the stack's
            # own exports, so a renamed cluster fails loudly rather than matching nothing.
            #
            # ⚠️ NO `--web-origin`, unlike the prod leg, and the reason is specific rather than an oversight:
            # identity DOES enable CORS, but its allowlist is DERIVED per stage from
            # `CLERK_AUTHORIZED_PARTIES` / `CLERK_AZP_PATTERN` (`config/cors.ts`), and on sandbox every caller
            # is a different `pr-{N}.sandbox.<domain>` origin. There is no single stable browser origin this
            # workflow could name, and naming the wrong one reds the deploy for a reason unrelated to it.
            # Browser reachability for this service is asserted on prod, where the origin is one value.
            - name: Smoke test — identity service CURRENT (sandbox)
              if: steps.flags.outputs.deploy_service == 'true'
              env:
                  EXPECTED_IMAGE_TAG: sandbox-${{ github.sha }}
              run: |
                  set -euo pipefail
                  # `>&2` on the diagnostic, NOT stdout: this runs inside `$( … )`, so an `::error::` written
                  # to stdout is captured into the variable and never reaches the log.
                  lookup() {
                    local name="$1" value
                    value=$(bash .github/scripts/cfn-export.sh --optional "${name}")
                    if [ -z "$value" ] || [ "$value" = "None" ]; then
                      echo "::error::CloudFormation export '${name}' not found — is kitchensink-identity-service-${STAGE} deployed?" >&2
                      exit 1
                    fi
                    echo "$value"
                  }
                  cluster=$(lookup "kitchensink-identity-service-${STAGE}:IdentityClusterArn")
                  service=$(lookup "kitchensink-identity-service-${STAGE}:IdentityServiceArn")
                  task_def=$(aws ecs describe-services --cluster "$cluster" --services "$service" \
                    --query 'services[0].taskDefinition' --output text)
                  image=$(aws ecs describe-task-definition --task-definition "$task_def" \
                    --query 'taskDefinition.containerDefinitions[0].image' --output text)
                  npx tsx packages/services/recipe-service/infra/smoke/deployedSmoke.ts \
                    --base-url "https://identity.sandbox.${DOMAIN_NAME}" \
                    --expected-image-tag "${EXPECTED_IMAGE_TAG}" \
                    --running-image-tag "${image##*:}" \
                    || { echo "::error::the DEPLOYED SANDBOX IDENTITY service failed post-deploy verification (running image ${image##*:}, expected ${EXPECTED_IMAGE_TAG})" >&2; exit 1; }
