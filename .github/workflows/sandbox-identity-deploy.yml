name: Sandbox Identity Deploy

# Persistent shared SANDBOX identity environment (STAGE=sandbox) at identity.sandbox.commise.app /
# registration.identity.sandbox.commise.app. Unlike sandbox-deploy.yml (ephemeral pr-{N} services),
# this is a single long-lived environment — NOT destroyed on PR close. It deploys per-service,
# independently, whenever that service's code changes OR its stack doesn't exist yet, so any PR that
# touches identity converges the sandbox to the PR's code. A global-infra change redeploys both
# consumers; workflow_dispatch deploys everything.

on:
    pull_request:
        branches: [main]
        paths:
            - 'packages/infra/global/**'
            - 'packages/services/identity/**'
            - 'packages/services/identity-webhooks/**'
            - 'Dockerfile'
            - '.github/workflows/sandbox-identity-deploy.yml'
    workflow_dispatch:

permissions:
    id-token: write
    contents: read

concurrency:
    # One shared sandbox env — serialize deploys (no cancel, so an in-flight deploy completes).
    group: sandbox-identity-deploy
    cancel-in-progress: false

env:
    NODE_VERSION: 24
    DEFAULT_AWS_REGION: ${{ vars.DEFAULT_AWS_REGION }}
    CDK_DEFAULT_REGION: ${{ vars.DEFAULT_AWS_REGION }}
    CDK_DEFAULT_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
    STAGE: sandbox
    DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
    SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

jobs:
    deploy:
        name: Deploy Sandbox Identity
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Detect changes
              uses: dorny/paths-filter@v3
              id: changes
              with:
                  filters: |
                      global:
                        - 'packages/infra/global/**'
                      service:
                        - 'packages/services/identity/**'
                        - 'Dockerfile'
                      webhooks:
                        - 'packages/services/identity-webhooks/**'

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ env.DEFAULT_AWS_REGION }}

            # Deploy a service when its code changed OR its sandbox stack doesn't exist yet (so the
            # environment self-heals / bootstraps on the first PR). A global-infra change (or missing
            # network stack) forces both consumers to redeploy.
            - name: Compute deploy flags
              id: flags
              run: |
                  stack_exists() { aws cloudformation describe-stacks --stack-name "$1" >/dev/null 2>&1; }
                  global_missing=false; service_missing=false; webhooks_missing=false
                  stack_exists "kitchensink-identity-network-sandbox" || global_missing=true
                  stack_exists "kitchensink-identity-service-sandbox" || service_missing=true
                  stack_exists "kitchensink-identity-webhooks-sandbox" || webhooks_missing=true

                  deploy_global=false; deploy_service=false; deploy_webhooks=false
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ steps.changes.outputs.global }}" = "true" ] || [ "$global_missing" = "true" ]; then
                    deploy_global=true; deploy_service=true; deploy_webhooks=true
                  fi
                  if [ "${{ steps.changes.outputs.service }}" = "true" ] || [ "$service_missing" = "true" ]; then deploy_service=true; fi
                  if [ "${{ steps.changes.outputs.webhooks }}" = "true" ] || [ "$webhooks_missing" = "true" ]; then deploy_webhooks=true; fi
                  run_migrations=false
                  if [ "$deploy_service" = "true" ] || [ "$deploy_webhooks" = "true" ]; then run_migrations=true; fi
                  {
                    echo "deploy_global=$deploy_global"
                    echo "deploy_service=$deploy_service"
                    echo "deploy_webhooks=$deploy_webhooks"
                    echo "run_migrations=$run_migrations"
                  } >> "$GITHUB_OUTPUT"
                  echo "global=$deploy_global service=$deploy_service webhooks=$deploy_webhooks migrations=$run_migrations (missing: g=$global_missing s=$service_missing w=$webhooks_missing)"

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build identity service package
              if: steps.flags.outputs.deploy_service == 'true'
              run: npm run build --workspace=packages/services/identity

            - name: Prepare identity service Docker image
              if: steps.flags.outputs.deploy_service == 'true'
              run: npm run docker:prepare --workspace=packages/services/identity

            - name: Build webhooks package
              if: steps.flags.outputs.deploy_webhooks == 'true'
              run: npm run build --workspace=packages/services/identity-webhooks

            - name: Build global infra
              if: steps.flags.outputs.deploy_global == 'true'
              run: npm run build --workspace=packages/infra/global

            - name: Build identity service infra
              if: steps.flags.outputs.deploy_service == 'true'
              run: npm run infra:build --workspace=packages/services/identity

            - name: Build identity-webhooks infra
              if: steps.flags.outputs.deploy_webhooks == 'true'
              run: npm run infra:build --workspace=packages/services/identity-webhooks

            - name: Prune dev dependencies
              run: npm prune --omit=dev

            - name: Verify runtime dependencies
              run: |
                  node -e "require('aws-cdk-lib')" || (echo 'FATAL: aws-cdk-lib missing after prune' && exit 1)

            - name: Resolve AWS Account ID
              id: account
              run: echo "id=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_OUTPUT"

            - name: Login to Amazon ECR
              id: login-ecr
              if: steps.flags.outputs.deploy_service == 'true'
              uses: aws-actions/amazon-ecr-login@v2

            - name: Ensure ECR repository exists
              if: steps.flags.outputs.deploy_service == 'true'
              run: aws ecr describe-repositories --repository-names kitchensink-identity || aws ecr create-repository --repository-name kitchensink-identity

            - name: Build, tag, and push identity service Docker image
              if: steps.flags.outputs.deploy_service == 'true'
              env:
                  ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
                  IMAGE_TAG: sandbox-${{ github.sha }}
              run: |
                  docker buildx build --platform linux/amd64 -f packages/services/identity/Dockerfile -t ${ECR_REGISTRY}/kitchensink-identity:${IMAGE_TAG} --push .

            - name: CDK Bootstrap
              run: npx cdk bootstrap aws://${{ steps.account.outputs.id }}/${DEFAULT_AWS_REGION}

            - name: CDK Deploy (global infra)
              if: steps.flags.outputs.deploy_global == 'true'
              run: STAGE=${{ env.STAGE }} npx cdk deploy --app "node packages/infra/global/dist/bin/app.js" --all --require-approval never

            - name: Resolve Identity VPC ID
              id: identity-vpc
              run: echo "vpc_id=$(aws cloudformation list-exports --query "Exports[?Name=='kitchensink-identity-network-sandbox:IdentityVpcId'].Value" --output text)" >> "$GITHUB_OUTPUT"

            - name: CDK Deploy (identity service)
              if: steps.flags.outputs.deploy_service == 'true'
              run: STAGE=${{ env.STAGE }} IDENTITY_IMAGE_TAG=sandbox-${{ github.sha }} IDENTITY_VPC_ID=${{ steps.identity-vpc.outputs.vpc_id }} npx cdk deploy --app "node packages/services/identity/infra/dist/bin/app.js" --all --require-approval never

            - name: CDK Deploy (identity-webhooks)
              if: steps.flags.outputs.deploy_webhooks == 'true'
              run: STAGE=${{ env.STAGE }} IDENTITY_VPC_ID=${{ steps.identity-vpc.outputs.vpc_id }} SENTRY_RELEASE=${{ github.sha }} npx cdk deploy --app "node packages/services/identity-webhooks/infra/dist/bin/app.js" --all --require-approval never

            - name: Run identity DB migrations
              if: steps.flags.outputs.run_migrations == 'true'
              run: |
                  set -euo pipefail
                  FN=$(aws cloudformation list-exports \
                    --query "Exports[?Name=='kitchensink-identity-webhooks-${STAGE}:MigrationFunctionName'].Value" \
                    --output text)
                  echo "Invoking migration runner: $FN"
                  ERR=$(aws lambda invoke --function-name "$FN" --query 'FunctionError' --output text /tmp/migrate-out.json)
                  echo "Result: $(cat /tmp/migrate-out.json)"
                  if [ "$ERR" != "None" ]; then echo "::error::identity DB migration failed"; exit 1; fi
