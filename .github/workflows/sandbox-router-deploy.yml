name: Sandbox Router Deploy

# Persistent SINGLETON sandbox PR router (CloudFront + CloudFront Function + KeyValueStore) at
# sandbox.commise.app — serves both path (/pr-{N}) and subdomain (pr-{N}.sandbox…) addressing. Deployed
# once / on change — NOT per-PR. The per-PR KVS routes are written by the preview workflow
# (register-preview); this workflow owns the long-lived infrastructure and seeds the single project-wide
# Vercel bypass key. See docs/architecture/decisions/0001.
#
# DRIFT AUTO-HEAL: because this is a global singleton nothing else recreates, an out-of-band delete
# (as happened 2026-06-21 → ~3 weeks of NXDOMAIN previews with no signal) leaves it dead until a
# qualifying push. The daily `schedule` below re-runs the idempotent deploy (a no-op when the router
# already matches, a full recreate when it is gone) and loudly annotates when it had to heal.

on:
    push:
        branches: [main]
        paths:
            - 'packages/apps/commise/web/infra/**'
            - 'packages/apps/commise/web/router/**'
            - '.github/workflows/sandbox-router-deploy.yml'
    # Daily drift-heal. Scheduled runs execute from the default branch only, so this activates once this
    # workflow is on main — at which point main also carries the subdomain-capable router it deploys.
    schedule:
        - cron: '0 13 * * *'
    workflow_dispatch: {}

concurrency:
    # One shared router — serialize so an in-flight deploy completes.
    group: sandbox-router-deploy
    cancel-in-progress: false

permissions:
    contents: read

env:
    STAGE: sandbox
    DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
    # CloudFront + its ACM cert live in us-east-1 regardless of the default region.
    AWS_REGION: us-east-1

jobs:
    deploy:
        name: Deploy sandbox router
        runs-on: ubuntu-latest
        # Authenticates to AWS and deploys the singleton sandbox router, then seeds the Vercel bypass key into
        # its KVS — so it reads three secrets. Full `Sandbox` rationale on `sandbox-deploy.yml`'s `cleanup`
        # job. Zero protection rules matters here too: this workflow's whole purpose includes a DAILY
        # drift-heal of a singleton whose out-of-band deletion once left every preview NXDOMAIN for three
        # weeks, and an approval gate would leave that heal pending instead of applied.
        environment: Sandbox
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ env.AWS_REGION }}
            # Drift detection BEFORE deploy: if the singleton is gone, something deleted it out-of-band and
            # sandbox.commise.app has been NXDOMAIN (all web previews broken). Surface that loudly; the
            # deploy below heals it. On the daily schedule this is the auto-remediation signal.
            - name: Detect router drift
              run: |
                  if aws cloudformation describe-stacks --stack-name kitchensink-sandbox-router-sandbox >/dev/null 2>&1; then
                      echo "Router present — deploy is a no-op unless the template changed."
                  else
                      echo "::error title=Sandbox router was MISSING::kitchensink-sandbox-router-sandbox did not exist — deleted out-of-band, so sandbox.commise.app was NXDOMAIN and every web preview was broken. Healing now."
                      {
                          echo "### ⚠️ Sandbox router was missing — healed";
                          echo "The singleton router had been deleted out-of-band; this run recreated it.";
                          echo "Per-PR KVS routes are lost with the old store and re-register on each PR's next sync.";
                      } >> "$GITHUB_STEP_SUMMARY"
                  fi
            # ⛔ THE STEP THAT WAS MISSING, and its absence is the third instance of a failure this repo has
            # already paid for twice. `infra:deploy` runs the router app under `npx tsx`, and that app
            # imports `@kitchensink/infra-security`, which exports `./dist` — deliberately, because the
            # COMPILED CDK apps run under plain `node`, whose type-stripping resolves a `.js` specifier
            # inside a `.ts` file literally rather than through `extensionAlias` (ADR-0013). `dist/` is
            # gitignored and no `prepare` script builds it, so on a fresh runner `npm ci` leaves it absent
            # and the deploy dies on `ERR_MODULE_NOT_FOUND … infra-security/dist/index.js` — the same error,
            # verbatim, that broke every sandbox food deploy when `infra-alb` landed.
            #
            # ⚠️ `cdkEntrypointBuildOrder.test.ts` did not catch it, and could not: it reads ONE workflow
            # (`sandbox-deploy.yml`) and matches a literal `npx tsx …/infra/bin/*.ts` in a `run:` block,
            # while this job's tsx invocation lives inside `@commise/web`'s own `infra:deploy` script. That
            # guard's scope is worth widening — but its predicate demands the `^...` spelling specifically,
            # and prod-deploy legitimately uses `--filter=<pkg>` (turbo's `build` already `dependsOn:
            # ["^build"]`), so widening it as-is would manufacture false findings. Recorded rather than
            # bodged.
            #
            # ⛔ The filter is the DEPENDENCY CLOSURE, never a named package: a hand-written list of
            # dist-exporting dependencies is a second representation of the dependency graph, and it is
            # exactly what went stale last time. `^...` asks turbo for the real one.
            - name: Build the workspace packages the router app imports
              run: npx turbo run build --filter='@commise/web^...'
            - name: Deploy router stack (bundles the function, then cdk deploy)
              run: npm run infra:deploy --workspace=@commise/web
            # ⛔ `cdk deploy` exiting 0 proves the stack CONVERGED, not that the router works — and this is a
            # SINGLETON whose silent absence once left every web preview NXDOMAIN for three weeks with no
            # signal. The drift check above catches "the stack is gone"; this catches the half-states it
            # cannot see, which for CloudFront is the likelier failure: a distribution or a function left at
            # its PREVIOUS revision by a rollback, so the router keeps serving the old routing table while
            # the deploy reports success.
            #
            # ⚠️ Run from the repo ROOT with a repo-relative app path, unlike the deploy above, whose `--app`
            # string lives in `@commise/web`'s manifest and is package-relative. The router app resolves its
            # bundle from `import.meta.url`, so it is cwd-independent and both spellings synthesise the same
            # stack. `deployVerificationCoverage.test.ts` resolves the manifest to compare them — a weaker
            # check than the byte-identical one the other workflows get, which is why this comment says so.
            - name: Verify the router deployment — every resource and handler
              run: |
                  bash .github/scripts/verify-deployment.sh verify "${AWS_REGION}" \
                    "npx tsx packages/apps/commise/web/infra/bin/app.ts"
            - name: Seed the project-wide Vercel bypass key into KVS
              env:
                  VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
              run: |
                  # Fail loudly rather than seed an EMPTY bypass key: an empty value makes the router forward
                  # without the token, so Vercel Deployment Protection 401s every preview — the exact silent
                  # failure mode from before this secret was set. A missing secret is a real misconfig, not a
                  # skip.
                  if [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
                    echo "::error title=Bypass secret unset::VERCEL_AUTOMATION_BYPASS_SECRET is empty — refusing to seed an empty vercel-bypass key (every preview would 401 at Vercel). Set the repo secret from the Vercel project's Protection Bypass for Automation." >&2
                    exit 1
                  fi
                  KVS_ARN=$(aws cloudformation describe-stacks --stack-name kitchensink-sandbox-router-sandbox \
                    --query "Stacks[0].Outputs[?OutputKey=='RouterKvsArn'].OutputValue | [0]" --output text)
                  if [ -z "$KVS_ARN" ] || [ "$KVS_ARN" = "None" ]; then echo "router KVS ARN not found" >&2; exit 1; fi
                  ETAG=$(aws cloudfront-keyvaluestore describe-key-value-store --kvs-arn "$KVS_ARN" --query ETag --output text)
                  aws cloudfront-keyvaluestore put-key \
                    --kvs-arn "$KVS_ARN" --key vercel-bypass \
                    --value "$VERCEL_AUTOMATION_BYPASS_SECRET" --if-match "$ETAG"
