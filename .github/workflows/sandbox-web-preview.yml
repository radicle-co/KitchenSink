name: Sandbox Web Preview Route

# Per-PR data layer for the singleton sandbox router (U5): when a PR's Vercel preview is ready, write
# pr-{N} → <preview host> into the router's CloudFront KeyValueStore so https://sandbox.commise.app/
# pr-{N}/ resolves; on PR close, remove it. The router infra is deployed separately + once
# (sandbox-router-deploy.yml). See docs/architecture/decisions/0001.

on:
    pull_request:
        types: [opened, synchronize, reopened, closed]

concurrency:
    group: sandbox-web-preview-${{ github.event.pull_request.number }}
    cancel-in-progress: true

# Workflow-level default is READ-ONLY on purpose. `deployments: write` is granted on the one job that
# needs it, not here: a workflow-level grant would be inherited by any job added later, which is exactly
# how a helper job ends up able to publish deployment statuses it has no business touching.
permissions:
    contents: read

env:
    AWS_REGION: us-east-1
    PR_NUMBER: ${{ github.event.pull_request.number }}

jobs:
    route:
        name: Update PR route in KVS
        runs-on: ubuntu-latest
        permissions:
            contents: read # checkout of this PR's tree
            deployments: write # publish the PR's own GitHub deployment pointing at the working preview URL
        # Only same-repo PRs may touch AWS/Vercel. Fork PRs get no repo secrets by default, but this
        # guard also blocks a future `pull_request_target` foot-gun from running fork code with creds.
        if: github.event.pull_request.head.repo.full_name == github.repository
        steps:
            # Surface the sandbox preview as a GitHub deployment, so the PR's "View deployment" button opens
            # the working, azp-matched friendly URL. Vercel's own preview button opens the bare deployment
            # host, which 404s/401s under our router + azp, so we publish our own. Independent of the
            # router/KVS steps below (pure GitHub API).
            #
            # ADR-0001 cutover: the repo variable SANDBOX_PREVIEW_MODE selects the addressing form —
            #   unset/`path`  → https://sandbox.commise.app/pr-{N}/   (path routing, default)
            #   `subdomain`   → https://pr-{N}.sandbox.commise.app/   (per-PR subdomains, post-cutover)
            # Flip this in lockstep with the Vercel build's SANDBOX_PREVIEW_MODE (which drives basePath) and
            # the backend CLERK_AZP_PREVIEW_MODE=transition. Default MUST stay path until the live cutover.
            - name: Publish sandbox preview deployment
              if: github.event.action != 'closed'
              uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
              env:
                  PREVIEW_MODE: ${{ vars.SANDBOX_PREVIEW_MODE }}
              with:
                  script: |
                      const pr = context.payload.pull_request.number;
                      const subdomain = process.env.PREVIEW_MODE === 'subdomain';
                      const url = subdomain
                          ? `https://pr-${pr}.sandbox.commise.app/`
                          : `https://sandbox.commise.app/pr-${pr}/`;
                      const mode = subdomain ? 'subdomain' : 'path-routed';
                      const dep = await github.rest.repos.createDeployment({
                          ...context.repo,
                          ref: context.payload.pull_request.head.sha,
                          environment: `sandbox-preview/pr-${pr}`,
                          transient_environment: true,
                          auto_merge: false,
                          required_contexts: [],
                          description: `${mode} sandbox preview`,
                      });
                      await github.rest.repos.createDeploymentStatus({
                          ...context.repo,
                          deployment_id: dep.data.id,
                          state: 'success',
                          environment_url: url,
                          description: `Open the ${mode} sandbox preview`,
                      });
            - name: Deactivate path-routed preview deployment on close
              if: github.event.action == 'closed'
              uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
              with:
                  script: |
                      const pr = context.payload.pull_request.number;
                      const deps = await github.rest.repos.listDeployments({
                          ...context.repo,
                          environment: `sandbox-preview/pr-${pr}`,
                      });
                      for (const d of deps.data) {
                          await github.rest.repos.createDeploymentStatus({
                              ...context.repo,
                              deployment_id: d.id,
                              state: 'inactive',
                          });
                      }
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ env.AWS_REGION }}
            - name: Resolve the router KVS ARN (from the router stack output)
              id: kvs
              run: |
                  # The router is a SINGLETON deployed separately (sandbox-router-deploy). Until it
                  # exists, per-PR routing simply can't be wired — that's a missing prerequisite, not a
                  # PR regression, so warn-and-skip instead of failing this check. (App is pre-launch.)
                  ARN=$(aws cloudformation describe-stacks --stack-name kitchensink-sandbox-router-sandbox \
                    --query "Stacks[0].Outputs[?OutputKey=='RouterKvsArn'].OutputValue | [0]" \
                    --output text 2>/dev/null || true)
                  if [ -z "$ARN" ] || [ "$ARN" = "None" ]; then
                    echo "::error title=Sandbox router missing::kitchensink-sandbox-router-sandbox is not deployed — this PR's preview is unreachable (sandbox.commise.app is NXDOMAIN). The daily 'Sandbox Router Deploy' auto-heals it; to fix now, run that workflow (workflow_dispatch)."
                    echo "found=false" >> "$GITHUB_OUTPUT"
                  else
                    echo "found=true" >> "$GITHUB_OUTPUT"
                    echo "arn=$ARN" >> "$GITHUB_OUTPUT"
                  fi

            # PR closed → remove the route (only if the router exists).
            - name: Deregister preview route
              if: github.event.action == 'closed' && steps.kvs.outputs.found == 'true'
              env:
                  ACTION: deregister
                  KVS_ARN: ${{ steps.kvs.outputs.arn }}
              run: npx tsx packages/apps/commise/web/scripts/registerPreview.ts

            # ── Deploy this PR's Vercel preview, because the git integration cannot ────────────────────
            #
            # Vercel deploys on PUSH and populates VERCEL_GIT_PULL_REQUEST_ID only for a deployment it can
            # associate with an OPEN pull request. A branch's FIRST deployment therefore NEVER has it — the
            # push necessarily precedes `gh pr create` — so `scripts/previewEndpoints.ts`, which needs the
            # number to resolve this PR's own recipe service, hard-fails that build:
            #
            #     Error: VERCEL_GIT_PULL_REQUEST_ID must be the pull request number, but was ''.
            #
            # Opening the PR does NOT trigger a rebuild (Vercel builds on push, not on PR events), so without
            # this step a freshly-opened PR is stuck with a failed preview until someone pushes again.
            #
            # So CI deploys it, passing the number as a per-deployment BUILD env var — the one thing a Vercel
            # dashboard variable structurally cannot be, since those are scoped to an ENVIRONMENT. Only
            # `opened`/`reopened`: a `synchronize` push already carries the association, and redeploying there
            # would double every preview build.
            # Created as a GIT-SOURCE deployment through the REST API, deliberately NOT with `vercel deploy`.
            # A CLI deployment is subject to Vercel's team-seat protection, which BLOCKS it unless the
            # COMMIT AUTHOR holds a seat on the Vercel team:
            #
            #   readyState: BLOCKED
            #   readyStateReason: "Git author <email> must have access to the team Radicle on Vercel to
            #                      create deployments."   (seatBlock.blockCode = TEAM_ACCESS_REQUIRED)
            #
            # Measured, not guessed: two `vercel deploy` runs were blocked before building. That coupling is
            # unacceptable here — it would make every preview depend on the author of the head commit being a
            # Vercel team member. A git-source deployment is authorized by the GitHub App instead, so it is
            # not seat-gated.
            #
            # It also removes the need to inject the PR number at all: Vercel resolves the PR from the branch
            # and sets `meta.githubPrId` (verified: 77 on this branch), so the build gets
            # VERCEL_GIT_PULL_REQUEST_ID the ordinary way. `PREVIEW_PR_NUMBER` remains supported by
            # scripts/previewEndpoints.ts as an explicit override, but is not needed on this path.
            #
            # No `target` field: the API rejects `"preview"` ("should be 'production', 'staging', or a custom
            # environment identifier"), and omitting it yields a preview deployment, which is what we want.
            - name: Deploy this PR's Vercel preview
              if: github.event.action == 'opened' || github.event.action == 'reopened'
              env:
                  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
                  VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
                  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
                  BRANCH: ${{ github.event.pull_request.head.ref }}
              run: |
                  set -euo pipefail
                  response=$(curl -sS -X POST \
                    -H "Authorization: Bearer $VERCEL_TOKEN" \
                    -H 'Content-Type: application/json' \
                    "https://api.vercel.com/v13/deployments?teamId=${VERCEL_TEAM_ID}&skipAutoDetectionConfirmation=1" \
                    -d "$(jq -nc --arg project "$VERCEL_PROJECT_ID" --arg ref "$BRANCH" \
                        '{name: "commise", project: $project,
                          gitSource: {type: "github", org: "radicle-co", repo: "KitchenSink", ref: $ref}}')")
                  # A failure here must not pass silently: the next step would then wait on the OLD, failed
                  # deployment and register a broken preview host.
                  if [ "$(printf '%s' "$response" | jq -r 'has("error")')" = "true" ]; then
                    echo "::error title=Vercel preview deploy failed::$(printf '%s' "$response" | jq -r '.error.message')"
                    exit 1
                  fi
                  printf '%s' "$response" |
                    jq -r '"created \(.url)  state=\(.readyState)  prId=\(.meta.githubPrId // "none")"'

            # PR open/updated → wait for the Vercel preview, capture its host, register the route.
            - name: Wait for the Vercel preview to be READY
              if: github.event.action != 'closed' && steps.kvs.outputs.found == 'true'
              id: preview
              uses: zentered/vercel-preview-url@fba568fc6d882ae788a9724d7e28dee618728771 # v1.4.0
              env:
                  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
              with:
                  vercel_team_id: ${{ vars.VERCEL_TEAM_ID }}
                  vercel_project_id: ${{ vars.VERCEL_PROJECT_ID }}
            - name: Register preview route
              if: github.event.action != 'closed' && steps.kvs.outputs.found == 'true'
              env:
                  ACTION: register
                  KVS_ARN: ${{ steps.kvs.outputs.arn }}
                  PREVIEW_HOST: ${{ steps.preview.outputs.preview_url }}
              run: npx tsx packages/apps/commise/web/scripts/registerPreview.ts
