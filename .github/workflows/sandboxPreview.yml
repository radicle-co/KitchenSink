name: Sandbox Preview (reusable)
#
# The per-PR preview deploy — DECIDING whether the preview should exist, then handing the actual work to
# `deployInfra.yml`.
#
# ⚠️  DELIBERATE — this is a REUSABLE workflow and it exists because GitHub Actions has no cross-workflow
#     `needs`. Two workflows triggered by the same `pull_request` event run independently, so a pipeline
#     that must read "deploy, then migrate, then test what was deployed" cannot span two of them.
#
# ⛔ WHAT THIS WORKFLOW NO LONGER DOES, AND WHY.
#
# It used to carry two jobs — `deploy-food` (24 steps) and `deploy-recipe` (32 steps, deploying FOUR
# packages) — that ran `cdk deploy` directly. `deployInfra.yml` now owns every deploy, one job per
# `infra/` folder, so those are gone. The reason is not tidiness: two workflows deploying the same stacks
# are two WRITERS. They sat in different concurrency groups, so nothing serialised them, and two concurrent
# `cdk deploy` on one stack leaves it `UPDATE_IN_PROGRESS` — the state the next run cannot touch. They also
# disagreed on the image tag (`sandbox-{sha}` here, `{stage}-{sha}` there), so on a `pr-{N}` stage they
# would have pointed one ECS service at two different images on alternating runs.
#
# What stays here is what is genuinely about the PREVIEW rather than about a package: whether this PR's
# tier should exist at all (ADR-0010's ensure-exists gate), and whether the shared sandbox is up to deploy
# into. Those are the questions a package cannot answer about itself.
#
# ⛔ THE SANDBOX STARTS ONLY BY HAND (owner ruling 2026-10-12). This workflow used to WAKE the shared database
# and NAT; it now LOOKS (`sandboxWake.sh check`, describe calls only) and, when the sandbox is down, deploys
# nothing and says so. The Sandbox Up workflow starts the tier and then calls this one with `forced: true`.
on:
    workflow_call:
        inputs:
            stage:
                description: The per-PR sandbox stage to deploy, e.g. `pr-91`.
                required: true
                type: string
            forced:
                description: >-
                    Deploy unconditionally, bypassing the ensure-exists gate's changed-paths term. True for
                    a hand-dispatched deploy, false for the ordinary pipeline path.
                required: false
                default: false
                type: boolean
        # No secrets: every job here signs in through `awsAuth` (ADR-0063), and a caller grants `id-token: write`.
permissions:
    contents: read
env:
    NODE_VERSION: 24
    DEFAULT_AWS_REGION: ${{ vars.DEFAULT_AWS_REGION }}
    CDK_DEFAULT_REGION: ${{ vars.DEFAULT_AWS_REGION }}
    DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
jobs:
    gate:
        # ⛔ A CONSTANT — a job that does not RUN never evaluates its name, so an interpolated one publishes
        # its own template text into the checks list. Pinned by workflowInvariants' invariant 8.
        name: Decide whether this preview deploys
        runs-on: ubuntu-latest
        # Outlives `sandboxWake.sh check`'s worst case plus the gate's own work (`sandboxWakeWiring.test.ts`).
        timeout-minutes: 90
        permissions:
            contents: read
            packages: read # the food CDK package's install reads `@radicle-co/infra-shared` from GitHub Packages
            id-token: write # awsAuth: the non-prod role (describe calls only)
        outputs:
            deploy: ${{ steps.compose.outputs.deploy }}
            packages: ${{ steps.compose.outputs.packages }}
        env:
            STAGE: ${{ inputs.stage }}
            RECIPE_ORIGIN: https://recipe-${{ inputs.stage }}.${{ vars.DOMAIN_NAME }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  # Full history, so `Detect changes` finds the pull-request base locally (see the note there).
                  fetch-depth: 0

            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24

            - name: Install the root workspace
              uses: ./.github/actions/installWorkspace
              with:
                  node-auth-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Sign in to AWS
              id: aws
              uses: ./.github/actions/awsAuth
              with:
                  tier: nonprod
                  account-id: ${{ vars.AWS_ACCOUNT_ID }}
                  region: ${{ vars.DEFAULT_AWS_REGION }}
                  session-minutes: '90'

            # Each group also watches the workspace libraries its service links: a change to one of them alone
            # (a CORS or `azp` rule in `clerk-verify`) must redeploy a live preview, or the gate below keeps the
            # old build serving. `deployLegsWatchTheirLibraries.test.ts` derives the list.
            - name: Detect changes
              id: changes
              uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
              if: github.event_name == 'pull_request'
              with:
                  # ⛔ No token, so the pull request is diffed with git. With one, the action asks GitHub's "list pull
                  # request files" API, which stops at 3000 files, and a missed match keeps an old build serving this
                  # preview. `prChangeDetectionUncapped.test.ts` holds this.
                  token: ''
                  filters: |
                      food:
                          - 'shared/infra/**'
                          - 'packages/services/food-service/**'
                          - 'packages/clients/usda/**'
                          - 'packages/schemas/food/**'
                          - 'packages/schemas/remote-search/**'
                          - 'packages/shared/clerk-verify/**'
                          - 'packages/shared/db-schema-guard/**'
                          - 'packages/shared/messaging/**'
                          - 'packages/shared/metric-dimensions/**'
                          - 'packages/shared/nest-error-envelope/**'
                          - 'packages/shared/retry-after/**'
                          - 'packages/shared/observability-scrubbers/**'
                          - 'packages/shared/queue-check/**'
                          - 'packages/shared/rds-iam-auth/**'
                          - 'packages/shared/recipe-core/**'
                          - 'packages/shared/service-logging/**'
                      recipe:
                          - 'shared/infra/**'
                          - 'packages/services/recipe-service/**'
                          - 'packages/services/recipe-workers/**'
                          - 'packages/services/ingredient-parser/**'
                          - 'packages/clients/bedrock/**'
                          - 'packages/clients/food-service/**'
                          - 'packages/schemas/food/**'
                          - 'packages/schemas/recipe/**'
                          - 'packages/shared/clerk-verify/**'
                          - 'packages/shared/db-schema-guard/**'
                          - 'packages/shared/identity-core/**'
                          - 'packages/shared/metric-dimensions/**'
                          - 'packages/shared/nest-error-envelope/**'
                          - 'packages/shared/retry-after/**'
                          - 'packages/shared/observability-scrubbers/**'
                          - 'packages/shared/queue-check/**'
                          - 'packages/shared/rds-iam-auth/**'
                          - 'packages/shared/recipe-core/**'
                          - 'packages/shared/recipe-import-core/**'
                          - 'packages/shared/service-logging/**'
                      search:
                          - 'shared/infra/**'
                          - 'packages/services/remote-search/**'
                          - 'packages/clients/usda/**'
                          - 'packages/schemas/food/**'
                          - 'packages/schemas/remote-search/**'
                          - 'packages/shared/observability-scrubbers/**'

            # ⛔ The filter is the dependency CLOSURE (`^...`). The step this derives from named one package,
            # its own comment called itself "the step that was missed", and it was missed again when
            # `infra-alb` landed. Resolving the host by RUNNING the food stack's helper — rather than
            # re-typing `food-pr-{N}.${DOMAIN_NAME}` — is a TLS constraint: a 3-label `food.pr-7…` matches
            # no wildcard on the shared ALB cert (ADR-0003/0006).
            # ⛔ The helper below imports `FoodServiceStack`, so it needs `aws-cdk-lib` and
            # `@radicle-co/infra-shared` — which live ONLY in the food app's own `infra/` install, outside the
            # workspace. With just the root `npm ci` above, this step dies at `Cannot find package
            # 'aws-cdk-lib'` on every PR. Asserted by `infraInstallBeforeUse.test.ts`.
            - name: Install the food service's CDK package (the origin helper imports its stack)
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              working-directory: packages/services/food-service/infra
              run: npm install --no-audit --no-fund

            - name: Resolve this stage's food origin
              id: host
              run: |
                  set -euo pipefail
                  npx turbo run build --filter='@kitchensink/food-service^...'
                  url=$(npx tsx packages/services/food-service/infra/bin/printFoodHost.ts \
                      "${STAGE}" "${DOMAIN_NAME}")
                  echo "url=${url}" >> "$GITHUB_OUTPUT"
                  echo "food preview origin: ${url}"

            # ADR-0010: deploy ⟸ changed ∨ dispatched ∨ a stack is ABSENT or unusable ∨ the origin does not
            # answer. So a fresh docs-only PR deploys on its FIRST event and every later push skips, while a
            # preview that was reaped or half-rolled-back self-heals.
            - name: Ensure this PR has a food service (ensure-exists gate)
              id: food-gate
              env:
                  INTENT: 'true'
                  CHANGED: ${{ steps.changes.outputs.food || 'false' }}
                  FORCED: ${{ inputs.forced }}
                  HEALTH_URL: ${{ steps.host.outputs.url }}/health
              run: |
                  set -euo pipefail
                  chmod +x .github/scripts/deployGate.sh
                  .github/scripts/deployGate.sh evaluate "$INTENT" food "$CHANGED" "$FORCED" \
                      "$HEALTH_URL" \
                      "${DEFAULT_AWS_REGION}" \
                      "kitchensink-food-schema-${STAGE}:FoodSeedFunctionName" \
                      "kitchensink-food-schema-${STAGE}" \
                      "kitchensink-food-service-${STAGE}"

            - name: Ensure this PR has a recipe tier (ensure-exists gate)
              id: recipe-gate
              env:
                  INTENT: 'true'
                  CHANGED: ${{ steps.changes.outputs.recipe || 'false' }}
                  FORCED: ${{ inputs.forced }}
              run: |
                  set -euo pipefail
                  chmod +x .github/scripts/deployGate.sh
                  .github/scripts/deployGate.sh evaluate "$INTENT" recipe "$CHANGED" "$FORCED" \
                      "${RECIPE_ORIGIN}/health" \
                      "${DEFAULT_AWS_REGION}" \
                      none \
                      "kitchensink-ingredient-parser-${STAGE}" \
                      "kitchensink-recipe-schema-${STAGE}" \
                      "kitchensink-recipe-workers-${STAGE}" \
                      "kitchensink-recipe-service-${STAGE}"

            # The remote search copy this PR's food reads (ADR-0055). It is SERVING when its CDN refuses an unsigned
            # request itself (`403`), so that is the status the probe expects. Its origin is what the stack published;
            # a stage with none yet probes a name that cannot resolve (`000`), and its absent stack deploys it anyway.
            - name: Ensure this PR has a remote search service (ensure-exists gate)
              id: search-gate
              env:
                  INTENT: 'true'
                  CHANGED: ${{ steps.changes.outputs.search || 'false' }}
                  FORCED: ${{ inputs.forced }}
                  DEPLOY_GATE_EXPECTED_STATUS: '403'
              run: |
                  set -euo pipefail
                  origin=$(aws ssm get-parameter --name "/kitchensink/${STAGE}/remote-search/origin" \
                      --query 'Parameter.Value' --output text 2>/dev/null || echo 'https://remote-search-absent.invalid')
                  chmod +x .github/scripts/deployGate.sh
                  .github/scripts/deployGate.sh evaluate "$INTENT" search "$CHANGED" "$FORCED" \
                      "${origin}/" \
                      "${DEFAULT_AWS_REGION}" \
                      none \
                      "kitchensink-remote-search-${STAGE}"

            # ⛔ THE SANDBOX STARTS ONLY BY HAND (owner ruling 2026-10-12: "There should not be a wake of CI push").
            # A deploy into a stopped sandbox would fail its schema migrate step and could wedge a stack, so a
            # down sandbox means NO DEPLOY, with a notice: "a job that needs the sandbox SKIPS when it is down."
            # The Sandbox Up workflow starts the tier first and then calls this workflow, so the check passes there.
            #
            # ⚠️ `run:` steps run under `bash -e`, so `check`'s exit 3 (down) is CAPTURED rather than allowed to end
            # the step. Anything other than 0 or 3 is an error and fails the job: a check that cannot answer is not
            # "down".
            - name: Check the shared sandbox is up (it starts only by hand)
              id: sandbox
              if: steps.food-gate.outputs.deploy == 'true' || steps.recipe-gate.outputs.deploy == 'true' || steps.search-gate.outputs.deploy == 'true'
              run: |
                  check_status=0
                  bash .github/scripts/sandboxWake.sh check "${DEFAULT_AWS_REGION}" || check_status=$?
                  case "$check_status" in
                      0)
                          echo 'up=true' >> "$GITHUB_OUTPUT"
                          ;;
                      3)
                          echo 'up=false' >> "$GITHUB_OUTPUT"
                          echo "::notice::The shared sandbox is down, so nothing is deployed for ${STAGE}. It starts only by hand: run the Sandbox Up workflow for this PR."
                          ;;
                      *)
                          echo "::error::The sandbox status check could not answer (exit ${check_status})."
                          exit "$check_status"
                          ;;
                  esac

            # ⛔ The list is the SAFETY control, not an optimisation. A `pr-{N}` preview runs on the SHARED
            # sandbox platform (ADR-0006) and `packages/infra/global` carries no `pr-` guard — naming it
            # here would stand up a duplicate VPC, RDS and ALB for every open pull request. `identity`,
            # `identity-webhooks` and `web` are likewise shared or Vercel-owned and are never per-PR.
            #
            # ⚠️ The recipe TIER is one gate over four packages because ADR-0010's guarantee is that a
            # preview is a COMPLETE ecosystem — `recipe-service` refuses to boot without the erasure queue
            # `recipe-workers` publishes, and points `CRF_FUNCTION_NAME` at `ingredient-parser`.
            - name: Compose the deploy set
              id: compose
              env:
                  SEARCH: ${{ steps.search-gate.outputs.deploy }}
                  FOOD: ${{ steps.food-gate.outputs.deploy }}
                  RECIPE: ${{ steps.recipe-gate.outputs.deploy }}
                  SANDBOX_UP: ${{ steps.sandbox.outputs.up }}
              run: |
                  set -euo pipefail
                  packages=''
                  # A down sandbox deploys NOTHING, remote search included — see the check step above. Only an
                  # explicit `false` is down: the step is skipped when no gate wants a deploy, and then every
                  # gate output is already false.
                  if [ "$SANDBOX_UP" = 'false' ]; then
                      SEARCH=false
                      FOOD=false
                      RECIPE=false
                  fi
                  # The search copy is its own gate: food reads it, and `deployInfra.yml` deploys it before food.
                  if [ "$SEARCH" = 'true' ]; then
                      packages='remote-search'
                  fi
                  if [ "$FOOD" = 'true' ]; then
                      if [ -n "$packages" ]; then
                          packages="${packages} "
                      fi
                      packages="${packages}food-schema food-service"
                  fi
                  if [ "$RECIPE" = 'true' ]; then
                      if [ -n "$packages" ]; then
                          packages="${packages} "
                      fi
                      packages="${packages}recipe-schema ingredient-parser recipe-workers recipe-service"
                  fi
                  if [ -n "$packages" ]; then
                      echo 'deploy=true' >> "$GITHUB_OUTPUT"
                  else
                      echo 'deploy=false' >> "$GITHUB_OUTPUT"
                  fi
                  echo "packages=${packages}" >> "$GITHUB_OUTPUT"
                  echo "deploy set: ${packages:-<nothing — unchanged and already serving>}"

    # ⛔ ONE WRITER FOR A PER-PR PREVIEW STAGE. Every `cdk deploy` for a `pr-{N}` stage goes through this
    # workflow and no other, which is what makes the concurrency group (`deploy-infra-{stage}`) an actual
    # guarantee rather than a guarantee about one of two paths.
    #
    # ⚠️ SCOPED DELIBERATELY: `prod-deploy.yml` and `sandbox-identity-deploy.yml` run `cdk deploy` directly
    # for `prod` and `sandbox`. That is not a race with this workflow — `deployInfra.yml` deselects `global`
    # at a `pr-{N}` stage, so the stack-name sets are disjoint — but the guarantee above is about THIS tier,
    # and stating it for "every stage" invited the next reader to rely on it for one it does not cover.
    deploy:
        name: Deploy the preview infrastructure
        needs: [gate]
        if: ${{ needs.gate.outputs.deploy == 'true' }}
        uses: ./.github/workflows/deployInfra.yml
        permissions:
            contents: read
            packages: read # zizmor: ignore[use-trusted-publishing]
            id-token: write # awsAuth in deployInfra.yml (a callee can only downgrade)
        with:
            stage: ${{ inputs.stage }}
            deploy: true
            deploy-packages: ${{ needs.gate.outputs.packages }}
