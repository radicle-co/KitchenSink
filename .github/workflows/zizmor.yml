# zizmor — static analysis for GitHub Actions workflows.
#
# Complements, does not duplicate, CodeQL's `actions` pack: zizmor ships ~40 audits CodeQL has no
# equivalent for (template-injection reachability, excessive permissions, cache poisoning,
# artipacked/credential persistence, unpinned and impostor actions, self-hosted-runner exposure).
# Findings land in the Security tab as SARIF alongside CodeQL's.
#
# ── FINDINGS LEDGER (keep this current — a stale baseline is worse than none) ───────────────────────
#
# Original baseline on the tree that introduced this file (zizmor 1.29.0, `zizmor .github/`): 231
# findings — 120x unpinned-uses (error), 65x template-injection (note), 33x artipacked, 6x
# secrets-inherit, 6x excessive-permissions (1 error: workflow-level `id-token: write` in
# sandbox-deploy.yml), 1x dependabot-cooldown. That backlog is why this landed ADVISORY: gating on it
# then would have blocked every PR.
#
# BURN-DOWN (2026-08-08). Re-measured 251 on the then-current tree (the drift from 231 is workflow
# growth, not a zizmor change), now **26**. Closed COMPLETELY:
#   • excessive-permissions 7 → 0, both High included. The workflow-level `id-token: write` in
#     prod-deploy / sandbox-deploy / sandbox-identity-deploy was DEAD privilege: all 12
#     `configure-aws-credentials` call sites use static access keys and nothing under `.github/` names
#     `role-to-assume`/`web-identity`, so it was removed rather than merely narrowed. ci-pr / ci-main /
#     ci-full gained explicit blocks, with `id-token: write` job-scoped on the `_ci.yml` call (a called
#     workflow can only DOWNGRADE what its caller grants, and `e2e-web` needs it for Argos).
#   • template-injection 67 → 0. Every interpolation moved out of `run:` bodies into `env:`. The
#     invariant is now uniform outside `_ci-heavy.yml`: NO `${{ … }}` appears in any `run:` body.
#   • dependabot-cooldown 1 → 0, via `cooldown.default-days: 7` — plus a `github-actions` ecosystem
#     entry, because SHA-pinning without Dependabot owning the pins just rots them (see dependabot.yml).
#   • unpinned-uses 133 → 17 and artipacked 37 → 6 (details below).
#
# `_ci-heavy.yml` CLOSED OUT (same day, once the concurrent edit landed): its 17 unpinned-uses and 4
#   artipacked are gone. All four checkouts take `persist-credentials: false` — verified first that NO job
#   in that workflow performs a git push/fetch/remote operation — and every action is pinned to the same
#   SHAs used elsewhere, plus `actions/setup-java` → cf277c60eb25467037889841efdb72551f06f6c3 (v4.9.1) and
#   `reactivecircus/android-emulator-runner` → a421e43855164a8197daf9d8d40fe71c6996bb0d (v2.38.0). Both
#   were re-verified against the live tag API before use; note that `actions/setup-java@v4` currently
#   resolves to exactly that commit, so the pin is behaviour-neutral (the repo is on v5 now — bumping the
#   MAJOR is a separate decision, and the Maestro Android build has been fragile before).
#   `on.workflow_call.secrets` is declared there too, which let all three callers drop `secrets: inherit`.
#
# THE REMAINING 2 — both deliberate, and now DECLARED rather than hidden under a severity floor:
#   • 2 artipacked — prod-deploy `deploy` and sandbox-identity-deploy `deploy` keep their git credential
#     ON PURPOSE. `dorny/paths-filter` only uses the GitHub API on `pull_request`; on `push` /
#     `workflow_dispatch` it falls through to `getChangedFilesFromGit`, which fetches from `origin`. Each
#     site carries a `⚠️ DELIBERATE` note AND a `# zizmor: ignore[artipacked]` on its `- name: Checkout`
#     line. Every other checkout in the repo sets `persist-credentials: false`.
#
# ⚠️ artipacked's SEVERITY IS NOT STABLE ACROSS RUNS — this is what broke the first version of the gate,
#   and it is the reason the floor is now `low`. The audit "produces lower-severity findings when v6.0.0 or
#   higher of actions/checkout is used" (docs.zizmor.sh/audits/#artipacked). Both sites pin checkout by
#   SHA (`d23441a4… # v6.1.0`), and resolving a SHA to its tag needs the GitHub API — so the v6 downgrade
#   only applies in ONLINE mode. Measured on 1.29.0, same tree, same invocation, the ONLY difference being
#   whether `GITHUB_TOKEN`/`GH_TOKEN` is in the environment:
#     • online  (token present) → `0 low` becomes `2 low`    … artipacked graded LOW
#     • offline (no token)      → `2 medium`                 … artipacked graded MEDIUM
#   The zizmor step in THIS workflow passes no token, so CI is offline and graded them MEDIUM; the earlier
#   local measurements in this ledger were taken in a shell that had `GITHUB_TOKEN` exported and graded
#   them LOW. That is the whole explanation for "2 low" here versus "2 medium" in CI on the same commit —
#   nothing regressed, and the two findings never changed.
#
#   Why that made a `medium` floor UNSOUND rather than merely wrong-looking. Verified by introducing a real
#   new artipacked (dropped `persist-credentials: false` from heavy-e2e.yml's v6 SHA-pinned checkout) and
#   running all four combinations:
#     • floor=medium, ONLINE  → exit 0   ← THE GATE SILENTLY MISSES A BRAND-NEW artipacked
#     • floor=medium, offline → exit 13
#     • floor=low,    ONLINE  → exit 12
#     • floor=low,    offline → exit 13
#   So at a `medium` floor the gate's ability to catch this class depends on whether zizmor happened to run
#   offline — i.e. on an env var, not on the code. Anyone adding a token to that step (to enable the online
#   audits) would silently disarm it. A v4-pinned checkout grades MEDIUM in both modes, so the hole is
#   specific to v6+ and would widen as checkouts are upgraded.
#
# CURRENT MEASUREMENT (2026-08-10, `zizmor .github/`, offline): **58 findings, 56 suppressed by zizmor's own
#   default persona, 2 ignored by the two declared `artipacked` comments — 0 actionable at every severity.**
#   With both exceptions declared, `--min-severity low` AND `--min-severity informational` both exit 0.
#   (It read 63/61 before the `claude.yml` hardening added the permission comments, the workflow-level
#   `permissions` block, a `concurrency` group and a job `name:` — five pedantic findings closed as a
#   side effect, which is the only thing that moved the totals.)
#   The floor is set to `low` (not `informational`): `low` is what artipacked needs to be caught in BOTH
#   modes, and it is the tightening this ledger already named as the next step. `informational` passes today
#   too, but the informational classes have not been reviewed, so adopting them is a separate decision with
#   a known-clean baseline.
#
# ⚠️ THE FLOOR IS NOT THE ONLY FILTER — `--persona` IS THE OTHER, AND IT IS ORTHOGONAL. The "56
#   suppressed" above are suppressed by zizmor's DEFAULT `regular` persona and are invisible at EVERY
#   severity, including `informational`. That is a real blind spot with a measured instance: the missing
#   `author_association` guard on `claude.yml` (a PUBLIC repo handing `CLAUDE_CODE_OAUTH_TOKEN` to a
#   third-party action for any commenter on the internet) was found by human review, not here. zizmor has
#   NO audit for that class at all — `dangerous-triggers` covers only `pull_request_target` and
#   `workflow_run`, never the comment triggers — and the nearest signal, `secrets-outside-env`, fires on
#   `claude.yml` only under `--persona auditor`. Measured on 1.29.0, offline, same tree:
#     • default persona, --min-severity low            → exit 0   (this gate), 56 suppressed
#     • default persona, --min-severity informational  → exit 0,               56 suppressed
#     • --persona pedantic                             → 58 findings, 29 still suppressed
#     • --persona auditor                              → 58 findings, 0 suppressed (29 medium appear)
#   The 56 the gate cannot see include EVERY `secrets-outside-env` in the repo. So do NOT read "the zizmor
#   gate is green" as "the workflows are audited for actor trust". Adopting `--persona auditor` is a
#   separate decision with its own 58-finding baseline to review (it adds `secrets-outside-env` on every
#   secret-bearing job, plus `concurrency-limits` and `undocumented-permissions` tree-wide). Until then the
#   invariant is asserted in the repo's own tests:
#   `packages/infra/global/__tests__/comment-trigger-guard.test.ts`.
#
# ⚠️ A WORKFLOW ZIZMOR CANNOT PARSE DROPS OUT OF THE AUDIT WITH ONLY A `WARN`, and the directory-level run
#   still exits 0 — so an invalid workflow is silently unaudited rather than reported. `--strict-collection`
#   is the flag that turns that into a failure. NOT adopted here (untested against this tree, and it is a
#   separate decision), but it is the thing to reach for if a file ever appears to have no findings at all.
#
# SCOPED TO `.github/` DELIBERATELY, not the repo root. A root-scoped run also audits the vendored
# third-party workflows under `.specify/extensions/**` (36 extra findings in code we do not own and
# cannot fix), which is noise that would bury our own findings.
#
# ⚠️ WHAT PROVES THIS STEP DID ITS JOB — read before changing the run block. In `--format sarif` zizmor
# exits **0** even when it finds problems, so the exit code is NOT a signal about findings here and must
# not be treated as one in either direction. Consequently the only thing separating "audited, here are
# the results" from "never actually ran" is the presence of non-empty SARIF, which is exactly what the
# step asserts.
#
# ⚠️ That exit code is FORMAT-DEPENDENT — measured on 1.29.0, same tree, same invocation otherwise:
# `--format sarif` → exit 0, while the default human format → **exit 14** with findings present. So
# changing the `--format` flag silently converts this step from advisory to gating. If that is ever
# wanted, make it a deliberate decision and keep the non-empty-SARIF assertion; do NOT reach for
# `continue-on-error` or `|| true` to quieten the resulting red. This repo has already lost four weeks
# of production to a step that reported success for work it did not do, and a swallowed failure here
# would reproduce that defect class in the very tool meant to detect it.
name: zizmor

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: zizmor-${{ github.ref }}
    cancel-in-progress: true

jobs:
    audit:
        name: Audit workflows
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            security-events: write
            contents: read
            actions: read
        steps:
            - name: Checkout repository
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false

            - name: Install zizmor
              # EXACTLY pinned. This started as `>=1,<2` to avoid pinning a version I had not confirmed
              # existed; 1.29.0 was then installed and exercised locally (`--format sarif` verified, 231
              # findings, exit 0), so the reason for the range is gone. A floating range on a SECURITY
              # scanner is the wrong default in both directions: an upstream change can add findings that
              # red an unrelated PR, or remove ones we were relying on, with no repo change to point at.
              # pip has no built-in digest check here; `--require-hashes` with a hash-pinned requirements
              # file is the next step up if this is ever considered supply-chain critical.
              run: python3 -m pip install --disable-pip-version-check 'zizmor==1.29.0'

            - name: Run zizmor
              # `rc` rather than `status`: harmless in bash, but `status` is a read-only special in some
              # shells and this script should stay portable if the shell is ever changed.
              run: |
                  set -uo pipefail
                  zizmor --format sarif .github/ > zizmor.sarif
                  rc=$?
                  if [ ! -s zizmor.sarif ]; then
                    echo "::error::zizmor produced no SARIF output (exit ${rc}) — the audit did not run."
                    exit 1
                  fi
                  echo "zizmor exited ${rc}; wrote $(wc -c < zizmor.sarif) bytes of SARIF."

            # THE GATE (added 2026-08-08, after the burn-down took 251 findings -> 2).
            #
            # A SECOND invocation, deliberately, because the SARIF run above CANNOT gate: with
            # `--format sarif` zizmor always exits 0, so its exit code carries no signal (the default format
            # exits 12/14 when findings exist). Reusing one run for both jobs is what would silently turn the
            # gate into a no-op the next time somebody changes `--format`.
            #
            # FLOOR IS `low`, and the two accepted exceptions are DECLARED AT THEIR SITES rather than left to
            # hide beneath the floor. The first version of this gate sat at `medium` because that happened to
            # be just above the two known `artipacked` findings — which is brittle by construction: it made
            # the gate's severity threshold do the job an exception list should do, and it silently coupled
            # the gate's strength to how artipacked happens to be graded. It is graded inconsistently (see
            # the ledger above: LOW online, MEDIUM offline, same version, same tree, decided purely by
            # whether a token is in the environment), so a `medium` floor was measured to MISS a brand-new
            # artipacked entirely in online mode. `low` catches that class in both modes.
            #
            # The two exceptions are now `# zizmor: ignore[artipacked]` on the `- name: Checkout` line of
            # prod-deploy `deploy` and sandbox-identity-deploy `deploy`. Each is scoped to ONE step and ONE
            # audit, sits directly under the `⚠️ DELIBERATE` note that justifies it, and is placed on the
            # `name:` line specifically so the `uses:` line's `# v6.1.0` comment — which Dependabot parses to
            # bump the pin — stays a lone version comment.
            #
            # What this gate buys: every class closed during the burn-down — template-injection (67 -> 0),
            # excessive-permissions (7 -> 0, both High), unpinned-uses, secrets-inherit — plus artipacked
            # itself, now that the floor reaches it. Notably a new `${{ … }}` interpolation inside a `run:`
            # body, which is the one genuinely exploitable class. VERIFIED by mutation, not by assumption:
            # dropping `persist-credentials: false` from heavy-e2e.yml's checkout exits 13 offline / 12
            # online at this floor, and the same mutation exits 0 under the old `medium` floor online.
            #
            # A NEW deliberate exception is a per-site `# zizmor: ignore[<audit>]` next to the reason it is
            # accepted — never a floor change. Raising the floor to bury a finding is the failure this
            # replaced; lowering to `informational` is a separate, currently-unreviewed decision.
            - name: Gate on low-or-above findings
              run: |
                  set -uo pipefail
                  zizmor --min-severity low --no-progress .github/
                  rc=$?
                  if [ "${rc}" -ne 0 ]; then
                    echo "::error::zizmor found low-or-above findings (exit ${rc}). These are gating. Fix them, or — if the site is a deliberate, justified exception — declare it with a per-site '# zizmor: ignore[<audit>]' comment next to the reason it is accepted. Do NOT raise the severity floor to bury a finding."
                    exit 1
                  fi
                  echo "zizmor gate passed: no low-or-above findings outside the declared per-site ignores."

            - name: Upload SARIF to code scanning
              uses: github/codeql-action/upload-sarif@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3.37.6
              with:
                  sarif_file: zizmor.sarif
                  category: zizmor
