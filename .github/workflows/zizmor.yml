# zizmor — static analysis for GitHub Actions workflows.
#
# Complements, does not duplicate, CodeQL's `actions` pack: zizmor ships ~40 audits CodeQL has no
# equivalent for (template-injection reachability, excessive permissions, cache poisoning,
# artipacked/credential persistence, unpinned and impostor actions, self-hosted-runner exposure).
# Findings land in the Security tab as SARIF alongside CodeQL's.
#
# Measured baseline on the tree that introduced this file (zizmor 1.29.0, run locally against
# `.github/`): 231 findings — 120x unpinned-uses (error), 65x template-injection (note), 33x
# artipacked, 6x secrets-inherit, 6x excessive-permissions (1 error: workflow-level `id-token: write`
# in sandbox-deploy.yml), 1x dependabot-cooldown. That backlog is why this lands ADVISORY: gating on
# it today would block every PR. Gating comes after the burn-down, per the plan's advisory-first
# ratchet.
#
# SCOPED TO `.github/` DELIBERATELY, not the repo root. A root-scoped run also audits the vendored
# third-party workflows under `.specify/extensions/**` (36 extra findings in code we do not own and
# cannot fix), which is noise that would bury our own findings.
#
# ⚠️ WHAT PROVES THIS STEP DID ITS JOB — read before changing the run block. zizmor exits **0** even
# when it finds problems (verified locally: exit 0 with 231 findings), so the exit code is NOT a
# signal about findings and must not be treated as one in either direction. Consequently the only
# thing separating "audited, here are the results" from "never actually ran" is the presence of
# non-empty SARIF, which is exactly what the step asserts. Do NOT add `continue-on-error` and do NOT
# add `|| true`: this repo has already lost four weeks of production to a step that reported success
# for work it did not do, and a swallowed failure here would reproduce that defect class in the very
# tool meant to detect it.
name: zizmor

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: zizmor-${{ github.ref }}
    cancel-in-progress: true

jobs:
    audit:
        name: Audit workflows
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            security-events: write
            contents: read
            actions: read
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install zizmor
              # EXACTLY pinned. This started as `>=1,<2` to avoid pinning a version I had not confirmed
              # existed; 1.29.0 was then installed and exercised locally (`--format sarif` verified, 231
              # findings, exit 0), so the reason for the range is gone. A floating range on a SECURITY
              # scanner is the wrong default in both directions: an upstream change can add findings that
              # red an unrelated PR, or remove ones we were relying on, with no repo change to point at.
              # pip has no built-in digest check here; `--require-hashes` with a hash-pinned requirements
              # file is the next step up if this is ever considered supply-chain critical.
              run: python3 -m pip install --disable-pip-version-check 'zizmor==1.29.0'

            - name: Run zizmor
              # `rc` rather than `status`: harmless in bash, but `status` is a read-only special in some
              # shells and this script should stay portable if the shell is ever changed.
              run: |
                  set -uo pipefail
                  zizmor --format sarif .github/ > zizmor.sarif
                  rc=$?
                  if [ ! -s zizmor.sarif ]; then
                    echo "::error::zizmor produced no SARIF output (exit ${rc}) — the audit did not run."
                    exit 1
                  fi
                  echo "zizmor exited ${rc}; wrote $(wc -c < zizmor.sarif) bytes of SARIF."

            - name: Upload SARIF to code scanning
              uses: github/codeql-action/upload-sarif@v3
              with:
                  sarif_file: zizmor.sarif
                  category: zizmor
