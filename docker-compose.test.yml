# docker-compose.test.yml (T088) — CI / integration + e2e harness stack.
#
# The variant CI (and `test:integration` / `test:e2e` locally) brings up. Same two backing services as
# docker-compose.yml, but tuned for a throwaway test run:
#   * a dedicated `kitchensink_recipes` database owned by postgres/postgres (no persisted volume — a
#     `tmpfs` data dir keeps runs fast and clean),
#   * LocalStack S3 with the two recipe buckets AUTO-PROVISIONED by a one-shot `bucket-init` sidecar so
#     the buckets exist the moment the stack reports healthy (the vitest global-setup also ensures them,
#     making the two paths redundant-but-idempotent).
#
# Usage:
#   docker compose -f docker-compose.test.yml up -d --wait
#   DATABASE_URL=postgresql://postgres:postgres@localhost:5432/kitchensink_recipes \
#   S3_ENDPOINT=http://localhost:4566 S3_FORCE_PATH_STYLE=true \
#     npm run test:integration --workspace=packages/services/recipe-service
#   docker compose -f docker-compose.test.yml down -v

networks:
    commise-test:
        driver: bridge

services:
    postgres:
        image: postgres:16-alpine
        container_name: commise-postgres-test
        networks:
            - commise-test
        ports:
            - '5432:5432'
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: kitchensink_recipes
        # Ephemeral data dir — every `up` starts from a pristine database.
        tmpfs:
            - /var/lib/postgresql/data
        volumes:
            - ./infra/docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres -d kitchensink_recipes']
            interval: 3s
            timeout: 5s
            retries: 20
            start_period: 5s

    localstack:
        image: localstack/localstack:3
        container_name: commise-localstack-test
        networks:
            - commise-test
        ports:
            - '4566:4566'
        environment:
            SERVICES: s3
            DEFAULT_REGION: us-east-1
            EAGER_SERVICE_LOADING: 1
        healthcheck:
            test: ['CMD-SHELL', 'awslocal s3 ls || exit 1']
            interval: 3s
            timeout: 5s
            retries: 20
            start_period: 5s

    # One-shot: waits for LocalStack to pass its health check, creates the two recipe buckets, exits 0.
    # `condition: service_completed_successfully` lets `--wait` block until provisioning is done.
    bucket-init:
        image: localstack/localstack:3
        container_name: commise-bucket-init-test
        networks:
            - commise-test
        depends_on:
            localstack:
                condition: service_healthy
        environment:
            AWS_ACCESS_KEY_ID: test
            AWS_SECRET_ACCESS_KEY: test
            AWS_DEFAULT_REGION: us-east-1
        entrypoint:
            - /bin/sh
            - -c
            - |
                set -e
                awslocal --endpoint-url=http://localstack:4566 s3 mb s3://commise-photos || true
                awslocal --endpoint-url=http://localstack:4566 s3 mb s3://commise-versions || true
                awslocal --endpoint-url=http://localstack:4566 s3 ls
        restart: 'no'
