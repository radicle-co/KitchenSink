<!doctype html>
<!-- Cooking mode workshop, round 2, designer A: "Now and next", revised. Design mockup, not production code. -->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Cooking mode, round 2, designer A: Now and next</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600&display=swap"
            rel="stylesheet"
        />
        <style>
            /* Commise redesign tokens (workshop 5, round 9): steel on a cool base, dusk dark mode. Same variable names as
   ds/commise/tokens.css; only values change. Design artifact for the redesign canvas, not app code. */

            @font-face {
                font-family: 'Inter';
                font-weight: 400;
                font-style: normal;
                font-display: swap;
                src: url('fonts/Inter_400Regular.ttf') format('truetype');
            }
            @font-face {
                font-family: 'Inter_400Regular';
                font-weight: 400;
                font-style: normal;
                font-display: swap;
                src: url('fonts/Inter_400Regular.ttf') format('truetype');
            }
            @font-face {
                font-family: 'Inter';
                font-weight: 500;
                font-style: normal;
                font-display: swap;
                src: url('fonts/Inter_500Medium.ttf') format('truetype');
            }
            @font-face {
                font-family: 'Inter_500Medium';
                font-weight: 400;
                font-style: normal;
                font-display: swap;
                src: url('fonts/Inter_500Medium.ttf') format('truetype');
            }
            @font-face {
                font-family: 'Inter';
                font-weight: 600;
                font-style: normal;
                font-display: swap;
                src: url('fonts/Inter_600SemiBold.ttf') format('truetype');
            }
            @font-face {
                font-family: 'Inter_600SemiBold';
                font-weight: 400;
                font-style: normal;
                font-display: swap;
                src: url('fonts/Inter_600SemiBold.ttf') format('truetype');
            }
            @font-face {
                font-family: 'Inter';
                font-weight: 700;
                font-style: normal;
                font-display: swap;
                src: url('fonts/Inter_700Bold.ttf') format('truetype');
            }
            @font-face {
                font-family: 'Inter_700Bold';
                font-weight: 400;
                font-style: normal;
                font-display: swap;
                src: url('fonts/Inter_700Bold.ttf') format('truetype');
            }
            @font-face {
                font-family: 'Playfair Display';
                font-weight: 600;
                font-style: normal;
                font-display: swap;
                src: url('fonts/PlayfairDisplay_600SemiBold.ttf') format('truetype');
            }
            @font-face {
                font-family: 'PlayfairDisplay_600SemiBold';
                font-weight: 400;
                font-style: normal;
                font-display: swap;
                src: url('fonts/PlayfairDisplay_600SemiBold.ttf') format('truetype');
            }
            @font-face {
                font-family: 'Playfair Display';
                font-weight: 700;
                font-style: normal;
                font-display: swap;
                src: url('fonts/PlayfairDisplay_700Bold.ttf') format('truetype');
            }
            @font-face {
                font-family: 'PlayfairDisplay_700Bold';
                font-weight: 400;
                font-style: normal;
                font-display: swap;
                src: url('fonts/PlayfairDisplay_700Bold.ttf') format('truetype');
            }
            :root,
            [data-theme='light'] {
                --canvas: #eff3f6;
                --paper: #fcfdff;
                --ink: #171b20;
                --ink-muted: #5c646e;
                --line-control: #80878f;
                --line-divider: #dfe3e8;
                --action: #325c7f;
                --action-text: #325c7f;
                --selected-fill: #e4eef7;
                --selected-edge: #325c7f;
                --here-bar: #325c7f;
                --focus-ring: #325c7f;
                --rating: #171b20;
                --attention: #8c5a00;
                --attention-tint: rgba(245, 176, 65, 0.2);
                --danger: #c05238;
                --danger-text: #b1442b;
                --paper-raised: #ffffff;
                --paper-overlay: #ffffff;
                --surface-muted: #e9edf2;
                --inverse: #171b20;
                --inverse-ink: #ffffff;
                --inverse-action: #96bcde;
                --photo-chip: rgba(252, 253, 255, 0.94);
                --scrim: rgba(10, 16, 24, 0.42);
                --on-action: #ffffff;
                --action-pressed: #264a68;
                --bar: rgba(252, 253, 255, 0.92);
                --pro-fill: #e9edf2;
                --pro-ink: #171b20;
                --brand-seafoam: #325c7f;
                --brand-seafoam-light: #96bcde;
                --brand-ocean-dark: #264a68;
                --brand-coral: #f7e9d7;
                --brand-sky: #ddeefc;
                --brand-sand: #eff3f6;
                --brand-charcoal: #171b20;
                --brand-success: #4caf7c;
                --brand-warning: #f5b041;
                --brand-warning-dark: #8c5a00;
                --brand-error: #c05238;
                --brand-error-dark: #b1442b;
                --brand-premium: #5c646e;
                --brand-honey: #171b20;
                --cover-seafoam: #e1edfa;
                --cover-coral: #f7e9d7;
                --cover-sky: #ddeefc;
                --cover-premium: #f5e9df;
                --cover-success: #e4edf2;
                --cover-warning: #f7e9d7;
                --space-0: 0px;
                --space-1: 4px;
                --space-2: 8px;
                --space-3: 12px;
                --space-4: 16px;
                --space-5: 24px;
                --space-6: 32px;
                --space-7: 48px;
                --space-8: 64px;
                --space-9: 96px;
                --radius-sm: 8px;
                --radius-md: 12px;
                --radius-lg: 18px;
                --radius-xl: 24px;
                --radius-full: 9999px;
                --shadow-sm: 0 1px 2px rgba(20, 30, 45, 0.05);
                --shadow-md: 0 1px 2px rgba(20, 30, 45, 0.05), 0 2px 8px rgba(20, 30, 45, 0.05);
                --shadow-lg: 0 2px 4px rgba(10, 20, 30, 0.08), 0 8px 22px rgba(10, 20, 30, 0.12);
                --shadow-xl: 0 12px 30px rgba(10, 20, 30, 0.18);
                --shadow-glow: 0 0 0 3px rgba(50, 92, 127, 0.25);
                --font-display: 'Manrope', Inter, system-ui, sans-serif;
                --font-body: Inter, system-ui, sans-serif;
                --font-mono: 'JetBrains Mono', monospace;
                --background-image-hero: linear-gradient(180deg, #eff3f6 0%, #eff3f6 100%);
            }
            [data-theme='dark'] {
                --canvas: #0e161e;
                --paper: #172029;
                --ink: #ebeff2;
                --ink-muted: #a3acb6;
                --line-control: #7d8792;
                --line-divider: #262f38;
                --action: #96bcde;
                --action-text: #96bcde;
                --selected-fill: #1f3548;
                --selected-edge: #96bcde;
                --here-bar: #96bcde;
                --focus-ring: #96bcde;
                --rating: #ebeff2;
                --attention: #efba64;
                --attention-tint: rgba(245, 176, 65, 0.2);
                --danger: #c05238;
                --danger-text: #ec8e76;
                --paper-raised: #212b36;
                --paper-overlay: #26313d;
                --surface-muted: #212b36;
                --inverse: #ebeff2;
                --inverse-ink: #171b20;
                --inverse-action: #325c7f;
                --photo-chip: rgba(23, 32, 41, 0.86);
                --scrim: rgba(0, 0, 0, 0.66);
                --on-action: #0e161e;
                --action-pressed: #b4cfe8;
                --bar: rgba(23, 32, 41, 0.94);
                --pro-fill: #212b36;
                --pro-ink: #ebeff2;
                --cover-seafoam: #202b37;
                --cover-coral: #342817;
                --cover-sky: #1c2c38;
                --cover-premium: #32281f;
                --cover-success: #232b30;
                --cover-warning: #342817;
                --background-image-hero: linear-gradient(180deg, #0e161e 0%, #0e161e 100%);
            }

            body {
                margin: 0;
                padding: 32px;
                background: #8a9099;
                font-family: Inter, system-ui, sans-serif;
            }
            .board {
                display: flex;
                flex-wrap: wrap;
                gap: 40px;
                align-items: flex-start;
            }
            figure {
                margin: 0;
                display: flex;
                flex-direction: column;
                gap: 8px;
            }
            figcaption {
                font:
                    600 13px/1.3 Inter,
                    sans-serif;
                color: #fff;
                max-width: 390px;
            }
            [data-screen] {
                position: relative;
                overflow: hidden;
                display: flex;
                flex-direction: column;
                background: var(--canvas);
                color: var(--ink);
                font:
                    400 17px/1.4 Inter,
                    system-ui,
                    sans-serif;
                letter-spacing: -0.011em;
                border-radius: 40px;
                box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
                --muted: #474e57;
                --steelText: #264a68;
            }
            [data-screen][data-theme='dark'] {
                --muted: #b4bcc5;
                --steelText: #96bcde;
            }
            [data-screen].wide {
                border-radius: 18px;
            }
            p,
            h1,
            h2,
            h3,
            ol,
            ul {
                margin: 0;
                padding: 0;
            }
            a {
                color: inherit;
                text-decoration: none;
            }
            .ic {
                width: 22px;
                height: 22px;
                flex: none;
                stroke: currentColor;
                fill: none;
                stroke-width: 1.8;
                stroke-linecap: round;
                stroke-linejoin: round;
            }
            .ic.sm {
                width: 18px;
                height: 18px;
            }
            .t13 {
                font-size: 13px;
                line-height: 1.35;
            }
            .muted {
                color: var(--muted);
            }
            .w600 {
                font-weight: 600;
            }
            .tnum {
                font-variant-numeric: tabular-nums;
            }
            .status {
                height: 47px;
                flex: none;
            }
            .home {
                height: 34px;
                flex: none;
            }
            /* Top bar: exit, place, ingredients. */
            .bar {
                flex: none;
                display: grid;
                grid-template-columns: 56px 1fr auto;
                align-items: center;
                gap: 8px;
                height: 60px;
                padding: 0 12px 0 4px;
            }
            .iconBtn {
                width: 56px;
                height: 56px;
                display: grid;
                place-items: center;
            }
            .iconBtn > span {
                width: 44px;
                height: 44px;
                border-radius: 50%;
                display: grid;
                place-items: center;
                background: var(--surface-muted);
            }
            .where .s {
                font-weight: 600;
            }
            .ticks {
                display: flex;
                gap: 3px;
                margin-top: 4px;
            }
            .ticks i {
                flex: 1;
                height: 4px;
                border-radius: 2px;
                background: var(--line-divider);
            }
            .ticks i.done {
                background: var(--line-control);
            }
            .ticks i.cur {
                background: var(--action);
            }
            .ingBtn {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                min-height: 48px;
                padding: 0 14px 0 12px;
                border-radius: 24px;
                background: var(--paper);
                box-shadow:
                    inset 0 0 0 1px var(--line-divider),
                    var(--shadow-sm);
                font-weight: 600;
            }
            .ingBtn .ic {
                color: var(--action-text);
            }
            .body {
                flex: 1;
                min-height: 0;
                overflow: hidden;
                padding: 12px 20px 0;
                display: flex;
                flex-direction: column;
            }
            /* NOW: one focus line at the reading size. Everything else is 17 or 13. */
            .label {
                font-size: 13px;
                font-weight: 600;
                letter-spacing: 0.06em;
                text-transform: uppercase;
                color: var(--muted);
                display: flex;
                gap: 8px;
                align-items: center;
            }
            .label .ic {
                color: var(--muted);
            }
            .read {
                font-size: 38px;
                line-height: 1.16;
                letter-spacing: -0.022em;
                font-weight: 400;
                margin-top: 8px;
            }
            .read b {
                font-weight: 600;
            }
            .doneLine {
                display: flex;
                gap: 10px;
                align-items: flex-start;
                color: var(--muted);
                padding: 6px 0;
            }
            .doneLine .ic {
                color: var(--muted);
                margin-top: 1px;
            }
            .then {
                margin-top: 22px;
            }
            .then ol {
                list-style: none;
                margin-top: 4px;
            }
            .then li {
                padding: 8px 0;
                min-height: 44px;
                box-sizing: border-box;
            }
            .then li + li {
                border-top: 1px solid var(--line-divider);
            }
            .then .st {
                color: var(--muted);
            }
            .offer {
                align-self: flex-start;
                display: inline-flex;
                align-items: center;
                gap: 10px;
                min-height: 64px;
                margin-top: 18px;
                padding: 0 22px 0 18px;
                border-radius: 20px;
                box-shadow: inset 0 0 0 1.5px var(--line-control);
                font-weight: 600;
            }
            .offer .ic {
                color: var(--action-text);
                width: 24px;
                height: 24px;
            }
            .note {
                display: flex;
                gap: 10px;
                align-items: flex-start;
                margin-top: 14px;
            }
            .note .ic {
                color: var(--muted);
                margin-top: 1px;
            }
            .note b,
            .read b,
            p b {
                font-weight: 600;
            }
            /* Fast stretch: the one sand band, one step early. */
            .fast {
                flex: none;
                margin: 0 16px 10px;
                padding: 14px 16px;
                border-radius: 18px;
                background: var(--attention-tint);
                display: flex;
                gap: 12px;
            }
            .fast .ic {
                color: var(--attention);
                margin-top: 1px;
            }
            /* Optional jobs during a wait: plain rows, no cards. */
            .jobs {
                list-style: none;
                margin-top: 6px;
            }
            .jobs li {
                display: flex;
                align-items: center;
                gap: 12px;
                min-height: 64px;
            }
            .jobs li + li {
                border-top: 1px solid var(--line-divider);
            }
            .jobs .grow {
                flex: 1;
                min-width: 0;
            }
            .go {
                min-height: 48px;
                padding: 0 16px;
                border-radius: 24px;
                box-shadow: inset 0 0 0 1.5px var(--line-control);
                font-weight: 600;
                display: inline-flex;
                align-items: center;
            }
            .quiet {
                font-size: 17px;
                margin-top: 18px;
            }
            .alarmOff {
                display: flex;
                gap: 10px;
                align-items: flex-start;
                margin-top: 16px;
                padding-top: 14px;
                border-top: 1px solid var(--line-divider);
            }
            .alarmOff .ic {
                color: var(--attention);
                margin-top: 1px;
            }
            .alarmOff a {
                color: var(--action-text);
                font-weight: 600;
            }
            /* Dock: running timers, a quiet strip above the controls. A timer that is the Now leaves the dock. */
            .dock {
                flex: none;
                margin: 0 20px;
                border-top: 1px solid var(--line-divider);
            }
            .trow {
                display: flex;
                align-items: center;
                gap: 12px;
                min-height: 60px;
            }
            .trow + .trow {
                border-top: 1px solid var(--line-divider);
            }
            .trow .ic.t {
                color: var(--action-text);
            }
            .trow .grow {
                flex: 1;
                min-width: 0;
            }
            .trow .tm {
                font-size: 28px;
                font-weight: 600;
                letter-spacing: -0.02em;
                line-height: 1.1;
            }
            .trow .act {
                width: 52px;
                height: 52px;
                border-radius: 50%;
                background: var(--surface-muted);
                display: grid;
                place-items: center;
                flex: none;
            }
            /* Controls: no swipe. Done is wide; Back is narrow. */
            .ctl {
                flex: none;
                display: grid;
                grid-template-columns: 72px 1fr;
                gap: 10px;
                padding: 10px 16px 0;
            }
            .btnBack {
                min-height: 72px;
                border-radius: 22px;
                display: grid;
                place-items: center;
                box-shadow: inset 0 0 0 1.5px var(--line-control);
            }
            .btnDone {
                min-height: 72px;
                border-radius: 22px;
                background: var(--action);
                color: var(--on-action);
                font-weight: 600;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
            }
            .btnDone .sub {
                font-weight: 400;
                opacity: 0.85;
            }
            /* Full-screen alarm in the app: the inverse surface, once. */
            .alarm {
                background: var(--ink);
                color: var(--canvas);
                --muted: color-mix(in srgb, var(--canvas) 72%, var(--ink));
            }
            .alarm .wrap {
                flex: 1;
                display: flex;
                flex-direction: column;
                padding: 28px 24px 12px;
            }
            .alarm .stop {
                min-height: 112px;
                border-radius: 30px;
                background: var(--canvas);
                color: var(--ink);
                font-size: 28px;
                font-weight: 600;
                display: grid;
                place-items: center;
            }
            .alarm .more {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 10px;
                margin-top: 10px;
            }
            .alarm .more a {
                min-height: 72px;
                border-radius: 22px;
                box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--canvas) 45%, var(--ink));
                font-weight: 600;
                display: grid;
                place-items: center;
            }
            /* Lock screen (drawn by the system: AlarmKit on iOS 26, the alarm path on Android) */
            .lock {
                background: #0b0f14;
                color: #f2f4f7;
            }
            .lock .lt {
                flex: 1;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                padding: 24px 24px 12px;
            }
            .lock .big {
                font-size: 30px;
                font-weight: 600;
                letter-spacing: -0.02em;
            }
            .lock .stopBig {
                min-height: 72px;
                border-radius: 36px;
                background: #f2f4f7;
                color: #0b0f14;
                font-weight: 600;
                display: grid;
                place-items: center;
            }
            .lock .snooze {
                min-height: 64px;
                border-radius: 32px;
                background: rgba(255, 255, 255, 0.14);
                font-weight: 600;
                display: grid;
                place-items: center;
            }
            /* Before you start */
            .plan {
                list-style: none;
                margin-top: 10px;
            }
            .plan li {
                display: grid;
                grid-template-columns: 64px 1fr;
                gap: 10px;
                padding: 9px 0;
            }
            .plan li + li {
                border-top: 1px solid var(--line-divider);
            }
            .plan .tm {
                color: var(--muted);
                font-variant-numeric: tabular-nums;
            }
            .plan li.free .what {
                color: var(--muted);
            }
            .perm {
                display: flex;
                gap: 12px;
                align-items: center;
                margin-top: 16px;
                padding-top: 14px;
                border-top: 1px solid var(--line-divider);
            }
            .perm .grow {
                flex: 1;
            }
            /* Ingredients */
            .scrim {
                position: absolute;
                inset: 0;
                background: var(--scrim);
                z-index: 5;
            }
            .sheet {
                position: absolute;
                z-index: 6;
                left: 0;
                right: 0;
                bottom: 0;
                top: 130px;
                background: var(--paper-overlay);
                border-radius: 24px 24px 0 0;
                box-shadow: var(--shadow-xl);
                display: flex;
                flex-direction: column;
            }
            .grab {
                width: 40px;
                height: 5px;
                border-radius: 3px;
                background: var(--line-control);
                opacity: 0.6;
                margin: 10px auto 4px;
            }
            .sheetHead {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 4px 12px 4px 20px;
            }
            .doneBtn {
                min-height: 48px;
                padding: 0 18px;
                border-radius: 24px;
                background: var(--surface-muted);
                font-weight: 600;
                display: inline-flex;
                align-items: center;
            }
            .stepper {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 8px 20px 4px;
            }
            .stepper .ctrl {
                display: flex;
                align-items: center;
                gap: 6px;
            }
            .stepper .ctrl a {
                width: 48px;
                height: 48px;
                border-radius: 50%;
                box-shadow: inset 0 0 0 1.5px var(--line-control);
                display: grid;
                place-items: center;
            }
            .stepper .ctrl a .ic {
                color: var(--action-text);
            }
            .stepper .ctrl span {
                min-width: 36px;
                text-align: center;
                font-weight: 600;
                font-size: 17px;
            }
            .grp {
                padding: 16px 20px 2px;
                font-size: 13px;
                font-weight: 600;
                letter-spacing: 0.06em;
                text-transform: uppercase;
                color: var(--muted);
            }
            .ing {
                list-style: none;
            }
            .ing li {
                display: flex;
                align-items: center;
                gap: 14px;
                min-height: 52px;
                padding: 2px 20px;
                position: relative;
            }
            .ing li + li::before {
                content: '';
                position: absolute;
                top: 0;
                left: 62px;
                right: 0;
                height: 1px;
                background: var(--line-divider);
            }
            .box {
                width: 28px;
                height: 28px;
                flex: none;
                border-radius: 8px;
                box-shadow: inset 0 0 0 2px var(--line-control);
                display: grid;
                place-items: center;
            }
            .box.on {
                background: var(--surface-muted);
                box-shadow: none;
                color: var(--muted);
            }
            .box.on .ic {
                width: 18px;
                height: 18px;
                stroke-width: 2.6;
            }
            .ing li.in .nm {
                color: var(--muted);
            }
            .ing .q {
                font-weight: 600;
            }
            .ing li.in .q {
                font-weight: 400;
            }
            .ing .tag {
                margin-left: auto;
                font-size: 13px;
                color: var(--muted);
            }
            .ingWrap {
                flex: 1;
                overflow: hidden;
            }
            /* Wide */
            .cols {
                flex: 1;
                min-height: 0;
                display: grid;
            }
