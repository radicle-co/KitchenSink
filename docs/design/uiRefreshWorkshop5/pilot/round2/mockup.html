<!doctype html>
<!--
  Commise UI refresh, workshop 5 pilot, round 2: Home and Recipe detail.
  WHAT THIS IS: a static design mockup for the owner to judge. Four phone screens at 390 px, full length.
  WHAT THIS IS NOT: production code. Do not copy markup or CSS into the app; the spec (spec.md) is the hand-off.
  Photos: Wikimedia Commons, free licences, credited in proposals.md.
-->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Commise pilot round 2: Home and Recipe detail</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500&display=swap"
            rel="stylesheet"
        />
        <style>
            /* ---------- Tokens ---------- */
            .light {
                --canvas: #fcfbf8;
                --surface: #f3f0eb;
                --ink: #1d1b18;
                --ink2: #69645d;
                --line: #e8e4de;
                --control: #8a847c;
                --accent: #26746d;
                --accentFill: #26746d;
                --onAccent: #ffffff;
                --accentSoft: #e5f0ec;
                --chipBg: rgba(252, 251, 248, 0.94);
                --chipInk: #1d1b18;
                --material: rgba(252, 251, 248, 0.72);
                --materialInk: #1d1b18;
                --bar: rgba(252, 251, 248, 0.94);
                --noPhoto: linear-gradient(160deg, #f3f0eb 0%, #ece8e1 100%);
                --noPhotoInk: #69645d;
                color-scheme: light;
            }
            .dark {
                --canvas: #181614;
                --surface: #23201d;
                --ink: #f3f0eb;
                --ink2: #a9a39a;
                --line: #322e2a;
                --control: #878078;
                --accent: #6cbdb3;
                --accentFill: #2a7e76;
                --onAccent: #ffffff;
                --accentSoft: #1d302c;
                --chipBg: rgba(24, 22, 20, 0.78);
                --chipInk: #f3f0eb;
                --material: rgba(24, 22, 20, 0.55);
                --materialInk: #f3f0eb;
                --bar: rgba(24, 22, 20, 0.94);
                --noPhoto: linear-gradient(160deg, #26231f 0%, #1e1c19 100%);
                --noPhotoInk: #a9a39a;
                color-scheme: dark;
            }

            /* ---------- Page (presentation only) ---------- */
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                background: #d9d7d3;
                font-family: 'Inter', system-ui, sans-serif;
                -webkit-font-smoothing: antialiased;
                padding: 40px;
            }
            .board {
                display: flex;
                gap: 48px;
                align-items: flex-start;
                flex-wrap: wrap;
            }
            .board > figure {
                display: flex;
                flex-direction: column;
                gap: 12px;
            }
            .board figcaption {
                font:
                    500 13px/1.4 'Inter',
                    sans-serif;
                color: #4a4844;
            }

            /* ---------- Phone ---------- */
            [data-screen] {
                width: 390px;
                background: var(--canvas);
                color: var(--ink);
                font-family: 'Inter', system-ui, sans-serif;
                font-size: 17px;
                line-height: 1.45;
                font-weight: 400;
                font-feature-settings: 'cv11' 1;
                letter-spacing: -0.011em;
                border-radius: 44px;
                overflow: hidden;
                box-shadow:
                    0 1px 2px rgba(0, 0, 0, 0.08),
                    0 12px 40px rgba(0, 0, 0, 0.1);
                display: flex;
                flex-direction: column;
            }
            .tnum {
                font-variant-numeric: tabular-nums;
            }
            .pad {
                padding-left: 20px;
                padding-right: 20px;
            }
            .ic {
                width: 20px;
                height: 20px;
                flex: none;
                stroke: currentColor;
                fill: none;
                stroke-width: 1.6;
                stroke-linecap: round;
                stroke-linejoin: round;
            }
            .ic.sm {
                width: 16px;
                height: 16px;
            }
            .ic.xs {
                width: 14px;
                height: 14px;
            }
            .t13 {
                font-size: 13px;
                line-height: 1.35;
            }
            .t15 {
                font-size: 15px;
                line-height: 1.4;
            }
            .t17 {
                font-size: 17px;
                line-height: 1.45;
            }
            .w500 {
                font-weight: 500;
            }
            .w600 {
                font-weight: 600;
            }
            .soft {
                color: var(--ink2);
            }
            .acc {
                color: var(--accent);
            }
            a {
                color: inherit;
                text-decoration: none;
            }

            /* Title: the one size that earns it */
            [data-title] {
                text-wrap: balance;
            }
            /* The dish name is the one place type carries identity: Newsreader, recipe names only. */
            .dish {
                font-family: 'Newsreader', Georgia, serif;
                font-optical-sizing: auto;
                font-weight: 500;
                letter-spacing: -0.012em;
                font-feature-settings: normal;
            }
            .rTitle {
                font-size: 30px;
                line-height: 1.12;
                letter-spacing: -0.018em;
            }
            .greet {
                font-size: 17px;
                line-height: 1.35;
                font-weight: 500;
                letter-spacing: -0.015em;
            }

            /* Section heading row */
            .secHead {
                display: flex;
                align-items: baseline;
                justify-content: space-between;
                gap: 12px;
            }
            .secHead h2 {
                font-size: 17px;
                font-weight: 600;
                letter-spacing: -0.015em;
            }
            .link {
                color: var(--accent);
                font-weight: 500;
                display: inline-flex;
                align-items: center;
                gap: 4px;
                min-height: 44px;
            }

            /* ---------- Home ---------- */
            .homeTop {
                padding-top: 60px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
            }
            .avatarBtn {
                width: 44px;
                height: 44px;
                display: grid;
                place-items: center;
                margin-right: -4px;
                flex: none;
            }
            .avatar {
                width: 36px;
                height: 36px;
                border-radius: 50%;
                background: var(--accentFill);
                color: var(--onAccent);
                display: grid;
                place-items: center;
                font-size: 13px;
                font-weight: 600;
                letter-spacing: 0.02em;
            }
            .date {
                margin-top: 1px;
            }

            .grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                column-gap: 12px;
                row-gap: 22px;
                margin-top: 8px;
            }
            .tile .ph {
                position: relative;
                aspect-ratio: 34 / 30;
                border-radius: 14px;
                overflow: hidden;
                background-size: cover;
                background-position: center;
            }
            .tile .ph::after {
                content: '';
                position: absolute;
                inset: 0;
                border-radius: inherit;
                box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.04);
            }
            .chip {
                position: absolute;
                top: 10px;
                display: inline-flex;
                align-items: center;
                gap: 4px;
                height: 26px;
                padding: 0 9px;
                border-radius: 8px;
                background: var(--chipBg);
                color: var(--chipInk);
                font-size: 13px;
                font-weight: 500;
                backdrop-filter: blur(8px);
            }
            .chip.l {
                left: 10px;
            }
            .chip.r {
                right: 10px;
            }
            .tile .name {
                margin-top: 10px;
                font-size: 17px;
                line-height: 1.22;
                display: -webkit-box;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
                overflow: hidden;
            }
            .tile .meta {
                margin-top: 3px;
            }

            .tile .ph.noPhoto::after {
                box-shadow: none;
            }
            .noPhoto {
                background: var(--noPhoto);
                display: grid;
                place-items: center;
            }
            .noPhoto .disc {
                width: 40px;
                height: 40px;
                border-radius: 50%;
                background: var(--canvas);
                display: grid;
                place-items: center;
            }
            .noPhoto .np {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 8px;
                margin-top: 8px;
                color: var(--noPhotoInk);
            }

            /* Coming soon */
            .soon {
                margin-top: 40px;
            }
            .soon .lede {
                margin-top: 4px;
                max-width: 320px;
            }
            .panels {
                margin-top: 14px;
                background: var(--surface);
                border-radius: 16px;
                padding: 0 16px;
            }
            .panel {
                display: flex;
                align-items: center;
                gap: 14px;
                min-height: 56px;
            }
            .panel + .panel {
                border-top: 1px solid var(--line);
            }
            .panel .ic {
                color: var(--ink2);
            }
            .panel h3 {
                flex: 1;
                font-size: 15px;
                font-weight: 500;
                line-height: 1.33;
            }

            .fabRow {
                display: flex;
                justify-content: flex-end;
                padding: 28px 20px 16px;
            }
            .fab {
                height: 48px;
                padding: 0 20px 0 16px;
                border-radius: 24px;
                background: var(--accentFill);
                color: var(--onAccent);
                display: inline-flex;
                align-items: center;
                gap: 8px;
                font-size: 15px;
                font-weight: 600;
                box-shadow:
                    0 1px 2px rgba(0, 0, 0, 0.12),
                    0 6px 16px rgba(0, 0, 0, 0.12);
            }

            /* ---------- Tab bar ---------- */
            .tabbar {
                margin-top: auto;
                background: var(--bar);
                border-top: 1px solid var(--line);
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                padding: 8px 0 30px;
            }
            .tab {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 3px;
                color: var(--ink2);
                font-size: 13px;
                font-weight: 500;
                min-height: 44px;
                justify-content: center;
            }
            .tab .ic {
                width: 24px;
                height: 24px;
                stroke-width: 1.5;
            }
            .tab.on {
                color: var(--accent);
            }

            /* ---------- Recipe ---------- */
            .hero {
                position: relative;
                height: 380px;
                background-size: cover;
                background-position: center;
            }
            .hero .btn {
                position: absolute;
                width: 44px;
                height: 44px;
                display: grid;
                place-items: center;
                color: var(--materialInk);
            }
            .hero .btn > span {
                width: 32px;
                height: 32px;
                border-radius: 50%;
                display: grid;
                place-items: center;
                background: var(--material);
                backdrop-filter: blur(14px) saturate(1.4);
                -webkit-backdrop-filter: blur(14px) saturate(1.4);
            }
            .hero .edge {
                position: absolute;
                top: 50%;
                transform: translateY(-50%);
                width: 44px;
                height: 56px;
                display: grid;
                place-items: center;
                color: #fff;
            }
            .hero .edge > span {
                width: 28px;
                height: 28px;
                border-radius: 50%;
                display: grid;
                place-items: center;
                background: rgba(20, 18, 16, 0.46);
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
            }
            .hero .btn .ic {
                width: 16px;
                height: 16px;
                stroke-width: 2;
            }
            .hero .edge .ic {
                width: 16px;
                height: 16px;
                stroke-width: 2;
            }
            .hero .back {
                top: 50px;
                left: 10px;
            }
            .hero .more {
                top: 50px;
                right: 10px;
            }
            .hero .prevImg {
                left: 2px;
            }
            .hero .nextImg {
                right: 2px;
            }
            .hero::before {
                content: '';
                position: absolute;
                inset: 0 0 auto 0;
                height: 110px;
                background: linear-gradient(rgba(0, 0, 0, 0.28), rgba(0, 0, 0, 0));
            }
            .dots {
                position: absolute;
                left: 50%;
                transform: translateX(-50%);
                bottom: 14px;
                display: flex;
                gap: 6px;
                padding: 5px 7px;
                border-radius: 10px;
                background: rgba(0, 0, 0, 0.28);
                backdrop-filter: blur(8px);
            }
            .dots i {
                width: 6px;
                height: 6px;
                border-radius: 3px;
                background: rgba(255, 255, 255, 0.6);
            }
            .dots i.on {
                background: #fff;
                width: 16px;
            }

            .eyebrow {
                margin-top: 22px;
                font-size: 13px;
                font-weight: 500;
                letter-spacing: 0.06em;
                text-transform: uppercase;
                color: var(--ink2);
            }
            .rTitle {
                margin-top: 4px;
            }
            .byline {
                margin-top: 10px;
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                column-gap: 14px;
                row-gap: 2px;
            }
            .byline span {
                display: inline-flex;
                align-items: center;
                gap: 5px;
            }
            .byline .link {
                min-height: 32px;
            }

            .facts {
                margin-top: 20px;
                display: grid;
                grid-template-columns: 1fr 1fr 1fr;
                border-top: 1px solid var(--line);
                border-bottom: 1px solid var(--line);
            }
            .facts > div {
                padding: 14px 0;
            }

            .facts .v {
                font-size: 17px;
                font-weight: 600;
                letter-spacing: -0.015em;
                display: flex;
                align-items: center;
                gap: 6px;
            }
            .diff {
                display: inline-flex;
                gap: 3px;
            }
            .diff i {
                width: 6px;
                height: 6px;
                border-radius: 50%;
                background: var(--ink);
            }
            .diff i.off {
                background: transparent;
                box-shadow: inset 0 0 0 1.25px var(--control);
            }

            .editBtn {
                margin-top: 20px;
                height: 48px;
                border-radius: 12px;
                background: var(--surface);
                color: var(--ink);
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                font-size: 15px;
                font-weight: 600;
            }

            .desc {
                margin-top: 24px;
                display: -webkit-box;
                -webkit-line-clamp: 3;
                -webkit-box-orient: vertical;
                overflow: hidden;
            }
            .more {
                min-height: 36px;
            }
            .tags {
                margin-top: 4px;
            }

            .block {
                margin-top: 32px;
            }
            .stars {
                display: inline-flex;
                gap: 2px;
                color: var(--ink);
            }
            .stars .ic {
                width: 15px;
                height: 15px;
                fill: currentColor;
                stroke: none;
            }
            .rateRow {
                margin-top: 6px;
                display: flex;
                align-items: center;
                gap: 8px;
            }

            .nut {
                margin-top: 12px;
                display: grid;
                grid-template-columns: repeat(4, 1fr);
            }
            .nut .v {
                font-size: 17px;
                font-weight: 600;
                letter-spacing: -0.015em;
            }
            .nutNote {
                margin-top: 12px;
                text-wrap: pretty;
            }
            .nutNote a {
                color: var(--accent);
                text-decoration: underline;
                text-underline-offset: 2px;
                text-decoration-thickness: 1px;
            }

            .switch {
                margin-top: 32px;
                border-top: 1px solid var(--line);
                border-bottom: 1px solid var(--line);
                display: flex;
                align-items: stretch;
                background: var(--canvas);
            }
            .switch .tabs {
                display: flex;
                gap: 22px;
                flex: 1;
            }
            .switch .tabs a {
                display: flex;
                align-items: center;
                height: 48px;
                font-size: 15px;
                font-weight: 500;
                color: var(--ink2);
                position: relative;
            }
            .switch .tabs a.on {
                color: var(--ink);
                font-weight: 600;
            }
            .switch .tabs a.on::after {
                content: '';
                position: absolute;
                left: 0;
                right: 0;
                bottom: -1px;
                height: 2px;
                background: var(--accent);
                border-radius: 1px;
            }
            .awake {
                width: 44px;
                height: 48px;
                display: grid;
                place-items: center;
                margin-right: -6px;
            }
            .awake span {
                width: 32px;
                height: 32px;
                border-radius: 50%;
                display: grid;
                place-items: center;
                box-shadow: inset 0 0 0 1.25px var(--control);
                color: var(--ink);
            }
            .awakeNote {
                margin-top: 10px;
            }

            .ingHead {
                margin-top: 28px;
                display: flex;
                align-items: baseline;
                gap: 8px;
            }
            .ingHead h2,
            .stepHead h2 {
                font-size: 17px;
                font-weight: 600;
                letter-spacing: -0.015em;
            }
            .ctrlRow {
                margin-top: 8px;
                display: flex;
                align-items: center;
                justify-content: space-between;
            }
            .stepper {
                display: flex;
                align-items: center;
            }
            .stepper .b {
                width: 44px;
                height: 44px;
                display: grid;
                place-items: center;
            }
            .stepper .b span {
                width: 32px;
                height: 32px;
                border-radius: 50%;
                display: grid;
                place-items: center;
                box-shadow: inset 0 0 0 1.25px var(--control);
            }
            .stepper .n {
                min-width: 28px;
                text-align: center;
                font-weight: 600;
            }
            .stepper .b:first-child {
                margin-left: -6px;
            }

            .group {
                margin-top: 18px;
                font-size: 13px;
                font-weight: 600;
                letter-spacing: 0.06em;
                text-transform: uppercase;
                color: var(--ink2);
            }
            .ing {
                list-style: none;
                margin-top: 4px;
            }
            .ing li {
                display: flex;
                gap: 14px;
                align-items: flex-start;
                padding: 9px 0;
            }
            .box {
                width: 22px;
                height: 22px;
                flex: none;
                border-radius: 6px;
                box-shadow: inset 0 0 0 1.5px var(--control);
                margin-top: 2px;
                display: grid;
                place-items: center;
            }
            .box.on {
                background: var(--accentFill);
                box-shadow: none;
                color: #fff;
            }
            .box.on .ic {
                width: 14px;
                height: 14px;
                stroke-width: 2.4;
            }
            .ing .q {
                font-weight: 600;
            }
            .ing .note {
                color: var(--ink2);
            }
            .ing li.done {
                color: var(--ink2);
            }
            .ing li.done .q {
                color: var(--ink2);
            }

            .stepHead {
                margin-top: 36px;
                display: flex;
                align-items: center;
                justify-content: space-between;
            }
            .steps {
                list-style: none;
                margin-top: 8px;
            }
            .steps li {
                display: grid;
                grid-template-columns: 28px 1fr;
                column-gap: 16px;
                padding: 14px 0;
            }
            .num {
                width: 28px;
                height: 28px;
                border-radius: 50%;
                background: var(--surface);
                color: var(--ink2);
                font-size: 13px;
                font-weight: 600;
                display: grid;
                place-items: center;
                margin-top: -1px;
            }
            .steps li.cur .num {
                background: var(--accentFill);
                color: var(--onAccent);
            }
            .steps li.cur {
                position: relative;
            }
            .steps li.cur::before {
                content: '';
                position: absolute;
                left: -12px;
                top: 14px;
                bottom: 14px;
                width: 3px;
                border-radius: 2px;
                background: var(--accent);
            }
            .steps p {
                line-height: 1.5;
            }
            .timer {
                margin-top: 10px;
                display: inline-flex;
                align-items: center;
                gap: 6px;
                height: 30px;
                padding: 0 10px;
                border-radius: 8px;
                background: var(--accentSoft);
                color: var(--accent);
                font-size: 13px;
                font-weight: 600;
            }
            .endSpace {
                height: 40px;
            }
        </style>
    </head>
    <body>
        <svg width="0" height="0" style="position: absolute" aria-hidden="true">
            <defs>
                <style>
                    .p {
                        background-size: cover;
                        background-position: center;
                    }
                </style>
                <symbol id="home" viewBox="0 0 24 24">
                    <path d="M3.5 10.5 12 3.8l8.5 6.7V20a.8.8 0 0 1-.8.8H15v-6h-6v6H4.3a.8.8 0 0 1-.8-.8z" />
                </symbol>
                <symbol id="book" viewBox="0 0 24 24">
                    <path
                        d="M12 6.5C10.2 5 7.6 4.5 4 4.6v13.9c3.6-.1 6.2.4 8 1.9 1.8-1.5 4.4-2 8-1.9V4.6c-3.6-.1-6.2.4-8 1.9zM12 6.5v13.9"
                    />
                </symbol>
                <symbol id="compass" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="8.5" />
                    <path d="m15.2 8.8-1.9 4.5-4.5 1.9 1.9-4.5z" />
                </symbol>
                <symbol id="chevL" viewBox="0 0 24 24"><path d="m14.5 6-6 6 6 6" /></symbol>
                <symbol id="chevR" viewBox="0 0 24 24"><path d="m9.5 6 6 6-6 6" /></symbol>
                <symbol id="dots" viewBox="0 0 24 24">
                    <circle cx="6" cy="12" r="1.1" fill="currentColor" />
                    <circle cx="12" cy="12" r="1.1" fill="currentColor" />
                    <circle cx="18" cy="12" r="1.1" fill="currentColor" />
                </symbol>
                <symbol id="lock" viewBox="0 0 24 24">
                    <rect x="5.5" y="10.5" width="13" height="9" rx="2" />
                    <path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5" />
                </symbol>
                <symbol id="pencil" viewBox="0 0 24 24"><path d="M15.5 5.5l3 3L9 18l-4 1 1-4z" /></symbol>
                <symbol id="globe" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="8" />
                    <path d="M4 12h16M12 4c2.2 2.3 3.2 5 3.2 8s-1 5.7-3.2 8c-2.2-2.3-3.2-5-3.2-8s1-5.7 3.2-8z" />
