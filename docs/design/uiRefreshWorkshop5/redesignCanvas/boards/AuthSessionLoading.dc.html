<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Sign in, checking your session (web)</title>
        <script src="./support.js"></script>
        <link rel="stylesheet" href="ds/commise/tokens.css" />
        <link rel="stylesheet" href="ds/commise/bundle.css" />
        <script src="ds/commise/bundle.js"></script>
        <style id="redesignOverrides">
            /* Redesign: captions are dashed-edge notes at 13 (spec, Patterns). */
            .cap {
                margin: 0 0 !important;
                padding: 10px 12px !important;
                border: 1px dashed var(--line-control);
                border-radius: 12px;
                font: 500 13px/1.35 var(--font-body) !important;
                color: var(--ink-muted);
            }
            .wm {
                font-family: var(--font-display);
                font-weight: 600;
                font-size: 17px;
                line-height: 1.3;
                letter-spacing: -0.012em;
                color: var(--ink);
            }
            input,
            textarea,
            select,
            button {
                font-size: 17px;
            }
            .sr-only {
                font-size: 13px !important;
            }
            /* Sidebar: the active item is --surface-muted with a steel icon, no bar (spec, Patterns). */
            a[aria-current='page'] {
                background: var(--surface-muted) !important;
                color: var(--ink) !important;
            }
            a[aria-current='page'] > span[aria-hidden='true'] {
                display: none !important;
            }
            a[aria-current='page'] svg {
                color: var(--action-text);
            }
            body {
                font-size: 15px;
            }
            [class~='r-14yzgew'] {
                font-size: 15px !important;
            } /* rating star glyphs */
            script {
                display: none;
            }
        </style>
    </head>
    <body>
        <x-dc
            ><helmet
                ><style>
                    body {
                        margin: 0;
                        font-family: var(--font-body);
                        color: var(--ink);
                        background-color: var(--canvas);
                        background-image: var(--background-image-hero);
                        min-height: 100vh;
                    }
                    a {
                        color: inherit;
                        text-decoration: none;
                    }
                    .sb {
                        display: none;
                    }
                    .tb {
                        display: flex;
                    }
                    .mn {
                        padding: 24px 16px calc(4rem + 6.5rem);
                    }
                    @media (min-width: 600px) {
                        .mn {
                            padding-left: 24px;
                            padding-right: 24px;
                        }
                    }
                    @media (min-width: 840px) {
                        .sb {
                            display: flex;
                        }
                        .tb {
                            display: none;
                        }
                        .mn {
                            padding: 24px 32px 32px;
                        }
                    }
                    .ent {
                        display: flex;
                        flex-direction: column;
                        gap: 2px;
                    }
                    @container (min-width:600px) {
                        .ent {
                            flex-direction: row;
                            gap: 12px;
                        }
                        .ent dt {
                            width: 120px;
                        }
                    }
                    .row:hover {
                        background: color-mix(in srgb, var(--ink) 6%, transparent);
                    }
                    .nv:hover {
                        background: color-mix(in srgb, var(--ink) 6%, transparent);
                        color: var(--ink);
                    }
                </style></helmet
            >
            <div style="display: flex; min-height: 100vh">
                <!-- Sidebar (HomeSidebar, from 840) -->
                <div
                    class="sb"
                    style="
                        position: sticky;
                        top: 0;
                        height: 100vh;
                        width: 232px;
                        flex-shrink: 0;
                        flex-direction: column;
                        overflow-y: auto;
                        border-right: 1px solid var(--line-divider);
                        background: color-mix(in srgb, var(--paper) 70%, transparent);
                    "
                >
                    <div style="display: flex; height: 64px; flex-shrink: 0; align-items: center; padding: 0 24px">
                        <span
                            style="
                                font-family: var(--font-display);
                                font-size: 17px;
                                font-weight: 600;
                                line-height: 1.2;
                                color: var(--ink);
                            "
                            aria-label="Commise"
                            >Commise</span
                        >
                    </div>
                    <nav aria-label="Main" style="display: flex; flex-direction: column; gap: 4px; padding: 0 12px">
                        <a
                            class="nv"
                            href="#"
                            style="
                                position: relative;
                                display: flex;
                                min-height: 44px;
                                align-items: center;
                                gap: 12px;
                                border-radius: var(--radius-md);
                                padding: 0 12px;
                                font-size: 15px;
                                font-weight: 600;
                                line-height: 1.2;
                                color: var(--ink-muted);
                            "
                            ><x-import component-from-global-scope="Commise.Icon" name="house" size="24"></x-import
                            ><span>Home</span></a
                        >
                        <a
                            class="nv"
                            href="#"
                            style="
                                position: relative;
                                display: flex;
                                min-height: 44px;
                                align-items: center;
                                gap: 12px;
                                border-radius: var(--radius-md);
                                padding: 0 12px;
                                font-size: 15px;
                                font-weight: 600;
                                line-height: 1.2;
                                color: var(--ink-muted);
                            "
                            ><x-import component-from-global-scope="Commise.Icon" name="bookOpen" size="24"></x-import
                            ><span>Recipes</span></a
                        >
                        <a
                            class="nv"
                            href="#"
                            style="
                                position: relative;
                                display: flex;
                                min-height: 44px;
                                align-items: center;
                                gap: 12px;
                                border-radius: var(--radius-md);
                                padding: 0 12px;
                                font-size: 15px;
                                font-weight: 600;
                                line-height: 1.2;
                                color: var(--ink-muted);
                            "
                            ><x-import component-from-global-scope="Commise.Icon" name="compass" size="24"></x-import
                            ><span>Discover</span></a
                        >
                    </nav>
                    <div style="margin-top: auto">
                        <button
                            class="nv"
                            type="button"
                            aria-expanded="true"
                            style="
                                display: flex;
                                min-height: 44px;
                                align-items: center;
                                gap: 12px;
                                margin: 0 12px 12px;
                                border: 0;
                                background: transparent;
                                font: inherit;
                                font-size: 15px;
                                font-weight: 600;
                                line-height: 1.2;
                                border-radius: var(--radius-md);
                                padding: 0 12px;
                                color: var(--ink-muted);
                                cursor: pointer;
                                width: calc(100% - 24px);
                            "
                        >
                            <x-import
                                component-from-global-scope="Commise.Icon"
                                name="chevronsLeft"
                                size="24"
                            ></x-import
                            ><span>Collapse</span>
                        </button>
                    </div>
                </div>

                <main class="mn" style="min-width: 0; flex: 1">
                    <div
                        style="
                            margin: 0 auto;
                            display: flex;
                            width: 100%;
                            max-width: 640px;
                            flex-direction: column;
                            gap: 16px;
                            padding-bottom: 40px;
                        "
                    >
                        <p class="cap" style="margin: 0">
                            Profile page, before the session is known. The account gate shows one line and nothing else.
                        </p>
                        <p role="status" style="margin: 0; font-size: 17px; line-height: 1.5; color: var(--ink-muted)">
                            Loading your account…
                        </p>
                    </div>
                </main>

                <!-- Bottom tab bar (HomeTabBar, below 840) -->
                <nav
                    class="tb"
                    aria-label="Tabs"
                    style="
                        position: fixed;
                        left: 0;
                        right: 0;
                        bottom: 0;
                        z-index: 50;
                        isolation: isolate;
                        height: 64px;
                        justify-content: space-around;
                        padding: 0 8px;
                    "
                >
                    <x-import component-from-global-scope="Commise.ChromeSurface" edge="top"></x-import>
                    <a
                        href="#"
                        style="
                            position: relative;
                            display: flex;
                            min-height: 56px;
                            min-width: 96px;
                            flex: 1;
                            flex-direction: column;
                            align-items: center;
                            justify-content: center;
                            gap: 4px;
                            color: var(--ink-muted);
                        "
                        ><x-import component-from-global-scope="Commise.Icon" name="house" size="24"></x-import
                        ><span style="font-size: 13px; font-weight: 500; line-height: 1.4">Home</span></a
                    >
                    <a
                        href="#"
                        style="
                            position: relative;
                            display: flex;
                            min-height: 56px;
                            min-width: 96px;
                            flex: 1;
                            flex-direction: column;
                            align-items: center;
                            justify-content: center;
                            gap: 4px;
                            color: var(--ink-muted);
                        "
                        ><x-import component-from-global-scope="Commise.Icon" name="bookOpen" size="24"></x-import
                        ><span style="font-size: 13px; font-weight: 500; line-height: 1.4">Recipes</span></a
                    >
                    <a
                        href="#"
                        style="
                            position: relative;
                            display: flex;
                            min-height: 56px;
                            min-width: 96px;
                            flex: 1;
                            flex-direction: column;
                            align-items: center;
                            justify-content: center;
                            gap: 4px;
                            color: var(--ink-muted);
                        "
                        ><x-import component-from-global-scope="Commise.Icon" name="compass" size="24"></x-import
                        ><span style="font-size: 13px; font-weight: 500; line-height: 1.4">Discover</span></a
                    >
                </nav>
            </div>
        </x-dc>
        <script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":844}}'>
            class Component extends DCLogic { renderVals(){ return { noop: function(){}, back: { label: 'Back to Profile', parent: 'Profile', onPress: function(){}, href: '#' } }; } }
        </script>
    </body>
</html>
