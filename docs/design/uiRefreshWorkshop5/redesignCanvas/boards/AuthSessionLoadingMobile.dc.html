<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Sign in, checking your session (mobile)</title>
        <script src="./support.js"></script>
        <link rel="stylesheet" href="ds/commise/tokens.css" />
        <link rel="stylesheet" href="ds/commise/bundle.css" />
        <script src="ds/commise/bundle.js"></script>
        <style id="redesignOverrides">
            /* Redesign: captions are dashed-edge notes at 13 (spec, Patterns). */
            .cap {
                margin: 0 16px !important;
                padding: 10px 12px !important;
                border: 1px dashed var(--line-control);
                border-radius: 12px;
                font: 500 13px/1.35 var(--font-body) !important;
                color: var(--ink-muted);
            }
            .wm {
                font-family: var(--font-display);
                font-weight: 600;
                font-size: 17px;
                line-height: 1.3;
                letter-spacing: -0.012em;
                color: var(--ink);
            }
            input,
            textarea,
            select,
            button {
                font-size: 17px;
            }
            .sr-only {
                font-size: 13px !important;
            }
            /* Sidebar: the active item is --surface-muted with a steel icon, no bar (spec, Patterns). */
            a[aria-current='page'] {
                background: var(--surface-muted) !important;
                color: var(--ink) !important;
            }
            a[aria-current='page'] > span[aria-hidden='true'] {
                display: none !important;
            }
            a[aria-current='page'] svg {
                color: var(--action-text);
            }
            body {
                font-size: 15px;
            }
            [class~='r-14yzgew'] {
                font-size: 15px !important;
            } /* rating star glyphs */
            script {
                display: none;
            }
        </style>
    </head>
    <body>
        <x-dc
            ><helmet
                ><style>
                    body {
                        margin: 0;
                        width: 390px;
                        background: var(--canvas);
                        color: var(--ink);
                        font-family: var(--font-body);
                    }
                    *,
                    *::before,
                    *::after {
                        box-sizing: border-box;
                    }
                </style></helmet
            >
            <div
                style="
                    display: flex;
                    flex-direction: column;
                    width: 390px;
                    height: 844px;
                    background-color: var(--canvas);
                    background-image: var(--background-image-hero);
                "
            >
                <x-import
                    component-from-global-scope="Commise.Native.LoadingNotice"
                    label="Checking your session…"
                ></x-import>
            </div>
        </x-dc>
        <script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
            class Component extends DCLogic { renderVals(){ return { noop: function(){}, yes: true, no: false }; } }
        </script>
    </body>
</html>
