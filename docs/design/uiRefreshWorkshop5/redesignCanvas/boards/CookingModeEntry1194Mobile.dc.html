<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Cooking mode, entry (tablet 1194 px)</title>
        <script src="./support.js"></script>
    </head>
    <body>
        <x-dc>
            <helmet>
                <link
                    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600&display=swap"
                    rel="stylesheet"
                />
                <style>
                    body {
                        margin: 0;
                    }
                    [data-theme='light'] {
                        --canvas: #eff3f6;
                        --paper: #fcfdff;
                        --ink: #171b20;
                        --ink-muted: #5c646e;
                        --line-control: #80878f;
                        --line-divider: #dfe3e8;
                        --action: #325c7f;
                        --action-text: #325c7f;
                        --here-bar: #325c7f;
                        --attention: #8c5a00;
                        --paper-raised: #ffffff;
                        --paper-overlay: #ffffff;
                        --surface-muted: #e9edf2;
                        --inverse: #171b20;
                        --inverse-ink: #ffffff;
                        --scrim: rgba(10, 16, 24, 0.42);
                        --on-action: #ffffff;
                        --shadow-lg: 0 2px 4px rgba(10, 20, 30, 0.08), 0 8px 22px rgba(10, 20, 30, 0.12);
                    }
                    [data-theme='dark'] {
                        --canvas: #0e161e;
                        --paper: #172029;
                        --ink: #ebeff2;
                        --ink-muted: #a3acb6;
                        --line-control: #7d8792;
                        --line-divider: #262f38;
                        --action: #96bcde;
                        --action-text: #96bcde;
                        --here-bar: #96bcde;
                        --attention: #efba64;
                        --paper-raised: #212b36;
                        --paper-overlay: #26313d;
                        --surface-muted: #212b36;
                        --inverse: #ebeff2;
                        --inverse-ink: #171b20;
                        --scrim: rgba(0, 0, 0, 0.66);
                        --on-action: #0e161e;
                        --shadow-lg: 0 2px 4px rgba(0, 0, 0, 0.3), 0 8px 22px rgba(0, 0, 0, 0.4);
                    }
                    * {
                        box-sizing: border-box;
                        margin: 0;
                        padding: 0;
                    }
                    body {
                        font-family: Inter, system-ui, sans-serif;
                    }
                    .sheetTitle {
                        font:
                            600 28px/1.15 Manrope,
                            Inter,
                            sans-serif;
                        margin-bottom: 8px;
                    }
                    .sheetNote {
                        font-size: 15px;
                        color: #5c646e;
                        max-width: 820px;
                        margin-bottom: 40px;
                        line-height: 1.45;
                    }
                    .secTitle {
                        font-size: 17px;
                        font-weight: 600;
                        margin: 0 0 16px;
                        max-width: 900px;
                    }
                    section {
                        margin-bottom: 64px;
                    }
                    .row {
                        display: flex;
                        flex-wrap: wrap;
                        gap: 40px;
                        align-items: flex-start;
                    }
                    figure {
                        display: flex;
                        flex-direction: column;
                        gap: 10px;
                    }
                    figcaption {
                        font-size: 13px;
                        color: #5c646e;
                        max-width: 390px;
                        line-height: 1.4;
                    }
                    figcaption b {
                        color: #171b20;
                        font-weight: 600;
                    }

                    .screen {
                        background: var(--canvas);
                        color: var(--ink);
                        position: relative;
                        overflow: hidden;
                        display: flex;
                        flex-direction: column;
                        font-family: Inter, system-ui, sans-serif;
                    }
                    .phone {
                        border-radius: 44px;
                        box-shadow:
                            0 0 0 10px #111,
                            0 20px 50px rgba(0, 0, 0, 0.25);
                    }
                    .tab834,
                    .tab1194 {
                        border-radius: 28px;
                        box-shadow:
                            0 0 0 14px #111,
                            0 20px 50px rgba(0, 0, 0, 0.25);
                    }
                    .web1280,
                    .web768 {
                        border-radius: 10px;
                        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
                    }
                    .status {
                        height: 47px;
                        flex: none;
                        display: flex;
                        align-items: flex-end;
                        padding: 0 32px 6px;
                        font-size: 17px;
                        font-weight: 600;
                        font-variant-numeric: tabular-nums;
                    }
                    .tab834 .status {
                        height: 32px;
                    }
                    .homeBar {
                        position: absolute;
                        bottom: 8px;
                        left: 50%;
                        width: 134px;
                        height: 5px;
                        margin-left: -67px;
                        border-radius: 3px;
                        background: var(--ink);
                        opacity: 0.9;
                    }

                    /* Type: 28 (title and focus), 17, 15 and 13: the redesign ramp (owner decision C1). */
                    .t17 b {
                        font-weight: 600;
                    }
                    .t17 {
                        font-size: 17px;
                        line-height: 1.4;
                    }
                    .t13 {
                        font-size: 13px;
                        line-height: 1.35;
                    }
                    .title {
                        font:
                            600 28px/1.15 Manrope,
                            Inter,
                            sans-serif;
                        letter-spacing: -0.02em;
                    }
                    .strong {
                        font-weight: 600;
                    }
                    .over {
                        font-size: 13px;
                        line-height: 1.35;
                        font-weight: 600;
                        letter-spacing: 0.06em;
                        text-transform: uppercase;
                        color: var(--ink-muted);
                        display: flex;
                        align-items: center;
                        gap: 6px;
                    }
                    .att {
                        color: var(--attention);
                    }
                    .over.att {
                        color: var(--attention);
                    }
                    span.att {
                        display: inline-flex;
                        align-items: center;
                        gap: 3px;
                        font-weight: 600;
                    }
                    .muted {
                        color: var(--ink-muted);
                    }
                    .num {
                        font-variant-numeric: tabular-nums;
                    }
                    .linkish {
                        color: var(--action-text);
                        font-weight: 600;
                    }

                    .top {
                        flex: none;
                        min-height: 60px;
                        display: flex;
                        align-items: center;
                        gap: 12px;
                        padding: 6px 16px;
                    }
                    .web1280 .top,
                    .web768 .top,
                    .tab1194 .top {
                        padding-top: 12px;
                    }
                    .iconBtn {
                        width: 48px;
                        height: 48px;
                        border-radius: 24px;
                        background: var(--surface-muted);
                        display: grid;
                        place-items: center;
                        flex: none;
                    }
                    .placeBtn {
                        flex: 1;
                        min-width: 0;
                        min-height: 48px;
                        display: flex;
                        flex-direction: column;
                        justify-content: center;
                    }
                    .placeRow {
                        display: flex;
                        align-items: center;
                        gap: 4px;
                    }
                    .placeRow svg {
                        color: var(--action-text);
                    }
                    .pillBtn {
                        height: 48px;
                        padding: 0 14px;
                        border-radius: 24px;
                        border: 1px solid var(--line-control);
                        display: flex;
                        align-items: center;
                        gap: 8px;
                        font-size: 17px;
                        font-weight: 500;
                        flex: none;
                    }
                    .pillBtn svg {
                        color: var(--action-text);
                    }
                    .track {
                        flex: none;
                        display: flex;
                        gap: 4px;
                        padding: 2px 16px 0;
                    }
                    .track i {
                        flex: 1;
                        height: 4px;
                        border-radius: 2px;
                        background: var(--line-divider);
                    }
                    .track i.done {
                        background: var(--ink-muted);
                    }
                    .track i.now {
                        background: var(--here-bar);
                    }

                    .body {
                        flex: 1;
                        min-height: 0;
                        overflow: hidden;
                        display: flex;
                        flex-direction: column;
                    }
                    .center {
                        padding: 18px 20px 12px;
                        display: flex;
                        flex-direction: column;
                        gap: 12px;
                        width: 100%;
                    }
                    .web768 .center,
                    .web768 .dock,
                    .web768 .nav {
                        width: 100%;
                        max-width: 600px;
                        margin-left: auto;
                        margin-right: auto;
                    }
                    .narrow {
                        max-width: 600px;
                        margin: 0 auto;
                    }
                    .record {
                        display: flex;
                        align-items: center;
                        gap: 10px;
                        min-height: 44px;
                        color: var(--ink-muted);
                        border-bottom: 1px solid var(--line-divider);
                    }
                    .record .t17 {
                        flex: 1;
                    }
                    .focusLine {
                        display: flex;
                        gap: 14px;
                        align-items: flex-start;
                    }
                    .focusLine .box {
                        width: 32px;
                        height: 32px;
                        margin-top: 6px;
                    }
                    .then {
                        display: flex;
                        flex-direction: column;
                        padding-top: 6px;
                    }
                    .then .over {
                        margin-bottom: 2px;
                    }
                    .thenLine {
                        display: flex;
                        gap: 14px;
                        align-items: flex-start;
                        padding: 10px 0;
                        border-top: 1px solid var(--line-divider);
                    }
                    .thenLine .box {
                        margin-top: -2px;
                    }
                    .plainLine {
                        padding: 10px 0;
                    }
                    .hint {
                        padding-top: 4px;
                    }
                    .box {
                        width: 26px;
                        height: 26px;
                        border-radius: 8px;
                        border: 1.5px solid var(--line-control);
                        flex: none;
                        display: grid;
                        place-items: center;
                    }
                    .box.on {
                        background: var(--ink-muted);
                        border-color: var(--ink-muted);
                        color: var(--canvas);
                    }
                    .offerRow {
                        display: flex;
                        align-items: center;
                        gap: 12px;
                        flex-wrap: wrap;
                    }
                    .offerRow .t17 {
                        flex: 1;
                    }
                    .offer {
                        height: 48px;
                        padding: 0 16px;
                        border-radius: 24px;
                        border: 1px solid var(--line-control);
                        display: inline-flex;
                        align-items: center;
                        gap: 8px;
                        font-size: 17px;
                        font-weight: 600;
                        color: var(--action-text);
                    }
                    .jobs {
                        display: flex;
                        flex-direction: column;
                        padding-top: 6px;
                    }
                    .jobs .over {
                        margin-bottom: 4px;
                    }
                    .job {
                        min-height: 56px;
                        display: flex;
                        align-items: center;
                        gap: 12px;
                        border-top: 1px solid var(--line-divider);
                    }
                    .job .t17 {
                        flex: 1;
                    }
                    .doBtn {
                        height: 44px;
                        padding: 0 14px;
                        border-radius: 22px;
                        border: 1px solid var(--line-control);
                        display: grid;
                        place-items: center;
                        font-size: 13px;
                        font-weight: 600;
                        flex: none;
                    }
                    .notice {
                        display: flex;
                        gap: 12px;
                        align-items: flex-start;
                        padding-top: 14px;
                        border-top: 1px solid var(--line-divider);
                    }
                    .notice svg {
                        color: var(--attention);
                        flex: none;
                        margin-top: 2px;
                    }

                    .dock {
                        flex: none;
                        margin: 0 16px;
                        border-top: 1px solid var(--line-divider);
                    }
                    .dockRow {
                        display: flex;
                        align-items: center;
                        gap: 12px;
                        padding: 8px 0 8px 2px;
                        min-height: 60px;
                    }
                    .dockRow + .dockRow {
                        border-top: 1px solid var(--line-divider);
                    }
                    .dockRow .lab {
                        flex: 1;
                        min-width: 0;
                        display: flex;
                        flex-direction: column;
                    }
                    .pauseBtn {
                        width: 52px;
                        height: 52px;
                        border-radius: 26px;
                        background: var(--surface-muted);
                        display: grid;
                        place-items: center;
                        flex: none;
                    }
                    .nav {
                        flex: none;
                        display: flex;
                        gap: 12px;
                        padding: 10px 16px 30px;
                        width: 100%;
                    }
                    .nav.col {
                        flex-direction: column;
                    }
                    .navWrap {
                        width: 100%;
                        flex: none;
                    }
                    .btn {
                        min-height: 72px;
                        border-radius: 18px;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        gap: 6px;
                        font-size: 17px;
                        font-weight: 600;
                    }
                    .btnBack {
                        width: 96px;
                        border: 1px solid var(--line-control);
                        flex: none;
                    }
                    .btnNext {
                        flex: 1;
                        background: var(--action);
                        color: var(--on-action);
                        justify-content: space-between;
                        padding: 10px 14px 10px 18px;
                        min-width: 0;
                    }
                    .btnOutline {
                        border: 1px solid var(--line-control);
                    }
                    .nx {
                        display: flex;
                        flex-direction: column;
                        min-width: 0;
                        text-align: left;
                    }
                    .nx .lab {
                        font-weight: 500;
                        opacity: 0.9;
                    }

                    .bys {
                        display: flex;
                        flex-direction: column;
                        gap: 14px;
                        padding-top: 0;
                    }
                    .timedList {
                        display: flex;
                        flex-direction: column;
                    }
                    .timed {
                        display: grid;
                        grid-template-columns: 128px 1fr;
                        gap: 12px;
                        padding: 8px 0;
                        border-top: 1px solid var(--line-divider);
                    }
                    .bysRow {
                        display: flex;
                        flex-direction: column;
                        gap: 6px;
                        padding-top: 14px;
                        border-top: 1px solid var(--line-divider);
                    }
                    .bysRow.perm {
                        flex-direction: row;
                        align-items: center;
                        gap: 14px;
                    }
                    .permText {
                        flex: 1;
                        display: flex;
                        flex-direction: column;
                        gap: 4px;
                    }
                    .outlineBtn {
                        height: 48px;
                        padding: 0 18px;
                        border-radius: 24px;
                        border: 1px solid var(--line-control);
                        display: grid;
                        place-items: center;
                        font-size: 17px;
                        font-weight: 600;
                        color: var(--action-text);
                        flex: none;
                    }
                    .stepper {
                        display: flex;
                        align-items: center;
                        gap: 4px;
                        padding: 10px 20px 6px;
                    }
                    .stepper.inline {
                        padding: 0;
                    }
                    .stepper .lab {
                        flex: 1;
                    }
                    .stepBtn {
                        width: 52px;
                        height: 52px;
                        border-radius: 26px;
                        border: 1px solid var(--line-control);
                        display: grid;
                        place-items: center;
                        flex: none;
                    }
                    .stepVal {
                        width: 40px;
                        text-align: center;
                        font-size: 17px;
                        font-weight: 600;
                    }
                    .doneBody {
                        display: flex;
                        flex-direction: column;
                        gap: 12px;
                        padding-top: 40px;
                    }

                    .alarm {
                        background: var(--inverse);
                        color: var(--inverse-ink);
                    }
                    .alarm .over {
                        color: var(--inverse-ink);
                        opacity: 0.8;
                    }
                    .alarm .homeBar {
                        background: var(--inverse-ink);
                    }
                    .alarmWrap {
                        flex: 1;
                        display: flex;
                        flex-direction: column;
                        width: 100%;
                        max-width: 640px;
                        margin: 0 auto;
                    }
                    .alarmBody {
                        flex: 1;
                        padding: 40px 24px 0;
                        display: flex;
                        flex-direction: column;
                        gap: 18px;
                    }
                    .soft {
                        opacity: 0.85;
                    }
                    .ring {
                        width: 64px;
                        height: 64px;
                        border-radius: 32px;
                        border: 2px solid currentColor;
                        display: grid;
                        place-items: center;
                    }
                    .alarmNav {
                        flex: none;
                        padding: 0 16px 30px;
                        display: flex;
                        flex-direction: column;
                        gap: 12px;
                    }
                    .stopBtn {
                        height: 112px;
                        border-radius: 24px;
                        background: var(--inverse-ink);
                        color: var(--inverse);
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        gap: 12px;
                    }
                    .alarmSecondary {
                        display: flex;
                        gap: 12px;
                    }
                    .ghost {
                        flex: 1;
                        height: 64px;
                        border-radius: 18px;
                        border: 1px solid currentColor;
                        display: grid;
                        place-items: center;
                    }

                    .lock {
                        background: linear-gradient(180deg, #2b3440, #11161c);
                        color: #fff;
                    }
                    .lock .homeBar {
                        background: #fff;
                    }
                    .lockTime {
                        text-align: center;
                        font-size: 80px;
                        font-weight: 600;
                        letter-spacing: -0.02em;
                        margin-top: 24px;
                    }
                    .lockDate {
                        text-align: center;
                        font-size: 17px;
                        opacity: 0.85;
                    }
                    .dim {
                        opacity: 0.75;
                    }
                    .sysAlert {
                        margin: 26px 12px 0;
                        border-radius: 26px;
                        background: rgba(40, 46, 54, 0.82);
                        padding: 18px;
                        display: flex;
                        flex-direction: column;
                        gap: 14px;
                        outline: 1px dashed rgba(255, 255, 255, 0.35);
                        outline-offset: 4px;
                    }
                    .sysRow {
                        display: flex;
                        gap: 10px;
                    }
                    .sysBtn {
                        flex: 1;
                        height: 56px;
                        border-radius: 28px;
                        background: rgba(255, 255, 255, 0.16);
                        display: grid;
                        place-items: center;
                    }
                    .sysBtn.stop {
                        background: #fff;
                        color: #11161c;
                    }
                    .sysNote {
                        margin: 16px 24px 0;
                        opacity: 0.7;
                    }

                    .scrimWrap {
                        position: absolute;
                        inset: 0;
                        background: var(--scrim);
                    }
                    .sheet {
                        position: absolute;
                        left: 0;
                        right: 0;
                        bottom: 0;
                        top: 150px;
                        background: var(--paper-overlay);
                        border-radius: 24px 24px 0 0;
                        display: flex;
                        flex-direction: column;
                        box-shadow: var(--shadow-lg);
                        overflow: hidden;
                        padding-bottom: 28px;
                    }
                    .sheet.tall {
                        top: 120px;
                    }
                    .web768 .sheet {
                        left: 84px;
                        right: 84px;
                    }
                    .sideSheet {
                        position: absolute;
                        top: 0;
                        right: 0;
                        bottom: 0;
                        width: 420px;
                        background: var(--paper-overlay);
                        box-shadow: var(--shadow-lg);
                        display: flex;
                        flex-direction: column;
                        padding-top: 24px;
                    }
                    .grab {
                        width: 40px;
                        height: 5px;
                        border-radius: 3px;
                        background: var(--line-divider);
                        margin: 8px auto 0;
                        flex: none;
                    }
                    .sheetHead {
                        display: flex;
                        align-items: center;
                        justify-content: space-between;
                        padding: 10px 16px 6px 20px;
                        gap: 12px;
                    }
                    .smallBtn {
                        height: 48px;
                        padding: 0 16px;
                        border-radius: 24px;
                        background: var(--surface-muted);
                        display: grid;
                        place-items: center;
                    }
                    .group {
                        padding: 12px 20px 2px;
                    }
                    .ing {
                        display: flex;
                        align-items: center;
                        gap: 14px;
                        min-height: 50px;
                        padding: 0 20px;
                    }
                    .ing .t17 {
                        flex: 1;
                    }
                    .already {
                        display: flex;
                        align-items: center;
                        justify-content: space-between;
                        min-height: 50px;
                        margin: 6px 20px 0;
                        border-top: 1px solid var(--line-divider);
                        color: var(--ink-muted);
                    }

                    .allList {
                        display: flex;
                        flex-direction: column;
                        padding: 4px 20px;
                        overflow: hidden;
                    }
                    .stepItem {
                        display: flex;
                        gap: 12px;
                        align-items: flex-start;
                        padding: 7px 0;
                        border-top: 1px solid var(--line-divider);
                    }
                    .stepItem:first-child {
                        border-top: 0;
                    }
                    .stepItem.isNow {
                        box-shadow: inset 3px 0 0 var(--here-bar);
                        padding-left: 10px;
                        margin-left: -10px;
                    }
                    .stepMark {
                        width: 28px;
                        height: 28px;
                        border-radius: 14px;
                        border: 1.5px solid var(--line-control);
                        display: grid;
                        place-items: center;
                        font-size: 13px;
                        font-weight: 600;
                        flex: none;
                    }
                    .stepMark.done {
                        background: var(--ink-muted);
                        border-color: var(--ink-muted);
                        color: var(--canvas);
                    }
                    .stepMark.now {
                        border: 2px solid var(--here-bar);
                        color: var(--action-text);
                    }
                    .stepText {
                        display: flex;
                        flex-direction: column;
                        min-width: 0;
                    }
                    .nested {
                        margin-left: 40px;
                        border-left: 2px solid var(--line-divider);
                        padding-left: 12px;
                    }
                    .nested .dockRow {
                        min-height: 52px;
                    }

                    .cols {
                        flex: 1;
                        min-height: 0;
                        display: grid;
                        margin-top: 10px;
                    }
                    .c2 {
                        grid-template-columns: 300px 1fr;
                    }
                    .c3 {
                        grid-template-columns: 300px 1fr 360px;
                    }
                    .colIng {
                        background: var(--paper);
                        border-right: 1px solid var(--line-divider);
                        overflow: hidden;
                    }
                    .colStep {
                        display: flex;
                        flex-direction: column;
                        min-width: 0;
                    }
                    .colStep .center {
                        padding: 22px 32px 12px;
                        max-width: 680px;
                    }
                    .colStep .dock {
                        margin: 0 32px;
                    }
                    .colStep .nav {
                        padding: 10px 32px 28px;
                        max-width: 680px;
                    }
                    .tab834 .colStep .nav {
                        padding-bottom: 30px;
                    }
                    .colAll {
                        border-left: 1px solid var(--line-divider);
                        padding: 20px 4px 20px 0;
                        display: flex;
                        flex-direction: column;
                        gap: 6px;
                        overflow: hidden;
                    }
                    .colAll > .over {
                        padding: 0 20px;
                    }
                    .addTimer {
                        display: flex;
                        align-items: center;
                        gap: 8px;
                        min-height: 48px;
                        padding: 0 20px;
                        color: var(--action-text);
                        font-size: 17px;
                        font-weight: 600;
                    }
                    .colHead {
                        padding: 16px 20px 0;
                    }
                    .navWrap {
                        padding: 0;
                    }
                    .navWrap .nav {
                        padding-left: 16px;
                        padding-right: 16px;
                    }
                    .btnBack {
                        width: 72px;
                        min-height: 72px;
                        padding: 0;
                    }
                    .btnNext {
                        padding: 10px 18px;
                    }
                    .job {
                        cursor: pointer;
                        gap: 14px;
                    }
                    .earlier .thenLine:first-of-type {
                        border-top: 0;
                    }
                    .lowerAll {
                        flex: none;
                        margin: 0 32px;
                        border-top: 1px solid var(--line-divider);
                        padding-top: 14px;
                    }
                    .lowerAll .allList {
                        padding: 4px 0;
                    }
                    .lowerAll .over {
                        margin-bottom: 4px;
                    }
                    .btnNext {
                        padding: 10px 14px 10px 16px;
                    }
                    .nx .lab {
                        font-weight: 600;
                        opacity: 0.9;
                    }
                    .phone .nav {
                        padding-left: 12px;
                        padding-right: 12px;
                        gap: 8px;
                    }
                    .btnNext {
                        padding: 10px 12px 10px 14px;
                    }
                    .nextLine {
                        letter-spacing: -0.01em;
                    }
