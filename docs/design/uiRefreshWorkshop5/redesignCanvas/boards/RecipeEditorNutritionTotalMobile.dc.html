<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Recipe editor, nutrition total states (mobile)</title>
        <script src="./support.js"></script>
        <link rel="stylesheet" href="ds/commise/tokens.css" />
        <link rel="stylesheet" href="ds/commise/bundle.css" />
        <script src="ds/commise/bundle.js"></script>
    </head>
    <body>
        <x-dc
            ><helmet
                ><style>
                    body {
                        margin: 0;
                        background: var(--canvas);
                        color: var(--ink);
                        font-family: var(--font-body);
                    }
                    p,
                    figure,
                    figcaption,
                    h1 {
                        margin: 0;
                    }
                    * {
                        box-sizing: border-box;
                    }
                    /* Redesign canvas (workshop 5, round 9): type ramp 13/15/17, native text classes mapped onto it. */
                    .sr-only,
                    .r-109y4c4,
                    [style*='width: 1px'][style*='clip'] {
                        font-size: 13px;
                    }
                    .r-n6v787 {
                        font-size: 13px !important;
                    }
                    .r-1gkfh8e,
                    .r-1enofrn {
                        font-size: 13px !important;
                    }
                    .r-1b43r93,
                    .r-a023e6 {
                        font-size: 15px !important;
                    }
                    .r-ubezar,
                    .r-1inkyih,
                    .r-1i10wst,
                    .r-adyw6z,
                    .r-1x35g6 {
                        font-size: 17px !important;
                    }
                    /* food2 */
                    .fn {
                        display: flex;
                        align-items: flex-start;
                        gap: 12px;
                        margin-top: 8px;
                        padding: 12px 16px;
                        background: var(--paper);
                        border-radius: var(--radius-lg);
                        box-shadow: var(--shadow-md);
                        color: var(--ink);
                        font: 400 15px/1.4 var(--font-body);
                    }
                    .fn .fi {
                        display: inline-flex;
                        flex: none;
                        margin-top: 1px;
                        color: var(--attention);
                    }
                    .fn .fb {
                        display: flex;
                        flex-direction: column;
                        gap: 8px;
                        min-width: 0;
                    }
                    .fn .fb p {
                        margin: 0;
                        font: 400 15px/1.4 var(--font-body);
                        color: var(--ink);
                    }
                    .fbtn {
                        display: inline-flex;
                        align-items: center;
                        justify-content: center;
                        gap: 8px;
                        align-self: flex-start;
                        min-height: 44px;
                        padding: 0 18px;
                        border: 0;
                        border-radius: 12px;
                        background: var(--paper);
                        box-shadow:
                            inset 0 0 0 1px var(--line-divider),
                            var(--shadow-sm);
                        color: var(--ink);
                        font: 600 15px/1 var(--font-body);
                    }
                    .fin {
                        display: flex;
                        align-items: center;
                        gap: 8px;
                        margin-top: 4px;
                        font: 500 15px/1.4 var(--font-body);
                        color: var(--ink-muted);
                    }
                    .fin svg {
                        flex: none;
                        animation: finSpin 1s linear infinite;
                    }
                    @keyframes finSpin {
                        to {
                            transform: rotate(360deg);
                        }
                    }
                    @media (prefers-reduced-motion: reduce) {
                        .fin svg {
                            animation: none;
                        }
                    }
                    [role='option'] .text-body-md {
                        font-size: 15px;
                        font-weight: 600;
                    }
                    [aria-label^='Food suggestions'] button .r-1inkyih {
                        font-size: 15px !important;
                        font-weight: 600 !important;
                    }
                    /* food3 */
                </style></helmet
            >
            <div style="display: flex; flex-direction: column; gap: 24px; padding: 24px 16px">
                <figure style="display: flex; flex-direction: column; gap: 8px">
                    <figcaption style="font: 600 13px/1.4 var(--font-body); color: var(--ink-muted)">
                        Nothing counted
                    </figcaption>
                    <div style="background: var(--surface-muted); border-radius: 12px; padding: 12px 16px">
                        <p
                            style="
                                font: 600 15px/1.4 var(--font-body);
                                color: var(--ink);
                                font-variant-numeric: tabular-nums;
                            "
                        >
                            Nutrition appears as you match ingredients.
                        </p>
                    </div>
                </figure>
                <figure style="display: flex; flex-direction: column; gap: 8px">
                    <figcaption style="font: 600 13px/1.4 var(--font-body); color: var(--ink-muted)">
                        Loading (a still bar; read aloud as “Loading nutrition…”)
                    </figcaption>
                    <div style="background: var(--surface-muted); border-radius: 12px; padding: 12px 16px">
                        <p role="status">
                            <span
                                style="
                                    position: absolute;
                                    width: 1px;
                                    height: 1px;
                                    overflow: hidden;
                                    clip: rect(0 0 0 0);
                                "
                                >Loading nutrition…</span
                            ><span
                                aria-hidden="true"
                                style="
                                    display: block;
                                    height: 16px;
                                    width: 192px;
                                    max-width: 100%;
                                    border-radius: var(--radius-sm);
                                    background: var(--line-divider);
                                "
                            ></span>
                        </p>
                    </div>
                </figure>
                <figure style="display: flex; flex-direction: column; gap: 8px">
                    <figcaption style="font: 600 13px/1.4 var(--font-body); color: var(--ink-muted)">Failed</figcaption>
                    <div style="background: var(--surface-muted); border-radius: 12px; padding: 12px 16px">
                        <div style="display: flex; flex-direction: column; gap: 4px">
                            <p style="font: 500 13px/1.4 var(--font-body); color: var(--ink-muted)">
                                We couldn’t load the nutrition just now. Try again.
                            </p>
                            <div style="display: flex; flex-direction: row">
                                <x-import
                                    component-from-global-scope="Commise.Native.Button"
                                    variant="secondary"
                                    icon="refreshCw"
                                    on-press="{{noop}}"
                                    >Try again</x-import
                                >
                            </div>
                        </div>
                    </div>
                </figure>
                <figure style="display: flex; flex-direction: column; gap: 8px">
                    <figcaption style="font: 600 13px/1.4 var(--font-body); color: var(--ink-muted)">
                        Counted, from a range
                    </figcaption>
                    <div style="background: var(--surface-muted); border-radius: 12px; padding: 12px 16px">
                        <div style="display: flex; flex-direction: column; gap: 4px">
                            <p
                                style="
                                    font: 600 15px/1.4 var(--font-body);
                                    color: var(--ink);
                                    font-variant-numeric: tabular-nums;
                                "
                            >
                                548 cal per serving · 7 of 9 counted
                            </p>
                            <p style="font: 500 13px/1.4 var(--font-body); color: var(--ink-muted)">
                                Estimated from the lower amount of each stated range
                            </p>
                        </div>
                    </div>
                </figure>
            </div></x-dc
        >
        <script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":456}}'>
            class Component extends DCLogic { renderVals(){ const noop=()=>{}; return {noop}; } }
        </script>
    </body>
</html>
