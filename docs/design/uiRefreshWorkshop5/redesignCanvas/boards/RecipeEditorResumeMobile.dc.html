        <script>
            (function () {
                const d = Object.getOwnPropertyDescriptor(Element.prototype, 'scrollHeight');
                Object.defineProperty(HTMLTextAreaElement.prototype, 'scrollHeight', {
                    configurable: true,
                    get() {
                        const s = this.style.height;
                        this.style.height = '0px';
                        const v = d.get.call(this);
                        this.style.height = s;
                        const cs = getComputedStyle(this);
                        return v - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
                    },
                });
            })();
        </script>
        <style id="redesignOverrides">

            [class*='bg-cover-'][aria-hidden='true'],
            [aria-hidden='true'][style*='aspect-ratio'],
            [aria-hidden='true']:has(> div[style*='font-size: 38px']) {

                display: flex;

                align-items: center;
                justify-content: center;
                gap: 8px;
            }
            [class*='bg-cover-'][aria-hidden='true'] > span:first-child,
            [aria-hidden='true'][style*='aspect-ratio'] > div:first-child,
            [aria-hidden='true']:has(> div[style*='font-size: 38px']) > div:first-child {
                position: relative;
                display: block;
                width: 48px;
                height: 48px;
                flex: none;
                border-radius: 50%;
                background: var(--paper);
                font-size: 13px !important;
                line-height: 48px !important;
                color: transparent;
                text-indent: 100%;
                overflow: hidden;
                white-space: nowrap;
            }
            [class*='bg-cover-'][aria-hidden='true'] > span:first-child::before,
            [aria-hidden='true'][style*='aspect-ratio'] > div:first-child::before,
            [aria-hidden='true']:has(> div[style*='font-size: 38px']) > div:first-child::before {
                content: '';
                position: absolute;
                inset: 12px;
                background: var(--ink-muted);
                -webkit-mask: var(--photo-icon) center / contain no-repeat;
                mask: var(--photo-icon) center / contain no-repeat;
            }
            [class*='bg-cover-'][aria-hidden='true'] > span:nth-child(2),
            [aria-hidden='true'][style*='aspect-ratio'] > div:nth-child(2),
            [aria-hidden='true']:has(> div[style*='font-size: 38px']) > div:nth-child(2) {
                display: none !important;
            }
            [class*='bg-cover-'][aria-hidden='true']::after,
            [aria-hidden='true'][style*='aspect-ratio']::after,
            [aria-hidden='true']:has(> div[style*='font-size: 38px'])::after {
                content: 'Waiting for its photo';
                font-size: 13px;
                line-height: 1.35;
                color: var(--ink-muted);
                text-align: center;
            }
            [aria-hidden='true'][style*='aspect-ratio: 1 / 1']::after {
                display: none;
            }
            @container cover (max-height: 6rem) {
                [class*='bg-cover-'][aria-hidden='true']::after {
                    display: none;
                }
            }
            :root {

            }
            [style*='font-variant-numeric: tabular-nums'] {

            .ed-col {

            .r-ubezar,
            .r-1i10wst,
            .r-adyw6z,
            .r-1x35g6 {

            }
