appId: io.commise.mobile
---
# The app's bottom tab bar is on every top-level screen, so Recipes always has a way back to Home (M1,
# `docs/design/uiOverhaul/evaluateShellAndLists.md`; spec `specShellAndLists.md` §S.3).
#
# It used to render only inside Home: Recipes had no tab bar and no Home control, Android's Back at its root left the
# app, and iOS has no system Back, so a cook who opened Recipes was stuck there. This flow walks the fix on a device:
# the bar is on the Recipes root, its Home tab goes Home, the Recipes tab comes back, and a pushed recipe hides the bar
# (the detail has its own Back). It uses no system key, so it runs on iOS too, where the defect was worst. Android's
# Back at the Recipes root is `recipes/systemBackGuard.yaml`'s last leg.
#
# ⛔ ANCHORED, not bare. Under three-button navigation Android publishes system nodes named exactly `Home` and
# `Back` (`maestroBackCollidesWithSystemNav` memory), so a bare `tapOn: 'Home'` may press the SYSTEM Home and leave
# the app. The app's Home and Recipes tabs are the two left of the bar's third tab, "Meal Plan, coming soon"; the
# system Home sits mid-screen, right of that tab's left edge, so `leftOf` tells them apart.
- runFlow: auth/signin.yaml

# signin.yaml ends on the Recipes list. The app tab bar is there, under the list.
- assertVisible: 'My recipes'
- assertVisible:
      text: 'Home'
      leftOf: 'Meal Plan.*'

# Home, through the app's own tab.
- tapOn:
      text: 'Home'
      leftOf: 'Meal Plan.*'
- assertNotVisible: 'My recipes'
- scrollUntilVisible:
      element: 'See all recipes'
      direction: DOWN
      timeout: 20000

# Back to Recipes through the app's tab.
- tapOn:
      text: 'Recipes'
      leftOf: 'Meal Plan.*'
- extendedWaitUntil:
      visible: 'My recipes'
      timeout: 20000

# A pushed recipe hides the bar; it has its own Back, anchored above the title (the system `Back` sits below
# everything). Leaving the detail brings the bar back.
- scrollUntilVisible:
      element: '${E2E_RECIPE_LAMB}'
      direction: DOWN
      timeout: 20000
- tapOn: '${E2E_RECIPE_LAMB}'
- extendedWaitUntil:
      notVisible: 'My recipes'
      timeout: 20000
- assertNotVisible: 'Meal Plan.*'
- tapOn:
      text: 'Back'
      above: '${E2E_RECIPE_LAMB}'
- extendedWaitUntil:
      visible: 'My recipes'
      timeout: 20000
- assertVisible: 'Meal Plan.*'
