# Dismisses iOS's system "Save Password?" sheet when it is up; a no-op everywhere else (Android has no such sheet,
# and on iOS it only appears on some runs). iOS raises it once the password field leaves the screen after a
# sign-in submit, so it lands on the verification-code step (CI run 38950847113: iOS shards 3 and 4 failed every
# flow at `Verification code` / `424242`, screenshots show the sheet over the code field). While it is up, Maestro
# cannot reach the app behind it. The app is right to leave it alone: it is the OS offering to save a real
# credential, and suppressing it would be a worse sign-in for a real cook.
appId: io.commise.mobile
---
- runFlow:
      when:
          visible: 'Not Now'
      commands:
          - tapOn: 'Not Now'
