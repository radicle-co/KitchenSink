# Maestro E2E: the native sign-up journey (plan 012 D8, plan 2026-10-15-010 D13) — the mobile twin of web's
# `signUp.spec.ts`. A signed-out cook opens Create an account, gives a first name, a last name, a username, an email
# and a password (both Clerk instances require all four details, owner ruling 2026-10-13), enters the emailed code,
# and lands signed in.
# The Google / Apple buttons above the form are not pressed: a real provider sign-in cannot be automated.
# The empty-field case is asserted first: each empty field says what it needs, under itself, before anything is sent.
#
# Uses a Clerk `+clerk_test` magic email whose verification accepts the fixed code 424242 — no real mailbox. The
# username and email are made unique per run, because Clerk refuses a taken username.
#
# ⚠️ NOT PLANNED: it CREATES a Clerk user per run, outside the fixed test pool, and nothing reclaims it yet — see its
# entry in `maestroFlowSelection.test.ts`' KNOWN_UNRUN_FLOWS. Run by hand: maestro test .maestro/auth/signUpFlow.yaml

appId: io.commise.mobile
---
- launchApp:
      clearState: true
- extendedWaitUntil:
      visible: 'you@example.com'
      timeout: 30000
- tapOn: 'Create an account'
- assertVisible: 'Create your account'

# Nothing typed: each field says what it needs, and nothing is sent.
- tapOn: 'Create account'
- assertVisible: 'Enter your first name.'
- assertVisible: 'Enter your last name.'
- assertVisible: 'Choose a username.'
- assertVisible: 'Enter your email address.'
- assertVisible: 'Enter a password.'

- evalScript: '${output.suffix = (Math.random().toString(36) + Math.random().toString(36)).replace(/[^a-z0-9]/g, "").slice(0, 10)}'
- tapOn: 'First name'
- inputText: 'Maestro'
- tapOn: 'Last name'
- inputText: 'Signup'
- tapOn: 'Username'
- inputText: 'maestro_${output.suffix}'
- tapOn: 'Email'
- inputText: 'maestro+clerk_test_${output.suffix}@example.com'
- tapOn: 'Password'
- inputText: 'Maestro-signup-pw-1'
- hideKeyboard
- tapOn: 'Create account'

# The emailed code: Clerk test emails accept 424242.
- extendedWaitUntil:
      visible: 'Verification code'
      timeout: 40000
- tapOn: 'Verification code'
- inputText: '424242'
- tapOn: 'Verify'

# Signed in: the authenticated shell is up.
- extendedWaitUntil:
      visible: 'Recipes'
      timeout: 40000
