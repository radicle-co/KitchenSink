# Reusable, idempotent sign-in sub-flow that lands on the RECIPES surface — the shape every recipe flow
# expects. It wraps the login CORE (`signinHome.yaml`, which signs in and lands on the Home widget surface)
# and then crosses into the recipes surface via the recipe widget's "See all recipes" entry.
#
# This split keeps "sign in" (→ Home, the real post-login landing, T104-mobile) separate from "navigate to a
# feature". The recipe flows `runFlow: ../auth/signin.yaml` as their first step and then
# `assertVisible: 'My recipes'` (the list's own segment; 'Recipes' is also a tab label). A Home-surface E2E instead uses the core
# `signinHome.yaml` directly, so it stays on Home.
#
# The login form lives in mobile/src/screens/login.tsx. Credentials mirror the web Playwright suite's
# TEST_USER_* (cross-platform parity).

appId: ${APP_ID}
---
# Sign in and land on Home (idempotent — skips the login form when a session is already persisted).
- runFlow: signinHome.yaml

# Cross from Home into the recipes surface via the recipe widget's "See all recipes" entry (accessibility
# label from the mobile i18n `home.seeAllRecipes`). Done here, in the shared sub-flow, because EVERY consumer
# (the login-chrome flow + all five recipe flows) wants the recipe list next, so each keeps its existing
# `assertVisible: 'My recipes'` with no per-flow change.
# The recipe widget heads the Home surface (the roadmap placeholders follow it, `buildSpec.md` §4.2). The scroll
# stays as a guard for a short screen; it returns at once when the entry is already visible.
- runFlow:
      file: ../recipes/common/scrollIntoTapView.yaml
      env:
          TARGET: 'See all recipes'
          DIRECTION: DOWN
# CI run 39376194588 (iOS shard 3, visibility): the tap came about 20 s after a relaunch and did nothing, so the flow sat on
# Home and the wait below ran out. Let the screen settle, then tap again only if the first tap changed nothing.
- waitForAnimationToEnd:
      timeout: 3000
- tapOn:
      text: 'See all recipes'
      retryTapIfNoChange: true

# The recipes surface: the list's "My recipes" segment (`tabMine`, features/recipes/src/messages.ts). Audit 2026-10-19, A1.6:
# this used to wait for 'Recipes', which is also the TAB label, so Home satisfied it before the tap had landed and every
# flow built on this sub-flow (about 70) started on Home. Home renders no 'My recipes' text on either platform. The wait is
# generous because the list then fetches from the recipe service, slow on first paint under the Metro dev bundler.
- extendedWaitUntil:
      visible: 'My recipes'
      timeout: 40000
