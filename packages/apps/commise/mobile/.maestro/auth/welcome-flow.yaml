# Maestro E2E: the branded welcome / auth-entry hero (U8). Verifies the signed-out app opens on the brand
# hero (wordmark + tagline + the three feature pills) and that its two CTAs route into the sign-up form
# ("Get started") and the sign-in form ("Already have an account? Sign in"). All copy is the mobile i18n
# `welcome.*` dictionary (cross-platform parity with the web welcome route).
#
# Run: maestro test .maestro/auth/welcome-flow.yaml

appId: io.commise.mobile
---
- launchApp:
      clearState: true

# The branded welcome hero: wordmark + tagline + the three feature pills + both entry CTAs.
- assertVisible: 'Commise'
- assertVisible: 'Cook with confidence. Plan with ease.'
- assertVisible: 'Save recipes'
- assertVisible: 'Plan meals'
- assertVisible: 'Shop smarter'
- assertVisible: 'Get started'
- assertVisible: 'Already have an account? Sign in'

# "Get started" routes into the sign-up form (its "Create account" submit is the stable landmark).
- tapOn: 'Get started'
- assertVisible: 'Create account'

# Relaunch clean and take the returning-user path: "Sign in" routes into the sign-in form.
- launchApp:
      clearState: true
- assertVisible: 'Get started'
- tapOn: 'Already have an account? Sign in'
- assertVisible: 'Email'
- assertVisible: 'Password'
- assertVisible: 'Sign in'
