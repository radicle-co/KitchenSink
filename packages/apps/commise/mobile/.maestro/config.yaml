# Maestro workspace config (T087).
#
# This file exists for ONE load-bearing reason: flow DISCOVERY. Pointed at a folder, Maestro "only executes
# Flow files located at the top level of that directory. It ignores subfolders to prevent accidental
# execution of nested or utility Flows" — the `flows` key defaults to `*` (root only). CI runs
# `maestro test packages/apps/commise/mobile/.maestro` (.github/workflows/_ci.yml, the e2e-mobile-maestro
# job), so WITHOUT this file only `home.yaml` runs and every flow under `auth/` and `recipes/` is silently
# skipped — a green job proving almost nothing. The patterns below are what actually make the suite execute.
#
# Deliberately NOT set here:
#
#   - `appId`. Maestro requires `appId` in every flow's own header regardless of the workspace config, so
#     declaring it here would ADD a 10th copy rather than dedupe the 9 that exist — anti-DRY, not DRY. The
#     per-flow `appId: io.commise.mobile` headers stay.
#   - `executionOrder`. `flowsOrder` pins a PREFIX (listed flows run first, in order; everything else runs
#     after in any order), so it cannot express the one ordering wish in the suite — delete.yaml's "run me
#     last" note — without enumerating every other flow and re-enumerating on every addition. No flow
#     currently depends on another's data (each is guarded and self-contained; collections.yaml creates and
#     removes its own fixture), so pinning an order would be ceremony that rots. If a real cross-flow
#     dependency ever appears, fix it by making the flow seed/clean its own data, not by ordering the suite.
#
# `auth/signin.yaml` and `auth/signin-home.yaml` are reusable SUB-flows (`runFlow` targets), not stories, so
# they are excluded from discovery — listing `auth/login-flow.yaml` explicitly admits only the real auth
# story. Adding a flow under `recipes/` needs no change here; adding one under a NEW subfolder does.
#
# `auth/welcome-flow.yaml` was removed with the welcome screen itself (owner decision 2026-07-28): the
# signed-out app opens directly on the sign-in form, and `auth/login-flow.yaml` now covers that entry.
#
# ⚠️ `visual/*` is OMITTED DELIBERATELY — do not "fix" it by adding a pattern. Those are the U10b
# visual-regression flows (`assertScreenshot`) plus their baseline recorder, and they are INERT BY
# CONSTRUCTION until the reference PNGs in `visual/baselines/` are recorded and committed. `assertScreenshot`
# has no record mode, so an assertion whose reference is missing fails hard with "Screenshot file not found"
# — adding `visual/*` here before the baselines exist turns the heavy-e2e job red for everyone. Activation is
# deliberately a two-step act owned by a human: record via `visual/record-baselines.yaml` on the PINNED
# emulator profile (api-level 34 · x86_64 · pixel_6, see `.github/workflows/_ci-heavy.yml`), commit the PNGs,
# then add the flows to `FLOWS` in `tests/e2e/run-maestro-flows.sh` (which is what CI actually iterates —
# this file governs only discovery-based `maestro test <dir>` runs).
flows:
    - '*'
    - 'auth/login-flow.yaml'
    - 'recipes/*'
