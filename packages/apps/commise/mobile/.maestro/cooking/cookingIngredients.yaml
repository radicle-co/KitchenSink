appId: ${APP_ID}
---
# Cooking mode ingredients on a phone (T-015a). The recipe is the signer's `${E2E_RECIPE_COOKING}`, as in
# cookingModeFlow.
# One column: the top bar's Ingredients button opens the sheet over the step, and closing it leaves the cook on the SAME
# step. The two-column band needs 800 wide, which only a tablet reaches, so it is proved by the component tests.
- runFlow: common/openCookingRecipe.yaml
- assertVisible: 'Step 1 of 3'
- tapOn: '^Heat the oven to 200 degrees\.$'
- assertVisible: 'You ticked 1 line'

# ── THE TOP BAR OPENS THE SHEET ──
- tapOn: 'Ingredients'
- assertVisible: 'Close ingredients'

# ── CLOSING IT KEEPS THE STEP AND THE TICK ──
- tapOn: 'Close ingredients'
- assertNotVisible: 'Close ingredients'
- assertVisible: 'Step 1 of 3'
- assertVisible: 'You ticked 1 line'
