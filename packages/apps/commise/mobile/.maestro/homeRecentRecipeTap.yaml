# Home "Recent recipes" card → recipe detail (mobile E2E, US-000 / FR-046 cross-platform parity).
#
# The mobile mirror of the web Playwright coverage for the same story: from the Home widget surface, TAPPING a
# recent-recipe CARD opens that recipe's detail. This is deliberately distinct from `home.yaml`, which drives
# the widget's "See all recipes" entry into the recipes LIST — the card tap is a different affordance and was
# the one that shipped inert on native (every shared card leaf already accepted an `onSelectRecipe` seam; the
# mobile host simply never passed one, so the cards rendered non-interactive with nothing failing).
#
# Chain under test (there is no Expo Router in this app — see `AppRoot`'s B13 note): the card reports its id
# through `RecipeWidgetSlot` → `HomeWidgetSurface` → `HomeScreen` → `AppRoot`'s destination state →
# `RecipesScreen`'s seeded `[list, detail]` stack. The final Back assertion is what proves the stack was
# SEEDED with the list beneath the detail rather than rooted at the detail (which would dead-end).
#
# Requires a seeded recipe API (EXPO_PUBLIC_RECIPE_API_URL) — the same seed the other recipe flows use.

appId: io.commise.mobile
---
# Sign in and land on the Home widget surface (the login core waits on the time-of-day "…Chef" greeting).
- runFlow: auth/signinHome.yaml

# The recipe (recent-recipes) widget renders on Home. The wait absorbs the lazy widget-chunk load plus the
# recipe-service fetch on first paint.
- extendedWaitUntil:
      visible: 'Recent recipes'
      timeout: 40000

# Drive the card → detail hop on the first seeded recipe. Guarded by `when: visible` so a viewer with an EMPTY
# library (no seed, or a fresh test user) still passes the widget assertion above instead of failing the suite —
# the same guard `recipes/listDetail.yaml` uses for exactly this reason.
# ⛔ A HARD WAIT, not only the guard below. `when:` does not wait and does not fail: when the fixture was
# missing it evaluated false, the whole body was SKIPPED, and the flow reported GREEN having asserted
# nothing. That is exactly what happened in run 101351873536 — every reset had failed, the library was
# empty, and this flow passed. The seeded world is now guaranteed by `e2e-seed`, so its absence is a
# failure to report rather than a condition to tolerate. The guard is kept underneath it so the block's
# structure is unchanged; by the time it runs it can only be true.
#
# ⛔ AND IT MUST SCROLL TO THE CARD, not merely wait for it. Measured on a CI-matched emulator
# (2026-09-19): the widget renders all four seeded cards in a VERTICAL list roughly 1,100 px tall EACH,
# under three "Coming soon" placeholder widgets and the week strip, which puts the lamb's button at
# y≈4335 on a 2109 px-tall screen — present in the hierarchy, `visible: false`, and therefore invisible to
# a wait that never moves the surface. A bare `extendedWaitUntil` here spent its whole 30 s timeout and
# went red against a working screen, which reads as "the library is empty" and is the least useful way
# this flow can fail.
#
# `scrollUntilVisible` keeps the property the hard wait was added for — a missing fixture still FAILS
# rather than being skipped — while decoupling the assertion from how many widgets happen to sit above
# the rail. It is the idiom `recipes/listDetail.yaml` uses to reach the same fixture in the list.
- scrollUntilVisible:
      element: '${E2E_RECIPE_LAMB}'
      direction: DOWN
      timeout: 30000
- runFlow:
      when:
          visible: '${E2E_RECIPE_LAMB}'
      commands:
          # The card is a single accessible button named by the recipe title (the shared `RecipeCard` root
          # wraps its content in ONE `PressScale` Pressable labelled with the title).
          - tapOn: '${E2E_RECIPE_LAMB}'

          # The recipe DETAIL opened — assert the detail's own title heading plus a section only the detail
          # renders, so a card that merely highlighted (or a navigation that landed on the list) fails here.
          - extendedWaitUntil:
                visible: '${E2E_RECIPE_LAMB}'
                timeout: 40000
          - assertVisible: 'Ingredients'
          # ⚠️ `Instructions` and `Nutrition (per serving)` were asserted BLIND here, and can no longer be: the
          # seeded lamb now carries five ingredient lines and four steps
          # (`packages/services/recipe-service/src/database/seed.ts`), which pushes both headings roughly a
          # screen below the fold, and `assertVisible` only ever sees the current viewport — so a blind assert
          # would now fail for a TALLER FIXTURE rather than for a broken screen. They are still asserted, in
          # document order, with `scrollUntilVisible`, which still FAILS when the heading genuinely is absent
          # (unlike a `when: visible` guard, which would SKIP it). Same remedy `recipes/listDetail.yaml`
          # applies to the same two headings on the same screen.
          - scrollUntilVisible:
                element: 'Instructions'
                direction: DOWN
                timeout: 20000
          - scrollUntilVisible:
                element: 'Nutrition (per serving)'
                direction: DOWN
                timeout: 20000

          # We really left Home: the time-of-day greeting is gone.
          - assertNotVisible: '.*Chef.*'

          # Back must land on the recipe LIST, not on a dead end — proving `RecipesScreen` was seeded with the
          # list beneath the pushed detail. `Back` lives INSIDE the detail's own ScrollView, so the walk above
          # left it off the TOP of the screen — scroll back up to it rather than tapping blind (the idiom
          # `recipes/listDetail.yaml` uses after the same walk).
          #
          # ⛔ ANCHORED ABOVE THE RECIPE TITLE. Unanchored, this scroll is a no-op and the tap lands on the
          # OPERATING SYSTEM: a Maestro selector matches the WHOLE string, and under three-button navigation
          # Android's system bar publishes a node named exactly `Back` that is visible at all times, so
          # `scrollUntilVisible` is satisfied on entry without moving. The flow would still reach the list and
          # still pass, having exercised none of the app's header — see `recipes/listDetail.yaml`, which
          # carries the same anchor for the same reason. The app's control is above the title; the system bar
          # is at the bottom of the display and is above nothing.
          - scrollUntilVisible:
                element:
                    text: 'Back'
                    above:
                        text: '${E2E_RECIPE_LAMB}'
                direction: UP
                timeout: 20000
          - tapOn:
                text: 'Back'
                above:
                    text: '${E2E_RECIPE_LAMB}'
          - assertVisible: 'Recipes'
          - assertVisible: 'New recipe'
