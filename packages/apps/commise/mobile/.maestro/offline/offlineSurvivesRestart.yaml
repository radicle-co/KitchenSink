# A queued write survives the app being killed — the property WEB DOES NOT HAVE.
#
# ⛔ THIS IS THE FLOW THAT JUSTIFIES ON-DEVICE PERSISTENCE. Everything else about offline is reproducible with
# an in-memory queue; only this proves the outbox is actually durable. If this passes on web's volatile store
# it is testing the wrong thing.
#
# ⚠️ `clearState: false` on the relaunch is load-bearing — clearing it would wipe the very outbox under test
# and the flow would pass vacuously.
appId: ${APP_ID}
name: a queued write survives an app restart
# Audit 2026-10-19, A1.4: a run killed while offline would leave the device offline for the next flow. This always runs.
onFlowComplete:
    - setAirplaneMode: disabled
tags:
    - offline
    # Android only: iOS simulators have no airplane mode (guarded by maestroPlatformExclusions.test.ts).
    - android
---
- runFlow: ../auth/launchCleared.yaml
- runFlow: ../auth/signin.yaml

# Audit 2026-10-19, A1.15: 'Recipes' is the tab label, which Home shows too.
- assertVisible: 'My recipes'
- runFlow:
      file: ../recipes/common/scrollIntoTapView.yaml
      env:
          TARGET: '${E2E_RECIPE_LAMB}'
          DIRECTION: DOWN
          TIMEOUT: 20000
- tapOn: '${E2E_RECIPE_LAMB}'
# The owner's edit entry point sits in the detail's TITLE BAND, below the hero, so reach it rather than
# asserting blind.
- runFlow:
      file: ../recipes/common/scrollIntoTapView.yaml
      env:
          TARGET: 'Edit recipe'
          DIRECTION: DOWN
          TIMEOUT: 20000
- tapOn: 'Edit recipe'
- assertVisible: 'Close editor'

- setAirplaneMode: enabled
- runFlow: ../recipes/common/clearTitle.yaml
- inputText: ' survives restart'
# The recipe is published, so the edit reaches the server only at Save changes (owner decision D1). The bar unpins
# while the keyboard is open, so close it first (`maestroActionBarAfterTyping.test.ts`).
- runFlow: ../recipes/common/closeEditorKeyboard.yaml
- tapOn: 'Save changes'
# Offline, the write waits in the outbox on the device: the header says so in its own words ('Saved on this device'),
# and 'Saved' once the answer lands. Either is the cook's saved state; a failure line is not.
- assertVisible:
      text: '^Saved( on this device)?$'

# Kill and relaunch WITHOUT clearing state — the queue must still be there.
- stopApp
- launchApp:
      permissions: {}
      clearState: false

# ⛔ STILL PENDING AFTER A RESTART. On a volatile queue this is where the write would have vanished silently,
# having told the cook it was saved.
- assertVisible:
      text: '.*(not synced|1 change).*'

- setAirplaneMode: disabled
- extendedWaitUntil:
      notVisible:
          text: '.*(not synced|1 change).*'
      timeout: 30000
