# The Clerk username on Profile (owner ruling 2026-10-13; plan 2026-10-15-010 D12) — the mobile twin of the web
# Playwright `bylineUsername.spec.ts` profile case. A signed-in cook opens Profile and finds their "@username" in the
# Account group, read-only: Clerk owns it, so there is no control to change it. (Owner ruling S2, 2026-10-27: the header
# is the avatar and the name; the username and email show once, as rows.)
#
# It assumes the signed-in pool user's identity profile carries its Clerk username, which holds for every user
# provisioned after identity migration 0016 and for any older one once a Clerk `user.updated` has synced it. Pool
# users always have one (`poolAdmin.ts` writes `username` on create). Selectors are visible text only.

appId: ${APP_ID}
---
- runFlow: auth/signinHome.yaml

- tapOn: 'Profile.*'

# The Username row's value: "@" then the username. Anchored at the start so the email row cannot match.
- extendedWaitUntil:
      visible: '^@.+'
      timeout: 40000
- assertVisible: '^@.+'

# Read-only: the row is plain text, and no control offers to change it.
# ⚠️ The row is ONE accessibility element (`ProfileFactRow`, c01e63343): iOS publishes a single node named
# "Username, @name", while Android publishes the label and the value as two nodes ("Username", "@name").
- runFlow:
      when:
          platform: iOS
      commands:
          - assertVisible: 'Username, @.+'
- runFlow:
      when:
          platform: Android
      commands:
          - assertVisible: 'Username'
- assertNotVisible: 'Change username'
