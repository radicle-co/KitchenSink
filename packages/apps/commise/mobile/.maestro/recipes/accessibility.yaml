appId: io.commise.mobile
---
# Accessibility audit of the recipes surface (T115). Read-only; mutates nothing; order-independent.
#
# WHAT THIS FLOW IS FOR, AND WHY IT IS NARROW. The other flows already USE accessibility labels as selectors,
# which proves labels exist only incidentally — and mostly does not prove even that: Maestro matches a node's
# text OR its accessible name, so `assertVisible: 'Edit recipe'` passes on a control with NO accessible name
# at all, as long as a <Text> child renders the same string. Assertions like that would stay green on an
# inaccessible app, so they are worthless as an a11y audit and are deliberately NOT repeated here.
#
# This flow asserts only things that are FALSIFIABLE — each one fails if the corresponding accessibility
# affordance is removed:
#   1. An accessible NAME that differs from the visible text (the string exists ONLY as accessibilityLabel).
#   2. Accessibility STATE (`selected` / `checked` / `enabled`) actually reaching the platform a11y tree —
#      state that a screen reader announces and that is not conveyed by colour alone.
#
# TAP TARGETS — Maestro CANNOT assert what T115 asks for, and this flow does not pretend to. Its dimension
# matchers (`width`/`height` + `tolerance`) match an EXACT pixel size within a tolerance; there is no
# >=/minimum matcher. So "every tap target is at least 48dp" is inexpressible: the closest encoding pins an
# exact pixel height, which is device-density dependent, breaks on any benign style change, and still would
# not assert a minimum. Pinning sizes here would be a brittle test that fails for the wrong reasons, so tap
# -target minimums belong in the component tier (the RN StyleSheet is directly inspectable there) — see the
# defects reported alongside this flow: several controls currently render ~32-38dp tall, under Android's 48dp
# guidance, though above WCAG 2.2 AA 2.5.8's 24x24 floor.
- runFlow: ../auth/signin.yaml

# --- 1. Accessible name != visible text ------------------------------------------------------------------
# The recipe-list search field is NOT asserted here any more. Its accessible name and its placeholder both read
# "Search your recipes" (slice 5), so Maestro, which matches a node's text OR its name, would pass on the placeholder
# alone with the name removed — the unfalsifiable kind of check this flow refuses. The name is pinned where it can
# fail: `SearchField.native.test.tsx` ("keeps a hidden label as the field's name"). Section 3 is this flow's
# name-differs-from-text check.
- assertVisible: 'Recipes'

# --- 2. Tab bar exposes SELECTED state to assistive tech -------------------------------------------------
# The tabs render selection with an underline + colour. Colour/position alone is not an accessible state, so
# the tab bar also reports `accessibilityState={{ selected }}`. Falsifiable: delete that prop and a screen
# reader can no longer tell which tab is current — and both assertions below fail.
- assertVisible:
      text: '^My recipes$'
      selected: true
- assertVisible:
      text: '^Discover$'
      selected: false

# Selection state must FOLLOW the interaction, not be hardcoded.
- tapOn: 'Discover'
- extendedWaitUntil:
      visible: 'Discover'
      timeout: 40000
- assertVisible:
      text: '^Discover$'
      selected: true
# The other tabs report themselves unselected (My recipes is a segment inside the Recipes tab, so it is not on this
# screen; Home is the tab bar's own neighbour).
- assertVisible:
      text: '^Home$'
      selected: false

# --- 3. Icon/short-label controls carry a distinguishing accessible name ---------------------------------
# Each discovery card's Save a copy button is an icon — ambiguous to a screen-reader user paging through a feed of
# identical buttons — so its accessible name is "Save a copy of {title}". That full string exists ONLY as the
# accessibilityLabel, so this is the strongest falsifiable naming assertion on the surface: remove the label and the
# node has no name to match. Guarded on the seeded public recipe.
#
# ⛔ REACH THE FIXTURE BY SEARCH, not by its place in a browse rail. Discover's default surface is the U7
# rails (Trending/New/Quick), and a rail is one horizontally-scrolled page whose order depends on the whole
# sandbox. `rating.yaml` already recorded the live failure: the co-author's Risotto can sit off the right edge
# behind the signer's public rows. Typing the title's base switches to the deterministic result list, while
# the run-scoped title keeps the selector unique to this run. This still proves the a11y label on a discovery
# result — the behavior this block owns — without coupling it to rail placement.
- tapOn: 'Search recipes'
- inputText: 'Risotto'
- scrollUntilVisible:
      element:
          text: '^${E2E_RECIPE_RISOTTO}$'
      direction: DOWN
      timeout: 30000
- runFlow:
      when:
          visible: '${E2E_RECIPE_RISOTTO}'
      commands:
          - assertVisible: 'Save a copy of ${E2E_RECIPE_RISOTTO}'
          # The row title is a separate, correctly-named control (anchored so it selects the title button and
          # not the Save a copy button whose name contains the same title).
          - assertVisible:
                text: '^${E2E_RECIPE_RISOTTO}$'

# --- 4. The discovery search field is labelled independently of its placeholder --------------------------
- assertVisible:
      text: '^Search recipes$'
