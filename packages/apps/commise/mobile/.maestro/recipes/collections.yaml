appId: io.commise.mobile
---
# Collections management happy path (US3, T112). Signs in, switches to the Collections tab, and drives the
# full lifecycle the collection screens expose: create -> open -> rename -> delete. The mobile counterpart to
# the web Playwright collections spec (cross-platform mandate).
#
# HERMETIC BY DESIGN: this flow creates the collection it operates on and deletes it at the end, so it seeds
# and cleans its own data and depends on NO seed row (`packages/services/recipe-service/src/database/seed.ts`
# ships exactly one collection, "Weeknight Favorites", owned by the PRO subject — the e2e signer is the FREE
# subject and therefore sees an EMPTY collections list). That also makes it order-independent: nothing else in
# the suite reads or writes this fixture. If the flow fails midway the fixture leaks (a stray "Maestro test
# collection"), which is noisy but harmless — a re-run creates its own.
#
# Screens (slice 5, `buildSpec.md` §5): CollectionsScreen -> the new-collection SHEET -> CollectionDetailScreen, whose
# header has one primary (Add recipes) and one ⋯ menu named for the collection ("More actions for {name}": Rename ·
# Make private/public · Save a copy · Pull updates · Delete collection). Add recipes opens the picker SHEET "Add to
# {name}", Rename a sheet, and Delete a confirmation: none is a route. Selectors are the accessibility labels from
# `features/recipes/src/collections/messages.ts`.
- runFlow: ../auth/signin.yaml

# The recipes surface, then across the tab bar to Collections. Only the TAB carries this label right now
# (the CollectionListFrame heading + container label also read "Collections", but neither is rendered yet).
- assertVisible: 'Recipes'
- tapOn: 'Collections'

# CollectionListFrame chrome. The create CTA proves the list rendered (heading "Collections" alone would also
# match the tab we just tapped, so it would not).
- extendedWaitUntil:
      visible: 'New collection'
      timeout: 40000

# CREATE. Slice 4 (`buildSpec.md` §5.1): the CTA opens the new-collection SHEET over the list (the create screen is
# deleted), and a created collection opens its own detail.
- tapOn: 'New collection'
- assertVisible: 'Description \(optional\)'
- tapOn: 'Name'
- inputText: 'Maestro test collection'
# Enter submits the name from the keyboard, as a cook finishes a one-field form.
- pressKey: Enter

# OPEN. The create lands on the new collection's detail: its name, its primary action, and — for a brand-new collection —
# the member-empty state, which proves we landed on the right (freshly created) collection.
- extendedWaitUntil:
      visible: 'More actions for Maestro test collection'
      timeout: 40000
- assertVisible: 'Maestro test collection'
- assertVisible: 'No recipes here yet'

# ADD A RECIPE (FR-009). Add recipes opens the picker sheet "Add to {name}". Ticking a recipe saves at once
# (POST /api/v1/collections/{id}/recipes) and Done says what changed. The seeded recipe (the same fixture the recipe
# list/edit flows drive) must be a candidate.
#
# ⛔ A HARD WAIT, not a `when:` guard. `when:` does not wait and does not fail: when the fixture was missing the whole
# body was SKIPPED and the flow reported GREEN having asserted nothing (run 101351873536). The seeded world is
# guaranteed by `e2e-seed`, so its absence is a failure to report.
- tapOn: 'Add recipes'
- assertVisible: 'Add to Maestro test collection'
- extendedWaitUntil:
      visible: '${E2E_RECIPE_LAMB}'
      timeout: 30000
- tapOn: '${E2E_RECIPE_LAMB}'
- assertVisible: 'Done · 1 added'
- tapOn: 'Done · 1 added'
- assertNotVisible: 'Add to Maestro test collection'

# RENAME. The ⋯ menu's Rename opens the rename sheet, filled in with the current name.
- tapOn: 'More actions for Maestro test collection'
- tapOn: 'Rename'
- assertVisible: 'Rename collection'
- tapOn: 'Name'
- eraseText
# Deliberately LONG: E3 (`docs/design/uiOverhaul/evaluateShellAndLists.md`) is a long name squeezed into a column
# broken mid-word beside the actions. The step after the wait proves it is not.
- inputText: 'Maestro renamed collection for the whole family on weeknights'
- tapOn: 'Save name'

# Back on the detail, showing the NEW name — proves the update persisted and `useUpdateCollection` invalidated the
# detail query. Matched as a `…weeknights.*` regex: Maestro's `inputText` intermittently duplicates the final typed
# character on this emulator, which is an input artifact, not an app bug — the trailing `.*` absorbs it while still
# proving the name changed.
- extendedWaitUntil:
      visible:
          text: 'Maestro renamed collection.*'
      timeout: 40000

# E3 — the long name keeps the row and the actions sit BELOW it on a phone. Beside it, Add recipes' top is above the
# name's foot and `below:` fails. Anchored on the name, which only the app draws.
- assertVisible:
      text: 'Add recipes'
      below:
          text: 'Maestro renamed collection.*'

# DELETE (also this flow's cleanup). The ⋯ menu's Delete collection asks first; confirming returns to the collections
# list, and the row must be GONE, which is the assertion that proves the delete actually happened.
- tapOn: 'More actions for Maestro renamed collection.*'
- tapOn: 'Delete collection'
- assertVisible: 'Delete Maestro renamed collection.*\?'
- tapOn: 'Delete collection'
- extendedWaitUntil:
      visible: 'New collection'
      timeout: 40000
- assertNotVisible:
      text: 'Maestro renamed collection.*'
