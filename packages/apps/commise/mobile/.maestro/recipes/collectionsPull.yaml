appId: io.commise.mobile
---
# Pull-updates preview -> commit happy path (W5 Task 13, C2/FR-011) — the mobile mirror of the web Playwright
# `collections.spec.ts` pull-preview-then-commit spec, and the highest-value of the three new collection
# flows: it drives clone -> the source drifts ahead -> preview -> confirm -> the pulled member (and "Last
# pulled") actually appearing, not merely the dialog opening and closing.
#
# Self-clone setup (see `collectionsSaveCopy.yaml` for why cloning one's own collection is the reachable path
# in this app, and why it is a legitimate exercise of the same endpoint a cross-owner clone would use):
# creates a SOURCE collection, seeds it with ONE seeded recipe (-> the clone's `clone_seed` member, the
# diff's "unchanged" count), clones it, RENAMES the clone (the clone action passes no name override, so right
# after cloning the two collections are identically named — renaming makes later list lookups by name
# unambiguous), returns to the source via "View Source" (deterministic navigation — no name lookup needed)
# and adds a SECOND seeded recipe there only, so the source is now ahead of the clone by exactly one recipe.
# Pulling on the (renamed) clone should then offer exactly that second recipe.
#
# Recipe seed rows: CI reseeds before every flow (see `recipes/delete.yaml`'s note), so "Mediterranean
# Grilled Lamb" and "Asparagus with Green Sauce" (both owned by the FREE subject, `recipe-service`'s
# `seed.ts`) are guaranteed present and unmutated at the start of THIS flow — scrolled to directly rather
# than gated behind a `when: visible` guard, since a silently-skipped add would desync the diff counts this
# flow asserts further down.
- runFlow: ../auth/signin.yaml

- assertVisible: 'Recipes'
- tapOn: 'Collections'
- extendedWaitUntil:
      visible: 'New collection'
      timeout: 40000

# CREATE the source.
- tapOn: 'New collection'
- assertVisible: 'Description \(optional\)'
- tapOn: 'Name'
- inputText: 'Maestro pull source'
# Enter submits the name from the keyboard, as a cook finishes a one-field form.
- pressKey: Enter

# The create opens the new collection's detail (slice 4).
- extendedWaitUntil:
      visible: 'More actions for Maestro pull source'
      timeout: 40000
- assertVisible: 'Maestro pull source'

# SEED it with ONE recipe, in the picker sheet.
- tapOn: 'Add recipes'
- assertVisible: 'Add to Maestro pull source'
- scrollUntilVisible:
      element: '${E2E_RECIPE_LAMB}'
      direction: DOWN
      timeout: 20000
- tapOn: '${E2E_RECIPE_LAMB}'
- assertVisible: 'Done · 1 added'
- tapOn: 'Done · 1 added'

# SAVE A COPY, then rename the copy so later list lookups by name are unambiguous.
- tapOn: 'More actions for Maestro pull source'
- tapOn: 'Save a copy'
- extendedWaitUntil:
      visible: 'Copied from .*'
      timeout: 40000
- tapOn: 'More actions for Maestro pull source'
- tapOn: 'Rename'
- assertVisible: 'Rename collection'
- tapOn: 'Name'
- eraseText
- inputText: 'Maestro pull clone'
- tapOn: 'Save name'
# Maestro's `inputText` intermittently duplicates the final typed character on this emulator (same artifact
# `collections.yaml` notes for its own rename step) — the trailing `.*` absorbs it while still proving the
# rename applied.
- extendedWaitUntil:
      visible:
          text: 'Maestro pull clone.*'
      timeout: 40000

# BACK to the source via "Copied from …" (deterministic — no ambiguous name lookup) and add the SECOND
# recipe: the source has now drifted ahead of the (renamed) copy by exactly one recipe.
- tapOn: 'Copied from .*'
- extendedWaitUntil:
      visible: 'More actions for Maestro pull source'
      timeout: 40000
- tapOn: 'Add recipes'
- assertVisible: 'Add to Maestro pull source'
- scrollUntilVisible:
      element: '${E2E_RECIPE_ASPARAGUS}'
      direction: DOWN
      timeout: 20000
- tapOn: '${E2E_RECIPE_ASPARAGUS}'
- assertVisible: 'Done · 1 added'
- tapOn: 'Done · 1 added'

# BACK to the list, then open the copy — uniquely named now, so the tap cannot land on the source.
#
# ⛔ THE CONTROL IS `Back to Collections`, AND MAESTRO MATCHES THE WHOLE STRING (a partial match has to be written
# `.*Back.*`). It is anchored on the app's own label, never a bare `Back`: under three-button navigation Android's own
# navigation bar publishes a node with the exact name `Back`, and a bare selector tapped it
# (`maestroBackSelectorAnchoring.test.ts` asserts that over the whole `.maestro` tree).
- scrollUntilVisible:
      element: 'Back to Collections'
      direction: UP
      timeout: 20000
- tapOn: 'Back to Collections'
- extendedWaitUntil:
      visible:
          text: 'Maestro pull clone.*'
      timeout: 40000
- tapOn:
      text: 'Maestro pull clone.*'
- extendedWaitUntil:
      visible: 'More actions for Maestro pull clone.*'
      timeout: 40000

# PULL. Opening the dialog runs the preview: one new recipe available (Asparagus), nothing removed, one
# already there (Mediterranean Grilled Lamb, seeded at copy time).
- tapOn: 'More actions for Maestro pull clone.*'
- tapOn: 'Pull updates'
- extendedWaitUntil:
      visible: 'Pull Updates from Source Collection'
      timeout: 40000
- assertVisible: '1 new public recipes will be added'
- assertVisible: '0 recipes removed from source'
- assertVisible: '1 already in this collection (no changes)'

# CONFIRM. A successful commit closes the dialog, the header's member count goes 1 -> 2, "Last pulled" appears, and the
# pulled recipe becomes a real MEMBER — the signals that prove the pull actually APPLIED rather than merely closing.
# The count + "Last pulled" are asserted FIRST because both live in the header, which is on screen the moment the dialog
# closes; the count is the falsifiable core (a dialog that closed without committing leaves "1 recipe").
- tapOn: 'Pull 1 Recipes'
- extendedWaitUntil:
      notVisible: 'Pull Updates from Source Collection'
      timeout: 40000
- extendedWaitUntil:
      visible: '2 recipes'
      timeout: 40000
- assertVisible:
      text: 'Last pulled:.*'

# ...and the member itself. The members sit BELOW the header, so the pulled row may be off-fold and must be scrolled to —
# `assertVisible` only ever sees the current viewport.
- scrollUntilVisible:
      element: '${E2E_RECIPE_ASPARAGUS}'
      direction: DOWN
      timeout: 20000

# CLEANUP (hermetic): delete the copy, then the source. Scroll back up first — the ⋯ menu lives in the header, now above
# the fold after the scroll down.
- scrollUntilVisible:
      element: 'Back to Collections'
      direction: UP
      timeout: 20000
- tapOn: 'More actions for Maestro pull clone.*'
- tapOn: 'Delete collection'
- tapOn: 'Delete collection'
- extendedWaitUntil:
      visible: 'New collection'
      timeout: 40000
- tapOn: 'Maestro pull source'
- extendedWaitUntil:
      visible: 'More actions for Maestro pull source'
      timeout: 40000
- tapOn: 'More actions for Maestro pull source'
- tapOn: 'Delete collection'
- tapOn: 'Delete collection'
- extendedWaitUntil:
      visible: 'New collection'
      timeout: 40000
- assertNotVisible: 'Maestro pull source'
