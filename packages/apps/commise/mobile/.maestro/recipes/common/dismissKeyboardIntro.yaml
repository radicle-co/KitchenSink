appId: io.commise.mobile
---
# Dismisses the iOS keyboard's one-time "Speed up your typing by sliding your finger across the letters to compose a
# word." card (Continue) when it is up; a no-op everywhere else (Android has no such card). iOS raises it over the
# keyboard the first time a letter keyboard comes up after the keyboard process restarts, and while it is up a tap or
# swipe in the keyboard's band reaches the card, not the app: in run 38973223138 iOS shard 4 lost `Use … as written`
# taps, a list swipe and typed letters (a search recorded as `Riso`), and its screenshot shows the card over the list.
# The app is right to leave it alone: it is the OS's own first-run card.
- runFlow:
      when:
          platform: iOS
          visible: 'Continue'
      commands:
          - tapOn: 'Continue'
