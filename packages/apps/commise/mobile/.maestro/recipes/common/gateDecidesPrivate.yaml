# Reusable sub-flow for `paidFeaturesByRole.yaml`: sign in as `${E2E_SIGNIN_EMAIL}` (the caller overrides it with a
# NOT-entitled role's pool address - default, or admin, owner ruling 2026-10-15), open the new-recipe editor, and prove
# Private is a private SLOT for a free cook, whatever the stage's gate says (ADR-0073; owner ruling 2026-10-26). Read-only:
# it types no title, so nothing is saved, and it leaves by x.
#
# REWRITTEN for ADR-0073. It used to accept either gate answer: under `upsell` Private opened the Premium sheet, under
# `hidden` the editor showed only "Who can see it: Public". A free cook now keeps up to the server's limit of recipes
# private, so in BOTH answers Private is offered with the server's count, choosing it applies it and says it uses one
# slot, and no Premium sheet opens. The limit is the server's, so it is matched by shape, not by number.
#
# UPDATED for the owner ruling of 2026-10-26 (ADR-0073 section 12): a NEW recipe is a DRAFT, and a draft holds no slot, so
# the Private card says that instead of counting ("N of M private slots left" belongs to a published recipe), and choosing
# it says Publishing uses a slot. Not run on a device by the change that edited it.
#
# The caller clears the device first; this sub-flow does not, so the caller decides whose session it replaces.

appId: ${APP_ID}
---
- runFlow: ../../auth/signinHome.yaml
# A role user with no recipes sees Home's first run, which hides the floating button and offers "Add your first recipe"
# in its place (build spec section 3.4). The role users author nothing, so their Home is always first run. Wait for it
# rather than tap either control: until the recipe list has loaded, `useHomeFirstRun` reads false and the floating
# "New recipe" shows, then it is removed when the empty list arrives, and a tap in that window lands on a button that is
# gone (full local Android shard 2, 2026-10-18: the editor never opened).
- extendedWaitUntil:
      visible: 'Add your first recipe'
      timeout: 30000
- tapOn: 'Add your first recipe'
- assertVisible: 'Close editor'
- scrollUntilVisible:
      element: 'Private, Only you can see it.*'
      direction: DOWN
      timeout: 30000
# A draft holds no slot: the Private card says so, with no count.
- assertVisible: '.*A private draft uses no slot\. Publishing it uses one\..*'
- assertNotVisible: '.*\d+ of \d+ private slots left.*'
- tapOn: 'Private, Only you can see it.*'
# Choosing it applies at once; it never opens the Premium sheet, and nothing on the card sells Premium.
- assertNotVisible: 'Keep more recipes private'
- assertNotVisible: 'Private needs Premium for this recipe'
- assertNotVisible: '.*Premium.*'
- tapOn: 'Close editor'
