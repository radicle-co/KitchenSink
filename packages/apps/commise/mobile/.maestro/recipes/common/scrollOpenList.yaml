appId: ${APP_ID}
---
# Reusable sub-flow: scroll an OPEN food list until `TARGET` (a regex on an option's text) is on screen. Called with
# `runFlow: { file: common/scrollOpenList.yaml, env: { TARGET: '…' } }`, and `DIRECTION: UP` to go back up the list.
# To PICK the option, call `pickFromOpenList.yaml` instead: on iOS this flow promises only that the option's TOP is
# above the keyboard, and that step taps there (`maestroOpenListPick.test.ts`).
#
# ⛔ It swipes from INSIDE the list, never from the screen's centre as `scrollUntilVisible` does: a drag that starts on
# the page outside an open list closes it (UI overhaul slice 8). The list is in the page's flow on native and the
# field's reveal puts it under the field, filling the lower screen, so a swipe that starts at 70% of the height starts
# on it.
#
# ⚠️ BOTH PLATFORMS SWIPE IN THE SAME HIGH BAND. The soft keyboard stays up over the lower ~38% of the screen (its top
# edge is at about 62% on the iOS Simulator and the Android emulator alike), so a swipe from 75% starts on a key and
# moves nothing (run 38433716728 on iOS, run 38988891871 on Android). The band is 55% to 35%, between the field the
# reveal lifts to the top and the keyboard's edge, and reversed for UP. The two directions are two `runFlow when` blocks, never one swipe with a `${}` in its coordinates:
# Maestro parses a coordinate when it LOADS the file, so an expression there fails every caller before step one.
#
# ⛔ FIRST, THE DATABASE'S ANSWER. Until it lands the list is ONE line, the `Searching ingredients` loader
# (`entryCombobox.ts`, pinned by `entryCombobox.test.ts`), so a swipe from 75% starts on the page below it and closes the
# list by design; every later swipe then scrolls the page to its end. The loader is matched INSIDE the list
# (`childOf` its label): the polite live region outside it keeps saying the same words, 1 dp tall and therefore visible
# to Maestro, until the remote sources finish.
- runFlow: dismissKeyboardIntro.yaml
- extendedWaitUntil:
      notVisible:
          text: 'Searching ingredients'
          childOf:
              text: 'Food suggestions for ingredient \d+'
      timeout: 20000
# ⛔ ON iOS "VISIBLE" IS NOT "ON SCREEN ABOVE THE KEYBOARD". XCUITest reports an option that sits behind the soft keyboard
# as visible, so `notVisible: TARGET` is already false before the first swipe: the loop never ran, the tap landed on a key,
# and the line was never declared (CI run 39076738796, iOS shard 4: `edit`, `conflictMerge`, `cuisineField`,
# `quantityRange`, `createAuthoredFood`; the screenshots show the list unscrolled under the keyboard). The iOS keyboard
# publishes its own keys, so the target must be ABOVE THE KEYBOARD: a position, which is what the swipe is for. The
# anchor is the keyboard's own `inputView` (its top is the suggestion strip, 539 pt on the iPhone 17), by id: the Space
# key's text is a single space, so `above: space` never matched, and the Space row is the keyboard's LAST row, so a
# target above it can still sit under the letter rows (Mac Simulator, 2026-10-18: the tap typed a "y").
# Android's accessibility tree drops what the keyboard covers, so plain visibility there already means "on screen".
- runFlow:
      when:
          platform: Android
      commands:
          - repeat:
                while:
                    notVisible:
                        text: ${TARGET}
                times: 10
                commands:
                    - runFlow:
                          when:
                              true: ${DIRECTION == 'UP'}
                          commands:
                              - swipe:
                                    start: 50%, 35%
                                    end: 50%, 55%
                                    duration: 500
                    - runFlow:
                          when:
                              true: ${DIRECTION != 'UP'}
                          commands:
                              - swipe:
                                    start: 50%, 55%
                                    end: 50%, 35%
                                    duration: 500
          - assertVisible:
                text: ${TARGET}
# ⚠️ THE ANCHOR NEEDS A KEYBOARD. A list whose search field is not focused (the shortlist panel opened from a row's
# "Choose a match" line) raises no soft keyboard, so `inputView` is not in the tree and `above: inputView` can never be
# met: the loop swiped ten times for an option that was on screen (ingredientCandidates, ingredientShortlist, 2026-10-18).
# With no keyboard up, plain visibility means "on screen", exactly as on Android, so that case takes the Android body.
- runFlow:
      when:
          platform: iOS
          notVisible:
              id: inputView
      commands:
          - repeat:
                while:
                    notVisible:
                        text: ${TARGET}
                times: 10
                commands:
                    - runFlow:
                          when:
                              true: ${DIRECTION == 'UP'}
                          commands:
                              - swipe:
                                    start: 50%, 35%
                                    end: 50%, 55%
                                    duration: 500
                    - runFlow:
                          when:
                              true: ${DIRECTION != 'UP'}
                          commands:
                              - swipe:
                                    start: 50%, 55%
                                    end: 50%, 35%
                                    duration: 500
          - assertVisible:
                text: ${TARGET}
- runFlow:
      when:
          platform: iOS
          visible:
              id: inputView
      commands:
          - repeat:
                while:
                    notVisible:
                        text: ${TARGET}
                        above:
                            id: inputView
                times: 10
                commands:
                    - runFlow:
                          when:
                              true: ${DIRECTION == 'UP'}
                          commands:
                              - swipe:
                                    start: 50%, 35%
                                    end: 50%, 55%
                                    duration: 500
                    - runFlow:
                          when:
                              true: ${DIRECTION != 'UP'}
                          commands:
                              - swipe:
                                    start: 50%, 55%
                                    end: 50%, 35%
                                    duration: 500
          # ⛔ THE FLOW ENDS WITH NOTHING BUT THE CHECK. A drag here to lift the option's centre clear of the keyboard
          # started on the page below a SHORT list and closed it (CI run 39400327458, iOS shard 1, `versions`), and the
          # loop above already swipes only while the target is not found. `pickFromOpenList.yaml` taps near the top.
          - assertVisible:
                text: ${TARGET}
                above:
                    id: inputView
