appId: ${APP_ID}
---
# Reusable sub-flow: type `NAME` into the new-collection sheet's Name field and read it back. Called with
# `runFlow: { file: common/typeCollectionName.yaml, env: { NAME: '…' } }`; the caller then presses Enter or taps Create.
#
# The text is read back and typed once more, for the iOS Simulator's dropped keystrokes (`common/typeTitle.yaml`, and
# `auth/signinHome.yaml`): in run 38988891871 `collectionsSaveCopy` typed `Maestro clone source`, got `Ma`, and Enter
# CREATED a collection called `Ma`, so the detail it then waited for was never named what the flow looked for. The
# read-back allows ONE extra copy of the last character, for the Android emulator's doubled last key, and nothing else:
# it used to allow any tail, so CI run 39376194588 (iOS shard 2) created `Maestro pagination fillerinat`, and the flow then
# waited for a detail named `Maestro pagination filler`. A tail also hides the collection from the caller's cleanup, which
# deletes by name. NAME holds letters and spaces only, so it is a safe pattern.
- tapOn: 'Name'
- inputText: ${NAME}
- runFlow:
      when:
          notVisible: '${NAME}(${NAME.slice(-1)})?'
      commands:
          # eraseText deletes only what is BEFORE the cursor, and a garbled first typing can leave the cursor mid-text:
          # CI run 39387415456 (iOS shard 5) retyped in front of a leftover tail and read `Maestro clone source|tro`. After
          # the first erase only that short tail is left, so a tap on the field lands past its end, and the second erase
          # clears it. The field is then empty, and the name is typed once more.
          - eraseText: 64
          - tapOn: 'Name'
          - eraseText: 64
          - inputText: ${NAME}
- assertVisible: '${NAME}(${NAME.slice(-1)})?'
