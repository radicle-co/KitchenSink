appId: io.commise.mobile
---
# Concurrent-edit conflict — field-by-field MERGE (US1, T070 / FR-007c option c; updated w3/e8 for the
# screen-per-step wizard — the merge panel itself is untouched, since the wizard composes the SAME
# `useRecipeEditor` 409→conflict transition as before). Mobile mirror of the web Playwright
# `recipeConflict.spec.ts` (cross-platform mandate).
#
# A real conflict needs the recipe to change on the server BETWEEN this session's load and its save, so this
# flow is GUARDED on the conflict view appearing: in an ordinary single-writer run it is a safe no-op (the
# save just succeeds), and in a conflict-seeded run (a harness that performs a concurrent write to the opened
# recipe while the editor is open) it drives the full merge. Cannot be verified locally — no emulator here —
# so it is written to the shipped conflict/merge UI (labels match `versions/messages.ts`).
- runFlow: ../auth/signin.yaml

- assertVisible: 'Recipes'

# The seed is guaranteed present (the CI loop reseeds before every flow); scroll to the recipe rather than a
# `when: visible` guard that would silently SKIP the whole flow when it is below the fold (the list scrolls).
# The INNER conflict guard below stays conditional on purpose — a single-writer run has no conflict view.
- scrollUntilVisible:
      element: 'Mediterranean Grilled Lamb'
      direction: DOWN
      timeout: 20000
- tapOn: 'Mediterranean Grilled Lamb'
# The edit entry point is in the owner-action block at the foot of the (scrolling) detail.
- scrollUntilVisible:
      element: 'Edit recipe'
      direction: DOWN
      timeout: 20000
- tapOn: 'Edit recipe'

# Step 1 of 4 (Basic) — the wizard opens here; no page heading of its own (that copy belonged to the retired
# flat `RecipeForm`), so the step-progress label is the entry checkpoint instead. Change the title FIRST,
# before moving forward: once the draft is dirty, the wizard's discard guard intercepts any BACKWARD rail/Prev
# navigation with a confirmation dialog (by design — see `Wizard.tsx`'s `guardIfBackward`), so this flow never
# revisits an earlier step after leaving it, only advances via `Next: …`.
- assertVisible: 'Step 1 of 4'
- tapOn: 'Title'
- eraseText
- inputText: 'Mediterranean Grilled Lamb (my edit)'

# The seed recipe carries no ingredients or steps, but Publish (whole-form validation, unchanged by the
# wizard) requires >= 1 of each. Add one of each via the picker (freeform Create, exactly as the create flow).
- scrollUntilVisible:
      element: 'Next: Ingredients'
      direction: DOWN
      timeout: 20000
- tapOn: 'Next: Ingredients'
- assertVisible: 'Step 2 of 4'
- scrollUntilVisible:
      element: 'Search ingredients'
      direction: UP
      timeout: 20000
- tapOn: 'Search ingredients'
- inputText: 'Tomato'
- scrollUntilVisible:
      element:
          text: 'Create .*Tomato.*'
      direction: DOWN
      timeout: 20000
- tapOn:
      text: 'Create .*Tomato.*'
- scrollUntilVisible:
      element: 'Ingredient 1 name'
      direction: DOWN
      timeout: 30000
- scrollUntilVisible:
      element: 'Next: Instructions'
      direction: DOWN
      timeout: 20000
- tapOn: 'Next: Instructions'
- assertVisible: 'Step 3 of 4'
- scrollUntilVisible:
      element: 'Add step'
      direction: UP
      timeout: 20000
- tapOn: 'Add step'
- tapOn: 'Step 1 instruction'
- inputText: 'Combine everything and simmer.'

# Publish is the sticky top-bar action, present on every step — no scroll (and no forward `Next` to step 4)
# needed to reach it.
- tapOn: 'Publish'
# If a concurrent save landed first, the conflict view offers all three FR-007c resolutions.
- runFlow:
      when:
          visible: 'This recipe changed while you were editing'
      commands:
          - assertVisible: 'Keep my version'
          - assertVisible: 'Use the latest version'
          - assertVisible: 'Merge field by field'
          # Enter the per-field merge panel.
          - tapOn: 'Merge field by field'
          - assertVisible: 'Merge changes field by field'
          # Pull one field from the latest saved version (my other fields stay on my draft by default),
          # then save the merged result — it re-submits against the fresh server version.
          - tapOn: 'Latest saved version'
          - scrollUntilVisible:
                element: 'Save merged version'
                direction: DOWN
          - tapOn: 'Save merged version'
# Back on the detail with the user's title preserved by the merge (regex tolerates the last-char input dup).
- extendedWaitUntil:
      visible:
          text: 'Mediterranean Grilled Lamb .my edit.*'
      timeout: 40000
