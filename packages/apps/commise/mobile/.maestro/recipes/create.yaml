appId: ${APP_ID}
---
# Recipe create happy path (US1, T067). REWRITTEN for slice 7: the four-step wizard is retired, and the recipe is
# made on the ONE scrolling editor page (build spec §7, owner decisions D1/D2). Assumes an authenticated session (the
# auth login flow runs first in CI ordering) and the app pointed at a seeded recipe API (EXPO_PUBLIC_RECIPE_API_URL).
# Drives the recipe list -> the editor, states a title, a difficulty and a meal type in Details, declares an
# ingredient as written, adds a step with a timer, checks the draft in Preview, and Publishes from the pinned action
# bar — landing on the new recipe's detail. Mobile mirror of the web Playwright `recipeCrud.spec.ts` create path.
#
# Every section is on the same page, so the flow reaches each by scrolling to its first control. servings/prep/cook
# keep their valid defaults (1 / 0 / 0 — see `defaultRecipeFormValues` + `validateRecipeForm`), so this flow
# deliberately does NOT touch them.
- runFlow: ../auth/signin.yaml

# Recipe list surface, then into the editor.
# audit 2026-10-19, A1.15: 'Recipes' is the tab label, also on Home; 'My recipes' is drawn only on the Recipes root.
- assertVisible: 'My recipes'
- tapOn: 'New recipe'

# Details. The editor's × is its own control ('New recipe' would also match the FAB), so it is the entry checkpoint.
- assertVisible: 'Close editor'
- assertVisible: 'Title'
- runFlow:
      file: common/typeTitle.yaml
      env:
          TITLE: 'Maestro Weeknight Soup'

# A-009 / P3 (UI walk 2026-10-13): Cuisine is a combobox that opens its curated list on focus, and the chip fields' Add
# buttons read as whole sentences. Pick a cuisine from the list, and see both Add buttons.
- runFlow:
      file: common/scrollIntoTapView.yaml
      env:
          TARGET: 'Cuisine'
          DIRECTION: DOWN
          TIMEOUT: 20000
- tapOn: 'Cuisine'
# The list is bounded to five and a half rows (`cuisineField.md` §3.4), so "Italian" is on screen only once the text
# narrows it. A cuisine is required to publish (2026-10-13).
- inputText: 'Ital'
- tapOn: 'Italian'
# A pick ends the entry (`typedText="isValue"`) and dismisses the keyboard. The tap on the group's plain heading stays as
# a belt: on iOS a keyboard left up took the taps below on its keys (run 38433716728: `ItalianqT`). The heading can be
# above the screen after the pick (`common/chooseCuisine.yaml`), so it is scrolled into view first.
- scrollUntilVisible:
      element: 'Kind of dish'
      direction: UP
      timeout: 20000
      # Centred, so the tap cannot land on the sticky Sections bar over the top of the page.
      centerElement: true
- tapOn: 'Kind of dish'

# Meal type, then difficulty: the Details fields in PAGE ORDER, top to bottom, so each target is below the last one.
# A target ABOVE can sit under the sticky Sections bar, where iOS still calls it visible and a tap opens the bar
# instead (full local iOS run, 2026-10-19: Hard was tapped first and centred, which put Dinner under the bar, and the
# page jumped back to the top).
# State a MEAL TYPE (U34) — the one CLOSED classification axis on this form. It reuses the difficulty chip
# group's shape deliberately, and its "not stated" option is named 'No meal type' rather than 'Not stated'
# precisely so the two chips do not share one accessible name inside one form (WCAG 3.3.2).
# Centre the group's label, not the chip: the chip can already count as visible on iOS while it sits under the pinned
# action bar, so the shared step would leave it there (full local iOS run, 2026-10-19: the tap hit the bar). The
# chips sit just below their label, so a centred label puts them clear of both bars.
- scrollUntilVisible:
      element: 'Meal type'
      direction: DOWN
      timeout: 20000
      centerElement: true
- tapOn: 'Dinner'

# State a difficulty (FR-001b): the chip row sits further down Details, so scroll defensively rather than assume it
# is already on screen. To the chip, not the label, for `edit.yaml`'s reason.
# Centre the group's label, not the chip: the chip can already count as visible on iOS while it sits under the pinned
# action bar, so the shared step would leave it there (full local iOS run, 2026-10-19: the tap hit the bar). The
# chips sit just below their label, so a centred label puts them clear of both bars.
- scrollUntilVisible:
      element: 'Difficulty'
      direction: DOWN
      timeout: 20000
      centerElement: true
- tapOn: 'Hard'
- scrollUntilVisible:
      element: 'Add a tag'
      direction: DOWN
      timeout: 20000
- assertVisible: 'Add a dietary flag'

# Ingredients. Since plan 002 V1 B8 the entry is the trailing "Add an ingredient" field after the last line; with no
# lines yet it is the section's first control. Type a name and declare it "as written": that path mints a
# real binding through POST /api/v1/ingredients, which is what Publish validation requires, and needs no food
# service.
- runFlow:
      file: common/scrollIntoTapView.yaml
      env:
          TARGET: 'Add an ingredient'
          DIRECTION: DOWN
          TIMEOUT: 20000
- tapOn: 'Add an ingredient'

# 003-FR-010a (plan U37) — below the three-character minimum no suggestion, and no "as written" option keyed on the
# in-flight text, is offered. The list SAYS SO rather than rendering an empty panel, which is the half a bare
# `assertNotVisible` cannot distinguish from a broken screen. Asserted at TWO characters as well as one: the floor
# used to be two, so a one-character case alone would pass on a revert.
- inputText: 'T'
- assertNotVisible: 'Use .*T.* as written.*'
- assertVisible: 'Keep typing.*3 characters or more.*'
- inputText: 'o'
- assertNotVisible: 'Use .*To.* as written.*'
- assertVisible: 'Keep typing.*3 characters or more.*'
- inputText: 'mato'
- assertNotVisible: 'Keep typing.*'
- runFlow:
      file: common/scrollOpenList.yaml
      env:
          TARGET: 'Use .*Tomato.* as written.*'
- tapOn:
      text: 'Use .*Tomato.* as written.*'

# The declaration is async; the line lands above the trailing field, which then empties. Scrolling to the line's
# name field both waits for it and is the falsifiable checkpoint — if the line never landed this scroll finds nothing
# and the flow fails here rather than passing empty (an unresolved form can't Publish).
- scrollUntilVisible:
      element: 'Edit Tomato'
      direction: UP
      timeout: 30000

# Steps, below Ingredients. A new recipe has no steps, so this is `Step 1`.
# Close the keyboard first. The trailing ingredient field keeps it up after the pick, and iOS then calls `Add step`
# visible while the keyboard covers it: the shared step skips its scroll and the tap lands on the keyboard (CI run
# 39313803199, iOS shard 3: `Step 1` not found, the keyboard over the button in the screenshot).
- runFlow: common/closeEditorKeyboard.yaml
# Jump to Steps first. A scroll alone can stop with `Add step` under the sticky Sections bar, which iOS still calls
# visible, and the tap then opens the Sections sheet instead (CI run 39333403320, iOS shard 4, preparationGroups).
- runFlow:
      file: common/jumpToSection.yaml
      env:
          SECTION: 'Steps'
- runFlow:
      file: common/scrollIntoTapView.yaml
      env:
          TARGET: 'Add step'
          DIRECTION: DOWN
          TIMEOUT: 20000
- tapOn: 'Add step'
- tapOn: 'Step 1'
- inputText: 'Combine everything and simmer.'
# Close the keyboard first. On iOS XCUITest reports a control behind the soft keyboard as visible, so with the keyboard
# up `Add a timer` "is visible" under the keys and the tap types instead (the Mac Simulator, 2026-10-18: the keyboard
# offered "Add" and no timer boxes appeared). Android drops what the keyboard covers, so there the scroll below already
# brings it above the keys.
- runFlow: common/closeEditorKeyboard.yaml
# F1 (`docs/design/uiOverhaul/evaluateRecipeAndWizard.md`): the timer is entered in hours and minutes, no longer
# in seconds. The boxes appear once the step's 'Add a timer' is pressed. Read back on the detail below.
- runFlow:
      file: common/scrollIntoTapView.yaml
      env:
          TARGET: 'Add a timer'
          DIRECTION: DOWN
          TIMEOUT: 20000
- tapOn: 'Add a timer'
- runFlow:
      file: common/scrollIntoTapView.yaml
      env:
          TARGET: 'Step 1 timer, hours'
          DIRECTION: DOWN
          TIMEOUT: 20000
- tapOn: 'Step 1 timer, hours'
- inputText: '3'

# Preview (build spec §7.7 item 4) REPLACES the wizard's Review step: the real detail page, drawn from the draft, read
# back on the surface a cook checks before publishing. ⚠️ The wizard's Review also read back the MEAL TYPE; the
# detail page does not show one, so no surface on this flow can prove that axis round-trips any more (a recorded gap,
# not an omission here).
# A field is still focused, so the soft keyboard is up and the action bar has UNPINNED (build spec §7.1, "Keyboard open
# (phones)"): it scrolls with the page, below this screen. Closing the keyboard from the first heading pins it again.
- runFlow: common/closeEditorKeyboard.yaml
- tapOn: 'Preview'
# audit 2026-10-19, A1.18: a tap while a sheet, dialog or push still moves is dropped.
- waitForAnimationToEnd:
      timeout: 3000
- extendedWaitUntil:
      visible: 'Preview. This is how it looks to others.'
      timeout: 20000
- assertVisible:
      text: 'Maestro Weeknight Soup.*'
# A-012: the banner is a tinted block BESIDE the close control, not bare text. Maestro cannot see a fill, so what it
# proves is the layout the block must keep: the full banner sentence and Close are both on screen at once.
- assertVisible: 'Close preview'
- tapOn: 'Close preview'

# Publish is the pinned action bar's primary, on screen wherever the page is scrolled.
- tapOn: 'Publish'
# audit 2026-10-19, A1.14: the snackbar lasts about 6 s, so it is the FIRST wait after the tap. It shows only after the server
# accepted the write. Then the editor must be gone (60 s: 20 s longer than the first wait, because Maestro counts both from the tap).
- extendedWaitUntil:
      visible: 'Recipe published.'
      timeout: 40000
- extendedWaitUntil:
      notVisible: 'Close editor'
      timeout: 60000

# Landed on the new recipe's detail. The title assertion is a `…Soup.*` regex because Maestro's inputText
# intermittently duplicates the final typed character on this emulator ("…Soupp") — an input artifact, not an
# app bug.
- extendedWaitUntil:
      visible:
          text: 'Maestro Weeknight Soup.*'
      timeout: 40000

# F1 — the step timer reads in hours, never as raw seconds ("10800s timer"). `3+` absorbs inputText's intermittent
# repeat of the last typed character; no stat on this screen is ever said in hours, so the match is the timer's.
- scrollUntilVisible:
      element:
          text: '3+ h'
      direction: DOWN
      timeout: 20000
- assertNotVisible:
      text: '.*s timer'

# REQ-034 — this recipe's Tomato line was declared as written (not the food database), so the custom note must
# render (§S15; `listDetail.yaml` asserts the same copy).
- scrollUntilVisible:
      element: 'Custom ingredients count only the nutrition you entered for them.'
      direction: DOWN
      timeout: 20000
