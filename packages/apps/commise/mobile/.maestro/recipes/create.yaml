appId: io.commise.mobile
---
# Recipe create happy path (US1, T067). Assumes an authenticated session (the auth login flow runs first
# in CI ordering) and the app pointed at a seeded recipe/food API (EXPO_PUBLIC_API_URL). Drives the recipe
# list -> new-recipe editor, fills the basics + resolves an ingredient via the food typeahead + adds a
# step, then submits. The ingredient resolution is guarded on a seeded food match so the form-render +
# input assertions still hold if the seed lacks the queried food. Mobile mirror of the web Playwright
# recipe-create flow (cross-platform mandate).
- runFlow: ../auth/signin.yaml

# Recipe list surface, then into the create editor.
- assertVisible: 'Recipes'
- tapOn: 'New recipe'

# RecipeCreateScreen -> RecipeEditor: the "New recipe" heading + Basics fields + submit are present.
- assertVisible: 'New recipe'
- assertVisible: 'Title'

# State a difficulty (FR-001b): the picker is a radiogroup in the Basics section. Select Hard.
- assertVisible: 'Difficulty'
- tapOn: 'Hard'

- tapOn: 'Title'
- inputText: 'Maestro Weeknight Soup'

# The Basics fields sit below the fold and the soft keyboard covers them, so dismiss it and scroll each
# field into view before tapping — otherwise `tapOn` can't reach an element hidden behind the keyboard.
- hideKeyboard
- scrollUntilVisible:
      element: 'Servings'
      direction: DOWN
- tapOn: 'Servings'
- inputText: '4'

- hideKeyboard
- scrollUntilVisible:
      element: 'Prep time (minutes)'
      direction: DOWN
- tapOn: 'Prep time (minutes)'
- inputText: '10'

- hideKeyboard
- scrollUntilVisible:
      element: 'Cook time (minutes)'
      direction: DOWN
- tapOn: 'Cook time (minutes)'
- inputText: '20'

- hideKeyboard
- scrollUntilVisible:
      element: 'Search ingredients'
      direction: DOWN

# Resolve an ingredient through the food typeahead (guarded: needs a seeded food match), then add a step.
- tapOn: 'Search ingredients'
- inputText: 'salt'
- runFlow:
      when:
          visible: 'Resolved'
      commands:
          - tapOn: 'Resolved'

# Dismiss the keyboard and scroll the Steps section into view before adding one (the form scrolls).
- hideKeyboard
- scrollUntilVisible:
      element: 'Add step'
      direction: DOWN
- tapOn: 'Add step'
- tapOn: 'Step 1 instruction'
- inputText: 'Combine everything and simmer.'
- hideKeyboard

# Submit. When the ingredient resolved, the create succeeds and lands on the new recipe's detail; the
# assertion is guarded so a seed without the food still verifies the editor renders + accepts input.
- scrollUntilVisible:
      element: 'Create recipe'
      direction: DOWN
- assertVisible: 'Create recipe'
- runFlow:
      when:
          visible: 'Resolved'
      commands:
          - tapOn: 'Create recipe'
          - assertVisible: 'Maestro Weeknight Soup'
