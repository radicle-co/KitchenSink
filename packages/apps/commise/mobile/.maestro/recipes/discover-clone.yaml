appId: io.commise.mobile
---
# Public discovery + clone happy path (US2, T075/T076). Signs in, switches to the Discover tab, opens a
# public recipe the caller does NOT own, and clones it from the detail screen — the mobile mirror of the
# web Playwright clone flow (`cloneVisibility.spec.ts`: "opening a public recipe you don't own and cloning
# it lands you on the copy's detail"). The clone copies the recipe into the caller's library and navigates
# to the new copy, so the copy's detail shows OWNER actions (Edit) that the original non-owned detail never
# showed — asserting "Edit recipe" (not merely a section both details share) proves the clone landed on the
# owned copy. Guarded on a seeded public row so an empty discovery feed still passes the chrome.
- runFlow: ../auth/signin.yaml

# Recipe list is the initial top-level destination; switch to the Discover tab.
- assertVisible: 'Recipes'
- tapOn: 'Discover'

# RecipeDiscoveryScreen chrome.
- assertVisible: 'Discover recipes'
- assertVisible: 'Search public recipes'
# With no query the surface shows the curated browse rails (U7); type the recipe's name to switch to the
# deterministic 2-col result list before reaching for the row.
- tapOn: 'Search public recipes'
- inputText: 'Risotto'

# Open + clone the seeded PRO-owned public recipe. The seed is guaranteed present (the CI loop reseeds before
# every flow), so scroll to it rather than a `when: visible` guard that would silently SKIP when the row is
# below the fold (the Discover feed scrolls; only ~1 tall cover card fits at a time). Anchored (`^…$`) so it
# selects the row's title, NOT the per-row "Clone Herb Risotto" quick-clone button whose label also contains
# the title.
- scrollUntilVisible:
      element:
          text: '^${E2E_RECIPE_RISOTTO}$'
      direction: DOWN
      timeout: 20000
# Open the recipe's detail.
- tapOn:
      text: '^${E2E_RECIPE_RISOTTO}$'
# The detail of a public recipe the caller does not own exposes the clone action (US2) — at the foot of the
# scrolling detail, so scroll to it.
- scrollUntilVisible:
      element: 'Clone'
      direction: DOWN
      timeout: 20000
- tapOn: 'Clone'
# A successful clone navigates to the caller-owned copy's detail — which now offers the owner-only Edit action
# the original (non-owned) detail did not, proving the clone + navigation happened. It sits in the owner-action
# block at the foot of the detail, so scroll to it.
- scrollUntilVisible:
      element: 'Edit recipe'
      direction: DOWN
      timeout: 20000
