appId: ${APP_ID}
---
# Discovery browse overhaul (U7). Proves the three U7 discovery behaviours end-to-end on device:
#   1. no query/filter -> the curated browse RAILS (Trending / New / Quick), not a bare relevance stream;
#   2. the facets live behind a "Filters" BOTTOM SHEET (opened on demand, closed by its "Show {n} recipes" button);
#   3. typing a query DEBOUNCES into the result list (rails give way to results), and clearing it returns
#      to the rails;
#   4. a rail's "See all" leaves browse for the full list, and the pinned "Back to browse" returns to the rails.
# Read-only: it types and clears text but mutates nothing, so it is order-independent. Anchored on the
# seeded public row "Herb Risotto" that no other flow renames.
- runFlow: ../auth/signin.yaml

# Recipes list is the initial destination; cross to Discover.
# audit 2026-10-19, A1.15: 'Recipes' is the tab label, also on Home; 'My recipes' is drawn only on the Recipes root.
- assertVisible: 'My recipes'
- tapOn: 'Discover'
# audit 2026-10-19, A1.15: the tab's own label 'Discover' is on screen before the tap, so waiting on it proves nothing; 'Search recipes' exists only on the Discover screen.
- extendedWaitUntil:
      visible: 'Search recipes'
      timeout: 40000

# 1. Browsable default: the curated rails render (their headings are static, so this is seed-drift-immune).
#
# `Trending` and `New` are above the fold; `Quick` is the THIRD rail and sits below it on a phone viewport
# (each rail is a heading plus a row of tall recipe cards — on the CI emulator the "New" heading lands at
# ~88% of the screen height, so the Quick heading is off-screen entirely). `assertVisible` only sees the
# CURRENT viewport, so it must be scrolled into view rather than asserted blind. Scrolling — not deleting the
# assertion — is the point: the third rail existing is a U7 requirement.
- assertVisible: 'Trending'
# A rail scrolls sideways under the scroll hint (`HorizontalScroller`, `docs/design/uiOverhaul/horizontalScrollHint.md`):
# swipe it out and back and the rail is still there and still answers a swipe. Whether the chevron is drawn at rest, gone
# after the swipe and back at the start is asserted by the component tests; Maestro cannot see a decorative glyph, and
# `visual/primitives.yaml` captures it for the eye. Android does not expose the rail's region name to Maestro, so each
# swipe starts on the nearest card under the rail's heading, never on a screen position.
- swipe:
      from:
          text: '.+'
          below: 'Trending'
      direction: LEFT
- assertVisible: 'Trending'
- swipe:
      from:
          text: '.+'
          below: 'Trending'
      direction: RIGHT
- assertVisible: 'Trending'
# The rails are cards in the full variant now (slice 5), so "New" can sit below the fold too: scroll to it.
- scrollUntilVisible:
      element: 'New'
      direction: DOWN
      timeout: 20000
- assertVisible: 'See all'
- scrollUntilVisible:
      element: 'Quick'
      direction: DOWN
      timeout: 20000

# Back to the top so the steps below act on the search field and the Filters button, not on wherever the
# scroll left the surface.
- scrollUntilVisible:
      element: 'Discover'
      direction: UP
      timeout: 20000

# 2. Filters are a bottom sheet (`@commise/ui/sheet`, ingredientSpecialization.md §S8.1a): the facet ladders are
# hidden until the "Filters" button opens the sheet, titled "Filters". Every close route shuts it: "Show {n} recipes",
# the × "Close filters", the system back key, and a swipe down from the title. The component tests cannot prove
# the last two: react-native-web has no hardware back key and no touch gesture.
- assertNotVisible: 'Under 60 min'
- tapOn: 'Filters.*'
# audit 2026-10-19, A1.18: a tap while a sheet, dialog or push still moves is dropped.
- waitForAnimationToEnd:
      timeout: 3000
- extendedWaitUntil:
      visible: 'Under 60 min'
      timeout: 40000
- assertVisible: 'Close filters'
- tapOn: 'Show \d+ recipes?|Show recipes'
- assertNotVisible: 'Under 60 min'

- tapOn: 'Filters.*'
# audit 2026-10-19, A1.18: a tap while a sheet, dialog or push still moves is dropped.
- waitForAnimationToEnd:
      timeout: 3000
- extendedWaitUntil:
      visible: 'Under 60 min'
      timeout: 40000
- tapOn: 'Close filters'
- assertNotVisible: 'Under 60 min'

- tapOn: 'Filters.*'
# audit 2026-10-19, A1.18: a tap while a sheet, dialog or push still moves is dropped.
- waitForAnimationToEnd:
      timeout: 3000
- extendedWaitUntil:
      visible: 'Under 60 min'
      timeout: 40000
- back
- assertNotVisible: 'Under 60 min'

- tapOn: 'Filters.*'
# audit 2026-10-19, A1.18: a tap while a sheet, dialog or push still moves is dropped.
- waitForAnimationToEnd:
      timeout: 3000
- extendedWaitUntil:
      visible: 'Under 60 min'
      timeout: 40000
# From the sheet's title row. Found by its text next to the ×, never by a screen position: the title sits at about 44%
# of the screen, and a fixed 55% started the drag on the time chips (run 38835438945).
- swipe:
      from:
          text: 'Filters'
          leftOf: 'Close filters'
      direction: DOWN
- extendedWaitUntil:
      notVisible: 'Under 60 min'
      timeout: 10000

# 3. Typing switches from the rails to the result list (the query is debounced, then the results settle).
- runFlow:
      file: common/searchDiscover.yaml
      env:
          QUERY: 'Risotto ${E2E_RUN_KEY}'
- scrollUntilVisible:
      element: '${E2E_RECIPE_RISOTTO}'
      direction: DOWN
      timeout: 40000
- assertNotVisible: 'Trending'

# Clearing the query returns to the curated rails.
- scrollUntilVisible:
      element: 'Search recipes'
      direction: UP
      timeout: 20000
# The field's own clear control, not a tap and `eraseText`: the tap puts the caret where it lands, which is mid-way
# through a query as long as `Risotto ${E2E_RUN_KEY}`, and `eraseText` deletes only what is before the caret (emulator,
# 2026-10-18: the field kept "03-e94064a4"). The tap after it focuses the empty field.
- tapOn: 'Clear search'
- tapOn: 'Search recipes'
# ⛔ A blank field that keeps focus shows the RECENT SEARCHES panel in place of the rails (the idle state,
# `discoverRecentSearches.yaml`), and the soft keyboard keeps it focused on both platforms. A tap on the screen's title
# (found above the field, never by position) blurs the field, so the rails come back (run 38988891871).
- tapOn:
      text: 'Discover'
      above: 'Search recipes'
- extendedWaitUntil:
      visible: 'Trending'
      timeout: 40000

# 4. "See all" leaves browse for the full list, with no query. "Back to browse" sits in the pinned frame above the
# results — not inside them — so it is reachable whether the list is loading, failed or loaded; before 5.4 it lived
# in the result list and was stranded while that list loaded. The first "See all" belongs to Trending.
- tapOn: 'See all'
- extendedWaitUntil:
      visible: 'Back to browse'
      timeout: 40000
- assertNotVisible: 'Trending'
- tapOn: 'Back to browse'
- extendedWaitUntil:
      visible: 'Trending'
      timeout: 40000
- assertNotVisible: 'Back to browse'
