appId: ${APP_ID}
---
# The ingredient filter at its cap (curated U9, `docs/design/ingredientSpecialization.md` §S8.1a "The ingredient filter
# at its cap"). One search filters on at most six foods (`MAX_SEARCH_FOOD_FILTERS`; the service answers 400 past it).
# The bar never sends a seventh: at six, a note takes the search box's place and says how to free one, and the chips
# stay, because they are now the only way forward. The web story is `search.spec.ts` "at six ingredients…".
#
# It needs six foods the signer may filter by. The filter's search returns only foods that already have a binding the
# caller can see (`GET /api/v1/ingredients/search`), so the run's seed authors them as the signer, each named
# `${E2E_CAP_FOOD_PREFIX}` and a number (`packages/tools/e2e-seed`). One query finds all six, and a picked food leaves
# the result list, so the first result left is always a new food.
#
# Read-only: the filter is screen state, so nothing is written.
- runFlow: ../auth/signin.yaml

# audit 2026-10-19, A1.15: 'Recipes' is the tab label, also on Home; 'My recipes' is drawn only on the Recipes root.
- assertVisible: 'My recipes'
- tapOn: 'Discover'
# audit 2026-10-19, A1.15: the tab's own label 'Discover' is on screen before the tap, so waiting on it proves nothing; 'Search recipes' exists only on the Discover screen.
- extendedWaitUntil:
      visible: 'Search recipes'
      timeout: 40000

- tapOn: 'Filters.*'
# audit 2026-10-19, A1.18: a tap while a sheet, dialog or push still moves is dropped.
- waitForAnimationToEnd:
      timeout: 3000
- runFlow:
      file: common/typeIngredientFilter.yaml
      env:
          QUERY: '${E2E_CAP_FOOD_PREFIX}'

# Six picks. Anchored, because Maestro matches substrings and the field itself holds the typed prefix. The Ingredients
# group is the last in the sheet and, on Android, the keyboard is still up, so each result is scrolled into view before
# the tap.
- repeat:
      times: 6
      commands:
          - runFlow:
                file: common/scrollIntoTapView.yaml
                env:
                    TARGET: '^Filter by ${E2E_CAP_FOOD_PREFIX} .+$'
                    DIRECTION: DOWN
                    TIMEOUT: 40000
          - tapOn:
                text: '^Filter by ${E2E_CAP_FOOD_PREFIX} .+$'

# At six, the note replaces the search box, and the chips stay.
- scrollUntilVisible:
      element: 'You can filter by up to 6 ingredients. Remove one to add another.'
      direction: DOWN
      timeout: 20000
# The search box is gone: its example text ("chicken") is no longer drawn. (The group's name, "Has ingredient", stays.)
- assertNotVisible: 'chicken'
- assertVisible:
      text: '^Remove ${E2E_CAP_FOOD_PREFIX} .+$'

# Removing a chip frees a place, and the search comes back.
- tapOn:
      text: '^Remove ${E2E_CAP_FOOD_PREFIX} .+$'
- scrollUntilVisible:
      element: 'chicken'
      direction: DOWN
      timeout: 20000
- assertNotVisible: 'You can filter by up to 6 ingredients. Remove one to add another.'

- tapOn: 'Show \d+ recipes?|Show recipes'
# audit 2026-10-19, A1.15: 'Discover' is on screen under the open sheet, so it proved nothing. The sheet's own apply button is gone once it has closed.
- extendedWaitUntil:
      notVisible: 'Show \d+ recipes?|Show recipes'
      timeout: 20000
