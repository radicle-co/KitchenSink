appId: io.commise.mobile
---
# Recipe edit happy path (US1, T067; rewritten w3/e8 for the 4-step SCREEN-PER-STEP wizard). Assumes an
# authenticated session (auth flow runs first in CI) and a seeded recipe API. Drives list -> detail -> edit,
# walks the wizard's 4 steps, changes the title, clears the stated difficulty, and Publishes. Mobile mirror of
# the web Playwright `recipeCrud.spec.ts` edit path (cross-platform mandate).
#
# w3 replaced the editor's old single tall Basics form with `Wizard.Step`s that each fill the viewport as
# their own "screen"; `Wizard.TopBar` (Save Draft / Preview / Cancel / Publish) is a STICKY header rendered
# OUTSIDE the scrolling step body, so Publish never needs scrolling into view (unlike the old flow's
# foot-of-form "Save changes"); only the FOOTER `Next: …` nav (inside each step's own scroll) does.
#
# The seed is guaranteed present (the CI loop reseeds the DB before every flow), so the target recipe is
# reached by scrolling to it rather than a `when: visible` guard that would silently SKIP the whole flow when
# the recipe is below the fold (the list scrolls; only ~1 tall cover card fits the viewport at a time). The
# seed recipe now arrives WITH five ingredient lines and four steps of its own (it did not when this flow was
# written), so the >= 1-of-each a full Publish requires is already satisfied when the editor opens. The
# freeform create on steps 2/3 is kept anyway — it is this flow's coverage of that path — but BOTH of its
# checkpoints had to be re-aimed at the row/step this flow itself adds, because the ones written against an
# empty fixture now land on SEEDED content instead (see steps 2 and 3).
- runFlow: ../auth/signin.yaml

- assertVisible: 'Recipes'

- scrollUntilVisible:
      element: '${E2E_RECIPE_LAMB}'
      direction: DOWN
      timeout: 20000
- tapOn: '${E2E_RECIPE_LAMB}'
# RecipeDetailScreen: the owner's edit entry point sits in the owner-action block at the foot of the detail,
# which scrolls — reach it rather than asserting blind.
- scrollUntilVisible:
      element: 'Edit recipe'
      direction: DOWN
      timeout: 20000
- tapOn: 'Edit recipe'

# Step 1 of 4 (Basic) — the wizard opens here, seeded with the recipe's current title/difficulty. No page
# heading of its own (that copy belonged to the retired flat `RecipeForm`), so the step-progress label is the
# entry checkpoint instead.
- assertVisible: 'Step 1 of 4'
- tapOn: 'Title'
- eraseText
- inputText: '${E2E_RECIPE_LAMB} (edited)'
# Clear the stated difficulty (FR-001b): choosing "Not stated" sends the three-state update's explicit clear
# (null), not an omit. It sits further down Basic (w3/e5 added a taller cuisine picker above it), so scroll
# defensively rather than assume it is already on screen.
- scrollUntilVisible:
      element: 'Difficulty'
      direction: DOWN
      timeout: 20000
- tapOn: 'Not stated'
- scrollUntilVisible:
      element: 'Next: Ingredients'
      direction: DOWN
      timeout: 20000
- tapOn: 'Next: Ingredients'

# Step 2 of 4 (Ingredients) — the seeded recipe already carries five lines, so this add is no longer what
# satisfies Publish's >= 1; it is this flow's coverage of the freeform create (no food-service dependency,
# same as before the wizard). The picker sits at the top of this step's body.
- assertVisible: 'Step 2 of 4'
- scrollUntilVisible:
      element: 'Search ingredients'
      direction: UP
      timeout: 20000
- tapOn: 'Search ingredients'
- inputText: 'Tomato'
- scrollUntilVisible:
      element:
          text: 'Create .*Tomato.*'
      direction: DOWN
      timeout: 20000
- tapOn:
      text: 'Create .*Tomato.*'
# ⛔ THE CHECKPOINT THAT THE FREEFORM CREATE REACHED THE FORM. This was `Ingredient 1 name`, and that was a
# real proof only while the seed inserted the recipe row ALONE: `packages/services/recipe-service/src/database/seed.ts`
# now gives every seeded recipe its own lines (the lamb has five), so `Ingredient 1 name` is the FIRST SEEDED
# line's field — on screen before this flow typed anything, and therefore passing whether or not the create
# resolved. Two assertions replace it, both about THIS flow's own action:
#   1. The picker RESETS. `useIngredientResolver`'s `resolveLine` clears the query only AFTER handing the
#      resolved line up, so "Create “Tomato”" disappearing IS the create resolving; a failed create leaves the
#      query — and this affordance — in place, and the wait goes red. (It is also the wait for the round trip.)
#   2. The LINE ITSELF, addressed by the name this flow typed rather than by its position — the fact under
#      test, and one that does not move when the fixture grows. A TextInput's own value is matchable text in
#      this suite (see `search-navigation.yaml`'s "Flour" note, and why `ingredient-catalog-blend.yaml` types
#      'Flou'), and after the reset above the search box is empty, so the row is the only thing that can
#      satisfy it. Anchored at the START only: `^Tomato` cannot be met by a substring of another row, and the
#      open end tolerates the emulator's occasional last-character input duplication that the `Create .*Tomato.*`
#      pattern above already allows for.
# The count-derived alternative (`Ingredient 6 name` — 5 seeded lines + 1) was rejected: it re-couples this
# flow to the fixture's line COUNT, and it would also be satisfied by a blank sixth row.
- extendedWaitUntil:
      notVisible: 'Create .*Tomato.*'
      timeout: 30000
- scrollUntilVisible:
      element:
          text: '^Tomato'
      direction: DOWN
      timeout: 30000
- scrollUntilVisible:
      element: 'Next: Instructions'
      direction: DOWN
      timeout: 20000
- tapOn: 'Next: Instructions'

# Step 3 of 4 (Instructions) — same as step 2: the seeded recipe already has steps, so this add is coverage
# of the add-a-step path, not what opens the gate.
#
# ⛔ `Step 5 instruction`, NOT `Step 1`. `Add step` APPENDS, and the seeded lamb carries four steps of its own
# (`SEED_RECIPE_STEPS`, `packages/services/recipe-service/src/database/seed.ts`), so the row this flow just
# created is the fifth. This index is the one place the flow is coupled to the fixture's COUNT; it is stated
# rather than derived because Maestro has no "last match" selector. Typing into `Step 1 instruction` does not
# merely assert the wrong row — it appends this text to the SEEDED first step and leaves the added step EMPTY,
# and `validateRecipeForm` fails `steps` when ANY instruction is blank, so `canAdvanceFromStep(3)` never opens
# and the `Next: Review` below can no longer be tapped through.
- assertVisible: 'Step 3 of 4'
- scrollUntilVisible:
      element: 'Add step'
      # ⛔ DOWN, not UP. Advancing a step now returns the scroller to the TOP (`useScrollResetOnChange`,
      # wired in `RecipeEditor`), so `Add step` — which sits below this step's instruction list — is
      # ALWAYS downward from here. `UP` was compensating for the wizard's old behaviour of carrying the
      # previous step's scroll position over, which is the defect that reset fixes.
      direction: DOWN
      timeout: 20000
- tapOn: 'Add step'
- tapOn: 'Step 5 instruction'
- inputText: 'Combine everything and simmer.'
- scrollUntilVisible:
      element: 'Next: Review'
      direction: DOWN
      timeout: 20000
- tapOn: 'Next: Review'

# Step 4 of 4 (Photos) — Publish is the sticky top-bar action, present on every step; no scroll needed.
- assertVisible: 'Step 4 of 4'
- tapOn: 'Publish'
# Back on the detail with the new title (regex tolerates Maestro's occasional last-char input dup).
- extendedWaitUntil:
      visible:
          text: '${E2E_RECIPE_LAMB} .edited.*'
      timeout: 40000
