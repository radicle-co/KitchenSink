appId: ${APP_ID}
---
# Plan 002 US5 on a device: a matched ingredient's info glyph opens its nutrition in the bottom sheet, from the
# editor's ONE background read (`POST /api/v1/ingredients/food-nutrition`). Mobile mirror of the web Playwright
# `ingredientNutritionPanel.spec.ts`.
#
# ⚠️ WHICH STATE, AND WHY THE ASSERTION ACCEPTS TWO. The matched line is the seeded probe food `Flour`
# (`e2e-seed`'s `UNATTACHED_PROBE_INGREDIENT`, a food the signer authors), picked from the trailing field's "Your foods"
# group. The target cannot promise
# that food's figures are readable to this cook, so the flow accepts food's figures ("Per 100 g") or the owner's
# neutral "No nutritional data available" — both ANSWERS. ⛔ It does NOT accept the failed copy: a broken read must
# fail this flow (V1 sign-off item 12). The web spec and both platforms' component tests pin each state's content.
# What only this flow proves: a TAP opens the sheet on a real device (R32, nothing is hover-only), it shows an
# answer, and Close dismisses it.
#
# Discards its draft at the end, so it leaves the library unchanged.
- runFlow: ../auth/signin.yaml

# Audit 2026-10-19, A1.15: 'Recipes' is the tab label, drawn on every screen, so it proved nothing. 'My recipes' is the
# list's own segment and is drawn only on the list.
- assertVisible: 'My recipes'
- tapOn: 'New recipe'

- assertVisible: 'Close editor'
- runFlow:
      file: common/typeTitle.yaml
      env:
          TITLE: 'Maestro Nutrition Panel'

- runFlow:
      file: common/scrollIntoTapView.yaml
      env:
          TARGET: 'Add an ingredient'
          DIRECTION: DOWN
          TIMEOUT: 20000
- tapOn: 'Add an ingredient'
- inputText: 'Flour'
# The cook's own food is named for them (L4.2), which also keeps the tap off the field that holds the typed text.
- runFlow:
      file: common/pickFromOpenList.yaml
      env:
          TARGET: 'Flour, your food'

# The matched row is quiet (UI overhaul slice 8, build spec §7.5.1): its figures open from its ⋯ Food details.
- scrollUntilVisible:
      element: 'Edit Flour'
      # The line lands above the add field the cook is at: one page, so it is UP.
      direction: UP
      timeout: 30000
- tapOn: 'Actions for Flour'
- tapOn: 'Food details'
- extendedWaitUntil:
      visible: '^(Per 100 g|No nutritional data available)$'
      timeout: 20000

- tapOn: 'Close details for Flour'
- extendedWaitUntil:
      notVisible: '^(Per 100 g|No nutritional data available)$'
      timeout: 10000
- assertVisible: 'Edit Flour'

# Throw the scratch draft away: leaving alone would keep it, because the editor saves on exit (§3.5).
- runFlow: common/discardDraft.yaml
# Audit 2026-10-19, A1.15: 'Recipes' is the tab label and is always on screen; 'My recipes' is drawn only on the list.
- assertVisible: 'My recipes'
