appId: ${APP_ID}
---
# Remote foods on a device (plan 002 S7.8, ADR-0055 points 9 and 10). Mobile mirror of the web Playwright
# `ingredientRemoteFoods.spec.ts` create and Change food stories. Replaces `ingredientUsdaSearch.yaml`, whose
# "Search USDA" option is gone: a source's foods now flow into the same list as the database's, with no button
# (owner ruling 2026-10-02).
#
# Assumes an authenticated session and the app pointed at the PR's deployed sandbox, like `create.yaml`.
#
# WHAT THIS FLOW ASSERTS, which only a device can:
#
#   1. The USDA group arrives BY ITSELF. Nothing is pressed between typing and the group showing, and the old
#      option is not on screen.
#   2. ⛔ It APPENDS: the cook's own food, listed before it arrived, is still listed after.
#   3. A remote pick lands on the line as ONE command: the adopt, then the line's write. The trailing add row admits
#      the root; Change food on that line picks a second remote food the same way.
#   4. The recipe publishes with the remote foods on it (Publish rejects a line whose binding does not resolve).
#
# ⚠️ An upstream that is really down, or rate-limiting this stage, fails this flow at the labelled waits. That is the
# honest result for a tier that proves the deployed system. The list's states when a source cannot answer are the
# component tier's (`entryCombobox.test.ts`, `RecipeIngredientsFields.rowEditor.native.test.tsx`) and the web
# Playwright `ingredientSearchDegraded.spec.ts`.
#
# It spends two remote picks from the signer's source budget, and leaves one published recipe, which the next flow's
# reset deletes.
- runFlow: ../auth/signin.yaml

- assertVisible: 'Recipes'
- tapOn: 'New recipe'

- assertVisible: 'Close editor'
- runFlow:
      file: common/typeTitle.yaml
      env:
          TITLE: 'Maestro Remote Foods'

# Cuisine is required to publish (2026-10-13).
- runFlow: common/chooseCuisine.yaml

# The Ingredients section, on the same page: with no lines yet, the trailing field is its first control.
- scrollUntilVisible:
      element: 'Add an ingredient'
      direction: DOWN
      timeout: 20000
- tapOn: 'Add an ingredient'

# A PREFIX of the run's probe food `Flour` (`e2e-seed provision`), so "Your foods" has something to keep; never 'Flour',
# because the field's own value is matchable text.
# ⛔ 'Flo', not 'Flou'. The service hides a USDA hit whose root the catalog already carries (ADR-0055 point 4), and the
# curated catalog carries the flours, so a real flour word shows no USDA group at all. Measured on pr-91, 2026-10-18:
# 'Flou' 0 USDA foods shown, 'flour' 1, 'Flo' 13 (branded products the catalog does not carry).
- inputText: 'Flo'
- extendedWaitUntil:
      visible:
          text: 'Your foods'
      timeout: 30000

# ⛔ No press: the source's group arrives on its own. Maestro's text match ignores case, so `FROM USDA` matches. It is
# scrolled to rather than waited for: on a stage whose catalog seed matches the words, the catalog group above it
# starts the source's group below the fold.
- runFlow:
      file: common/scrollOpenList.yaml
      env:
          TARGET: 'From USDA'
      label: 'USDA answered the progressive search for "flo" on this stage'
- assertNotVisible: 'Search USDA for .*'
# It appended: the cook's own food is still listed.
- runFlow:
      file: common/scrollOpenList.yaml
      env:
          TARGET: 'Flour, your food'
          DIRECTION: UP

# One remote pick. Its name ends in its source (`hitName`), which no database option's does.
- runFlow:
      file: common/scrollOpenList.yaml
      env:
          TARGET: '.*, from USDA'
- tapOn:
      text: '.*, from USDA'
      index: 0
- extendedWaitUntil:
      visible:
          text: 'Edit .*'
      timeout: 40000
      label: 'the remote pick adopted its food and the add row admitted the root'

# Change food on that line, to a second remote food. The field opens on the food's name with the caret at its end, so
# the name is erased first; a branded name can run past 70 characters.
# 'gochujang', for the reason 'Flo' is used above: 'butter' showed only 2 USDA foods on pr-91 (2026-10-18), and one more
# catalog row would take it to none. 'gochujang' showed 20.
# iOS: after a pick the keyboard may still be on its way down (or up again, when the keyboard's first-use card was
# dismissed), and the page shifts by the keyboard's height as it moves. A tap on the row's menu lands on the position the
# row had when it was read, so the menu did not open and "Change food" was never on screen (2 of 3 runs, 2026-10-18).
# Closing the keyboard first, as `edit.yaml` does, makes the layout still before the tap.
- runFlow: common/closeEditorKeyboard.yaml
- scrollUntilVisible:
      element: 'Actions for .*'
      direction: DOWN
      timeout: 20000
- tapOn: 'Actions for .*'
- tapOn: 'Change food'
- eraseText: 120
- inputText: 'gochujang'
- runFlow:
      file: common/scrollOpenList.yaml
      env:
          TARGET: 'From USDA'
      label: 'USDA answered the progressive search for "gochujang" on this stage'
- runFlow:
      file: common/scrollOpenList.yaml
      env:
          TARGET: '.*, from USDA'
- tapOn:
      text: '.*, from USDA'
      index: 0
# The pick closed the list and left Change food. The row's open control is named for the line's food, so it names
# gochujang only once the second remote pick has moved the line (before it, it names the first pick's food).
- extendedWaitUntil:
      visible:
          text: 'Edit .*[Gg]ochujang.*'
      timeout: 40000
      label: 'the second remote pick moved the line to its root'
- assertNotVisible: '.*, from USDA'

# Finish the recipe, so the remote foods are proven usable.
- scrollUntilVisible:
      element: 'Add step'
      direction: DOWN
      timeout: 20000
- tapOn: 'Add step'
- tapOn: 'Step 1'
- inputText: 'Whisk and rest.'
# The soft keyboard is up and the action bar has UNPINNED with it, so the bar is below this screen (build spec §7.1,
# "Keyboard open (phones)"). The first heading closes the keyboard and pins the bar again.
- runFlow: common/closeEditorKeyboard.yaml
- tapOn: 'Publish'

- extendedWaitUntil:
      visible:
          text: 'Maestro Remote Foods.*'
      timeout: 40000
