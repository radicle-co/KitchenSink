appId: io.commise.mobile
---
# The ingredient row editor's stories on a device (plan 002 V1 B7). Mobile mirror of the web Playwright
# `ingredientRowEditor.spec.ts`:
#
# - US7, Change food: the cook reopens a matched line's food and picks another, and the amount and unit stay.
# - `docs/design/rowEditorOpenDecisions.md` R7: text a Change food row holds refuses Save Draft; the refusal lands on
#   step 2 in that field, which says why, and choosing "Use … as written" lets the save go ahead.
#
# It runs against the PR's deployed sandbox (ADR-0032) on the create form, so each pick goes into the draft
# (blueprint decision 7). The first food is the run's probe `Flour` (`e2e-seed provision`); the second is the KTD-16
# root `boneless skinless chicken breasts` from the stage's catalog seed. Save Draft leaves one draft recipe, which the
# next flow's reset deletes.
- runFlow: ../auth/signin.yaml

- assertVisible: 'Recipes'
- tapOn: 'New recipe'
- tapOn: 'Create from Scratch'

- assertVisible: 'Step 1 of 4'
- tapOn: 'Title'
- inputText: 'Maestro Row Editor'
- scrollUntilVisible:
      element: 'Next: Ingredients'
      direction: DOWN
      timeout: 20000
- tapOn: 'Next: Ingredients'
- assertVisible: 'Step 2 of 4'

# The probe food, then an amount the cook chose.
- scrollUntilVisible:
      element: 'Add an ingredient'
      direction: DOWN
      timeout: 20000
- tapOn: 'Add an ingredient'
- inputText: 'Flou'
- extendedWaitUntil:
      visible:
          text: 'Your foods'
      timeout: 30000
- tapOn: 'Flour, your food'
- scrollUntilVisible:
      element: 'Ingredient 1 quantity'
      direction: DOWN
      timeout: 30000
- tapOn: 'Ingredient 1 quantity'
- eraseText
- inputText: '3'
- tapOn: 'Ingredient 1 unit'
- inputText: 'cups'

# US7: Change food keeps the cook's amount and unit. The field opens on the food's name with the caret at its end
# (`Combobox.native.tsx`'s focus request), so the name is erased before the search is typed.
- tapOn: 'Actions for Flour'
- tapOn: 'Change food'
- eraseText: 20
- inputText: 'boneless skinless chicken brea'
- extendedWaitUntil:
      visible:
          text: 'boneless skinless chicken breasts'
      timeout: 30000
      label: 'KTD-16 root "boneless skinless chicken breasts" is in this stage’s food catalog'
- tapOn: 'boneless skinless chicken breasts'
- extendedWaitUntil:
      visible:
          text: 'Actions for boneless skinless chicken breasts'
      timeout: 30000
- assertVisible:
      text: '3'
      below: 'Ingredient 1 name'
- assertVisible: 'cups'

# R7: Change food again, type, and leave the step by the rail, which is ungated (R6).
- tapOn: 'Actions for boneless skinless chicken breasts'
- tapOn: 'Change food'
- eraseText: 40
- inputText: 'smoked flour'
# No `hideKeyboard` — why is at `pinnedActionBar.yaml`'s bottom-of-list assertion. With the keyboard up the list's
# opening scrolls the field to the top (`docs/design/rowEditorOpenDecisions.md` E1), so the rail may be above the visible
# area: scroll back to it with a swipe inside the scroller (`scrollUntilVisible` swipes from the centre, on the bar).
- repeat:
      while:
          notVisible: 'Instructions: .*'
      times: 8
      commands:
          - swipe:
                start: 50%, 20%
                end: 50%, 40%
                duration: 400
- tapOn: 'Instructions: .*'
- assertVisible: 'Step 3 of 4'
- tapOn: 'Save Draft'

# The refusal lands on step 2, and the row says why.
- assertVisible: 'Step 2 of 4'
- assertVisible: '“smoked flour” isn’t in the recipe yet\. Choose a food for it, or press Cancel to keep boneless skinless chicken breasts\.'

# The list opened with the focus (R7 item 3), so the cook keeps the words without editing them. The way on is the list's
# last option, after every food the words match, so how far down it sits depends on the stage's catalog.
- scrollUntilVisible:
      element: 'Use “smoked flour” as written, without nutrition'
      direction: DOWN
      timeout: 20000
- tapOn: 'Use “smoked flour” as written, without nutrition'
- tapOn: 'Save Draft'
- extendedWaitUntil:
      visible:
          text: 'Maestro Row Editor.*'
      timeout: 40000
