appId: ${APP_ID}
onFlowComplete:
    # ⛔ ALWAYS back to portrait, pass or fail: the simulator is shared by every later flow on this shard (see landscape.yaml).
    - setOrientation: PORTRAIT
---
# The needs-review jump on a device (mobile): a line the verification gate called NEEDS_REVIEW shows the owner a
# "Needs review: <food>" control on the recipe's detail, and tapping it opens the editor with THAT line's row editor sheet
# already open. The sheet shows "Needs review", why, what the cook wrote and what it was counted as; Cancel puts the fields
# back, Done keeps them.
#
# ⛔ LOCAL STACK ONLY, and the only flow that is. THE FIXTURE is `deriveNeedsReviewProbe`
# (`packages/tools/e2e-seed/src/fixtureManifest.ts`): the signer's private recipe "Needs Review Probe" with ONE line, 2 cups
# of the signer's own food `${E2E_NEEDS_REVIEW_FOOD}`, whose source line is "${E2E_NEEDS_REVIEW_SOURCE_LINE}". A line reads
# NEEDS_REVIEW only when the verification gate has STORED a `contradicted` verdict, and the Bedrock worker that writes it is
# not part of the local stack. So `reset --mode needsReview` writes that one row straight into the LOCAL recipe database,
# and REFUSES to do it for anything whose database, recipe API or food API host is not loopback
# (`requireLocalSeedTarget`). A deployed run therefore cannot raise this fixture, and `runMaestroFlows.sh` leaves the flow
# out of every deployed selection (`MAESTRO_LOCAL_ONLY_FLOWS`), printing why.
#
# What only a device proves: a TAP on the owner's control crosses navigation into the editor with the sheet open on the right
# line, the keyboard comes down before Done, and Cancel and Done each do what their names say on the real row.
- runFlow: ../auth/signin.yaml

# 'Recipes' is the tab label, drawn on every screen; 'My recipes' is drawn only on the list.
- assertVisible: 'My recipes'
- runFlow:
      file: common/scrollIntoTapView.yaml
      env:
          TARGET: '${E2E_RECIPE_NEEDS_REVIEW_PROBE}'
          DIRECTION: DOWN
          TIMEOUT: 20000
- tapOn: '${E2E_RECIPE_NEEDS_REVIEW_PROBE}'

# The detail: the owner's control, named for the food. It sits with the ingredients, below the fold.
- runFlow:
      file: common/scrollIntoTapView.yaml
      env:
          TARGET: 'Needs review: ${E2E_NEEDS_REVIEW_FOOD}'
          DIRECTION: DOWN
          TIMEOUT: 20000
- tapOn: 'Needs review: ${E2E_NEEDS_REVIEW_FOOD}'

# The editor opens with that line's row editor sheet open: what the cook wrote, and what it was counted as.
- extendedWaitUntil:
      visible: 'You wrote'
      timeout: 30000
- assertVisible: '${E2E_NEEDS_REVIEW_SOURCE_LINE}'
# The sheet's own "Needs review" heading, above "You wrote". The detail's pill carries the same words, so the text alone
# would pass without the sheet; `above` ties it to the notice.
- assertVisible:
      text: 'Needs review'
      above: 'You wrote'
- assertVisible: 'Counted as'
- assertVisible: 'Change'

# CANCEL restores. The keyboard comes down first on Android: its action key is ALSO named "Done" (`key_pos_ime_action`), and
# with the keyboard up a bare tap on a sheet button can resolve to it. iOS keeps the bare tap (`hideKeyboard` fails there).
- tapOn: 'Amount'
- eraseText: 5
- inputText: '9'
- runFlow:
      when:
          platform: Android
      commands:
          - hideKeyboard
- tapOn: 'Cancel'
- extendedWaitUntil:
      notVisible: 'You wrote'
      timeout: 20000
# The row reads like the recipe page: a word unit takes the amount's number ("2 cups").
- assertVisible: 'Edit 2 cups ${E2E_NEEDS_REVIEW_FOOD}.*'

# DONE keeps. Reopen the same row, change the amount again, and close the sheet with Done.
- tapOn: 'Edit 2 cups ${E2E_NEEDS_REVIEW_FOOD}.*'
- extendedWaitUntil:
      visible: 'You wrote'
      timeout: 20000
- tapOn: 'Amount'
- eraseText: 5
- inputText: '7'
- runFlow:
      when:
          platform: Android
      commands:
          - hideKeyboard
- tapOn: 'Done'
- extendedWaitUntil:
      notVisible: 'You wrote'
      timeout: 20000
- assertVisible: 'Edit 7 cups ${E2E_NEEDS_REVIEW_FOOD}.*'

# iOS TABLETS ONLY: with the keyboard up, the open editor's Done and Cancel stay ABOVE it, and after Done or Cancel the
# edited row is back on screen WITHOUT a scroll, in landscape and in portrait (the field reveal carries the row's end:
# `withRevealEnd`, and closing asks the host for the row's start: `RecipeIngredientsFields.native.tsx`). Android keeps its own
# `hideKeyboard` steps above, because its keyboard's action key is ALSO named "Done" and this flow cannot tell the two apart.
#
# HOW IT TELLS A TABLET FROM A PHONE: no house flow does (there is no device-class env var and no tablet precedent), so it reads
# the layout. A phone opens the row editor as a SHEET, which has a "Close <food>" control; the tablet's inline editor has none.
# The flow opens the row, looks for that control, and a phone closes the sheet with Cancel and skips the rest, which is a SKIP
# and not a failure. `when: visible` does not wait, so the open is awaited on "You wrote" first.
#
# The tap is anchored `rightOf: 'Cancel'`, so it can never resolve to the keyboard's own key named "Done". The same steps run
# twice, once per orientation; Maestro has no loop or macro that keeps `when` and `setOrientation` readable, so they are
# written out. Each pass reopens the row from rest, so a rotation never meets an open editor.
#
# ⛔ THE RUNNER MUST SET UP THE SIMULATOR BEFORE THIS FLOW (Maestro has no command for either):
#   1. a SOFT keyboard: `defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false`, then boot the simulator.
#      With the hardware keyboard connected no keyboard rises and the steps below prove nothing.
#   2. a large text size: `xcrun simctl ui booted content_size accessibility-large`, and back to `large` afterwards.
- runFlow:
      when:
          platform: iOS
      commands:
          - tapOn: 'Edit 7 cups ${E2E_NEEDS_REVIEW_FOOD}.*'
          - extendedWaitUntil:
                visible: 'You wrote'
                timeout: 20000
          # The editor is up with its pair, whichever layout it took.
          - assertVisible: 'Counted as'
          - assertVisible: 'Cancel'
          - assertVisible: 'Done'
          # A phone: the sheet's close control is there. Cancel it and leave the block.
          - runFlow:
                when:
                    visible: 'Close ${E2E_NEEDS_REVIEW_FOOD}.*'
                commands:
                    - tapOn: 'Cancel'
                    - extendedWaitUntil:
                          notVisible: 'You wrote'
                          timeout: 20000
          # A tablet: no such control. Cancel, then prove both orientations from rest.
          - runFlow:
                when:
                    notVisible: 'Close ${E2E_NEEDS_REVIEW_FOOD}.*'
                commands:
                    - tapOn: 'Cancel'
                    - extendedWaitUntil:
                          notVisible: 'You wrote'
                          timeout: 20000
                    - setOrientation: LANDSCAPE_LEFT
                    - tapOn: 'Edit 7 cups ${E2E_NEEDS_REVIEW_FOOD}.*'
                    - extendedWaitUntil:
                          visible: 'You wrote'
                          timeout: 20000
                    - tapOn: 'Amount'
                    - eraseText: 5
                    - inputText: '5'
                    - assertVisible:
                          text: 'Done'
                          rightOf: 'Cancel'
                    - tapOn:
                          text: 'Done'
                          rightOf: 'Cancel'
                    - extendedWaitUntil:
                          notVisible: 'You wrote'
                          timeout: 20000
                    # No scroll in between: the edited row is already on screen, which the reveal on close did.
                    - assertVisible: 'Edit 5 cups ${E2E_NEEDS_REVIEW_FOOD}.*'
                    - setOrientation: PORTRAIT
                    - tapOn: 'Edit 5 cups ${E2E_NEEDS_REVIEW_FOOD}.*'
                    - extendedWaitUntil:
                          visible: 'You wrote'
                          timeout: 20000
                    - tapOn: 'Amount'
                    - eraseText: 5
                    - inputText: '7'
                    - assertVisible:
                          text: 'Done'
                          rightOf: 'Cancel'
                    - tapOn:
                          text: 'Done'
                          rightOf: 'Cancel'
                    - extendedWaitUntil:
                          notVisible: 'You wrote'
                          timeout: 20000
                    - assertVisible: 'Edit 7 cups ${E2E_NEEDS_REVIEW_FOOD}.*'

# Leave with the close control, never Discard (it deletes the recipe). The next flow's reset deletes the probe either way.
- tapOn: 'Close editor'
