# The paid features by ROLE, on a device, against the real identity service (plan 2026-10-14-009 D12; owner ruling
# 2026-10-13: "tests of premium features use DEFAULT users to verify they see only upsell flows, and premium/vip/superuser
# users to verify they see premium flows"; owner ruling 2026-10-15: an ADMIN sees them as a default user does). The
# mobile twin of `web/tests/e2e/paidFeatureRoles.spec.ts`.
#
# Signs in as the pool's `roles` tier users — one per role, provisioned by `poolAdmin` with their roles in signed
# `public_metadata` — and opens the new-recipe editor's "Who can see it". READ-ONLY by the pool's own rules (no lease, no
# reset — `POOL_TIERS` in `testPool.ts`): it types no title, so the editor saves nothing, and it leaves by ×.
#
# ⚠️ The stage's gate is the OWNER's (both variables stay `false` until the owner flips them), so the DEFAULT and ADMIN
# legs accept EITHER answer and assert what that answer requires (`common/gateDecidesPrivate.yaml`). The entitled legs are
# gate-free: Private is always a real choice, with no sheet. Every state is pinned deterministically by the component suites and `paidFeatureGate.spec.ts`.
#
# The addresses come from `@kitchensink/e2e-seed`'s manifest (`FIXTURE_ENV_KEYS`), never literals. Each cook is signed
# in on a CLEARED device (`clearState`), because `signinHome.yaml` skips the form when any session is persisted; the
# device is cleared again in `onFlowComplete`, pass or fail, so the next flow signs in as the shard's signer.
#
# ⚠️ The editor's radios carry a hint under the title, so their accessible name is BOTH texts (`visibility.yaml` says
# why), and the statement is ONE element named by its whole sentence (`RecipeVisibilityStatement.native.tsx`).

appId: ${APP_ID}
onFlowComplete:
    - launchApp:
          clearState: true
---
# ── DEFAULT and ADMIN: never granted; shows only what the stage's gate allows ────────────────────────────────────────
# An admin sees paid features as a default user does (owner ruling 2026-10-15); superuser is the admin who gets them.
- launchApp:
      clearState: true
- runFlow:
      file: common/gateDecidesPrivate.yaml
      env:
          E2E_SIGNIN_EMAIL: ${E2E_ROLE_DEFAULT_EMAIL}
- launchApp:
      clearState: true
- runFlow:
      file: common/gateDecidesPrivate.yaml
      env:
          E2E_SIGNIN_EMAIL: ${E2E_ROLE_ADMIN_EMAIL}

# ── PREMIUM, VIP, SUPERUSER: always granted — Private is a real choice, with no Premium sheet ─────────────────────────
- launchApp:
      clearState: true
- runFlow:
      file: common/privateIsAChoice.yaml
      env:
          E2E_SIGNIN_EMAIL: ${E2E_ROLE_PREMIUM_EMAIL}
- launchApp:
      clearState: true
- runFlow:
      file: common/privateIsAChoice.yaml
      env:
          E2E_SIGNIN_EMAIL: ${E2E_ROLE_VIP_EMAIL}
- launchApp:
      clearState: true
- runFlow:
      file: common/privateIsAChoice.yaml
      env:
          E2E_SIGNIN_EMAIL: ${E2E_ROLE_SUPERUSER_EMAIL}
