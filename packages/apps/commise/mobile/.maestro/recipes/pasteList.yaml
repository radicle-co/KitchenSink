appId: ${APP_ID}
---
# Paste a list in the editor's Ingredients section (build spec §7.5.4; blueprint A5; owner decision D10; UI overhaul
# slice 8). Mobile mirror of the web Playwright `ingredientPasteList.spec.ts`. REPLACES `parseIngredients.yaml`: the
# paste and review screens are retired, and the flow ends inside the recipe.
#
# What only this tier proves: on a device the pasted lines go to the parse job, and the POLL advances them into the recipe
# while the app is foregrounded (the parse worker answers; nothing is tapped between), where they are matched (ADR-0071).
# The field's own system paste menu is the native paste (Settled 34), so the flow types the lines.
#
# It asserts the SETTLED outcome only, never the progress block's "Added N of 2 lines" (lead ruling on issue #143,
# 2026-11-06): once a stage has parsed these lines, its parse cache settles the paste before Maestro can see that state,
# so the check passed only on a stage's first run. The reading state and its block are the component tests' subject on
# both platforms (`RecipeIngredientsFields.test.tsx`, `RecipeIngredientsFields.native.test.tsx`).
#
# It discards its draft, so it leaves the library as it found it. It needs the parse worker running (the local
# runner starts `recipe-workers`).
- runFlow: ../auth/signin.yaml

# Audit 2026-10-19, A1.15: 'Recipes' is the tab label, drawn on every screen, so it proved nothing. 'My recipes' is the
# list's own segment and is drawn only on the list.
- assertVisible: 'My recipes'
- tapOn: 'New recipe'
- assertVisible: 'Close editor'

# ⚠️ Paste FIRST: D10 offers paste only while the recipe has no server row, and the editor creates that row at the first
# checkpoint after a title is typed. The empty section offers Paste a list beside its add field.
# Jump there through the section index, so the button is on screen rather than swiped past.
- tapOn:
      text: 'Sections\. Current: .*'
- extendedWaitUntil:
      visible: 'Close sections'
      timeout: 20000
- tapOn: 'Ingredients'
- extendedWaitUntil:
      visible: 'Paste a list'
      timeout: 20000
# P4: Paste a list comes after the add field in reading order, and is under it on a phone: the field is on screen above it.
- assertVisible: 'Add an ingredient'
- tapOn: 'Paste a list'
- assertVisible: 'Ingredient lines'
- tapOn: 'Ingredient lines'
# Maestro's inputText drops a newline, so each line is typed and Enter starts the next (the field is multiline).
- inputText: '2 cups flour'
- pressKey: Enter
- inputText: '1 tsp salt'
- assertVisible: '2 lines'
- tapOn: 'Add 2 ingredients'

# The sheet closes once the job is accepted.
- extendedWaitUntil:
      notVisible: 'Ingredient lines'
      timeout: 30000
# ⛔ REWRITTEN for ADR-0071 (2026-10-26). The pasted lines used to join as ordinary rows ("Edit 2 cups flour") through a
# by-name lookup, which bound a ranked guess. They are now MATCHED: the poll brings the parse, the app asks for the
# matches, and the lines join in paste order as the paste list (a summary, then one row per line). Nothing is tapped
# between. A stage whose worker cannot answer is the hand-run `pasteListStalled.yaml`'s subject.
# iOS publishes the whole summary as ONE node ("Added 2 lines, 2 to choose. Matched lines are ready...") and Maestro matches the
# WHOLE text, so the sentence ends in `.*`; "Added 0 of 2 lines" still does not match it (deployed run 42134419670).
- extendedWaitUntil:
      visible:
          text: 'Added 2 lines.*'
      timeout: 240000
      label: 'both pasted lines joined the recipe once the parse job answered and the foods were matched'
- assertNotVisible:
      text: 'Added [0-2] of 2 lines.*'
# Each line is drawn once, with the words the cook pasted, as a row of the paste list...
- assertVisible:
      text: '.*[Ff]lour.*'
# ...and nothing was chosen for the cook (owner rulings 2026-10-25): "flour" and "salt" carry a seeded DEFAULT, which is
# shown and never selected, so no line says "your choice" and the first open line offers a direct Search.
- assertNotVisible:
      text: '.*your choice.*'
- assertVisible:
      text: 'Search for a food.*'
# The first open line is expanded by design (the direct Search above), which pushes the second row under the fold, and
# Android lists only on-screen nodes (deployed run 42117856262, Android shard 4). So the first row is checked while it
# is on screen, then the flow scrolls to the second and checks it the same way.
- scrollUntilVisible:
      element:
          text: '.*[Ss]alt.*'
      direction: DOWN
      timeout: 20000
- assertNotVisible:
      text: '.*your choice.*'

- runFlow:
      file: common/discardDraft.yaml
      env:
          # No title was typed, so the draft never leaves the device (a server write needs one).
          SETTLED: 'Saved on this device'
