appId: ${APP_ID}
---
# A paste the server reads as STALLED waits on the cook (plan 2026-10-15-011; owner ruling 2026-10-13: "it takes as long
# as it takes"). Mobile mirror of the web Playwright case "a stalled paste waits on the cook" in
# `ingredientPasteList.spec.ts`.
#
# ⛔ HAND-RUN ONLY, with the parse worker STOPPED (a local stage whose `recipe-workers` is not started). That is the only
# way to make a real server say "stalled": `lineProgressOf` calls a paste stalled once none of its lines has moved for
# `PARSE_LINE_DELIVERY.stallSeconds` (360 s), and a deployed stage's worker answers long before that. The threshold is a
# constant, not shortened for tests, so this flow waits up to seven minutes. It is recorded in `KNOWN_UNRUN_FLOWS`
# (`maestroFlowSelection.test.ts`) for that reason.
#
# What it proves on a device: the rows say what the server reports, nothing joins by a clock, the progress block offers
# the way out, and Add the rest as written joins every line through the add field's reader.
- runFlow: ../auth/signin.yaml

# Audit 2026-10-19, A1.15: 'Recipes' is the tab label, drawn on every screen, so it proved nothing. 'My recipes' is the
# list's own segment and is drawn only on the list.
- assertVisible: 'My recipes'
- tapOn: 'New recipe'
- assertVisible: 'Close editor'

- tapOn:
      text: 'Sections\. Current: .*'
- extendedWaitUntil:
      visible: 'Close sections'
      timeout: 20000
- tapOn: 'Ingredients'
- extendedWaitUntil:
      visible: 'Paste a list'
      timeout: 20000
- tapOn: 'Paste a list'
- assertVisible: 'Ingredient lines'
- tapOn: 'Ingredient lines'
# Maestro's inputText drops a newline, so each line is typed and Enter starts the next (the field is multiline).
- inputText: '2 cups flour'
- pressKey: Enter
- inputText: '1 tsp salt'
- tapOn: 'Add 2 ingredients'
- extendedWaitUntil:
      notVisible: 'Ingredient lines'
      timeout: 30000

# Nothing claims the lines, so each waits to be read, under the one progress block.
- extendedWaitUntil:
      visible: 'Waiting to be read'
      timeout: 30000
- assertVisible:
      text: 'Added 0 of 2 lines.*'
# Past the stall threshold the server reads the paste as stalled: the rows say so, and they still do not join.
- extendedWaitUntil:
      visible: 'You can keep waiting, or add the lines as written.'
      timeout: 420000
      label: 'the server reports the paste stalled (360 s with no line moving)'
- assertVisible: 'Taking longer than usual'
- assertNotVisible:
      text: 'Edit 2 .*[Ff]lour.*'

- tapOn: 'Add the rest as written: 2 lines'
- extendedWaitUntil:
      visible:
          text: 'Edit 2 .*[Ff]lour.*'
      timeout: 30000
- assertVisible:
      text: 'Edit 1 .*[Ss]alt.*'
- assertNotVisible: 'Taking longer than usual'

- runFlow:
      file: common/discardDraft.yaml
      env:
          # No title was typed, so the draft never leaves the device (a server write needs one).
          SETTLED: 'Saved on this device'
