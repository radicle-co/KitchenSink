appId: ${APP_ID}
---
# Publishing with lines that have no food yet is ALLOWED, but the cook is asked first (R23; `ingredientMatching.md`,
# "Save"), on a device. Mobile mirror of the web Playwright `pastePublishOpenChoices.spec.ts`: the sheet names the open
# lines and says they are saved as written; Choose now opens the first open line and publishes nothing.
#
# ⚠️ WRITTEN WITH THE SLICE AND NOT RUN (no device in this build). It depends on the stage's seeded default for "milk";
# recorded in `KNOWN_UNRUN_FLOWS`. Promote it to `FLOW_PLAN` in the PR whose Maestro tier is watched.
- runFlow: ../auth/signin.yaml

- assertVisible: 'My recipes'
- tapOn: 'New recipe'
- assertVisible: 'Close editor'
- runFlow:
      file: common/typeTitle.yaml
      env:
          TITLE: 'Maestro Open Choices Pudding'
- runFlow: common/chooseCuisine.yaml
- runFlow:
      file: common/jumpToSection.yaml
      env:
          SECTION: 'Ingredients'
- extendedWaitUntil:
      visible: 'Paste a list'
      timeout: 20000
- tapOn: 'Paste a list'
- assertVisible: 'Ingredient lines'
- tapOn: 'Ingredient lines'
- inputText: '2 cups milk'
- tapOn: 'Add 1 ingredient'
- extendedWaitUntil:
      notVisible: 'Ingredient lines'
      timeout: 30000
- extendedWaitUntil:
      visible: 'Choose the milk you use'
      timeout: 240000

- runFlow:
      file: scrollIntoTapView.yaml
      env:
          TARGET: 'Publish'
          DIRECTION: DOWN
          TIMEOUT: 20000
- tapOn: 'Publish'
- extendedWaitUntil:
      visible: '1 ingredient has no food yet'
      timeout: 20000
- assertVisible: 'Publish anyway'
- tapOn: 'Choose now'
# Nothing was published: the editor is still open, and the first open line is back in view.
- extendedWaitUntil:
      notVisible: '1 ingredient has no food yet'
      timeout: 20000
- assertVisible: 'Close editor'
- assertVisible: 'Search for a food for 2 cups milk'

- runFlow:
      file: common/discardDraft.yaml
      env:
          SETTLED: 'Saved on this device'
