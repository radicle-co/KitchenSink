appId: ${APP_ID}
---
# Publishing with lines that have no food yet is ALLOWED, but the cook is asked first (R23; `ingredientMatching.md`,
# "Save"), on a device. Mobile mirror of the web Playwright `pastePublishOpenChoices.spec.ts`: the sheet names the open
# lines and says they are saved as written; Choose now opens the first open line and publishes nothing.
#
# ⚠️ Written with the slice and not run; first passed ONCE on the local Android stack (2026-11-06), which seeds the same
# default. It depends on the stage's seeded default for "milk"; recorded in `KNOWN_UNRUN_FLOWS`. Promote it to
# `FLOW_PLAN` in the PR whose Maestro tier is watched.
- runFlow: ../auth/signin.yaml

- assertVisible: 'My recipes'
- tapOn: 'New recipe'
- assertVisible: 'Close editor'
- runFlow:
      file: common/typeTitle.yaml
      env:
          TITLE: 'Maestro Open Choices Pudding'
- runFlow: common/chooseCuisine.yaml
- runFlow:
      file: common/jumpToSection.yaml
      env:
          SECTION: 'Ingredients'
- extendedWaitUntil:
      visible: 'Paste a list'
      timeout: 20000
- tapOn: 'Paste a list'
- assertVisible: 'Ingredient lines'
- tapOn: 'Ingredient lines'
- inputText: '2 cups milk'
- tapOn: 'Add 1 ingredient'
- extendedWaitUntil:
      notVisible: 'Ingredient lines'
      timeout: 30000
- extendedWaitUntil:
      visible: 'Choose the milk you use'
      timeout: 240000

# A recipe publishes only with a step, as the web spec adds one. Without it Publish asks the cook to fix the missing step,
# and the open-choices sheet never opens (Android device pass, 2026-11-06: "Add at least one step.").
- runFlow:
      file: common/scrollIntoTapView.yaml
      env:
          TARGET: 'Add step'
          DIRECTION: DOWN
          TIMEOUT: 20000
- tapOn: 'Add step'
- tapOn: 'Step 1'
- inputText: 'Soak the bread.'
# The soft keyboard unpins the action bar; closing it pins Publish again.
- runFlow: common/closeEditorKeyboard.yaml

- runFlow:
      file: common/scrollIntoTapView.yaml
      env:
          TARGET: 'Publish'
          DIRECTION: DOWN
          TIMEOUT: 20000
- tapOn: 'Publish'
- extendedWaitUntil:
      visible: '1 ingredient has no food yet'
      timeout: 20000
- assertVisible: 'Publish anyway'
- tapOn: 'Choose now'
# Nothing was published: the editor is still open, and the first open line is back in view.
- extendedWaitUntil:
      notVisible: '1 ingredient has no food yet'
      timeout: 20000
- assertVisible: 'Close editor'
- assertVisible: 'Search for a food for 2 cups milk'

# The typed title gave the draft a server row, so it settles as "Saved", the helper's default (the device pass read
# "Saved" in the header after the Publish tap).
- runFlow: common/discardDraft.yaml
