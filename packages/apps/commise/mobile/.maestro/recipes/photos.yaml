appId: ${APP_ID}
---
# Recipe photo manager surface (T067, CP-6/P3 photo-upload user story). Assumes an authenticated session
# (auth flow runs first in CI) and a seeded recipe API. Drives list -> detail -> edit, and asserts the shared
# photo-manager block (`RecipePhotoUploader`, mounted by `RecipeEditorScreen`) renders its accessible
# "Photos" section, the empty state, and the add-photo control. Mobile counterpart to the web Playwright spec
# `recipePhotos.spec.ts`.
#
# LIMITATION — the picker itself is deliberately NOT driven here. `expo-image-picker`'s
# `launchImageLibraryAsync` opens native OS chrome (the system photo library / permission sheet); Maestro
# cannot reliably drive that (OS version/locale/permission-state dependent), and no flow in this suite taps
# OS chrome — there is no precedent for it here, and starting one would make this flow flaky by construction.
# Choosing a source in the Add photos sheet is intentionally skipped for the same reason: "Take photo" and "Choose
# from library" both hand over to OS chrome (the camera, the photo library, the permission prompt), which would
# strand every flow that runs after this one in CI. Tapping "Add photos" itself IS driven (A-010): it opens OUR sheet,
# which Maestro can read and close.
#
# The recommended path to close this gap end-to-end is a build-flag test double for `expo-image-picker` (an
# E2E-only Expo config swaps in a fake that returns a fixed asset without opening the real picker), which
# would let a future flow complete the presign -> PUT -> confirm sequence on-device. Until then, the
# picker-launch tap + the resulting upload sequence are covered by `RecipePhotoUploader.native.test.tsx`
# (mocked picker + mocked mutations) and by the web Playwright spec (`recipePhotos.spec.ts`, a real
# `<input type="file">` — Playwright CAN drive that, unlike Maestro + native OS chrome); together those ARE
# this story's upload-path integration coverage. This flow covers what IS deterministically drivable
# on-device: the surface renders, and its accessible controls are present.
#
# REMOVE — also not covered here. `recipe-service`'s seed data seeds no recipe with an existing photo (see
# `packages/services/recipe-service/src/database/seed.ts`), so there is nothing to remove; removal needs no
# picker, so the moment a seeded recipe carries at least one photo this flow should gain a
# `tapOn: 'Actions for photo 1, the cover'` + `tapOn: 'Remove'` + `assertNotVisible` step (2026-10-17: every photo
# action, Set as cover, Move earlier, Move later and Replace too, lives in that tile's ⋯ menu).
#
# CLIENT-SIDE PRE-VALIDATION (REQ-011 5 MB size cap, REQ-012 MIME allowlist) — also not expressible here,
# for the SAME reason as the picker/upload path above: there is no scripted way to hand the (real, OS-level)
# picker an oversized or wrong-type fixture, so there is nothing new this flow could assertably drive. The
# guard itself (rejection + the localized per-file error + presign never firing) is covered by
# `RecipePhotoUploader.native.test.tsx` (mocked picker, an oversized/GIF asset) and the pure
# `photoValidation.test.ts` unit tests; the web Playwright spec (`recipePhotos.spec.ts`) is this story's
# on-device-equivalent integration coverage, since Playwright CAN drive a real file input unlike Maestro +
# native OS chrome.
- runFlow: ../auth/signin.yaml

- assertVisible: 'Recipes'

# The seed is guaranteed present (the CI loop reseeds before every flow); scroll to the recipe rather than a
# `when: visible` guard that would silently SKIP if it were below the fold.
- runFlow:
      file: common/scrollIntoTapView.yaml
      env:
          TARGET: '${E2E_RECIPE_LAMB}'
          DIRECTION: DOWN
          TIMEOUT: 20000
- tapOn: '${E2E_RECIPE_LAMB}'
# RecipeDetailScreen: the owner's edit entry point sits in the detail's TITLE BAND, beside the recipe name
# (it used to sit at the foot of the detail); the band is below the hero, so it may still need a scroll.
- runFlow:
      file: common/scrollIntoTapView.yaml
      env:
          TARGET: 'Edit recipe'
          DIRECTION: DOWN
          TIMEOUT: 20000
- tapOn: 'Edit recipe'

# REWRITTEN for slice 7: the one-page editor. Its × ('Close editor') is the header's deliberate exit and the entry
# checkpoint; the editor's own control, so unlike a bare `Back` it cannot be satisfied by Android's system bar, which
# publishes a node named exactly `Back` under three-button navigation (`com.android.systemui:id/back`).
- assertVisible: 'Close editor'
# The pinned action bar is on screen from the top of the page: Preview, and the published lamb's `Save changes`.
- assertVisible: 'Preview'
- assertVisible: 'Save changes'

# ⛔ THE PHOTO MANAGER IS THE LAST SECTION ("Photos & publish"), on the same page as everything else, so the flow
# reaches it by scrolling — no step to walk to. It renders only for a stored recipe (photos attach to a server id),
# which the seeded lamb is.
#
# Anchored on "Add photos" — the LAST element of the manager block — not on "Photos": the section index names the
# section too, so a scroll anchored there could settle without ever moving (the same wrong-anchor trap `rating.yaml`
# fell into). Reaching "Add photos" puts the whole manager, empty state included, on screen.
# ⚠️ 60 s, not 20: the one-page editor puts Photos below every step, and at speed 40 the lamb's four steps outlast 20 s
# on the swiftshader AVD (measured 2026-10-09: two runs stopped at Step 4). Through the shared step, not a bare scroll:
# a bare scroll stops with "Add photos" at the bottom edge, under the pinned action bar, and iOS still calls it visible
# there, so the tap below opened Preview instead (full local iOS run, 2026-10-19).
- runFlow:
      file: common/scrollIntoTapView.yaml
      env:
          TARGET: 'Add photos'
          DIRECTION: DOWN
          TIMEOUT: 60000
# A-010 (buildSpec §7.7): the empty state previews the recipe's own cover and says what happens.
# ⚠️ Maestro reads the text as a REGEX, so the question mark is escaped: unescaped, `photo?` makes the "o" optional and
# the literal "?" on screen would not match.
- assertVisible: 'No photo\? This cover is used instead. Add one any time.'
- assertVisible: 'Add photos'

# A-010: Add photos is a secondary button that opens a sheet with the two sources. The sheet is ours, so it can be
# read and closed without touching OS chrome; the choices are asserted, never tapped.
- tapOn: 'Add photos'
- assertVisible: 'Take photo'
- assertVisible: 'Choose from library'
- tapOn: 'Close add photos'
- assertNotVisible: 'Take photo'
- assertVisible: 'Add photos'
