appId: ${APP_ID}
---
# Photos on a NEW recipe (owner ruling U33, staff-ux SPECIFY 2026-11-10). The one-page editor used to draw its photo
# section only once the recipe existed on the server, so a new recipe had no way to add a photo. The section is now
# there from the first render, and a pick waits in the upload queue until the recipe has an id. Mobile counterpart of
# the "recipe photos on a NEW recipe (U33)" block in the web Playwright spec `recipePhotos.spec.ts`.
#
# The upload itself is not driven here: a local run presigns photo URLs on `localstack:4566`, which no device resolves,
# so a picked photo can never finish uploading on the local stack. The upload against the minted id and the held
# Publish are covered by `RecipePhotoUploader.native.test.tsx`, `RecipeEditorScreen.native.test.tsx`, the features
# integration test `editorPhotos.integration.test.tsx`, and the web Playwright spec. This flow covers what a device
# shows before an upload: the section and its controls on a new recipe, × leaving at once when no photo is at risk, and
# the leave ask that Back (Android) and the edge swipe (iOS) reach through the navigator while a photo waits for a title.
- addMedia:
      - common/samplePhoto.jpg
- runFlow: ../auth/signin.yaml

- assertVisible: 'My recipes'
- tapOn: 'New recipe'
- assertVisible: 'Close editor'
- assertVisible: 'Title'

# Photos & publish is the last section. Anchored on "Add photos", the manager's last element, through the shared step so
# it does not stop under the pinned action bar (`photos.yaml` records both traps).
- runFlow:
      file: common/scrollIntoTapView.yaml
      env:
          TARGET: 'Add photos'
          DIRECTION: DOWN
          TIMEOUT: 60000
# Maestro reads the text as a regex, so the question mark is escaped.
- assertVisible: 'No photo\? This cover is used instead. Add one any time.'

# The sheet is ours, so it can be read and closed; its choices hand over to OS chrome and are never tapped.
- tapOn: 'Add photos'
- assertVisible: 'Take photo'
- assertVisible: 'Choose from library'
- tapOn: 'Close add photos'
- assertNotVisible: 'Take photo'

# No photo was picked, so nothing is at risk: × leaves at once, with no ask.
- tapOn: 'Close editor'
- assertNotVisible: 'Leave without your photos\?'
- assertVisible: 'My recipes'

# A photo picked before the recipe has a title waits in the queue, so leaving would lose it. Back (Android) and the
# edge swipe (iOS) reach the route guard, which asks first; Stay keeps the editor and the photo, and Leave goes.
# The picker is OS chrome, but its newest photo is the one `addMedia` put there, so it can be tapped.
- tapOn: 'New recipe'
- runFlow:
      file: common/scrollIntoTapView.yaml
      env:
          TARGET: 'Add photos'
          DIRECTION: DOWN
          TIMEOUT: 60000
- tapOn: 'Add photos'
- tapOn: 'Choose from library'
- runFlow: common/pickNewestPhoto.yaml
- extendedWaitUntil:
      visible: 'Waiting to upload'
      timeout: 30000
- runFlow: common/leaveByGesture.yaml
- extendedWaitUntil:
      visible: 'Leave without your photos\?'
      timeout: 15000
- tapOn: 'Stay'
- assertNotVisible: 'Leave without your photos\?'
- assertVisible: 'Waiting to upload'
- assertVisible: 'Close editor'
- runFlow: common/leaveByGesture.yaml
- extendedWaitUntil:
      visible: 'Leave without your photos\?'
      timeout: 15000
- tapOn: 'Leave without photos'
- extendedWaitUntil:
      visible: 'New recipe'
      timeout: 15000
- assertNotVisible: 'Close editor'
