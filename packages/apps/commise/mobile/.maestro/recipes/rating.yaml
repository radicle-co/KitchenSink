appId: io.commise.mobile
---
# Interactive rating happy path (FR-013, scenarios 6/7/10) — the mobile mirror of the web Playwright
# `recipeRating.spec.ts`. Signs in, opens a PUBLIC recipe the caller does NOT own (so the own-recipe gate,
# Sc8, is NOT engaged and the rate input is offered), submits a rating, and removes it.
#
# WHY THIS FLOW ASSERTS THE CONTROL'S STATE MACHINE (and rate→remove) RATHER THAN AN EXACT AGGREGATE — read
# before "fixing" it:
#
#   Against the shared live seed we do not know Herb Risotto's baseline average/count, so an exact
#   "Rated X out of 5, N ratings" assertion would be brittle (the web spec asserts it because IT controls the
#   seed via route mocks). So — like visibility.yaml — this asserts the machine-checkable control semantics:
#   the rate radiogroup is offered (proving the recipe is rateable, not own-recipe), tapping a star reports
#   the selection through the radio's CHECKED state, and rating reveals the remove affordance (Sc10). Unlike
#   the irreversible free-tier visibility flip, a rating is per-user AND removable, so this flow RATES then
#   REMOVES — restoring the caller's contribution to zero and leaving the shared aggregate net-unchanged for
#   the next run. The exact recomputed aggregate (Sc6/Sc7) is verified end-to-end by the web spec.
#
# Uses "Herb Risotto" (the seeded public recipe owned by a DIFFERENT author that discover-clone.yaml relies
# on) — reached via the Discover tab, since the caller's own library never contains a recipe they can rate.
- runFlow: ../auth/signin.yaml

- assertVisible: 'Recipes'
- tapOn: 'Discover'
- assertVisible: 'Discover recipes'

- runFlow:
      when:
          visible: 'Herb Risotto'
      commands:
          # Open the detail. Anchored (`^…$`) so it selects the row's title, NOT the per-row
          # "Clone Herb Risotto" quick-clone button whose label also contains the title.
          #
          # `above: 'New'` disambiguates WHICH rail's card is tapped, and it is load-bearing. Since U7,
          # Discover renders curated rails and the same seeded recipe appears in BOTH "Trending" and "New";
          # `^Herb Risotto$` therefore matches two elements. Maestro picked the "New" rail's card, which on the
          # emulator straddles the screen edge underneath the system navigation bar — so the tap landed on the
          # nav bar instead of the card, the detail never opened, and the following `scrollUntilVisible`
          # swipe-ups (swipe-up-from-centre being Android's Home gesture) backgrounded the app to the launcher.
          # Anchoring above the "New" heading selects the fully-visible Trending card.
          - tapOn:
                text: '^Herb Risotto$'
                above: 'New'

          # The community aggregate (read-only social proof) and the rate call-to-action render. The presence
          # of the rate radiogroup proves the recipe is RATEABLE — the own-recipe gate (Sc8) would replace it
          # with "You can’t rate your own recipe." instead.
          #
          # Scroll to the STAR CONTROL, not to the "Community rating" heading above it. The heading sits high
          # enough in the rating block to already be on screen when the detail opens, so `scrollUntilVisible`
          # settled on try 0 without scrolling at all — leaving the star radiogroup ~150px below the fold,
          # behind the system navigation bar, and the very next assertion failed on an element that was merely
          # unscrolled-to. The detail is a `ScrollView` with 120dp of bottom padding, so the stars DO come into
          # view; the flow just has to ask for them. Anchor the scroll on the thing about to be tapped.
          - scrollUntilVisible:
                element: 'Rate 4 stars'
                direction: DOWN
                timeout: 20000
          - assertVisible: 'Community rating'
          - assertVisible: 'Rate this recipe'
          - assertVisible: 'Rate 4 stars'

          # Rate 4 stars — the selection registers through the radio's CHECKED state (not colour alone).
          # Falsifiable: wiring the wrong value or dropping the checked semantics fails this assertion.
          - tapOn: 'Rate 4 stars'
          - assertVisible:
                text: 'Rate 4 stars'
                checked: true

          # Sc10 — rating reveals the remove affordance; removing it succeeds and withdraws the affordance,
          # restoring the caller's contribution to zero (leaving the shared seed net-unchanged).
          # ⚠️ SCROLLED to, not merely asserted. Rating the recipe CHANGES THE LAYOUT ABOVE this control:
          # the community aggregate goes from the one-line "Not yet rated" to a star row, so everything
          # below it shifts down by roughly that difference. The scroll above stopped as soon as
          # `Rate 4 stars` was visible — i.e. near the bottom of the viewport — so the newly revealed
          # `Remove my rating` lands just off-screen and a bare `assertVisible` passes or fails on where
          # the scroll increments happened to stop. It is still an assertion that the control APPEARS;
          # `scrollUntilVisible` fails if it does not exist.
          - scrollUntilVisible:
                element: 'Remove my rating'
                direction: DOWN
                timeout: 20000
          - tapOn: 'Remove my rating'
          - assertNotVisible: 'Remove my rating'
