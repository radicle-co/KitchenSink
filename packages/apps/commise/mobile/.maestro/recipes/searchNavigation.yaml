appId: io.commise.mobile
---
# Search + navigation (US1/US2, T114). The existing flows only assert the search box is VISIBLE; nothing ever
# typed a query, so filtering was never tested. This flow types real queries and asserts the RESULT SET
# CHANGED, and walks the three top-level tabs.
#
# It covers BOTH search surfaces, which are different mechanisms and fail for different reasons:
#   - "My recipes"  -> CLIENT-side filter over the loaded page (RecipeListScreen's `useMemo`), instant.
#   - "Discover"    -> SERVER-side search (`useSearchRecipes`, a `query` param per keystroke), needs a wait.
#
# Also covers the FR-006 gap #3 ingredient filter (typeahead pick -> chip -> removable), read-only via the
# seeded catalog ingredient "Flour" (no seed or flow-created recipe is ever attached to it). ⚠️ That is an
# INVARIANT the seed fixture now maintains deliberately, not a happy accident: the five seed recipes DO carry
# real ingredient lines, and Flour/Sugar/Butter are held back as pure catalog rows precisely so the
# "No matching recipes" assertion below stays a real one. `src/database/__tests__/seed.test.ts` fails if any
# of the three is ever attached to a recipe.
#
# Read-only: it types and clears text but mutates nothing, so it is order-independent. It anchors on
# "Asparagus with Green Sauce" and "Herb Risotto" — the two seed rows no other flow renames or deletes.
- runFlow: ../auth/signin.yaml

# --- Navigation: the recipes list is the initial destination -------------------------------------------
- assertVisible: 'Recipes'
- assertVisible: 'New recipe'

# --- Client-side search over "My recipes" ---------------------------------------------------------------
# Baseline: the full seeded set is listed. The seed cards render a full-width 4:3 cover, so only ~1 fits the
# viewport — asserting each row is VISIBLE would need scrolling and still can't put two on screen at once.
# The COUNT label ("3 recipes"), rendered in the list header above the cards, is the fold-independent proof
# the list loaded fully; the 3→1 transition after filtering is then the falsifiable core (a no-op filter
# leaves it at "3 recipes" and fails). Anchored (`^…$`) because Maestro matches substrings.
- extendedWaitUntil:
      visible:
          text: '^3 recipes$'
      timeout: 40000

# Type a query that matches exactly ONE recipe.
- tapOn: 'Search your recipes'
- inputText: 'Asparagus'

# The result set really narrowed to one row: the match is present and the count label now reads "1 recipe".
# The non-match ("Lamb") is GONE from the DOM (assertNotVisible holds regardless of scroll position). The
# count 3→1 is the falsifiable core — if the filter were a no-op the count would stay "3 recipes".
- assertVisible: '${E2E_RECIPE_ASPARAGUS}'
- assertNotVisible: '${E2E_RECIPE_LAMB}'
- assertVisible:
      text: '^1 recipe$'

# A query matching NOTHING collapses to the NO-MATCH state — proves the filter is applied, not merely
# reordered. "No recipes match" (not the empty library's "Your recipe box is empty"): the caller HAS recipes, the
# search just excluded them all. Asserting the empty-vs-no-match distinction guards the copy-bug regression.
- tapOn: 'Search your recipes'
- eraseText
- inputText: 'zzzznosuchrecipe'
- assertVisible: 'No recipes match'
- assertNotVisible: 'Your recipe box is empty'

# Clearing the query restores the full set — the count returns to "3 recipes", proving filtering is derived
# from the query and never destroys the underlying cache.
- tapOn: 'Search your recipes'
- eraseText
- extendedWaitUntil:
      visible:
          text: '^3 recipes$'
      timeout: 20000

# --- Navigation: cross to Discover, and search it server-side -------------------------------------------
- tapOn: 'Discover'
- extendedWaitUntil:
      visible: 'Discover'
      timeout: 40000

# With no query/filter, discovery shows the curated browse rails (U7), not a bare stream — the rail headings
# render regardless of what the feed contains, so this is seed-drift-immune.
#
# `Quick` is the THIRD rail and lands below the fold on a phone viewport (see the same note in
# `discoverBrowse.yaml`), so it is scrolled into view instead of asserted blind — `assertVisible` only sees
# the current viewport. Then scroll back up, since the steps that follow drive the search field.
- assertVisible: 'Trending'
- scrollUntilVisible:
      element: 'New'
      direction: DOWN
      timeout: 20000
- scrollUntilVisible:
      element: 'Quick'
      direction: DOWN
      timeout: 20000
- scrollUntilVisible:
      element: 'Discover'
      direction: UP
      timeout: 20000

# A query the server cannot match must yield discovery's empty state. This is the strongest assertion
# available here that the query REACHES the service: if `query` were dropped from the request the endpoint
# would return the full public feed and this would fail. It is also immune to seed drift (it does not care
# which public rows exist), unlike an exact-count assertion — discoverDetailSaveCopy.yaml clones "Herb Risotto" and
# delete.yaml removes the other public seed row, so the public feed's size is not stable across a suite run.
- tapOn: 'Search recipes'
- inputText: 'zzzznosuchrecipe'
# Slice 5 (`buildSpec.md` §4.6): a search that finds nothing NAMES the term; the browse-empty copy is a different state.
- extendedWaitUntil:
      visible: 'No recipes for .zzzznosuchrecipe.'
      timeout: 40000
- assertNotVisible: 'No public recipes yet.'

# A query that DOES match returns the seeded public recipe — the positive half of the same contract.
- tapOn: 'Search recipes'
- eraseText
- inputText: 'Risotto'
- extendedWaitUntil:
      visible: '${E2E_RECIPE_RISOTTO}'
      timeout: 40000

# --- W4/S3 sort controls -------------------------------------------------------------------------------
# The sort control is a "Sort: {choice}" button once a search is active; it opens a sheet of four radios (Relevance /
# Newest / Most saved / Quickest). Choosing one re-runs the visibility-scoped search; a smoke that the control renders and
# accepts a change.
- assertVisible: 'Sort: Relevance'
- tapOn: 'Sort: Relevance'
- assertVisible: 'Quickest'
- tapOn: 'Quickest'
- extendedWaitUntil:
      visible: '${E2E_RECIPE_RISOTTO}'
      timeout: 40000

# --- FR-006 filter bar (now a "Filters" bottom sheet, U7) ----------------------------------------------
# The ~7 facet groups moved behind a "Filters" button + bottom sheet. The Prep-time, Cook-time (REQ-030f), and
# Total-time bucket ladders are always present inside it (bounds, not facet value lists) — the first "Under 60
# min" is the Prep ladder (W4/S2 orders Dietary · Cuisine · Tags · Prep · Cook · Total).
#
# ⛔ THE "Risotto" TERM STAYS IN THE FIELD for every filter assertion below. This block used to clear it first
# and look for Herb Risotto in the WHOLE filtered public feed. That feed is the preview's, not this run's. In run
# 34863424203 it held 20 matches under "Under 60 min", led by repeated `Cross-service linkage proof` rows other
# suites had left behind. With the sort still on Quickest, 35-minute Risotto sat below all of them and a
# 20-second scroll never reached it. With the term kept, each assertion still tests the filter itself: a dropped
# prep bound, cook bound or ingredient id would still show Risotto, or still hide it. The result set is then
# this run's recipe alone, however many public rows the sandbox has built up. The leftovers are reported as an
# environment problem, not absorbed here.
- tapOn: 'Filters.*'
- extendedWaitUntil:
      visible: 'Under 60 min'
      timeout: 40000
# Herb Risotto is 35 min total (and ≤ 60 prep), so selecting a 60-minute bound must keep it — a filter that
# wrongly dropped a matching recipe fails here. Close the sheet, then scroll the result grid to the card.
- tapOn: 'Under 60 min'
- tapOn: 'Show \d+ recipes?|Show recipes'
- scrollUntilVisible:
      element: '${E2E_RECIPE_RISOTTO}'
      direction: DOWN
      timeout: 20000
# Reopen the sheet and press the SAME (now-active) bound again to clear it (the round trip proves it toggles).
- tapOn: 'Filters.*'
- tapOn: 'Any'
- tapOn: 'Show \d+ recipes?|Show recipes'

# --- Total-time bound ----------------------------------------------------------------------------------
# Total time is one CHOICE (Any / Under 15 / 30 / 60 min); Prep and Cook sit behind "More time filters" (slice 5,
# `buildSpec.md` §4.4). Herb Risotto's total time is 35 min (seed.ts), so an "Under 15 min" bound must exclude it — a
# filter that dropped maxTotalTime would keep rendering it and fail here. "Any" clears the bound again.
- tapOn: 'Filters.*'
- tapOn: 'Under 15 min'
- tapOn: 'Show \d+ recipes?|Show recipes'
- assertNotVisible: '${E2E_RECIPE_RISOTTO}'
- tapOn: 'Filters.*'
- tapOn: 'Any'
- tapOn: 'Show \d+ recipes?|Show recipes'
- extendedWaitUntil:
      visible: '${E2E_RECIPE_RISOTTO}'
      timeout: 40000

# --- FR-006 gap #3: ingredient filter typeahead -------------------------------------------------------
# "Flour" is a FOOD the signer authors (`e2e-seed provision`'s `ensureProbeFood`, as `E2E_PROBE_INGREDIENT`) that
# NO seeded recipe, and no recipe any other flow in this suite creates, is ever attached to: the filter keys on
# food ids (plan 002 R45), every seeded line is a declared name with none, and the food is private to the signer.
# So filtering by "Flour" is a real, suite-safe assertion: it can only clear the currently-visible public feed
# (Herb Risotto included) if `foodIds=<flour food id>` actually reached the API — a UI that dropped the filter
# would keep rendering it.
# The ingredient typeahead lives inside the "Filters" sheet.
#
# The typeahead RESULT is addressed as "Filter by Flour", never as the bare "Flour" — that bare string also
# matches the search field itself, which now holds the typed query, and the field is earlier in the hierarchy,
# so `tapOn: 'Flour'` selected the FIELD and the pick was silently dropped (round 5: the run landed back on
# browse with no count badge). Asserting the ACTION name is also the only real proof the catalog search
# returned a match — `assertVisible: 'Flour'` was satisfied by the field's own value whether it did or not.
#
# `scrollUntilVisible`, not a blind `extendedWaitUntil`: the Ingredients group is the LAST facet in the sheet's
# scroll list and the keyboard is up from the `inputText`, so the result row can land just below the visible
# region. Same idiom `create.yaml` uses for the picker's "Create …" affordance under the same conditions — it
# still waits for the row to EXIST, it just also brings it into view.
- tapOn: 'Filters.*'
- tapOn: 'Has ingredient'
- inputText: '${E2E_PROBE_INGREDIENT}'
- scrollUntilVisible:
      element: 'Filter by ${E2E_PROBE_INGREDIENT}'
      direction: DOWN
      timeout: 40000
- tapOn: 'Filter by ${E2E_PROBE_INGREDIENT}'
- tapOn: 'Show \d+ recipes?|Show recipes'
- extendedWaitUntil:
      visible: 'No recipes for .Risotto.* with these filters'
      timeout: 40000

# Reopen the sheet, confirm the chip, and remove it — clearing the filter restores the browse set.
- tapOn: 'Filters.*'
- assertVisible: 'Remove ${E2E_PROBE_INGREDIENT}'
- tapOn: 'Remove ${E2E_PROBE_INGREDIENT}'
- tapOn: 'Show \d+ recipes?|Show recipes'
- extendedWaitUntil:
      visible: '${E2E_RECIPE_RISOTTO}'
      timeout: 40000

# --- Navigation: back to the Recipes tab, through its two segments (slice 3: Collections is a segment of Recipes) --
- tapOn: 'Recipes'
- extendedWaitUntil:
      visible: 'My recipes'
      timeout: 40000
- tapOn: 'Collections'
- extendedWaitUntil:
      visible: 'New collection'
      timeout: 40000

- tapOn: 'My recipes'
- extendedWaitUntil:
      visible: 'New recipe'
      timeout: 40000
