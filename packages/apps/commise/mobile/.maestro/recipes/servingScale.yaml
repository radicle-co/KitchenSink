appId: ${APP_ID}
---
# Configurable serving size on the recipe detail (mobile mirror of the web Playwright
# `recipeSourceAndScale.spec.ts` — cross-platform mandate, CLAUDE.md §14).
#
# Runs against the seeded recipe API (EXPO_PUBLIC_RECIPE_API_URL) with an authenticated session. The anchor
# is the seed's "Asparagus with Green Sauce": 2 servings, 10 min prep, 10 min cook, 20 min total
# (`packages/services/recipe-service/src/database/seed.ts`).
#
# ⚠️ WHY THIS SEED AND NOT THE LAMB. Every number below has to stay distinguishable after scaling, or the
# flow cannot tell a correct render from a broken one. The lamb (15 prep / 30 cook) is useless here: doubled,
# its prep becomes 30 — the same string as its unchanged cook time — so "cook time was wrongly scaled" and
# "prep was correctly scaled" would look identical to Maestro. Doubling the asparagus gives 20 prep /
# 10 cook / 30 total, all distinct.
#
# ⚠️ This flow asserts the TIMINGS and the disclosure rather than scaled quantities. That was once a hard
# constraint (the seed carried no ingredient lines at all); it is now an OPPORTUNITY LEFT OPEN — the seed gives
# this recipe five real lines (`500 g` asparagus, `30 g` parsley, `1 tbsp` capers, `4 tbsp` olive oil, `1`
# lemon), so the doubled quantities ARE on screen and could be asserted here. Not added by the change that
# seeded them, because that change could not run Maestro and an unverified new assertion is how a flow starts
# failing for reasons unrelated to the code. The quantity half stays covered at the component tier and, on a
# populated recipe, by the web Playwright suite.
- runFlow: ../auth/signin.yaml

- assertVisible: 'Recipes'
- extendedWaitUntil:
      visible:
          text: '^3 recipes$'
      timeout: 40000

- runFlow:
      file: common/scrollIntoTapView.yaml
      env:
          TARGET: '${E2E_RECIPE_ASPARAGUS}'
          DIRECTION: DOWN
          TIMEOUT: 20000
- tapOn: '${E2E_RECIPE_ASPARAGUS}'
- scrollUntilVisible:
      element: 'Ingredients'
      direction: DOWN
      timeout: 20000
- scrollUntilVisible:
      element: '${E2E_RECIPE_ASPARAGUS}'
      direction: UP
      timeout: 20000

# Gap A, negative case: this seed recipe was user-created and has no source, so the provenance line must
# render NOTHING — not an empty "Source" row. (The positive case needs an imported recipe, which the seed
# does not contain; it is covered at the component tier and by the web Playwright suite.)
- assertNotVisible: 'Source'

# DEFAULT: the detail opens at the serving count the recipe was CREATED with (2), presenting nothing as
# adjusted. Asserted as a PAIR — the absent notice is what distinguishes "opened at the default" from
# "happens to show 2 after something scaled it". The stat strip (Total · Prep · Cook) sits at the top of the
# page; the serving stepper sits beside the Ingredients heading, with "for 2" (build spec §6.1).
- assertVisible: '20 min'
- scrollUntilVisible:
      element: 'More servings'
      direction: DOWN
      timeout: 20000
- assertVisible: 'for 2'
# ⛔ `.*` IS REQUIRED, not decoration. Maestro matches a text selector as a regex against the node's WHOLE
# text, and the note reads "Amounts scaled from 2 servings." (`recipeMessages.detail.scaledFrom`).
- assertNotVisible: 'Amounts scaled from 2 servings.*'

# Scale UP by two taps: 2 -> 4 servings.
- repeat:
      times: 2
      commands:
          - tapOn: 'More servings'

- assertVisible: 'for 4'
- assertVisible: 'Amounts scaled from 2 servings.*'
# The note's second sentence runs on under the tab bar, so it is scrolled into view rather than asserted where it is.
- scrollUntilVisible:
      element: 'Cook times and step timers are shown unchanged: cooking time does not scale with batch size. Check for doneness.'
      direction: DOWN
      timeout: 20000
# Hands-on prep DOUBLES (10 -> 20) and the total moves by exactly that delta (20 -> 30). The strip is above the
# stepper, so scroll back up to it.
- scrollUntilVisible:
      element: '30 min'
      direction: UP
      timeout: 20000
# ⛔ THE LOAD-BEARING ASSERTION: cook time is STILL 10 minutes. A "scale every timing" implementation renders
# 20 in the Cook cell, this string vanishes, and the flow goes red — which is the point, because telling a
# cook to cook a double batch for twice as long is a food-safety error, not a display preference.
- assertVisible: '10 min'

# Back to the author's yield with the note's own Reset: the note disappears and the stored total returns.
# Centred: the note sits under the tab bar otherwise, and on iOS a tap there reached the bar and left the count at 4
# (run 38988891871).
- scrollUntilVisible:
      element: 'Reset'
      direction: DOWN
      timeout: 20000
      centerElement: true
- tapOn: 'Reset'
- extendedWaitUntil:
      visible: 'for 2'
      timeout: 10000
- assertNotVisible: 'Amounts scaled from 2 servings.*'
- scrollUntilVisible:
      element: '20 min'
      direction: UP
      timeout: 20000
- scrollUntilVisible:
      element: '${E2E_RECIPE_ASPARAGUS}'
      direction: UP
      timeout: 20000
# ⛔ The title in view is NOT the top of the page: the Back disc rides on the hero photo ABOVE the title and scrolls away
# with it, so with the title at the top of the screen the disc is still off it (run 38996739152, `Back to My recipes` not
# found with the hero scrolled past). Scroll until the disc itself is on screen.
- runFlow:
      file: common/scrollIntoTapView.yaml
      env:
          TARGET: 'Back to My recipes'
          DIRECTION: UP
          TIMEOUT: 20000

# The detail's Back is a disc over the hero photo, named for where it goes ("Back to My recipes"), so it is UNIQUE: under
# three-button navigation Android's system bar publishes a node named exactly `Back`, and a Maestro selector matches the
# WHOLE string, so this one can never resolve to the OS button (the reason the old text row had to be anchored above the
# recipe title). It starts from the recipe list, so the parent is My recipes.
- tapOn: 'Back to My recipes'
- assertVisible: 'Recipes'
