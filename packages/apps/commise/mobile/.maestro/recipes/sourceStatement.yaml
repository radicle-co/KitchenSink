appId: ${APP_ID}
---
# A pasted recipe asks where it is from before it goes public (ADR-0092). Mobile mirror of the web Playwright
# `recipeSourceFromPaste.spec.ts` "asks where it is from" cases: Publish opens the source sheet and sends nothing, a book
# answer with no title shows the field error, and "I wrote this" then publishes the recipe public.
#
# What only a device proves: the sheet over the editor with the keyboard up, the radio answers reachable on a small phone,
# and the field error read at the field. The pure decisions are the component tests' subject on both platforms
# (`SourceStatementSheet.native.test.tsx`, `useRecipeEditor.test.tsx`). The signer is Pro (`visibility.yaml`). Every flow is
# reseeded before it runs.
- runFlow: ../auth/signin.yaml

- assertVisible: 'My recipes'
- tapOn: 'New recipe'
- assertVisible: 'Close editor'
- runFlow:
      file: common/typeTitle.yaml
      env:
          TITLE: 'Maestro Pasted Soup'
- runFlow: common/chooseCuisine.yaml
- runFlow: common/addTomatoAndStep.yaml

# Paste one more step, so the draft is a pasted one.
- runFlow:
      file: common/jumpToSection.yaml
      env:
          SECTION: 'Steps'
- tapOn: 'Paste steps'
- tapOn:
      text: 'Steps'
      below: 'Paste steps'
- inputText: 'Simmer the stock.'
- assertVisible: 'Add 1 step'
- tapOn: 'Add 1 step'
- extendedWaitUntil:
      notVisible: 'Add 1 step'
      timeout: 20000

# Publish asks first, and sends nothing.
- runFlow: common/closeEditorKeyboard.yaml
- runFlow:
      file: common/scrollIntoTapView.yaml
      env:
          TARGET: 'Publish'
          DIRECTION: DOWN
          TIMEOUT: 20000
- tapOn: 'Publish'
- extendedWaitUntil:
      visible: 'Where is this recipe from?'
      timeout: 20000
- assertVisible: 'I wrote this'
- assertVisible: 'From a web page'
- assertVisible: 'From a cookbook or magazine'
- assertVisible: 'From another person'
- assertVisible: 'Publish privately'

# A book answer with no title is refused at the field.
- tapOn: 'From a cookbook or magazine'
- tapOn:
      text: 'Publish'
      below: 'Where is this recipe from?'
- extendedWaitUntil:
      visible: 'Enter the title.'
      timeout: 10000
- assertVisible: 'Where is this recipe from?'

# "I wrote this" publishes it public.
- tapOn: 'I wrote this'
- tapOn:
      text: 'Publish'
      below: 'Where is this recipe from?'
      # Publishing moves the screen for seconds, and the notice below lasts 6 s (maestroTransientNoticeWait.test.ts).
      waitToSettleTimeoutMs: 1000
- extendedWaitUntil:
      visible: 'Recipe published.'
      timeout: 40000
- extendedWaitUntil:
      notVisible: 'Close editor'
      timeout: 60000
- extendedWaitUntil:
      visible:
          text: 'Maestro Pasted Soup.*'
      timeout: 40000
- extendedWaitUntil:
      visible:
          text: '^Public$'
      timeout: 40000
