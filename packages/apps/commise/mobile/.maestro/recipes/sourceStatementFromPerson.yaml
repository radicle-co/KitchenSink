appId: ${APP_ID}
---
# A cook answers "From another person" and the answer is locked (P7, owner ruling 2026-11-19, AE8). The sheet's last answer, the
# recipe goes out Private, then the reopened editor's Source row says the answer and why it cannot change, with no field and
# no Remove. Mobile mirror of the web Playwright case `recipeSourceFromPaste.spec.ts` "a recipe stored as "From another person"
# reopens with its Source locked". The pure decisions are the component tests' subject.
#
# What only a device proves: the sheet over the editor, and the locked row on a reopened editor. The signer is Pro
# (`visibility.yaml`). Reseeded before it runs.
- runFlow: ../auth/signin.yaml

- assertVisible: 'My recipes'
- tapOn: 'New recipe'
- assertVisible: 'Close editor'
- runFlow:
      file: common/typeTitle.yaml
      env:
          TITLE: 'Maestro Person Soup'
- runFlow: common/chooseCuisine.yaml
- runFlow: common/addTomatoAndStep.yaml

# Paste one more step, so the draft is a pasted one.
- runFlow:
      file: common/jumpToSection.yaml
      env:
          SECTION: 'Steps'
- tapOn: 'Paste steps'
- tapOn:
      text: 'Steps'
      below: 'Paste steps'
- inputText: 'Simmer the stock.'
- assertVisible: 'Add 1 step'
- tapOn: 'Add 1 step'
- extendedWaitUntil:
      notVisible: 'Add 1 step'
      timeout: 20000

# Publish asks first.
- runFlow: common/closeEditorKeyboard.yaml
- runFlow:
      file: common/scrollIntoTapView.yaml
      env:
          TARGET: 'Publish'
          DIRECTION: DOWN
          TIMEOUT: 20000
- tapOn: 'Publish'
- extendedWaitUntil:
      visible: 'Where is this recipe from?'
      timeout: 20000
- assertVisible: 'From another person'
- tapOn: 'From another person'
- runFlow:
      when:
          platform: Android
      commands:
          - assertVisible:
                text: 'From another person'
                checked: true
- runFlow:
      when:
          platform: iOS
      commands:
          - assertVisible:
                text: 'radio button, checked'
                below: 'From a cookbook or magazine'
- tapOn:
      text: 'Publish'
      below: 'Where is this recipe from?'
      waitToSettleTimeoutMs: 1000
- extendedWaitUntil:
      visible: 'Recipe published.'
      timeout: 40000
- extendedWaitUntil:
      notVisible: 'Close editor'
      timeout: 60000
- extendedWaitUntil:
      visible:
          text: 'Maestro Person Soup.*'
      timeout: 40000
- extendedWaitUntil:
      visible:
          text: '^Private$'
      timeout: 40000

# The reopened editor shows the Source locked: the answer, the reason, and no field and no Remove.
- runFlow:
      file: common/scrollIntoTapView.yaml
      env:
          TARGET: 'Edit recipe'
          DIRECTION: DOWN
          TIMEOUT: 20000
- tapOn: 'Edit recipe'
- assertVisible: 'Close editor'
- runFlow:
      file: common/jumpToSection.yaml
      env:
          SECTION: 'Photos & publish'
- scrollUntilVisible:
      element: 'The source of this recipe can’t be changed.'
      direction: DOWN
      centerElement: true
      timeout: 30000
- assertVisible: 'From another person'
- assertVisible: 'The source of this recipe can’t be changed.'
- assertNotVisible: 'Remove source'
- assertNotVisible: 'Copied this recipe from a web page.*'
