appId: io.commise.mobile
---
# ⛔ THE SYSTEM BACK BUTTON MUST NOT DESTROY UNSAVED WORK, ON ANY SURFACE THAT HOLDS SOME.
#
# REWRITTEN for slice 7 (legs 1-3). The recipe editor no longer GUARDS its work, it KEEPS it: ×, the system back key
# and the edge swipe all do the same thing and leave at once (build spec §3.5 — "the editor and the picker leave at
# once, because nothing is ever unsaved", §7.3). So the editor legs now prove the opposite of what they used to: Back
# raises NO dialog, a titled new recipe is created as a draft on the way out (the exit checkpoint, which the screen
# runs for a leave that is not ×), and a published recipe's edit stays on the device, offered back on the next open,
# without reaching the server (owner decision D1). The collection sheet's legs (5-6) still guard, and still prove the
# guard; the paste legs (7-8) prove Paste a list's sheet keeps its text, so Back closes it without asking.
#
# The original defect, kept as the record: `RecipesScreen`'s hardware-back handler called `nav.back()`
# unconditionally, so the wizard's header arrow asked before discarding and the phone's back button did not.
#
# ⛔ WHAT THIS COVERS THAT THE COMPONENT TESTS CANNOT. `react-native` is aliased to `react-native-web` under
# vitest, and that shim's `BackHandler` is an inert stub — a component test can only drive a FAKE dispatcher
# (`@commise/ui/testing/hardware-back`). Only a real device raises a real `KEYCODE_BACK` through React Navigation's
# `beforeRemove`, which is where the editor hears it. It is also the ONLY tier that can observe that an open RN
# `Modal` consumes back itself, on the dialog window, before any `BackHandler` subscription is reached.
#
# ⚠️ SELECTOR TRAP, AND IT HAS ALREADY COST A RED CI JOB. Maestro matches the WHOLE string, and under the
# three-button navigation the CI `ci_pixel6` AVD uses, Android's own navigation bar publishes a node whose
# accessible name is exactly `Back` — so `tapOn: 'Back'` can resolve to the SYSTEM bar (see `collectionsPull.yaml`,
# which carries the measured evidence). This flow NEVER taps a node named `Back`: it raises the system button with
# `pressKey: Back`, a key event that resolves to no node at all — and that is also precisely the input under test.
#
# ⚠️ ONE `pressKey: Back` IS NOT ENOUGH WITH A SOFT KEYBOARD UP. The CI AVD runs `hw.keyboard=no`, so a field just
# typed into holds the soft keyboard, and Android hands the first BACK to the IME (run 37268858758). The editor legs
# press once, let the screen settle, and press again only while the editor is still showing.
#
# ⚠️ IT LEAVES THE LIBRARY AS FOUND. Leg 1's draft is discarded through the recipe's own editor, and leg 3's device
# changes are discarded from the resume notice, so the seed is untouched.
- runFlow: ../auth/signin.yaml

- assertVisible: 'Recipes'

# ── LEG 1: the CREATE editor, titled. Back leaves at once, and the recipe is kept as a draft. ──
- tapOn: 'New recipe'
- assertVisible: 'Close editor'

- tapOn: 'Title'
- inputText: 'System Back Guard Draft'
# ⛔ NO `hideKeyboard`: on Android it is itself a BACK event, which would leave the editor before the press under test.
# THE PRESS UNDER TEST: the first may only close the keyboard, so a second follows while the editor still shows.
- pressKey: Back
- waitForAnimationToEnd:
      timeout: 2000
- runFlow:
      when:
          visible: 'Close editor'
      commands:
          - pressKey: Back
# No dialog, and the editor is gone: Back did what × does.
- assertNotVisible: 'Discard this draft?'
- assertNotVisible: 'Close editor'
- assertVisible: 'Recipes'
# ⛔ KEPT, not lost: the exit checkpoint created the titled draft, and My recipes shows it. Against an editor that
# skipped the checkpoint on a system Back, this wait goes red (the native new-recipe screen always opens blank, so
# a draft never sent would be unrecoverable).
# Sorted by recently edited, the new draft is the FIRST card, above where the list kept its scroll: so UP.
- scrollUntilVisible:
      element:
          text: 'System Back Guard Draft.*'
      direction: UP
      timeout: 40000

# Leave the library as found: open the draft and discard it through the editor's own header menu.
- tapOn:
      text: 'System Back Guard Draft.*'
- scrollUntilVisible:
      element: 'Edit recipe'
      direction: DOWN
      timeout: 20000
- tapOn: 'Edit recipe'
- assertVisible: 'Close editor'
- runFlow: common/discardDraft.yaml
- assertVisible: 'Recipes'

# ── LEG 2: an UNTOUCHED new recipe leaves on one press and creates nothing. ──
- tapOn: 'New recipe'
- assertVisible: 'Close editor'

- pressKey: Back
- assertNotVisible: 'Close editor'
- assertVisible: 'Recipes'

# ── LEG 3: the EDIT editor on the PUBLISHED lamb. Back leaves at once; the edit stays on the device (D1). ──
- scrollUntilVisible:
      element: '${E2E_RECIPE_LAMB}'
      direction: DOWN
      timeout: 20000
- tapOn: '${E2E_RECIPE_LAMB}'
- scrollUntilVisible:
      element: 'Edit recipe'
      direction: DOWN
      timeout: 20000
- tapOn: 'Edit recipe'
- assertVisible: 'Close editor'

- runFlow: common/clearTitle.yaml
- inputText: 'System Back Guard Edit'

# ⛔ NO `hideKeyboard` — see leg 1.
- pressKey: Back
- waitForAnimationToEnd:
      timeout: 2000
- runFlow:
      when:
          visible: 'Close editor'
      commands:
          - pressKey: Back

# Back on the DETAIL (one pop), carrying its original title: a published recipe's changes reach the server only at
# Save changes, so a leave never published them.
- assertNotVisible: 'Discard your changes?'
- extendedWaitUntil:
      visible: '${E2E_RECIPE_LAMB}'
      timeout: 20000
- assertNotVisible: 'System Back Guard Edit'

# ⛔ AND NOT LOST: the next open offers them back (the resume notice), and Discard there drops them, leaving the seed
# as found. Against an editor that dropped the device draft on Back, the notice never appears.
- scrollUntilVisible:
      element: 'Edit recipe'
      direction: DOWN
      timeout: 20000
- tapOn: 'Edit recipe'
- extendedWaitUntil:
      visible:
          text: 'You have changes from .* that aren.t saved to your recipe\.'
      timeout: 20000
- tapOn: 'Discard'
# The notice's Discard asks first; its confirm drops the device changes.
- assertVisible: 'Discard your changes\?'
- tapOn:
      text: 'Discard'
      below: 'Discard your changes\?'
# Discarding a published recipe's changes returns to the recipe, as it was: the edit never reached the server.
- extendedWaitUntil:
      visible: 'Edit recipe'
      timeout: 20000
- assertNotVisible: 'Close editor'
- assertNotVisible:
      text: 'System Back Guard Edit.*'

# ── LEG 4: a pushed surface with nothing to lose still pops, and the guard did not break ordinary back. ──
- pressKey: Back
- assertVisible: 'Recipes'

# ── LEG 5: the NEW-COLLECTION SHEET, dirty (slice 4 replaced the form screen with a sheet). The typed name lives only
# in the sheet's own state; Back asks before discarding it, in the sheet's own words. ──
- tapOn: 'Collections'
- extendedWaitUntil:
      visible: 'New collection'
      timeout: 40000
- tapOn: 'New collection'
- assertVisible: 'Description \(optional\)'
- tapOn: 'Name'
- inputText: 'System Back Guard Collection'

- hideKeyboard
- pressKey: Back
- assertVisible: 'Discard this collection\?'
- tapOn: 'Keep editing'
- assertNotVisible: 'Discard this collection\?'
# The NAME, not just the sheet: a guard that closed the dialog and cleared the field would pass on the sheet alone.
- assertVisible: 'System Back Guard Collection'

- pressKey: Back
- assertVisible: 'Discard this collection\?'
- tapOn: 'Discard'
- assertNotVisible: 'Description \(optional\)'

# ── LEG 6: an UNTOUCHED sheet must not nag, and must still close on one press. ──
- tapOn: 'New collection'
- assertVisible: 'Description \(optional\)'
- pressKey: Back
- assertNotVisible: 'Discard this collection\?'
- assertNotVisible: 'Description \(optional\)'

# ── LEG 7: PASTE A LIST, typed into. REWRITTEN (2026-10-09): the paste SCREEN retired with slice 8, and paste is a sheet
# in the editor's Ingredients section now. The sheet keeps what was typed when it closes, so Back has nothing to guard:
# it closes the sheet at once, with no dialog, and the text is there when the sheet opens again. ──
- tapOn: 'My recipes'
- assertVisible: 'Recipes'
- tapOn: 'New recipe'
- assertVisible: 'Close editor'
- tapOn:
      text: 'Sections\. Current: .*'
- extendedWaitUntil:
      visible: 'Close sections'
      timeout: 20000
- tapOn: 'Ingredients'
- extendedWaitUntil:
      visible: 'Paste a list'
      timeout: 20000
- tapOn: 'Paste a list'
- assertVisible: 'Ingredient lines'
- tapOn: 'Ingredient lines'
- inputText: '2 cups flour'

# ⛔ NO `hideKeyboard` — see leg 1. The first press may only close the keyboard, so a second follows while the sheet shows.
- pressKey: Back
- waitForAnimationToEnd:
      timeout: 2000
- runFlow:
      when:
          visible: 'Ingredient lines'
      commands:
          - pressKey: Back
- assertNotVisible: 'Discard unsaved changes?'
- assertNotVisible: 'Ingredient lines'
# Back closed the SHEET, one level: the editor is still open beneath it.
- assertVisible: 'Close editor'

# ⛔ AND NOT LOST: the sheet opens again on what was typed.
- tapOn: 'Paste a list'
- assertVisible: '2 cups flour'

# ── LEG 8: closing the sheet, then leaving the untitled editor: nothing was titled, so it leaves and creates nothing. ──
- pressKey: Back
- waitForAnimationToEnd:
      timeout: 2000
- runFlow:
      when:
          visible: 'Ingredient lines'
      commands:
          - pressKey: Back
- assertNotVisible: 'Ingredient lines'
- pressKey: Back
- assertNotVisible: 'Close editor'
- assertVisible: 'Recipes'

# ── LEG 9: Back at the Recipes ROOT goes Home; it no longer leaves the app (M1). ──
# `docs/design/uiOverhaul/evaluateShellAndLists.md` M1: Recipes declined a back press at its root, so the OS took
# it and left the app. The app root now answers it. Leg 8 left the editor, so this is the list root.
- assertVisible: 'My recipes'
- pressKey: Back
- assertNotVisible: 'My recipes'
- scrollUntilVisible:
      element: 'See all recipes'
      direction: DOWN
      timeout: 20000
