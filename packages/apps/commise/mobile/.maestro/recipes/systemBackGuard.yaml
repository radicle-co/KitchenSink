appId: io.commise.mobile
---
# ⛔ THE SYSTEM BACK BUTTON MUST NOT DESTROY UNSAVED WORK, ON ANY SURFACE THAT HOLDS SOME.
#
# The defect: `RecipesScreen`'s hardware-back handler called `nav.back()` unconditionally, so the wizard's own
# header arrow asked before discarding and the phone's back button did not. Reproduced with
# `adb shell input keyevent KEYCODE_BACK` from a dirty step-4 draft: straight to the detail screen, edits gone,
# no dialog. It hit CREATE as well as EDIT.
#
# ⛔ WHAT THIS COVERS THAT THE COMPONENT TESTS CANNOT. `react-native` is aliased to `react-native-web` under
# vitest, and that shim's `BackHandler` is an inert stub — a component test can only drive a FAKE dispatcher
# (`@commise/ui/testing/hardware-back`). Only a real device raises a real `KEYCODE_BACK` through React Native's
# own handler chain. It is also the ONLY tier that can observe the second half of the layering: an open RN
# `Modal` consumes back itself, on the dialog window, before any `BackHandler` subscription is reached.
#
# ⚠️ SELECTOR TRAP, AND IT HAS ALREADY COST A RED CI JOB. Maestro matches the WHOLE string, and under the
# three-button navigation the CI `ci_pixel6` AVD uses, Android's own navigation bar publishes a node whose
# accessible name is exactly `Back` — so `tapOn: 'Back'` can resolve to the SYSTEM bar instead of the wizard's
# header arrow (see `collectionsPull.yaml`, which carries the measured evidence).
#
# This flow sidesteps that entirely: it NEVER taps a node named `Back`. It raises the system button with
# `pressKey: Back`, a key event that resolves to no node at all — and that is also precisely the input under
# test. Every other selector here is a screen-owned string. If a leg ever does need the header arrow, anchor it
# (`below: 'Step 1 of 4'`); do not add a bare `tapOn: 'Back'`.
#
# ⚠️ IT MUTATES NOTHING. Every leg ends by discarding or by leaving a clean surface, so nothing is created and
# the seeded library is left exactly as found. That is why it can sit next to the read-only create-wizard flows.
- runFlow: ../auth/signin.yaml

- assertVisible: 'Recipes'

# ── LEG 1: the CREATE wizard, dirty. A whole recipe typed from scratch is the larger of the two losses. ──
- tapOn: 'New recipe'
- tapOn: 'Create from Scratch'
- assertVisible: 'Step 1 of 4'

- tapOn: 'Title'
- inputText: 'System Back Guard Draft'
# ⛔ NO `hideKeyboard` HERE: on Android it is itself a BACK event, so with no keyboard up it raises the dialog and the
# press below then DISMISSES it (every dialog here maps platform dismissal to cancel via `ConfirmDialog.native.tsx`'s
# `onRequestClose`).
#
# ⚠️ BUT ONE `pressKey: Back` IS NOT ENOUGH ON CI, and an earlier version of this comment claimed it was. The CI AVD runs
# `hw.keyboard=no`, so the field just typed into still holds the SOFT keyboard, and Android hands the first BACK to the
# IME to hide it (run 37268858758: this flow ended on the same wizard with the keyboard gone and no dialog).
# `common/raiseDiscardGuard.yaml` presses once, lets the screen settle, and presses again only if the dialog is still
# absent, which is right with or without a keyboard up.
#
# THE PRESS UNDER TEST. Against the defect this popped the wizard and the next assertion went red.
- runFlow: common/raiseDiscardGuard.yaml

# "Keep editing" must keep BOTH the wizard and what was typed into it — asserting only that the dialog closed
# would pass against a guard that discarded the draft behind it.
- tapOn: 'Keep editing'
- assertNotVisible: 'Discard unsaved changes?'
- assertVisible: 'Step 1 of 4'
- assertVisible: 'System Back Guard Draft'

# ⛔ A SECOND PRESS WHILE THE DIALOG IS OPEN DISMISSES THE DIALOG — it does not exit the wizard. RN's `Modal`
# catches the key on the dialog window and fires `onRequestClose`, which `ConfirmDialog` maps to cancel, so the
# press never reaches the back-interceptor chain at all. Leaving a dirty editor therefore takes two DELIBERATE
# acts, which is the more protective direction. Do NOT "fix" this flow by expecting back-back to exit.
- runFlow: common/raiseDiscardGuard.yaml
- pressKey: Back
- assertNotVisible: 'Discard unsaved changes?'
- assertVisible: 'Step 1 of 4'

# Only an explicit Discard leaves, and it lands on the list — one pop, not two (two would have left the
# recipes surface entirely and `Recipes` would not be visible).
- runFlow: common/raiseDiscardGuard.yaml
- tapOn: 'Discard changes'
- assertVisible: 'Recipes'

# ── LEG 2: a CLEAN wizard must not nag. A guard that always prompts is a nuisance, not a guard. ──
- tapOn: 'New recipe'
- tapOn: 'Create from Scratch'
- assertVisible: 'Step 1 of 4'

- pressKey: Back
- assertNotVisible: 'Discard unsaved changes?'
- assertVisible: 'Recipes'

# ── LEG 3: the EDIT wizard. Same guard, the path the original bug report walked. ──
- scrollUntilVisible:
      element: '${E2E_RECIPE_LAMB}'
      direction: DOWN
      timeout: 20000
- tapOn: '${E2E_RECIPE_LAMB}'
- scrollUntilVisible:
      element: 'Edit recipe'
      direction: DOWN
      timeout: 20000
- tapOn: 'Edit recipe'
- assertVisible: 'Step 1 of 4'

- runFlow: common/clearTitle.yaml
- inputText: 'System Back Guard Edit'

# ⛔ NO `hideKeyboard` — see the create leg above. It is a back EVENT, so it would raise the dialog and the
# press below would dismiss it, reddening this assertion against a working fix.
- runFlow: common/raiseDiscardGuard.yaml
- tapOn: 'Discard changes'

# Back on the DETAIL (one pop), carrying its original title — the edit really was discarded rather than saved.
- extendedWaitUntil:
      visible: '${E2E_RECIPE_LAMB}'
      timeout: 20000
- assertNotVisible: 'System Back Guard Edit'

# ── LEG 4: a pushed surface with nothing to lose still pops, and the guard did not break ordinary back. ──
- pressKey: Back
- assertVisible: 'Recipes'

# ── LEG 5: the COLLECTION form, dirty. The typed name lives only in that screen's own state. ──
- tapOn: 'Collections'
- extendedWaitUntil:
      visible: 'New collection'
      timeout: 40000
- tapOn: 'New collection'
- assertVisible: 'Collection name'
- tapOn: 'Collection name'
- inputText: 'System Back Guard Collection'

# ⛔ NO `hideKeyboard` — see the create leg above.
- runFlow: common/raiseDiscardGuard.yaml
- tapOn: 'Keep editing'
- assertNotVisible: 'Discard unsaved changes?'
# The NAME, not just the form: a guard that closed the dialog and cleared the field would pass on the form
# alone.
- assertVisible: 'System Back Guard Collection'

# ⛔ LEAVING IS ASSERTED ON THE FIELD, NOT ON 'New collection'. That string is BOTH the list's create CTA and
# this form's own title (see `collections.yaml`), so it is visible either way and proves nothing.
- runFlow: common/raiseDiscardGuard.yaml
- tapOn: 'Discard changes'
- assertNotVisible: 'Collection name'

# ── LEG 6: an UNTOUCHED collection form must not nag, and must still leave on one press. ──
- tapOn: 'New collection'
- assertVisible: 'Collection name'
- pressKey: Back
- assertNotVisible: 'Discard unsaved changes?'
- assertNotVisible: 'Collection name'

# ── LEG 7: the INGREDIENT PASTE screen. The largest loss of the three — a whole pasted list. ──
- tapOn: 'My recipes'
- assertVisible: 'Recipes'
- tapOn: 'New recipe'
- tapOn: 'Paste an Ingredient List'
- assertVisible: 'Paste your ingredients'
- tapOn: 'Ingredient lines'
- inputText: '2 cups flour'

# ⛔ NO `hideKeyboard` — see the create leg above.
- runFlow: common/raiseDiscardGuard.yaml
- tapOn: 'Keep editing'
- assertNotVisible: 'Discard unsaved changes?'
- assertVisible: '2 cups flour'

# ⛔ THE SCREEN'S OWN EXIT ROUTES THROUGH THE SAME GUARD. Its control is 'Back to recipes', never a bare
# 'Back', so it is safe to tap by name under three-button navigation — the trap this file's header records.
- tapOn: 'Back to recipes'
- assertVisible: 'Discard unsaved changes?'
- tapOn: 'Discard changes'
- assertVisible: 'Recipes'

# ── LEG 8: an EMPTY paste box has nothing to lose, and leaves on one press. ──
- tapOn: 'New recipe'
- tapOn: 'Paste an Ingredient List'
- assertVisible: 'Paste your ingredients'
- pressKey: Back
- assertNotVisible: 'Discard unsaved changes?'
- assertVisible: 'Recipes'

# ── LEG 9: Back at the Recipes ROOT goes Home; it no longer leaves the app (M1). ──
# `docs/design/uiOverhaul/evaluateShellAndLists.md` M1: Recipes declined a back press at its root, so the OS took
# it and left the app. The app root now answers it. The paste box above was left empty, so this is the list root.
- assertVisible: 'My recipes'
- pressKey: Back
- assertNotVisible: 'My recipes'
- scrollUntilVisible:
      element: 'See all recipes'
      direction: DOWN
      timeout: 20000
