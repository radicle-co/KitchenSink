appId: io.commise.mobile
---
# Recipe visibility toggle, PREMIUM path (US2, T113/T074/C-004). The clone half of T113 is covered by
# discoverClone.yaml; this closes the visibility half. Signs in, opens an OWNED private recipe, and drives a real
# Private -> Public -> Private round trip through the control's machine-checkable semantics.
#
# ⛔ WHY THIS NO LONGER ASSERTS THE FREE-TIER GATE, and why that is not a weakening. Read before "restoring" it.
#
#   This flow asserted that "Private" was DISABLED and showed "Upgrade to premium to make a recipe private."
#   That was true only while the Maestro signer was a free-tier account. It is not free now: the signer is the
#   Maestro pool's `signer` slot, declared `premium` (`packages/tools/e2e-fixtures/src/testPool.ts`,
#   `lane('signer', { premium: true, … })`). It has to be premium, because the seeded world this flow opens
#   contains PRIVATE recipes, which the recipe service refuses to create for a free-tier `user_created` owner
#   (`e2e-seed`'s `provision.ts`). Run 34863424203's hierarchy shows the private radio checked, ENABLED, and no
#   upgrade copy. The old assertion described an identity this suite no longer signs in as.
#
#   Its docblock also named what was owed: "Covering the successful public->private transition needs a PREMIUM
#   e2e identity; until one exists that transition is verified only by the component tests". That identity
#   exists, so the transition is now covered here. The FREE-tier gate stays covered by
#   `RecipeVisibilityToggle.native.test.tsx`, `RecipeDetailScreen.native.test.tsx` and the web Playwright suite.
#   It no longer has an on-device check, because that would take a second, free-tier device sign-in the fixture
#   contract does not provide.
#
# ⛔ THE ROUND TRIP ENDS PRIVATE, where it started, on the premium-only leg. A run that dies between the legs
# leaves the lamb public. `e2e-seed`'s per-flow reset (`planWorldReset`) now compares VISIBILITY as well as
# title, and replaces a seeded row found at the wrong one, so the next flow still opens the private lamb its
# manifest describes. Before that, a title-only reset kept the public lamb for the rest of the run.
#
# The detail's checked radio follows the SERVER's answer, not a local choice: `useSetRecipeVisibility` has no
# optimistic update and writes the PATCH response straight into `recipe(id)`. So a radio that becomes CHECKED
# means the change was stored. A failed PATCH leaves the old radio checked and the wait goes red.
#
# ⚠️ WHICH STATE FILTERS CAN FAIL. Each radio is TWO matchable nodes: the accessible radio (label as
# `accessibilityText`, carrying checked/enabled) and its visible `Text` child, which is never checked and never
# disabled. So `checked: true` and `enabled: false` really test the radio. `checked: false` or `enabled: true`
# would always match the child and prove nothing, which is why "enabled" is asserted as `assertNotVisible …
# enabled: false`.
#
# Uses the run's "Mediterranean Grilled Lamb" (seeded PRIVATE, owned by the signer).
- runFlow: ../auth/signin.yaml

- assertVisible: 'Recipes'

# The seed is guaranteed present (the CI loop reseeds before every flow); scroll to the owned recipe rather
# than a `when: visible` guard that would silently SKIP when it is below the fold (the list scrolls).
- scrollUntilVisible:
      element: '${E2E_RECIPE_LAMB}'
      direction: DOWN
      timeout: 20000
- tapOn: '${E2E_RECIPE_LAMB}'
# Owner-only actions confirm we are the owner — the visibility control renders only for the owner, so without
# this the assertions below could vacuously pass on a non-owned detail. The owner block is at the foot of the
# (scrolling) detail; the same scroll continues down to the visibility control.
- scrollUntilVisible:
      element: 'Edit recipe'
      direction: DOWN
      timeout: 20000
# The visibility toggle is a secondary owner action, behind the "More" overflow menu (C4 wireframe parity).
- scrollUntilVisible:
      element: 'More'
      direction: DOWN
      timeout: 20000
- tapOn: 'More'
# Scroll to the "Public" radio (a VISIBLE label) rather than the toggle's group label "Recipe visibility",
# which is only an accessibility label on the radiogroup container and so isn't a matchable scroll target.
- scrollUntilVisible:
      element:
          text: '^Public$'
      direction: DOWN
      timeout: 20000

# The recipe is seeded private, so the private radio is the checked one.
- assertVisible:
      text: '^Private$'
      checked: true

# C-004 for a PREMIUM owner: the private option is NOT gated, and no upgrade reason renders. A gate that wrongly
# blocked a premium account fails here.
- assertNotVisible:
      text: '^Private$'
      enabled: false
- assertNotVisible: 'Upgrade to premium to make a recipe private.'

# Private -> Public, stored.
- tapOn:
      text: '^Public$'
- extendedWaitUntil:
      visible:
          text: '^Public$'
          checked: true
      timeout: 40000
- assertNotVisible: 'We couldn.t change .*'

# Public -> Private: the premium-only transition, and the restore this shared world depends on (see above).
- tapOn:
      text: '^Private$'
- extendedWaitUntil:
      visible:
          text: '^Private$'
          checked: true
      timeout: 40000

# Still on the owned detail (no navigation) — the owner action is now above the scrolled position, so scroll
# back UP to it rather than asserting blind.
- scrollUntilVisible:
      element: 'Edit recipe'
      direction: UP
      timeout: 10000
