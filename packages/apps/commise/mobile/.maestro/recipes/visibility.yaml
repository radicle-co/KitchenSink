appId: ${APP_ID}
---
# Recipe visibility toggle, PREMIUM path (US2, T113/T074/C-004). The clone half of T113 is covered by
# discoverDetailSaveCopy.yaml; this closes the visibility half. Signs in, opens an OWNED private recipe, and drives a real
# Private -> Public -> Private round trip through the control's machine-checkable semantics.
#
# ⛔ WHY THIS NO LONGER ASSERTS THE FREE-TIER GATE, and why that is not a weakening. Read before "restoring" it.
#
#   This flow asserted that "Private" was DISABLED and showed "Upgrade to premium to make a recipe private."
#   That was true only while the Maestro signer was a free-tier account. It is not free now: the signer is the
#   Maestro pool's `signer` slot, declared `premium` (`packages/tools/e2e-fixtures/src/testPool.ts`,
#   `lane('signer', { roles: ['premium'], … })`). It has to be premium, because the seeded world this flow opens
#   contains PRIVATE recipes, which the recipe service refuses to create for a free-tier `user_created` owner
#   (`e2e-seed`'s `provision.ts`). Run 34863424203's hierarchy shows the private radio checked, ENABLED, and no
#   upgrade copy. The old assertion described an identity this suite no longer signs in as.
#
#   Its docblock also named what was owed: "Covering the successful public->private transition needs a PREMIUM
#   e2e identity; until one exists that transition is verified only by the component tests". That identity
#   exists, so the transition is now covered here. The FREE-tier gate stays covered by
#   `RecipeVisibilityField.native.test.tsx`, `RecipeDetailScreen.native.test.tsx` and the web Playwright suite.
#   It no longer has an on-device check, because that would take a second, free-tier device sign-in the fixture
#   contract does not provide.
#
# ⛔ THE ROUND TRIP ENDS PRIVATE, where it started, on the premium-only leg. A run that dies between the legs
# leaves the lamb public. `e2e-seed`'s per-flow reset (`planWorldReset`) now compares VISIBILITY as well as
# title, and replaces a seeded row found at the wrong one, so the next flow still opens the private lamb its
# manifest describes. Before that, a title-only reset kept the public lamb for the rest of the run.
#
# The detail's checked radio follows the SERVER's answer, not a local choice: `useSetRecipeVisibility` has no
# optimistic update and writes the PATCH response straight into `recipe(id)`. So a radio that becomes CHECKED
# means the change was stored. A failed PATCH leaves the old radio checked and the wait goes red.
#
# ⚠️ WHICH STATE FILTERS CAN FAIL. On Android each radio is TWO matchable nodes: the accessible radio (label as
# `accessibilityText`, carrying checked/enabled) and its visible `Text` child, which is never checked and never
# disabled. So `checked: true` and `enabled: false` really test the radio. `checked: false` or `enabled: true`
# would always match the child and prove nothing, which is why "enabled" is asserted as `assertNotVisible …
# enabled: false`. iOS publishes ONE node per radio, with its texts merged into the label.
#
# ⚠️ The EDITOR's radios carry a hint under the title, so their accessible name is BOTH texts, joined by the platform:
# `Private, Only you can see it` (run 38433716728's hierarchies, on both platforms). Maestro matches the WHOLE string,
# so `Private` names only the Android `Text` child, which is never checked, and `Only you can see it` names nothing on
# iOS. The editor leg therefore names the radio by its full label.
#
# Uses the run's "Mediterranean Grilled Lamb" (seeded PRIVATE, owned by the signer).
- runFlow: ../auth/signin.yaml

- assertVisible: 'Recipes'

# E1 (UI walk 2026-10-13; build spec §6.4, §7.7 item 2) — the editor's own visibility choice, PREMIUM path. Private is a
# real choice for this signer: it selects, with no Premium sheet. The FREE-tier leg (Private opens "Private recipes are
# part of Premium.") has no on-device check for the reason above — the fixture contract provides no free-tier signer —
# and is covered by `RecipeEditorScreen.native.test.tsx` and the web Playwright suite. Leaving by × keeps nothing the
# next flow can meet: every flow is reseeded, and a draft with no title never reaches the server.
- tapOn: 'New recipe'
- assertVisible: 'Close editor'
- scrollUntilVisible:
      element: 'Private, Only you can see it'
      direction: DOWN
      timeout: 30000
- tapOn: 'Private, Only you can see it'
- assertNotVisible: 'Private recipes are part of Premium.'
# Maestro reads `checked` on iOS only from a switch's `1`/`0` value; a React Native radio's value is the phrase
# `radio button, checked` (run 38433716728). So iOS asserts that phrase on the radio below Public, which in a
# two-radio group is Private.
- runFlow:
      when:
          platform: Android
      commands:
          - assertVisible:
                text: 'Private, Only you can see it'
                checked: true
- runFlow:
      when:
          platform: iOS
      commands:
          - assertVisible:
                text: 'radio button, checked'
                below: 'Public, Anyone can find it in Discover'
- tapOn: 'Close editor'
- assertVisible: 'Recipes'

# The seed is guaranteed present (the CI loop reseeds before every flow); scroll to the owned recipe rather
# than a `when: visible` guard that would silently SKIP when it is below the fold (the list scrolls).
- scrollUntilVisible:
      element: '${E2E_RECIPE_LAMB}'
      direction: DOWN
      timeout: 20000
- tapOn: '${E2E_RECIPE_LAMB}'
# Owner-only actions confirm we are the owner — the visibility control renders only for the owner, so without
# this the assertions below could vacuously pass on a non-owned detail. The owner block is in the detail's
# TITLE BAND (it used to be at the foot); the visibility control sits behind the ⋯ "More actions for {title}" overflow there.
- scrollUntilVisible:
      element: 'Edit recipe'
      direction: DOWN
      timeout: 20000
# The visibility change is a secondary owner action in the ⋯ menu (§6.4): "Make public" on a private recipe,
# "Make private" on a public one. The recipe is seeded private.
- scrollUntilVisible:
      element: 'More actions for .*'
      direction: DOWN
      timeout: 20000
- tapOn: 'More actions for .*'
# C-004 for a PREMIUM owner nothing is gated; a private recipe offers the way to public.
- tapOn: 'Make public'
- extendedWaitUntil:
      visible:
          text: '^Public$'
      timeout: 40000
- assertNotVisible: 'We couldn.t change .*'

# Public -> Private: the premium-only transition, and the restore this shared world depends on (see above).
- tapOn: 'More actions for .*'
- tapOn: 'Make private'
- extendedWaitUntil:
      visible:
          text: '^Private$'
      timeout: 40000

# Still on the owned detail (no navigation) — the owner action is now above the scrolled position, so scroll
# back UP to it rather than asserting blind.
- scrollUntilVisible:
      element: 'Edit recipe'
      direction: UP
      timeout: 10000
