        pauseThreshold:
          type: number
        utilization:
          type: number
        paused:
          type: boolean
      required:
        - source
        - windowCount
        - hardCap
        - pauseThreshold
        - utilization
        - paused
    OperationalMetrics:
      type: object
      properties:
        queue:
          $ref: "#/components/schemas/QueueDepthMetrics"
        backlog:
          $ref: "#/components/schemas/BacklogMetrics"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceWindowMetrics"
      required:
        - queue
        - backlog
        - sources
    RequeueResponse:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum:
            - PENDING
      required:
        - id
        - status
    FoodServiceErasureAcceptedResponse:
      type: object
      properties:
        requesterId:
          type: string
        deletedRequesterRows:
          type: number
        deletedAuthoredFoods:
          type: integer
          minimum: 0
        keptAuthoredFoods:
          type: integer
          minimum: 0
      required:
        - requesterId
        - deletedRequesterRows
    FoodServiceErasureBeginResponse:
      type: object
      properties:
        authoredFoodIds:
          type: array
          items:
            type: string
      required:
        - authoredFoodIds
    FoodServiceErasureRequest:
      type: object
      properties:
        referencedFoodIds:
          maxItems: 10000
          type: array
          items:
            type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
        service:
          type: string
        contractHash:
          type: string
          pattern: ^[0-9a-f]{64}$
      required:
        - status
        - service
        - contractHash
