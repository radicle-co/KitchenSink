              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: "The food is not blackholed — a `RESOLVED`/`UNRESOLVED` food has nothing to clear. `code: NOT_REQUEUEABLE`,
            with the observed status in `details.status` and the route that IS applicable (`POST
