                $ref: "#/components/schemas/ApiError"
        "401":
          description: "No valid Clerk session or M2M token — `code: UNAUTHORIZED`, or `IDENTITY_SYNC_PENDING` when the token is
            valid but its `external_id` has not synced yet (retry with a refreshed token, FR-051/CR-002)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: A stranger deleting a PROMOTED food, or a `svc_*` principal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such food — or a PRIVATE authored food the caller does not own.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: "Referenced (`code: FOOD_REFERENCED`, count + own recipe ids in `details`), or a pipeline food (`code:
            NOT_EDITABLE`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: "The reference check could not run (`code: REFERENCE_CHECK_UNAVAILABLE`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      description: "R22: the food flips to an internal DELETING state (admission refuses to bind it), the cross-service
        reference check runs with the caller's own authority, and only an unreferenced food deletes. Referenced → `409
        FOOD_REFERENCED` with the live count and the caller's OWN referencing recipe ids. Check unavailable → `503`,
        failed closed. Orphaning is erasure-only; this route never orphans."
      parameters:
        - name: id
          in: path
          required: true
          description: The internal food (ingredient) ULID. NEVER a source-native key such as a USDA `fdcId`.
          schema:
            type: string
    put:
      operationId: updateAuthoredFood
      summary: Replace a user-authored food
      security:
        - clerkSession: []
      responses:
        "200":
          description: The updated food.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodResponse"
        "400":
          description: "Malformed id — `code: INVALID_ID` (FR-006)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: "No valid Clerk session or M2M token — `code: UNAUTHORIZED`, or `IDENTITY_SYNC_PENDING` when the token is
            valid but its `external_id` has not synced yet (retry with a refreshed token, FR-051/CR-002)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: A stranger writing a PROMOTED food, or a `svc_*` principal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such food — or a PRIVATE authored food the caller does not own.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: "A pipeline food (`code: NOT_EDITABLE`), or a rename colliding with the caller's other authored food
            (`code: DUPLICATE_AUTHORED_NAME`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      description: "Full replacement, author-only (U10): the pure authorship policy answers a stranger on a PRIVATE food with
        the same `404` a missing id gets (existence concealed), a stranger on a PROMOTED food with `403`, and ANY caller
        on a pipeline (catalog) food with `409 NOT_EDITABLE` — catalog rows have a single writer."
      parameters:
        - name: id
          in: path
          required: true
          description: The internal food (ingredient) ULID. NEVER a source-native key such as a USDA `fdcId`.
          schema:
            type: string
      requestBody:
        description: The full replacement body.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAuthoredFoodRequest"
    get:
      operationId: getFood
      summary: Read an ingredient golden record
      security:
        - clerkSession: []
      responses:
        "200":
          description: The golden record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodResponse"
        "202":
          description: PENDING or UNRESOLVED — not yet readable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingResponse"
        "400":
          description: "Malformed id — `code: INVALID_ID` (FR-006)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: "No valid Clerk session or M2M token — `code: UNAUTHORIZED`, or `IDENTITY_SYNC_PENDING` when the token is
            valid but its `external_id` has not synced yet (retry with a refreshed token, FR-051/CR-002)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: "No such food, or NOT_FOUND / FAILED — `code: FOOD_NOT_FOUND`, with the terminal status in `details.status`
            (absent when there is no row at all)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      description: "The lifecycle IS the status code: `200` a golden record, `202` still pending or awaiting disambiguation,
        `404` tombstoned (`NOT_FOUND`) or exhausted (`FAILED`) — with the status still in the body
        (FR-002/FR-003/FR-004)."
      parameters:
        - name: id
          in: path
          required: true
          description: The internal food (ingredient) ULID. NEVER a source-native key such as a USDA `fdcId`.
          schema:
            type: string
    patch:
      operationId: resolveFood
      summary: Resolve an UNRESOLVED ingredient from a candidate pick
      security:
        - clerkSession: []
      responses:
        "200":
          description: Resolved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolveResponse"
        "400":
          description: "Malformed id (`code: INVALID_ID`), or `candidateIds` empty, longer than the bound, or naming a candidate
            twice (`code: VALIDATION_FAILED`, DSN-14). Refused before the source is called."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: "No valid Clerk session or M2M token — `code: UNAUTHORIZED`, or `IDENTITY_SYNC_PENDING` when the token is
            valid but its `external_id` has not synced yet (retry with a refreshed token, FR-051/CR-002)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: "No such food — `code: FOOD_NOT_FOUND`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: "A candidate is not in this food's set (`code: CANDIDATE_MISMATCH`), or the food is not awaiting
            disambiguation (`code: NOT_RESOLVABLE`). Both are `409`s, so the CODE — never the message — is what tells
            them apart."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: "This caller reached its per-minute cap on resolves, one source call per pick, or its hourly source budget
            — `code: REQUESTER_LIMIT_REACHED`, with the same seconds in `details.retryAfterSeconds` and in
            `Retry-After`. Refused before the source is called, so it spends no quota. Never the source being busy,
            which is a `503`. The budget is charged up front and the calls a request did not make are given back."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          headers:
            Retry-After:
              description: Seconds until the limit admits this caller again.
              schema:
                type: integer
                minimum: 0
                exclusiveMinimum: true
        "503":
          description: "Fetch temporarily unavailable — the shared source window is at its ceiling, a resolve waited for room and
            none came, or the caller's source budget could not be read. `code: FETCH_UNAVAILABLE`, with the same seconds
            in `details.retryAfterSeconds` and in `Retry-After`. Capacity pressure is never a `429`: that status means
            only a per-caller cap, on the routes that declare one."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
                minimum: 0
      description: Merges the picked candidates into the golden record (FR-RES-2).
      parameters:
        - name: id
          in: path
          required: true
          description: The internal food (ingredient) ULID. NEVER a source-native key such as a USDA `fdcId`.
          schema:
            type: string
      requestBody:
        description: The picked candidate row ids.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveFoodRequest"
  /api/v1/foods/{id}/status:
