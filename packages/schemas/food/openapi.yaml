            - message
            - details
          additionalProperties: {}
        - type: object
          properties:
            code:
              type: string
              enum:
                - CANDIDATE_MISMATCH
            message:
              type: string
            details:
              type: object
              properties:
                id:
                  type: string
              required:
                - id
              additionalProperties: {}
          required:
            - code
            - message
            - details
          additionalProperties: {}
        - type: object
