          description: "Authenticated but lacking the `food:admin` scope — `code: FORBIDDEN` (FR-039)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: "No such food — `code: FOOD_NOT_FOUND`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: "Fetch temporarily unavailable — backpressure, flood-shed, or the resolve cap. `code: FETCH_UNAVAILABLE`,
            with the same seconds in `details.retryAfterSeconds` and in `Retry-After`; this service never answers
            `429`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
                minimum: 0
      description: Operational manual re-enqueue. Requires the `food:admin` scope, checked BEFORE id validation so `403`
        precedes `400` (FR-039/FR-051).
      parameters:
        - name: id
          in: path
          required: true
          description: The internal food (ingredient) ULID. NEVER a source-native key such as a USDA `fdcId`.
          schema:
            type: string
  /api/v1/foods/admin/metrics:
    get:
      operationId: getAdminMetrics
      summary: Read the full operational dashboard signals (admin)
      security:
        - clerkSession: []
      responses:
        "200":
          description: The operational metrics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationalMetrics"
        "401":
          description: "No valid Clerk session or M2M token — `code: UNAUTHORIZED`, or `IDENTITY_SYNC_PENDING` when the token is
            valid but its `external_id` has not synced yet (retry with a refreshed token, FR-051/CR-002)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: "Authenticated but lacking the `food:admin` scope — `code: FORBIDDEN` (FR-039)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      description: Queue depths, lifecycle backlog, and per-source rolling-window utilization (FR-039).
  /api/v1/foods/admin/queue:
    get:
      operationId: getAdminQueueDepths
      summary: Read the fetch-queue depths (admin)
      security:
        - clerkSession: []
      responses:
        "200":
          description: The queue depths.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueDepthMetrics"
        "401":
          description: "No valid Clerk session or M2M token — `code: UNAUTHORIZED`, or `IDENTITY_SYNC_PENDING` when the token is
            valid but its `external_id` has not synced yet (retry with a refreshed token, FR-051/CR-002)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: "Authenticated but lacking the `food:admin` scope — `code: FORBIDDEN` (FR-039)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      description: The focused queue-depth signals on their own (FR-039).
  /api/v1/foods/admin/foods/{id}/requeue:
    post:
      operationId: requeueFood
      summary: Requeue a blackholed ingredient (admin)
      security:
        - clerkSession: []
      responses:
        "202":
          description: Requeued; the food is `PENDING` again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequeueResponse"
        "400":
          description: "Malformed id — `code: INVALID_ID` (FR-006)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: "No valid Clerk session or M2M token — `code: UNAUTHORIZED`, or `IDENTITY_SYNC_PENDING` when the token is
            valid but its `external_id` has not synced yet (retry with a refreshed token, FR-051/CR-002)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: "Authenticated but lacking the `food:admin` scope — `code: FORBIDDEN` (FR-039)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: "No such food — `code: FOOD_NOT_FOUND`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: "The food is not blackholed — a `RESOLVED`/`UNRESOLVED` food has nothing to clear. `code: NOT_REQUEUEABLE`,
            with the observed status in `details.status` and the route that IS applicable (`POST
            /api/v1/foods/{id}/refetch`) named in the message."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      description: "The operator escape hatch for a food the retry budget tombstoned: it clears the terminal lifecycle mark
        AND the attempt count so the normal drain picks the food up again (U9). Requires the `food:admin` scope, checked
        BEFORE id validation so `403` precedes `400` (FR-039/FR-051). Idempotent — requeuing an already-`PENDING` food
        answers `202`."
      parameters:
        - name: id
          in: path
          required: true
          description: The internal food (ingredient) ULID. NEVER a source-native key such as a USDA `fdcId`.
          schema:
            type: string
  /api/v1/internal/account/erasure:
    post:
      operationId: eraseAccountFootprint
      summary: Erase the token-bound owner's ingredient footprint (service-to-service)
      security:
        - serviceToken: []
      responses:
        "200":
          description: Erased. `deletedRequesterRows` is the reconciliation residue signal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodServiceErasureAcceptedResponse"
        "401":
          description: "The service token is absent, malformed, or not bound to the food audience — `code: UNAUTHORIZED`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      description: "Called by the identity deletion-worker / erasure-reconciliation on a `user.deleted` or account-closure
        event. Synchronous and idempotent: an owner with no footprint erases 0 rows and still succeeds. The target owner
        comes ONLY from the verified token's bound claim. The optional body (U18) carries NO authority: it names which
        of the owner's authored foods the worker's reference check found still referenced — those are KEPT as
        pseudonymous orphans (Q3b); everything else deletes."
      requestBody:
        description: The worker's referenced-food list (optional).
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FoodServiceErasureRequest"
  /api/v1/internal/account/erasure/begin:
    post:
      operationId: beginAccountErasure
      summary: Tombstone the token-bound owner's authored foods (erasure protocol step 1, U18)
      security:
        - serviceToken: []
      responses:
        "200":
          description: The tombstoned authored food ids.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodServiceErasureBeginResponse"
        "401":
          description: The service token is absent, malformed, or not food-audience-bound.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      description: Flips every authored food to an internal DELETING state — admission refuses to bind them while the worker
        runs the cross-service reference check — and returns their ids for that check. Idempotent on redelivery.
  /health:
    get:
      operationId: getHealth
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
      description: "Static. Deliberately does NOT touch the database — a transient RDS blip must not make ECS kill an
        otherwise-healthy container. Deliberately PUBLIC — the ALB target group calls it with no credential, and a
        consumer checking for contract skew must be able to ask before it holds one. `contractHash` is that skew signal
        (§15.2.5): a client whose pinned `@kitchensink/schema-food` fingerprint differs WARNS and keeps working."
  /health/ready:
    get:
      operationId: getReadiness
      summary: Readiness probe
      security: []
      responses:
        "200":
          description: Ready to serve traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Database not reachable (`NOT_READY`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      description: Probes the database pool so the ALB can drain an instance whose database is unreachable (ARCH-PS-3).
components:
  securitySchemes:
    clerkSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A Clerk session token (user) or an M2M token, verified in-process by `FoodAuthGuard`. Admin routes
        additionally require the `food:admin` scope from the token's `public_metadata`.
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A signed, single-target service token with the food audience, verified by `FoodServiceErasureGuard`. The
        target owner is BOUND IN THE TOKEN — there is no request body and no `ownerId` to smuggle.
  schemas:
    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: {}
      required:
        - code
        - message
      additionalProperties: {}
    FoodError:
