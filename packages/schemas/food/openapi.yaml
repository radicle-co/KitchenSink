          description: The process is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
      description: "Static. Deliberately does NOT touch the database — a transient RDS blip must not make ECS kill an
        otherwise-healthy container. Deliberately PUBLIC — the ALB target group calls it with no credential, and a
        consumer checking for contract skew must be able to ask before it holds one. `contractHash` is that skew signal
        (§15.2.5): a client whose pinned `@kitchensink/schema-food` fingerprint differs WARNS and keeps working."
  /health/ready:
    get:
      operationId: getReadiness
      summary: Readiness probe
      security: []
      responses:
        "200":
          description: Ready to serve traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Database not reachable (`NOT_READY`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      description: Probes the database pool so the ALB can drain an instance whose database is unreachable (ARCH-PS-3).
components:
  securitySchemes:
    clerkSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A Clerk session token (user) or an M2M token, verified in-process by `FoodAuthGuard`. Admin routes
        additionally require the `food:admin` scope from the token's `public_metadata`.
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A signed, single-target service token with the food audience, verified by `FoodServiceErasureGuard`. The
        target owner is BOUND IN THE TOKEN — there is no request body and no `ownerId` to smuggle.
  schemas:
    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: {}
      required:
        - code
        - message
      additionalProperties: {}
    FoodError:
      oneOf:
        - type: object
          properties:
            code:
              type: string
              enum:
                - VALIDATION_FAILED
            message:
              type: string
            details:
              type: object
              properties:
                fields:
                  type: array
                  items:
                    type: string
              required:
                - fields
              additionalProperties: {}
          required:
            - code
            - message
            - details
          additionalProperties: {}
        - type: object
          properties:
            code:
              type: string
              enum:
                - INVALID_ID
            message:
              type: string
          required:
            - code
            - message
          additionalProperties: {}
        - type: object
          properties:
            code:
              type: string
              enum:
                - BATCH_TOO_LARGE
            message:
              type: string
            details:
              type: object
              properties:
                maxNames:
                  type: number
              required:
                - maxNames
              additionalProperties: {}
          required:
            - code
            - message
            - details
          additionalProperties: {}
        - type: object
          properties:
            code:
              type: string
              enum:
                - UNAUTHORIZED
            message:
              type: string
          required:
            - code
            - message
          additionalProperties: {}
        - type: object
          properties:
            code:
              type: string
              enum:
                - IDENTITY_SYNC_PENDING
            message:
              type: string
          required:
            - code
            - message
          additionalProperties: {}
        - type: object
          properties:
            code:
              type: string
              enum:
                - FORBIDDEN
            message:
              type: string
          required:
            - code
            - message
          additionalProperties: {}
        - type: object
          properties:
            code:
              type: string
              enum:
