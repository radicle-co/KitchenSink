        - type: object
          properties:
            code:
              type: string
              enum:
                - VALIDATION_FAILED
            message:
              type: string
            details:
              type: object
              properties:
                fields:
                  type: array
                  items:
                    type: string
              required:
                - fields
              additionalProperties: {}
          required:
            - code
            - message
            - details
          additionalProperties: {}
        - type: object
          properties:
            code:
              type: string
              enum:
                - INVALID_ID
            message:
              type: string
          required:
            - code
            - message
          additionalProperties: {}
        - type: object
          properties:
            code:
              type: string
              enum:
                - BATCH_TOO_LARGE
            message:
              type: string
            details:
              type: object
              properties:
                maxNames:
                  type: number
              required:
                - maxNames
              additionalProperties: {}
          required:
            - code
            - message
            - details
          additionalProperties: {}
        - type: object
          properties:
            code:
              type: string
              enum:
                - UNAUTHORIZED
            message:
              type: string
          required:
            - code
            - message
          additionalProperties: {}
        - type: object
          properties:
            code:
              type: string
              enum:
                - IDENTITY_SYNC_PENDING
