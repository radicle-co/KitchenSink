    exactly one error shape, and `code` is the discriminant a client branches on, NEVER `message`. `FoodError` publishes
    the TYPED view of the same bodies: the codes this API emits and the `details` each one carries. A client must still
    tolerate a code it has not been taught (a deployed service adds codes ahead of a released mobile binary), so parse
    with `ApiError` and narrow with `FoodError`. Every path is also served under the DEPRECATED `/v1/*` alias held by
    already-shipped clients (ADR-0011); only the canonical `/api/v1/*` form is documented."
