            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      description: Audited. The returned `sessionId` correlates the audit trail; the impersonated session is itself BLOCKED
        from privileged surfaces on the client.
      parameters:
        - name: userId
          in: path
          required: true
          description: The target user's app ULID (NOT the Clerk `sub`). A non-ULID value is a `400`.
          schema:
            type: string
