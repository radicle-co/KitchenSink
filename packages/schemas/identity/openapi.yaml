    post:
      operationId: adminStopImpersonation
      summary: End an impersonation session (admin)
      security:
        - clerkSession: []
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImpersonationStopResponse"
        "400":
          description: The `{userId}` path parameter is not a ULID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: No valid Clerk session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Authenticated but lacking the `admin:users` scope (enforced by `ScopesGuard`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      description: Audited counterpart to the start route.
      parameters:
        - name: userId
          in: path
          required: true
          description: The target user's app ULID (NOT the Clerk `sub`). A non-ULID value is a `400`.
          schema:
            type: string
            format: ulid
            pattern: ^[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26}$
  /health:
    get:
      operationId: getHealth
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
      description: "Static. Deliberately does NOT touch the database — a transient RDS blip must not make ECS kill an
        otherwise-healthy container. Deliberately PUBLIC — the ALB target group calls it with no credential, and a
        consumer checking for contract skew must be able to ask before it holds one. `contractHash` is that skew signal
        (§15.2.5): a client whose pinned `@kitchensink/schema-identity` fingerprint differs WARNS and keeps working."
  /health/ready:
    get:
      operationId: getReadiness
      summary: Readiness probe
      security: []
      responses:
        "200":
          description: Ready to serve traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Database not reachable (`NOT_READY`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      description: "Probes the database so the ALB can drain an instance whose database is unreachable (ARCH-PS-3). The cause
        is deliberately swallowed: it can embed connection strings."
components:
  securitySchemes:
    clerkSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A Clerk session token, verified in-process. Admin routes additionally require the `admin:users` scope from
        the token's `public_metadata`.
  schemas:
    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: {}
      required:
        - code
        - message
      additionalProperties: {}
    UserProfileUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        displayName:
          type: string
        avatarUrl:
          nullable: true
          type: string
        status:
          type: string
          enum:
            - active
            - suspended
            - tombstoned
            - erased
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - email
        - displayName
        - avatarUrl
        - status
        - createdAt
        - updatedAt
    UserProfileAccount:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        subscriptionTier:
          type: string
          enum:
            - free
            - premium
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - userId
        - subscriptionTier
        - createdAt
        - updatedAt
    UserProfile:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/UserProfileUser"
        account:
          $ref: "#/components/schemas/UserProfileAccount"
      required:
        - user
        - account
    PatchUserMeRequest:
      type: object
      properties:
        displayName:
          type: string
          maxLength: 100
        avatarUrl:
          anyOf:
            - type: string
              format: uri
            - type: string
              nullable: true
              enum:
                - null
      additionalProperties: false
    DeleteUserMeResponse:
      type: object
      properties:
        sub:
          type: string
        deletedAt:
          type: string
        message:
          type: string
      required:
        - sub
        - deletedAt
        - message
    AvatarPresignResponse:
      type: object
      properties:
        uploadUrl:
          type: string
        publicUrl:
          type: string
      required:
        - uploadUrl
        - publicUrl
    AdminUserListItem:
      type: object
      properties:
        sub:
          type: string
        email:
          type: string
        name:
          nullable: true
          type: string
        picture:
          nullable: true
          type: string
        status:
          type: string
      required:
        - sub
        - email
        - name
        - picture
        - status
    AdminListUsersResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/AdminUserListItem"
        limit:
          type: number
        offset:
          type: number
      required:
        - users
        - limit
        - offset
    AdminSuspendUserResponse:
      type: object
      properties:
        sub:
          type: string
        status:
          type: string
          enum:
            - suspended
        suspendedAt:
          type: string
      required:
        - sub
        - status
        - suspendedAt
    AdminUnsuspendUserResponse:
      type: object
      properties:
        sub:
          type: string
        status:
          type: string
          enum:
            - active
        unsuspendedAt:
          type: string
      required:
        - sub
        - status
        - unsuspendedAt
    AdminReactivateUserResponse:
      type: object
      properties:
        sub:
          type: string
        status:
          type: string
          enum:
            - active
        reactivatedAt:
          type: string
      required:
        - sub
        - status
        - reactivatedAt
    ImpersonationStartResponse:
      type: object
      properties:
        impersonatorSub:
          type: string
        impersonatedSub:
          type: string
        sessionId:
          type: string
        startedAt:
          type: string
      required:
        - impersonatorSub
        - impersonatedSub
        - sessionId
        - startedAt
    ImpersonationStopResponse:
      type: object
      properties:
        impersonatorSub:
          type: string
        impersonatedSub:
          type: string
        stoppedAt:
          type: string
        message:
          type: string
      required:
        - impersonatorSub
        - impersonatedSub
        - stoppedAt
        - message
    HealthStatus:
      type: object
      properties:
        status:
          type: string
        service:
          type: string
        contractHash:
          type: string
          pattern: ^[0-9a-f]{64}$
      required:
        - status
        - service
        - contractHash
