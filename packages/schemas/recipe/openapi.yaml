          description: No, invalid, expired, or wrong-authorized-party bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: The account was already erased.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "423":
          description: "The caller has an in-flight account erasure, so writes are locked (HAZ-052). `code: ERASURE_IN_PROGRESS`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: "Per-user rate limit exceeded (`code: TOO_MANY_REQUESTS`). ⚠️ This body used to be a bare JSON STRING — the
            throttler exception passed through the filter unchanged — and is now the envelope."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          headers:
            Retry-After:
              description: Seconds until the limit resets.
              schema:
                type: integer
                minimum: 0
                exclusiveMinimum: true
        "500":
          description: Unexpected server error. The body never carries internals.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      description: "IRREVERSIBLE. `confirmationPhrase` is the intent gate and is REQUIRED; its VALUE is checked by the
        service, not by request validation, so the accepted literal is deliberately NOT published as an enum here — a
        `400` reports a mismatch without echoing what was expected. There is no `ownerId` field: the owner comes from
        the verified token, and the body is strict, so a smuggled one is rejected with a 400 rather than stripped —
        which matters here because the operation is irreversible, and it applies equally to a misspelled
        `publishRecipeIds`, whose silent loss would have removed recipes the caller elected to donate. Idempotent per
        C-007 — an in-flight job is RETURNED rather than a second one started, and there is no `409`, because a
        duplicate erasure request is the same request again. `publishRecipeIds` is the optional per-recipe DONATE
        election (CR-002 / U3b): a listed recipe is published and KEPT under a pseudonymous handle the erased owner no
        longer controls, instead of being removed; absent or empty means donate nothing."
      requestBody:
        description: The confirmation phrase, plus the optional donate election.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErasureRequest"
  /api/v1/internal/account/erasure:
    post:
      operationId: requestServiceErasure
      summary: Service-principal erasure trigger, called by the identity deletion worker.
      security:
        - serviceErasureToken: []
      responses:
        "202":
          description: The queued, already-running, or already-completed erasure job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceErasureAcceptedResponse"
        "401":
          description: Missing, invalid, or expired service token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      description: "NOT a public endpoint and NOT Clerk-authenticated: it authenticates with a signed machine token and is
        excluded from the Clerk middleware so its own guard is the fail-closed enforcement point (ADR-0011). It takes NO
        REQUEST BODY, deliberately — the target owner is the token’s bound claim, so there is nothing for a caller to
        supply and no confirmation phrase (the token IS the authorization). Unlike the user route, an already-erased
        account is an idempotent no-op SUCCESS reporting `status: completed` with no `jobId`, not a `410`: the
        deletion-worker caller only needs to know the erasure is handled. There is no donate election on this path
        (KTD-2) — every owner-only recipe is removed."
