             as on mobile, and the sidebar no longer has a profile row. The product still draws it in the sidebar from
             840 px, where LargeTitleHeader hides its avatar; this rule shows that avatar instead. -->
        <style>
            .col-start-3.row-start-1.justify-self-end.nav\:hidden {

        <x-dc
            ><helmet
                ><style>
                    body {
                        margin: 0;
                        background: var(--canvas);
                        color: var(--ink);
                        font-family: var(--font-body);
                    }
                    a {
                        color: inherit;
                        text-decoration: none;
                    }
                    .sb {
                        display: none;
                    }
                    .tb {
                        display: flex;
                    }
                    .pad {
                        padding: 24px 16px calc(64px + 104px);
                    }
                    .wide-only {
                        display: none;
                    }
                    .below-nav {
                        display: block;
                    }
                    .page {
                        max-width: 90rem;
                        margin: 0 auto;
                        display: flex;
                        width: 100%;
                        flex-direction: column;
                        gap: 16px;
                    }
                    .rgrid {
                        display: grid;
                        grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr));
                        gap: 16px;
                    }
                    .cgrid {
                        display: grid;
                        grid-template-columns: repeat(2, 1fr);
                        gap: 16px;
                    }
                    @media (min-width: 600px) {
                        .pad {
                            padding-inline: 24px;
                        }
                        .rgrid {
                            gap: 24px;
                        }
                        .cgrid {
                            grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr));
                            gap: 24px;
                        }
                    }
                    @media (min-width: 840px) {
                        .sb {
                            display: flex;
                        }
                        .tb {
                            display: none;
                        }
                        .pad {
                            padding: 24px 32px 32px;
                        }
                        .wide-only {
                            display: contents;
                        }
                        .below-nav {
                            display: none;
                        }
                    }

                    .syncwrap {
                        position: sticky;
                        top: 0;
                        z-index: 10;
                    }
                    .syncwrap [role='status'] {
                        padding-inline: 0;
                    }
                    .syncwrap [role='status'] > div {
                        margin-bottom: 16px;
                    }
                    .cap {
                        margin: 0 0 8px;
                        font: 600 14px/1.4 var(--font-body);
                        color: var(--ink-muted);
                    }
                    .fig {
                        margin: 0 0 32px;
                    }
                    .frame {
                        position: relative;
                        overflow: hidden;
                        border: 1px solid var(--line-divider);
                        border-radius: 12px;
                        background: var(--canvas);
                    }
                    .frame .sb {
                        height: 100%;
                        position: static;
                    }
                    .rail {
                        display: flex;
                        height: 100%;
                        width: 80px;
                        flex: none;
                        flex-direction: column;
                        align-items: center;
                        border-inline-end: 1px solid var(--line-divider);
                        background: color-mix(in srgb, var(--paper) 70%, transparent);
                        box-sizing: border-box;
                    }
                </style></helmet
