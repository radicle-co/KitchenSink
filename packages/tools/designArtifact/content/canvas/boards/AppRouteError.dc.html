<!doctype html>
<html lang="en">

        <meta charset="utf-8" />
        <title>App, something went wrong (web)</title>

        <link rel="stylesheet" href="ds/commise/bundle.css" />

        <!-- PROPOSAL (owner comment on the canvas, 2026-10-17): on web, the profile sits at the top right of the screen,
             as on mobile, and the sidebar no longer has a profile row. The product still draws it in the sidebar from
             840 px, where LargeTitleHeader hides its avatar; this rule shows that avatar instead. -->
        <style>
            .col-start-3.row-start-1.justify-self-end.nav\:hidden {
                display: block;
                align-self: flex-start;
            }
        </style>
    </head>
    <body>
        <x-dc
            ><helmet
                ><style>
                    body {
                        margin: 0;
                        background: var(--canvas);
                        color: var(--ink);
                        font-family: var(--font-body);
                    }
                    a {
                        color: inherit;
                        text-decoration: none;
                    }
                    .sb {
                        display: none;
                    }
                    .tb {
                        display: flex;
                    }
                    .pad {
                        padding: 24px 16px calc(64px + 104px);
                    }
                    .wide-only {
                        display: none;
                    }
                    .below-nav {
                        display: block;
                    }
                    .page {
                        max-width: 90rem;
                        margin: 0 auto;
                        display: flex;
                        width: 100%;
                        flex-direction: column;
                        gap: 16px;
                    }
                    .rgrid {
                        display: grid;
                        grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr));
                        gap: 16px;
                    }
                    .cgrid {
                        display: grid;
                        grid-template-columns: repeat(2, 1fr);
                        gap: 16px;
                    }
                    @media (min-width: 600px) {
                        .pad {
                            padding-inline: 24px;
                        }
                        .rgrid {
                            gap: 24px;
                        }
                        .cgrid {
                            grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr));
                            gap: 24px;
                        }
                    }
                    @media (min-width: 840px) {
                        .sb {
                            display: flex;
                        }
                        .tb {
                            display: none;
                        }
                        .pad {
                            padding: 24px 32px 32px;
                        }
                        .wide-only {
                            display: contents;
                        }
                        .below-nav {
                            display: none;
                        }
                    }

                    .syncwrap {
                        position: sticky;
                        top: 0;
                        z-index: 10;
                    }
                    .syncwrap [role='status'] {
                        padding-inline: 0;
                    }
                    .syncwrap [role='status'] > div {
                        margin-bottom: 16px;
                    }
                    .cap {
                        margin: 0 0 8px;
                        font: 600 14px/1.4 var(--font-body);
                        color: var(--ink-muted);
                    }
                    .fig {
                        margin: 0 0 32px;
                    }
                    .frame {
                        position: relative;
                        overflow: hidden;
                        border: 1px solid var(--line-divider);
                        border-radius: 12px;
                        background: var(--canvas);
                    }
                    .frame .sb {
                        height: 100%;
                        position: static;
                    }
                    .rail {
                        display: flex;
                        height: 100%;
                        width: 80px;
                        flex: none;
                        flex-direction: column;
                        align-items: center;
                        border-inline-end: 1px solid var(--line-divider);
                        background: color-mix(in srgb, var(--paper) 70%, transparent);
                        box-sizing: border-box;
                    }
                </style></helmet
            >
            <div style="padding: 32px 32px 8px">
                <figure class="fig">
                    <figcaption class="cap">
                        Route error (a route segment’s error.tsx, bare like the loading fallback): the title, why, and
                        Try again. The web notice has no second action.
                    </figcaption>
                    <div class="frame" style="height: 300px">
                        <div style="padding: 24px 32px">
                            <x-import
                                component-from-global-scope="Commise.StateNotice"
                                title="Something went wrong."
                                body="We couldn’t load this. Please try again."
                                primary="{{errPrimary}}"
                            ></x-import>
                        </div>
                    </div>
                </figure>
                <figure class="fig">
                    <figcaption class="cap">
                        Whole app crashed (global-error.tsx), last resort: plain system styling, because the design
                        system may be what failed. Try again reloads the tree; Go to Home is a full page load.
                    </figcaption>
                    <div class="frame" style="height: 320px">
                        <div
                            style="
                                display: flex;
                                flex-direction: column;
                                align-items: center;
                                gap: 16px;
                                max-width: 512px;
                                margin: 0 auto;
                                padding: 64px 24px;
                                font-family: system-ui, sans-serif;
                                text-align: center;
                                color: CanvasText;
                                background: Canvas;
                            "
                        >
                            <h1 style="margin: 0; font-size: 24px; font-weight: 700">Something went wrong.</h1>
                            <p style="margin: 0; font-size: 16px">We couldn’t load this. Please try again.</p>
                            <button type="button" style="all: revert; padding: 10px 20px; font-size: 16px">
                                Try again</button
                            ><a href="#home" style="all: revert; font-size: 16px">Go to Home</a>
                        </div>
                    </div>
                </figure>
            </div></x-dc
        >
