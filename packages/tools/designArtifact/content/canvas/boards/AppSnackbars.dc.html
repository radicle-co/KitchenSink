                    }
                    .tb {

                    }

                        display: none;
                    }
                    .below-nav {
                        display: block;
                    }
                    .page {
                        max-width: 90rem;
                        margin: 0 auto;
                        display: flex;
                        width: 100%;
                        flex-direction: column;
                        gap: 16px;
                    }
                    .rgrid {
                        display: grid;
                        grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr));
                        gap: 16px;
                    }
                    .cgrid {
                        display: grid;
                        grid-template-columns: repeat(2, 1fr);
                        gap: 16px;
                    }
                    @media (min-width: 600px) {
                        .pad {
                            padding-inline: 24px;
                        }
                        .rgrid {
                            gap: 24px;
                        }
                        .cgrid {
                            grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr));
                            gap: 24px;
                        }

                        .sb {
                            display: flex;
                        }
                        .tb {
                            display: none;
                        }
                        .pad {
                            padding: 24px 32px 32px;
                        }
                        .wide-only {
                            display: contents;
                        }
                        .below-nav {
                            display: none;
                        }
                    }

                    .syncwrap {
                        position: sticky;
                        top: 0;
                        z-index: 10;
                    }
                    .syncwrap [role='status'] {
                        padding-inline: 0;
                    }
                    .syncwrap [role='status'] > div {

                    .cap {

                        border-radius: 12px;
                        background: var(--canvas);

                        border-inline-end: 1px solid var(--line-divider);
