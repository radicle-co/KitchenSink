<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Sign in, checking your session (mobile)</title>
        <script src="./support.js"></script>
        <link rel="stylesheet" href="ds/commise/tokens.css" />
        <link rel="stylesheet" href="ds/commise/bundle.css" />
        <script src="ds/commise/bundle.js"></script>
    </head>
    <body>
        <x-dc
            ><helmet
                ><style>
                    body {
                        margin: 0;
                        width: 390px;
                        background: var(--canvas);
                        color: var(--ink);
                        font-family: var(--font-body);
                    }
                    *,
                    *::before,
                    *::after {
                        box-sizing: border-box;
                    }
                </style></helmet
            >
            <div
                style="
                    display: flex;
                    flex-direction: column;
                    width: 390px;
                    height: 844px;
                    background-color: var(--canvas);
                    background-image: var(--background-image-hero);
                "
            >
                <x-import
                    component-from-global-scope="Commise.Native.LoadingNotice"
                    label="Checking your session…"
                ></x-import>
            </div>
        </x-dc>
        <script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
            class Component extends DCLogic { renderVals(){ return { noop: function(){}, yes: true, no: false }; } }
        </script>
    </body>
</html>
