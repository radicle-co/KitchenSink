<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Collection detail, not found or failed (mobile)</title>
        <script src="./support.js"></script>
        <link rel="stylesheet" href="ds/commise/tokens.css" />
        <link rel="stylesheet" href="ds/commise/bundle.css" />
        <script src="ds/commise/bundle.js"></script>
    </head>
    <body>
        <x-dc
            ><helmet
                ><style>
                    body {
                        margin: 0;
                        background: var(--canvas);
                        color: var(--ink);
                        font-family: var(--font-body);
                    }
                    *,
                    *::before,
                    *::after {
                        box-sizing: border-box;
                    }
                    .cap {
                        width: 390px;
                        padding: 8px 16px;
                        font: 500 12px/1.4 var(--font-body);
                        color: var(--ink-muted);
                    }
                    .m-page {
                        display: flex;
                        flex-direction: column;
                        width: 390px;
                        height: 844px;
                        padding-top: 47px;
                        position: relative;
                        overflow: hidden;
                        background: var(--canvas);
                        color: var(--ink);
                        font-family: var(--font-body);
                    }
                    .m-body {
                        display: flex;
                        flex: 1;
                        flex-direction: column;
                        min-height: 0;
                    }

                    .m-page {
                        height: 640px;
                    }
                    .m-gap {
                        height: 24px;
                    }
                </style></helmet
            >
            <p class="cap">Not found: the collection was deleted, so there is no retry</p>
            <div class="m-page">
                <div class="m-body">
                    <x-import
                        component-from-global-scope="Commise.Native.StateNotice"
                        title="We couldn’t find that collection"
                        body="It may have been deleted."
                        secondary="{{secondary}}"
                    ></x-import>
                </div>
                <x-import
                    component-from-global-scope="Commise.Native.HomeTabBar"
                    chrome="{{chrome}}"
                    live-capabilities="{{none}}"
                    active-id="recipes"
                    on-press="{{noop}}"
                    bottom-inset="{{inset}}"
                    compact="{{no}}"
                    left-inset="{{zero}}"
                    right-inset="{{zero}}"
                ></x-import>
            </div>
            <div class="m-gap"></div>
            <p class="cap">Load failed: Try again reads the collection again</p>
            <div class="m-page">
                <div class="m-body">
                    <x-import
                        component-from-global-scope="Commise.Native.StateNotice"
                        title="We couldn’t load this collection."
                        primary="{{primary}}"
                        secondary="{{secondary}}"
                    ></x-import>
                </div>
                <x-import
                    component-from-global-scope="Commise.Native.HomeTabBar"
                    chrome="{{chrome}}"
                    live-capabilities="{{none}}"
                    active-id="recipes"
                    on-press="{{noop}}"
                    bottom-inset="{{inset}}"
                    compact="{{no}}"
                    left-inset="{{zero}}"
                    right-inset="{{zero}}"
                ></x-import></div
        ></x-dc>
        <script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
            class Component extends DCLogic { renderVals(){ const noop=function(){};return {noop:noop,none:[],no:false,zero:0,inset:34,chrome:{destinations:{home:'Home',recipes:'Recipes',discover:'Discover','meal-plan':'Plan',grocery:'Shop'},profileButton:'Profile, {name}',profileButtonNoName:'Profile',tabNavLabel:'Tabs'},secondary:{label:'Back to Collections',icon:'chevronLeft',onPress:noop},primary:{label:'Try again',icon:'refreshCw',onPress:noop}}; } }
        </script>
    </body>
</html>
