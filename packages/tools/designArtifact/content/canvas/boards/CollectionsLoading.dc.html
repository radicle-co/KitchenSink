<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Collections, loading, proposal (web)</title>
        <script src="./support.js"></script>
        <link rel="stylesheet" href="ds/commise/tokens.css" />
        <link rel="stylesheet" href="ds/commise/bundle.css" />
        <script src="ds/commise/bundle.js"></script>
        <!-- PROPOSAL (owner comment on the canvas, 2026-10-17): on web, the profile sits at the top right of the screen,
             as on mobile, and the sidebar no longer has a profile row. The product still draws it in the sidebar from
             840 px, where LargeTitleHeader hides its avatar; this rule shows that avatar instead. -->
        <style>
            .col-start-3.row-start-1.justify-self-end.nav\:hidden {
                display: block;
                align-self: flex-start;
            }
        </style>
    </head>
    <body>
        <x-dc
            ><helmet
                ><style>
                    body {
                        margin: 0;
                        background: var(--canvas);
                        color: var(--ink);
                        font-family: var(--font-body);
                    }
                    a {
                        color: inherit;
                        text-decoration: none;
                    }
                    .sb {
                        display: none;
                    }
                    .tb {
                        display: flex;
                    }
                    .pad {
                        padding: 24px 16px calc(64px + 104px);
                    }
                    .wide-only {
                        display: none;
                    }
                    .below-nav {
                        display: block;
                    }
                    .page {
                        max-width: 90rem;
                        margin: 0 auto;
                        display: flex;
                        width: 100%;
                        flex-direction: column;
                        gap: 16px;
                    }
                    .rgrid {
                        display: grid;
                        grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr));
                        gap: 16px;
                    }
                    .cgrid {
                        display: grid;
                        grid-template-columns: repeat(2, 1fr);
                        gap: 16px;
                    }
                    @media (min-width: 600px) {
                        .pad {
                            padding-inline: 24px;
                        }
                        .rgrid {
                            gap: 24px;
                        }
                        .cgrid {
                            grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr));
                            gap: 24px;
                        }
                    }
                    @media (min-width: 840px) {
                        .sb {
                            display: flex;
                        }
                        .tb {
                            display: none;
                        }
                        .pad {
                            padding: 24px 32px 32px;
                        }
                        .wide-only {
                            display: contents;
                        }
                        .below-nav {
                            display: none;
                        }
                    }
                </style></helmet
            >
            <div style="display: flex; min-height: 100vh">
                <div
                    class="sb"
                    style="
                        position: sticky;
                        top: 0;
                        height: 100vh;
                        width: 256px;
                        flex: none;
                        flex-direction: column;
                        overflow-y: auto;
                        border-inline-end: 1px solid var(--line-divider);
                        background: color-mix(in srgb, var(--paper) 70%, transparent);
                        box-sizing: border-box;
                    "
                >
                    <div style="display: flex; height: 64px; flex: none; align-items: center; padding: 0 24px">
                        <span
                            style="
                                font-family: var(--font-display);
                                font-size: 20px;
                                line-height: 1.4;
                                font-weight: 700;
                                color: var(--ink);
                            "
                            >Commise</span
                        >
                    </div>
                    <nav aria-label="Main" style="display: flex; flex-direction: column; gap: 4px; padding: 0 12px">
                        <a
                            href="#home"
                            style="
                                display: flex;
                                min-height: 44px;
                                align-items: center;
                                gap: 12px;
                                border-radius: 12px;
                                padding: 0 12px;
                                font-size: 14px;
                                line-height: 1.2;
                                font-weight: 600;
                                position: relative;
                                color: var(--ink-muted);
                            "
                            ><span
                                aria-hidden="true"
                                style="
                                    position: absolute;
                                    top: 8px;
                                    bottom: 8px;
                                    inset-inline-start: 0;
                                    width: 3px;
                                    border-radius: 0 9999px 9999px 0;
                                "
                            ></span
                            ><x-import component-from-global-scope="Commise.Icon" name="house" size="{{v11}}"></x-import
                            ><span>Home</span></a
                        ><a
                            href="#recipes"
                            aria-current="page"
                            style="
                                display: flex;
                                min-height: 44px;
                                align-items: center;
                                gap: 12px;
                                border-radius: 12px;
                                padding: 0 12px;
                                font-size: 14px;
                                line-height: 1.2;
                                font-weight: 600;
                                position: relative;
                                background: color-mix(in srgb, var(--action) 10%, transparent);
                                color: var(--ink);
                            "
                            ><span
                                aria-hidden="true"
                                style="
                                    position: absolute;
                                    top: 8px;
                                    bottom: 8px;
                                    inset-inline-start: 0;
                                    width: 3px;
                                    border-radius: 0 9999px 9999px 0;
                                    background: var(--here-bar);
                                "
                            ></span
                            ><x-import
                                component-from-global-scope="Commise.Icon"
                                name="bookOpen"
                                size="{{v12}}"
                            ></x-import
                            ><span>Recipes</span></a
                        ><a
                            href="#discover"
                            style="
                                display: flex;
                                min-height: 44px;
                                align-items: center;
                                gap: 12px;
                                border-radius: 12px;
                                padding: 0 12px;
                                font-size: 14px;
                                line-height: 1.2;
                                font-weight: 600;
                                position: relative;
                                color: var(--ink-muted);
                            "
                            ><span
                                aria-hidden="true"
                                style="
                                    position: absolute;
                                    top: 8px;
                                    bottom: 8px;
                                    inset-inline-start: 0;
                                    width: 3px;
                                    border-radius: 0 9999px 9999px 0;
                                "
                            ></span
                            ><x-import
                                component-from-global-scope="Commise.Icon"
                                name="compass"
                                size="{{v13}}"
                            ></x-import
                            ><span>Discover</span></a
                        >
                    </nav>
                    <div style="margin-top: auto">
                        <button
                            type="button"
                            aria-expanded="true"
                            style="
                                display: flex;
                                min-height: 44px;
                                align-items: center;
                                gap: 12px;
                                border-radius: 12px;
                                padding: 0 12px;
                                font-size: 14px;
                                line-height: 1.2;
                                font-weight: 600;
                                margin: 0 12px 12px;
                                width: calc(100% - 24px);
                                border: 0;
                                background: transparent;
                                color: var(--ink-muted);
                                font-family: inherit;
                                cursor: pointer;
                            "
                        >
                            <x-import
                                component-from-global-scope="Commise.Icon"
                                name="chevronsLeft"
                                size="{{v17}}"
                            ></x-import
                            ><span>Collapse</span>
                        </button>
                    </div>
                </div>
                <main class="pad" style="min-width: 0; flex: 1; box-sizing: border-box">
                    <section aria-label="Collections" class="page">
                        <x-import
                            component-from-global-scope="Commise.LargeTitleHeader"
                            heading-id="recipes-title"
                            title="Recipes"
                            action="{{v6}}"
                            segments="{{v7}}"
                        ></x-import>
                        <!-- PROPOSAL (owner comments, 2026-10-17): the create button sits on the search row as a primary button, at the far
     right. The row exists in every state, because in the product the button belongs to the page frame, outside the
     list's boundary. Where the list draws no search (loading, error, empty), the row holds the button alone. -->
                        <div style="display: flex; align-items: center; justify-content: space-between; gap: 48px">
                            <div style="min-width: 0; flex: 0 1 560px"></div>
                            <x-import component-from-global-scope="Commise.Button" icon="plus">New collection</x-import>
                        </div>
                        <div role="status" aria-label="Loading collections…" class="flex flex-col gap-3">
                            <p class="text-body-sm font-medium text-ink-muted">Loading collections…</p>
                            <div aria-hidden="true" class="flex flex-col gap-3">
                                <span class="h-16 animate-pulse rounded-2xl bg-surface-muted"></span>
                                <span class="h-16 animate-pulse rounded-2xl bg-surface-muted"></span>
                                <span class="h-16 animate-pulse rounded-2xl bg-surface-muted"></span>
                            </div>
                        </div>
                    </section>
                </main>
                <nav
                    class="tb"
                    aria-label="Tabs"
                    style="
                        position: fixed;
                        left: 0;
                        right: 0;
                        bottom: 0;
                        z-index: 50;
                        isolation: isolate;
                        height: 64px;
                        justify-content: space-around;
                        padding: 0 8px;
                        box-sizing: border-box;
                    "
                >
                    <x-import component-from-global-scope="Commise.ChromeSurface" edge="top"></x-import
                    ><a
                        href="#home"
                        style="
                            position: relative;
                            display: flex;
                            min-height: 56px;
                            min-width: 96px;
                            flex: 1;
                            flex-direction: column;
                            align-items: center;
                            justify-content: center;
                            gap: 4px;
                            border-radius: 12px;
                            color: var(--ink-muted);
                        "
                        ><span
                            aria-hidden="true"
                            style="
                                position: absolute;
                                top: 0;
                                width: 32px;
                                height: 3px;
                                border-radius: 0 0 9999px 9999px;
                            "
                        ></span
                        ><x-import component-from-global-scope="Commise.Icon" name="house" size="{{v14}}"></x-import
                        ><span style="font-size: 12px; line-height: 1.4; font-weight: 500">Home</span></a
                    ><a
                        href="#recipes"
                        aria-current="page"
                        style="
                            position: relative;
                            display: flex;
                            min-height: 56px;
                            min-width: 96px;
                            flex: 1;
                            flex-direction: column;
                            align-items: center;
                            justify-content: center;
                            gap: 4px;
                            border-radius: 12px;
                            color: var(--ink);
                        "
                        ><span
                            aria-hidden="true"
                            style="
                                position: absolute;
                                top: 0;
                                width: 32px;
                                height: 3px;
                                border-radius: 0 0 9999px 9999px;
                                background: var(--here-bar);
                            "
                        ></span
                        ><x-import component-from-global-scope="Commise.Icon" name="bookOpen" size="{{v15}}"></x-import
                        ><span style="font-size: 12px; line-height: 1.4; font-weight: 500; font-weight: 600"
                            >Recipes</span
                        ></a
                    ><a
                        href="#discover"
                        style="
                            position: relative;
                            display: flex;
                            min-height: 56px;
                            min-width: 96px;
                            flex: 1;
                            flex-direction: column;
                            align-items: center;
                            justify-content: center;
                            gap: 4px;
                            border-radius: 12px;
                            color: var(--ink-muted);
                        "
                        ><span
                            aria-hidden="true"
                            style="
                                position: absolute;
                                top: 0;
                                width: 32px;
                                height: 3px;
                                border-radius: 0 0 9999px 9999px;
                            "
                        ></span
                        ><x-import component-from-global-scope="Commise.Icon" name="compass" size="{{v16}}"></x-import
                        ><span style="font-size: 12px; line-height: 1.4; font-weight: 500">Discover</span></a
                    >
                </nav>
            </div></x-dc
        >
        <script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1074}}'>
            class Component extends DCLogic { renderVals(){ const h=window.React.createElement, C=window.Commise, noop=function(){};
             return {
              v0: 16,
              v1: 16,
              v2: 16,
              v3: 16,
              v4: 16,
              v5: 16,
              v6: {kind:'avatar',avatar:h(C.Avatar,{status:'ready',initials:'SR',label:"Profile, Sam Rivera",onPress:noop})},
              v7: h(C.SegmentedControl,{form:'route',width:'adaptive',label:'Recipes',current:"collections",segments:[{id:'mine',label:'My recipes',href:"#recipes"},{id:'collections',label:'Collections',href:"#collections"}],onSelect:noop}),
              v9: noop,
              v10: noop,
              v11: 24,
              v12: 24,
              v13: 24,
              v14: 24,
              v15: 24,
              v16: 24,
              v17: 24
             }; } }
        </script>
    </body>
</html>
