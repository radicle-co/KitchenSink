<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Discover, proposal, 834 px (mobile)</title>
        <script src="./support.js"></script>
        <link rel="stylesheet" href="ds/commise/tokens.css" />
        <link rel="stylesheet" href="ds/commise/bundle.css" />
        <script src="ds/commise/bundle.js"></script>
        <!-- PROPOSAL (owner, 2026-10-17): the pill row wraps on mobile, and the Filters button and the pills share one
             wrapping flow across the full width rather than the pills wrapping in a narrow column beside the button. -->
        <style>
            .ks-pills,
            .ks-pills > div,
            .ks-pills [role='radiogroup'][aria-label='Browse recipes'],
            .ks-pills [role='radiogroup'][aria-label='Browse recipes'] > div {
                display: contents;
            }
            .ks-pillflow {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 8px;
            }
        </style>
    </head>
    <body>
        <x-dc
            ><helmet
                ><style>
                    body {
                        margin: 0;
                    }
                    *,
                    *::before,
                    *::after {
                        box-sizing: border-box;
                    }
                </style></helmet
            >
            <div
                style="
                    width: 834px;
                    height: 1196px;
                    position: relative;
                    display: flex;
                    flex-direction: column;
                    background: var(--canvas);
                    overflow: hidden;
                "
            >
                <x-import component-from-global-scope="Commise.Native.GradientSurface" gradient="hero" style="{{fill}}"
                    ><div style="flex: 1; position: relative; display: flex; flex-direction: column; min-height: 0">
                        <div
                            style="
                                flex: 1;
                                display: flex;
                                flex-direction: column;
                                gap: 16px;
                                padding: 8px 16px 20px;
                                overflow: hidden;
                            "
                        >
                            <x-import
                                component-from-global-scope="Commise.Native.LargeTitleHeader"
                                heading-id="discover-title"
                                title="Discover"
                                action="{{action}}"
                            ></x-import>
                            <x-import
                                component-from-global-scope="Commise.Native.SearchField"
                                id="discover-search"
                                label="Search recipes"
                                label-visibility="hidden"
                                clear-label="Clear search"
                                placeholder="Search recipes"
                                value=""
                                on-change-text="{{noop}}"
                            ></x-import>
                            <!-- PROPOSAL (owner comment on the canvas, 2026-10-17): one pill row under the search bar, beside
                                 the Filters button, at every width. Trending, New, Quick and the cuisines are one choice:
                                 exactly one pill is on, and it picks the recipes listed below, which scroll vertically. -->
                            <div class="ks-pillflow">
                                <x-import
                                    component-from-global-scope="Commise.Native.Button"
                                    variant="secondary"
                                    size="sm"
                                    icon="slidersHorizontal"
                                    accessibility-label="Filters"
                                    on-press="{{noop}}"
                                    >Filters</x-import
                                >
                                <div class="ks-pills">
                                    <x-import
                                        component-from-global-scope="Commise.Native.ChipRow"
                                        mode="choice"
                                        label="Browse recipes"
                                        overflow="wrap"
                                        options="{{pillOpts}}"
                                        value="trending"
                                        on-change="{{noop}}"
                                    ></x-import>
                                </div>
                            </div>
                            <div
                                style="
                                    display: grid;
                                    grid-template-columns: repeat(3, minmax(0, 1fr));
                                    gap: 0;
                                    padding-bottom: 20px;
                                "
                            >
                                <div style="min-width: 0; padding: 0 8px 16px">
                                    <x-import
                                        component-from-global-scope="Commise.Native.RecipeDiscoveryCard"
                                        variant="grid"
                                        heading-level="{{n2}}"
                                        recipe="{{c00.recipe}}"
                                        author-username="{{c00.user}}"
                                        save-copy="{{idle}}"
                                        nutrition="{{c00.cal}}"
                                        on-select="{{noop}}"
                                        on-save="{{noop}}"
                                    ></x-import>
                                </div>
                                <div style="min-width: 0; padding: 0 8px 16px">
                                    <x-import
                                        component-from-global-scope="Commise.Native.RecipeDiscoveryCard"
                                        variant="grid"
                                        heading-level="{{n2}}"
                                        recipe="{{c01.recipe}}"
                                        author-username="{{c01.user}}"
                                        save-copy="{{idle}}"
                                        nutrition="{{c01.cal}}"
                                        on-select="{{noop}}"
                                        on-save="{{noop}}"
                                    ></x-import>
                                </div>
                                <div style="min-width: 0; padding: 0 8px 16px">
                                    <x-import
                                        component-from-global-scope="Commise.Native.RecipeDiscoveryCard"
                                        variant="grid"
                                        heading-level="{{n2}}"
                                        recipe="{{c02.recipe}}"
                                        author-username="{{c02.user}}"
                                        save-copy="{{idle}}"
                                        nutrition="{{c02.cal}}"
                                        on-select="{{noop}}"
                                        on-save="{{noop}}"
                                    ></x-import>
                                </div>
                                <div style="min-width: 0; padding: 0 8px 16px">
                                    <x-import
                                        component-from-global-scope="Commise.Native.RecipeDiscoveryCard"
                                        variant="grid"
                                        heading-level="{{n2}}"
                                        recipe="{{c03.recipe}}"
                                        author-username="{{c03.user}}"
                                        save-copy="{{idle}}"
                                        nutrition="{{c03.cal}}"
                                        on-select="{{noop}}"
                                        on-save="{{noop}}"
                                    ></x-import>
                                </div>
                                <div style="min-width: 0; padding: 0 8px 16px">
                                    <x-import
                                        component-from-global-scope="Commise.Native.RecipeDiscoveryCard"
                                        variant="grid"
                                        heading-level="{{n2}}"
                                        recipe="{{c04.recipe}}"
                                        author-username="{{c04.user}}"
                                        save-copy="{{idle}}"
                                        nutrition="{{c04.cal}}"
                                        on-select="{{noop}}"
                                        on-save="{{noop}}"
                                    ></x-import>
                                </div>
                                <div style="min-width: 0; padding: 0 8px 16px">
                                    <x-import
                                        component-from-global-scope="Commise.Native.RecipeDiscoveryCard"
                                        variant="grid"
                                        heading-level="{{n2}}"
                                        recipe="{{c05.recipe}}"
                                        author-username="{{c05.user}}"
                                        save-copy="{{idle}}"
                                        nutrition="{{c05.cal}}"
                                        on-select="{{noop}}"
                                        on-save="{{noop}}"
                                    ></x-import>
                                </div>
                            </div>
                        </div>
                    </div>
                    <x-import
                        component-from-global-scope="Commise.Native.HomeTabBar"
                        chrome="{{chrome}}"
                        live-capabilities="{{none}}"
                        active-id="discover"
                        on-press="{{noop}}"
                        bottom-inset="{{n20}}"
                        compact="{{no}}"
                        left-inset="{{n0}}"
                        right-inset="{{n0}}"
                    ></x-import>
                </x-import></div
        ></x-dc>
        <script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":834,"height":1196}}'>
            class Component extends DCLogic { renderVals(){ const h=React.createElement; const D={"carbonara": ["Spaghetti alla carbonara", "Italian", 25, "medium", 4.7, 112, 690, 4, ["pasta", "weeknight"], "nonna_lucia"], "shakshuka": ["Shakshuka with feta", "Middle Eastern", 30, "easy", 4.8, 64, 360, 3, ["eggs", "vegetarian", "brunch"], "marisol_cooks"], "curry": ["Chickpea and spinach curry", "Indian", 35, "easy", 4.6, 81, 390, 4, ["vegan", "weeknight", "legumes"], "priya_kitchen"], "ramen": ["Miso butter mushroom ramen", "Japanese", 45, "medium", 4.8, 55, 520, 2, ["noodles", "soup", "umami"], "kenji_t"], "lentil": ["Red lentil dal with crispy shallots", "Indian", 25, "easy", 4.8, 140, 340, 4, ["vegan", "weeknight", "legumes"], "priya_kitchen"], "cookies": ["Brown butter chocolate chip cookies", "American", 40, "easy", 4.9, 210, 210, 24, ["baking", "dessert", "cookies"], "jo_bakes"], "sheet": ["Harissa sheet-pan chicken", "Moroccan", 50, "easy", 4.6, 58, 520, 4, ["sheet-pan", "weeknight"], null], "risotto": ["Lemon asparagus risotto", "Italian", 40, "medium", 4.5, 31, 450, 4, ["rice", "spring", "vegetarian"], "nonna_lucia"], "banhmi": ["Lemongrass pork banh mi", "Vietnamese", 30, "medium", 4.6, 47, 640, 4, ["sandwich", "pork"], "linh_nguyen"], "bibim": ["Bibimbap with gochujang", "Korean", 50, "medium", 4.5, 26, 580, 2, ["rice", "bowl"], null], "oats": ["Overnight oats with roasted plums", "American", 10, "easy", 4.3, 18, 330, 2, ["breakfast", "make-ahead", "fruit"], "jo_bakes"], "tacos": ["Crispy fish tacos with lime slaw", "Mexican", 40, "medium", 4.5, 39, 480, 4, ["seafood", "tacos", "lime"], null], "gazpacho": ["Chilled tomato gazpacho", "Spanish", 15, "easy", 4.4, 22, 150, 4, ["soup", "vegan", "summer"], "carmen_r"]}; const C={"c00": "carbonara", "c01": "shakshuka", "c02": "curry", "c03": "ramen", "c04": "lentil", "c05": "cookies"};
            const mk=(k)=>{const [title,cuisine,mins,level,rating,count,cal,serves,tags,user]=D[k];return {recipe:{id:'r-'+k,title,totalTimeMinutes:mins,servings:serves,difficulty:level,averageRating:rating,ratingCount:count,usesPremiumCapability:false,createdAt:'2026-09-01T10:00:00.000Z',updatedAt:'2026-09-01T10:00:00.000Z',cuisine,tags,currentVersion:1,visibility:'public',status:'published'},user:user||undefined,cal:h('span',{style:{fontSize:13,color:'var(--ink-muted)'}},cal+' cal')};};
            const out={no:false,n0:0,n2:2,n20:20,none:[],noop:()=>{},fill:{flex:1},idle:{kind:'idle'},

            chrome:{destinations:{home:'Home',recipes:'Recipes',discover:'Discover','meal-plan':'Plan',grocery:'Shop'},profileButton:'Profile, {name}',profileButtonNoName:'Profile',tabNavLabel:'Tabs'},
            action:{kind:'avatar',avatar:h(window.Commise.Native.Avatar,{status:'ready',initials:'ER',label:'Profile, Eliza Ramirez',onPress:()=>{}})}};
            for(const id in C)out[id]=mk(C[id]); return out; } }
        </script>
    </body>
</html>
