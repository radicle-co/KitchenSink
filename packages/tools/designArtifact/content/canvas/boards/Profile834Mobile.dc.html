<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Profile</title>
        <script src="./support.js"></script>
        <link rel="stylesheet" href="ds/commise/tokens.css" />
        <link rel="stylesheet" href="ds/commise/bundle.css" />
        <script src="ds/commise/bundle.js"></script>
    </head>
    <body>
        <x-dc
            ><helmet
                ><style>
                    body {
                        margin: 0;
                        font-family: var(--font-body);
                        color: var(--ink);
                        width: 834px;
                        background-color: var(--canvas);
                    }
                    a {
                        color: inherit;
                        text-decoration: none;
                    }
                </style></helmet
            >
            <main
                class="wash"
                style="
                    width: 834px;
                    min-height: 1194px;
                    box-sizing: border-box;
                    background-color: var(--canvas);
                    background-image: var(--background-image-hero);
                    display: flex;
                    flex-direction: column;
                    gap: 20px;
                    padding: 8px 16px 24px;
                "
            >
                <x-import
                    component-from-global-scope="Commise.Native.LargeTitleHeader"
                    heading-id="profile-h1"
                    title="Profile"
                    back="{{back}}"
                ></x-import>
                <div style="display: flex; flex-direction: row; align-items: center; gap: 16px">
                    <div
                        aria-hidden="true"
                        style="
                            display: flex;
                            width: 72px;
                            height: 72px;
                            flex: none;
                            align-items: center;
                            justify-content: center;
                            border-radius: 9999px;
                            background: var(--action);
                            color: var(--on-action);
                            font-size: 22px;
                            font-weight: 600;
                        "
                    >
                        AR
                    </div>
                    <div
                        style="
                            display: flex;
                            min-width: 0;
                            flex: 1;
                            flex-direction: column;
                            gap: 4px;
                            align-items: flex-start;
                        "
                    >
                        <span style="font-size: 18px; font-weight: 600; line-height: 1.25; color: var(--ink)"
                            >Ana Ruiz</span
                        ><span style="font-size: 14px; line-height: 1.4; color: var(--ink)">@anaruiz</span
                        ><span style="font-size: 14px; line-height: 1.4; color: var(--ink-muted)"
                            >ana.ruiz@example.com</span
                        >
                    </div>
                </div>
                <x-import component-from-global-scope="Commise.Native.ProfileGroup"
                    ><x-import
                        component-from-global-scope="Commise.Native.ProfileRow"
                        label="Display name"
                        value="Ana Ruiz"
                        tone="ink"
                        chevron="{{yes}}"
                        on-press="{{noop}}"
                    ></x-import
                ></x-import>
                <x-import component-from-global-scope="Commise.Native.ProfileGroup" heading="Preferences"
                    ><x-import
                        component-from-global-scope="Commise.Native.ProfileRow"
                        label="Food data sources"
                        tone="ink"
                        chevron="{{yes}}"
                        on-press="{{noop}}"
                    ></x-import
                ></x-import>
                <x-import component-from-global-scope="Commise.Native.ProfileGroup"
                    ><x-import
                        component-from-global-scope="Commise.Native.ProfileRow"
                        label="Sign out"
                        tone="ink"
                        chevron="{{no}}"
                        on-press="{{noop}}"
                    ></x-import
                ></x-import>
                <x-import component-from-global-scope="Commise.Native.ProfileGroup" heading="Danger zone"
                    ><x-import
                        component-from-global-scope="Commise.Native.ProfileRow"
                        label="Close account"
                        hint="Signs you out and deactivates your account. Support can restore it."
                        tone="danger"
                        chevron="{{yes}}"
                        on-press="{{noop}}"
                    ></x-import
                    ><x-import
                        component-from-global-scope="Commise.Native.ProfileRow"
                        label="Erase my data"
                        hint="Permanently deletes your account and personal data."
                        tone="danger"
                        chevron="{{yes}}"
                        on-press="{{noop}}"
                    ></x-import
                ></x-import>
            </main>
        </x-dc>
        <script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":834,"height":1194}}'>
            class Component extends DCLogic { renderVals(){ return { yes:true, no:false, noop:function(){}, back:{ label:'Back', parent:'Home', onPress:function(){} } }; } }
        </script>
    </body>
</html>
