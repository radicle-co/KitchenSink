<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Profile, photo, proposal (web)</title>
        <script src="./support.js"></script>
        <link rel="stylesheet" href="ds/commise/tokens.css" />
        <link rel="stylesheet" href="ds/commise/bundle.css" />
        <script src="ds/commise/bundle.js"></script>
    </head>
    <body>
        <x-dc
            ><helmet
                ><style>
                    body {
                        margin: 0;
                        background: var(--canvas);
                        color: var(--ink);
                        font-family: var(--font-body);
                    }
                    a {
                        color: inherit;
                        text-decoration: none;
                    }
                    .sb {
                        display: none;
                    }
                    @media (min-width: 840px) {
                        .sb {
                            display: flex;
                        }
                    }
                    .cap {
                        margin: 0;
                        padding: 0 24px;
                        font: 500 12px/1.4 var(--font-body);
                        color: var(--ink-muted);
                    }
                    .pg {
                        display: flex;
                        flex-direction: column;
                        gap: 32px;
                        padding: 16px 0 24px;
                    }
                    .fg {
                        display: flex;
                        flex-direction: column;
                        gap: 8px;
                    }
                    .pagef {
                        position: relative;
                        border-top: 1px solid var(--line-divider);
                        border-bottom: 1px solid var(--line-divider);
                        background-color: var(--canvas);
                        background-image: var(--background-image-hero);
                        overflow: hidden;
                    }
                    .crop {
                        border-top: 1px solid var(--line-divider);
                        border-bottom: 1px solid var(--line-divider);
                        background-color: var(--canvas);
                        background-image: var(--background-image-hero);
                        padding: 24px 32px;
                        box-sizing: border-box;
                    }
                    .crop > .col {
                        margin: 0 auto;
                        display: flex;
                        width: 100%;
                        max-width: 640px;
                        flex-direction: column;
                        gap: 24px;
                    }
                    .stage {
                        position: relative;
                        display: flex;
                        justify-content: center;
                        align-items: center;
                        height: 600px;
                        overflow: hidden;
                        border-top: 1px solid var(--line-divider);
                        border-bottom: 1px solid var(--line-divider);
                        background: var(--canvas);
                        transform: translateZ(0);
                    }
                    .stage .bg {
                        position: absolute;
                        inset: 0;
                        overflow: hidden;
                        background-color: var(--canvas);
                        background-image: var(--background-image-hero);
                    }
                    .scrim {
                        position: absolute;
                        inset: 0;
                        background: var(--scrim);
                    }
                    .sheet {
                        position: relative;
                        display: flex;
                        flex-direction: column;
                        width: 100%;
                        max-width: 512px;
                        background: var(--paper-overlay);
                        border-radius: 16px;
                        box-shadow: var(--shadow-lg);
                    }
                    .trow {
                        display: flex;
                        align-items: flex-start;
                        gap: 8px;
                        padding: 8px 8px 0 24px;
                    }
                    .ttl {
                        flex: 1;
                        min-width: 0;
                        margin: 0;
                        padding-top: 12px;
                        font: 600 17px/1.2 var(--font-body);
                        color: var(--ink);
                    }
                    .cls {
                        display: flex;
                        flex-shrink: 0;
                        align-items: center;
                        justify-content: center;
                        width: 48px;
                        height: 48px;
                        border-radius: 9999px;
                        color: var(--ink-muted);
                    }
                    .sbody {
                        padding: 16px 24px;
                    }
                    .foot {
                        border-top: 1px solid var(--line-divider);
                        padding: 16px 24px;
                    }
                </style></helmet
            >
            <div class="pg">
                <div class="fg">
                    <p class="cap">
                        No avatar on web. The Profile page has no way to change the photo here: the disc shows initials
                        and is not a control. Changing the photo is a mobile feature.
                    </p>
                    <div class="crop">
                        <div class="col">
                            <div style="display: flex; align-items: center; gap: 16px">
                                <span
                                    aria-hidden="true"
                                    style="
                                        display: flex;
                                        width: 72px;
                                        height: 72px;
                                        flex-shrink: 0;
                                        align-items: center;
                                        justify-content: center;
                                        border-radius: 9999px;
                                        background: var(--action);
                                        color: var(--on-action);
                                        font-size: 20px;
                                        font-weight: 600;
                                        line-height: 1.2;
                                    "
                                    >AR</span
                                >
                                <div style="display: flex; min-width: 0; flex-direction: column">
                                    <p
                                        style="
                                            margin: 0;
                                            font-size: 18px;
                                            font-weight: 600;
                                            line-height: 1.25;
                                            color: var(--ink);
                                            overflow-wrap: anywhere;
                                        "
                                    >
                                        Ana Ruiz
                                    </p>
                                    <p
                                        style="
                                            margin: 0;
                                            font-size: 14px;
                                            line-height: 1.4;
                                            color: var(--ink);
                                            overflow-wrap: anywhere;
                                        "
                                    >
                                        @anaruiz
                                    </p>
                                    <p
                                        style="
                                            margin: 0;
                                            font-size: 14px;
                                            line-height: 1.4;
                                            color: var(--ink-muted);
                                            overflow-wrap: anywhere;
                                        "
                                    >
                                        ana.ruiz@example.com
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div></x-dc
        >
        <script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":188}}'>
            class Component extends DCLogic { renderVals(){ const noop=function(){}; return { yes:true, no:false, noop:noop, back:{ label:'Back to Home', parent:'Home', onPress:noop, href:'#' } }; } }
        </script>
    </body>
</html>
