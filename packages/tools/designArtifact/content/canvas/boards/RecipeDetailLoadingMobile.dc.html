<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Recipe detail, loading (mobile)</title>
        <script src="./support.js"></script>
        <link rel="stylesheet" href="ds/commise/tokens.css" />
        <link rel="stylesheet" href="ds/commise/bundle.css" />
        <script src="ds/commise/bundle.js"></script>
    </head>
    <body>
        <x-dc
            ><helmet
                ><style>
                    body {
                        margin: 0;
                        font-family: var(--font-body);
                        color: var(--ink);
                    }
                    *,
                    *::before,
                    *::after {
                        box-sizing: border-box;
                    }
                    .m-page {
                        width: 390px;
                        background: var(--canvas);
                        color: var(--ink);
                        font-family: var(--font-body);
                        display: flex;
                        flex-direction: column;
                        position: relative;
                    }
                    .m-col {
                        display: flex;
                        flex-direction: column;
                        gap: 28px;
                        padding-bottom: 40px;
                    }
                    .m-pad {
                        padding: 0 16px;
                    }
                    .m-head {
                        display: flex;
                        flex-direction: column;
                        gap: 20px;
                        padding: 0 16px;
                    }
                    .m-title-group {
                        display: flex;
                        flex-direction: column;
                        gap: 8px;
                    }
                    .m-overline {
                        font: 600 11px/1.4 var(--font-body);
                        letter-spacing: 0.06em;
                        text-transform: uppercase;
                        color: var(--ink-muted);
                    }
                    .m-title {
                        margin: 0;
                        display: -webkit-box;
                        -webkit-line-clamp: 3;
                        -webkit-box-orient: vertical;
                        overflow: hidden;
                        font: 700 28px/1.15 var(--font-display);
                        color: var(--ink);
                    }
                    .m-facts {
                        display: flex;
                        flex-wrap: wrap;
                        align-items: center;
                        gap: 0 16px;
                        font: 400 13px/1.4 var(--font-body);
                        color: var(--ink-muted);
                    }
                    .m-fact {
                        display: inline-flex;
                        min-height: 28px;
                        align-items: center;
                        gap: 4px;
                    }
                    .m-fact-link {
                        display: inline-flex;
                        min-height: 44px;
                        align-items: center;
                        gap: 4px;
                        color: var(--action-text);
                        font: 600 13px/1.4 var(--font-body);
                        text-decoration: none;
                    }
                    .m-strip {
                        display: flex;
                        border-radius: var(--radius-lg);
                        border: 1px solid var(--line-divider);
                        background: var(--paper);
                        padding: 8px 0;
                        box-shadow: var(--shadow-sm);
                    }
                    .m-cell {
                        flex: 1 1 0;
                        min-width: 0;
                        display: flex;
                        flex-direction: column;
                        align-items: flex-start;
                        gap: 6px;
                        padding: 6px 12px;
                    }
                    .m-cell + .m-cell {
                        border-left: 1px solid var(--line-divider);
                    }
                    .m-cell-value {
                        font: 600 17px/1.2 var(--font-body);
                        font-variant-numeric: tabular-nums lining-nums;
                        color: var(--ink);
                        white-space: nowrap;
                    }
                    .m-cell-label {
                        font: 500 12px/1.4 var(--font-body);
                        color: var(--ink-muted);
                    }
                    .m-desc {
                        margin: 0;
                        display: -webkit-box;
                        -webkit-line-clamp: 4;
                        -webkit-box-orient: vertical;
                        overflow: hidden;
                        font: 400 18px/1.6 var(--font-body);
                        color: var(--ink);
                    }
                    .m-caption {
                        margin: 0;
                        font: 500 12px/1.4 var(--font-body);
                        color: var(--ink-muted);
                    }
                    .m-h2 {
                        margin: 0;
                        font: 600 18px/1.25 var(--font-body);
                        color: var(--ink);
                    }
                    .m-rate {
                        display: flex;
                        flex-direction: column;
                        gap: 6px;
                    }
                    .m-stars {
                        display: flex;
                        align-items: center;
                        gap: 8px;
                        font: 400 14px/1.4 var(--font-body);
                        color: var(--ink-muted);
                    }
                    .m-star-btn {
                        display: flex;
                        width: 44px;
                        height: 44px;
                        align-items: center;
                        justify-content: center;
                        border: 0;
                        padding: 0;
                        background: transparent;
                    }
                    .m-comments-link {
                        display: inline-flex;
                        align-self: flex-start;
                        min-height: 44px;
                        align-items: center;
                        gap: 4px;
                        color: var(--action-text);
                        font: 600 14px/1.4 var(--font-body);
                        text-decoration: none;
                    }
                    .m-acc-card {
                        border: 1px solid var(--line-divider);
                        border-radius: var(--radius-lg);
                        background: var(--paper);
                        box-shadow: var(--shadow-sm);
                        overflow: hidden;
                    }
                    .m-acc-panel {
                        display: flex;
                        flex-direction: column;
                        gap: 8px;
                        padding: 4px 16px 8px;
                        border-top: 1px solid var(--line-divider);
                    }
                    .m-nut {
                        margin: 0;
                        padding-top: 12px;
                        display: grid;
                        grid-template-columns: repeat(4, minmax(0, 1fr));
                        gap: 8px;
                    }
                    .m-nut div {
                        display: flex;
                        flex-direction: column-reverse;
                        gap: 2px;
                    }
                    .m-nut dt {
                        font: 500 12px/1.4 var(--font-body);
                        color: var(--ink-muted);
                    }
                    .m-nut dd {
                        margin: 0;
                        font: 600 16px/1.3 var(--font-body);
                        font-variant-numeric: tabular-nums lining-nums;
                        color: var(--ink);
                    }
                    .m-note-link {
                        display: inline-flex;
                        min-height: 44px;
                        align-items: center;
                        color: var(--action-text);
                        text-decoration: underline;
                        text-underline-offset: 2px;
                    }
                    .m-acc {
                        display: flex;
                        width: 100%;
                        min-height: 56px;
                        align-items: center;
                        gap: 8px;
                        border: 0;
                        background: transparent;
                        padding: 8px 12px 8px 16px;
                        font: 600 16px/1.3 var(--font-body);
                        color: var(--ink);
                        text-align: start;
                    }
                    .m-acc-sum {
                        margin-inline-start: auto;
                        font: 400 14px/1.4 var(--font-body);
                        color: var(--ink-muted);
                        font-variant-numeric: tabular-nums lining-nums;
                    }
                    .m-sec {
                        display: flex;
                        flex-direction: column;
                        gap: 16px;
                        padding: 0 16px;
                    }
                    .m-sec-head {
                        display: flex;
                        flex-wrap: wrap;
                        align-items: center;
                        justify-content: space-between;
                        gap: 8px;
                    }
                    .m-group-label {
                        padding-top: 8px;
                        font: 600 11px/1.4 var(--font-body);
                        letter-spacing: 0.06em;
                        text-transform: uppercase;
                        color: var(--ink-muted);
                    }
                    .m-line {
                        display: flex;
                        min-height: 48px;
                        align-items: flex-start;
                        gap: 12px;
                        padding: 12px;
                        border-radius: var(--radius-md);
                    }
                    .m-line-text {
                        flex: 1;
                        min-width: 0;
                        display: flex;
                        flex-direction: column;
                        align-items: flex-start;
                        gap: 4px;
                        color: var(--ink);
                    }
                    .m-line[aria-checked='true'] .m-line-text {
                        color: var(--ink-muted);
                    }
                    .m-line-main {
                        font: 400 16px/1.5 var(--font-body);
                    }
                    .m-line-main b {
                        font-weight: 600;
                        font-variant-numeric: tabular-nums lining-nums;
                    }
                    .m-line-sub {
                        font: 400 14px/1.4 var(--font-body);
                        color: var(--ink-muted);
                    }
                    .m-steplist {
                        display: flex;
                        flex-direction: column;
                        gap: 24px;
                    }
                    .m-step {
                        position: relative;
                        display: flex;
                        align-items: flex-start;
                        gap: 12px;
                        padding-inline-start: 12px;
                    }
                    .m-step-bar {
                        position: absolute;
                        top: 0;
                        bottom: 0;
                        left: 0;
                        width: 3px;
                        border-radius: 2px;
                        background: var(--here-bar);
                    }
                    .m-step-num {
                        width: 44px;
                        height: 44px;
                        flex-shrink: 0;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                    }
                    .m-step-num span {
                        width: 32px;
                        height: 32px;
                        border-radius: 16px;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        font: 600 14px/1.2 var(--font-body);
                        background: var(--selected-fill);
                        color: var(--ink);
                    }
                    .m-step-num[aria-pressed='true'] span {
                        background: var(--action);
                        color: var(--on-action);
                    }
                    .m-step-body {
                        flex: 1;
                        min-width: 0;
                        display: flex;
                        flex-direction: column;
                        gap: 8px;
                        padding-top: 8px;
                    }
                    .m-step-body p {
                        margin: 0;
                        font: 400 18px/1.6 var(--font-body);
                        color: var(--ink);
                    }
                    .m-timer {
                        display: inline-flex;
                        align-self: flex-start;
                        align-items: center;
                        gap: 4px;
                        border-radius: var(--radius-sm);
                        background: var(--surface-muted);
                        padding: 2px 8px;
                        font: 400 14px/1.4 var(--font-body);
                        color: var(--ink);
                    }
                    .m-pin {
                        position: relative;
                        z-index: 30;
                        display: flex;
                        min-height: 60px;
                        align-items: center;
                        gap: 8px;
                        padding: 8px 8px 8px 16px;
                        background: var(--paper);
                        border-bottom: 1px solid var(--line-divider);
                        box-shadow: var(--shadow-sm);
                    }
                    .m-pin-title {
                        flex: 1;
                        min-width: 0;
                        font: 600 16px/1.3 var(--font-body);
                        color: var(--ink);
                        white-space: nowrap;
                    }
                    .m-pin-title span {
                        font: 400 14px/1.4 var(--font-body);
                        color: var(--ink-muted);
                    }
                    .m-icon-btn {
                        display: flex;
                        width: 44px;
                        height: 44px;
                        flex-shrink: 0;
                        align-items: center;
                        justify-content: center;
                        border: 0;
                        border-radius: 9999px;
                        background: transparent;
                        padding: 0;
                    }
                    .m-scrim {
                        position: absolute;
                        left: 0;
                        right: 0;
                        bottom: 0;
                        z-index: 20;
                        background: var(--scrim);
                    }
                    .m-drop {
                        position: absolute;
                        left: 0;
                        right: 0;
                        z-index: 25;
                        max-height: 588px;
                        overflow-y: auto;
                        padding: 4px 16px 16px;
                        background: var(--paper);
                        border-radius: 0 0 var(--radius-xl) var(--radius-xl);
                        box-shadow: var(--shadow-lg);
                    }

                    .m-x {
                        display: flex;
                        flex-direction: column;
                        gap: 20px;
                        padding: 16px 0 40px;
                    }
                    .m-note {
                        margin: 0;
                        padding: 0 16px;
                        font: 500 12px/1.4 var(--font-body);
                        color: var(--ink-muted);
                    }
                    .m-xsec {
                        display: flex;
                        flex-direction: column;
                        gap: 12px;
                        padding: 0 16px;
                    }
                    .m-xtitle {
                        margin: 0;
                        padding: 0 16px;
                        font: 700 28px/1.15 var(--font-display);
                        color: var(--ink);
                    }
                    .m-scale {
                        display: flex;
                        flex-direction: column;
                        align-items: flex-start;
                        gap: 4px;
                        border-radius: var(--radius-md);
                        background: var(--surface-muted);
                        padding: 8px 12px;
                    }
                    .m-scale p {
                        margin: 0;
                        font: 400 14px/1.4 var(--font-body);
                        color: var(--ink);
                    }
                    .m-tile {
                        margin: 0;
                        border-radius: var(--radius-md);
                        background: var(--attention-tint);
                        padding: 8px 12px;
                        font: 400 14px/1.4 var(--font-body);
                        color: var(--ink);
                    }
                    .m-empty {
                        display: flex;
                        flex-direction: column;
                        align-items: flex-start;
                        gap: 8px;
                        padding: 8px 0;
                    }
                    .m-empty p {
                        margin: 0;
                        font: 400 16px/1.5 var(--font-body);
                        color: var(--ink-muted);
                    }
                    .m-xmeta {
                        margin: 0;
                        font: 400 14px/1.4 var(--font-body);
                        color: var(--ink-muted);
                    }
                    .m-xcap {
                        margin: 0;
                        font: 500 12px/1.4 var(--font-body);
                        color: var(--ink-muted);
                    }
                    .m-nutgrid {
                        display: flex;
                        flex-wrap: wrap;
                        row-gap: 16px;
                    }
                    .m-nutgrid > * {
                        flex-basis: 50%;
                        box-sizing: border-box;
                    }
                    .m-frame {
                        display: flex;
                        flex-direction: column;
                        gap: 12px;
                        border: 1px dashed var(--line-divider);
                        border-radius: var(--radius-lg);
                        padding: 12px;
                        margin: 0 16px;
                    }
                    .m-frame-cap {
                        margin: 0;
                        font: 600 12px/1.4 var(--font-body);
                        letter-spacing: 0.04em;
                        text-transform: uppercase;
                        color: var(--ink-muted);
                    }
                    .m-review {
                        display: flex;
                        align-items: center;
                        gap: 8px;
                        border: 1px solid var(--line-divider);
                        border-radius: 12px;
                        background: var(--paper);
                        padding: 12px;
                    }
                    .m-review span.t {
                        flex: 1;
                        font: 500 13px/1.4 var(--font-body);
                        color: var(--ink);
                    }
                    .m-pill {
                        flex-shrink: 0;
                        border-radius: 9999px;
                        padding: 4px 10px;
                        font: 600 12px/1.4 var(--font-body);
                        color: var(--action-text);
                        background: color-mix(in srgb, var(--action) 10%, transparent);
                    }
                    .m-banner {
                        display: flex;
                        align-items: flex-start;
                        gap: 10px;
                        border-radius: 12px;
                        background: var(--attention-tint);
                        padding: 12px;
                    }
                    .m-banner p {
                        flex: 1;
                        margin: 0;
                        font: 400 13px/1.4 var(--font-body);
                        color: var(--ink);
                    }
                    .m-dismiss {
                        flex-shrink: 0;
                        min-height: 48px;
                        display: flex;
                        align-items: center;
                        padding: 0 12px;
                        border-radius: 9999px;
                        color: var(--action-text);
                        background: color-mix(in srgb, var(--action) 10%, transparent);
                        font: 400 14px/1.4 var(--font-body);
                    }
                    .m-badges {
                        display: flex;
                        flex-direction: column;
                        align-items: flex-start;
                        gap: 4px;
                    }
                    .m-skel {
                        background: var(--surface-muted);
                    }
                    .m-strip2 {
                        margin: 0 16px;
                        display: flex;
                        flex-wrap: wrap;
                        border: 1px solid var(--line-divider);
                        border-radius: var(--radius-lg);
                        background: var(--paper);
                        padding: 8px 0;
                        box-shadow: var(--shadow-sm);
                    }
                    .m-cell2 {
                        flex-basis: 50%;
                        box-sizing: border-box;
                        display: flex;
                        flex-direction: column;
                        align-items: flex-start;
                        gap: 4px;
                        padding: 8px 12px;
                    }
                    .m-cell2 .v {
                        font: 600 20px/1.2 var(--font-body);
                        font-variant-numeric: tabular-nums lining-nums;
                        color: var(--ink);
                    }
                    .m-cell2 .l {
                        font: 500 12px/1.4 var(--font-body);
                        color: var(--ink-muted);
                    }
                </style></helmet
            >
            <div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--canvas)">
                <div class="m-page" style="height: 844px; overflow: hidden">
                    <div style="display: flex; flex-direction: column; gap: 24px">
                        <p class="m-xcap" style="padding: 16px 16px 0; font: 400 12px/1.4 var(--font-body)">
                            Loading recipe…
                        </p>
                        <div
                            class="m-skel"
                            style="width: 100%; aspect-ratio: 4/3; border-radius: var(--radius-lg)"
                        ></div>
                        <div style="display: flex; flex-direction: column; gap: 12px; padding: 0 16px">
                            <div class="m-skel" style="height: 20px; width: 33%; border-radius: var(--radius-md)"></div>
                            <div class="m-skel" style="height: 36px; border-radius: var(--radius-md)"></div>
                            <div class="m-skel" style="height: 36px; width: 66%; border-radius: var(--radius-md)"></div>
                            <div class="m-skel" style="height: 80px; border-radius: var(--radius-lg)"></div>
                            <div class="m-skel" style="height: 44px; width: 50%; border-radius: var(--radius-lg)"></div>
                        </div>
                        <div style="display: flex; flex-direction: column; gap: 12px; padding: 0 16px">
                            <div class="m-skel" style="height: 24px; width: 35%; border-radius: var(--radius-md)"></div>
                            <div
                                class="m-skel"
                                style="height: 20px; width: 100%; border-radius: var(--radius-md)"
                            ></div>
                            <div
                                class="m-skel"
                                style="height: 20px; width: 100%; border-radius: var(--radius-md)"
                            ></div>
                            <div
                                class="m-skel"
                                style="height: 20px; width: 100%; border-radius: var(--radius-md)"
                            ></div>
                            <div class="m-skel" style="height: 20px; width: 66%; border-radius: var(--radius-md)"></div>
                        </div>
                    </div>
                </div>
                <div style="position: absolute; left: 0; right: 0; bottom: 0">
                    <x-import
                        component-from-global-scope="Commise.Native.HomeTabBar"
                        chrome="{{chrome}}"
                        live-capabilities="{{none}}"
                        active-id="recipes"
                        on-press="{{noop}}"
                        bottom-inset="{{inset}}"
                        compact="{{no}}"
                        left-inset="{{zero}}"
                        right-inset="{{zero}}"
                    ></x-import>
                </div></div
        ></x-dc>
        <script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
            class Component extends DCLogic { renderVals(){ const h=window.React.createElement, C=window.Commise.Native, noop=function(){}; return {secs:["ingredients","steps","nutrition"],sections:[{id:"ingredients",label:"Ingredients"},{id:"steps",label:"Steps"},{id:"nutrition",label:"Nutrition"}],screenOn:h(C.KeepAwakeToggle,{on:false,onChange:noop,label:"Screen on",display:"icon"}),yes:true,no:false,noop:noop,announce(n){return "Amounts for "+n+" servings."},none:[],inset:34,zero:0,chrome:{destinations:{home:'Home',recipes:'Recipes',discover:'Discover','meal-plan':'Plan',grocery:'Shop'},profileButton:'Profile, {name}',profileButtonNoName:'Profile',tabNavLabel:'Tabs'},}; } }
        </script>
    </body>
</html>
