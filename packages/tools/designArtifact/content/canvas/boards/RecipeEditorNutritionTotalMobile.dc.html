<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Recipe editor, nutrition total states (mobile)</title>
        <script src="./support.js"></script>
        <link rel="stylesheet" href="ds/commise/tokens.css" />
        <link rel="stylesheet" href="ds/commise/bundle.css" />
        <script src="ds/commise/bundle.js"></script>
    </head>
    <body>
        <x-dc
            ><helmet
                ><style>
                    body {
                        margin: 0;
                        background: var(--canvas);
                        color: var(--ink);
                        font-family: var(--font-body);
                    }
                    p,
                    figure,
                    figcaption,
                    h1 {
                        margin: 0;
                    }
                    * {
                        box-sizing: border-box;
                    }
                </style></helmet
            >
            <div style="display: flex; flex-direction: column; gap: 24px; padding: 24px 16px">
                <figure style="display: flex; flex-direction: column; gap: 8px">
                    <figcaption style="font: 600 12px/1.4 var(--font-body); color: var(--ink-muted)">
                        Nothing counted
                    </figcaption>
                    <div style="background: var(--surface-muted); border-radius: 12px; padding: 12px 16px">
                        <p
                            style="
                                font: 600 14px/1.4 var(--font-body);
                                color: var(--ink);
                                font-variant-numeric: tabular-nums;
                            "
                        >
                            Nutrition appears as you match ingredients.
                        </p>
                    </div>
                </figure>
                <figure style="display: flex; flex-direction: column; gap: 8px">
                    <figcaption style="font: 600 12px/1.4 var(--font-body); color: var(--ink-muted)">
                        Loading (a still bar; read aloud as “Loading nutrition…”)
                    </figcaption>
                    <div style="background: var(--surface-muted); border-radius: 12px; padding: 12px 16px">
                        <p role="status">
                            <span
                                style="
                                    position: absolute;
                                    width: 1px;
                                    height: 1px;
                                    overflow: hidden;
                                    clip: rect(0 0 0 0);
                                "
                                >Loading nutrition…</span
                            ><span
                                aria-hidden="true"
                                style="
                                    display: block;
                                    height: 16px;
                                    width: 192px;
                                    max-width: 100%;
                                    border-radius: var(--radius-sm);
                                    background: var(--surface-muted);
                                "
                            ></span>
                        </p>
                    </div>
                </figure>
                <figure style="display: flex; flex-direction: column; gap: 8px">
                    <figcaption style="font: 600 12px/1.4 var(--font-body); color: var(--ink-muted)">Failed</figcaption>
                    <div style="background: var(--surface-muted); border-radius: 12px; padding: 12px 16px">
                        <div style="display: flex; flex-direction: column; gap: 4px">
                            <p style="font: 500 12px/1.4 var(--font-body); color: var(--ink-muted)">
                                We couldn’t load the nutrition just now. Try again.
                            </p>
                            <div style="display: flex; flex-direction: row">
                                <x-import
                                    component-from-global-scope="Commise.Native.Button"
                                    variant="secondary"
                                    icon="refreshCw"
                                    on-press="{{noop}}"
                                    >Try again</x-import
                                >
                            </div>
                        </div>
                    </div>
                </figure>
                <figure style="display: flex; flex-direction: column; gap: 8px">
                    <figcaption style="font: 600 12px/1.4 var(--font-body); color: var(--ink-muted)">
                        Counted, from a range
                    </figcaption>
                    <div style="background: var(--surface-muted); border-radius: 12px; padding: 12px 16px">
                        <div style="display: flex; flex-direction: column; gap: 4px">
                            <p
                                style="
                                    font: 600 14px/1.4 var(--font-body);
                                    color: var(--ink);
                                    font-variant-numeric: tabular-nums;
                                "
                            >
                                548 cal per serving · 7 of 9 counted
                            </p>
                            <p style="font: 500 12px/1.4 var(--font-body); color: var(--ink-muted)">
                                Estimated from the lower amount of each stated range
                            </p>
                        </div>
                    </div>
                </figure>
            </div></x-dc
        >
        <script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":456}}'>
            class Component extends DCLogic { renderVals(){ const noop=()=>{}; return {noop}; } }
        </script>
    </body>
</html>
