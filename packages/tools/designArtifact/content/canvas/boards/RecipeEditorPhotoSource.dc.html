<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Recipe editor, add photos sheet (web)</title>
        <script src="./support.js"></script>
        <link rel="stylesheet" href="ds/commise/tokens.css" />
        <link rel="stylesheet" href="ds/commise/bundle.css" />
        <script src="ds/commise/bundle.js"></script>
    </head>
    <body>
        <x-dc
            ><helmet
                ><style>
                    body {
                        margin: 0;
                        background: var(--canvas);
                        color: var(--ink);
                        font: 400 16px/1.5 var(--font-body);
                    }
                    * {
                        box-sizing: border-box;
                    }
                    h2,
                    h3,
                    p,
                    ul {
                        margin: 0;
                    }
                    ul {
                        padding: 0;
                        list-style: none;
                    }
                    .cap {
                        font: 500 12px/1.4 var(--font-body);
                        color: var(--ink-muted);
                        margin-bottom: 8px;
                    }
                    .h3 {
                        font: 600 14px/1.2 var(--font-body);
                        color: var(--ink-muted);
                    }
                    .body {
                        font: 400 14px/1.5 var(--font-body);
                        color: var(--ink-muted);
                    }
                    .hint {
                        font: 500 12px/1.4 var(--font-body);
                        color: var(--ink-muted);
                    }
                    .alert {
                        font: 500 14px/1.4 var(--font-body);
                        color: var(--danger-text);
                    }
                    .cluster {
                        display: flex;
                        flex-direction: column;
                        gap: 12px;
                    }
                    .page {
                        display: grid;
                        grid-template-columns: repeat(2, 600px);
                        column-gap: 40px;
                        row-gap: 40px;
                        padding: 32px 20px 40px;
                        align-items: start;
                    }
                    .stage {
                        width: 600px;
                    }
                    .pm-cont {
                        container-type: inline-size;
                    }
                    .pm-grid {
                        display: grid;
                        grid-template-columns: repeat(2, minmax(0, 1fr));
                        gap: 12px;
                    }
                    @container (min-width: 480px) {
                        .pm-grid {
                            grid-template-columns: repeat(3, minmax(0, 1fr));
                        }
                    }
                    @container (min-width: 600px) {
                        .pm-grid {
                            grid-template-columns: repeat(4, minmax(0, 1fr));
                        }
                    }
                    .pm-tile {
                        position: relative;
                        align-self: start;
                    }
                    .pm-img {
                        position: relative;
                        overflow: hidden;
                        aspect-ratio: 1 / 1;
                        border-radius: var(--radius-xl);
                        box-shadow: 0 0 0 1px var(--line-divider);
                    }
                    .pm-q {
                        position: relative;
                        display: flex;
                        flex-direction: column;
                        align-items: center;
                        justify-content: center;
                        gap: 8px;
                        overflow: hidden;
                        aspect-ratio: 1 / 1;
                        border-radius: var(--radius-xl);
                        background: var(--surface-muted);
                        box-shadow: 0 0 0 1px var(--line-divider);
                    }
                    .pm-fill {
                        position: absolute;
                        inset: 0;
                    }
                    .pm-menu {
                        position: absolute;
                        top: 4px;
                        right: 4px;
                    }
                    .pm-cover {
                        position: absolute;
                        bottom: 8px;
                        left: 8px;
                        border-radius: 999px;
                        background: var(--action);
                        padding: 4px 8px;
                        font: 600 12px/1.4 var(--font-body);
                        color: var(--on-action);
                    }
                    .pm-removing {
                        position: absolute;
                        left: 8px;
                        right: 8px;
                        bottom: 8px;
                        border-radius: 999px;
                        background: var(--photo-chip);
                        padding: 4px 8px;
                        text-align: center;
                        font: 500 12px/1.4 var(--font-body);
                        color: var(--ink);
                    }
                    .pm-status {
                        position: relative;
                        border-radius: 999px;
                        padding: 4px 8px;
                        font: 500 12px/1.4 var(--font-body);
                        background: var(--photo-chip);
                        color: var(--ink);
                    }
                    .pm-status.bad {
                        background: var(--danger);
                        color: var(--on-action);
                    }
                    .pm-retry {
                        position: relative;
                        width: 100%;
                        padding: 0 8px;
                    }
                    .pm-err {
                        padding: 0 4px;
                        font: 500 12px/1.4 var(--font-body);
                        color: var(--danger-text);
                    }
                    .pm-pop {
                        position: absolute;
                        top: 52px;
                        right: 4px;
                        z-index: 50;
                        min-width: 12rem;
                        padding: 4px;
                        border-radius: var(--radius-lg);
                        background: var(--paper-overlay);
                        box-shadow: var(--shadow-lg);
                    }
                    .pm-mi {
                        display: flex;
                        min-height: 44px;
                        align-items: center;
                        gap: 8px;
                        padding: 0 12px;
                        border-radius: var(--radius-md);
                        font: 400 16px/1.5 var(--font-body);
                        color: var(--ink);
                        white-space: nowrap;
                    }
                    .pm-mi.danger {
                        color: var(--danger-text);
                    }
                    .pm-sep {
                        height: 1px;
                        margin: 4px 0;
                        background: var(--line-divider);
                    }
                    .msgs {
                        display: flex;
                        flex-direction: column;
                        gap: 12px;
                    }
                    .msg {
                        display: flex;
                        flex-direction: column;
                        gap: 4px;
                        padding-top: 12px;
                        border-top: 1px solid var(--line-divider);
                    }
                    .msg:first-child {
                        padding-top: 0;
                        border-top: 0;
                    }
                </style></helmet
            >
            <main class="page" style="grid-template-columns: 600px">
                <section
                    class="fig"
                    aria-label="Web uses the browser's file picker. The source sheet and the camera messages are mobile only."
                >
                    <p class="cap">
                        Web uses the browser's file picker. The source sheet and the camera messages are mobile only.
                    </p>
                    <div class="stage">
                        <div class="cluster">
                            <p class="hint">JPEG, PNG, or WebP · max 5 MB</p>
                            <div style="display: flex; align-self: flex-start">
                                <x-import
                                    component-from-global-scope="Commise.Button"
                                    variant="secondary"
                                    icon="imagePlus"
                                    >Add photos</x-import
                                >
                            </div>
                        </div>
                    </div>
                </section>
            </main>
        </x-dc>
        <script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":168}}'>
            class Component extends DCLogic { renderVals(){ const noop=()=>{}; return {noop,yes:true,one:1,jItems:[{id:'setCover',label:"Set as cover",onSelect:noop},{id:'moveEarlier',label:"Move earlier",onSelect:noop},{id:'moveLater',label:"Move later",onSelect:noop},{id:'replace',label:"Replace",onSelect:noop}],jItemsCover:[{id:'setCover',label:"Set as cover",onSelect:noop,disabled:true},{id:'moveEarlier',label:"Move earlier",onSelect:noop,disabled:true},{id:'moveLater',label:"Move later",onSelect:noop},{id:'replace',label:"Replace",onSelect:noop}],jNone:[],jRemove:{id:'remove',label:"Remove",onSelect:noop},}; } }
        </script>
    </body>
</html>
