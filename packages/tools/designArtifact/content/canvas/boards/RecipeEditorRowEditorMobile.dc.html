<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Recipe editor, edit an ingredient (mobile)</title>
        <script src="./support.js"></script>
        <link rel="stylesheet" href="ds/commise/tokens.css" />
        <link rel="stylesheet" href="ds/commise/bundle.css" />

        <script>
            (function () {
                const d = Object.getOwnPropertyDescriptor(Element.prototype, 'scrollHeight');
                Object.defineProperty(HTMLTextAreaElement.prototype, 'scrollHeight', {
                    configurable: true,
                    get() {
                        const s = this.style.height;
                        this.style.height = '0px';
                        const v = d.get.call(this);
                        this.style.height = s;
                        const cs = getComputedStyle(this);
                        return v - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
                    },
                });
            })();
        </script>
    </head>

        <x-dc

                ><style>
                    [role='radiogroup'] > div,
                    [role='group'] > div {
                        max-width: 100%;
                    }
                    body {
                        margin: 0;
                        min-height: 1000px;
                    }
                    /* A phone shows a scroll indicator only while it scrolls, so the frame and the text areas show no
                       scrollbar. A classic scrollbar would also take width from the 390 px screen and cover its right edge. */
                    * {
                        scrollbar-width: none;
                    }
                    *::-webkit-scrollbar {
                        display: none;
                    }
                    *,
