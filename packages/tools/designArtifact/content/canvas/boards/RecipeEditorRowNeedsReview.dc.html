<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Recipe editor, needs review (web)</title>
        <script src="./support.js"></script>
        <link rel="stylesheet" href="ds/commise/tokens.css" />
        <link rel="stylesheet" href="ds/commise/bundle.css" />
        <script src="ds/commise/bundle.js"></script>
    </head>
    <body>
        <x-dc
            ><helmet
                ><style>
                    body {
                        margin: 0;
                        background: var(--canvas);
                        color: var(--ink);
                        font-family: var(--font-body);
                    }
                    * {
                        box-sizing: border-box;
                    }
                    h1,
                    h2,
                    p,
                    ul,
                    dl,
                    dd {
                        margin: 0;
                    }
                    ul {
                        padding: 0;
                        list-style: none;
                    }
                    .page {
                        display: grid;
                        grid-template-columns: repeat(2, 600px);
                        column-gap: 40px;
                        row-gap: 40px;
                        padding: 32px 20px 40px;
                        align-items: start;
                    }
                    .cap {
                        margin-bottom: 8px;
                        font: 500 12px/1.4 var(--font-body);
                        color: var(--ink-muted);
                    }
                    .stage {
                        container: main / inline-size;
                        width: 600px;
                    }
                    .popw {
                        display: flex;
                        width: 320px;
                        max-width: 100%;
                        align-items: flex-start;
                        gap: 8px;
                        margin-top: 4px;
                        border-radius: 16px;
                        background: var(--paper-overlay);
                        padding: 8px 8px 8px 16px;
                        box-shadow: var(--shadow-lg);
                    }
                    .pm {
                        min-width: 0;
                        flex: 1;
                        padding-top: 8px;
                    }
                    .ph {
                        font: 600 14px/1.5 var(--font-body);
                        color: var(--ink);
                        overflow-wrap: break-word;
                    }
                    .pb {
                        margin-top: 4px;
                        padding-bottom: 8px;
                        font: 400 14px/1.5 var(--font-body);
                        color: var(--ink);
                        overflow-wrap: break-word;
                    }
                    .pc {
                        display: flex;
                        width: 44px;
                        height: 44px;
                        flex-shrink: 0;
                        align-items: center;
                        justify-content: center;
                        border: 0;
                        border-radius: 9999px;
                        background: transparent;
                        color: var(--ink-muted);
                    }
                    .dlg {
                        width: 512px;
                        max-width: 100%;
                        margin-top: 8px;
                        border-radius: 16px;
                        background: var(--paper-overlay);
                        box-shadow: var(--shadow-lg);
                    }
                    .dh {
                        display: flex;
                        align-items: flex-start;
                        gap: 8px;
                        padding: 8px 8px 0 24px;
                    }
                    .dm {
                        min-width: 0;
                        flex: 1;
                        padding-top: 12px;
                    }
                    .dt {
                        overflow: hidden;
                        text-overflow: ellipsis;
                        white-space: nowrap;
                        font: 600 17px/1.2 var(--font-body);
                        color: var(--ink);
                    }
                    .dc {
                        display: flex;
                        width: 48px;
                        height: 48px;
                        flex-shrink: 0;
                        align-items: center;
                        justify-content: center;
                        border: 0;
                        border-radius: 9999px;
                        background: transparent;
                        color: var(--ink-muted);
                    }
                    .dbody {
                        padding: 16px 24px;
                        font: 400 14px/1.5 var(--font-body);
                        color: var(--ink);
                    }
                    .menuw {
                        display: flex;
                        justify-content: flex-end;
                        margin-top: 4px;
                    }
                    .menu {
                        min-width: 192px;
                        border-radius: 20px;
                        background: var(--paper-overlay);
                        padding: 4px;
                        box-shadow: var(--shadow-lg);
                    }
                    .mi {
                        display: flex;
                        min-height: 44px;
                        align-items: center;
                        gap: 8px;
                        border-radius: 12px;
                        padding: 0 12px;
                        font: 400 16px/1.5 var(--font-body);
                        color: var(--ink);
                    }
                    .sep {
                        height: 1px;
                        margin: 4px 0;
                        background: var(--line-divider);
                    }
                    .dngc {
                        color: var(--danger-text);
                    }
                    .cb {
                        display: flex;
                        flex-direction: column;
                        align-items: flex-start;
                        gap: 8px;
                    }
                    .grp {
                        display: flex;
                        width: 100%;
                        flex-direction: column;
                    }
                    .ol {
                        width: 100%;
                        display: flex;
                        flex-direction: column;
                    }
                    .gh {
                        padding: 8px 12px 0;
                        font: 600 12px/1.4 var(--font-body);
                        color: var(--ink-muted);
                    }
                    .op {
                        display: block;
                        width: 100%;
                        border: 0;
                        border-radius: 20px;
                        background: transparent;
                        padding: 8px 12px;
                        text-align: left;
                        font: 400 14px/1.5 var(--font-body);
                        color: var(--ink);
                    }
                    .op.dim {
                        opacity: 0.6;
                    }
                    .os {
                        display: block;
                        font: 400 12px/1.4 var(--font-body);
                        color: var(--ink-muted);
                    }
                    .hint {
                        font: 400 12px/1.4 var(--font-body);
                        color: var(--ink-muted);
                    }
                    .mut {
                        color: var(--ink-muted);
                    }
                    .tx {
                        font: 400 14px/1.5 var(--font-body);
                        color: var(--ink);
                    }
                    .dng {
                        color: var(--danger-text);
                    }
                    .nb {
                    }
                    .fl {
                        display: grid;
                        grid-template-columns: auto auto;
                        justify-content: start;
                        column-gap: 16px;
                        row-gap: 2px;
                        margin-top: 4px;
                    }
                    .fr {
                        display: contents;
                    }
                    .fk {
                        color: var(--ink-muted);
                    }
                    .fv {
                        font-weight: 500;
                    }
                    .nt {
                        margin-top: 4px;
                    }
                </style></helmet
            >
            <main class="page">
                <section>
                    <p class="cap">Needs review. The attention line opens this panel.</p>
                    <div class="stage" id="stage0">
                        <ul role="list" aria-label="Ingredients">
                            <x-import
                                component-from-global-scope="Commise.IngredientRow"
                                row="{{r0}}"
                                entry-copy="{{entry}}"
                                panel="{{panel}}"
                                inline-editor="{{nothing}}"
                                expanded="{{nothing}}"
                            ></x-import>
                        </ul>
                        <div class="popw" role="dialog" aria-label="butter" style="margin-left: 280px">
                            <div class="pm">
                                <h2 class="ph">butter</h2>
                                <div class="pb">
                                    <p class="tx">
                                        This is matched to a food, but what you wrote and what we matched don’t quite
                                        agree.
                                    </p>
                                </div>
                            </div>
                            <button type="button" class="pc" aria-label="Close details for butter, salted">
                                <x-import component-from-global-scope="Commise.Icon" name="x" size="20"></x-import>
                            </button>
                        </div>
                    </div>
                </section>
                <section>
                    <p class="cap">The ⋯ menu on the same row.</p>
                    <div class="stage" id="stage1">
                        <ul role="list" aria-label="Ingredients">
                            <x-import
                                component-from-global-scope="Commise.IngredientRow"
                                row="{{r1}}"
                                entry-copy="{{entry}}"
                                panel="{{panel}}"
                                inline-editor="{{nothing}}"
                                expanded="{{nothing}}"
                            ></x-import>
                        </ul>
                        <div class="menuw">
                            <div class="menu" role="menu" aria-label="Actions for butter, salted">
                                <div role="menuitem" class="mi">Edit</div>
                                <div role="menuitem" class="mi">Change food</div>
                                <div role="menuitem" class="mi">Edit details</div>
                                <div role="separator" class="sep"></div>
                                <div role="menuitem" class="mi dngc">Remove ingredient</div>
                            </div>
                        </div>
                    </div>
                </section>
            </main></x-dc
        >
        <script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":407}}'>

    </body>
</html>
