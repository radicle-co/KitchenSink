<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>RecipeVersionsLoadingMobile</title>
        <script src="./support.js"></script>
        <link rel="stylesheet" href="ds/commise/tokens.css" />
        <link rel="stylesheet" href="ds/commise/bundle.css" />
        <script src="ds/commise/bundle.js"></script>
    </head>
    <body>
        <x-dc
            ><helmet
                ><style>
                    body {
                        margin: 0;
                    }
                    *,
                    *::before,
                    *::after {
                        box-sizing: border-box;
                    }
                    nav[data-tab-bar] {
                        display: flex !important;
                    }
                </style></helmet
            >
            <div
                style="
                    width: 390px;
                    height: 844px;
                    position: relative;
                    overflow: hidden;
                    transform: translateZ(0);
                    background: var(--canvas);
                    color: var(--ink);
                    font-family: var(--font-body);
                    display: flex;
                    flex-direction: column;
                "
            >
                <div
                    style="
                        flex: 1;
                        display: flex;
                        flex-direction: column;
                        min-height: 0;
                        padding-top: 47px;
                        padding-bottom: 98px;
                    "
                >
                    <div style="display: flex; flex-direction: column; gap: 16px; padding-bottom: 24px">
                        <x-import
                            component-from-global-scope="Commise.Native.LargeTitleHeader"
                            heading-id="vh"
                            title="Version history"
                            back="{{back}}"
                        ></x-import>
                        <div
                            role="status"
                            style="padding: 0 16px; font: 500 12px/1.4 var(--font-body); color: var(--ink-muted)"
                        >
                            Loading version history…
                        </div>
                        <div aria-hidden="true">
                            <div
                                style="
                                    display: flex;
                                    flex-direction: column;
                                    gap: 8px;
                                    padding: 12px 16px;
                                    border-bottom: 0.5px solid var(--line-divider);
                                "
                            >
                                <div
                                    style="
                                        height: 20px;
                                        width: 66%;
                                        border-radius: var(--radius-md);
                                        background: var(--surface-muted);
                                    "
                                ></div>
                                <div
                                    style="
                                        height: 16px;
                                        width: 33%;
                                        border-radius: var(--radius-md);
                                        background: var(--surface-muted);
                                    "
                                ></div>
                            </div>
                            <div
                                style="
                                    display: flex;
                                    flex-direction: column;
                                    gap: 8px;
                                    padding: 12px 16px;
                                    border-bottom: 0.5px solid var(--line-divider);
                                "
                            >
                                <div
                                    style="
                                        height: 20px;
                                        width: 66%;
                                        border-radius: var(--radius-md);
                                        background: var(--surface-muted);
                                    "
                                ></div>
                                <div
                                    style="
                                        height: 16px;
                                        width: 33%;
                                        border-radius: var(--radius-md);
                                        background: var(--surface-muted);
                                    "
                                ></div>
                            </div>
                            <div
                                style="
                                    display: flex;
                                    flex-direction: column;
                                    gap: 8px;
                                    padding: 12px 16px;
                                    border-bottom: 0.5px solid var(--line-divider);
                                "
                            >
                                <div
                                    style="
                                        height: 20px;
                                        width: 66%;
                                        border-radius: var(--radius-md);
                                        background: var(--surface-muted);
                                    "
                                ></div>
                                <div
                                    style="
                                        height: 16px;
                                        width: 33%;
                                        border-radius: var(--radius-md);
                                        background: var(--surface-muted);
                                    "
                                ></div>
                            </div>
                        </div>
                    </div>
                </div>
                <x-import
                    component-from-global-scope="Commise.Native.HomeTabBar"
                    chrome="{{chrome}}"
                    live-capabilities="{{none}}"
                    active-id="recipes"
                    on-press="{{noop}}"
                    bottom-inset="{{n34}}"
                    compact="{{no}}"
                    left-inset="{{n0}}"
                    right-inset="{{n0}}"
                ></x-import>
            </div>
        </x-dc>
        <script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
            class Component extends DCLogic { renderVals(){ const noop=()=>{}; return {noop,no:false,yes:true,none:[],n34:34,n0:0,
            back:{label:'Back to recipe',parent:"Back to recipe",onPress:noop},
            chrome:{destinations:{home:'Home',recipes:'Recipes',discover:'Discover','meal-plan':'Plan',grocery:'Shop'},profileButton:'Profile, {name}',profileButtonNoName:'Profile',tabNavLabel:'Tabs'},
            menu:[{id:'preview',label:'Preview',icon:'eye',onSelect:noop},{id:'restore',label:'Restore this version',icon:'rotateCcw',onSelect:noop},{id:'compare',label:'Compare with current',icon:'slidersHorizontal',onSelect:noop}]}; } }
        </script>
    </body>
</html>
