<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Recipes, load more (mobile)</title>
        <script src="./support.js"></script>
        <link rel="stylesheet" href="ds/commise/tokens.css" />
        <link rel="stylesheet" href="ds/commise/bundle.css" />
        <script src="ds/commise/bundle.js"></script>
    </head>
    <body>
        <x-dc
            ><helmet
                ><style>
                    body {
                        margin: 0;
                    }
                    *,
                    *::before,
                    *::after {
                        box-sizing: border-box;
                    }
                </style></helmet
            >
            <div
                style="
                    width: 390px;
                    padding: 16px 0 8px;
                    background: var(--canvas);
                    color: var(--ink);
                    font-family: var(--font-body);
                "
            >
                <figure style="margin: 0 0 28px">
                    <p
                        style="
                            margin: 0 0 8px;
                            padding: 0 16px;
                            font: 600 14px/1.4 var(--font-body);
                            color: var(--ink-muted);
                        "
                    >
                        The grid or list choice did not save: the notice sits under the search field, and the view has
                        gone back to what it was
                    </p>
                    <div
                        style="
                            width: 390px;
                            position: relative;
                            display: flex;
                            flex-direction: column;
                            gap: 16px;
                            padding: 16px;
                            background: var(--canvas);
                            border-block: 1px solid var(--line-divider);
                            overflow: hidden;
                        "
                    >
                        <x-import
                            component-from-global-scope="Commise.Native.SearchField"
                            id="recipes-search"
                            label="Search your recipes"
                            label-visibility="hidden"
                            clear-label="Clear search"
                            placeholder="Search your recipes"
                            value=""
                            on-change-text="{{noop}}"
                        ></x-import>
                        <div role="alert" style="font: 400 14px/1.4 var(--font-body); color: var(--danger-text)">
                            We couldn’t save your view. Try choosing it again.
                        </div>
                        <x-import
                            component-from-global-scope="Commise.Native.ChipRow"
                            mode="filter"
                            label="Quick filters"
                            overflow="scroll"
                            ><x-import
                                component-from-global-scope="Commise.Native.Chip"
                                kind="filter"
                                label="All"
                                selected="{{yes}}"
                                on-press="{{noop}}"
                            ></x-import
                            ><x-import
                                component-from-global-scope="Commise.Native.Chip"
                                kind="filter"
                                label="Under 30 min"
                                count="{{k1}}"
                                selected="{{no}}"
                                on-press="{{noop}}"
                            ></x-import
                            ><x-import
                                component-from-global-scope="Commise.Native.Chip"
                                kind="filter"
                                label="American"
                                count="{{k2}}"
                                selected="{{no}}"
                                on-press="{{noop}}"
                            ></x-import
                            ><x-import
                                component-from-global-scope="Commise.Native.Chip"
                                kind="filter"
                                label="French"
                                count="{{k3}}"
                                selected="{{no}}"
                                on-press="{{noop}}"
                            ></x-import
                            ><x-import
                                component-from-global-scope="Commise.Native.Chip"
                                kind="filter"
                                label="Italian"
                                count="{{k4}}"
                                selected="{{no}}"
                                on-press="{{noop}}"
                            ></x-import
                            ><x-import
                                component-from-global-scope="Commise.Native.Chip"
                                kind="filter"
                                label="Japanese"
                                count="{{k5}}"
                                selected="{{no}}"
                                on-press="{{noop}}"
                            ></x-import
                            ><x-import
                                component-from-global-scope="Commise.Native.Chip"
                                kind="filter"
                                label="Mediterranean"
                                count="{{k6}}"
                                selected="{{no}}"
                                on-press="{{noop}}"
                            ></x-import
                            ><x-import
                                component-from-global-scope="Commise.Native.Chip"
                                kind="filter"
                                label="Mexican"
                                count="{{k7}}"
                                selected="{{no}}"
                                on-press="{{noop}}"
                            ></x-import
                            ><x-import
                                component-from-global-scope="Commise.Native.Chip"
                                kind="filter"
                                label="Thai"
                                count="{{k8}}"
                                selected="{{no}}"
                                on-press="{{noop}}"
                            ></x-import
                            ><x-import
                                component-from-global-scope="Commise.Native.Chip"
                                kind="filter"
                                label="Vegan"
                                count="{{k9}}"
                                selected="{{no}}"
                                on-press="{{noop}}"
                            ></x-import
                            ><x-import
                                component-from-global-scope="Commise.Native.Chip"
                                kind="filter"
                                label="Vegetarian"
                                count="{{k10}}"
                                selected="{{no}}"
                                on-press="{{noop}}"
                            ></x-import
                        ></x-import>
                    </div>
                </figure>
                <figure style="margin: 0 0 28px">
                    <p
                        style="
                            margin: 0 0 8px;
                            padding: 0 16px;
                            font: 600 14px/1.4 var(--font-body);
                            color: var(--ink-muted);
                        "
                    >
                        More to load
                    </p>
                    <div
                        style="
                            width: 390px;
                            position: relative;
                            display: flex;
                            flex-direction: column;
                            gap: 16px;
                            padding: 16px;
                            background: var(--canvas);
                            border-block: 1px solid var(--line-divider);
                            overflow: hidden;
                        "
                    >
                        <div style="display: flex; flex-direction: column; gap: 8px">
                            <div style="display: flex; flex-direction: column">
                                <x-import
                                    component-from-global-scope="Commise.Native.RecipeCard"
                                    variant="row"
                                    heading-level="{{n2}}"
                                    recipe="{{c8.recipe}}"
                                    nutrition="{{c8.cal}}"
                                    on-select="{{noop}}"
                                ></x-import>
                            </div>
                        </div>
                        <x-import
                            component-from-global-scope="Commise.Native.LoadMoreControl"
                            has-more="{{yes}}"
                            loading="{{no}}"
                            failed="{{no}}"
                            on-load-more="{{noop}}"
                            labels="{{lmLabels}}"
                        ></x-import>
                    </div>
                </figure>
                <figure style="margin: 0 0 28px">
                    <p
                        style="
                            margin: 0 0 8px;
                            padding: 0 16px;
                            font: 600 14px/1.4 var(--font-body);
                            color: var(--ink-muted);
                        "
                    >
                        Loading the next page
                    </p>
                    <div
                        style="
                            width: 390px;
                            position: relative;
                            display: flex;
                            flex-direction: column;
                            gap: 16px;
                            padding: 16px;
                            background: var(--canvas);
                            border-block: 1px solid var(--line-divider);
                            overflow: hidden;
                        "
                    >
                        <div style="display: flex; flex-direction: column; gap: 8px">
                            <div style="display: flex; flex-direction: column">
                                <x-import
                                    component-from-global-scope="Commise.Native.RecipeCard"
                                    variant="row"
                                    heading-level="{{n2}}"
                                    recipe="{{c8.recipe}}"
                                    nutrition="{{c8.cal}}"
                                    on-select="{{noop}}"
                                ></x-import>
                            </div>
                        </div>
                        <x-import
                            component-from-global-scope="Commise.Native.LoadMoreControl"
                            has-more="{{yes}}"
                            loading="{{yes}}"
                            failed="{{no}}"
                            on-load-more="{{noop}}"
                            labels="{{lmLabels}}"
                        ></x-import>
                    </div>
                </figure>
                <figure style="margin: 0 0 28px">
                    <p
                        style="
                            margin: 0 0 8px;
                            padding: 0 16px;
                            font: 600 14px/1.4 var(--font-body);
                            color: var(--ink-muted);
                        "
                    >
                        The next page failed
                    </p>
                    <div
                        style="
                            width: 390px;
                            position: relative;
                            display: flex;
                            flex-direction: column;
                            gap: 16px;
                            padding: 16px;
                            background: var(--canvas);
                            border-block: 1px solid var(--line-divider);
                            overflow: hidden;
                        "
                    >
                        <div style="display: flex; flex-direction: column; gap: 8px">
                            <div style="display: flex; flex-direction: column">
                                <x-import
                                    component-from-global-scope="Commise.Native.RecipeCard"
                                    variant="row"
                                    heading-level="{{n2}}"
                                    recipe="{{c8.recipe}}"
                                    nutrition="{{c8.cal}}"
                                    on-select="{{noop}}"
                                ></x-import>
                            </div>
                        </div>
                        <x-import
                            component-from-global-scope="Commise.Native.LoadMoreControl"
                            has-more="{{yes}}"
                            loading="{{no}}"
                            failed="{{yes}}"
                            on-load-more="{{noop}}"
                            labels="{{lmLabels}}"
                        ></x-import>
                    </div>
                </figure>
                <p
                    style="
                        margin: 0 0 8px;
                        padding: 0 16px;
                        font: 600 14px/1.4 var(--font-body);
                        color: var(--ink-muted);
                        font-weight: 500;
                    "
                >
                    Foot of the list, shown only past the first 500 recipes. Collections says “We couldn’t load more
                    collections.” and Discover says “We couldn’t load more recipes.” in the same control.
                </p>
            </div></x-dc
        >
        <script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1198}}'>
            class Component extends DCLogic { renderVals(){ const h=React.createElement, N=window.Commise.Native; const R=[["Weeknight Chicken Cacciatore", "Italian", 55, 4, 420, "medium", 4.6, 23, "public", "published", false, 48, 500], ["Brown Butter Chocolate Chip Cookies", "American", 40, 24, 210, "easy", 4.9, 112, "public", "published", false, 168, 900], ["Miso-Glazed Salmon with Sesame Greens", "Japanese", 25, 2, 480, "easy", 4.4, 9, "private", "published", false, 3, 400], ["Slow-Roasted Pork Shoulder", "American", 390, 8, null, "hard", null, 0, "private", "draft", false, 120, 120], ["Roasted Tomato Basil Soup", "Mediterranean", 50, 6, 180, "easy", 4.2, 15, "private", "published", false, 96, 600], ["Pad Thai with Shrimp", "Thai", 35, 3, 560, "medium", 4.7, 41, "public", "published", false, 336, 700], ["Overnight Sourdough Boule", "French", 870, 10, 150, "hard", 4.8, 63, "private", "published", true, 24, 800], ["Lemon Ricotta Pancakes", "American", 25, 4, 340, "easy", 4.5, 22, "public", "published", false, 504, 900], ["Smoky Black Bean Chili", "Mexican", 75, 6, 310, "easy", 4.3, 18, "private", "published", false, 144, 500]]; const K=[null, 2, 3, 1, 1, 1, 1, 1, 1, 1, 1];
            const ago=(hrs)=>new Date(Date.now()-hrs*36e5).toISOString();
            const out={no:false,yes:true,n0:0,n2:2,n34:34,none:[],noop:()=>{},fill:{flex:1},
            chrome:{destinations:{home:'Home',recipes:'Recipes',discover:'Discover','meal-plan':'Plan',grocery:'Shop'},profileButton:'Profile, {name}',profileButtonNoName:'Profile',tabNavLabel:'Tabs'},
            action:{kind:'avatar',avatar:h(N.Avatar,{status:'ready',initials:'SR',label:'Profile, Sam Rivera',onPress:()=>{}})},
            segments:h(N.SegmentedControl,{form:'route',width:'adaptive',label:'Recipes',current:'mine',segments:[{id:'mine',label:'My recipes',href:'#recipes'},{id:'collections',label:'Collections',href:'#collections'}],onSelect:()=>{}}),
            views:[{id:'list',label:'List view',icon:'list'},{id:'grid',label:'Grid view',icon:'layoutGrid'}]};
            K.forEach((c,j)=>{out['k'+j]=c});
            R.forEach(([title,cuisine,mins,servings,cal,level,rating,count,visibility,status,pro,u,c],i)=>{const r={id:'rcp_'+i,title,totalTimeMinutes:mins,servings,difficulty:level,ratingCount:count,usesPremiumCapability:pro,createdAt:ago(c),updatedAt:ago(u),cuisine,tags:[],currentVersion:1,visibility,status}; if(rating)r.averageRating=rating; out['c'+i]={recipe:r,cal:cal?h('span',{style:{fontSize:13,color:'var(--ink-muted)'}},cal+' cal'):null};});
            out.zero=0; out.one=1; out.yes=true; out.lmLabels={loadMore:'Load more',loadingMore:'Loading more recipes',retry:'Try again',failed:'We couldn’t load more recipes.'}; return out; } }
        </script>
    </body>
</html>
