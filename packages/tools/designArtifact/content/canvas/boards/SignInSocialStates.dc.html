<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Sign in, Google and Apple (web)</title>
        <script src="./support.js"></script>
        <link rel="stylesheet" href="ds/commise/tokens.css" />
        <link rel="stylesheet" href="ds/commise/bundle.css" />
        <script src="ds/commise/bundle.js"></script>
    </head>
    <body>
        <x-dc
            ><helmet
                ><style>
                    body {
                        margin: 0;
                        font-family: var(--font-body);
                        color: var(--ink);
                        background-color: var(--canvas);
                        background-image: var(--background-image-hero);
                        min-height: 100vh;
                    }
                    *,
                    *::before,
                    *::after {
                        box-sizing: border-box;
                    }
                    a {
                        color: inherit;
                        text-decoration: none;
                    }
                    .split {
                        min-height: 844px;
                        display: grid;
                        grid-template-columns: 1fr 1fr;
                    }
                    .photo {
                        position: relative;
                    }
                    .col {
                        display: flex;
                        min-height: 844px;
                        align-items: center;
                        justify-content: center;
                        padding: 48px 24px;
                    }
                    .root {
                        width: 100%;
                        max-width: 400px;
                    }
                    .cap {
                        margin: 0;
                        font: 600 14px/1.4 var(--font-body);
                        color: var(--ink-muted);
                    }
                    .clerk {
                        display: flex;
                        flex-direction: column;
                        gap: 8px;
                        border: 2px dashed var(--line-control);
                        border-radius: var(--radius-lg);
                        padding: 32px 24px;
                        text-align: center;
                    }
                </style></helmet
            >
            <main class="split">
                <div class="photo" aria-hidden="true">
                    <img
                        src="assets/authFood.jpg"
                        alt=""
                        style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover"
                    />
                </div>
                <div class="col">
                    <div class="root" style="display: flex; flex-direction: column; gap: 16px">
                        <div class="clerk" role="note">
                            <span style="font-size: 16px; font-weight: 600; line-height: 1.4; color: var(--ink)"
                                >Clerk renders this</span
                            >
                            <span style="font-size: 14px; line-height: 1.4; color: var(--ink-muted)"
                                >The Google button, its busy state and its failures. Clerk draws them with its own
                                words, so they are not drawn here.</span
                            >
                        </div>
                        <p class="cap" style="text-align: center">Sign in, Google. The web has no Apple button.</p>
                    </div>
                </div>
            </main>
        </x-dc>
        <script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":844}}'>
            class Component extends DCLogic { renderVals(){ return { noop: function(){}, yes: true }; } }
        </script>
    </body>
</html>
