    rules_applied:
        - >
            R1 — Public API prefix is bare /v1/* (the earlier api-prefixed proposal is
            superseded and reversed): canonical recipe, collection,
            /v1/ingredients/search, /v1/search/recipes, and idempotent
            /v1/account/erasure routes. Next.js-internal framework routes stay private.
        - >
            R2 (REVISED 2026-07-07 — platform/product split) — recipe BACKEND = @kitchensink platform (@kitchensink/recipe-service|recipe-workers|recipe-service-client|recipe-core); recipe WIDGET/feature = @commise product (@commise/features-recipes + @commise/features-core) at apps/commise/features/*; packages/ui → apps/commise/ui = @commise/ui (PR #62). The earlier "everything @commise" reading was a miscommunication, corrected.
            @kitchensink/recipe-service, services/recipes-workers →
            @kitchensink/recipe-workers, clients/recipes → @kitchensink/recipe-service-client,
            shared/recipe-core → @kitchensink/recipe-core, features/recipes →
            @commise/features-recipes. The former monolithic api package and the shared
            db/config package references are replaced. Existing shipped packages keep their
            real names — the food client stays @kitchensink/food-service-client.
        - >
            R3 — Recipe service attaches to the shared ALB at priority 300 (identity=100,
            food=200); Fargate in public subnets with assignPublicIp (egress via IGW);
            version-archive-worker Lambda is VPC-attached, photo-processor is S3-only;
            per-service Clerk session-token AuthMiddleware (no API-Gateway authorizer, no
            forgeable authorizer-context header); Environment=pr-{N} tagging + per-PR logical DB.
        - >
            R5 — Ingredients back onto the source-agnostic food service (003) via
            @kitchensink/food-service-client (FoodServiceClient); foods referenced by
            internal ULID (foodId), never the external USDA food identifier, no cross-DB
            FK; resolution is asynchronous (addByName → 202 PENDING|UNRESOLVED → poll
            getById/getStatus → RESOLVED; getCandidates/resolve for disambiguation).
            Freeform FR-007a (user-entered nutrition) unchanged.
        - >
            R6 — Home widget architecture: explicit startup registration (composition
            root, .use(addFeature)); curateHomeWidgets(widgets, ctx) pure fn gating by
            capability + subscription tier; React.lazy + Suspense + ErrorBoundary render;
            ditox + @ditox/react frontend DI (appShell), NestJS decorator DI backend. US-0
            rescoped by capability gating: Home v1 ships only the recipe widget live;
            meal-plan/nutrition/shopping/AI/cooking widgets are NOT registered in v1
            (feature packages 005–009 don't exist yet — a literal import() loader for an
            unbuilt package would fail the build) so they are absent; each registers when
            its package ships and capability gating then shows it. Per-user home
            layout via PATCH /v1/profiles/me owned by identity (002), consumed by 001.
        - >
            R7 — Cross-artifact consistency propagated across
            spec/plan/data-model/contracts/tasks/v-model, and confirmed zero residual
