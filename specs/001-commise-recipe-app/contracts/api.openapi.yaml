                '423':
                    $ref: '#/components/responses/ErasureLocked'

    /v1/collections:
        post:
            tags: [Collections]
            summary: Create collection
            description: |
                Creates a collection owned by the authenticated caller. Visibility
                defaults to `private` (FR-010). REQ-049b: an owner may hold at most
                50 collections; a request past the cap is rejected with 409
                `COLLECTION_LIMIT_REACHED` before any row is written.
            operationId: createCollection
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateCollectionRequest'
            responses:
                '201':
                    description: Collection created
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Collection'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '409':
                    description: Collection limit reached (REQ-049b — max 50 collections per owner)
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                            example:
                                code: COLLECTION_LIMIT_REACHED
                                message: You already have the maximum of 50 collections.
                '423':
                    $ref: '#/components/responses/ErasureLocked'
        get:
            tags: [Collections]
            summary: List user's collections
            operationId: listCollections
            parameters:
                - $ref: '#/components/parameters/Page'
                - $ref: '#/components/parameters/PageSize'
            responses:
                '200':
                    description: Paginated collections
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/PaginatedResponse'
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  $ref: '#/components/schemas/Collection'
                '401':
                    $ref: '#/components/responses/Unauthorized'

    /v1/collections/{id}:
        get:
            tags: [Collections]
            summary: Get collection with recipes
            operationId: getCollectionById
            parameters:
                - $ref: '#/components/parameters/CollectionId'
            responses:
                '200':
                    description: Collection with recipes
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CollectionWithRecipes'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
        patch:
            tags: [Collections]
            summary: Update collection
            operationId: updateCollection
            parameters:
                - $ref: '#/components/parameters/CollectionId'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateCollectionRequest'
            responses:
                '200':
                    description: Updated collection
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Collection'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '423':
                    $ref: '#/components/responses/ErasureLocked'
        delete:
            tags: [Collections]
            summary: Delete collection
            operationId: deleteCollection
            parameters:
                - $ref: '#/components/parameters/CollectionId'
            responses:
                '204':
                    description: Collection deleted
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '423':
                    $ref: '#/components/responses/ErasureLocked'

    /v1/collections/{id}/recipes:
        post:
            tags: [Collections]
            summary: Add recipe to collection
            operationId: addRecipeToCollection
            parameters:
                - $ref: '#/components/parameters/CollectionId'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AddRecipeToCollectionRequest'
            responses:
                '201':
                    description: Recipe added to collection
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CollectionRecipeMembership'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '423':
                    $ref: '#/components/responses/ErasureLocked'

    /v1/collections/{id}/recipes/{recipeId}:
        delete:
            tags: [Collections]
            summary: Remove recipe from collection
            operationId: removeRecipeFromCollection
            parameters:
                - $ref: '#/components/parameters/CollectionId'
                - $ref: '#/components/parameters/RecipeIdForCollectionMembership'
            responses:
                '204':
                    description: Recipe removed from collection
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '423':
                    $ref: '#/components/responses/ErasureLocked'

    /v1/collections/{id}/clone:
        post:
            tags: [Collections]
            summary: Clone a collection
            description: |
                Creates a new collection owned by the caller whose `sourceCollectionId`
                points back to the original. Each membership row in the new collection
                records `addedVia=clone_seed`. The clone is independent — subsequent
                additions to the source collection are not propagated automatically;
                the owner must call `POST /v1/collections/{id}/pull-from-source`.
            operationId: cloneCollection
            parameters:
                - $ref: '#/components/parameters/CollectionId'
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CloneCollectionRequest'
            responses:
                '201':
                    description: Collection cloned
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Collection'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '423':
                    $ref: '#/components/responses/ErasureLocked'

    /v1/collections/{id}/pull-from-source/preview:
        post:
            tags: [Collections]
            summary: Preview a pull from source collection
            description: |
                For a cloned collection (`sourceCollectionId` set), computes and returns
                the three-way diff (`added` / `removed` / `unchanged`) a pull WOULD apply,
                WITHOUT mutating anything — a distinct, read-only endpoint (not a `?dryRun`
                flag on the commit) so a preview is structurally incapable of writing.
                Echo the returned diff back as `previewedDiff` on
                `POST /v1/collections/{id}/pull-from-source` to guard against drift
                between the preview and the commit.
            operationId: previewCollectionPullFromSource
            parameters:
                - $ref: '#/components/parameters/CollectionId'
            responses:
                '200':
                    description: Preview computed
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PullDiff'
                '400':
                    description: Collection has no source to pull from
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                            example:
                                code: COLLECTION_NOT_CLONED
                                message: Collection has no source to pull from
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '423':
                    $ref: '#/components/responses/ErasureLocked'

    /v1/collections/{id}/pull-from-source:
        post:
            tags: [Collections]
            summary: Pull new recipes from source collection
            description: |
                For a cloned collection (`sourceCollectionId` set), adds any recipes
                present in the source collection that are not yet present in this
                collection. New membership rows are recorded with `addedVia=pull`.
                Existing memberships are not modified; recipes removed from the
                source are NOT removed here. Returns the resulting collection.

                When the request body echoes `previewedDiff` (as returned by
                `POST .../pull-from-source/preview`), the server re-derives the diff
                live and rejects with 409 `PULL_DRIFT` if it no longer matches — so the
                caller never silently gets a different set than they confirmed.
                Omitting `previewedDiff` applies directly with no drift guard.
            operationId: pullCollectionFromSource
            parameters:
                - $ref: '#/components/parameters/CollectionId'
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PullFromSourceRequest'
            responses:
                '200':
                    description: Pull completed
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PullFromSourceResponse'
                '400':
                    description: Collection has no source to pull from
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                            example:
                                code: COLLECTION_NOT_CLONED
                                message: Collection has no source to pull from
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '409':
                    $ref: '#/components/responses/PullDrift'
                '423':
                    $ref: '#/components/responses/ErasureLocked'

    /v1/search/recipes:
        get:
            tags: [Search]
            summary: Full-text recipe search with facets
            operationId: searchRecipes
            parameters:
                - name: query
                  in: query
                  required: false
                  schema:
                      type: string
                - name: cuisine
                  in: query
                  required: false
                  schema:
                      type: string
                - name: dietaryFlags
                  in: query
                  required: false
                  description: Repeated query parameter for dietary flags
                  style: form
                  explode: true
                  schema:
                      type: array
                      items:
                          type: string
                - name: tags
                  in: query
                  required: false
                  description: Repeated query parameter for recipe tags
                  style: form
                  explode: true
                  schema:
                      type: array
                      items:
                          type: string
                - name: maxPrepTime
                  in: query
                  required: false
                  schema:
                      type: integer
                      minimum: 0
                - name: maxTotalTime
                  in: query
                  required: false
                  schema:
                      type: integer
                      minimum: 0
                - name: ingredientIds
                  in: query
                  required: false
                  description: Repeated query parameter for ingredient IDs
                  style: form
                  explode: true
                  schema:
                      type: array
                      items:
                          type: string
                          format: uuid
                - $ref: '#/components/parameters/Page'
                - $ref: '#/components/parameters/PageSize'
                - name: sortBy
                  in: query
                  required: false
                  schema:
                      type: string
                      enum: [relevance, recent, title]
                      default: relevance
            responses:
                '200':
                    description: Search results
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RecipeSearchResponse'
                '401':
                    $ref: '#/components/responses/Unauthorized'

    /v1/account/export:
        get:
            tags: [Account]
            summary: Export my account data (GDPR access + portability)
            description: |
                Returns the authenticated caller's OWN recipe-domain personal data as a
                single structured, machine-readable JSON document (GDPR Art. 15 access +
                Art. 20 portability). This is the read-only mirror of the erasure endpoint:
                it returns the same owner-scoped roots erasure removes/keeps — the user's
                recipes (ALL: public, private, drafts, AND soft-deleted/tombstoned), their
                collections + memberships, their ratings on ANY recipe, their author
                handle(s), and the METADATA (keys/URLs, never the bytes) of the photos and
                version snapshots attached to their recipes.

                The owner is taken from the verified session token and can never be
                redirected by a request parameter — a caller can only export their own data.
                Scope: recipe-domain only. A full Art. 15 export additionally composes the
                identity profile (`GET /v1/users/me`) and food-service data.
            operationId: exportAccountData
            responses:
                '200':
                    description: The caller's recipe-domain personal-data export.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AccountExport'
                '401':
                    $ref: '#/components/responses/Unauthorized'

    /v1/account/erasure:
        post:
            tags: [Account]
            summary: Request GDPR account erasure
            description: |
                Initiates the asynchronous GDPR "Erase my data" workflow for the
                authenticated account. This is the ONLY path that hard-deletes
                recipe rows, version snapshots, photos, collections, and S3-archived
                version blobs owned by the user. Soft-deleted (tombstoned) recipes
                are also purged. Returns 202 Accepted with a job identifier the
                client can use to poll status.

                Idempotent (spec C-007): a duplicate request while a job is
                `queued` or `running` returns 202 with the **existing** job id
                (no second job is enqueued). After a `completed` job the account
                is already erased and the endpoint returns 410. After a `failed`
                job a fresh retry is accepted (202 with a new job id).
            operationId: requestAccountErasure
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ErasureRequest'
            responses:
                '202':
                    description: |
                        Erasure request accepted. Returned both for a newly enqueued
                        job and, idempotently, for a duplicate request while an existing
                        job is `queued`/`running` (the existing job id is returned, no
                        second job is enqueued) or a fresh retry after a `failed` job.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErasureRequestAcceptedResponse'
                # The confirmation phrase is REQUIRED (U7): a missing, empty, or non-matching phrase
                # returns 400 before any job is enqueued (see the ErasureRequest schema).
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '410':
                    description: Account already erased (a prior erasure job completed)
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                            example:
                                code: ALREADY_ERASED
                                message: Account has already been erased

components:
    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT

    parameters:
        Page:
            name: page
            in: query
            required: false
            schema:
                type: integer
                minimum: 1
                default: 1
        PageSize:
            name: pageSize
            in: query
            required: false
            schema:
                type: integer
                minimum: 1
                maximum: 100
                default: 20
        RecipeId:
            name: id
            in: path
            required: true
            schema:
                type: string
                format: uuid
        IngredientId:
            name: id
            in: path
            required: true
            schema:
                type: string
                format: uuid
        RecipeIdForCollectionMembership:
            name: recipeId
            in: path
            required: true
            schema:
                type: string
                format: uuid
        VersionNumber:
            name: versionNumber
            in: path
            required: true
            schema:
                type: integer
                minimum: 1
        PhotoId:
            name: photoId
            in: path
            required: true
            schema:
                type: string
                format: uuid
        CollectionId:
            name: id
            in: path
            required: true
            schema:
                type: string
                format: uuid

    responses:
        BadRequest:
            description: Bad Request
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
        Unauthorized:
            description: Unauthorized
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
                    example:
                        code: UNAUTHORIZED
                        message: Unauthorized
        Forbidden:
            description: Forbidden (not owner)
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
                    example:
                        code: FORBIDDEN
                        message: Forbidden
        NotFound:
            description: Not Found
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
                    example:
                        code: NOT_FOUND
                        message: Resource not found
        VersionConflict:
            description: Version conflict
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/VersionConflictErrorResponse'
        PullDrift:
            description: Pull drifted since preview
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/PullDriftErrorResponse'
        ErasureLocked:
            description: |
                Locked (HAZ-052 write-lock). The caller's account has a queued or running GDPR
                erasure job, so mutating requests are rejected until the erasure completes or
                fails. Reads are unaffected. `POST /v1/account/erasure` itself is exempt (its own
                idempotent status machine governs repeat requests while erasure is in flight).
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
                    example:
                        code: ERASURE_IN_PROGRESS
                        message: Account erasure is in progress; mutations are temporarily locked.

    schemas:
        ErrorResponse:
            type: object
            required: [code, message]
            properties:
                code:
                    type: string
                message:
                    type: string
                details:
                    type: object
                    additionalProperties: true

        VersionConflictErrorResponse:
            type: object
            required: [code, message, details]
            properties:
                code:
                    type: string
                    example: VERSION_CONFLICT
                message:
                    type: string
                    example: Recipe version conflict
                details:
                    type: object
                    required: [currentVersion, conflictingVersion]
                    properties:
                        currentVersion:
                            type: integer
                            minimum: 1
                        conflictingVersion:
                            type: integer
                            minimum: 1

        PullDriftErrorResponse:
            type: object
            required: [code, message, details]
            properties:
                code:
                    type: string
                    example: PULL_DRIFT
                message:
                    type: string
                    example: The source changed since you previewed this pull. Review the updated changes before applying.
                details:
                    type: object
                    required: [collectionId, diff]
                    properties:
                        collectionId:
                            type: string
                            format: uuid
                        diff:
                            $ref: '#/components/schemas/PullDiff'

        PaginatedResponse:
            type: object
            required: [data, total, page, pageSize, hasMore]
            properties:
                data:
                    type: array
                    items:
                        type: object
                total:
                    type: integer
                    minimum: 0
                page:
                    type: integer
                    minimum: 1
                pageSize:
                    type: integer
                    minimum: 1
                hasMore:
                    type: boolean

        Ingredient:
            type: object
            required: [id, name, isUserEntered, createdAt, updatedAt]
            properties:
                id:
                    type: string
                    format: uuid
                    description: The 001-owned ingredient id (recipes owns the `ingredients` table).
                name:
                    type: string
                    minLength: 1
                    maxLength: 120
                normalizedName:
                    type: string
                    description: Normalized value used for fuzzy/autocomplete matching
                foodId:
                    type: string
                    nullable: true
                    description: |
                        Opaque reference to the food service's (003) internal ULID for the linked
                        food, obtained via `@kitchensink/food-service-client`. This is NOT a USDA
                        `fdcId` — 001 never stores or keys on a USDA identifier, and there is no
                        cross-DB foreign key to the food database. Null for a freeform
                        (user-entered) ingredient with no linked food record yet.
                foodResolutionStatus:
                    type: string
                    enum: [PENDING, UNRESOLVED, RESOLVED, NOT_FOUND, FAILED]
                    description: |
                        Resolution state of the linked food (mirrors the shipped food client
                        `FoodStatus`). Food data resolves asynchronously via the food service:
                        a just-added food is `PENDING` (nutrition not ready yet), `UNRESOLVED`
                        when disambiguation is required, and `RESOLVED` once the golden record
                        with nutrition is available. `NOT_FOUND` and `FAILED` are terminal
                        error states (surface an error and offer freeform fallback/removal).
                        Clients MUST tolerate a non-`RESOLVED` status and show a "nutrition
                        pending" state. Freeform (user-entered) is tracked separately via
                        `isUserEntered`, NOT as a resolution-status value.
                isUserEntered:
                    type: boolean
                    description: |
                        `true` for a freeform ingredient (FR-007a) whose nutrition the user
                        supplied directly, with no linked food record. Independent of
                        `foodResolutionStatus`.
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time

        IngredientCandidate:
            type: object
            description: |
                A single cross-source disambiguation candidate for an `UNRESOLVED` ingredient (mirrors the
                food client's `CandidateView`). Source-agnostic: keyed by the candidate's own opaque handle,
                never a USDA `fdcId`.
            required: [candidateId, source, externalKey, name]
            properties:
                candidateId:
                    type: string
                    description: The candidate row id — the handle passed back to resolve.
                source:
                    type: string
                    description: The source the candidate came from (e.g. `usda`).
                externalKey:
                    type: string
                    description: That source's opaque key for the item (NOT surfaced as a user identifier).
                name:
                    type: string
                    description: Candidate display name.
                summary:
                    type: string
                    nullable: true
                    description: One-line disambiguation hint, when present.

        ResolveIngredientRequest:
            type: object
            required: [candidateIds]
            description: The candidate id(s) the user picked to resolve an `UNRESOLVED` ingredient.
            properties:
                candidateIds:
                    type: array
                    minItems: 1
                    maxItems: 20
                    items:
                        type: string
                        minLength: 1

        RecipeNutrition:
            type: object
            required: [calories, proteinG, carbsG, fatG, isComplete]
            description: >-
                Estimated PER-SERVING nutrition (FR-007), summed from each ingredient line (user-entered
                override, else food-database per-100g scaled by mass) and divided by servings.
            properties:
                calories:
                    type: number
                    minimum: 0
                proteinG:
                    type: number
                    minimum: 0
                carbsG:
                    type: number
                    minimum: 0
                fatG:
                    type: number
                    minimum: 0
                isComplete:
                    type: boolean
                    description: >-
                        False when any line could not be fully accounted (a food still resolving, a freeform
                        line with no nutrition, or a non-mass unit with no known gram weight) — a partial estimate.

        RecipeStep:
            type: object
            required: [stepNumber, instruction]
            properties:
                stepNumber:
                    type: integer
                    minimum: 1
                instruction:
                    type: string
                    minLength: 1
                timerSeconds:
                    type: integer
                    minimum: 0

        CreateRecipeStepInput:
            type: object
            required: [instruction]
            description: |
                Input shape for a single instruction step in a create/update request.
                The server assigns `stepNumber` from array order; the client sends only
                the instruction text and an optional inline timer.
            properties:
                instruction:
                    type: string
                    minLength: 1
                timerSeconds:
                    type: integer
                    minimum: 0

        RecipeIngredient:
            type: object
            description: |
                Wire shape for a recipe ingredient line. Field names are the short
                wire aliases of the canonical domain type (`RecipeIngredient` in
                `recipe.types.ts`): wire `name` ↔ domain `ingredientName`, and wire
                `notes` ↔ domain `displayText`. `ingredientId`/`quantity`/`unit` are
                shared. Server serialization is responsible for this mapping.
            required: [ingredientId, name, quantity, isUserEntered]
            properties:
                ingredientId:
                    type: string
                    format: uuid
                name:
                    type: string
                    description: Canonical ingredient label (domain `ingredientName`).
                quantity:
                    type: number
                    exclusiveMinimum: 0
                    description: |
                        Must be strictly greater than 0 — the `recipe_ingredients` DB
                        CHECK is `quantity > 0`, so a zero quantity is rejected.
                unit:
                    type: string
                notes:
                    type: string
                    description: Free-form display override (domain `displayText`).
                isUserEntered:
                    type: boolean
                    description: >-
                        True for a freeform, user-entered line not backed by the food database
                        (drives the recipe-detail "user-entered" badge).

        RecipePhoto:
            type: object
            required: [id, recipeId, key, url, contentType, order, createdAt]
            properties:
                id:
                    type: string
                    format: uuid
                recipeId:
                    type: string
                    format: uuid
                key:
                    type: string
                    description: Object key in S3
                url:
                    type: string
                    format: uri
                    description: Fully-resolved CDN URL, rendered by clients as-is (the server resolves it).
                contentType:
                    type: string
                    example: image/jpeg
                order:
                    type: integer
                    minimum: 1
                    maximum: 10
                    description: 1-based display position within the recipe's photos.
                createdAt:
                    type: string
                    format: date-time

        RecipeSnapshot:
            type: object
            required:
                - title
                - ingredients
                - steps
                - servings
                - prepTimeMinutes
                - cookTimeMinutes
                - totalTimeMinutes
                - tags
                - dietaryFlags
            properties:
                title:
                    type: string
                description:
                    type: string
                cuisine:
                    type: string
                ingredients:
                    type: array
                    items:
                        $ref: '#/components/schemas/RecipeIngredient'
                steps:
                    type: array
                    items:
                        $ref: '#/components/schemas/RecipeStep'
                servings:
                    type: integer
                    minimum: 1
                prepTimeMinutes:
                    type: integer
                    minimum: 0
                cookTimeMinutes:
                    type: integer
                    minimum: 0
                totalTimeMinutes:
                    type: integer
                    minimum: 0
                tags:
                    type: array
                    items:
                        type: string
                dietaryFlags:
                    type: array
                    items:
                        type: string

        RecipeVersion:
            type: object
            required: [recipeId, versionNumber, snapshot, createdAt]
            properties:
                recipeId:
                    type: string
                    format: uuid
                versionNumber:
                    type: integer
                    minimum: 1
                snapshot:
                    $ref: '#/components/schemas/RecipeSnapshot'
                createdBy:
                    type: string
                    description: User ID that created the version (domain `created_by`).
                createdAt:
                    type: string
                    format: date-time
                s3Key:
                    type: string
                    nullable: true
                    description: |
                        S3 object key of the archived snapshot. Chosen over a boolean
                        `archivedToS3` flag to match the domain `RecipeVersion.s3Key?`:
                        present (non-null) once the async S3 archive has completed,
                        absent while the archive is still pending (FR-007b-i).

        Recipe:
            type: object
            description: |
                Recipe METADATA — the list/search projection (returned by `GET /v1/recipes`,
                `GET /v1/search/recipes`, and embedded in `CollectionWithRecipes`). It deliberately does
                NOT carry `ingredients`, `steps`, `photos`, or `nutrition` — those hang off
                `RecipeDetail` (the single-recipe reads) so a list never pays an N+1 to compose them. To
                still render a card image without that N+1, the list projection carries `coverPhotoUrl`
                (FR-001c). This mirrors the shipped `@kitchensink/recipe-core` `Recipe` type exactly.
            required:
                - id
                - ownerId
                - title
                - description
                - visibility
                - sourceType
                - hasSubstantiveEdit
                - hasPartialNutrition
                - servings
                - prepTimeMinutes
                - cookTimeMinutes
                - totalTimeMinutes
                - tags
                - dietaryFlags
                - currentVersion
                - ratingCount
                - usesPremiumCapability
                - createdAt
                - updatedAt
            properties:
                id:
                    type: string
                    format: uuid
                    description: |
                        The recipe's own id — a server-generated UUID (`gen_random_uuid()`). Distinct
                        from `ownerId`, which is an app-user ULID (see below).
                ownerId:
                    type: string
                    description: |
                        App-user ULID of the owner, taken from the token claim (D2). NOT a UUID and NOT
                        a cross-DB foreign key — the recipe service owns no `users` table.
                title:
                    type: string
                    minLength: 1
                    maxLength: 200
                description:
                    type: string
                    maxLength: 5000
                cuisine:
                    type: string
                    maxLength: 100
                difficulty:
                    type: string
                    enum: [easy, medium, hard]
                    description: |
                        Author-stated difficulty (FR-001b). OPTIONAL and deliberately has NO default:
                        "the author did not state a difficulty" is a real state. ABSENT when unstated —
                        clients render no badge rather than substituting a value. Descriptive only; no
                        behavior depends on it.
                averageRating:
                    type: number
                    format: float
                    minimum: 1
                    maximum: 5
                    description: |
                        Mean of this recipe's ratings (FR-013a). READ-ONLY — maintained by a database
                        trigger; never accepted from a client. Rate via `PUT /v1/recipes/{id}/rating`.

                        ABSENT exactly when `ratingCount` is 0. An unrated recipe has NO average; it is
                        never reported as 0, which would render as a real zero-star score.
                ratingCount:
                    type: integer
                    minimum: 0
                    description: |
                        Number of ratings contributing to `averageRating` (FR-013a). READ-ONLY.
                        0 when unrated, in which case `averageRating` is absent.
                usesPremiumCapability:
                    type: boolean
                    description: |
                        Whether this recipe uses a premium-only capability — the "PRO" badge (FR-003a).

                        DERIVED on projection from `visibility` + `sourceType`; there is NO backing
                        column and no entitlement lookup. Deliberately NOT equal to
                        `visibility === 'private'`: per C-004, `imported_physical` / `imported_paid`
                        recipes are private for EVERY tier (forced, not chosen), so they are not
                        premium. Clients MUST treat this as opaque and MUST NOT re-derive it — when
                        010 ships real entitlements the rule changes server-side and this field does not.
                coverPhotoUrl:
                    type: string
                    format: uri
                    description: |
                        Absolute CDN URL of the recipe's cover photo (FR-001c) — the photo with the
                        lowest sort order, resolved deterministically. Present on the LIST projection so
                        a card renders without an N+1 detail fetch. ABSENT when the recipe has no photos;
                        never a placeholder or stock image URL.

                        NOTE: photos are stored/served unprocessed with no derived variants, so this is
                        the FULL-SIZE original (up to 5 MB) even when painted into a thumbnail. See
                        FOLLOW-UP-CR-001-A in CR-001.
                visibility:
                    type: string
                    enum: [public, private]
                sourceType:
                    type: string
                    enum: [user_created, imported_public, imported_physical, imported_paid]
                    description: |
                        Provenance of the recipe (C-004). Governs the visibility rules and, together with
                        `visibility`, the derived `usesPremiumCapability`. `user_created` for every 001
                        row today; the imported_* values arrive with feature 004.
                sourceUrl:
                    type: string
                    format: uri
                    description: Original URL, present only for `imported_public` recipes.
                sourceAttribution:
                    type: string
                    description: Display attribution text carried by imported recipes.
                clonedFromId:
                    type: string
                    format: uuid
                    description: The source recipe id when this recipe was cloned (FR-005).
                hasSubstantiveEdit:
                    type: boolean
                    description: |
                        True once a clone's ingredients or instructions have been modified (FR-005 /
                        C-004) — the gate a premium user must pass before making a public-source clone
                        private.
                hasPartialNutrition:
                    type: boolean
                    description: |
                        True when any ingredient line is user-entered or its food is still resolving
                        (FR-007a / R5), so the recipe's nutrition is a partial estimate.
                servings:
                    type: integer
                    minimum: 1
                prepTimeMinutes:
                    type: integer
                    minimum: 0
                cookTimeMinutes:
                    type: integer
                    minimum: 0
                totalTimeMinutes:
                    type: integer
                    minimum: 0
                tags:
                    type: array
                    items:
                        type: string
                dietaryFlags:
                    type: array
                    items:
                        type: string
                currentVersion:
                    type: integer
                    minimum: 1
                    description: |
                        Monotonic version counter (FR-007c). The optimistic-concurrency token — a client
                        echoes it back as `expectedVersion` on update. (Renamed from `version` to match
                        the shipped `@kitchensink/recipe-core` `Recipe.currentVersion`.)
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
                deletedAt:
                    type: string
                    format: date-time
                    nullable: true
                    description: |
                        Soft-delete tombstone timestamp. When set, the recipe is excluded
                        from list, search, and detail responses. Hard removal happens only
                        via the GDPR account erasure flow.

        RecipeDetail:
            description: |
                A recipe WITH its cookable content — the `Recipe` metadata PLUS the composed
                `ingredients`, `steps`, `photos`, and per-serving `nutrition`. Returned by the
                single-recipe operations (`getRecipeById`, `createRecipe`, `updateRecipe`, `cloneRecipe`,
                `setRecipeVisibility`, `setRecipeRating`, and the `recipe` of `restoreRecipeVersion`);
                the lighter `Recipe` is what list/search return. Mirrors the shipped
                `@kitchensink/recipe-core` `RecipeDetail` (= `Recipe` extended with these fields).
            allOf:
                - $ref: '#/components/schemas/Recipe'
                - type: object
                  required: [ingredients, steps, photos, nutrition]
                  properties:
                      ingredients:
                          type: array
                          items:
                              $ref: '#/components/schemas/RecipeIngredient'
                      steps:
                          type: array
                          items:
                              $ref: '#/components/schemas/RecipeStep'
                      photos:
                          type: array
                          items:
                              $ref: '#/components/schemas/RecipePhoto'
                      nutrition:
                          $ref: '#/components/schemas/RecipeNutrition'
                      viewerRating:
                          type: integer
                          minimum: 1
                          maximum: 5
                          readOnly: true
                          description: |
                              The VIEWER's OWN rating of this recipe, 1..5 (FR-013). Per-viewer and
                              read-only — distinct from the community `averageRating`, which remains the
                              displayed score. Lets the rating control pre-select the viewer's existing
                              stars (and reveal remove-on-load) without a second request. ABSENT when the
                              viewer has not rated the recipe (and inherently absent on the viewer's own
                              recipe — an owner cannot rate their own). Detail projection ONLY; never
                              returned on the list/search `Recipe` projection.

        CreateRecipeRequest:
            type: object
            required:
                - title
                - ingredients
                - steps
                - servings
                - prepTimeMinutes
                - cookTimeMinutes
                - totalTimeMinutes
            properties:
                title:
                    type: string
                    minLength: 1
                    maxLength: 200
                description:
                    type: string
                    maxLength: 5000
                cuisine:
                    type: string
                    maxLength: 100
                difficulty:
                    type: string
                    enum: [easy, medium, hard]
                    description: |
                        Author-stated difficulty (FR-001b). Optional; omit when the author states none.
                        There is deliberately NO `default:` here — defaulting would make every recipe
                        claim its author chose that value.
                visibility:
                    type: string
                    enum: [public, private]
                    default: public
                ingredients:
                    type: array
                    minItems: 1
                    items:
                        $ref: '#/components/schemas/RecipeIngredient'
                steps:
                    type: array
                    minItems: 1
                    items:
                        $ref: '#/components/schemas/CreateRecipeStepInput'
                servings:
                    type: integer
                    minimum: 1
                prepTimeMinutes:
                    type: integer
                    minimum: 0
                cookTimeMinutes:
                    type: integer
                    minimum: 0
                totalTimeMinutes:
                    type: integer
                    minimum: 0
                tags:
                    type: array
                    items:
                        type: string
                dietaryFlags:
                    type: array
                    items:
                        type: string

        UpdateRecipeRequest:
            type: object
            required: [expectedVersion]
            properties:
                expectedVersion:
                    type: integer
                    minimum: 1
                    description: Client's expected current recipe version for optimistic locking
                title:
                    type: string
                    minLength: 1
                    maxLength: 200
                description:
                    type: string
                    maxLength: 5000
                cuisine:
                    type: string
                    maxLength: 100
                difficulty:
                    type: string
                    enum: [easy, medium, hard]
                    nullable: true
                    description: |
                        Author-stated difficulty (FR-001b). THREE distinct meanings — they are not
                        interchangeable:
                          - omitted    → leave unchanged (the standard update semantic)
                          - a value    → set it
                          - null       → CLEAR it back to "not stated"

                        The explicit null is required because FR-001b makes "no difficulty" a
                        first-class state: without a clear sentinel, omitted-means-unchanged would make
                        that state reachable only at create time, so a user who ever set a difficulty
                        could never remove it.
                ingredients:
                    type: array
                    minItems: 1
                    items:
                        $ref: '#/components/schemas/RecipeIngredient'
                steps:
                    type: array
                    minItems: 1
                    items:
                        $ref: '#/components/schemas/CreateRecipeStepInput'
                servings:
                    type: integer
                    minimum: 1
                prepTimeMinutes:
                    type: integer
                    minimum: 0
                cookTimeMinutes:
                    type: integer
                    minimum: 0
                totalTimeMinutes:
                    type: integer
                    minimum: 0
                tags:
                    type: array
                    items:
                        type: string
                dietaryFlags:
                    type: array
                    items:
                        type: string

        SetRecipeRatingRequest:
            type: object
            required: [stars]
            description: |
                Body of `PUT /v1/recipes/{id}/rating` (FR-013). The rater is taken from the bearer
                token — there is deliberately no rater field, since a client-suppliable rater id would
                let any caller rate as another user.
            properties:
                stars:
                    type: integer
                    minimum: 1
                    maximum: 5
                    description: Whole stars, 1–5 inclusive. Enforced by a DB CHECK as well as validation.

        SetRecipeVisibilityRequest:
            type: object
            required: [visibility]
            properties:
                visibility:
                    type: string
                    enum: [public, private]

        CreateIngredientRequest:
            type: object
            required: [name]
            properties:
                name:
                    type: string
                    minLength: 1
                    maxLength: 120

        AddIngredientByFoodRequest:
            type: object
            required: [foodId]
            description: |
                Body of `POST /v1/ingredients/by-food`. Deliberately carries ONLY the opaque food id — there is
                no `name` field, and one sent anyway is stripped by the validation whitelist (see that route's
                description for why a client must never label a row in the shared, ownerless catalog).
            properties:
                foodId:
                    type: string
                    minLength: 1
                    maxLength: 64
                    description: |
                        The opaque food-service internal id taken from a `catalog` suggestion. Never a
                        source-native key (no USDA `fdcId` crosses this boundary — FR-IDN-2).

        IngredientSuggestion:
            oneOf:
                - $ref: '#/components/schemas/LocalIngredientSuggestion'
                - $ref: '#/components/schemas/CatalogIngredientSuggestion'
            discriminator:
                propertyName: provenance
                mapping:
                    local: '#/components/schemas/LocalIngredientSuggestion'
                    catalog: '#/components/schemas/CatalogIngredientSuggestion'

        LocalIngredientSuggestion:
            type: object
            required: [provenance, ingredient]
            description: A real `ingredients` catalog row — pickable as-is, with whatever nutrition it carries.
            properties:
                provenance:
                    type: string
                    enum: [local]
                ingredient:
                    $ref: '#/components/schemas/Ingredient'

        CatalogIngredientSuggestion:
            type: object
            required: [provenance, foodId, name, score]
            description: |
                A food-service golden record with NO `ingredients` row yet. It has no ingredient id and no
                nutrition — admit it with `POST /v1/ingredients/by-food` before putting it on a recipe line.
            properties:
                provenance:
                    type: string
                    enum: [catalog]
                foodId:
                    type: string
                    description: The opaque food-service id to pass to `POST /v1/ingredients/by-food`.
                name:
                    type: string
                    description: The golden display name (never null/blank — unnameable hits are dropped).
                score:
                    type: number
                    description: The food catalog's relevance score (higher is better).

        IngredientCatalogAvailability:
            type: string
            enum: [ok, unavailable, disabled]
            description: |
                Whether the food catalog contributed to a blend (F2). Three states, not a boolean, because a
                client renders each differently: `unavailable` is a transient degradation worth disclosing,
                whereas `disabled` is an operator switching the blend off and MUST NOT read as an error.

        IngredientSuggestions:
            type: object
            required: [suggestions, catalogAvailability]
            description: |
                Response envelope of `GET /v1/ingredients/suggest`. `suggestions` is SECTIONED — every `local`
                entry precedes every `catalog` one, and the sections are never interleaved.
            properties:
                suggestions:
                    type: array
                    items:
                        $ref: '#/components/schemas/IngredientSuggestion'
                catalogAvailability:
                    $ref: '#/components/schemas/IngredientCatalogAvailability'

        RecipeSearchParams:
            type: object
            properties:
                query:
                    type: string
                cuisine:
                    type: string
                dietaryFlags:
                    type: array
                    items:
                        type: string
                tags:
                    type: array
                    items:
                        type: string
                maxPrepTime:
                    type: integer
                    minimum: 0
                maxTotalTime:
                    type: integer
                    minimum: 0
                ingredientIds:
                    type: array
                    items:
                        type: string
                        format: uuid
                page:
                    type: integer
                    minimum: 1
                pageSize:
                    type: integer
                    minimum: 1
                    maximum: 100
                sortBy:
                    type: string
                    enum: [relevance, recent, title]

        RecipeFacetCount:
            type: object
            required: [value, count]
            description: >-
                One facet bucket: a value and how many sampled matches carry it. An object-per-bucket (not
                a { value: count } map) so a bucket can grow metadata (label, selected, order) additively.
            properties:
                value:
                    type: string
                count:
                    type: integer
                    minimum: 0

        RecipeSearchFacetCounts:
            type: array
            items:
                $ref: '#/components/schemas/RecipeFacetCount'

        RecipeSearchFacets:
            type: object
            properties:
                dietaryFlags:
                    $ref: '#/components/schemas/RecipeSearchFacetCounts'
                tags:
                    $ref: '#/components/schemas/RecipeSearchFacetCounts'

        RecipeSearchResult:
            type: object
            required: [recipe]
            description: >-
                A single ranked hit. An object-per-hit envelope (not a bare Recipe) so future per-result
                metadata is an additive field, never a breaking reshape.
            properties:
                recipe:
                    $ref: '#/components/schemas/Recipe'
                rank:
                    type: number
                    description: Relevance score; present only for a text query (omitted in browse mode).

        RecipeSearchResponse:
            type: object
            required: [results, total, page, pageSize, hasMore, facets]
            properties:
                results:
                    type: array
                    items:
                        $ref: '#/components/schemas/RecipeSearchResult'
                total:
                    type: integer
                    minimum: 0
                page:
                    type: integer
                    minimum: 1
                pageSize:
                    type: integer
                    minimum: 1
                hasMore:
                    type: boolean
                facets:
                    $ref: '#/components/schemas/RecipeSearchFacets'

        UploadUrlResponse:
            type: object
            required: [uploadUrl, key, expiresIn, maxBytes]
            properties:
                uploadUrl:
                    type: string
                    format: uri
                key:
                    type: string
                expiresIn:
                    type: integer
                    description: Expiry in seconds
                    minimum: 1
                maxBytes:
                    type: integer
                    description: Maximum object size (bytes) the client must respect for this upload.
                    minimum: 1

        PhotoUploadUrlRequest:
            type: object
            required: [fileName, contentType, fileSize]
            properties:
                fileName:
                    type: string
                    minLength: 1
                contentType:
                    type: string
                    example: image/jpeg
                fileSize:
                    type: integer
                    minimum: 1
                    maximum: 5242880
                    description: Maximum 5MB

        PhotoConfirmRequest:
            type: object
            required: [key, contentType]
            properties:
                key:
                    type: string
                contentType:
                    type: string
                    example: image/jpeg

        ReorderPhotosRequest:
            type: object
            required: [photoIds]
            properties:
                photoIds:
                    type: array
                    minItems: 1
                    maxItems: 10
                    items:
                        type: string
                        format: uuid
                    description: Ordered list of photo IDs for final display order

        Collection:
            type: object
            required: [id, ownerId, name, visibility, createdAt, updatedAt]
            properties:
                id:
                    type: string
                    format: uuid
                ownerId:
                    type: string
                name:
                    type: string
                    minLength: 1
                    maxLength: 120
                description:
                    type: string
                    maxLength: 1000
                visibility:
                    type: string
                    enum: [public, private]
                    description: |
                        Collection visibility (FR-010). `private` collections are visible
                        only to the owner; `public` collections may be shared/discovered.
                recipeCount:
                    type: integer
                    minimum: 0
                sourceCollectionId:
                    type: string
                    format: uuid
                    nullable: true
                    description: |
                        If set, this collection was cloned from the referenced collection.
                        Used by `POST /v1/collections/{id}/pull-from-source` to add
                        recipes that were added to the source after the clone.
                sourceOwnerHandle:
                    type: string
                    description: |
                        Display handle of the source collection's owner, frozen at clone time;
                        absent when not a clone or unknown.
                sourceCollectionName:
                    type: string
                    description: |
                        Name of the source collection, frozen at clone time; absent when not
                        a clone.
                lastPulledAt:
                    type: string
                    format: date-time
                    description: |
                        ISO-8601 timestamp of the last successful pull-from-source; absent
                        until first pull.
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time

        CollectionWithRecipes:
            allOf:
                - $ref: '#/components/schemas/Collection'
                - type: object
                  properties:
                      recipes:
                          type: array
                          items:
                              $ref: '#/components/schemas/Recipe'

        CreateCollectionRequest:
            type: object
            required: [name]
            properties:
                name:
                    type: string
                    minLength: 1
                    maxLength: 120
                description:
                    type: string
                    maxLength: 1000
                visibility:
                    type: string
                    enum: [public, private]
                    default: private
                    description: Collection visibility (FR-010). Defaults to `private`.

        UpdateCollectionRequest:
            type: object
            properties:
                name:
                    type: string
                    minLength: 1
                    maxLength: 120
                description:
                    type: string
                    maxLength: 1000
                visibility:
                    type: string
                    enum: [public, private]
                    description: Collection visibility (FR-010).
            minProperties: 1

        AddRecipeToCollectionRequest:
            type: object
            required: [recipeId]
            properties:
                recipeId:
                    type: string
                    format: uuid

        CollectionRecipeMembership:
            type: object
            required: [collectionId, recipeId, addedVia, createdAt]
            properties:
                collectionId:
                    type: string
                    format: uuid
                recipeId:
                    type: string
                    format: uuid
                addedVia:
                    type: string
                    enum: [manual, clone_seed, pull]
                    description: |
                        Provenance of the membership: `manual` for direct adds,
                        `clone_seed` for memberships copied during initial collection clone,
                        `pull` for memberships added later via pull-from-source.
                createdAt:
                    type: string
                    format: date-time

        CloneCollectionRequest:
            type: object
            properties:
                name:
                    type: string
                    minLength: 1
                    maxLength: 120
                    description: Optional override for the cloned collection's name
                description:
                    type: string
                    maxLength: 1000
                    description: Optional override for the cloned collection's description

        PullFromSourceResponse:
            type: object
            required: [collection, addedRecipeIds]
            properties:
                collection:
                    $ref: '#/components/schemas/Collection'
                addedRecipeIds:
                    type: array
                    items:
                        type: string
                        format: uuid
                    description: Recipe IDs added to the collection by this pull

        PullDiff:
            type: object
            required: [added, removed, unchanged]
            description: |
                The three-way diff of `source ∪ clone`, returned by
                `POST /v1/collections/{id}/pull-from-source/preview` and echoed back
                as `previewedDiff` on the commit as the drift baseline.
            properties:
                added:
                    type: array
                    items:
                        type: string
                        format: uuid
                    description: Recipe IDs in the source but not the clone — the pull WILL add these.
                removed:
                    type: array
                    items:
                        type: string
                        format: uuid
                    description: |
                        Recipe IDs in the clone but not the source — informational; a pull
                        never removes them.
                unchanged:
                    type: array
                    items:
                        type: string
                        format: uuid
                    description: Recipe IDs in both — already present; the pull is a no-op for these.

        PullFromSourceRequest:
            type: object
            description: |
                Optional body for `POST /v1/collections/{id}/pull-from-source`. When
                `previewedDiff` is provided, it must be the diff most recently returned
                by `POST .../pull-from-source/preview`; if the live diff no longer
                matches, the pull is rejected with 409 `PULL_DRIFT` instead of silently
                applying a different set. Omitting it applies directly with no drift
                guard.
            properties:
                previewedDiff:
                    $ref: '#/components/schemas/PullDiff'

        AccountExport:
            type: object
            description: |
                The complete GDPR export document: every recipe-domain personal-data root the
                caller owns. Absent values are explicit `null` (a stable, fully-declared shape),
                and all timestamps are ISO-8601 strings.
            required:
                - exportedAt
                - ownerId
                - recipes
                - collections
                - ratings
                - photos
                - versions
                - authorHandles
            properties:
                exportedAt:
                    type: string
                    format: date-time
                    description: When this export was generated.
                ownerId:
                    type: string
                    description: The verified owner (app-user ULID) whose data this document contains.
                recipes:
                    type: array
                    items:
                        $ref: '#/components/schemas/AccountExportRecipe'
                collections:
                    type: array
                    items:
                        $ref: '#/components/schemas/AccountExportCollection'
                ratings:
                    type: array
                    items:
                        $ref: '#/components/schemas/AccountExportRating'
                photos:
                    type: array
                    items:
                        $ref: '#/components/schemas/AccountExportPhoto'
                versions:
                    type: array
                    items:
                        $ref: '#/components/schemas/AccountExportVersion'
                authorHandles:
                    type: array
                    items:
                        $ref: '#/components/schemas/AccountExportAuthorHandle'

        AccountExportRecipe:
            type: object
            description: |
                One owner-scoped recipe (the golden row), INCLUDING private, draft, and
                soft-deleted/tombstoned rows — so the export mirrors what erasure removes.
            required:
                - id
                - ownerId
                - title
                - prepTimeMinutes
                - cookTimeMinutes
                - totalTimeMinutes
                - servings
                - ratingCount
                - visibility
                - status
                - sourceType
                - hasSubstantiveEdit
                - dietaryFlags
                - tags
                - hasPartialNutrition
                - currentVersion
                - createdAt
                - updatedAt
            properties:
                id: { type: string, format: uuid }
                ownerId: { type: string }
                title: { type: string }
                description: { type: string, nullable: true }
                prepTimeMinutes: { type: integer }
                cookTimeMinutes: { type: integer }
                totalTimeMinutes: { type: integer }
                servings: { type: integer }
                difficulty: { type: string, nullable: true, enum: [easy, medium, hard, null] }
                averageRating: { type: string, nullable: true }
                ratingCount: { type: integer }
                visibility: { type: string, enum: [public, private] }
                status: { type: string, enum: [draft, published] }
                sourceType: { type: string }
                sourceUrl: { type: string, nullable: true }
                sourceAttribution: { type: string, nullable: true }
                clonedFromId: { type: string, format: uuid, nullable: true }
                hasSubstantiveEdit: { type: boolean }
                cuisine: { type: string, nullable: true }
                dietaryFlags: { type: array, items: { type: string } }
                tags: { type: array, items: { type: string } }
                hasPartialNutrition: { type: boolean }
                leadCaloriesPerServing: { type: string, nullable: true }
                authorHandle: { type: string, nullable: true }
                currentVersion: { type: integer }
                deletedAt:
                    type: string
                    format: date-time
                    nullable: true
                    description: Soft-delete tombstone, or null when active.
                createdAt: { type: string, format: date-time }
                updatedAt: { type: string, format: date-time }

        AccountExportCollection:
            type: object
            required: [id, ownerId, name, visibility, createdAt, updatedAt, recipes]
            properties:
                id: { type: string, format: uuid }
                ownerId: { type: string }
                name: { type: string }
                description: { type: string, nullable: true }
                visibility: { type: string, enum: [public, private] }
                sourceCollectionId: { type: string, format: uuid, nullable: true }
                lastPulledAt: { type: string, format: date-time, nullable: true }
                sourceOwnerHandle: { type: string, nullable: true }
                sourceCollectionName: { type: string, nullable: true }
                createdAt: { type: string, format: date-time }
                updatedAt: { type: string, format: date-time }
                recipes:
                    type: array
                    description: The recipes in this collection (its membership rows).
                    items:
                        type: object
                        required: [recipeId, addedAt, addedVia]
                        properties:
                            recipeId: { type: string, format: uuid }
                            addedAt: { type: string, format: date-time }
                            addedVia: { type: string, enum: [manual, clone_seed, pull] }

        AccountExportRating:
            type: object
            description: A rating the owner authored on ANY recipe (theirs or another user's).
            required: [id, recipeId, userId, stars, createdAt, updatedAt]
            properties:
                id: { type: string, format: uuid }
                recipeId: { type: string, format: uuid }
                userId: { type: string }
                stars: { type: integer, minimum: 1, maximum: 5 }
                createdAt: { type: string, format: date-time }
                updatedAt: { type: string, format: date-time }

        AccountExportPhoto:
            type: object
            description: Photo METADATA (keys + resolved CDN URLs). The bytes are never included.
            required: [id, recipeId, key, url, contentType, sortOrder, createdAt, updatedAt]
            properties:
                id: { type: string, format: uuid }
                recipeId: { type: string, format: uuid }
                key: { type: string, description: Full-size object key in S3. }
                url: { type: string, format: uri, description: Resolved CDN URL of the full-size object. }
                thumbnailKey: { type: string, nullable: true }
                thumbnailUrl: { type: string, format: uri, nullable: true }
                contentType: { type: string, example: image/jpeg }
                sizeBytes: { type: integer, nullable: true }
                sortOrder: { type: integer, description: 0-based stored display order. }
                createdAt: { type: string, format: date-time }
                updatedAt: { type: string, format: date-time }

        AccountExportVersion:
            type: object
            description: Version METADATA for the owner's recipes. The snapshot blob is not included.
            required: [id, recipeId, versionNumber, createdBy, createdAt]
            properties:
                id: { type: string, format: uuid }
                recipeId: { type: string, format: uuid }
                versionNumber: { type: integer, minimum: 1 }
                baseVersion: { type: integer, nullable: true }
                s3Key: { type: string, nullable: true }
                createdBy: { type: string }
                changeSummary: { type: string, nullable: true }
                deviceLabel: { type: string, nullable: true }
                editorHandle: { type: string, nullable: true }
                createdAt: { type: string, format: date-time }

        AccountExportAuthorHandle:
            type: object
            required: [userId, displayName, sourceTimestamp]
            properties:
                userId: { type: string }
                displayName: { type: string }
                sourceTimestamp: { type: string, format: date-time }

        ErasureRequest:
            type: object
            required: [confirmationPhrase]
            properties:
                confirmationPhrase:
                    type: string
                    minLength: 1
                    maxLength: 100
                    description: |
                        REQUIRED exact-match confirmation phrase ("ERASE MY DATA"). Erasure is
                        irreversible, so the server rejects a missing, empty, or non-matching phrase
                        with 400 before queuing the job (surrounding whitespace tolerated, case is not).
                publishRecipeIds:
                    type: array
                    maxItems: 1000
                    items:
                        type: string
                        format: uuid
                    description: |
                        OPTIONAL per-recipe DONATE election (CR-002). The ids of the caller's OWNER-ONLY
                        recipes (private, or public-visibility drafts) to PUBLISH — flip to public +
                        published and KEEP, attributed to a pseudonymous handle — instead of removing them.
                        An absent or empty list means "donate nothing": every owner-only recipe is removed.
                        Recipes that are already truly public (public AND published) are kept regardless of
                        this list. The server scopes the publish-flip to the caller's own recipes, so an id
                        the caller does not own is ignored. WARNING: a donated recipe becomes permanently
                        unremovable by the (erased) owner.

        ErasureRequestAcceptedResponse:
            type: object
            required: [jobId, status]
            properties:
                jobId:
                    type: string
                    format: uuid
                status:
                    type: string
                    enum: [queued, running]
                    description: |
                        Status of the returned job. `queued` for a newly enqueued job;
                        may be `running` when an in-progress job is returned idempotently
                        for a duplicate request.

        RestoreVersionResponse:
            type: object
            required: [recipe, restoredFromVersion, currentVersion]
            properties:
                recipe:
                    $ref: '#/components/schemas/RecipeDetail'
                restoredFromVersion:
                    type: integer
                    minimum: 1
                currentVersion:
                    type: integer
                    minimum: 1
