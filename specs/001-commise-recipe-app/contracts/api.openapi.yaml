openapi: 3.0.3
info:
    title: Commise Recipe Management API
    version: 1.0.0
    description: |
        OpenAPI contract for the Commise Recipe Management API.
        This specification defines the authenticated application API surface
        for recipes, ingredients, versions, photos, collections, and search.
servers:
    - url: http://localhost:3000
      description: Development
    - url: https://api.commise.app
      description: Production (placeholder)
security:
    - bearerAuth: []
tags:
    - name: Recipes
    - name: Ingredients
    - name: Versions
    - name: Photos
    - name: Ratings
    - name: Collections
    - name: Search
    - name: Account
paths:
    /v1/recipes:
        post:
            tags: [Recipes]
            summary: Create recipe
            operationId: createRecipe
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateRecipeRequest'
            responses:
                '201':
                    description: Recipe created
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RecipeDetail'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '423':
                    $ref: '#/components/responses/ErasureLocked'
        get:
            tags: [Recipes]
            summary: List user's recipes with pagination
            operationId: listRecipes
            parameters:
                - $ref: '#/components/parameters/Page'
                - $ref: '#/components/parameters/PageSize'
                - name: sortBy
                  in: query
                  required: false
                  schema:
                      type: string
                      enum: [updatedAt, createdAt, title]
                      default: updatedAt
            responses:
                '200':
                    description: Paginated recipes
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/PaginatedResponse'
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  $ref: '#/components/schemas/Recipe'
                '401':
                    $ref: '#/components/responses/Unauthorized'

    /v1/recipes/{id}:
        get:
            tags: [Recipes]
            summary: Get recipe by ID
            operationId: getRecipeById
            parameters:
                - $ref: '#/components/parameters/RecipeId'
            responses:
                '200':
                    description: Recipe
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RecipeDetail'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
        patch:
            tags: [Recipes]
            summary: Update recipe (optimistic concurrency)
            operationId: updateRecipe
            parameters:
                - $ref: '#/components/parameters/RecipeId'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateRecipeRequest'
            responses:
                '200':
                    description: Updated recipe
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RecipeDetail'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '409':
                    $ref: '#/components/responses/VersionConflict'
                '423':
                    $ref: '#/components/responses/ErasureLocked'
        delete:
            tags: [Recipes]
            summary: Soft-delete recipe (tombstone)
            description: |
                Marks the recipe as deleted by setting `deletedAt`. The row is retained
                for audit and version-restore purposes and is excluded from all list,
                search, and detail responses. Hard purge of recipe rows only happens
                via the GDPR account erasure flow (`POST /v1/account/erasure`).
            operationId: deleteRecipe
            parameters:
                - $ref: '#/components/parameters/RecipeId'
            responses:
                '204':
                    description: Recipe soft-deleted
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '423':
                    $ref: '#/components/responses/ErasureLocked'

    /v1/recipes/{id}/clone:
        post:
            tags: [Recipes]
            summary: Clone a public recipe
            operationId: cloneRecipe
            parameters:
                - $ref: '#/components/parameters/RecipeId'
            responses:
                '201':
                    description: Recipe cloned
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RecipeDetail'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '423':
                    $ref: '#/components/responses/ErasureLocked'

    /v1/recipes/{id}/visibility:
        patch:
            tags: [Recipes]
            summary: Set recipe visibility
            operationId: setRecipeVisibility
            parameters:
                - $ref: '#/components/parameters/RecipeId'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SetRecipeVisibilityRequest'
            responses:
                '200':
                    description: Visibility updated
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RecipeDetail'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '423':
                    $ref: '#/components/responses/ErasureLocked'

    /v1/recipes/{id}/rating:
        put:
            tags: [Ratings]
            summary: Set the caller's rating for a recipe (idempotent upsert)
            description: |
                Creates or replaces the AUTHENTICATED CALLER's rating of this recipe (FR-013). One
                rating per user per recipe: re-rating updates the existing row, never inserts a second,
                so repeating the same request has the same effect as sending it once.

                The rater is taken from the bearer token. There is deliberately no rater field in the
                body — a client-suppliable rater id would let any caller rate as another user.

                Authorization is READ-derived: a caller may rate any recipe they can see, and only
                such a recipe (FR-013). Note the deliberate asymmetry in the failure responses:

                - Recipe not visible to the caller (private and not theirs), or tombstoned, or
                  non-existent → **404** `RECIPE_NOT_FOUND`. These cases are INDISTINGUISHABLE by
                  design: a 403 here would confirm the recipe exists to someone not allowed to know.
                - Caller owns the recipe → **403** `CANNOT_RATE_OWN_RECIPE`. A 403 is correct here and
                  leaks nothing: the owner already knows their own recipe exists.

                `averageRating` / `ratingCount` on the returned recipe are recomputed by the database
                and are read-only everywhere (FR-013a).
            operationId: setRecipeRating
            parameters:
                - $ref: '#/components/parameters/RecipeId'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SetRecipeRatingRequest'
            responses:
                '200':
                    description: Rating saved (created or replaced); the recipe with its refreshed aggregate
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RecipeDetail'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '423':
                    $ref: '#/components/responses/ErasureLocked'
        delete:
            tags: [Ratings]
            summary: Remove the caller's rating for a recipe
            description: |
                Removes the AUTHENTICATED CALLER's rating of this recipe (FR-013) and re-derives the
                recipe's aggregate. Idempotent: removing a rating that does not exist succeeds with
                204 — DELETE asserts the absence of the rating, and that state is reached either way.

                Visibility rules match the PUT: a recipe the caller cannot see is 404, indistinguishable
                from one that does not exist.
            operationId: deleteRecipeRating
            parameters:
                - $ref: '#/components/parameters/RecipeId'
            responses:
                '204':
                    description: Rating removed, or the caller had no rating (idempotent)
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '404':
                    $ref: '#/components/responses/NotFound'
                '423':
                    $ref: '#/components/responses/ErasureLocked'

    /v1/recipes/{id}/instructions:
        get:
            tags: [Recipes]
            summary: List recipe instruction steps
            description: |
                x-deferred: feature-008. This endpoint has no 001 task and is owned by
                feature-008 (guided cooking); it is documented here for forward-compat
                but is NOT part of the 001 deliverable. Returns the ordered instruction
                steps for a recipe (the canonical instruction-list surface 008 depends
                on); steps are returned in ascending `stepNumber` order.
            x-deferred: feature-008
            operationId: listRecipeInstructions
            parameters:
                - $ref: '#/components/parameters/RecipeId'
            responses:
                '200':
                    description: Ordered instruction steps
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/RecipeStep'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'

    /v1/ingredients/search:
        get:
            tags: [Ingredients]
            summary: Search the LOCAL ingredient catalog by name (autocomplete, fuzzy)
            description: |
                A ranked fuzzy (`pg_trgm`) + full-text search over the shared recipe-service `ingredients`
                catalog ONLY. Every element is a real catalog row, so its `id` is usable directly as a
                recipe line's `ingredientId` AND as a recipe-search `ingredientIds` filter value — which is
                why this route stays local-only and is NOT blended.

                For the ingredient PICKER's typeahead use `GET /v1/ingredients/suggest`, which blends this
                catalog with the food service's golden catalog (search Stage 2).
            operationId: searchIngredients
            parameters:
                - name: q
                  in: query
                  required: true
                  description: Ingredient name query
                  schema:
                      type: string
                      minLength: 1
                - name: limit
                  in: query
                  required: false
                  schema:
                      type: integer
                      minimum: 1
                      maximum: 50
                      default: 10
            responses:
                '200':
                    description: Ingredient search results
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/Ingredient'
                '401':
                    $ref: '#/components/responses/Unauthorized'

    /v1/ingredients/suggest:
        get:
            tags: [Ingredients]
            summary: Blended ingredient typeahead — local catalog + food catalog (search Stage 2)
            description: |
                The ingredient PICKER's read. Returns a blended, deduped, provenance-SECTIONED suggestion
                set: the shared recipe-service `ingredients` catalog (rows already used in a recipe) PLUS
                the food service's golden catalog (003) — including the lab-analyzed USDA records seeded by
                the bulk importer, which are invisible to `GET /v1/ingredients/search` until somebody
                add-by-names them.

                **Shape.** `suggestions` is a DISCRIMINATED UNION on `provenance`, not a widened
                `Ingredient`, because the two kinds are not interchangeable:
                  * `local` — a real `ingredients` row (`ingredient`), pickable as-is.
                  * `catalog` — a food-service golden record with **no `ingredients` row yet**: it has NO
                    ingredient id and NO nutrition, and picking it MUST first admit it via
                    `POST /v1/ingredients/by-food`.

                **Ordering.** Every `local` suggestion precedes every `catalog` one, and the sections are
                never interleaved, so a client can render two stable labeled lists without the fast local
                list reordering when the catalog section appears or vanishes.

                **Dedup.** A food that already has an `ingredients` row appears EXACTLY ONCE, as `local`
                (deduped on the opaque `food_id`).

                **Availability (F2).** This route adds a cross-service call to a per-keystroke path, so it
                is bounded by a short timeout and DEGRADES rather than fails: a slow or unavailable food
                service still returns `200` with the local section and `catalogAvailability: 'unavailable'`.
                Treat that as "fewer suggestions, tell the user" — never as an error. `'disabled'` means an
                operator switched the blend off and MUST NOT be surfaced as an incident.

                `limit` bounds each SECTION independently (not the total), because the sections render as
                separate lists — a full local section must not squeeze the catalog section out.
            operationId: suggestIngredients
            parameters:
                - name: q
                  in: query
                  required: true
                  description: Ingredient name query
                  schema:
                      type: string
                      minLength: 1
                - name: limit
                  in: query
                  required: false
                  description: Max suggestions PER SECTION
                  schema:
                      type: integer
                      minimum: 1
                      maximum: 50
                      default: 10
            responses:
                '200':
                    description: |
                        The blended suggestions plus whether the food catalog contributed. Returned even when
                        the food catalog is unavailable (see `catalogAvailability`).
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/IngredientSuggestions'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'

    /v1/ingredients:
        post:
            tags: [Ingredients]
            summary: Create freeform ingredient
            operationId: createIngredient
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateIngredientRequest'
            responses:
                '201':
                    description: Ingredient created
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Ingredient'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '423':
                    $ref: '#/components/responses/ErasureLocked'

    /v1/ingredients/by-name:
        post:
            tags: [Ingredients]
            summary: Add an unknown food by name (async food resolution — the vertical entry point)
            description: |
                The ENTRY POINT of the async food-resolution vertical (data-model R5 / FR-007). Adds an
                unknown food by name through the source-agnostic food service (003) via its typed client
                (`foodClient.addByName`), persists a food-backed catalog row (deduped on the opaque
                `food_id`), and returns it immediately with a NON-terminal `foodResolutionStatus`
                (`PENDING` or `UNRESOLVED`).

                Returns `202 Accepted` — deliberately NOT `201`. The ingredient ROW is created
                synchronously, but the meaningful work — nutrition resolution of the linked food — is
                asynchronous and NOT complete when this returns. `202` is the caller's signal to poll
                `GET /v1/ingredients/{id}/status` (until `RESOLVED`) or to disambiguate an `UNRESOLVED`
                row via `GET /v1/ingredients/{id}/candidates` + `POST /v1/ingredients/{id}/resolve`; the
                body's `foodResolutionStatus` is authoritative. This is distinct from `POST /v1/ingredients`,
                which is the synchronous (`201`) freeform (user-entered) create with no food resolution.
            operationId: addIngredientByName
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateIngredientRequest'
            responses:
                '202':
                    description: |
                        The food-backed ingredient was created/deduped; nutrition resolution proceeds
                        asynchronously (poll its status). Its `foodResolutionStatus` is non-terminal.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Ingredient'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '423':
                    $ref: '#/components/responses/ErasureLocked'

    /v1/ingredients/by-food:
        post:
            tags: [Ingredients]
            summary: Admit a food-catalog suggestion as a food-backed ingredient (search Stage 2 pick)
            description: |
                The pick path for a `catalog` suggestion from `GET /v1/ingredients/suggest`. The server reads
                the food's golden record, creates (or dedup-returns, on the opaque `food_id`) the
                `ingredients` row, and writes its per-100g nutrition + household portions through BEFORE
                responding — so the returned ingredient already carries nutrition.

                Returns **`200 OK`, not `202`** — the deliberate contrast with `POST /v1/ingredients/by-name`.
                `by-name` is `202` because resolving an unknown food is genuinely asynchronous. Here the food
                is an already-`RESOLVED` golden record, so there is nothing to wait for and telling the caller
                to poll would be a lie. In the anomalous case where the food is unexpectedly still
                `PENDING`/`UNRESOLVED` and a row already exists, that status comes back in the body and the
                caller uses the SAME poll/disambiguate machinery — `foodResolutionStatus` stays authoritative.

                The body carries ONLY `foodId`. The display name is read from the food service and is NEVER
                client-supplied: `ingredients` is an ownerless catalog shared by every user (data-model R5), so
                a caller-chosen label would mislabel a real food's nutrition for everyone. A `name` field in
                the body is stripped by the validation whitelist.

                A food that cannot back an ingredient — unknown or terminal to the food service, still
                mid-resolution, or resolved but nameless — is a `400` (`UNKNOWN_INGREDIENT`), and NOTHING is
                written. The caller's remedy is a different action (`by-name`, or the freeform create), not a
                retry.
            operationId: addIngredientByFood
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AddIngredientByFoodRequest'
            responses:
                '200':
                    description: |
                        The food-backed ingredient, `RESOLVED` and carrying its golden-record per-100g
                        nutrition + portions (created, or deduped on its `food_id`).
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Ingredient'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '423':
                    $ref: '#/components/responses/ErasureLocked'

    /v1/ingredients/{id}/status:
        get:
            tags: [Ingredients]
            summary: Poll a food-backed ingredient's async resolution status
            description: |
                Re-reads the source-agnostic food service (003) via its typed client
                (`foodClient.getStatus`), persists the current resolution status — and, on `RESOLVED`,
                the golden-record per-100g nutrition + household portions — and returns the refreshed
                `Ingredient`. A freeform (user-entered) ingredient has no linked food and is returned
                unchanged. This is a client-driven POLL: clients refetch while the status is `PENDING`
                and stop on any terminal/resolved/unresolved state (see `Ingredient.foodResolutionStatus`).
            operationId: getIngredientStatus
            parameters:
                - $ref: '#/components/parameters/IngredientId'
            responses:
                '200':
                    description: The refreshed ingredient with its current resolution status
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Ingredient'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '404':
                    $ref: '#/components/responses/NotFound'

    /v1/ingredients/{id}/candidates:
        get:
            tags: [Ingredients]
            summary: List disambiguation candidates for an UNRESOLVED ingredient
            description: |
                The cross-source candidate set (via `foodClient.getCandidates`) the caller picks from to
                resolve an `UNRESOLVED` food-backed ingredient. Empty for a freeform or non-`UNRESOLVED`
                ingredient. Pick one (or more) and submit them to `POST /v1/ingredients/{id}/resolve`.
            operationId: getIngredientCandidates
            parameters:
                - $ref: '#/components/parameters/IngredientId'
            responses:
                '200':
                    description: The (non-expired) candidate set
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/IngredientCandidate'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '404':
                    $ref: '#/components/responses/NotFound'

    /v1/ingredients/{id}/resolve:
        post:
            tags: [Ingredients]
            summary: Resolve an UNRESOLVED ingredient from a candidate pick
            description: |
                Resolves an `UNRESOLVED` food-backed ingredient from the chosen candidate id(s) (via
                `foodClient.resolve`), then re-polls so the newly-`RESOLVED` golden-record nutrition is
                persisted. Returns `200` with the resolved `Ingredient` (an update, not a creation). A
                freeform ingredient (no linked food) is a no-op returning the ingredient unchanged.
            operationId: resolveIngredient
            parameters:
                - $ref: '#/components/parameters/IngredientId'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ResolveIngredientRequest'
            responses:
                '200':
                    description: The refreshed, resolved ingredient
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Ingredient'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '404':
                    $ref: '#/components/responses/NotFound'
                '423':
                    $ref: '#/components/responses/ErasureLocked'

    /v1/recipes/{id}/versions:
        get:
            tags: [Versions]
            summary: List recipe versions
            description: Returns the most recent versions stored in the primary database (up to 10).
            operationId: listRecipeVersions
            parameters:
                - $ref: '#/components/parameters/RecipeId'
            responses:
                '200':
                    description: Version list
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/RecipeVersion'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'

    /v1/recipes/{id}/versions/{versionNumber}:
        get:
            tags: [Versions]
            summary: Get specific version snapshot
            operationId: getRecipeVersion
            parameters:
                - $ref: '#/components/parameters/RecipeId'
                - $ref: '#/components/parameters/VersionNumber'
            responses:
                '200':
                    description: Version snapshot
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RecipeVersion'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'

    /v1/recipes/{id}/versions/{versionNumber}/restore:
        post:
            tags: [Versions]
            summary: Restore recipe to a prior version
            operationId: restoreRecipeVersion
            parameters:
                - $ref: '#/components/parameters/RecipeId'
                - $ref: '#/components/parameters/VersionNumber'
            responses:
                '200':
                    description: Recipe restored from specified version
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RestoreVersionResponse'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '409':
                    $ref: '#/components/responses/VersionConflict'
                '423':
                    $ref: '#/components/responses/ErasureLocked'

    /v1/recipes/{id}/photos/upload-url:
        post:
            tags: [Photos]
            summary: Get presigned S3 upload URL
            description: Request a temporary upload URL for direct client upload. Max file size is 5MB.
            operationId: createPhotoUploadUrl
            parameters:
                - $ref: '#/components/parameters/RecipeId'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PhotoUploadUrlRequest'
            responses:
                '200':
                    description: Upload URL created
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UploadUrlResponse'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '423':
                    $ref: '#/components/responses/ErasureLocked'

    /v1/recipes/{id}/photos/confirm:
        post:
            tags: [Photos]
            summary: Confirm photo upload completed
            description: Associates an uploaded object key with the recipe. Maximum of 10 photos per recipe.
            operationId: confirmPhotoUpload
            parameters:
                - $ref: '#/components/parameters/RecipeId'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PhotoConfirmRequest'
            responses:
                '201':
                    description: Photo confirmed and created
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RecipePhoto'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '423':
                    $ref: '#/components/responses/ErasureLocked'

    /v1/recipes/{id}/photos:
        get:
            tags: [Photos]
            summary: List photos for recipe
            operationId: listRecipePhotos
            parameters:
                - $ref: '#/components/parameters/RecipeId'
            responses:
                '200':
                    description: Photos for recipe
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/RecipePhoto'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '404':
                    $ref: '#/components/responses/NotFound'

    /v1/recipes/{id}/photos/{photoId}:
        delete:
            tags: [Photos]
            summary: Delete photo
            operationId: deleteRecipePhoto
            parameters:
                - $ref: '#/components/parameters/RecipeId'
                - $ref: '#/components/parameters/PhotoId'
            responses:
                '204':
                    description: Photo deleted
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '423':
                    $ref: '#/components/responses/ErasureLocked'

    /v1/recipes/{id}/photos/reorder:
        patch:
            tags: [Photos]
            summary: Reorder photos
            operationId: reorderRecipePhotos
            parameters:
                - $ref: '#/components/parameters/RecipeId'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ReorderPhotosRequest'
            responses:
                '200':
                    description: Reordered photos
                    content:
                        application/json:
                            schema:
                                type: array
