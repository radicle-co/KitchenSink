    items:
        - id: OD-001
          severity: blocking-green-tree
          title: SC-003's 95% draft-completeness target is unreachable against a representative corpus
          evidence: >-
              Measured 90.5% (19/21). A companion test proves extraction loses nothing the page stated — the
              draft built from real extraction has identical missingRequired to the draft built from the
              hand-verified expectation. The two shortfalls are ordinary pages (one states no durations, one
              has quantity-free lines). This is a SPECIFICATION defect, not an extraction defect.
          must_not: >-
              Do not close by narrowing the corpus or loosening requiredDraftFields/isPersistableIngredientLine
              — the latter lets a draft claim it is confirmable and then 422 on confirm.
          resolution: >-
              RULED 2026-08-07 — redefined to measure extraction FIDELITY (missing nothing the source stated),
              bar unchanged at 95%. Gate now green at 100%. spec.md, accuracy-harness.ts and its self-tests
              updated together; the stale module doc was corrected in the same change.
          status: resolved
        - id: OD-002
          severity: contract
          title: D-008 contradicts itself on Idempotency-Key for the file channel
          evidence: >-
              Its rationale names file imports as one of "the two channels where a duplicate actually costs
              money", but its normative list requires the header only on {url, instagram, photo}. As written a
              retried 1,000-recipe file upload double-imports.
          resolution: >-
              RULED 2026-08-07 — Idempotency-Key is now REQUIRED on POST /import/file. Written test-first
              (contract test RED confirmed), contract updated, redocly re-lint clean.
          status: resolved
        - id: OD-003
          severity: expensive-to-reverse
          title: Idempotency uniqueness scope is (owner_id, import_channel, idempotency_key)
          evidence: >-
              Permits the same key across two channels producing two jobs. Standard idempotency semantics
              reject a key reused with different parameters. A persisted uniqueness scope is costly to change.
          default_taken: channel-scoped, with T-013 expected to compare stored channel and raise a conflict
        - id: OD-004
          severity: privacy
          title: Account erasure does not sweep import_drafts or import_jobs
          evidence: >-
              After erasure a user's drafts survive holding extracted third-party content, source URLs and OCR
              object keys. Erasure was verified to still WORK, not to be COMPLETE.
          default_taken: none — must land with T-012 or its own task before release
        - id: OD-005
          severity: ratification
          title: Two judgment calls made by delegated agents, awaiting ratification
          evidence: >-
              (a) D-007's "bare site-wide Disallow" is implemented as a semantic class — `/`, `/*`, `/**` and
              bare `*` — so the override does not turn on spelling; `/$` and `*/` stay honoured.
              (b) IMPORT_USER_AGENT is exported from robots-policy.ts and the fetcher MUST import it rather
              than redeclare it, or the string we send diverges from the string we match and every deployed
              site-owner opt-out silently stops working.
          default_taken: both implemented as described
        - id: OD-006
          severity: stale-doc
          title: Task and V-Model documents contradict the spec and shipped code in five places
          evidence: >-
              tasks.md T-006 says file → imported_physical (spec FR-011 and provenance.policy.ts say
              user_created); T-003 says "10 codes" (there are 12); T-001 says 12 endpoints (plan §3 has 13,
              T-030 makes 14); T-015 says POST /import/file returns a singular draftId (FR-026/D-013 allow
              1,000 per file — documented as draftIds[] to avoid a breaking change);
              v-model/system-design.md:163 says a draft row is deleted on confirm, contradicting the terminal
              `confirmed` state in recipe-core.
          default_taken: followed spec.md + shipped code in every case
        - id: OD-007
          severity: gate-not-enforced
          title: stryker.conf.json does not include src/imports/**
          evidence: >-
              D-010's 90% mutation bar is therefore NOT enforced in CI for any code landed so far. Every
