# ── Raised during implementation, 2026-08-07. Each needs an owner ruling. ─────────────────────────────
open_decisions_round_2:
    OD-008:
        title: FR-009 (Instagram) cannot be satisfied by oEmbed — the blocker is not the credential
        raised_by: T-019 implementation, verified LIVE against graph.facebook.com/v26.0 (not inferred from docs)
        finding: >-
            The success body is exactly {html, provider_name, provider_url, type, version, width}. There is no
            caption, no title and no author_name — Meta removed the author/thumbnail family on 2025-11-03. The
            6.3 KB `html` is a loading skeleton whose only human-readable text is "View this post on Instagram";
            the content is injected client-side by embeds.js. Separately, an unauthenticated call now returns
            200, so D-002's "gated on an external Meta credential" premise is stale — and Meta's Limitations
            state that extracting or persisting metadata beyond a front-end view is strictly prohibited.
        consequence: >-
            Against the live provider the honest terminal outcome for EVERY post is IMPORT_NO_CAPTION (422).
            That is a specified outcome (REQ-CN-004), so nothing is broken — but REQ-005 is unreachable.
        status: >-
            Built and shipping DISABLED behind IMPORT_INSTAGRAM_ENABLED, which defaults false. The channel is
            absent from GET /import/sources and its route 404s while off, so there is no dead affordance and
            no user-visible promise. 179 unit tests + 10 integration tests green against a contract fake built
            from live captures.
        options:
            - Accept: leave the channel permanently disabled and drop FR-009 from the release claim.
            - Substitute a different caption source behind the SAME OEmbedProvider port (a new adapter, no
              other change) — requires a terms-of-service review first.
            - Drop FR-009 from the spec entirely.
        owner_ruling: PENDING
    OD-009:
        title: A free-tier caller can obtain a PRIVATE recipe by declaring an unverified paid source
        raised_by: T-029 implementation
        finding: >-
            FR-025 permits a client to declare `paid-source`; C-004 makes imported_paid private-only. So a
            free-tier caller declaring a paid source with free-text, unverified citation lands PRIVATE — the
            exact outcome HAZ-057 cites as the reason imported_physical is forbidden to clients, admitted by a
            different door.
        status: Implemented AS SPECIFIED (D-003/FR-014a/FR-025) and asserted by integration test.
        options:
            - Gate the paid-source declaration behind premium (D-014's IMPORT_REQUIRES_PREMIUM is the fit).
            - Accept it as intended product behaviour.
        owner_ruling: PENDING
    OD-010:
        title: REQ-025's "unverifiable source" state has no backing field and is unreachable in production
        raised_by: T-023 implementation
        finding: >-
            plan.md's schema delta adds only import_channel and source_url_canonical; Recipe in recipe-core has
            no unverifiable field. The UI prop exists and is fully tested, but nothing can ever set it except
            the URL-refused path.
        owner_ruling: PENDING
    OD-011:
        title: Documentation defect — evaluateVisibility's stated location is wrong in three places
        raised_by: T-029 implementation
        finding: >-
            v-model/architecture-design.md (ARCH-022), hazard-analysis.md, and imports/policy/provenance.policy.ts
            all say evaluateVisibility lives in @kitchensink/recipe-core. It lives in
            src/recipes/domain/visibilityPolicy.ts. recipe-core's recipeAccessPolicy.ts holds only the
            client-side half. REQ-015 is an Inspection requirement, so a wrong stated location matters for the
            audit trail.
        owner_ruling: PENDING (documentation fix, no code change)
    OD-012:
        title: tasks.md names backend e2e files *.e2e.spec.ts, which would never run
        raised_by: T-017 and T-019 implementations, independently
        finding: >-
            Bare *.spec.ts is reserved for Playwright; vitest.e2e.config.ts collects tests/e2e/**/*.e2e.test.ts.
            Every e2e file named per tasks.md would be silently uncollected.
        status: Implementations used .e2e.test.ts (the shipped standard). tasks.md should be corrected.
        owner_ruling: PENDING (documentation fix)
    OD-013:
        title: Contract gaps found while implementing against api.openapi.yaml
        raised_by: T-017 implementation
        finding: >-
            admin POST does not declare the 409 its concurrent-removal race produces; 429 is undeclared
            service-wide though the throttler applies; GET declares pagination the service does not implement.
        owner_ruling: PENDING
    OD-014:
        title: plan.md and tasks.md contradict the OpenAPI contract on duplicate handling — RESOLVED IN FAVOUR OF THE CONTRACT
        raised_by: T-020 (typed client) implementation; ruled on during integration 2026-08-07
        finding: >-
            plan.md §3 line 222 and tasks.md T-014 line 363 both state "a duplicate URL returns 200 with the
            existing recipe and cloneAvailable: true — 200, not an error". The contract
            (specs/001-commise-recipe-app/contracts/api.openapi.yaml, /api/v1/recipes/import/url) states the
            endpoint ALWAYS returns 202 + a job, and the duplicate surfaces on the TERMINAL JOB as
            duplicate: true + recipeId. The identifier `cloneAvailable` appears nowhere in the contract.
        ruling: >-
            The CONTRACT wins. The reason is structural, not a preference between documents: a synchronous 200
            can only detect a duplicate of the URL AS SUBMITTED, but the dedup key is the canonical form of
            where the fetch LANDS. SourceFetcherService.fetch() returns finalUrl precisely because redirects
            are routine on recipe sites (example.com/recipe -> example.com/recipes/123), and that final URL is
            unknowable until after the fetch, which happens inside the job. A synchronous check would catch
            only the easy half while the async path still needed duplicate: true — two mechanisms for one
            rule, guaranteed to drift. The typed client is also already built and green (498 unit + 18
            integration) against the 202-only shape.
        action_taken: >-
            The URL-channel implementation was directed to follow the contract. plan.md §3 and tasks.md T-014
            are WRONG and need correcting; they are left unedited pending owner acknowledgement so the
            correction is visible rather than silent.
        owner_ruling: RESOLVED (contract), documentation correction PENDING
    OD-015:
        title: UpdateImportDraftRequest.ingredients cannot represent what the draft actually holds
        raised_by: T-020 (typed client) implementation
        finding: >-
            ParsedIngredientInput requires quantity >= 0.001 and has no isGroupHeader field, but
            NormalizedDraftContent.ingredients legitimately contains group headers and quantity: null lines
            ("salt to taste"). A client that PATCHes back an edited ingredient array cannot represent either,
            so the round-trip SILENTLY DROPS them.
        consequence: Blocks T-022's draft-review editor from being correct. Needs a contract decision.
        warning: >-
            Do NOT close this by loosening isPersistableIngredientLine or requiredDraftFields — that would let
            a draft claim it is confirmable and then 422 on confirm, the exact failure the draft-and-confirm
            model exists to prevent.
        owner_ruling: PENDING
    OD-016:
        title: prod.package.json omitted 15 runtime dependencies — FIXED, and the class is now closed
        raised_by: T-015 (file channel) found `yaml`; the full audit followed during integration
        finding: >-
            Dockerfile:9 copies prod.package.json OVER package.json in the image and prod-deploy.yml:189 runs
            npm prune --omit=dev, so the container installs only what that manifest names. It omitted cheerio,
            cockatiel, sanitize-html, parse-ingredient, robots-parser, microdata-node, normalize-url,
            iso8601-duration, entities, ipaddr.js, @aws-sdk/client-textract — plus five already missing before
            004 (@aws-sdk/client-cloudfront, @aws-sdk/client-sqs, @kitchensink/identity-core, jose). That
            includes the SSRF guard's ipaddr.js and the fetcher's cockatiel: the service would crash-loop on
            deploy. Invisible to every other tier, because unit/integration/e2e/typecheck/lint all run against
            the full node_modules tree.
        action_taken: >-
            All 15 added and version ranges aligned (prod allowed @nestjs/platform-express ^11.0.0 where the
            workspace pins ^11.1.28, so the image could have installed a build CI never exercised).
            src/__tests__/prod-manifest.test.ts now DERIVES the required set from actual source imports — a
            hand-maintained list would be the same defect one level up. Type-only imports are excluded because
            they are erased; that distinction matters (express is imported only as a type and must NOT be
            declared a runtime dependency).
        owner_ruling: none needed — defect fixed, regression test added
