    verified_by_orchestrator: 'Suites re-run independently rather than trusting agent reports — identity
        23/155, nest-auth 1/13, clerk-verify 2/79, ai-workers 1/2, recipe-service 90/1096, food-service
        30/325. All match the reported numbers; no consumer regression from the shared-package changes.'

    my_own_error_caught_twice: 'I prescribed KEBAB filenames under packages/shared/* in both T006 and
        T104, copying the backend convention. packages/shared/* is the FRONTEND regime
        (packages/tools/eslint/index.js -> namingRegimeForRoot; only /packages/services/ is backend),
        machine-enforced by eslint-plugin-check-file, so those names FAIL npm run lint. Two independent
        agents hit it. Corrected 2026-08-07 to camelCase (aiGenerationRecords.ts etc., ScopesGuard.ts).'

    security_finding_prod:
        what: 'ADR-0012 states the act admission gate "lives in the shared package, so all three services
            gain it once". That is NOT what the code does. admitAzplessToken is consulted ONLY in pattern
            mode. Prod runs LIST mode, where @clerk/backend assertAuthorizedPartiesClaim returns early on
            an absent azp — so an azp-less actor-token session is ALREADY ADMITTED TODAY, ungated, by
            identity, food-service and recipe-service in production.'
        why_not_fixed: 'The behaviour is deliberately pinned by the existing R10 regression test because
            mobile native tokens depend on it. Closing it changes shipped consumer behaviour and would
            break mobile, so the agent stopped and reported rather than widening scope. CORRECT call.'
        consequence: 'isAgentActorToken is a real boundary on sandbox/per-PR stages and a NO-OP on prod
            until list-mode azp-absence is addressed as its own change. The ADR overstates the guarantee.'

