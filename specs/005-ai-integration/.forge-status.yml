    k6_t084_findings:
        ran_for_real: 'k6 v0.54.0 IS installed, so the agent went past parsing and executed the script
            four times against a local stub of the plan §3.2 contract: healthy (exit 0, p95 2.00s), jobs
            never complete (exit 107, setup aborts), every submit 400s (exit 107), and 18s generations vs
            the 15s budget (exit 99, threshold fails).'
        the_load_bearing_result: 'In the FAILING 18s run, ai_generation_submit reported p95 = 0.70 ms.
            Had the script thresholded the 202 ack instead of the full cycle, it would have passed at
            sub-millisecond while every user waited 18 seconds. The trap was DEMONSTRATED, not asserted.'
        k6_vacuous_pass_is_real: 'Measured, not assumed: a Trend threshold on a ZERO-sample metric PASSES
            (p(95) of nothing is 0 < 15000, marked ✓, exit 0) — so a run where every submit 400s is
            GREEN. A Rate threshold on zero samples also passes; only a Counter threshold fails. Thresholds
            alone therefore cannot prevent a vacuous pass. Guarded three ways: a setup() preflight running
            one real cycle, a Counter ai_generation_complete_total count>=30 (catches both zero samples and
            a p95 computed from nine points), and a completion Rate so timeouts cannot hide behind the
            survivors p95.'
        defect_found_by_running: 'k6 grows an arrival-rate VU pool LAZILY (~1 VU/s) and each iteration is
            a whole generation long, so the first sizing guard (which checked maxVUs) still dropped 5
            iterations. Now requires preAllocatedVUs to cover steady state. Static review would not have
            caught this.'
        sc003_still_not_covered: 'Passing stub runs prove the INSTRUMENT works, not that the service meets
