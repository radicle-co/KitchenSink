              script takes the spec reading (stricter, and the user''s actual clock) and records the
              enqueue RTT separately so both are recoverable — but the two docs must be reconciled.'
            - 'What is "preview-ready" on the SSE path? For the stream endpoint it is arguably FIRST
              chunk, not last — a different measurement, needing its own scenario. Not covered.'
            - 'Every p95 sample is a REAL LLM call on a real BYOK key. Defaults size ~60 generations per
              10 min with a 30-sample floor. Nobody has decided whose key CI charges, and
              provision-pool.mjs only mints Clerk users — there is NO provisioning path for BYOK keys
              across the pool. T086 must solve this before the leg can run.'
            - 'OQ-7 actor-mint round trip is covered BY CONSTRUCTION (any server-side mint falls inside
              the window) but is not ISOLATED; isolating it needs a DCR-registered agent, OAuth token and
              stored grant, for which no provisioning path exists. Deliberate gap.'
        adjacent_drift_not_fixed:
            - 'Token-mint logic is now duplicated a THIRD time in packages/tools/loadtest (journey.js,
              ratelimit.js, ai-generation.js). That is the rule-of-three extraction trigger. Left alone
              because extracting would have meant touching files outside this task.'
            - 'serviceErasure.load.js:32 comments that its open() path is "relative to the run cwd".
              That is WRONG — k6 open() resolves relative to the SCRIPT. Latent drift, untouched, worth
