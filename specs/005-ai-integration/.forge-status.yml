        release_audit:
            status: ❌ BLOCKED (correct)
            condition_1_traceability: MET — 27/27 mapped, 0 orphans (was 12 missing cells)
            condition_2_execution: FAILS — 527/527 scenarios untested; requires implementation
            condition_3_waivers: FAILS — waivers.md absent
            tooling_defect: build-audit-report.sh emitted "✅ RELEASE READY" despite 527/527 untested and no waivers.md.
                It evaluates only "no FAILED tests", which is trivially true when nothing ran. The Constitution supersedes
                the auto-generated status; an AUDIT INTEGRITY NOTICE is prepended. DO NOT re-run and accept its status without
                re-applying the correction.
        tooling_defect_matrix: 'A prior traceability-matrix.md became CORRUPT (7,717 NUL bytes, feature 004 requirement
            text interleaved with 005) after post-processing a generated file. `file` reported it as `data`, so grep silently
            matched nothing and verification passed unsoundly. Fix: regenerate from scratch, never post-process, and verify
            with Python rather than grep.'
tooling:
    v_model_extension:
        version: 0.6.0
        state: installed-and-materialized
        note: "Correction to an earlier claim in this feature's history: the extension was ALWAYS installed as a specify
            extension — its 14 commands had simply never been materialized for the `claude` integration (they existed for
            copilot under .github/prompts and for opencode under .opencode/command). A remove + `specify extension add v-model`
            cycle materialized them into .claude/skills/speckit-v-model-*. Do NOT use `--dev`: it materializes SYMLINKS
            pointing at the copilot variant via an absolute worktree path, which breaks for every other developer. The reinstall
            also strips the exec bit from 22 extension scripts and reorders the `after_tasks` hook — both were restored
            by hand.

            "
