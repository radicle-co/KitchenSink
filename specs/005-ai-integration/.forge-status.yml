reconciliation:
    v_model:
        state: complete-traceability-green
        finding: 'The V-Model artifacts do not merely use different table NAMES from plan.md — they specify a DIFFERENT
            AND WEAKER SECURITY DESIGN for BYOK. module-design.md hand-rolls AES-256-GCM and stores the ciphertext in Postgres
            (`provider_configs.encrypted_api_key`), decrypting in-process with an ambient `AES_KEY` that has no stated custody
            or rotation. plan.md §2.2 and FR-015 require the raw key to go to AWS Secrets Manager with ONLY the ARN in Postgres
            — the raw key never touches the database. Secrets Manager is mentioned in ZERO of the 22 v-model artifacts.

            '
        why_it_matters: 'unit-test.md asserts `INSERT INTO provider_configs` plus encryption, so the V-Model TEST layer
            would validate the rejected design. A green V-Model run would have "proven" the wrong architecture. A mechanical
            rename would have hidden this rather than surfacing it.

            '
        affected:
            - v-model/module-design.md
            - v-model/unit-test.md
            - v-model/system-test.md
            - v-model/acceptance-plan.md
            - v-model/peer-review.md
        required_action:
            'DONE for the authored artifacts (see completed_2026_08_02). Remaining work is the three DERIVED
            artifacts under derived_pending, which must be REGENERATED rather than hand-edited. Note that `speckit.v-model.*`
            regenerates wholesale — appropriate for the derived trio, but it would discard hand-written content and the
            peer-review history if pointed at the authored artifacts. peer-review.md is a HISTORICAL record and was deliberately
            left untouched.

            '
        completed_2026_08_02:
            - module-design.md — MOD-001 rewritten (ARN-only, no crypto); MOD-002 owns Secrets Manager I/O with validate-before-persist,
              compensating secret-delete, and DB-before-secret delete ordering; MOD-019 controller renamed; all callers +
              ARCH<->MOD map updated
            - unit-test.md — UTP-001-A/B and UTP-002-A/B rewritten; added UTS-001-A5 regression guard (fails if key material
              or a crypto call reaches the DAL); duplicate UTP-002-B renumbered to UTP-002-C
            - integration-test.md — ITP-001-A/B and ITP-002-A/B rewritten; added ITS-001-A3 (proves D-005 against the real
              composite constraint) and ITS-001-B2 (compensating delete)
            - system-test.md — STP-002 rewritten; the old assertion ("stored value must be AES-256 ciphertext") PASSED the
              rejected design and FAILED the approved one
            - architecture-design.md — ARCH-001/002 renamed and redescribed; sequence diagram + flow rows corrected
            - system-design.md — SYS-001 description and the Data Design View row corrected
            - requirements.md — REQ-001, REQ-NF-005 and the entity description aligned with spec.md
            - acceptance-plan.md — ATS-005-A5/A6 replaced (they tested crypto failure modes that no longer exist); gate +
              verification rows corrected
            - hazard-analysis.md — HAZ-001 restated as "raw key written to the app DB instead of Secrets Manager", mitigation
              now cites the executable guards
        derived_pending:
            traceability_matrix:
                REGENERATED and now COMPUTES. Matrix A 25/27 (92%) REQ->ATP, 26/26 ATP->SCN. Matrix B 8/8
                SYS->STP. Matrix C 17/17. Matrix D 20/20. Matrix H 34/34 (was 0/34). ZERO orphans in all three orphan classes.
            trace_md:
                Stale ORPHAN, not tool-maintained. Marked SUPERSEDED with a banner documenting both defects (rejected
                AES design; two hazards absent from the register). Delete-or-rebuild remains an open owner decision.
            release_audit_report: Now UNBLOCKED to regenerate — the parse miss that determined its output is fixed. Not
                yet run.
        blocking_decision:
            issue:
                The deterministic build-matrix.sh hard-codes its ID regexes; v-model-config.yml id_prefixes is NOT consulted,
                so editing config alone changes nothing.
            mismatch:
                - 'acceptance-plan.md uses AT-005-A table rows + ATS-005-A1; builder needs "#### Test Case: ATP-NNN-X (desc)"
                  + SCN-NNN-X#'
                - 'system-test.md uses "### STP-001 — Name (EP, DT)"; builder needs "#### Test Case: STP-NNN-X (desc)"'
                - integration-test.md and module-design/unit-test.md already match and parse cleanly
            options:
                - A) Restructure acceptance-plan.md + system-test.md to the builder ID scheme. Deterministic matrices go green,
                  but renumbering conflicts with the artifacts' own "Never renumbered" rule and invalidates peer-review PRF
                  citations (e.g. PRF-005-A1 cites AT-005-F).
                - B) Adapt build-matrix.sh regexes to the artifacts' scheme. No artifact churn, no ID history broken; but it
                  forks a vendored extension script and must survive extension updates.
                - C) Accept Matrices A/B as tool-blind and rely on the hand-maintained acceptance coverage, with the caveat
                  standing. Cheapest, but leaves the audit gate unable to compute real coverage.
            recommendation: B — the artifacts predate the tool and their IDs are cited across peer review; changing the
                parser is the smaller, reversible blast radius. Needs owner sign-off because it forks a vendored script.
        id_scheme_decision:
            chosen: A — restructure the artifacts to the builder ID scheme (owner decision)
            scope_correction: 'A proved larger than priced: the builder keys ATP-NNN-X -> REQ-NNN, so it needed ONE test
                case per requirement, not a rename. AT-005-B alone had covered 8 requirements.'
            acceptance_plan:
                7 AT-005-* test cases (39 ATS scenarios) -> 26 ATP test cases (52 SCN scenarios), one per requirement.
                Scenario CONTENT preserved; scenarios validating two requirements now appear under both with their own IDs,
                as the builder SCN->ATP prefix match requires.
            system_test: 24 STP renumbered from a flat 001..024 sequence to per-SYS-component keys (STP-{SYS}-{letter});
                69 STS renumbered to match. This removed 12 orphaned STPs that keyed to non-existent SYS-009..SYS-024.
            id_history_preserved:
                An old->new ID map is embedded at the top of acceptance-plan.md so prior citations stay
                resolvable — notably peer-review PRF-005-A1, which cites the duplicate AT-005-F. That duplicate is now resolved
                into distinct requirement-keyed cases.
            coverage_recovered: REQ-015 (accept/reject optimization) was genuinely covered by ATS-005-B9/B10 but listed
                on no test case, so it read as uncovered. It now has ATP-015-A.
            remaining_gaps:
                REQ-CN-001:
                    Inspection-only cross-spec dependency on 001 Recipe entities. This is peer-review PRF-005-A3,
                    still open — it argues Inspection is insufficient for a P1 cross-spec dependency.
                REQ-IF-004:
                    Web/mobile parity. Listed under the old second AT-005-F but supplied NO scenario, so it was never
                    actually covered. Parity is asserted by tasks T-076/T-077 (Playwright + Maestro).
        gaps_closed_2026_08_02:
            REQ-CN-001:
                ATP-CN-001-A added with 3 executable scenarios against the REAL recipe-service client — closes peer-review
                PRF-005-A3, which rejected Inspection-only verification for a P1 cross-spec dependency. Also mapped to SYS-003.
            REQ-IF-004:
                ATP-IF-004-A added with 4 web/mobile parity scenarios (incl. shared-component assertion for GR-010
                AC-010-c). Also mapped to SYS-008.
            PRF-005-A1: CLOSED by the ID restructure — the duplicate AT-005-F is now two distinct requirement-keyed test
