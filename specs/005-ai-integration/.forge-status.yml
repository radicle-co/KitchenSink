migration:
    db_kind: postgres
    logical_database: kitchensink_ai
    strategy: big-bang
    strategy_rationale: 'Permitted with written rationale per the migration-plan operating principles: the target
        database does not exist yet, has no rows, no readers and no writers, and ai-service is not
        deployed. Expand-migrate-contract or shadow-column over an empty database would add failure
        modes while removing no risk. The real risk here is provisioning order and rollback safety,
        not downtime.'
    destructive_changes: false
    rollback_destructive: true
    rollback_note: 'Forward is non-destructive. ROLLBACK is destructive once rows exist, and uniquely so for
        user_byok_keys: it stores only the Secrets Manager ARN, so DROP TABLE severs the only pointer
        to LIVE third-party provider credentials — billed indefinitely and absent from every
        inventory. rollback.sql therefore blocks on two mandatory manual pre-steps (export + schedule
        secret deletion with a 30-day recovery window; revoke agent grants at the authorization layer
        BEFORE the DDL).'
    backfill_required: false
    backfill_note: 'No backfill: kitchensink_ai has no pre-existing data and no column derives from another
        service at migration time. Recorded explicitly so a missing backfill.md is not read as an
        oversight.'
    files:
        plan: migrations/migration-plan.md
        forward: migrations/forward.sql
        rollback: migrations/rollback.sql
        validation: migrations/validation.sql
        risk_matrix: migrations/risk-matrix.md

wave_2_2026_08_07:
    status: complete
    commit: d3469160
    units: 'ai-db schema vertical (T005 -> T008) · PII SanitizeService (T041 -> T042) · ai-service config +
        BYOK validator (T009/T010, T013/T014) · features-ai guard surfaces (T063/T064, T065/T066,
        T069/T070, T073, T102).'
    verified_by_orchestrator: 'Suites re-run and mutations independently REPRODUCED rather than trusting
        agent reports — ai-db 24, ai-service 102 unit + 25 integration, ai-workers 64 unit + 3
        integration, features-ai 87 web + 65 native. Repo-wide turbo: 78 typecheck/lint tasks and 50 test
        tasks green. Mutations re-run by hand: partial-index dropped (1 fail), canApproveConsent made
        always-true (web 3 + native 1 fail — proving the shared pure model binds BOTH platforms),
        store-before-probe reorder (unit 3 + integration 2 fail, the integration failure being a REAL
        orphaned secret in LocalStack Secrets Manager), allergy rescue removed (1 fail).'

    the_defect_my_own_fan_out_caused: 'Two concurrent agents both owned packages/services/ai-service/tests/
        globalSetup.ts. The second Write-overwrote the first, dropping the TEST_DATABASE_URL / AI_TABLES
        exports. Because migration.integration.test.ts derives describeWithDatabase from that import, the
        undefined value silently degraded the suite to describe.skip: the tier reported "Test Files 2
        skipped / Tests 25 skipped / EXIT=0" with no import error and no red. An entire integration tier
        was dead behind a green check. Repaired additively; 25 passing confirmed.'

    silent_skip_hole_closed: 'The collision was the trigger, but the STRUCTURAL flaw outlived it: a tier
        that self-skips on a falsy env var exits 0 having run nothing, and passWithNoTests cannot catch it
        because the spec files ARE collected — they merely decline to run. assertHarnessConfiguredInCi()
        now guards BOTH ai-service and ai-workers: under CI a missing switch is a hard exit 1 naming the
        variable; locally it still skips cleanly with no Docker. Verified in all three states. Switches
        live in one HARNESS_SWITCHES list so a future dependency cannot quietly become skippable.'

    caught_at_commit_not_by_agents:
        - 'Lockfile drift — features/ai declared @testing-library/user-event but the lockfile workspace
          entry omitted it, so npm ci would have failed in CI. Refreshed (26 lines, no churn). npm audit
          confirms NONE of the 31 pre-existing advisories implicate the four new dependencies.'
        - 'test-utils/ escapes the package lint script (globs src/** only); the pre-commit oxlint hook
          caught unused params there. Fixed with the intent documented — those props are destructured
          precisely to keep them out of ...rest.'

    open_for_owner:
        byok_secret_name_is_unsafe_across_stages: "HIGH. plan.md §6 specifies byok/{userId}/{provider} with
            NO stage segment. All stages share one AWS account and, per ADR-0001, every preview signs in
            against the SHARED identity service — so the same app ULID addresses the same user everywhere,
            and a key configured on pr-{N} OVERWRITES that user's production API key. T012 must
            stage-scope the name. (The stronger claim that PR teardown would then DELETE it was checked and
            is FALSE — .github/scripts/teardown-sandbox-pr.sh does not touch Secrets Manager at all. It
            becomes true the moment anyone tags BYOK secrets for cleanup.)"
        fr_023_warnings_list_has_no_owner: 'T092-T095 build the validator and wire it into the response;
            NO task builds the UI that lists the findings. ConfidenceIndicator takes only a findingCount,
            so a user sees "3 issues" with no way to learn what they are.'
        no_task_owns_the_ai_service_db_pool: 'T010 defines the config contract; nothing creates the
            connection. Whoever writes it needs @aws-sdk/rds-signer (passwordless RDS-IAM, matching
            recipe-service) — not currently a dependency.'
        empty_scope_grant_is_representable: 'mcp_agent_grants.scopes is TEXT[] NOT NULL with no constraint.
            The UI refuses it (canApproveConsent) but the server does not. Assigned to GrantPolicy (T018/
            T019) in wave 3.'
        health_category_table_needs_review: 'The 12 condition -> dietary-category rules in
            ai-workers/src/sanitize/health-categories.ts are dietary guidance authored by an agent, not
            specified anywhere. plan §5.4 gives no table. Owner review warranted.'
        t095_is_mis_scoped: "It says it will edit ConfidenceIndicator.tsx. It should not — the props already
            encode FR-022's basis. Its real work is mapping the wire type in the orchestration layer."
        tasks_md_names_no_native_paths: 'Yet GR-010 AC-010-c requires both platforms. The .native.tsx leaves
            were built anyway (CLAUDE.md cross-platform rule); the task paths should say so.'

wave_3_2026_08_07:
    status: in_progress
    units: 'GrantPolicy (T018 -> T019, T020 -> T021) · act gate verification (T022/T023) · ActorTokenService
        (T024 -> T025) · JSON-RPC envelope + tool registry (T026 -> T027, T028 -> T029).'
    dispatch_error_i_made: 'I dispatched T022 -> T023 without checking that wave 1 had ALREADY delivered them
        (commit 1f115388). The agent correctly declined to duplicate, made zero net change to the worktree,
        and spent its budget adversarially verifying the existing gate instead — 79 tests green before and
        after, RED reproduced by gutting isAgentActorToken to return false (4 failures), and all three
        prescribed mutations killed (19 / 5 / 2 failures).'

    PROD_SECURITY_GAP_CONFIRMED: 'VERIFIED INDEPENDENTLY, and it is WORSE than previously recorded. Not
        merely "the act gate is unwired in prod" — in production the gate is STRUCTURALLY UNREACHABLE.
        Chain: (1) resolveAzpEnforcement''s list-mode branch returns only { authorizedParties } and never
        admitAzplessToken — its own JSDoc says "Ignored in list mode" three times; (2) verifyClerkToken
        guards assertAzpMatchesPattern behind `authorizedPartyPattern !== undefined`, so in list mode it is
        never called; (3) @clerk/backend assertAuthorizedPartiesClaim early-returns on falsy azp
        (node_modules/@clerk/backend/dist/index.js:2913); (4) prod IS list mode — CLERK_AZP_PATTERN is set
        only on non-prod, and identity/infra/__tests__/stacks.test.ts:132 explicitly asserts prod does NOT
        have it. CONSEQUENCE: any azp-less token our Clerk instance signed authenticates as its subject
        against identity, food and recipe in PROD with no act.sub check — including a Clerk support-staff
        IMPERSONATION session. Blast radius is bounded to instance-signed tokens (not an unauthenticated
        bypass). PRE-EXISTING; feature 005 does not widen it — the agent proved the gate strictly NARROWS
        pattern mode and is a literal no-op in list mode, so mobile/R10 are untouched.'
    prod_gap_why_it_is_not_a_quick_fix: "Closing it means changing verifyClerkToken's list-mode contract to
        stop delegating absent-azp to Clerk. That breaks R10 and mobile unless CLERK_ADMIT_NATIVE_CLIENT is
        simultaneously enabled for prod — and stacks.test.ts:141 currently asserts prod does NOT set it.
        Shared verifier + three services + infra, in one change. Owner decision required."
    adr_0012_overstates_coverage: 'Two sentences need correcting. "The gate lives in the shared package, so
        all three services gain it once" is true only in PATTERN mode. And "the act claim gives downstream
        services provenance for free ... for logs and audit" is NOT delivered: VerifiedClerkClaims has no
        act field and verifyClerkToken drops it, so no downstream service can distinguish agent traffic.
        Adding it is a cross-service contract change.'
    act_gate_is_dead_code_today: 'No consumer passes mcpActorSub — grep across packages/ returns nothing
        outside clerk-verify itself. The gate is verified but has never executed in any deployed stage.'
    clerk_verify_lint_does_not_cover_tests: 'Its lint script is eslint src/**/*.ts --ignore-pattern
        **/*.test.ts, so eslint-plugin-check-file does NOT enforce the camelCase filename rule on test
        files in this package. The name happens to be correct; the safety net assumed to be active is not.'
    clerk_verify_has_no_integration_tier: 'Unit only — no tests/ dir, no *.integration.test.ts, no config.
        CLAUDE.md requires unit AND integration for non-UI library code. Real proof needs a service-level
        test booting an auth guard against a genuinely Clerk-signed actor token.'

