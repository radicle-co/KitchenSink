gate_2026_08_09_implement:
    phase: implement
    decision: revised
    risk: high
    risk_source: >-
        heuristic — scripts/gate-risk.js is still broken (CJS `require` under the repo's "type": "module",
        the defect already recorded for this feature). Classified HIGH on: auth/secret boundaries, a prod
        DataStack template change, a two-major Clerk bump across three shipped services, and live
        Vercel/Secrets Manager mutations.
    owner_answer: 'Fix the three critical gaps and get it working end-to-end.'
    open_criticals:
        - id: F-101
          title: No transport carries the generated draft from ai-workers to the user
          status: CLOSED 2026-08-09
          closed_note: >-
              generated_draft jsonb on ai_generation_records (migration 0002 + its own validation gate),
              written by the worker on completion, owner-scoped on read, cleared on save/discard, findings
              DERIVED on read so staleness is unrepresentable. Verified: cross-tenant draft read kills 7
              tests. NOT built: plan §3.2's token-level partial objects — the terminal draft only, stated
              plainly rather than synthesised from a completed row.
          decision: >-
              Draft is persisted as a JSONB column on ai_generation_records, written by the worker on
              completion and cleared when the user saves or discards. Chosen over S3 (adds a datastore and
              lifecycle for a bounded ~5-20KB recipe document) and over stream-only (which breaks reload
              and regenerate). plan §5.4 keeps PROMPT content out of this database; the draft is OUTPUT the
              user is about to save, so it is a different privacy question and gets bounded retention.
        - id: F-102
          title: recipe-service has no M2M verification half
          status: CLOSED 2026-08-09
          closed_note: >-
              AuthMiddleware dispatches on Clerk's own isMachineToken; the acting user comes ONLY from the
              signed commise_acting_user_id claim. Verified: honouring a request header instead kills 7
              tests. recipe-service 1096 -> 1141 unit, 188 -> 204 integration, 54 -> 57 e2e, zero existing
              assertions changed. An e2e over real HTTP proves an agent-created recipe is visible to the
              user's OWN browser session — same principal, two credential shapes.
        - id: F-103
          title: prod DataStack template gains 7 additive resources for the kitchensink_ai bootstrap
          status: withdrawn-not-a-finding
          note: >-
              WITHDRAWN 2026-08-09 — this should never have been raised. `AiDbBootstrap` is the same
              master-connected custom resource as `FoodDbBootstrap` and `RecipeDbBootstrap`, in the same
              stack, documented beside them in DataStack.ts (lines 54/61/68). Both peers changed prod's
              DataStack template when they landed. It is the ESTABLISHED PATTERN, not an exception.

              The error was mine and worth recording so it is not repeated: CLAUDE.md's "prod's
              synthesized template is unchanged" is scoped to ADR-0008's COST LEVERS (gp3 vs gp2, Spot vs
              on-demand) and its actual instruction is "don't flip prod to gp3/Spot without its own PR +
              no-diff proof". I lifted that sentence out of its context into a general rule and asked the
              owner to approve conforming to precedent. Adding a service's DB bootstrap to DataStack needs
              no special sign-off; deviating from that pattern would.

