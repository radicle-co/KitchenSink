            PRF-005-A4:
                CLOSED — UTS-008-A3 (state TTL expiry, distinguishable from tampering) and UTS-008-A4 (concurrent
                flows do not collide) added, plus acceptance scenario SCN-IF-001-A4.
            spec_FR-018: "Reworded: consent surface and grant store are ours, not the IdP's. Intent unchanged; mechanism
