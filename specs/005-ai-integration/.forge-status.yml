reconciliation:
    v_model:
        state: complete-traceability-green
        finding: 'The V-Model artifacts do not merely use different table NAMES from plan.md — they specify a DIFFERENT
            AND WEAKER SECURITY DESIGN for BYOK. module-design.md hand-rolls AES-256-GCM and stores the ciphertext in Postgres
            (`provider_configs.encrypted_api_key`), decrypting in-process with an ambient `AES_KEY` that has no stated custody
            or rotation. plan.md §2.2 and FR-015 require the raw key to go to AWS Secrets Manager with ONLY the ARN in Postgres
            — the raw key never touches the database. Secrets Manager is mentioned in ZERO of the 22 v-model artifacts.

            '
        why_it_matters: 'unit-test.md asserts `INSERT INTO provider_configs` plus encryption, so the V-Model TEST layer
            would validate the rejected design. A green V-Model run would have "proven" the wrong architecture. A mechanical
            rename would have hidden this rather than surfacing it.

