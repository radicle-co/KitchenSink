tooling_defects:
    - id: FORGE-ESM-CJS
      severity: repo-wide
      found: 2026-08-02
      detail: >-
          Every bundled Product Forge script (gate-risk.js, validate-traceability.js,
          lint-docs.js) is CommonJS, but the repo root package.json sets "type": "module",
          so Node treats them as ESM and they die with "require is not defined in ES module
          scope". This broke the gate classifier and the traceability validator for EVERY
          feature, not just 006.
      fix: 'Added .specify/extensions/product-forge/scripts/package.json with {"type":"commonjs"}. Both scripts now run natively.'
      status: fixed
    - id: VMODEL-PACK-ABSENT
      severity: was-blocking
      found: 2026-08-02
      detail: >-
          feature_mode: v-model with the V-Model Extension Pack not installed. forge Mode
          Resolution step 5 requires an abort in that state ("do NOT fall back to standard;
          regulated work must not silently degrade"). Proceeded to Phase 6 under an
          owner-authorised deviation.
      fix: 'Pack installed — v-model 0.6.0 detected in .specify/extensions/.registry. Detection now passes.'
      status: resolved
    - id: FORGE-RISK-PREIMPL
      severity: advisory
      detail: >-
          gate-risk.js derives task_count from task_log[] (tasks ALREADY implemented), not
          from tasks.md. Before implementation it therefore reports task_count 0 and
          routes `auto-recommend` regardless of feature size — for 006 that is 72 planned
          tasks across four new packages. Treat pre-implementation gates as require-human
          irrespective of the script's routing.
      status: open-upstream

