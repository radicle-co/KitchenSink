                    UTS-020-D2 passes by design — it is the structural invariant that MOD-020 imports no
                    timer module (spec.md D-002). The invariant holds today, so the test is a regression
                    guard, not coverage theatre.
            note: >-
                Three assertions initially passed against the stubs because a bare `.toThrow()` matches
                the stub's generic Error. They were tightened to assert the specific custom error type
                (UnknownIngredientError / InvalidQuantityError) and are now correctly failing — a test
                that passes against an unimplemented stub proves nothing.

