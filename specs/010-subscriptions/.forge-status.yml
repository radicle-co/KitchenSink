# Open blockers found during the 2026-08-07 pre-flight, verified against shipped `main`.
blockers:
    - id: B-001
      severity: critical
      summary: >-
          FR-044 (subscription tier as a signed Clerk token claim) was added to spec.md on
          2026-08-02 as DRAFT and exists ONLY there. No coverage in plan.md, tasks.md,
          v-model/requirements.md (REQ-001..031), traceability-matrix.md, acceptance-plan.md,
          or any test plan. Both sync-report.md (PASS) and verify-report.md (PARTIAL) predate
          it and check only FR-040..FR-043, so their verdicts are stale, not clean.
      decision: >-
          Owner ruling 2026-08-07 — implement FR-044 as a DISTINCT `subscription_tier` claim in
          public_metadata, taught to @kitchensink/clerk-verify. The shipped interim carrier
          `permissions: ['premium']` MUST be retired in the same change, not left alongside it
          as a second source of truth for one fact.
    - id: B-002
      severity: critical
      summary: >-
          plan.md §2 specifies the data model with TypeORM `@Column({...})` decorators; this
          repo uses Drizzle ORM. It also adds a `plan: 'free'|'premium'` column when
          `accounts.subscription_tier` (AccountTier, with an updateSubscriptionTier DAO method)
          already ships. tasks.md T-002 correctly says Drizzle + subscriptionTier, so plan and
          tasks disagree on the data model — and sync-report.md L3 recorded PASS.
    - id: B-003
      severity: critical
      summary: >-
          plan.md §4 applies one in-process PlanGuard, reading `user.plan`/`user.subscriptionStatus`
          off the request, to 9 endpoints that live across recipe-service, ai, meal-plans,
          grocery-lists and nutrition — separately deployed services that never see identity's
          database. This is the exact gap FR-044 exists to close, and the plan predates it.
          plan.md §5 also still references `jwt-auth.guard.ts`, which never existed.
    - id: B-004
      severity: warning
      summary: >-
          Cross-feature burndown IN-003 requires @RequirePremium() + PlanGuard to be extracted to
          packages/shared/subscription/ early in 010 so 005/006/009 can import them. Neither
          plan.md nor tasks.md mentions a shared package.
    - id: B-005
      severity: warning
      summary: >-
          The bundled Product Forge helper scripts cannot execute in this repo: the root
          package.json declares "type": "module" and the scripts are CommonJS `.js`. Every
          `node ${PLUGIN_ROOT}/scripts/*.js` invocation throws before running, so the
          deterministic gate-risk and traceability pre-gates silently degrade to the LLM path
          (runtime.md §1A). Worked around during pre-flight via a scratchpad copy carrying a
          `{"type":"commonjs"}` marker.

