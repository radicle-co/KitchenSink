# Product Forge Lifecycle Status
# Feature: 010-subscriptions
#
# Migrated from the pre-v3 legacy shape on 2026-08-07 (docs/schema.md §2 lazy migration).
# The legacy file used `state:` instead of `status:`, kebab-case phase keys, and
# `mode: retroactive-bootstrap` — none of which are v3 vocabulary, so every reader
# (including scripts/gate-risk.js and scripts/validate-traceability.js) parsed it as
# empty and reported a vacuous `risk: low, task_count: 0`.
#
# Preserved history the v3 shape has no field for:
#   - `mode: retroactive-bootstrap` — the 2026-05-09 bootstrap that derived research/
#     and product-spec/ from the pre-existing spec.md/plan.md/tasks.md corpus. This is
#     NOT `backfilled` (that means reverse-engineered from shipped code; no code exists).
#   - `pilot: true` — this feature was the pilot for that bootstrap operation.
#
# Two legacy status values have no v3 equivalent and were mapped conservatively:
#   - verify: `failed`  -> `pending` (it ran and produced a report, but never passed a
#     gate; `completed_with_known_issues` would falsely imply acceptance).
#   - release-readiness: `blocked` -> `pending` (blocker recorded in blockers[] below).

